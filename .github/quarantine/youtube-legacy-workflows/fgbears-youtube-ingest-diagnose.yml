name: Diagnose FGBears YouTube Ingest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-youtube-ingest-diagnose.yml'

permissions:
  contents: write

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - id: diagnose
        name: Check live YouTube and X sockets by owning process
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' > /tmp/youtube-ingest.env <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/fgbears-live/stream.env
          service_active=false
          youtube_relay_active=false
          ffmpeg_active=false
          youtube_configured=false
          youtube_socket_established=false
          x_enabled=false
          x_socket_established=false
          local_relay_handoff=false
          youtube_primary_failure_recent=false
          ffmpeg_socket_count=0
          primary_external_443_count=0
          relay_external_443_count=0
          failure_class=none

          systemctl is-active --quiet fgbears-live.service && service_active=true || true
          systemctl is-active --quiet fgbears-youtube-relay.service && youtube_relay_active=true || true
          service_result=$(systemctl show fgbears-live.service -p Result --value 2>/dev/null || true)
          service_exec_status=$(systemctl show fgbears-live.service -p ExecMainStatus --value 2>/dev/null || true)
          service_restarts=$(systemctl show fgbears-live.service -p NRestarts --value 2>/dev/null || true)
          relay_result=$(systemctl show fgbears-youtube-relay.service -p Result --value 2>/dev/null || true)
          relay_exec_status=$(systemctl show fgbears-youtube-relay.service -p ExecMainStatus --value 2>/dev/null || true)
          relay_restarts=$(systemctl show fgbears-youtube-relay.service -p NRestarts --value 2>/dev/null || true)

          if sudo awk -F= '/^YOUTUBE_STREAM_KEY=/{if(length(substr($0,index($0,"=")+1))>0) ok=1} END{exit ok?0:1}' "$env_file"; then
            youtube_configured=true
          fi
          sudo grep -Eq '^X_STREAM_ENABLED=(1|true|yes|on)$' "$env_file" && x_enabled=true || true

          main_pid=$(systemctl show -p MainPID --value fgbears-live.service 2>/dev/null || echo 0)
          relay_pid=$(systemctl show -p MainPID --value fgbears-youtube-relay.service 2>/dev/null || echo 0)
          primary_pid=''
          if [[ "$main_pid" =~ ^[1-9][0-9]*$ ]]; then
            primary_pid=$(pgrep -P "$main_pid" -x ffmpeg | head -1 || true)
          fi

          sudo ss -ntpH state established > /tmp/fgbears-all-sockets.txt || true
          : > /tmp/fgbears-primary-sockets.txt
          : > /tmp/fgbears-relay-sockets.txt

          if [[ -n "$primary_pid" ]]; then
            ffmpeg_active=true
            grep "pid=$primary_pid" /tmp/fgbears-all-sockets.txt > /tmp/fgbears-primary-sockets.txt || true
            primary_external_443_count=$(grep -c ':443' /tmp/fgbears-primary-sockets.txt || true)
            if (( primary_external_443_count > 0 )); then
              x_socket_established=true
            fi
          fi

          if [[ "$relay_pid" =~ ^[1-9][0-9]*$ ]]; then
            grep "pid=$relay_pid" /tmp/fgbears-all-sockets.txt > /tmp/fgbears-relay-sockets.txt || true
            relay_external_443_count=$(grep -c ':443' /tmp/fgbears-relay-sockets.txt || true)
            if (( relay_external_443_count > 0 )); then
              youtube_socket_established=true
            fi
          fi

          if grep -Eq '127\.0\.0\.1:1935|\[::1\]:1935' /tmp/fgbears-primary-sockets.txt && grep -Eq '127\.0\.0\.1:1935|\[::1\]:1935' /tmp/fgbears-relay-sockets.txt; then
            local_relay_handoff=true
          fi

          ffmpeg_pids=$(pgrep -x ffmpeg || true)
          if [[ -n "$ffmpeg_pids" ]]; then
            ffmpeg_active=true
            : > /tmp/fgbears-ffmpeg-sockets.txt
            while IFS= read -r pid; do
              [[ -n "$pid" ]] || continue
              grep "pid=$pid" /tmp/fgbears-all-sockets.txt >> /tmp/fgbears-ffmpeg-sockets.txt || true
            done <<< "$ffmpeg_pids"
            sort -u /tmp/fgbears-ffmpeg-sockets.txt -o /tmp/fgbears-ffmpeg-sockets.txt
            ffmpeg_socket_count=$(wc -l < /tmp/fgbears-ffmpeg-sockets.txt | tr -d ' ')
          fi

          sudo journalctl -u fgbears-live.service -u fgbears-youtube-relay.service --since '20 minutes ago' --no-pager > /tmp/fgbears-youtube-journal.txt
          if grep -Eq 'a\.rtmps\.youtube\.com.*(failed|error|refused|timed out)|YouTube.*(failed|error)|Error opening output' /tmp/fgbears-youtube-journal.txt; then
            youtube_primary_failure_recent=true
          fi
          if [[ "$service_active" != true ]]; then
            failure_class=primary-service-inactive
          elif [[ "$youtube_relay_active" != true ]]; then
            failure_class=youtube-relay-inactive
          elif [[ "$local_relay_handoff" != true ]]; then
            failure_class=local-relay-handoff-absent
          elif [[ "$youtube_socket_established" != true ]]; then
            failure_class=youtube-external-socket-absent
          elif [[ "$x_enabled" == true && "$x_socket_established" != true ]]; then
            failure_class=x-external-socket-absent
          fi

          printf 'SERVICE_ACTIVE=%s\n' "$service_active"
          printf 'YOUTUBE_RELAY_ACTIVE=%s\n' "$youtube_relay_active"
          printf 'FFMPEG_ACTIVE=%s\n' "$ffmpeg_active"
          printf 'YOUTUBE_CONFIGURED=%s\n' "$youtube_configured"
          printf 'YOUTUBE_SOCKET_ESTABLISHED=%s\n' "$youtube_socket_established"
          printf 'X_ENABLED=%s\n' "$x_enabled"
          printf 'X_SOCKET_ESTABLISHED=%s\n' "$x_socket_established"
          printf 'LOCAL_RELAY_HANDOFF=%s\n' "$local_relay_handoff"
          printf 'YOUTUBE_PRIMARY_FAILURE_RECENT=%s\n' "$youtube_primary_failure_recent"
          printf 'FFMPEG_SOCKET_COUNT=%s\n' "$ffmpeg_socket_count"
          printf 'PRIMARY_EXTERNAL_443_COUNT=%s\n' "$primary_external_443_count"
          printf 'RELAY_EXTERNAL_443_COUNT=%s\n' "$relay_external_443_count"
          printf 'SERVICE_RESULT=%s\n' "${service_result:-unknown}"
          printf 'SERVICE_EXEC_STATUS=%s\n' "${service_exec_status:-unknown}"
          printf 'SERVICE_RESTARTS=%s\n' "${service_restarts:-unknown}"
          printf 'RELAY_RESULT=%s\n' "${relay_result:-unknown}"
          printf 'RELAY_EXEC_STATUS=%s\n' "${relay_exec_status:-unknown}"
          printf 'RELAY_RESTARTS=%s\n' "${relay_restarts:-unknown}"
          printf 'FAILURE_CLASS=%s\n' "$failure_class"

          rm -f /tmp/fgbears-all-sockets.txt /tmp/fgbears-primary-sockets.txt /tmp/fgbears-relay-sockets.txt /tmp/fgbears-ffmpeg-sockets.txt /tmp/fgbears-youtube-journal.txt
          REMOTE
          cat /tmp/youtube-ingest.env

      - name: Record safe ingest diagnostic
        if: always()
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/deployment-status
          service_active=false
          youtube_relay_active=false
          ffmpeg_active=false
          youtube_configured=false
          youtube_socket_established=false
          x_enabled=false
          x_socket_established=false
          local_relay_handoff=false
          youtube_primary_failure_recent=false
          ffmpeg_socket_count=0
          primary_external_443_count=0
          relay_external_443_count=0
          service_result=unknown
          service_exec_status=unknown
          service_restarts=unknown
          relay_result=unknown
          relay_exec_status=unknown
          relay_restarts=unknown
          failure_class=unknown
          if [[ -f /tmp/youtube-ingest.env ]]; then
            while IFS='=' read -r key value; do
              case "$key" in
                SERVICE_ACTIVE) service_active="$value" ;;
                YOUTUBE_RELAY_ACTIVE) youtube_relay_active="$value" ;;
                FFMPEG_ACTIVE) ffmpeg_active="$value" ;;
                YOUTUBE_CONFIGURED) youtube_configured="$value" ;;
                YOUTUBE_SOCKET_ESTABLISHED) youtube_socket_established="$value" ;;
                X_ENABLED) x_enabled="$value" ;;
                X_SOCKET_ESTABLISHED) x_socket_established="$value" ;;
                LOCAL_RELAY_HANDOFF) local_relay_handoff="$value" ;;
                YOUTUBE_PRIMARY_FAILURE_RECENT) youtube_primary_failure_recent="$value" ;;
                FFMPEG_SOCKET_COUNT) ffmpeg_socket_count="$value" ;;
                PRIMARY_EXTERNAL_443_COUNT) primary_external_443_count="$value" ;;
                RELAY_EXTERNAL_443_COUNT) relay_external_443_count="$value" ;;
                SERVICE_RESULT) service_result="$value" ;;
                SERVICE_EXEC_STATUS) service_exec_status="$value" ;;
                SERVICE_RESTARTS) service_restarts="$value" ;;
                RELAY_RESULT) relay_result="$value" ;;
                RELAY_EXEC_STATUS) relay_exec_status="$value" ;;
                RELAY_RESTARTS) relay_restarts="$value" ;;
                FAILURE_CLASS) failure_class="$value" ;;
              esac
            done < /tmp/youtube-ingest.env
          fi
          jq -n \
            --argjson serviceActive "$service_active" \
            --argjson youtubeRelayActive "$youtube_relay_active" \
            --argjson ffmpegActive "$ffmpeg_active" \
            --argjson youtubeConfigured "$youtube_configured" \
            --argjson youtubeSocketEstablished "$youtube_socket_established" \
            --argjson xEnabled "$x_enabled" \
            --argjson xSocketEstablished "$x_socket_established" \
            --argjson localRelayHandoff "$local_relay_handoff" \
            --argjson youtubePrimaryFailureRecent "$youtube_primary_failure_recent" \
            --argjson ffmpegSocketCount "$ffmpeg_socket_count" \
            --argjson primaryExternal443Count "$primary_external_443_count" \
            --argjson relayExternal443Count "$relay_external_443_count" \
            --arg serviceResult "$service_result" \
            --arg serviceExecStatus "$service_exec_status" \
            --arg serviceRestarts "$service_restarts" \
            --arg relayResult "$relay_result" \
            --arg relayExecStatus "$relay_exec_status" \
            --arg relayRestarts "$relay_restarts" \
            --arg failureClass "$failure_class" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runId "$GITHUB_RUN_ID" \
            '{serviceActive:$serviceActive,youtubeRelayActive:$youtubeRelayActive,ffmpegActive:$ffmpegActive,youtubeConfigured:$youtubeConfigured,youtubeSocketEstablished:$youtubeSocketEstablished,xEnabled:$xEnabled,xSocketEstablished:$xSocketEstablished,localRelayHandoff:$localRelayHandoff,youtubePrimaryFailureRecent:$youtubePrimaryFailureRecent,ffmpegEstablishedSocketCount:$ffmpegSocketCount,primaryExternal443Count:$primaryExternal443Count,relayExternal443Count:$relayExternal443Count,serviceResult:$serviceResult,serviceExecStatus:$serviceExecStatus,serviceRestarts:$serviceRestarts,relayResult:$relayResult,relayExecStatus:$relayExecStatus,relayRestarts:$relayRestarts,failureClass:$failureClass,checkedAt:$checkedAt,runId:$runId,transport:"youtube-copy-remux-relay",detectionMethod:"process-role-external-443"}' \
            > .github/deployment-status/fgbears-youtube-ingest.json
          git config user.name 'FGBears Deploy Bot'
          git config user.email 'actions@github.com'
          git add -- .github/deployment-status/fgbears-youtube-ingest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record YouTube ingest diagnostic [skip ci]'
          git push origin main
