name: Restore YouTube Continuous Live V2

on:
  push:
    paths:
      - '.github/workflows/restore-youtube-continuous-live-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-cutover
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Restore continuous YouTube live relay only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          dropin=/etc/systemd/system/fgbears-live-health.service.d/90-youtube-emergency-router.conf

          master_before=$(systemctl show -p MainPID --value fgbears-live.service)
          rumble_before=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          [[ "$master_before" =~ ^[1-9][0-9]*$ && "$rumble_before" =~ ^[1-9][0-9]*$ ]]
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-rumble-relay.service

          rollback_to_router() {
            echo 'DIRECT_RELAY_VERIFY_FAILED_RESTORING_ROUTER=yes' >&2
            sudo systemctl stop fgbears-youtube-relay.service || true
            sudo systemctl disable fgbears-youtube-relay.service || true
            sudo systemctl disable --now fgbears-youtube-audio-watchdog.timer || true
            sudo install -d -m 0755 /etc/systemd/system/fgbears-live-health.service.d
            printf '%s\n' '[Service]' 'Environment=YOUTUBE_RELAY_SERVICE=fgbears-youtube-router.service' | sudo tee "$dropin" >/dev/null
            sudo systemctl daemon-reload
            sudo systemctl enable --now fgbears-youtube-router.service
          }
          trap 'rollback_to_router' ERR

          sudo systemctl disable --now fgbears-youtube-freeze-card-refresh.timer || true
          sudo systemctl stop fgbears-youtube-freeze-card-refresh.service || true
          sudo systemctl stop fgbears-youtube-router.service
          sudo systemctl disable fgbears-youtube-router.service || true

          sudo rm -f "$dropin"
          sudo systemctl daemon-reload
          sudo systemctl enable fgbears-youtube-relay.service
          sudo systemctl start fgbears-youtube-relay.service

          connected=0
          for i in $(seq 1 45); do
            if systemctl is-active --quiet fgbears-youtube-relay.service; then
              direct_pid=$(systemctl show -p MainPID --value fgbears-youtube-relay.service)
              if [[ "$direct_pid" =~ ^[1-9][0-9]*$ ]]; then
                # youtube-relay.sh execs ffmpeg, so MainPID is normally FFmpeg itself.
                if sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$direct_pid" | grep -E ':443([[:space:]]|$)' >/dev/null; then
                  connected=1
                  break
                fi
                child=$(pgrep -P "$direct_pid" ffmpeg | head -n1 || true)
                if [[ "$child" =~ ^[1-9][0-9]*$ ]] && sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$child" | grep -E ':443([[:space:]]|$)' >/dev/null; then
                  connected=1
                  break
                fi
              fi
            fi
            sleep 1
          done
          test "$connected" = 1

          sudo systemctl enable --now fgbears-youtube-audio-watchdog.timer
          systemctl is-active --quiet fgbears-youtube-audio-watchdog.timer

          # Hold for 12 seconds so this is not just a transient connection.
          sleep 12
          systemctl is-active --quiet fgbears-youtube-relay.service
          direct_pid=$(systemctl show -p MainPID --value fgbears-youtube-relay.service)
          [[ "$direct_pid" =~ ^[1-9][0-9]*$ ]]
          socket_ok=0
          if sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$direct_pid" | grep -E ':443([[:space:]]|$)' >/dev/null; then socket_ok=1; fi
          child=$(pgrep -P "$direct_pid" ffmpeg | head -n1 || true)
          if [[ "$child" =~ ^[1-9][0-9]*$ ]] && sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$child" | grep -E ':443([[:space:]]|$)' >/dev/null; then socket_ok=1; fi
          test "$socket_ok" = 1

          master_after=$(systemctl show -p MainPID --value fgbears-live.service)
          rumble_after=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          test "$master_after" = "$master_before"
          test "$rumble_after" = "$rumble_before"
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-rumble-relay.service
          ! systemctl is-active --quiet fgbears-youtube-router.service
          ! systemctl is-active --quiet fgbears-youtube-freeze-card-refresh.timer

          trap - ERR
          echo "MASTER_PID_UNCHANGED=$master_after"
          echo "RUMBLE_PID_UNCHANGED=$rumble_after"
          echo "YOUTUBE_DIRECT_PID=$direct_pid"
          echo 'YOUTUBE_RTMPS_ESTABLISHED_STABLE=yes'
          echo 'YOUTUBE_FREEZE_ROUTER=disabled_inactive'
          echo 'YOUTUBE_FREEZE_REFRESH=disabled_inactive'
          echo 'RSS_AND_CRAWL_PATH=continuous_live_video'
          echo 'RESTORE_CONTINUOUS_YOUTUBE_LIVE=PASS'
          REMOTE
