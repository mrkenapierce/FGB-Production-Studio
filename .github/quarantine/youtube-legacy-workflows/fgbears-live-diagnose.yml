name: Diagnose FGBears Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-live-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: fgbears-live-production-diagnostics
  cancel-in-progress: true

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require Oracle deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Trust Oracle host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Capture shared-master and relay diagnostics
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          echo 'SYSTEM'
          date -u
          uptime
          free -m
          df -h / /srv/fgbears-live

          echo 'SERVICES'
          for service in fgbears-live.service fgbears-youtube-relay.service fgbears-rumble-relay.service; do
            systemctl show "$service" \
              -p ActiveState -p SubState -p MainPID -p NRestarts \
              -p ExecMainStartTimestamp -p ExecMainStatus --no-pager
          done

          master_pid=$(systemctl show -p MainPID --value fgbears-live.service)
          youtube_pid=$(systemctl show -p MainPID --value fgbears-youtube-relay.service)
          rumble_pid=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)

          echo 'PROCESS SNAPSHOT'
          ps -o pid,ppid,pcpu,pmem,rss,nlwp,stat,etime,comm -p "$master_pid,$youtube_pid,$rumble_pid" || true
          ps -eo pid,ppid,pcpu,pmem,rss,nlwp,stat,etime,comm --sort=-pcpu | head -n 20

          echo 'CPU AND RUN QUEUE SAMPLE'
          vmstat 1 12

          echo 'MASTER PROGRESS SAMPLE'
          progress=/srv/fgbears-live/logs/ffmpeg-progress.log
          for _ in $(seq 1 20); do
            snapshot=$(sudo tail -n 20 "$progress" 2>/dev/null || true)
            frame=$(printf '%s\n' "$snapshot" | sed -n 's/^frame=//p' | tail -n 1)
            out_time=$(printf '%s\n' "$snapshot" | sed -n 's/^out_time=//p' | tail -n 1)
            drop=$(printf '%s\n' "$snapshot" | sed -n 's/^drop_frames=//p' | tail -n 1)
            speed=$(printf '%s\n' "$snapshot" | sed -n 's/^speed=//p' | tail -n 1)
            printf '%s frame=%s out_time=%s drop=%s speed=%s\n' "$(date -u +%H:%M:%S)" "$frame" "$out_time" "$drop" "$speed"
            sleep 1
          done

          echo 'LOCAL UDP SOCKETS'
          sudo ss -uapnm | grep -E ':(1939|1940)[[:space:]]' || true

          echo 'RENDERER HEALTH'
          for port in 8787 8788 8789 8790; do
            printf 'port %s: ' "$port"
            curl --silent --show-error --fail --max-time 3 "http://127.0.0.1:${port}/healthz" || true
            echo
          done

          echo 'RECENT MASTER WARNINGS'
          sudo journalctl -u fgbears-live.service --since '-20 minutes' --no-pager | tail -n 250

          echo 'RECENT YOUTUBE RELAY WARNINGS'
          sudo journalctl -u fgbears-youtube-relay.service --since '-20 minutes' --no-pager | tail -n 250 \
            | sed -E 's#(rtmps?://[^/]+/live2/)[^[:space:]]+#\1[redacted]#g'

          echo 'RECENT RUMBLE RELAY WARNINGS'
          sudo journalctl -u fgbears-rumble-relay.service --since '-20 minutes' --no-pager | tail -n 250 \
            | sed -E 's#(rtmps?://[^/]+/live/)[^[:space:]]+#\1[redacted]#g'
          REMOTE
