name: Deprecated - YouTube Exact Card V4 Freeze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Block deprecated whole-frame freeze path
        run: |
          echo '::error::This workflow is permanently disabled. Whole-frame YouTube card switching freezes the RSS/news feed and messaging crawl during trivia, which violates the production requirement. Use the continuous direct relay until an off-host partial compositor is available.'
          exit 1
