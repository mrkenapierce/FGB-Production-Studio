name: Tune FGBears Live Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-live-runtime-tune.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Set real-time overlay clocks and restart program
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sudo python3 - <<'PY'
          from pathlib import Path
          path = Path('/etc/fgbears-live/stream.env')
          updates = {
              'OUTPUT_FPS': '30',
              'VIDEO_GOP': '60',
              'DRAWTEXT_RELOAD_FRAMES': '30',
              'AD_OVERLAY_FPS': '15',
              'CRAWL_OVERLAY_FPS': '15',
          }
          lines = path.read_text(encoding='utf-8').splitlines()
          seen = set()
          out = []
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  key = line.split('=', 1)[0]
                  if key in updates:
                      if key not in seen:
                          out.append(f'{key}={updates[key]}')
                          seen.add(key)
                      continue
              out.append(line)
          for key, value in updates.items():
              if key not in seen:
                  out.append(f'{key}={value}')
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          sudo chown root:fgbears /etc/fgbears-live/stream.env
          sudo chmod 0640 /etc/fgbears-live/stream.env
          sudo systemctl restart fgbears-live.service

          for _ in $(seq 1 60); do
            if systemctl is-active --quiet fgbears-live.service && \
               curl --silent --fail --max-time 1 http://127.0.0.1:8787/healthz >/dev/null && \
               curl --silent --fail --max-time 1 http://127.0.0.1:8788/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet fgbears-live.service

          echo '--- tuned cadence ---'
          sudo grep -E '^(OUTPUT_FPS|VIDEO_GOP|DRAWTEXT_RELOAD_FRAMES|AD_OVERLAY_FPS|CRAWL_OVERLAY_FPS)=' /etc/fgbears-live/stream.env

          progress=/srv/fgbears-live/logs/ffmpeg-progress.log
          sleep 12
          echo '--- live progress after tune ---'
          sudo grep -E '^(frame|fps|out_time_us|dup_frames|drop_frames|speed|progress)=' "$progress" || true
          speed=$(sudo sed -n 's/^speed=\([0-9.]*\)x$/\1/p' "$progress" | tail -n 1)
          python3 - "$speed" <<'PY'
          import sys
          speed = float(sys.argv[1])
          print(f'measured_speed={speed:.3f}x')
          if speed < 0.95:
              raise SystemExit(f'Program is still below real-time threshold: {speed:.3f}x')
          PY
          REMOTE
