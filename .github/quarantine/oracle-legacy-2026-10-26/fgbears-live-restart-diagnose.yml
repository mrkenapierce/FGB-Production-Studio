# Diagnostic-only workflow. This file does not deploy or restart the live service.
name: Diagnose FGBears Restart Cause

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-live-restart-diagnose.yml'

permissions:
  contents: write

concurrency:
  group: fgbears-live-restart-diagnostics
  cancel-in-progress: true

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Collect non-disruptive restart diagnostics
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set +e
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' > /tmp/fgbears-restarts.txt 2> /tmp/fgbears-restarts.err <<'REMOTE'
          set +e
          echo "CHECKED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "SERVICE_STATE=$(systemctl is-active fgbears-live.service 2>/dev/null)"
          echo "NRESTARTS=$(systemctl show fgbears-live.service -p NRestarts --value 2>/dev/null)"
          echo "ACTIVE_SINCE=$(systemctl show fgbears-live.service -p ActiveEnterTimestamp --value 2>/dev/null)"
          echo "MAIN_PID=$(systemctl show fgbears-live.service -p MainPID --value 2>/dev/null)"
          echo
          echo "===== PLAYLIST ====="
          grep -c "^file '" /srv/fgbears-live/playlist.ffconcat 2>/dev/null | sed 's/^/PLAYLIST_COUNT=/'
          sed -n "s/^file '\(.*\)'$/\1/p" /srv/fgbears-live/playlist.ffconcat 2>/dev/null
          echo
          echo "===== FFMPEG PROGRESS ====="
          if [[ -s /srv/fgbears-live/logs/ffmpeg-progress.log ]]; then
            echo "PROGRESS_MTIME=$(sudo stat -c %Y /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null)"
            sudo sed -n '/^frame=/p;/^fps=/p;/^out_time=/p;/^out_time_us=/p;/^bitrate=/p;/^speed=/p;/^progress=/p' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null
          else
            echo "NO_PROGRESS_FILE"
          fi
          echo
          echo "===== GUARDED RESTART HISTORY ====="
          sudo cat /srv/fgbears-live/health/restart-history 2>/dev/null || echo "NO_GUARDED_RESTART_HISTORY"
          echo
          echo "===== RESTART CIRCUIT BREAKER ====="
          sudo cat /srv/fgbears-live/health/restart-breaker 2>/dev/null || echo "CLOSED"
          echo
          echo "===== HEALTH LOGS (6H) ====="
          sudo journalctl -t fgbears-live-health --since '6 hours ago' --no-pager -o short-iso 2>/dev/null | tail -n 100
          echo
          echo "===== SERVICE LOGS (6H) ====="
          sudo journalctl -u fgbears-live.service --since '6 hours ago' --no-pager -o short-iso 2>/dev/null | tail -n 220
          REMOTE
          exit 0

      - name: Persist restart diagnostic report
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/diagnostic-status
          {
            echo '# FGBears Restart Diagnostic'
            echo
            echo '```text'
            cat /tmp/fgbears-restarts.txt 2>/dev/null || true
            if [[ -s /tmp/fgbears-restarts.err ]]; then
              echo
              echo '===== SSH/DIAGNOSTIC STDERR ====='
              cat /tmp/fgbears-restarts.err
            fi
            echo '```'
          } > .github/diagnostic-status/fgbears-restarts.md
          git config user.name "FGBears Diagnostic Bot"
          git config user.email "actions@github.com"
          git add .github/diagnostic-status/fgbears-restarts.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record FGBears restart diagnostics [skip ci]"
          git push origin main
