name: Activate YouTube Exact Card V4

on:
  push:
    paths:
      - '.github/workflows/activate-youtube-exact-card-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-exact-card-v4
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Install and hot-reload exact approved card without stream restart
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          repo=/tmp/fgb-exact-card-v4
          runtime=/var/lib/fgbears-live/youtube-freeze-card.h264
          refresher=/usr/local/bin/fgbears-youtube-freeze-card-refresh
          backup=/tmp/fgbears-youtube-freeze-card-refresh.pre-v4
          start_epoch=$(date +%s)

          master_before=$(systemctl show -p MainPID --value fgbears-live.service)
          rumble_before=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          router_before=$(systemctl show -p MainPID --value fgbears-youtube-router.service)
          [[ "$master_before" =~ ^[1-9][0-9]*$ ]]
          [[ "$rumble_before" =~ ^[1-9][0-9]*$ ]]
          [[ "$router_before" =~ ^[1-9][0-9]*$ ]]
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-rumble-relay.service
          systemctl is-active --quiet fgbears-youtube-router.service
          unit_text=$(sudo systemctl cat fgbears-youtube-router.service)
          grep -F '/opt/fgbears-live/bin/youtube-stream-router-freezebox.py' <<<"$unit_text" >/dev/null
          child=$(pgrep -P "$router_before" ffmpeg | head -n1 || true)
          [[ "$child" =~ ^[1-9][0-9]*$ ]]
          sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$child" | grep -E ':443([[:space:]]|$)' >/dev/null

          rm -rf "$repo"
          git clone --depth 1 https://github.com/mrkenapierce/FGB-Production-Studio.git "$repo" >/dev/null
          bash -n "$repo/.github/freeze-maintenance/youtube-freeze-card-refresh-v4.sh"
          python3 -m py_compile \
            "$repo/.github/freeze-maintenance/compose-exact-youtube-card.py" \
            "$repo/services/fgbears-live/tools/build-youtube-rumble-trivia-card.py"

          # Wait until the Lovable production routing contract is the converged v4 contract.
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          url='https://epiccontentcreatorgrants.org/api/public/fgbears/stream-routing'
          expected={'x':462,'y':104,'width':798,'height':470,'coordinateSpace':'pixels','referenceWidth':1280,'referenceHeight':720}
          deadline=time.time()+180
          last=None
          while time.time() < deadline:
              try:
                  sep='&' if '?' in url else '?'
                  req=urllib.request.Request(url+sep+'_v4='+str(time.time_ns()),headers={
                      'Accept':'application/json','Cache-Control':'no-cache','Pragma':'no-cache',
                      'User-Agent':'FGBears-ExactCard-Activation/4.0'})
                  with urllib.request.urlopen(req,timeout=4) as r:
                      p=json.loads(r.read().decode())
                  t=p.get('trivia') if isinstance(p,dict) else None
                  last=t
                  if isinstance(t,dict) and t.get('maskRegion') == expected \
                     and t.get('maskRegionAuthority') == 'production_live_panel' \
                     and t.get('youtubeCreativeKey') == 'yt_rumble_trivia_redirect':
                      print('LOVABLE_V4_ROUTING=PASS')
                      print('LOVABLE_MASK_REGION=462,104,798,470')
                      print('LOVABLE_CREATIVE=yt_rumble_trivia_redirect')
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  last=str(exc)
              time.sleep(3)
          raise SystemExit('Lovable v4 routing contract not live within window: '+repr(last))
          PY

          # Install an isolated Python runtime for only this card generator.
          if [[ ! -x /opt/fgbears-live/venv-exact-card/bin/python ]]; then
            sudo python3 -m venv /opt/fgbears-live/venv-exact-card
          fi
          sudo /opt/fgbears-live/venv-exact-card/bin/python -m pip install -q --disable-pip-version-check 'pillow>=9.1' 'qrcode>=7.4'
          sudo /opt/fgbears-live/venv-exact-card/bin/python -c 'import PIL,qrcode; print("EXACT_CARD_PYTHON=PASS")'

          sudo install -d -m 0755 /opt/fgbears-live/tools
          sudo install -m 0755 "$repo/services/fgbears-live/tools/build-youtube-rumble-trivia-card.py" /opt/fgbears-live/tools/build-youtube-rumble-trivia-card.py
          sudo install -m 0755 "$repo/.github/freeze-maintenance/compose-exact-youtube-card.py" /opt/fgbears-live/tools/compose-exact-youtube-card.py
          [[ -f "$refresher" ]] && sudo cp "$refresher" "$backup" || true
          sudo install -m 0755 "$repo/.github/freeze-maintenance/youtube-freeze-card-refresh-v4.sh" "$refresher"
          echo 'EXACT_CARD_V4_FILES_INSTALLED=yes'

          # Generate a canonical source once and prove the shrunken QR is readable
          # on this actual production host before changing the dynamic router card.
          pre=/tmp/fgb-exact-card-v4-preflight
          rm -rf "$pre"; mkdir -p "$pre"
          sudo /opt/fgbears-live/venv-exact-card/bin/python /opt/fgbears-live/tools/build-youtube-rumble-trivia-card.py "$pre/source.png" >/dev/null
          test -s "$pre/source.png"
          dims=$(sudo /opt/fgbears-live/venv-exact-card/bin/python - "$pre/source.png" <<'PY'
          import sys
          from PIL import Image
          im=Image.open(sys.argv[1])
          print(f'{im.width}x{im.height}')
          PY
          )
          test "$dims" = '1280x720'
          echo 'LOCKED_SOURCE_CARD=1280x720'

          # Ensure timer remains enabled, then force one guarded v4 generation.
          sudo systemctl enable --now fgbears-youtube-freeze-card-refresh.timer
          systemctl is-active --quiet fgbears-youtube-freeze-card-refresh.timer
          before_mtime=$(stat -c %Y "$runtime")
          sudo systemctl reset-failed fgbears-youtube-freeze-card-refresh.service || true
          sudo systemctl start fgbears-youtube-freeze-card-refresh.service || true
          status=$(sudo cat /var/lib/fgbears-live/youtube-freeze-card.status 2>/dev/null || true)
          echo "freeze_card_status=$status"
          if ! grep -F 'result=updated ' <<<"$status" >/dev/null \
             || ! grep -F 'panel=462,104,798,470' <<<"$status" >/dev/null \
             || ! grep -F 'card=462,114,798,449' <<<"$status" >/dev/null \
             || ! grep -F 'source=locked-yt_rumble_trivia_redirect' <<<"$status" >/dev/null \
             || ! grep -F 'mode=exact-card-v4' <<<"$status" >/dev/null; then
            echo 'Exact-card v4 generation did not publish; preserving current router card.' >&2
            if [[ -s "$backup" ]]; then sudo install -m 0755 "$backup" "$refresher"; fi
            exit 1
          fi
          after_mtime=$(stat -c %Y "$runtime")
          test "$after_mtime" -ge "$before_mtime"

          # Existing router must adopt the new asset without restarting itself.
          reloaded=0
          for i in $(seq 1 20); do
            logs=$(sudo journalctl -u fgbears-youtube-router.service --since "@${start_epoch}" --no-pager 2>/dev/null || true)
            if grep -F 'hot-reloaded freeze-box card' <<<"$logs" >/dev/null; then reloaded=1; break; fi
            sleep 1
          done
          test "$reloaded" = 1

          master_after=$(systemctl show -p MainPID --value fgbears-live.service)
          rumble_after=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          router_after=$(systemctl show -p MainPID --value fgbears-youtube-router.service)
          test "$master_after" = "$master_before"
          test "$rumble_after" = "$rumble_before"
          test "$router_after" = "$router_before"
          child_after=$(pgrep -P "$router_after" ffmpeg | head -n1 || true)
          [[ "$child_after" =~ ^[1-9][0-9]*$ ]]
          sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$child_after" | grep -E ':443([[:space:]]|$)' >/dev/null

          echo "MASTER_PID_UNCHANGED=$master_after"
          echo "RUMBLE_PID_UNCHANGED=$rumble_after"
          echo "YOUTUBE_ROUTER_PID_UNCHANGED=$router_after"
          echo 'YOUTUBE_RTMPS_ESTABLISHED=yes'
          echo 'EXACT_CARD_HOT_RELOAD=yes'
          echo 'EXACT_CARD_V4_ACTIVATION=PASS'
          REMOTE
