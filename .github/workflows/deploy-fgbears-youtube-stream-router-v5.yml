name: Deploy FGBears YouTube Stream Router v5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-fgbears-youtube-stream-router-v5.yml'
      - 'services/fgbears-live/bin/youtube-stream-router-v5.py'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  deploy-youtube-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify Lovable routing contract is live
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          url='https://epiccontentcreatorgrants.org/api/public/fgbears/stream-routing'
          last=None
          for _ in range(24):
              req=urllib.request.Request(url,headers={'Accept':'application/json','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=8) as r:
                  d=json.load(r)
              t=d.get('trivia') or {}
              last=t
              required=('youtubeMaskActive','phase','adsVisible','isAdBreak','questionActive')
              if all(k in t for k in required):
                  print(json.dumps(t,sort_keys=True))
                  break
              time.sleep(5)
          else:
              raise SystemExit('Lovable routing contract not live; refusing YouTube change. Last trivia='+json.dumps(last,sort_keys=True))
          PY

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Stage router files and protected baseline
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'rm -rf /tmp/fgb-youtube-v5 && mkdir -p /tmp/fgb-youtube-v5'
          scp -i ~/.ssh/oracle_key \
            services/fgbears-live/bin/youtube-stream-router.py \
            services/fgbears-live/bin/youtube-stream-router-v5.py \
            "$ORACLE_USER@$ORACLE_HOST:/tmp/fgb-youtube-v5/"
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          for svc in fgbears-live.service fgbears-youtube-relay.service fgbears-rumble-relay.service; do systemctl is-active "$svc"; done
          MASTER_PID=$(systemctl show -p MainPID --value fgbears-live.service)
          RUMBLE_PID=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          YOUTUBE_PID=$(systemctl show -p MainPID --value fgbears-youtube-relay.service)
          printf 'MASTER_PID=%s\nRUMBLE_PID=%s\nYOUTUBE_PID=%s\n' "$MASTER_PID" "$RUMBLE_PID" "$YOUTUBE_PID" | tee /tmp/fgb-youtube-v5/baseline.env
          REMOTE

      - name: Deploy v5 policy wrapper to YouTube only
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          source /tmp/fgb-youtube-v5/baseline.env
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="/var/backups/fgbears-youtube-v5-$STAMP"
          rollback() {
            rc=$?; set +e
            echo "ROLLBACK v5 rc=$rc" >&2
            if [[ -f "$BACKUP/youtube-stream-router.py" ]]; then sudo cp -a "$BACKUP/youtube-stream-router.py" /opt/fgbears-live/bin/youtube-stream-router.py; fi
            if [[ -f "$BACKUP/youtube-stream-router-base.py" ]]; then sudo cp -a "$BACKUP/youtube-stream-router-base.py" /opt/fgbears-live/bin/youtube-stream-router-base.py; else sudo rm -f /opt/fgbears-live/bin/youtube-stream-router-base.py; fi
            sudo systemctl restart fgbears-youtube-relay.service || true
            exit "$rc"
          }
          trap rollback ERR

          sudo install -d -m 0700 "$BACKUP"
          sudo cp -a /opt/fgbears-live/bin/youtube-stream-router.py "$BACKUP/youtube-stream-router.py"
          [[ ! -f /opt/fgbears-live/bin/youtube-stream-router-base.py ]] || sudo cp -a /opt/fgbears-live/bin/youtube-stream-router-base.py "$BACKUP/youtube-stream-router-base.py"

          sudo install -o root -g root -m 0755 /tmp/fgb-youtube-v5/youtube-stream-router.py /opt/fgbears-live/bin/youtube-stream-router-base.py
          sudo install -o root -g root -m 0755 /tmp/fgb-youtube-v5/youtube-stream-router-v5.py /opt/fgbears-live/bin/youtube-stream-router.py
          python3 -m py_compile /opt/fgbears-live/bin/youtube-stream-router.py /opt/fgbears-live/bin/youtube-stream-router-base.py

          RESTART_AT=$(date --iso-8601=seconds)
          sudo systemctl restart fgbears-youtube-relay.service
          sleep 12
          systemctl is-active fgbears-youtube-relay.service
          [[ "$(systemctl show -p MainPID --value fgbears-live.service)" == "$MASTER_PID" ]]
          [[ "$(systemctl show -p MainPID --value fgbears-rumble-relay.service)" == "$RUMBLE_PID" ]]

          UNIT_PID=$(systemctl show -p MainPID --value fgbears-youtube-relay.service)
          ROUTER_PID=$(pgrep -P "$UNIT_PID" -f 'youtube-stream-router.py' | head -n1 || true)
          [[ "$ROUTER_PID" =~ ^[1-9][0-9]*$ ]]
          TRANSPORT_PID=$(pgrep -P "$ROUTER_PID" -f '^ffmpeg ' | head -n1 || true)
          [[ "$TRANSPORT_PID" =~ ^[1-9][0-9]*$ ]]
          ARGS=$(tr '\0' ' ' < "/proc/$TRANSPORT_PID/cmdline")
          [[ "$ARGS" == *'-c copy'* ]]
          [[ "$ARGS" != *'libx264'* ]]

          HEALTH_AT=$(date --iso-8601=seconds)
          sleep 15
          HEALTH=$(journalctl -u fgbears-youtube-relay.service --since "$HEALTH_AT" --no-pager)
          errors=$(grep -Eic 'Invalid timestamps|Non-monotonous DTS|PES packet size mismatch|Packet corrupt|corrupt input packet|Input buffer exhausted|Error submitting packet|fatal router' <<<"$HEALTH" || true)
          echo "post_warmup_errors=$errors"
          [[ "$errors" -eq 0 ]]

          CLK=$(getconf CLK_TCK)
          read_ticks() { awk '{print $14+$15}' "/proc/$1/stat"; }
          R1=$(read_ticks "$ROUTER_PID"); F1=$(read_ticks "$TRANSPORT_PID"); T1=$(date +%s%N)
          sleep 10
          R2=$(read_ticks "$ROUTER_PID"); F2=$(read_ticks "$TRANSPORT_PID"); T2=$(date +%s%N)
          python3 - "$R1" "$F1" "$R2" "$F2" "$CLK" "$T1" "$T2" <<'PY'
          import sys
          r1,f1,r2,f2,clk,t1,t2=map(int,sys.argv[1:]); e=(t2-t1)/1e9
          cpu=((r2-r1)+(f2-f1))/clk/e*100 if e else 999
          print(f'combined_router_transport_cpu_percent_one_core={cpu:.2f}')
          if cpu>25: raise SystemExit('CPU safety gate failed')
          PY

          curl -fsS --max-time 8 -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            https://epiccontentcreatorgrants.org/api/public/fgbears/stream-routing \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); t=d.get("trivia",{}); assert "youtubeMaskActive" in t; print(json.dumps(t,sort_keys=True))'
          echo "backup=$BACKUP"
          echo 'youtube_router_v5_deployment_ok=yes'
          trap - ERR
          REMOTE
