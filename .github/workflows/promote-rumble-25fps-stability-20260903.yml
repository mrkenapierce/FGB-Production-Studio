name: Promote Rumble 25fps Stability 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-rumble-25fps-stability-20260903.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Apply guarded 25 fps profile
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/fgbears-live/stream.env
          backup=/etc/fgbears-live/stream.env.pre-25fps-stability
          sudo cp -a "$env_file" "$backup"
          rollback(){ rc=$?; trap - ERR; echo "ROLLBACK rc=$rc" >&2; sudo cp -a "$backup" "$env_file" || true; sudo systemctl restart fgbears-live.service || true; exit "$rc"; }
          trap rollback ERR

          sudo python3 - "$env_file" <<'PY'
          from pathlib import Path
          import os,sys
          p=Path(sys.argv[1]); out=[]
          replace={
              'OUTPUT_FPS':'25',
              'VIDEO_GOP':'50',
              'AD_OVERLAY_FPS':'25',
              'CRAWL_OVERLAY_FPS':'25',
              'BEARS_NEWS_OVERLAY_FPS':'25',
              'CRAWL_TEXT_RENDER_SCALE':'1',
              'CRAWL_OVERLAY_SCRIPT':'/opt/fgbears-live/bin/crawl-overlay-hq.py',
          }
          seen=set()
          for line in p.read_text().splitlines():
              name=line.split('=',1)[0] if '=' in line and not line.lstrip().startswith('#') else ''
              if name.startswith(('YOUTUBE_','FGB_YOUTUBE_','RUMBLE_STUDIO_')):
                  continue
              if name in replace:
                  if name not in seen:
                      out.append(f'{name}={replace[name]}'); seen.add(name)
                  continue
              out.append(line)
          for k,v in replace.items():
              if k not in seen: out.append(f'{k}={v}')
          t=p.with_name(p.name+'.25fps.tmp'); t.write_text('\n'.join(out)+'\n'); os.chmod(t,0o640); t.replace(p)
          PY
          sudo chown root:fgbears "$env_file"; sudo chmod 0640 "$env_file"
          while read -r unit _; do [[ -n "$unit" ]] && sudo systemctl disable --now "$unit" >/dev/null 2>&1 || true; done < <(systemctl list-unit-files 'fgbears-youtube*' --no-legend 2>/dev/null || true)
          sudo systemctl disable --now fgbears-rumble-studio-uplink.service >/dev/null 2>&1 || true
          sudo systemctl reset-failed fgbears-live.service
          sudo systemctl restart fgbears-live.service

          for _ in $(seq 1 45); do
            svc=$(systemctl show -p MainPID --value fgbears-live.service)
            ff=$(pgrep -P "$svc" -x ffmpeg | head -n1 || true)
            relay=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
            if [[ "$ff" =~ ^[1-9][0-9]*$ && "$relay" =~ ^[1-9][0-9]*$ ]]; then
              cmd=$(sudo tr '\0' ' ' < "/proc/$ff/cmdline")
              if grep -Fq -- '-r 25 -fps_mode cfr' <<<"$cmd" && grep -Fq -- '-g 50 -keyint_min 50' <<<"$cmd" && grep -Fq -- '-framerate 25 -i /srv/fgbears-live/runtime/ad-frame.jpg' <<<"$cmd" && grep -Fq 'shortest=0:repeatlast=1:eof_action=repeat' <<<"$cmd" && grep -Fq '127.0.0.1:1940' <<<"$cmd" && ! grep -Eqi '127\.0\.0\.1:1939|127\.0\.0\.1:1941|youtube|studio-rtmp' <<<"$cmd"; then break; fi
            fi
            sleep 1
          done
          [[ "$ff" =~ ^[1-9][0-9]*$ ]]; [[ "$relay" =~ ^[1-9][0-9]*$ ]]
          for _ in $(seq 1 30); do sudo ss -ntpH state established | grep "pid=$relay" | grep -q ':1935' && break; sleep 1; done
          sudo ss -ntpH state established | grep "pid=$relay" | grep -q ':1935'

          p=/srv/fgbears-live/logs/ffmpeg-progress.log
          tmp=$(mktemp)
          for i in $(seq 1 60); do
            ns=$(date +%s%N); block=$(sudo cat "$p" 2>/dev/null || true)
            out=$(sed -n 's/^out_time_us=\([0-9]*\)$/\1/p' <<<"$block" | tail -n1)
            frame=$(sed -n 's/^frame=\([0-9]*\)$/\1/p' <<<"$block" | tail -n1)
            dup=$(sed -n 's/^dup_frames=\([0-9]*\)$/\1/p' <<<"$block" | tail -n1)
            [[ "$out" =~ ^[0-9]+$ && "$frame" =~ ^[0-9]+$ && "$dup" =~ ^[0-9]+$ ]] && printf '%s %s %s %s\n' "$ns" "$out" "$frame" "$dup" >> "$tmp"
            sleep 1
          done
          read speed fps dupdelta <<<"$(python3 - "$tmp" <<'PY'
          import sys
          rows=[]
          for line in open(sys.argv[1]):
              p=line.split()
              if len(p)>=4: rows.append(tuple(map(int,p[:4])))
          distinct=[]; last=None
          for r in rows:
              if r[1]!=last: distinct.append(r); last=r[1]
          if len(distinct)<3: raise SystemExit('insufficient progress samples')
          a,b=distinct[0],distinct[-1]
          wall=(b[0]-a[0])/1e9; media=(b[1]-a[1])/1e6
          speed=media/wall; fps=(b[2]-a[2])/wall; dup=b[3]-a[3]
          print(f'{speed:.6f} {fps:.3f} {dup}')
          PY
          )"
          rm -f "$tmp"
          echo "STABILITY_SPEED=${speed}x OUTPUT_FPS_MEASURED=$fps DUP_DELTA=$dupdelta"
          python3 - "$speed" "$fps" "$dupdelta" <<'PY'
          import sys
          speed=float(sys.argv[1]); fps=float(sys.argv[2]); dup=int(sys.argv[3])
          raise SystemExit(0 if speed >= 0.990 and fps >= 24.5 and dup <= 2 else 1)
          PY

          sudo /usr/local/bin/fgbears-audio-health --capture-seconds 6
          retired=$(sudo grep -Ec '^(YOUTUBE_|FGB_YOUTUBE_|RUMBLE_STUDIO_)' "$env_file" || true)
          test "$retired" -eq 0
          echo '=== CPU AFTER ==='
          ps -p "$ff" -o pid=,etime=,pcpu=,pmem=,stat=,cmd= | cut -c1-400
          cat /proc/pressure/cpu || true
          trap - ERR
          echo "RUMBLE_25FPS_STABILITY=PASS master_pid=$ff relay_pid=$relay speed=${speed}x fps=$fps dup_delta=$dupdelta retired_env=$retired"
          REMOTE
