name: Quarantined Episode 034 Direct Deployment

# The c04e4fa3... Episode 034 production-ready candidate was rejected by the
# user after live playback. This workflow is intentionally inert so that
# editing the old direct-deploy script cannot put that candidate back on air.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse rejected candidate deployment
        run: |
          echo 'BLOCKED: Episode 034 candidate c04e4fa32a5acc4200c2ef88e8bf43f7618998768ad8c58a716f7869a35a9e7a was rejected after live playback.'
          echo 'A new, independently validated source and explicit deployment path are required before Episode 034 can replace the restored known-good audio.'
