name: Deploy Episode 034 Direct
on:
  push:
    branches: [main]
    paths:
      - 'scripts/deploy-episode034-direct.sh'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Deploy exact uploaded M4A
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: ssh -i ~/.ssh/oracle_key ubuntu@$ORACLE_HOST 'sudo bash -s' < scripts/deploy-episode034-direct.sh
