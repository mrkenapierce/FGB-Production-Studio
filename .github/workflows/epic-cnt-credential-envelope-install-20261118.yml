name: Install encrypted EPIC ingest on OVH without restarting CNT
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: epic-cnt-private-credential-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer and encrypted envelope format
        run: |
          set -euo pipefail
          python3 -m py_compile ops/epic-cnt-switcher/install_envelope.py
          test -s ops/epic-cnt-switcher/epic-ingest-envelope.enc
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          s=Path('ops/epic-cnt-switcher/epic-ingest-envelope.enc').read_text().strip()
          assert len(s)<8192 and re.fullmatch(r'[A-Za-z0-9+/=]+',s)
          assert len(base64.b64decode(s, validate=True))==384, 'expected RSA-3072 OAEP envelope'
          print('CIPHERTEXT_FORMAT_VALID=true')
          PY
      - name: Set up existing protected OVH access
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh
          chmod 600 ~/.ssh/ovh
          unset DEPLOY_KEY
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Deliver opaque ciphertext and private installer
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i ~/.ssh/ovh ubuntu@40.160.144.185 \
            "sudo install -d -o ubuntu -g ubuntu -m 0700 /opt/cnt-destination-staging-20261118/credential"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/ovh \
            ops/epic-cnt-switcher/install_envelope.py \
            ops/epic-cnt-switcher/epic-ingest-envelope.enc \
            ubuntu@40.160.144.185:/opt/cnt-destination-staging-20261118/credential/
      - name: Decrypt on OVH only and install in private inactive configuration
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i ~/.ssh/ovh ubuntu@40.160.144.185 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          staging=/opt/cnt-destination-staging-20261118/credential
          before="$(docker inspect -f '{{.Id}}' epic-cnt-capture)"
          test "$(docker inspect -f '{{.State.Running}}' epic-cnt-capture)" = true
          python3 "$staging/install_envelope.py" "$staging/epic-ingest-envelope.enc"
          test "$(docker inspect -f '{{.Id}}' epic-cnt-capture)" = "$before"
          test "$(docker inspect -f '{{.State.Running}}' epic-cnt-capture)" = true
          rm -f "$staging/epic-ingest-envelope.enc"
          echo "LIVE_CNT_UNCHANGED=true"
          echo "STREAM_DESTINATION_CHANGED=false"
          echo "CNT_ENCODER_RESTARTED=false"
          REMOTE
