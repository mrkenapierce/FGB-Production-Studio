name: Diagnose FGBears Live Audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-live-audio-diagnose.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Capture and analyze YouTube-bound audio
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ENV_FILE=/etc/fgbears-live/stream.env
          CAPTURE=/tmp/fgbears-live-audio.ts
          PCM=/tmp/fgbears-live-audio.pcm
          PACKETS=/tmp/fgbears-live-audio-packets.csv
          rm -f "$CAPTURE" "$PCM" "$PACKETS"

          echo '--- live audio configuration ---'
          sudo grep -E '^(PODCAST_AUDIO_FILTER|YOUTUBE_LOCAL_UDP_URL)=' "$ENV_FILE" | sed -E 's/(YOUTUBE_LOCAL_UDP_URL=udp:\/\/127\.0\.0\.1:)[0-9]+.*/\1PORT/'

          port=$(sudo sed -n 's#^YOUTUBE_LOCAL_UDP_URL=udp://127\.0\.0\.1:\([0-9][0-9]*\).*#\1#p' "$ENV_FILE" | tail -n 1)
          [[ "$port" =~ ^[0-9]+$ ]] || { echo 'Could not determine YouTube local UDP port' >&2; exit 1; }

          echo "Capturing 20 seconds of the exact local MPEG-TS transport consumed by the YouTube relay on UDP port ${port}."
          sudo env FGB_AUDIO_PORT="$port" FGB_AUDIO_CAPTURE="$CAPTURE" python3 - <<'PY'
          import os, socket, struct, time
          port = int(os.environ['FGB_AUDIO_PORT'])
          path = os.environ['FGB_AUDIO_CAPTURE']
          s = socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.htons(0x0800))
          s.bind(('lo', 0))
          s.settimeout(1.0)
          deadline = time.monotonic() + 20.0
          packets = 0
          payload_bytes = 0
          with open(path, 'wb') as out:
              while time.monotonic() < deadline:
                  try:
                      frame, addr = s.recvfrom(65535)
                  except socket.timeout:
                      continue
                  if len(frame) < 42:
                      continue
                  if hasattr(socket, 'PACKET_OUTGOING') and len(addr) >= 3 and addr[2] != socket.PACKET_OUTGOING:
                      continue
                  ip = 14
                  if frame[ip] >> 4 != 4:
                      continue
                  ihl = (frame[ip] & 0x0F) * 4
                  if len(frame) < ip + ihl + 8 or frame[ip + 9] != 17:
                      continue
                  udp = ip + ihl
                  src, dst, length = struct.unpack('!HHH', frame[udp:udp+6])
                  if dst != port:
                      continue
                  payload = frame[udp+8:udp+length]
                  if not payload or payload[0] != 0x47 or len(payload) % 188 != 0:
                      continue
                  out.write(payload)
                  packets += 1
                  payload_bytes += len(payload)
          print(f'captured_udp_packets={packets}')
          print(f'captured_mpegts_bytes={payload_bytes}')
          if packets < 100:
              raise SystemExit('Insufficient YouTube-bound MPEG-TS packets captured')
          PY

          sudo chown "$(id -u):$(id -g)" "$CAPTURE"
          test -s "$CAPTURE"

          echo '--- encoded audio stream ---'
          ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name,profile,sample_rate,channels,channel_layout,bit_rate,time_base,start_time \
            -of default=noprint_wrappers=1 "$CAPTURE"

          echo '--- audio packet timing ---'
          ffprobe -v error -select_streams a:0 -show_packets \
            -show_entries packet=pts_time,dts_time,duration_time,size,flags \
            -of csv=p=0 "$CAPTURE" > "$PACKETS"

          echo '--- decode audio to PCM for objective signal analysis ---'
          ffmpeg -hide_banner -loglevel warning -y -i "$CAPTURE" -map 0:a:0 -ac 2 -ar 48000 -f s16le "$PCM"
          test -s "$PCM"

          python3 - "$PCM" "$PACKETS" <<'PY'
          import array, csv, math, os, sys
          pcm_path, packet_path = sys.argv[1:3]
          data = array.array('h')
          with open(pcm_path, 'rb') as f:
              data.frombytes(f.read())
          if sys.byteorder != 'little':
              data.byteswap()
          if len(data) < 48000 * 2:
              raise SystemExit('Decoded audio sample is too short')
          left = data[0::2]
          right = data[1::2]
          n = min(len(left), len(right))
          left, right = left[:n], right[:n]

          def metrics(ch):
              peak = max(abs(x) for x in ch)
              sq = sum(float(x) * x for x in ch)
              rms = math.sqrt(sq / len(ch))
              mean = sum(ch) / len(ch)
              clipped = sum(1 for x in ch if abs(x) >= 32760)
              nearzero = sum(1 for x in ch if abs(x) <= 8)
              return {
                  'peak_dbfs': 20 * math.log10(max(peak, 1) / 32768.0),
                  'rms_dbfs': 20 * math.log10(max(rms, 1e-9) / 32768.0),
                  'dc': mean / 32768.0,
                  'clip_ratio': clipped / len(ch),
                  'nearzero_ratio': nearzero / len(ch),
              }

          lm, rm = metrics(left), metrics(right)
          duration = n / 48000.0
          lr_diff = abs(lm['rms_dbfs'] - rm['rms_dbfs'])
          sum_lr = sum(float(l)*r for l, r in zip(left, right))
          sum_l2 = sum(float(l)*l for l in left)
          sum_r2 = sum(float(r)*r for r in right)
          corr = sum_lr / math.sqrt(max(sum_l2 * sum_r2, 1.0))

          pts = []
          durations = []
          with open(packet_path, newline='') as f:
              for row in csv.reader(f):
                  if not row:
                      continue
                  try:
                      pts.append(float(row[0]))
                      durations.append(float(row[2]))
                  except (ValueError, IndexError):
                      pass
          gaps = []
          regressions = 0
          for i in range(1, len(pts)):
              expected = durations[i-1] if i-1 < len(durations) else 0.021333
              delta = pts[i] - pts[i-1]
              if delta < -0.001:
                  regressions += 1
              if delta > max(0.08, expected * 3.0):
                  gaps.append(delta)

          print(f'decoded_audio_seconds={duration:.3f}')
          print(f'left_peak_dbfs={lm["peak_dbfs"]:.2f}')
          print(f'right_peak_dbfs={rm["peak_dbfs"]:.2f}')
          print(f'left_rms_dbfs={lm["rms_dbfs"]:.2f}')
          print(f'right_rms_dbfs={rm["rms_dbfs"]:.2f}')
          print(f'channel_rms_difference_db={lr_diff:.2f}')
          print(f'left_clip_ratio={lm["clip_ratio"]:.8f}')
          print(f'right_clip_ratio={rm["clip_ratio"]:.8f}')
          print(f'left_nearzero_ratio={lm["nearzero_ratio"]:.4f}')
          print(f'right_nearzero_ratio={rm["nearzero_ratio"]:.4f}')
          print(f'left_dc_fraction={lm["dc"]:.6f}')
          print(f'right_dc_fraction={rm["dc"]:.6f}')
          print(f'lr_correlation={corr:.4f}')
          print(f'audio_pts_regressions={regressions}')
          print(f'audio_large_pts_gaps={len(gaps)}')
          if gaps:
              print('largest_audio_pts_gap_seconds=%.6f' % max(gaps))

          warnings = []
          if max(lm['clip_ratio'], rm['clip_ratio']) > 0.0001:
              warnings.append('CLIPPING')
          if max(lm['peak_dbfs'], rm['peak_dbfs']) > -0.10:
              warnings.append('PEAK_TOO_CLOSE_TO_0_DBFS')
          if max(lm['rms_dbfs'], rm['rms_dbfs']) < -45.0:
              warnings.append('NEAR_SILENCE')
          if lr_diff > 6.0:
              warnings.append('CHANNEL_IMBALANCE')
          if max(abs(lm['dc']), abs(rm['dc'])) > 0.02:
              warnings.append('DC_OFFSET')
          if regressions:
              warnings.append('PTS_REGRESSION')
          if gaps:
              warnings.append('PTS_GAPS')
          print('AUDIO_WARNINGS=' + (','.join(warnings) if warnings else 'NONE'))
          PY

          echo '--- FFmpeg decoder diagnostics ---'
          ffmpeg -hide_banner -v warning -i "$CAPTURE" -map 0:a:0 -f null - 2>&1 | tail -n 80 || true

          echo '--- current media library audio formats ---'
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            printf '%s: ' "$(basename "$file")"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels,channel_layout -of csv=p=0 "$file" | head -n 1 || true
          done < <(sed -n "s/^file '\(.*\)'$/\1/p" /srv/fgbears-live/playlist.ffconcat)

          rm -f "$CAPTURE" "$PCM" "$PACKETS"
          REMOTE
