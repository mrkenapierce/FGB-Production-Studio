name: Check FGB cleanup credential presence
on:
  push:
    branches: [cnt-ingest-preflight-20261025]
    paths:
      - .github/workflows/archive-credential-presence.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Report presence only
        env:
          HEARTBEAT_SECRET: ${{ secrets.FGB_TRANSPORT_HEARTBEAT_SECRET }}
          ARCHIVE_KEY: ${{ secrets.FGB_ARCHIVE_API_KEY }}
          ALT_ARCHIVE_KEY: ${{ secrets.ARCHIVE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$HEARTBEAT_SECRET" ] && echo HEARTBEAT_SECRET_PRESENT=yes || echo HEARTBEAT_SECRET_PRESENT=no
          [ -n "$ARCHIVE_KEY" ] && echo ARCHIVE_KEY_PRESENT=yes || echo ARCHIVE_KEY_PRESENT=no
          [ -n "$ALT_ARCHIVE_KEY" ] && echo ALT_ARCHIVE_KEY_PRESENT=yes || echo ALT_ARCHIVE_KEY_PRESENT=no
