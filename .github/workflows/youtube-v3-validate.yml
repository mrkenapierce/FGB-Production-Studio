name: Validate YouTube v3 Rebuild

on:
  pull_request:
    paths:
      - 'services/fgbears-live/youtube-v3/**'
      - 'services/fgbears-live/bin/healthcheck.sh'
      - '.github/workflows/youtube-v3-validate.yml'
      - '.github/workflows/fgbears-live-monitor.yml'
  push:
    branches: [main]
    paths:
      - 'services/fgbears-live/youtube-v3/**'
      - 'services/fgbears-live/bin/healthcheck.sh'
      - '.github/workflows/youtube-v3-validate.yml'
      - '.github/workflows/fgbears-live-monitor.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build-only dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qrencode
          python3 -m pip install --user pillow

      - name: Build locked local creative
        run: |
          set -Eeuo pipefail
          python3 services/fgbears-live/youtube-v3/build-creatives.py
          python3 - <<'PY'
          from PIL import Image
          p='services/fgbears-live/youtube-v3/creatives/yt_rumble_trivia_redirect.png'
          im=Image.open(p); im.load(); assert im.size == (798,470)
          print('V3_CREATIVE=PASS')
          PY

      - name: Static current-topology invariants
        run: |
          set -Eeuo pipefail
          V3=services/fgbears-live/youtube-v3
          runner="$V3/run-youtube-v3.sh"
          verify="$V3/verify-youtube-v3.sh"
          cache="$V3/lovable-state-cache.py"
          overlay="$V3/youtube-v3-overlay.py"
          python3 -m py_compile "$overlay" "$cache"
          bash -n "$runner"; bash -n "$verify"
          ! grep -Eq 'urllib|urlopen|requests|http://|https://' "$overlay"
          grep -Fq 'HOLD_SECONDS = float' "$overlay"
          grep -Fq '"15"' "$overlay"
          grep -Fq 'class ConcealmentLatch' "$overlay"
          grep -Fq 'OUTPUT_REGION' "$overlay"
          grep -Fq '/api/public/fgbears/stream-routing' "$cache"
          grep -Fq 'fgb-stream-state/v1' "$cache"
          grep -Fq 'os.replace' "$cache"
          grep -Fq 'fps=30:start_time=0' "$runner"
          grep -Fq 'scale=640:360:flags=fast_bilinear' "$runner"
          grep -Fq -- '-video_size 399x235' "$runner"
          grep -Fq 'overlay=231:52:' "$runner"
          grep -Fq -- '-framerate 5' "$runner"
          grep -Fq -- '-r 30 -fps_mode cfr -g 60 -keyint_min 60 -sc_threshold 0' "$runner"
          grep -Fq -- '-threads 1' "$runner"
          test ! -e .github/workflows/youtube-v3-deploy.yml
          test ! -e .github/workflows/trigger-youtube-v3-deploy-once.yml
          test ! -e .github/workflows/youtube-v3-release-once.yml
          test ! -e .github/workflows/restore-v2-health-supervision-20260903.yml
          echo 'V3_STATIC_ARCHITECTURE=PASS current_only=yes hold=15s output=640x360 overlay_pipe=399x235 cadence=30fps'

      - name: Exercise concealment latch and routing guards
        env:
          YOUTUBE_V3_CREATIVE_DIR: ${{ github.workspace }}/services/fgbears-live/youtube-v3/creatives
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import importlib.util, sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          p=Path('services/fgbears-live/youtube-v3/youtube-v3-overlay.py')
          spec=importlib.util.spec_from_file_location('v3',p)
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          assert m.HOLD_SECONDS == 15.0
          assert m.OUTPUT_REGION == {'x':231,'y':52,'width':399,'height':235,'referenceWidth':640,'referenceHeight':360}
          latch=m.ConcealmentLatch(15.0)
          assert latch.update(True,now=10.0)
          assert latch.update(False,now=24.999)
          assert not latch.update(False,now=25.001)
          assert latch.update(True,now=30.0)
          assert latch.update(False,now=40.0)
          assert latch.update(True,now=40.1)
          assert latch.update(False,now=55.099)
          assert not latch.update(False,now=55.101)
          region={"x":462,"y":104,"width":798,"height":470,"coordinateSpace":"pixels","referenceWidth":1280,"referenceHeight":720}
          def iso(seconds): return (datetime.now(timezone.utc)+timedelta(seconds=seconds)).isoformat().replace('+00:00','Z')
          def payload(enabled=True, visible=True, redirect=True):
              return {"schemaVersion":"fgb-stream-state/v1","generatedAt":iso(-1),"validUntil":iso(4),"revision":"rtest","presentation":{"adBreak":{"active":False},"trivia":{"questionVisible":visible,"youtubeRedirectRequired":redirect},"routing":{"rumble":{"rendersRealQuestion":True},"youtube":{"differenceLayer":{"enabled":enabled,"creativeKey":"yt_rumble_trivia_redirect","region":region}}},"mask":{"region":region}}}
          pres,key=m.validate(payload()); assert m.should_cover(pres,key)
          pres,key=m.validate(payload(visible=False)); assert not m.should_cover(pres,key)
          pres,key=m.validate(payload(redirect=False)); assert not m.should_cover(pres,key)
          pres,key=m.validate(payload(enabled=False)); assert not m.should_cover(pres,key)
          assert len(m.build_frame('yt_rumble_trivia_redirect')) == 399*235*4
          print('V3_LATCH=PASS minimum_hold=15s output=640x360')
          PY

      - name: Exercise cache validator
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import importlib.util, sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          p=Path('services/fgbears-live/youtube-v3/lovable-state-cache.py')
          spec=importlib.util.spec_from_file_location('cache',p)
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          region={"x":462,"y":104,"width":798,"height":470,"coordinateSpace":"pixels","referenceWidth":1280,"referenceHeight":720}
          def iso(s): return (datetime.now(timezone.utc)+timedelta(seconds=s)).isoformat().replace('+00:00','Z')
          payload={"schemaVersion":"fgb-stream-state/v1","generatedAt":iso(-1),"validUntil":iso(4),"revision":"rtest","presentation":{"adBreak":{"active":False},"trivia":{"phase":"revealed","questionVisible":True,"youtubeRedirectRequired":True},"routing":{"rumble":{"rendersRealQuestion":True},"youtube":{"differenceLayer":{"enabled":True,"creativeKey":"yt_rumble_trivia_redirect","region":region}}},"overlay":{},"crawl":{},"news":{},"schedule":{},"mask":{"region":region}}}
          assert m.validate(payload)['revision']=='rtest'
          print('V3_CACHE_VALIDATION=PASS')
          PY
