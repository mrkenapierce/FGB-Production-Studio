name: Validate YouTube v3 Rebuild

on:
  pull_request:
    paths:
      - 'services/fgbears-live/youtube-v3/**'
      - 'services/fgbears-live/quarantine/youtube-v2-retired-20260903/**'
      - 'services/fgbears-live/bin/healthcheck.sh'
      - '.github/workflows/youtube-v3-*.yml'
      - '.github/workflows/fgbears-live-monitor.yml'
  push:
    branches: [main]
    paths:
      - 'services/fgbears-live/youtube-v3/**'
      - 'services/fgbears-live/quarantine/youtube-v2-retired-20260903/**'
      - 'services/fgbears-live/bin/healthcheck.sh'
      - '.github/workflows/youtube-v3-*.yml'
      - '.github/workflows/fgbears-live-monitor.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user pillow qrcode

      - name: Build locked local creative
        run: |
          set -Eeuo pipefail
          python3 services/fgbears-live/youtube-v3/build-creatives.py
          python3 - <<'PY'
          from PIL import Image
          p='services/fgbears-live/youtube-v3/creatives/yt_rumble_trivia_redirect.png'
          im=Image.open(p); im.load(); assert im.size == (798,470)
          print('V3_CREATIVE=PASS')
          PY

      - name: Static architecture invariants
        run: |
          set -Eeuo pipefail
          runner=services/fgbears-live/youtube-v3/run-youtube-v3.sh
          verify=services/fgbears-live/youtube-v3/verify-youtube-v3.sh
          cache=services/fgbears-live/youtube-v3/lovable-state-cache.py
          overlay=services/fgbears-live/youtube-v3/youtube-v3-overlay.py
          youtube_unit=services/fgbears-live/youtube-v3/fgbears-youtube-v3.service
          cache_unit=services/fgbears-live/youtube-v3/fgbears-lovable-state-cache.service
          health=services/fgbears-live/bin/healthcheck.sh
          deploy=.github/workflows/youtube-v3-deploy.yml
          monitor=.github/workflows/fgbears-live-monitor.yml
          python3 -m py_compile "$overlay" "$cache"
          bash -n "$runner"; bash -n "$verify"; bash -n "$health"
          grep -Fq 'FPS = 5.0' "$overlay"
          ! grep -Eq 'urllib|urlopen|requests|http://|https://' "$overlay"
          grep -Fq '/api/public/fgbears/stream-routing' "$cache"
          grep -Fq 'fgb-stream-state/v1' "$cache"
          grep -Fq 'os.replace' "$cache"
          grep -Fq 'validUntil' "$overlay"
          grep -Fq 'FGB_CONTROL_STATE_FILE=/run/fgbears-control-plane/stream-state.json' "$youtube_unit"
          grep -Fq 'Wants=network-online.target fgbears-lovable-state-cache.service' "$youtube_unit"
          ! grep -Fq 'Requires=fgbears-lovable-state-cache.service' "$youtube_unit"
          grep -Fq 'RuntimeDirectory=fgbears-control-plane' "$cache_unit"
          grep -Fq 'fifo_size=2000000&overrun_nonfatal=1&reuse=1' "$runner"
          grep -Fq -- '-probesize 10000000 -analyzeduration 10000000' "$runner"
          grep -Fq 'fps=24:start_time=0' "$runner"
          grep -Fq 'N/(24*TB)' "$runner"
          grep -Fq -- '-framerate 5' "$runner"
          grep -Fq 'N/(5*TB)' "$runner"
          grep -Fq 'overlay=462:104:format=auto:shortest=0:repeatlast=1:eof_action=repeat[composited]' "$runner"
          grep -Fq 'scale=1152:648:flags=fast_bilinear[v]' "$runner"
          grep -Fq -- '-r 24 -fps_mode cfr -g 48 -keyint_min 48 -sc_threshold 0' "$runner"
          grep -Fq -- '-threads 1' "$runner"
          grep -Fq 'measure_rate' "$verify"
          grep -Fq 'renderer_contains_network_io' "$verify"
          grep -Fq 'lovable_cache_inactive' "$verify"
          grep -Fq 'recover_youtube_destination' "$health"
          ! grep -Eq '^Nice=|^CPUWeight=' "$youtube_unit"
          test ! -d services/fgbears-live/youtube-v2
          test -d services/fgbears-live/quarantine/youtube-v2-retired-20260903
          ! grep -Fq 'systemctl restart fgbears-live.service' "$deploy"
          ! grep -Fq 'systemctl restart fgbears-rumble-relay.service' "$deploy"
          grep -Fq 'SAFE_V2_ROLLBACK_ACTIVE' "$monitor"
          echo 'V3_STATIC_ARCHITECTURE=PASS control=lovable-single-contract cache=independent renderer=local-only media=1152x648@24 overlay=5fps'

      - name: Exercise local-state routing guards
        env:
          YOUTUBE_V3_CREATIVE_DIR: ${{ github.workspace }}/services/fgbears-live/youtube-v3/creatives
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import importlib.util, json, os, sys, tempfile, time
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          p=Path('services/fgbears-live/youtube-v3/youtube-v3-overlay.py')
          spec=importlib.util.spec_from_file_location('v3',p)
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          assert m.FPS == 5.0
          assert 'urllib' not in p.read_text()
          region={"x":462,"y":104,"width":798,"height":470,"coordinateSpace":"pixels","referenceWidth":1280,"referenceHeight":720}
          def iso(seconds): return (datetime.now(timezone.utc)+timedelta(seconds=seconds)).isoformat().replace('+00:00','Z')
          def payload(**patch):
              trivia={"active":True,"stale":False,"phase":"question","gameVisible":True,"youtubeRedirectRequired":True}
              ad={"active":False,"adsVisible":False,"isAdBreak":False}
              diff={"enabled":True,"creativeKey":"yt_rumble_trivia_redirect","reason":"question_phase","region":region,"presentationMode":"full_creative_scaled"}
              for k,v in patch.items():
                  if k.startswith('trivia_'): trivia[k[7:]]=v
                  elif k.startswith('ad_'): ad[k[3:]]=v
                  else: diff[k]=v
              return {"schemaVersion":"fgb-stream-state/v1","generatedAt":iso(-1),"validUntil":iso(4),"revision":"rtest",
                      "presentation":{"adBreak":ad,"trivia":trivia,"routing":{"rumble":{"rendersRealQuestion":True},"youtube":{"differenceLayer":diff}},"overlay":{},"crawl":{},"news":{},"schedule":{},"mask":{"region":region}}}
          pres,key=m.validate(payload()); assert m.should_cover(pres,key)
          assert len(m.build_frame('yt_rumble_trivia_redirect')) == 798*470*4
          cases=[
            payload(trivia_phase='revealed'), payload(trivia_stale=True), payload(trivia_gameVisible=False),
            payload(trivia_youtubeRedirectRequired=False), payload(ad_active=True), payload(enabled=False),
            payload(creativeKey='unknown_creative')]
          for x in cases:
              try:
                  pres,key=m.validate(x)
                  assert not m.should_cover(pres,key)
              except ValueError:
                  pass
          expired=payload(); expired['validUntil']=iso(-1)
          try: m.validate(expired); raise AssertionError('expired state accepted')
          except ValueError: pass
          print('V3_LOCAL_STATE_GUARDS=PASS transparent_failures=stale,expired,ad-break,non-question,unknown-creative,ambiguous')
          PY

      - name: Exercise cache validator
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import importlib.util, sys, time
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          p=Path('services/fgbears-live/youtube-v3/lovable-state-cache.py')
          spec=importlib.util.spec_from_file_location('cache',p)
          m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          region={"x":462,"y":104,"width":798,"height":470,"coordinateSpace":"pixels","referenceWidth":1280,"referenceHeight":720}
          def iso(s): return (datetime.now(timezone.utc)+timedelta(seconds=s)).isoformat().replace('+00:00','Z')
          base={"schemaVersion":"fgb-stream-state/v1","generatedAt":iso(-1),"validUntil":iso(4),"revision":"rtest",
            "presentation":{"adBreak":{"active":False},"trivia":{"phase":"question","stale":False,"gameVisible":True,"youtubeRedirectRequired":True},
            "routing":{"rumble":{"rendersRealQuestion":True},"youtube":{"differenceLayer":{"enabled":True,"creativeKey":"yt_rumble_trivia_redirect","region":region}}},
            "overlay":{},"crawl":{},"news":{},"schedule":{},"mask":{"region":region}}}
          assert m.validate(base)['revision']=='rtest'
          bad=dict(base); bad['schemaVersion']='wrong'
          try: m.validate(bad); raise AssertionError('bad schema accepted')
          except ValueError: pass
          print('V3_CACHE_VALIDATION=PASS')
          PY

      - name: Quarantine boundary
        run: |
          set -Eeuo pipefail
          if find services/fgbears-live/quarantine/youtube-v2-retired-20260903 -type f -perm /111 -print -quit | grep -q .; then
            echo 'Executable file found in v2 repository quarantine' >&2; exit 1
          fi
          test "$(find services/fgbears-live/youtube-v3 -maxdepth 1 -name '*.service' | wc -l)" -eq 2
          echo 'V3_QUARANTINE_BOUNDARY=PASS'
