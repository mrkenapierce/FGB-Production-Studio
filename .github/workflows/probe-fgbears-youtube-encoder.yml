# Read-only Oracle encoder/capacity probe.
name: Probe FGBears YouTube Encoder Capacity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-fgbears-youtube-encoder.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Oracle deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Trust Oracle host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Probe shape and OCI control-plane access
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== INSTANCE SHAPE ==='
          metadata=$(curl -fsS -H 'Authorization: Bearer Oracle' http://169.254.169.254/opc/v2/instance/)
          printf '%s' "$metadata" | python3 -c 'import json,sys; d=json.load(sys.stdin); sc=d.get("shapeConfig") or {}; print("shape="+str(d.get("shape"))); print("ocpus="+str(sc.get("ocpus"))); print("memory_gb="+str(sc.get("memoryInGBs"))); print("region="+str(d.get("region"))); print("availability_domain="+str(d.get("availabilityDomain")))'
          instance_id=$(printf '%s' "$metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          echo '=== OCI CLI ==='
          if command -v oci >/dev/null 2>&1; then
            echo 'oci_cli=present'
            set +e
            result=$(oci compute instance get --instance-id "$instance_id" --auth instance_principal --query 'data.{shape:shape,ocpus:"shape-config".ocpus,memory:"shape-config"."memory-in-gbs",state:"lifecycle-state"}' --raw-output 2>&1)
            rc=$?
            set -e
            echo "instance_principal_read_rc=$rc"
            if [[ $rc -eq 0 ]]; then
              printf '%s\n' "$result"
            else
              printf '%s\n' "$result" | sed -E 's/(request-id:)[^ ]+/\1[REDACTED]/Ig' | head -n 12
            fi
          else
            echo 'oci_cli=absent'
          fi

          echo '=== LOCAL CAPACITY ==='
          printf 'nproc='; nproc
          free -g | awk '/^Mem:/ {print "memory_total_gb=" $2 " memory_available_gb=" $7}'
          systemctl is-active fgbears-live.service
          systemctl is-active fgbears-youtube-relay.service
          systemctl is-active fgbears-rumble-relay.service
          REMOTE
