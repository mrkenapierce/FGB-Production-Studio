# Read-only media acquisition probe. No production files or services are changed.
name: Probe FGBears YouTube Encoder Capacity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-fgbears-youtube-encoder.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test existing YouTube authentication for Episode 32
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
        run: |
          set -Eeuo pipefail
          cookies=''
          source_name=''
          if [[ -n "$YOUTUBE_COOKIES" ]]; then
            cookies="$YOUTUBE_COOKIES"; source_name=YOUTUBE_COOKIES
          elif [[ -n "$YT_COOKIES" ]]; then
            cookies="$YT_COOKIES"; source_name=YT_COOKIES
          elif [[ -n "$YOUTUBE_COOKIES_TXT" ]]; then
            cookies="$YOUTUBE_COOKIES_TXT"; source_name=YOUTUBE_COOKIES_TXT
          fi
          if [[ -z "$cookies" ]]; then
            echo 'YOUTUBE_COOKIE_SECRET=ABSENT'
            exit 0
          fi
          echo "YOUTUBE_COOKIE_SECRET=PRESENT:$source_name"
          printf '%s' "$cookies" > /tmp/youtube-cookies.txt
          chmod 600 /tmp/youtube-cookies.txt
          python3 -m pip install --disable-pip-version-check --quiet --upgrade yt-dlp
          python3 -m yt_dlp \
            --cookies /tmp/youtube-cookies.txt \
            --no-playlist \
            --simulate \
            --js-runtimes node \
            --print '%(id)s|%(title)s' \
            'https://www.youtube.com/watch?v=PUsi9hNXnhw'
          rm -f /tmp/youtube-cookies.txt
          echo 'EPISODE_32_AUTHENTICATED_ACCESS=READY'

      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify production remains active
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          echo "PLAYLIST_EPISODES=$(grep -c '^file .*FGBears-Episode-' /srv/fgbears-live/playlist.ffconcat || true)"
          echo "PROFILE_COUNT=$(find /srv/fgbears-live/media -maxdepth 1 -type f -name 'FGBears-Episode-*.mp4.audio-profile.json' | wc -l | tr -d ' ')"
          pgrep -af 'normalize|loudnorm|FGBears-Episode' || true
          echo 'production_active=yes'
          REMOTE