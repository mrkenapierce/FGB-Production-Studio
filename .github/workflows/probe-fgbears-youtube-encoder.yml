# Read-only Oracle control-plane access probe.
name: Probe FGBears YouTube Encoder Capacity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-fgbears-youtube-encoder.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Test OCI instance-principal access without production changes
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          metadata=$(curl -fsS -H 'Authorization: Bearer Oracle' http://169.254.169.254/opc/v2/instance/)
          instance_id=$(printf '%s' "$metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          printf '%s' "$metadata" | python3 -c 'import json,sys; d=json.load(sys.stdin); sc=d.get("shapeConfig") or {}; print("shape="+str(d.get("shape"))+" ocpus="+str(sc.get("ocpus"))+" memory_gb="+str(sc.get("memoryInGBs")))'

          if python3 -c 'import oci' >/dev/null 2>&1; then
            echo 'oci_python_sdk=present'
          else
            echo 'oci_python_sdk=absent'
          fi
          if python3 -m venv --help >/dev/null 2>&1; then
            echo 'python_venv=present'
          else
            echo 'python_venv=absent'
          fi
          if python3 -m pip --version >/dev/null 2>&1; then
            echo 'python_pip=present'
          else
            echo 'python_pip=absent'
          fi
          [[ -f "$HOME/.oci/config" ]] && echo 'user_oci_config=present' || echo 'user_oci_config=absent'
          [[ -f /etc/oci/config ]] && echo 'system_oci_config=present' || echo 'system_oci_config=absent'

          # If SDK is already installed, attempt only a read via instance principal.
          if python3 -c 'import oci' >/dev/null 2>&1; then
            set +e
            python3 - "$instance_id" <<'PY'
import sys
import oci
instance_id=sys.argv[1]
try:
    signer=oci.auth.signers.InstancePrincipalsSecurityTokenSigner()
    client=oci.core.ComputeClient(config={}, signer=signer)
    obj=client.get_instance(instance_id).data
    print(f'instance_principal_read=success shape={obj.shape} ocpus={obj.shape_config.ocpus} memory_gb={obj.shape_config.memory_in_gbs} state={obj.lifecycle_state}')
except Exception as exc:
    print('instance_principal_read=failed type='+type(exc).__name__)
    raise SystemExit(7)
PY
            rc=$?
            set -e
            echo "instance_principal_read_rc=$rc"
          fi
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          systemctl is-active --quiet fgbears-rumble-relay.service
          echo 'production_untouched=yes'
          REMOTE
