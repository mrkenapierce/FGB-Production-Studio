# Read-only media acquisition probe. No production files or services are changed.
name: Probe FGBears YouTube Encoder Capacity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-fgbears-youtube-encoder.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Test Episode 32 with PO-token provider
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet --upgrade yt-dlp bgutil-ytdlp-pot-provider
          rm -rf /tmp/bgutil-ytdlp-pot-provider
          git clone --quiet --depth 1 --branch 1.3.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil-ytdlp-pot-provider
          pushd /tmp/bgutil-ytdlp-pot-provider/server >/dev/null
          npm ci --silent
          npx tsc
          node build/main.js >/tmp/bgutil-provider.log 2>&1 &
          provider_pid=$!
          popd >/dev/null
          trap 'kill "$provider_pid" 2>/dev/null || true; cat /tmp/bgutil-provider.log || true' EXIT
          for _ in $(seq 1 30); do
            if ss -ltn | grep -q ':4416 '; then
              break
            fi
            sleep 1
          done
          ss -ltn | grep -q ':4416 '
          python3 -m yt_dlp -v \
            --no-playlist \
            --simulate \
            --js-runtimes node \
            --extractor-args 'youtube:player_client=mweb' \
            --print '%(id)s|%(title)s' \
            'https://www.youtube.com/watch?v=PUsi9hNXnhw'
          echo 'EPISODE_32_PO_TOKEN_ACCESS=READY'

      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify production remains untouched
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          echo "PLAYLIST_EPISODES=$(grep -c '^file .*FGBears-Episode-' /srv/fgbears-live/playlist.ffconcat || true)"
          echo "PROFILE_COUNT=$(find /srv/fgbears-live/media -maxdepth 1 -type f -name 'FGBears-Episode-*.mp4.audio-profile.json' | wc -l | tr -d ' ')"
          pgrep -af 'normalize|loudnorm|FGBears-Episode' || true
          echo 'production_untouched=yes'
          REMOTE