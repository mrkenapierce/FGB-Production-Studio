name: Validate FGBears Live

on:
  pull_request:
    paths:
      - 'services/fgbears-live/**'
      - '.github/workflows/fgbears-live-validate.yml'
      - '.github/workflows/fgbears-live-monitor.yml'
      - '.github/workflows/fgbears-stream-health-audit.yml'
  push:
    branches: [main]
    paths:
      - 'services/fgbears-live/**'
      - '.github/workflows/fgbears-live-validate.yml'
      - '.github/workflows/fgbears-live-monitor.yml'
      - '.github/workflows/fgbears-stream-health-audit.yml'

permissions:
  contents: read

concurrency:
  group: fgbears-live-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install only missing validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          command -v shellcheck >/dev/null 2>&1 || missing+=(shellcheck)
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v jq >/dev/null 2>&1 || missing+=(jq)
          python3 -c 'from PIL import Image' >/dev/null 2>&1 || missing+=(python3-pil)
          if ((${#missing[@]})); then
            echo "Installing missing validation tools: ${missing[*]}"
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${missing[@]}"
          else
            echo 'Validation toolchain already present; skipping apt.'
          fi

      - name: ShellCheck
        run: shellcheck --severity=error services/fgbears-live/bin/*.sh services/fgbears-live/tests/*.sh
      - name: Production invariants
        run: bash services/fgbears-live/tests/test-production-invariants.sh
      - name: Integration scripts
        run: bash services/fgbears-live/tests/test-scripts.sh
      - name: Multistream and YouTube relay
        run: bash services/fgbears-live/tests/test-multistream.sh
      - name: House label
        run: python3 services/fgbears-live/tests/test-house-label.py
      - name: Ad interstitial
        run: python3 services/fgbears-live/tests/test-ad-interstitial.py
      - name: Ad image fit
        run: python3 services/fgbears-live/tests/test-ad-image-fit.py
      - name: Bears news
        run: bash services/fgbears-live/tests/test-bears-news.sh
      - name: Health monitor
        run: bash services/fgbears-live/tests/test-health-monitor.sh
