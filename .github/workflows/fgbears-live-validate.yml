name: Validate FGBears Live

on:
  pull_request:
    paths:
      - 'services/fgbears-live/**'
      - '.github/workflows/fgbears-live-validate.yml'
      - '.github/workflows/fgbears-live-monitor.yml'
      - '.github/workflows/fgbears-stream-health-audit.yml'
  push:
    branches: [main]
    paths:
      - 'services/fgbears-live/**'
      - '.github/workflows/fgbears-live-validate.yml'
      - '.github/workflows/fgbears-live-monitor.yml'
      - '.github/workflows/fgbears-stream-health-audit.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck ffmpeg jq python3-pil qrencode
      - name: ShellCheck
        run: shellcheck services/fgbears-live/bin/*.sh services/fgbears-live/tests/*.sh
      - name: Functional tests
        run: |
          bash services/fgbears-live/tests/test-scripts.sh
          python3 services/fgbears-live/tests/test-house-label.py
          bash services/fgbears-live/tests/test-bears-news.sh
          bash services/fgbears-live/tests/test-health-monitor.sh
