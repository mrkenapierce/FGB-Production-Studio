name: Deploy YouTube Freeze Box

on:
  push:
    branches: [main]
    paths:
      - '.github/freezebox/**'
      - '.github/workflows/deploy-youtube-freeze-box.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-freeze-box
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate staged freeze-box files
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n .github/freezebox/youtube-freeze-card-refresh.sh
          python3 -m py_compile .github/freezebox/youtube-stream-router-freezebox.py
          grep -Fq 'router = getattr(emergency, "router", None)' .github/freezebox/youtube-stream-router-freezebox.py
          grep -Fq 'MASK_X=480' .github/freezebox/youtube-freeze-card-refresh.sh
          grep -Fq 'MASK_Y=200' .github/freezebox/youtube-freeze-card-refresh.sh
          grep -Fq 'MASK_W=640' .github/freezebox/youtube-freeze-card-refresh.sh
          grep -Fq 'MASK_H=360' .github/freezebox/youtube-freeze-card-refresh.sh
          grep -Fq 'TRIVIA IS LIVE ON RUMBLE' .github/freezebox/youtube-freeze-card-refresh.sh
          echo 'STAGED_FREEZE_BOX_VALIDATION=PASS'

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Install hot-reload router and scheduled refresher
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          repo=/tmp/fgb-freezebox-deploy
          unit=/etc/systemd/system/fgbears-youtube-router.service
          backup=/tmp/fgbears-youtube-router.service.pre-freezebox
          dynamic=/var/lib/fgbears-live/youtube-freeze-card.h264
          original=/opt/fgbears-live/assets/youtube-rumble-trivia.h264
          cutover_started=0
          success=0

          master_before=$(systemctl show -p MainPID --value fgbears-live.service)
          rumble_before=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          router_before=$(systemctl show -p MainPID --value fgbears-youtube-router.service)
          [[ "$master_before" =~ ^[1-9][0-9]*$ ]]
          [[ "$rumble_before" =~ ^[1-9][0-9]*$ ]]
          [[ "$router_before" =~ ^[1-9][0-9]*$ ]]
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-rumble-relay.service
          systemctl is-active --quiet fgbears-youtube-router.service

          rollback() {
            rc=$?
            if (( success == 0 && cutover_started == 1 )); then
              echo 'FREEZE_BOX_ROLLBACK=START'
              sudo systemctl disable --now fgbears-youtube-freeze-card-refresh.timer >/dev/null 2>&1 || true
              if [[ -s "$backup" ]]; then
                sudo install -m 0644 "$backup" "$unit"
                sudo systemctl daemon-reload
                sudo systemctl reset-failed fgbears-youtube-router.service || true
                sudo systemctl restart fgbears-youtube-router.service || true
              fi
              echo 'FREEZE_BOX_ROLLBACK=DONE'
            fi
            exit "$rc"
          }
          trap rollback ERR INT TERM

          rm -rf "$repo"
          git clone --depth 1 https://github.com/mrkenapierce/FGB-Production-Studio.git "$repo" >/dev/null
          sudo cp "$unit" "$backup"

          sudo install -m 0755 "$repo/.github/freezebox/youtube-stream-router-freezebox.py" /opt/fgbears-live/bin/youtube-stream-router-freezebox.py
          sudo install -m 0755 "$repo/.github/freezebox/youtube-freeze-card-refresh.sh" /usr/local/bin/fgbears-youtube-freeze-card-refresh
          sudo install -m 0644 "$repo/.github/freezebox/fgbears-youtube-freeze-card-refresh.service" /etc/systemd/system/fgbears-youtube-freeze-card-refresh.service
          sudo install -m 0644 "$repo/.github/freezebox/fgbears-youtube-freeze-card-refresh.timer" /etc/systemd/system/fgbears-youtube-freeze-card-refresh.timer
          sudo install -d -m 0755 -o fgbears -g fgbears /var/lib/fgbears-live

          # Start with the proven full-screen emergency card. It remains the
          # fail-safe until the scheduled refresher publishes the first small-box
          # freeze frame. This makes the rollout independent of the current game phase.
          if [[ ! -s "$dynamic" ]]; then
            sudo cp "$original" "$dynamic"
            sudo chown fgbears:fgbears "$dynamic"
            sudo chmod 0644 "$dynamic"
          fi
          sudo -u fgbears /usr/bin/python3 /opt/fgbears-live/bin/youtube-stream-router-emergency.py --card "$dynamic" --validate-card >/tmp/freezebox-seed-validate.json
          grep -q '"ok": true' /tmp/freezebox-seed-validate.json

          # Execute the exact candidate wrapper BEFORE changing the systemd unit.
          # This validates the delegated production router API, emergency transport
          # patch import, CLI path, and candidate card without touching YouTube.
          sudo -u fgbears /usr/bin/python3 /opt/fgbears-live/bin/youtube-stream-router-freezebox.py --card "$dynamic" --validate-card >/tmp/freezebox-wrapper-validate.json
          cat /tmp/freezebox-wrapper-validate.json
          grep -q '"ok": true' /tmp/freezebox-wrapper-validate.json
          echo 'FREEZE_BOX_WRAPPER_PREFLIGHT=PASS'
          sudo systemctl daemon-reload

          # Wait only until the real question is NOT exposed. Ads/reveals/transitions
          # are acceptable because the new router initially renders the same fallback.
          python3 - <<'PY'
          import json, time, urllib.request
          url='https://epiccontentcreatorgrants.org/api/public/fgbears/stream-routing'
          deadline=time.time()+120
          while time.time()<deadline:
              try:
                  req=urllib.request.Request(url+'?_cutover='+str(time.time_ns()),headers={
                      'Cache-Control':'no-cache','Pragma':'no-cache','Accept':'application/json',
                      'User-Agent':'FGBears-YouTube-FreezeCutover/1.1'})
                  with urllib.request.urlopen(req,timeout=3) as r: p=json.loads(r.read())
                  t=p.get('trivia') if isinstance(p,dict) else None
                  if isinstance(t,dict) and t.get('phase') != 'question' and t.get('youtubeMaskActive') is not True:
                      print('CUTOVER_WINDOW=SAFE phase='+str(t.get('phase')))
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print('waiting for safe cutover:',exc)
              time.sleep(1)
          raise SystemExit('No non-question cutover window within 120 seconds')
          PY

          sudo install -m 0644 "$repo/.github/freezebox/fgbears-youtube-router.service" "$unit"
          sudo systemctl daemon-reload
          cutover_started=1
          sudo systemctl reset-failed fgbears-youtube-router.service
          sudo systemctl restart fgbears-youtube-router.service

          connected=0
          for i in $(seq 1 50); do
            if systemctl is-active --quiet fgbears-youtube-router.service; then
              router_pid=$(systemctl show -p MainPID --value fgbears-youtube-router.service)
              child=$(pgrep -P "$router_pid" ffmpeg | head -n1 || true)
              if [[ "$child" =~ ^[1-9][0-9]*$ ]] && sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$child" | grep -Eq ':443([[:space:]]|$)'; then
                connected=1
                break
              fi
            fi
            sleep 1
          done
          test "$connected" = 1

          master_after=$(systemctl show -p MainPID --value fgbears-live.service)
          rumble_after=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          router_after=$(systemctl show -p MainPID --value fgbears-youtube-router.service)
          test "$master_after" = "$master_before"
          test "$rumble_after" = "$rumble_before"
          test "$router_after" != "$router_before"

          # Prove that a completed card can be adopted without restarting YouTube.
          sudo touch "$dynamic"
          hot=0
          for i in $(seq 1 12); do
            if sudo journalctl -u fgbears-youtube-router.service --since '-30 seconds' --no-pager | grep -q 'hot-reloaded freeze-box card'; then
              hot=1
              break
            fi
            sleep 1
          done
          test "$hot" = 1

          sudo systemctl enable --now fgbears-youtube-freeze-card-refresh.timer
          systemctl is-active --quiet fgbears-youtube-freeze-card-refresh.timer
          systemctl is-enabled --quiet fgbears-youtube-freeze-card-refresh.timer

          echo "MASTER_PID_UNCHANGED=$master_after"
          echo "RUMBLE_PID_UNCHANGED=$rumble_after"
          echo "YOUTUBE_ROUTER_PID=$router_after"
          echo 'YOUTUBE_RTMPS_ESTABLISHED=yes'
          echo 'FREEZE_BOX_HOT_RELOAD=yes'
          echo 'FREEZE_BOX_TIMER=enabled_active'
          echo 'FREEZE_BOX_ROUTER_DEPLOY=PASS'
          success=1
          trap - ERR INT TERM
          REMOTE
