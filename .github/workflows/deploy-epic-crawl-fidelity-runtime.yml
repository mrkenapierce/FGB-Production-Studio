name: Deploy EPIC Crawl Fidelity Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-epic-crawl-fidelity-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Install crawl fidelity update
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/oracle_key services/fgbears-live/bin/crawl-overlay.py "$ORACLE_USER@$ORACLE_HOST:/tmp/crawl-overlay.py"
          scp -i ~/.ssh/oracle_key .github/scripts/fgb-runtime-youtube-only.py "$ORACLE_USER@$ORACLE_HOST:/tmp/fgb-runtime-youtube-only.py"
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo install -m 0755 /tmp/crawl-overlay.py /opt/fgbears-live/bin/crawl-overlay.py && sudo python3 /tmp/fgb-runtime-youtube-only.py'

      - name: Remove retired social units and restart YouTube program
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          for unit in fgbears-x-relay.service fgbears-x-start.service fgbears-x-stop.service fgbears-x-start.timer fgbears-x-stop.timer fgbears-instagram-relay.service fgbears-instagram-start.service fgbears-instagram-stop.service fgbears-instagram-start.timer fgbears-instagram-stop.timer fgbears-facebook-relay.service fgbears-facebook-start.service fgbears-facebook-stop.service fgbears-facebook-start.timer fgbears-facebook-stop.timer; do
            sudo systemctl disable --now "$unit" >/dev/null 2>&1 || true
          done
          sudo rm -f /etc/systemd/system/fgbears-x-* /etc/systemd/system/fgbears-instagram-* /etc/systemd/system/fgbears-facebook-* || true
          sudo rm -f /usr/local/bin/fgbears-x-* /usr/local/bin/fgbears-instagram-* /usr/local/bin/fgbears-facebook-* || true
          sudo systemctl daemon-reload
          sudo systemctl reset-failed fgbears-youtube-relay.service fgbears-live.service || true
          sudo systemctl restart fgbears-youtube-relay.service
          sudo systemctl restart fgbears-live.service
          REMOTE

      - name: Verify crawl fidelity and production health
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          for i in $(seq 1 60); do
            if systemctl is-active --quiet fgbears-live.service && systemctl is-active --quiet fgbears-youtube-relay.service && curl -fsS --max-time 1 http://127.0.0.1:8788/healthz >/tmp/crawl-health.json; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          cat /tmp/crawl-health.json
          grep -Fq 'CRAWL_SPEED_SCALE", "0.72"' /opt/fgbears-live/bin/crawl-overlay.py
          grep -Fq 'speed_pps * SPEED_SCALE' /opt/fgbears-live/bin/crawl-overlay.py
          grep -Fq 'quality=96' /opt/fgbears-live/bin/crawl-overlay.py
          grep -Fq 'subsampling=0' /opt/fgbears-live/bin/crawl-overlay.py
          grep -Fq 'YouTube local UDP mirror only' /usr/local/bin/fgbears-start-stream
          ! grep -Eq '1937|1938|X local mirror|Instagram local mirror|Facebook local mirror' /usr/local/bin/fgbears-start-stream
          ! grep -Eq '^(X_|INSTAGRAM_|FACEBOOK_)' /etc/fgbears-live/stream.env
          ! systemctl is-active --quiet fgbears-x-relay.service
          ! systemctl is-active --quiet fgbears-instagram-relay.service
          ! systemctl is-active --quiet fgbears-facebook-relay.service

          progress=/srv/fgbears-live/logs/ffmpeg-progress.log
          first_media=$(sed -n 's/^out_time_us=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          first_frame=$(sed -n 's/^frame=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          first_epoch=$(date +%s%N)
          sleep 10
          second_media=$(sed -n 's/^out_time_us=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          second_frame=$(sed -n 's/^frame=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          dropped=$(sed -n 's/^drop_frames=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          second_epoch=$(date +%s%N)
          awk -v m1="$first_media" -v m2="$second_media" -v f1="$first_frame" -v f2="$second_frame" -v e1="$first_epoch" -v e2="$second_epoch" -v dropped="${dropped:-0}" 'BEGIN { wall=(e2-e1)/1000000000; program=(m2-m1)/1000000; ratio=program/wall; fps=(f2-f1)/wall; printf "EPIC crawl deploy health: program=%.3fs wall=%.3fs ratio=%.3fx fps=%.2f dropped=%d\n", program, wall, ratio, fps, dropped; if (ratio < 0.95 || fps < 28.5 || dropped != 0) exit 1; }'
          REMOTE
