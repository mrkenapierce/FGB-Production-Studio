name: Verify Episode 034 Emergency Rollback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-rollback-episode034-rev7-user-report.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read-only post-rollback verification
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          YOUTUBE=fgbears-youtube-copy-relay.service
          FACEBOOK=fgbears-facebook-relay.service
          TIMER=fgbears-lovable-audio-sync.timer
          SYNC=fgbears-lovable-audio-sync.service
          AUDIO=/srv/fgbears-live/audio/fgb-music-loop.m4a
          GOOD_SHA=c8391464ae77eec19b85270d67522300202fe5494232581c55433f934b172a12
          REJECTED_SHA=c04e4fa32a5acc4200c2ef88e8bf43f7618998768ad8c58a716f7869a35a9e7a

          live_sha=$(sha256sum "$AUDIO" | awk '{print $1}')
          echo LIVE_SHA=$live_sha
          test "$live_sha" = "$GOOD_SHA"
          test "$live_sha" != "$REJECTED_SHA"

          systemctl is-active --quiet "$MASTER"
          systemctl is-active --quiet "$YOUTUBE"
          systemctl is-active --quiet "$FACEBOOK"
          test "$(systemctl is-active "$TIMER" 2>/dev/null || true)" != active
          test "$(systemctl is-active "$SYNC" 2>/dev/null || true)" != active

          mpid=$(systemctl show -p MainPID --value "$MASTER")
          ypid=$(systemctl show -p MainPID --value "$YOUTUBE")
          fpid=$(systemctl show -p MainPID --value "$FACEBOOK")
          [[ "$mpid" =~ ^[1-9][0-9]*$ ]]
          [[ "$ypid" =~ ^[1-9][0-9]*$ ]]
          [[ "$fpid" =~ ^[1-9][0-9]*$ ]]

          ffpid=$(pgrep -P "$mpid" -x ffmpeg | head -1 || true)
          test -n "$ffpid"
          ls -l "/proc/$ffpid/fd" 2>/dev/null | grep -Fq "$AUDIO"

          r1=$(awk '/^rchar:/{print $2}' "/proc/$ffpid/io")
          e1=$(ps -o etimes= -p "$ffpid" | tr -d ' ')
          sleep 5
          test "$(systemctl show -p MainPID --value "$MASTER")" = "$mpid"
          test "$(systemctl show -p MainPID --value "$YOUTUBE")" = "$ypid"
          test "$(systemctl show -p MainPID --value "$FACEBOOK")" = "$fpid"
          r2=$(awk '/^rchar:/{print $2}' "/proc/$ffpid/io")
          e2=$(ps -o etimes= -p "$ffpid" | tr -d ' ')
          echo MASTER_RCHAR=$r1-$r2
          echo MASTER_ELAPSED_SECONDS=$e1-$e2
          (( r2 > r1 ))
          (( e2 > e1 ))

          since=$(systemctl show -p ActiveEnterTimestamp --value "$MASTER")
          echo MASTER_ACTIVE_SINCE="$since"
          echo MASTER_PID=$mpid
          echo YOUTUBE_RELAY_PID=$ypid
          echo FACEBOOK_RELAY_PID=$fpid
          echo AUTO_SYNC_TIMER=$(systemctl is-active "$TIMER" 2>/dev/null || true)
          echo AUTO_SYNC_SERVICE=$(systemctl is-active "$SYNC" 2>/dev/null || true)
          echo REJECTED_SHA_QUARANTINED=$(find /srv/fgbears-live/quarantine/episode034-user-rejected -type f -name '*c04e-user-rejected.m4a' -print -quit 2>/dev/null || true)

          if journalctl -u "$MASTER" -u "$YOUTUBE" -u "$FACEBOOK" --since '-2 min' --no-pager | grep -Ei 'timestamp discontinuity|DTS .* out of order|Packet corrupt|dropping it|non.monoton'; then
            echo RECENT_TRANSPORT_WARNING=YES
          else
            echo RECENT_TRANSPORT_WARNING=NO
          fi
          echo POST_ROLLBACK_READ_ONLY_VERIFY=PASS
          REMOTE
