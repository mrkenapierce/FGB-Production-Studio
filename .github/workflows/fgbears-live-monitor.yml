name: Monitor FGBears Live

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-live-monitor.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: fgbears-live-production-monitor
  cancel-in-progress: true

env:
  ORACLE_USER: ubuntu

jobs:
  monitor:
    name: Read-only production topology and media health
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify production without restarting anything
        id: health
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set +e
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' > production-status.env <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          ROUTING=fgbears-youtube-lovable-routing.service
          COMP=fgbears-youtube-lovable-compositor.service
          LEGACY=fgbears-youtube-relay.service
          WATCHDOG_TIMER=fgbears-youtube-audio-watchdog.timer
          HEALTH_TIMER=fgbears-live-health.timer
          STATUS=/srv/fgbears-live/health/youtube-audio/status.env
          MONDIR=/run/fgbears-youtube-lovable-compositor

          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          active(){ systemctl is-active --quiet "$1"; }
          socket(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v port=":$port" 'index($0,q)&&index($0,port){ok=1} END{exit(ok?0:1)}'; }

          active "$MASTER"
          active "$RUMBLE"
          active "$ROUTING"
          active "$COMP"
          active "$WATCHDOG_TIMER"
          active "$HEALTH_TIMER"
          ! active "$LEGACY"

          MPID=$(pid "$MASTER"); RPID=$(pid "$RUMBLE"); CPID=$(pid "$COMP")
          socket "$RPID" 1935
          socket "$CPID" 443

          speed=$(sudo awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true)
          [[ -z "$speed" ]] || python3 -c 'import sys; assert float(sys.argv[1]) >= 0.98' "$speed"

          mask=$(curl -fsS --max-time 3 http://127.0.0.1:8791/healthz)
          printf '%s' "$mask" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True;assert p.get("sourceCanvas")==[1280,720];assert p.get("sourceMaskRegion")=={"x":462,"y":104,"width":798,"height":470};assert p.get("creativeKey")=="yt_rumble_trivia_redirect";assert p.get("routingAuthority")=="lovable_public_stream_routing";assert int(p.get("fps",0))==30'

          news=$(curl -fsS --max-time 3 http://127.0.0.1:8789/healthz)
          crawl=$(curl -fsS --max-time 3 http://127.0.0.1:8788/healthz)
          printf '%s' "$news" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True;assert int(p.get("fps",0))==30;assert int(p.get("scrollPps",0))==76;assert p.get("payloadSwap")=="next-cycle-boundary"'
          printf '%s' "$crawl" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True;assert int(p.get("fps",0))==30;assert p.get("payloadSwap")=="next-segment-boundary"'

          sudo test -s "$STATUS"
          now=$(date +%s)
          checked=$(sudo sed -n 's/^checked_epoch=\([0-9][0-9]*\)$/\1/p' "$STATUS" | tail -n1)
          state=$(sudo sed -n 's/^state=\([^[:space:]]*\)$/\1/p' "$STATUS" | tail -n1)
          owner=$(sudo sed -n 's/^owner=\([^[:space:]]*\)$/\1/p' "$STATUS" | tail -n1)
          [[ "$checked" =~ ^[0-9]+$ ]]
          age=$((now-checked))
          (( age >= 0 && age <= 180 ))
          [[ "$state" == OK || "$state" == WARN ]]
          [[ "$owner" == exact_box_compositor ]]

          SEG=$(sudo find "$MONDIR" -maxdepth 1 -type f -name 'monitor-*.ts' -printf '%T@ %p\n' 2>/dev/null | sort -nr | sed -n '2{s/^[^ ]* //;p;q;}')
          [[ -n "$SEG" && -s "$SEG" ]]
          sudo ffprobe -v fatal -show_entries stream=codec_type,codec_name,sample_rate,channels,width,height,r_frame_rate -of json "$SEG" | python3 -c 'import json,sys;p=json.load(sys.stdin);s=p.get("streams",[]);a=next(x for x in s if x.get("codec_type")=="audio");v=next(x for x in s if x.get("codec_type")=="video");assert a.get("codec_name")=="aac";assert int(a.get("sample_rate") or 0) in (44100,48000);assert int(a.get("channels") or 0)==2;assert int(v.get("width") or 0)>0 and int(v.get("height") or 0)>0;print("MEDIA video=%sx%s fps=%s audio=%sHz/%sch"%(v.get("width"),v.get("height"),v.get("r_frame_rate"),a.get("sample_rate"),a.get("channels")))'

          echo "OVERALL_STATUS=OK"
          echo "REASON=PRODUCTION_HEALTHY"
          echo "TOPOLOGY master=$MPID rumble=$RPID youtube=$CPID legacy=off master_speed=${speed:-unknown}x watchdog=$state age=${age}s"
          REMOTE
          rc=$?
          set -e
          cat production-status.env || true
          if (( rc != 0 )); then
            printf 'OVERALL_STATUS=FAIL\nREASON=PRODUCTION_AUDIT_FAILED\n' >> production-status.env
          fi
          status=$(sed -n 's/^OVERALL_STATUS=\(OK\|FAIL\)$/\1/p' production-status.env | tail -n1)
          reason=$(sed -n 's/^REASON=\([A-Z0-9_]*\)$/\1/p' production-status.env | tail -n1)
          [[ -n "$status" ]] || status=FAIL
          [[ -n "$reason" ]] || reason=INVALID_MONITOR_REPORT
          printf 'status=%s\nreason=%s\n' "$status" "$reason" >> "$GITHUB_OUTPUT"
          printf '## FGBears Live: %s\n\n```text\n' "$status" >> "$GITHUB_STEP_SUMMARY"
          cat production-status.env >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Manage stream incident
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STREAM_STATUS: ${{ steps.health.outputs.status }}
          STREAM_REASON: ${{ steps.health.outputs.reason }}
        run: |
          set -Eeuo pipefail
          status=${STREAM_STATUS:-FAIL}
          reason=${STREAM_REASON:-MONITOR_STEP_FAILED}
          gh label create stream-monitor --color B60205 --description 'Automated FGBears Live stream incident' --force
          issue=$(gh issue list --state open --label stream-monitor --json number --jq '.[0].number // empty')
          if [[ "$status" != OK ]]; then
            if [[ -z "$issue" ]]; then
              gh issue create --title '[Stream Monitor] FGBears Live incident' --label stream-monitor --body "Read-only production monitor detected \`$reason\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            exit 1
          fi
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "Recovered. Current monitoring run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
