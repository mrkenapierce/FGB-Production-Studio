name: Monitor FGBears Live

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-live-monitor.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: fgbears-live-production-monitor
  cancel-in-progress: true

env:
  ORACLE_USER: ubuntu

jobs:
  monitor:
    name: Read-only minimal-topology health
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify production without restarting anything
        id: health
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set +e
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' > production-status.env <<'REMOTE'
          set -u
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          YOUTUBE=fgbears-youtube-v2.service
          HEALTH_TIMER=fgbears-live-health.timer
          OVERLAY_STATE=/run/fgbears-youtube-v2/overlay-state.json
          LEGACY_UNITS=(
            fgbears-youtube-output.service
            fgbears-youtube-relay.service
            fgbears-youtube-router.service
            fgbears-youtube-lovable-routing.service
            fgbears-youtube-lovable-compositor.service
            fgbears-youtube-audio-watchdog.service
            fgbears-youtube-audio-watchdog.timer
          )

          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          active(){ systemctl is-active --quiet "$1"; }
          socket(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v port=":$port" 'index($0,q)&&index($0,port){ok=1} END{exit(ok?0:1)}'; }
          fail(){ echo 'OVERALL_STATUS=FAIL'; echo "REASON=$1"; exit 1; }

          active "$MASTER" || fail MASTER_INACTIVE
          active "$RUMBLE" || fail RUMBLE_INACTIVE
          active "$YOUTUBE" || fail YOUTUBE_V2_INACTIVE
          active "$HEALTH_TIMER" || fail MASTER_HEALTH_TIMER_INACTIVE

          for unit in "${LEGACY_UNITS[@]}"; do
            active "$unit" && fail "LEGACY_UNIT_ACTIVE_${unit//[^A-Za-z0-9]/_}"
            state=$(systemctl is-enabled "$unit" 2>/dev/null || true)
            [[ "$state" == masked* ]] || fail "LEGACY_UNIT_NOT_MASKED_${unit//[^A-Za-z0-9]/_}"
          done

          MPID=$(pid "$MASTER"); RPID=$(pid "$RUMBLE"); YPID=$(pid "$YOUTUBE")
          [[ "$MPID" =~ ^[1-9][0-9]*$ ]] || fail MASTER_PID_INVALID
          [[ "$RPID" =~ ^[1-9][0-9]*$ ]] || fail RUMBLE_PID_INVALID
          [[ "$YPID" =~ ^[1-9][0-9]*$ ]] || fail YOUTUBE_V2_PID_INVALID
          socket "$RPID" 1935 || fail RUMBLE_SOCKET_MISSING
          socket "$YPID" 443 || fail YOUTUBE_SOCKET_MISSING

          speed=$(sudo awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true)
          if [[ -n "$speed" ]] && ! python3 -c 'import sys; assert float(sys.argv[1]) >= 0.98' "$speed"; then
            fail MASTER_BELOW_REALTIME
          fi

          # Routing loss is deliberately non-fatal: the v2 worker writes a fresh
          # state and fails transparent while YouTube transport stays live.
          overlay_routing=UNKNOWN
          if sudo test -s "$OVERLAY_STATE"; then
            overlay_report=$(sudo python3 - "$OVERLAY_STATE" <<'PY'
          import json, os, sys, time
          path=sys.argv[1]
          p=json.load(open(path, encoding='utf-8'))
          assert p.get('maskRegion') == {
              'x':462,'y':104,'width':798,'height':470,
              'coordinateSpace':'pixels','referenceWidth':1280,'referenceHeight':720,
          }
          assert p.get('frameSize') == [798,470]
          assert p.get('routingAuthority') == 'lovable_public_stream_routing'
          assert float(p.get('fps') or 0) == 10.0
          age=time.time()-os.path.getmtime(path)
          assert 0 <= age < 120, age
          status='OK' if p.get('ok') is True else 'DEGRADED_FAIL_TRANSPARENT'
          print(f'{status} age={age:.1f}s active={str(bool(p.get("active"))).lower()} creative={p.get("creativeKey")}')
          PY
            ) || fail YOUTUBE_V2_STATE_INVALID
            overlay_routing=$overlay_report
          else
            fail YOUTUBE_V2_STATE_MISSING
          fi

          news=$(curl -fsS --max-time 3 http://127.0.0.1:8789/healthz) || fail RSS_HEALTH_UNREACHABLE
          crawl=$(curl -fsS --max-time 3 http://127.0.0.1:8788/healthz) || fail CRAWL_HEALTH_UNREACHABLE
          printf '%s' "$news" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True' || fail RSS_CONTRACT_INVALID
          printf '%s' "$crawl" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True' || fail CRAWL_CONTRACT_INVALID

          echo 'OVERALL_STATUS=OK'
          echo 'REASON=PRODUCTION_HEALTHY'
          echo "TOPOLOGY master=$MPID rumble=$RPID youtube_v2=$YPID legacy=masked master_speed=${speed:-unknown}x"
          echo "OVERLAY_ROUTING $overlay_routing"
          REMOTE
          rc=$?
          set -e
          cat production-status.env || true
          status=$(sed -n 's/^OVERALL_STATUS=\(OK\|FAIL\)$/\1/p' production-status.env | tail -n1)
          reason=$(sed -n 's/^REASON=\([A-Z0-9_]*\)$/\1/p' production-status.env | tail -n1)
          [[ -n "$status" ]] || status=FAIL
          [[ -n "$reason" ]] || reason=INVALID_MONITOR_REPORT
          printf 'status=%s\nreason=%s\n' "$status" "$reason" >> "$GITHUB_OUTPUT"
          printf '## FGBears Live: %s\n\n```text\n' "$status" >> "$GITHUB_STEP_SUMMARY"
          cat production-status.env >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Manage stream incident
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STREAM_STATUS: ${{ steps.health.outputs.status }}
          STREAM_REASON: ${{ steps.health.outputs.reason }}
        run: |
          set -Eeuo pipefail
          status=${STREAM_STATUS:-FAIL}
          reason=${STREAM_REASON:-MONITOR_STEP_FAILED}
          gh label create stream-monitor --color B60205 --description 'Automated FGBears Live stream incident' --force
          issue=$(gh issue list --state open --label stream-monitor --json number --jq '.[0].number // empty')
          if [[ "$status" != OK ]]; then
            if [[ -z "$issue" ]]; then
              gh issue create --title '[Stream Monitor] FGBears Live incident' --label stream-monitor --body "Read-only production monitor detected \`$reason\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            exit 1
          fi
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "Recovered. Current monitoring run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
