name: Monitor FGBears Live

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-live-monitor.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: fgbears-live-production-monitor
  cancel-in-progress: true

env:
  ORACLE_USER: ubuntu

jobs:
  monitor:
    name: Read-only Lovable control-plane health
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"; test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify production without restarting anything
        id: health
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set +e
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' > production-status.env <<'REMOTE'
          set -u
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          CACHE=fgbears-lovable-state-cache.service
          YOUTUBE=fgbears-youtube-v3.service
          HEALTH_TIMER=fgbears-live-health.timer
          CONTROL_STATE=/run/fgbears-control-plane/stream-state.json
          CONTROL_HEALTH=/run/fgbears-control-plane/cache-health.json
          YT_PROGRESS=/run/fgbears-youtube-v3/ffmpeg-progress.log
          V2_QUAR=/opt/fgbears-live/quarantine/youtube-v2-retired-20260903
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          active(){ systemctl is-active --quiet "$1"; }
          socket(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }
          fail(){ echo 'OVERALL_STATUS=FAIL'; echo "REASON=$1"; exit 1; }
          media_us(){ sudo sed -n 's/^out_time_us=\([0-9]*\)$/\1/p' "$YT_PROGRESS" 2>/dev/null | tail -n1; }
          measure_rate(){
            local seconds=$1 m0 m1 t0 t1
            m0=$(media_us); [[ "$m0" =~ ^[0-9]+$ ]] || return 1
            t0=$(date +%s%N); sleep "$seconds"
            m1=$(media_us); [[ "$m1" =~ ^[0-9]+$ ]] || return 1
            t1=$(date +%s%N)
            python3 - "$m0" "$m1" "$t0" "$t1" <<'PY'
          import sys
          m0,m1,t0,t1=map(int,sys.argv[1:]); wall=(t1-t0)/1e9; media=(m1-m0)/1e6
          assert wall>0 and media>=0
          print(f'{media/wall:.4f}')
          PY
          }

          active "$MASTER" || fail MASTER_INACTIVE
          active "$RUMBLE" || fail RUMBLE_INACTIVE
          active "$CACHE" || fail LOVABLE_CACHE_INACTIVE
          active "$YOUTUBE" || fail YOUTUBE_V3_INACTIVE
          active "$HEALTH_TIMER" || fail MASTER_HEALTH_TIMER_INACTIVE

          MPID=$(pid "$MASTER"); RPID=$(pid "$RUMBLE"); CPID=$(pid "$CACHE"); YPID=$(pid "$YOUTUBE")
          [[ "$MPID" =~ ^[1-9][0-9]*$ ]] || fail MASTER_PID_INVALID
          [[ "$RPID" =~ ^[1-9][0-9]*$ ]] || fail RUMBLE_PID_INVALID
          [[ "$CPID" =~ ^[1-9][0-9]*$ ]] || fail CACHE_PID_INVALID
          [[ "$YPID" =~ ^[1-9][0-9]*$ ]] || fail YOUTUBE_V3_PID_INVALID
          socket "$RPID" 1935 || fail RUMBLE_SOCKET_MISSING
          socket "$YPID" 443 || fail YOUTUBE_SOCKET_MISSING

          [[ "$(sudo cat /etc/fgbears-live/youtube-generation 2>/dev/null)" == v3 ]] || fail GENERATION_NOT_V3
          ! active fgbears-youtube-v2.service || fail YOUTUBE_V2_ACTIVE
          v2_enabled=$(systemctl is-enabled fgbears-youtube-v2.service 2>/dev/null || true)
          [[ "$v2_enabled" == masked* ]] || fail YOUTUBE_V2_NOT_MASKED
          [[ -d "$V2_QUAR" ]] || fail V2_QUARANTINE_MISSING
          [[ ! -e /opt/fgbears-live/youtube-v2 ]] || fail V2_ACTIVE_RUNTIME_PRESENT
          if find "$V2_QUAR" -type f -perm /111 -print -quit 2>/dev/null | grep -q .; then fail V2_QUARANTINE_EXECUTABLE_PRESENT; fi

          news=$(curl -fsS --max-time 3 http://127.0.0.1:8789/healthz) || fail RSS_HEALTH_UNREACHABLE
          crawl=$(curl -fsS --max-time 3 http://127.0.0.1:8788/healthz) || fail CRAWL_HEALTH_UNREACHABLE
          printf '%s' "$news" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True;assert int(p.get("fps") or 0)==30' || fail RSS_CONTRACT_INVALID
          printf '%s' "$crawl" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True;assert int(p.get("fps") or 0)==30' || fail CRAWL_CONTRACT_INVALID

          sudo test -s "$CONTROL_STATE" || fail CONTROL_STATE_MISSING
          sudo test -s "$CONTROL_HEALTH" || fail CONTROL_HEALTH_MISSING
          control_report=$(sudo python3 - "$CONTROL_STATE" "$CONTROL_HEALTH" <<'PY'
          from datetime import datetime
          import json,sys,time
          state=json.load(open(sys.argv[1],encoding='utf-8')); health=json.load(open(sys.argv[2],encoding='utf-8'))
          assert state.get('schemaVersion') == 'fgb-stream-state/v1'
          assert isinstance(state.get('revision'),str) and state['revision']
          expiry=datetime.fromisoformat(str(state.get('validUntil')).replace('Z','+00:00')).timestamp(); assert expiry > time.time()
          p=state.get('presentation') or {}; routing=p.get('routing') or {}
          assert (routing.get('rumble') or {}).get('rendersRealQuestion') is True
          diff=(routing.get('youtube') or {}).get('differenceLayer') or {}
          region=diff.get('region') or (p.get('mask') or {}).get('region')
          assert region == {'x':462,'y':104,'width':798,'height':470,'coordinateSpace':'pixels','referenceWidth':1280,'referenceHeight':720}
          if diff.get('enabled') is True:
              assert diff.get('creativeKey') == 'yt_rumble_trivia_redirect'
              assert (p.get('adBreak') or {}).get('active') is False
              t=p.get('trivia') or {}
              assert str(t.get('phase') or '').lower() in {'question','revealed'}
              assert t.get('questionVisible') is True
              assert t.get('stale') is not True
              assert t.get('gameVisible') is True
              assert t.get('youtubeRedirectRequired') is True
          assert health.get('workerVersion') == 'lovable-control-cache-v1'
          assert health.get('authority') == '/api/public/fgbears/stream-routing'
          assert health.get('ok') is True
          last=float(health.get('lastGoodEpoch') or 0); assert last > 0 and time.time()-last < 10
          print('revision=%s difference=%s cache_age=%.2fs latency_ms=%s' % (state['revision'],str(bool(diff.get('enabled'))).lower(),time.time()-last,health.get('routingLatencyMs')))
          PY
          ) || fail CONTROL_PLANE_STATE_INVALID

          sudo test -s "$YT_PROGRESS" || fail YOUTUBE_PROGRESS_MISSING
          yt_age=$(( $(date +%s) - $(sudo stat -c %Y "$YT_PROGRESS") )); (( yt_age < 20 )) || fail YOUTUBE_PROGRESS_STALE
          yt_rate1=$(measure_rate 5) || fail YOUTUBE_RATE_MEASUREMENT_FAILED
          yt_rate2=$(measure_rate 5) || fail YOUTUBE_RATE_MEASUREMENT_FAILED
          yt_rate10=$(measure_rate 10) || fail YOUTUBE_RATE_MEASUREMENT_FAILED
          python3 - "$yt_rate1" "$yt_rate2" "$yt_rate10" <<'PY' || fail YOUTUBE_BELOW_REALTIME
          import statistics,sys
          vals=list(map(float,sys.argv[1:])); assert vals[2] >= 0.98 and statistics.median(vals) >= 0.98, vals
          PY
          yt_fps=$(sudo sed -n 's/^fps=\([0-9.]*\)$/\1/p' "$YT_PROGRESS" | tail -n1)
          yt_drop=$(sudo sed -n 's/^drop_frames=\([0-9]*\)$/\1/p' "$YT_PROGRESS" | tail -n1)
          yt_dup=$(sudo sed -n 's/^dup_frames=\([0-9]*\)$/\1/p' "$YT_PROGRESS" | tail -n1)
          pressure=$(awk '/^some/{for(i=1;i<=NF;i++) if($i ~ /^avg10=/){split($i,a,"="); print a[2]}}' /proc/pressure/cpu 2>/dev/null || true)
          journal=$(sudo journalctl -u "$YOUTUBE" --since '-10 seconds' --no-pager 2>/dev/null || true)
          grep -Fq 'Circular buffer overrun' <<<"$journal" && fail YOUTUBE_UDP_OVERRUN
          grep -Eq 'non-existing PPS|decode_slice_header error|no frame!' <<<"$journal" && fail YOUTUBE_V3_DOWNSTREAM_SYNC_ERROR

          echo 'OVERALL_STATUS=OK'
          echo 'REASON=PRODUCTION_HEALTHY'
          echo "TOPOLOGY generation=v3 control=lovable cache=$CPID master=$MPID rumble=$RPID youtube_v3=$YPID youtube_rate_5s_1=${yt_rate1}x youtube_rate_5s_2=${yt_rate2}x youtube_steady_rate=${yt_rate10}x youtube_fps=${yt_fps:-NA} drop=${yt_drop:-NA} dup=${yt_dup:-NA} cpu_pressure_avg10=${pressure:-NA} news_fps=30 crawl_fps=30"
          echo "CONTROL_STATE $control_report"
          REMOTE
          rc=$?
          set -e
          cat production-status.env || true
          status=$(sed -n 's/^OVERALL_STATUS=\(OK\|FAIL\)$/\1/p' production-status.env | tail -n1)
          reason=$(sed -n 's/^REASON=\([A-Z0-9_]*\)$/\1/p' production-status.env | tail -n1)
          [[ -n "$status" ]] || status=FAIL
          [[ -n "$reason" ]] || reason=INVALID_MONITOR_REPORT
          printf 'status=%s\nreason=%s\n' "$status" "$reason" >> "$GITHUB_OUTPUT"
          printf '## FGBears Live: %s\n\n```text\n' "$status" >> "$GITHUB_STEP_SUMMARY"
          cat production-status.env >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Manage stream incident
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STREAM_STATUS: ${{ steps.health.outputs.status }}
          STREAM_REASON: ${{ steps.health.outputs.reason }}
        run: |
          set -Eeuo pipefail
          status=${STREAM_STATUS:-FAIL}; reason=${STREAM_REASON:-MONITOR_STEP_FAILED}
          gh label create stream-monitor --color B60205 --description 'Automated FGBears Live stream incident' --force
          issue=$(gh issue list --state open --label stream-monitor --json number --jq '.[0].number // empty')
          if [[ "$status" != OK ]]; then
            if [[ -z "$issue" ]]; then gh issue create --title '[Stream Monitor] FGBears Live incident' --label stream-monitor --body "Read-only production monitor detected \`$reason\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
            exit 1
          fi
          if [[ -n "$issue" ]]; then gh issue close "$issue" --comment "Recovered. Current monitoring run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
