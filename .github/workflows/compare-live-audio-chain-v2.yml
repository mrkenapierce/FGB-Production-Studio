name: Compare Live Audio Chain v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-live-audio-chain-v2.yml'
      - 'services/fgbears-live/tools/compare-live-audio-chain.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Run read-only comparison on Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ubuntu
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/mrkenapierce/FGB-Production-Studio/main/services/fgbears-live/tools/compare-live-audio-chain.py > /tmp/compare-live-audio-chain.py
          scp -i ~/.ssh/oracle_key /tmp/compare-live-audio-chain.py "$ORACLE_USER@$ORACLE_HOST:/tmp/compare-live-audio-chain.py"
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'python3 /tmp/compare-live-audio-chain.py; rc=$?; rm -f /tmp/compare-live-audio-chain.py; exit $rc'
