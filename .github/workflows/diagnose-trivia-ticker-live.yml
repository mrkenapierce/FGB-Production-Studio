name: Diagnose Trivia Ticker Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-trivia-ticker-live.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Inspect live crawl feed and renderer state
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== PUBLIC FEED ==='
          curl -fsS --max-time 10 https://epiccontentcreatorgrants.org/api/public/fgbears/crawl | jq .
          echo '=== RENDERER HEALTH ==='
          curl -fsS --max-time 2 http://127.0.0.1:8788/healthz | jq .
          echo '=== PUBLISHED TICKER ==='
          printf 'LABEL='; sudo cat /srv/fgbears-live/runtime/crawl-label.txt || true
          printf 'MESSAGE='; sudo cat /srv/fgbears-live/runtime/crawl-message.txt || true
          printf 'ACTIVE='; sudo cat /srv/fgbears-live/runtime/crawl-active || true
          REMOTE
