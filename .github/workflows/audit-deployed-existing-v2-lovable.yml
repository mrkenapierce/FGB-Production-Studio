name: Audit Deployed Existing-v2 Lovable Bridge

on:
  push:
    branches: [lovable-routing-existing-v2-20260903]
    paths: ['.github/workflows/audit-deployed-existing-v2-lovable.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      TESTED_SHA: df3d695567439702d2c61d9dc255640d7360fc43
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          install -d -m700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Verify deployed files and live invariants without mutation
        run: |
          set -Eeuo pipefail
          local_overlay=$(sha256sum services/fgbears-live/youtube-v2/youtube-v2-overlay.py | awk '{print $1}')
          local_builder=$(sha256sum services/fgbears-live/tools/build-youtube-rumble-trivia-card.py | awk '{print $1}')
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" "sudo env EXPECT_OVERLAY='$local_overlay' EXPECT_BUILDER='$local_builder' TESTED_SHA='$TESTED_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          M=fgbears-live.service; R=fgbears-rumble-relay.service; Y=fgbears-youtube-v2.service
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          nr(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          conn(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }
          fail(){ echo "POST_DEPLOY_AUDIT=FAIL reason=$1" >&2; exit 1; }

          [[ "$(sha256sum /opt/fgbears-live/youtube-v2/youtube-v2-overlay.py | awk '{print $1}')" == "$EXPECT_OVERLAY" ]] || fail overlay_hash_mismatch
          [[ "$(sha256sum /opt/fgbears-live/tools/build-youtube-rumble-trivia-card.py | awk '{print $1}')" == "$EXPECT_BUILDER" ]] || fail builder_hash_mismatch
          for u in "$M" "$R" "$Y"; do systemctl is-active --quiet "$u" || fail "inactive:$u"; done
          M0=$(pid "$M"); R0=$(pid "$R"); Y0=$(pid "$Y"); MN0=$(nr "$M"); RN0=$(nr "$R"); YN0=$(nr "$Y")
          conn "$R0" 1935 || fail rumble_socket_missing
          conn "$Y0" 443 || fail youtube_socket_missing

          python3 - <<'PY'
          import json,time
          p=json.load(open('/run/fgbears-youtube-v2/overlay-state.json'))
          assert p.get('ok') is True,p
          assert p.get('creativeKey')=='yt_rumble_trivia_redirect',p
          assert p.get('presentationMode')=='full_creative_scaled',p
          assert p.get('routingAuthority')=='lovable_public_stream_routing',p
          assert time.time()-float(p.get('lastGoodEpoch') or 0)<5,p
          print('LIVE_CONTROL_CONTRACT=PASS')
          PY

          sleep 30
          [[ "$(pid "$M")" == "$M0" && "$(nr "$M")" == "$MN0" ]] || fail master_changed
          [[ "$(pid "$R")" == "$R0" && "$(nr "$R")" == "$RN0" ]] || fail rumble_changed
          [[ "$(pid "$Y")" == "$Y0" && "$(nr "$Y")" == "$YN0" ]] || fail youtube_changed
          conn "$R0" 1935 || fail rumble_socket_lost
          conn "$Y0" 443 || fail youtube_socket_lost
          speed=$(awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v);if(v!="")print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log)
          awk -v s="$speed" 'BEGIN{exit !(s>=0.97)}' || fail "master_speed_low:$speed"
          cpu=$(ps -p "$Y0" -o %cpu= | awk '{print $1+0}')
          awk -v c="$cpu" 'BEGIN{exit !(c<=30)}' || fail "youtube_cpu_high:$cpu"
          echo "POST_DEPLOY_AUDIT=PASS sha=$TESTED_SHA master=$M0 rumble=$R0 youtube=$Y0 speed=${speed}x youtube_cpu=${cpu}%"
          REMOTE
