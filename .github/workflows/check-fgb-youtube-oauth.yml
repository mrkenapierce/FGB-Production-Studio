name: Check FGB YouTube OAuth Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-fgb-youtube-oauth.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report credential readiness without exposing credentials
        env:
          CLIENT_ID: ${{ secrets.FGB_YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.FGB_YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.FGB_YOUTUBE_REFRESH_TOKEN }}
        run: |
          ready=true
          [ -n "$CLIENT_ID" ] || ready=false
          [ -n "$CLIENT_SECRET" ] || ready=false
          [ -n "$REFRESH_TOKEN" ] || ready=false
          echo "FGB_YOUTUBE_OAUTH_READY=$ready"
