name: Verify Live Leaderboard Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-leaderboard-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public standings contract
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, urllib.request
          url='https://epiccontentcreatorgrants.org/api/public/fgbears/game-screen?_verify=leaderboard'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'FGB-runtime-verify/1.0'})
          with urllib.request.urlopen(req,timeout=15) as r:
              j=json.load(r)
          print('PUBLIC_GAME_ID='+str(j.get('gameId')))
          rows=j.get('standings') or []
          print('PUBLIC_STANDINGS_COUNT='+str(len(rows)))
          for i,row in enumerate(rows[:3]):
              print('PUBLIC_ROW_%d=%s' % (i+1,json.dumps({k:row.get(k) for k in ('rank','zip','teamScore','uniquePlayers','score','players')},sort_keys=True)))
          PY
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Read-only Oracle runtime verification
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "CRAWL_ACTIVE=$(systemctl is-active fgbears-live-crawl.service || true)"
          echo "MASTER_ACTIVE=$(systemctl is-active fgbears-live-master.service || true)"
          echo "MASTER_PID=$(systemctl show -p MainPID --value fgbears-live-master.service || true)"
          echo "CRAWL_PID=$(systemctl show -p MainPID --value fgbears-live-crawl.service || true)"
          echo "CRAWL_RESTARTS=$(systemctl show -p NRestarts --value fgbears-live-crawl.service || true)"
          runtime=/usr/local/lib/fgbears-live/game_overlay.py
          test -f "$runtime"
          grep -q 'teamScore' "$runtime"
          grep -q 'uniquePlayers' "$runtime"
          echo 'RUNTIME_CANONICAL_STANDINGS_KEYS=true'
          python3 -m py_compile "$runtime"
          echo 'RUNTIME_PYCOMPILE=true'
          if sudo ss -tnp 2>/dev/null | grep -q 'youtube.com:443'; then echo 'YOUTUBE_RTMPS_CONNECTED=true'; else echo 'YOUTUBE_RTMPS_CONNECTED=unknown'; fi
          REMOTE
