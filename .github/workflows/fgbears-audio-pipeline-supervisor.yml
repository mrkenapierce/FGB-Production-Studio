name: FGBears Audio Pipeline Supervisor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-audio-pipeline-supervisor.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

concurrency:
  group: fgbears-audio-pipeline-supervisor
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify audio pipeline control loop
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          TIMER=fgbears-lovable-audio-sync.timer
          MASTER=fgbears-live.service
          STATE=/srv/fgbears-live/runtime/lovable-audio-pipeline.json

          systemctl is-enabled --quiet "$TIMER"
          systemctl is-active --quiet "$TIMER"
          systemctl is-active --quiet "$MASTER"
          test -x /usr/local/bin/fgbears-lovable-audio-pipeline
          test -x /usr/local/lib/fgbears-live/prepare-audio-track-v3.py
          test -s "$STATE"

          substate="$(systemctl show -p SubState --value "$TIMER")"
          case "$substate" in waiting|running) ;; *) echo "Unexpected timer substate: $substate" >&2; exit 1;; esac
          systemctl show -p TimersCalendar --value "$TIMER" | grep -Fq 'OnCalendar=*-*-* *:*:00,15,30,45'

          last="$(systemctl show -p LastTriggerUSec --value "$TIMER")"
          test -n "$last"
          last_epoch="$(date -d "$last" +%s)"
          now_epoch="$(date +%s)"
          age=$((now_epoch - last_epoch))
          test "$age" -ge 0
          test "$age" -le 90

          echo "TIMER_ENABLED=PASS"
          echo "TIMER_ACTIVE=PASS"
          echo "TIMER_RECENT_TRIGGER=PASS age_seconds=$age"
          systemctl show "$TIMER" -p ActiveState -p SubState -p LastTriggerUSec -p NextElapseUSecRealtime -p TimersCalendar --no-pager
          echo "SERVICE_PROPERTIES:"
          systemctl show fgbears-lovable-audio-sync.service -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager
          echo "PIPELINE_STATE:"
          sudo cat "$STATE"
          echo "ACTIVE_DESTINATIONS:"
          systemctl list-units --type=service --state=running --no-legend --no-pager 'fgbears-*' \
            | awk '{print $1}' | grep -E 'youtube|rumble|facebook|relay|uplink' || true
          echo "MASTER_PID=$(systemctl show -p MainPID --value "$MASTER")"
          REMOTE
