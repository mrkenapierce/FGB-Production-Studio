name: Lock FGB Audio and Align RSS Crawl Style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lock-fgb-audio-and-rss-style.yml'
      - '.github/scripts/lock-fgb-audio-rss.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic production correction
        run: python3 .github/scripts/lock-fgb-audio-rss.py
      - name: Validate correction
        run: |
          bash -n services/fgbears-live/bin/start-stream.sh
          bash -n services/fgbears-live/bin/install.sh
          bash services/fgbears-live/tests/test-production-invariants.sh
      - name: Commit corrected production source
        run: |
          git config user.name 'FGBears Repair Bot'
          git config user.email 'actions@github.com'
          git add services/fgbears-live/bin/start-stream.sh services/fgbears-live/bin/install.sh services/fgbears-live/config/stream.env.example
          if git diff --cached --quiet; then
            echo 'Production source already satisfies RSS/audio invariants.'
            exit 0
          fi
          git commit -m 'Lock FGB audio and match RSS crawl to main crawl'
          git push origin HEAD:main
