name: Install FGBears Episode 31

on:
  push:
    branches:
      - ops/install-fgbears-episode-31-20260818
    paths:
      - '.github/workflows/fgbears-episode31-install.yml'

permissions:
  contents: read

concurrency:
  group: fgbears-episode31-install
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu
  VIDEO_ID: XDezv_5C4Ms

jobs:
  install:
    name: Install Episode 31 and verify playlist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require Oracle access secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" || { echo 'Missing ORACLE_HOST secret'; exit 1; }
          test -n "$ORACLE_SSH_KEY" || { echo 'Missing ORACLE_SSH_KEY secret'; exit 1; }

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Trust Oracle host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Check out verified Episode 31 transport
        uses: actions/checkout@v4

      - name: Reconstruct and transfer verified Episode 31 audio
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat ops/episode31-transport/chunk-* > /tmp/FGBears-Episode-31-source.b64
          base64 --decode /tmp/FGBears-Episode-31-source.b64 > /tmp/FGBears-Episode-31-source.ogg
          printf '76fd99dd7686de3f1bf94b25c612e69c5539425d5a1f1218df86e0361cfa1b66  %s\n' /tmp/FGBears-Episode-31-source.ogg | sha256sum --check -
          scp -i ~/.ssh/oracle_key /tmp/FGBears-Episode-31-source.ogg \
            "$ORACLE_USER@$ORACLE_HOST:/tmp/FGBears-Episode-31-source.ogg"
          rm -f /tmp/FGBears-Episode-31-source.b64 /tmp/FGBears-Episode-31-source.ogg

      - name: Fetch, build, install, and activate Episode 31
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" "VIDEO_ID='$VIDEO_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          work=/tmp/fgbears-episode31-install
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"

          source_file=/tmp/FGBears-Episode-31-source.ogg
          [[ -s "$source_file" ]] || { echo 'Episode 31 transport source is missing.' >&2; exit 1; }
          transport_sha=$(sha256sum "$source_file" | awk '{print $1}')
          printf 'transport_sha256=%s\n' "$transport_sha"
          [[ "$transport_sha" == '76fd99dd7686de3f1bf94b25c612e69c5539425d5a1f1218df86e0361cfa1b66' ]]
          transport_duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$source_file")
          printf 'transport_duration=%s\n' "$transport_duration"
          awk -v d="$transport_duration" 'BEGIN { exit !(d > 869 && d < 870) }'

          echo 'Building relay-compatible Episode 31 media...'
          ffmpeg -hide_banner -y -loglevel warning \
            -f lavfi -i 'color=c=black:s=1280x720:r=30' \
            -i "$source_file" \
            -map 0:v:0 -map 1:a:0 \
            -shortest \
            -c:v libx264 -preset ultrafast -profile:v high -level 4.0 \
            -crf 45 -maxrate 250k -bufsize 500k \
            -g 60 -keyint_min 60 -sc_threshold 0 -pix_fmt yuv420p -r 30 \
            -threads 1 \
            -c:a aac -b:a 128k -ar 48000 -ac 2 \
            -movflags +faststart -map_metadata -1 \
            "$work/FGBears-Episode-31.mp4"

          video=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of csv=p=0:s='|' "$work/FGBears-Episode-31.mp4")
          audio=$(ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of csv=p=0:s='|' "$work/FGBears-Episode-31.mp4")
          echo "episode31_video=$video"
          echo "episode31_audio=$audio"
          [[ "$video" == 'h264|1280|720|30/1|yuv420p' ]]
          [[ "$audio" == 'aac|48000|2' ]]

          echo 'Installing Episode 31 into the existing Oracle media library...'
          sudo install -o fgbears -g fgbears -m 0644 \
            "$work/FGBears-Episode-31.mp4" \
            /srv/fgbears-live/media/FGBears-Episode-31.mp4

          sudo /usr/local/bin/fgbears-validate /srv/fgbears-live/media
          sudo /usr/local/bin/fgbears-rebuild-playlist

          count=$(sudo sed -n "s/^file '\(.*\)'$/\1/p" /srv/fgbears-live/playlist.ffconcat | wc -l)
          last=$(sudo sed -n "s/^file '\(.*\)'$/\1/p" /srv/fgbears-live/playlist.ffconcat | tail -n 1)
          printf 'playlist_count=%s\n' "$count"
          printf 'playlist_last=%s\n' "$(basename "$last")"
          [[ "$count" -eq 31 ]]
          [[ "$(basename "$last")" == 'FGBears-Episode-31.mp4' ]]

          sudo systemctl restart fgbears-live.service
          for i in $(seq 1 30); do
            if systemctl is-active --quiet fgbears-live.service; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet fgbears-live.service

          test -s /srv/fgbears-live/media/FGBears-Episode-31.mp4
          printf 'FINAL media_episode31=yes playlist_count=%s playlist_last=%s service=%s\n' \
            "$count" "$(basename "$last")" "$(systemctl is-active fgbears-live.service)"

          rm -rf "$work"
          REMOTE
