name: Restore FGBears Episode 30 and activate Episode 31

on:
  push:
    branches:
      - ops/install-fgbears-episode-31-20260818
    paths:
      - '.github/workflows/fgbears-episode31-install.yml'

permissions:
  contents: read

concurrency:
  group: fgbears-episode31-install
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  install:
    name: Restore Episode 30 and verify Episode 31 sequence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require Oracle access secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" || { echo 'Missing ORACLE_HOST secret'; exit 1; }
          test -n "$ORACLE_SSH_KEY" || { echo 'Missing ORACLE_SSH_KEY secret'; exit 1; }

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Trust Oracle host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Check out verified Episode 30 recovery transport
        uses: actions/checkout@v4

      - name: Reconstruct and transfer verified Episode 30 audio
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat ops/episode30-transport/chunk-* > /tmp/FGBears-Episode-30-source.b64
          base64 --decode /tmp/FGBears-Episode-30-source.b64 > /tmp/FGBears-Episode-30-source.ogg
          printf '4b6b900bfa8148506d223fe16d77e7347fad48c3f7b681cff1571c777d134cf5  %s\n' /tmp/FGBears-Episode-30-source.ogg | sha256sum --check -
          scp -i ~/.ssh/oracle_key /tmp/FGBears-Episode-30-source.ogg \
            "$ORACLE_USER@$ORACLE_HOST:/tmp/FGBears-Episode-30-source.ogg"
          rm -f /tmp/FGBears-Episode-30-source.b64 /tmp/FGBears-Episode-30-source.ogg

      - name: Restore Episode 30 and activate the 30 to 31 sequence
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          work=/tmp/fgbears-episode30-recovery
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"

          source_file=/tmp/FGBears-Episode-30-source.ogg
          [[ -s "$source_file" ]] || { echo 'Episode 30 recovery source is missing.' >&2; exit 1; }
          transport_sha=$(sha256sum "$source_file" | awk '{print $1}')
          printf 'episode30_transport_sha256=%s\n' "$transport_sha"
          [[ "$transport_sha" == '4b6b900bfa8148506d223fe16d77e7347fad48c3f7b681cff1571c777d134cf5' ]]
          transport_duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$source_file")
          printf 'episode30_transport_duration=%s\n' "$transport_duration"
          awk -v d="$transport_duration" 'BEGIN { exit !(d > 849 && d < 851) }'

          echo 'Building relay-compatible Episode 30 media...'
          ffmpeg -nostdin -hide_banner -y -loglevel warning \
            -f lavfi -i 'color=c=black:s=1280x720:r=30' \
            -i "$source_file" \
            -map 0:v:0 -map 1:a:0 \
            -shortest \
            -c:v libx264 -preset ultrafast -profile:v high -level 4.0 \
            -crf 45 -maxrate 250k -bufsize 500k \
            -g 60 -keyint_min 60 -sc_threshold 0 -pix_fmt yuv420p -r 30 \
            -threads 1 \
            -c:a aac -b:a 128k -ar 48000 -ac 2 \
            -movflags +faststart -map_metadata -1 \
            "$work/FGBears-Episode-30.mp4"

          echo 'Validating recovered Episode 30 before installation...'
          sudo /usr/local/bin/fgbears-validate "$work"

          echo 'Restoring Episode 30 beside the validated Episode 31 media...'
          sudo install -o fgbears -g fgbears -m 0644 \
            "$work/FGBears-Episode-30.mp4" \
            /srv/fgbears-live/media/FGBears-Episode-30.mp4
          test -s /srv/fgbears-live/media/FGBears-Episode-31.mp4

          sudo /usr/local/bin/fgbears-validate /srv/fgbears-live/media
          sudo /usr/local/bin/fgbears-rebuild-playlist

          count=$(sudo sed -n "s/^file '\\(.*\\)'$/\\1/p" /srv/fgbears-live/playlist.ffconcat | wc -l)
          item30=$(sudo sed -n "s/^file '\\(.*\\)'$/\\1/p" /srv/fgbears-live/playlist.ffconcat | sed -n '30p')
          item31=$(sudo sed -n "s/^file '\\(.*\\)'$/\\1/p" /srv/fgbears-live/playlist.ffconcat | sed -n '31p')
          printf 'playlist_count=%s\n' "$count"
          printf 'playlist_item30=%s\n' "$(basename "$item30")"
          printf 'playlist_item31=%s\n' "$(basename "$item31")"
          [[ "$count" -eq 31 ]]
          [[ "$(basename "$item30")" == 'FGBears-Episode-30.mp4' ]]
          [[ "$(basename "$item31")" == 'FGBears-Episode-31.mp4' ]]

          sudo systemctl restart fgbears-live.service
          for i in $(seq 1 30); do
            if systemctl is-active --quiet fgbears-live.service; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet fgbears-live.service

          test -s /srv/fgbears-live/media/FGBears-Episode-30.mp4
          test -s /srv/fgbears-live/media/FGBears-Episode-31.mp4
          printf 'FINAL media_episode30=yes media_episode31=yes playlist_count=%s item30=%s item31=%s service=%s\n' \
            "$count" "$(basename "$item30")" "$(basename "$item31")" "$(systemctl is-active fgbears-live.service)"

          rm -rf "$work"
          REMOTE
