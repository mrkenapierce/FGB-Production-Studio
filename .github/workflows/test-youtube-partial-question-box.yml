name: Test YouTube Partial Question Box

on:
  push:
    paths:
      - 'services/fgbears-live/bin/youtube-question-mask.py'
      - 'services/fgbears-live/bin/youtube-offhost-compositor.sh'
      - '.github/workflows/test-youtube-partial-question-box.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Lovable-derived partial-mask boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile services/fgbears-live/bin/youtube-question-mask.py
          bash -n services/fgbears-live/bin/youtube-offhost-compositor.sh
          grep -Fq 'maskRegion' services/fgbears-live/bin/youtube-question-mask.py
          grep -Fq 'youtubeCreativeKey' services/fgbears-live/bin/youtube-question-mask.py
          grep -Fq 'presentationMode' services/fgbears-live/bin/youtube-question-mask.py
          grep -Fq 'y + height > CRAWL_TOP' services/fgbears-live/bin/youtube-question-mask.py
          grep -Fq 'y < NEWS_BOTTOM' services/fgbears-live/bin/youtube-question-mask.py
          grep -Fq 'MASK_HEALTH' services/fgbears-live/bin/youtube-offhost-compositor.sh
          grep -Fq 'overlay=${MASK_X}:${MASK_Y}' services/fgbears-live/bin/youtube-offhost-compositor.sh
          if grep -Eq 'MASK_(X|Y|WIDTH|HEIGHT)="\\$\\{YOUTUBE_QUESTION_MASK_' services/fgbears-live/bin/youtube-offhost-compositor.sh; then
            echo 'ERROR: compositor still accepts local geometry authority'
            exit 1
          fi
          if grep -Fq -- '-video_size 1280x720' services/fgbears-live/bin/youtube-offhost-compositor.sh; then
            echo 'ERROR: full-frame RGBA overlay input present'
            exit 1
          fi
          echo 'LOVABLE_PARTIAL_OVERLAY_BOUNDARY=PASS'
