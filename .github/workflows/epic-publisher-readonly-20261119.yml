name: EPIC Publisher Read-only Audit 2026-11-19
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/epic-publisher-readonly-20261119.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Protected OVH setup
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Inspect recorder and cutter only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i ~/.ssh/ovh_key ubuntu@40.160.144.185 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          echo "CHECK_UTC=$(date -u +%FT%TZ)"
          echo 'CONTAINERS_BEGIN'
          docker ps --format '{{.Names}} | {{.Status}}' | grep -E 'epic-cnt|fgb-transport' || true
          echo 'CONTAINERS_END'
          echo 'DISK'
          df -h /srv/cnt-archive || true
          echo 'RECENT_ROLLING_FILES'
          find /srv/cnt-archive/rolling -maxdepth 1 -type f -name 'live-*.ts' -printf '%f %s %TY-%Tm-%TdT%TH:%TM:%TS\n' 2>/dev/null | sort | tail -14 || true
          echo 'LATEST_EPISODE_FILES'
          find /srv/cnt-archive/episodes -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort | tail -20 || true
          echo 'PENDING_EPISODE_LOCAL_STATE'
          for file in /srv/cnt-archive/episodes/1fbce3b4-21ac-43da-98d9-15c569b954cd.json /srv/cnt-archive/state/dependencies/episode-1fbce3b4-21ac-43da-98d9-15c569b954cd.json; do
            if [ -f "$file" ]; then
              printf '%s present ' "$(basename "$file")"
              python3 - "$file" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print("keys="+",".join(sorted(d.keys())),"videoIdPresent="+str(bool(d.get("videoId"))),"status="+str(d.get("status")),"confirmed="+str(d.get("confirmed")))
          PY
            else echo "$(basename "$file") absent"; fi
          done
          echo 'EXACT_PENDING_EPISODE_FILE_CHECK'
          for f in /srv/cnt-archive/episodes/1fbce3b4-21ac-43da-98d9-15c569b954cd.ts /srv/cnt-archive/episodes/1fbce3b4-21ac-43da-98d9-15c569b954cd.json; do
            if [ -f "$f" ]; then stat -c 'PENDING_FILE=%n SIZE=%s MTIME=%y' "$f";
              if [[ "$f" == *.json ]]; then python3 - "$f" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print('SESSION_PRESENT='+str(bool(d.get('sessionUrl'))),'VIDEO_ID_PRESENT='+str(bool(d.get('videoId'))),'CONFIRMED='+str(bool(d.get('confirmed'))))
          PY
              fi
            else echo "PENDING_FILE_ABSENT=$(basename "$f")"; fi
          done
          echo 'WORKER_PROCESSES'
          docker exec epic-cnt-archive-worker sh -c "ps -eo pid,comm,args | grep -E 'episode-cutter|cnt-rolling|cnt-daily' | grep -v grep | cut -c1-140" || true
          echo 'WORKER_RECENT_SAFE_MARKERS'
          docker logs --since 90m --tail 220 epic-cnt-archive-worker 2>&1 |
            grep -E 'episode:cnt|episode:epic|no local recording|no upload token|upload incomplete|awaiting complete processing receipt|not closed|cut failed|jobs unavailable|missing' |
            sed -E 's#https?://[^ ]+#(url-redacted)#g;s/[A-Za-z0-9_-]{80,}/(redacted)/g' | tail -35 || true
          echo 'YOUTUBE_INITIATION_STATUS_PROBE'
          docker exec epic-cnt-archive-worker bash -lc '
            set -uo pipefail
            export EPISODE_CHANNEL=cnt
            . ./episode-lib.sh
            tmp=$(mktemp -d)
            trap "rm -rf \"$tmp\"" EXIT
            jobs=$(ep_api "{\"action\":\"episode_jobs\"}" 2>/dev/null) || { echo API_JOBS_UNAVAILABLE=true; exit 0; }
            job=$(jq -c '\''.jobs[] | select(.episodeId=="1fbce3b4-21ac-43da-98d9-15c569b954cd")'\'' <<<"$jobs" | head -1)
            [ -n "$job" ] || { echo TARGET_JOB_RETURNED=false; exit 0; }
            echo TARGET_JOB_RETURNED=true
            tok=$(ep_api "{\"action\":\"token\"}" 2>/dev/null | jq -r '\''.accessToken // empty'\'')
            [ -n "$tok" ] || { echo ACCESS_TOKEN_AVAILABLE=false; exit 0; }
            echo ACCESS_TOKEN_AVAILABLE=true
            title=$(jq -r .title <<<"$job")
            desc=$(jq -r '\''.description // ""'\'' <<<"$job")
            privacy=$(jq -r .privacy <<<"$job")
            jq -cn --arg t "$title" --arg d "$desc" --arg p "$privacy" '\''{snippet:{title:$t,description:$d,categoryId:"17"},status:{privacyStatus:$p,selfDeclaredMadeForKids:false}}'\'' > "$tmp/meta.json"
            size=331723368
            http=$(curl --silent --show-error -m 25 -D "$tmp/headers" -o "$tmp/body" -w "%{http_code}" -X POST "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status" -H "authorization: Bearer $tok" -H "content-type: application/json; charset=UTF-8" -H "x-upload-content-type: video/mp2t" -H "x-upload-content-length: $size" --data-binary @"$tmp/meta.json" 2>/dev/null) || http=transport_error
            echo YOUTUBE_INIT_HTTP_CODE="$http"
            if grep -qi "^location:" "$tmp/headers"; then echo SESSION_HEADER_PRESENT=true; else echo SESSION_HEADER_PRESENT=false; fi
            if [ -s "$tmp/body" ]; then jq -r '\''"YOUTUBE_ERROR_CODE=" + (.error.code|tostring), "YOUTUBE_ERROR_REASON=" + (.error.errors[0].reason // "unknown")'\'' "$tmp/body" 2>/dev/null | head -2 || true; fi
          ' || echo 'DIAGNOSTIC_WRAPPER_FAILED=true'
          echo 'READ_ONLY=true'
          REMOTE