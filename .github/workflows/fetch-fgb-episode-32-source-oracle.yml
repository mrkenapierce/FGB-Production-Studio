name: Fetch FGB Episode 32 Source on Oracle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-fgb-episode-32-source-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Fetch Episode 32 to isolated Oracle upload storage
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ubuntu
        run: |
          ssh -o ServerAliveInterval=30 -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          URL='https://www.youtube.com/watch?v=PUsi9hNXnhw'
          OUT='/home/ubuntu/fgbears-upload/FGBears-Episode-32.mp4'
          TMP='/tmp/fgb-episode32-source'
          TOOL='/tmp/yt-dlp-fgb'

          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          mkdir -p /home/ubuntu/fgbears-upload "$TMP"
          rm -f "$TMP"/*

          curl -fsSL --retry 3 --retry-delay 2 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o "$TOOL"
          chmod +x "$TOOL"
          "$TOOL" --version

          ok=0
          for client in web_embedded web_safari tv ios android_vr; do
            echo "TRY_CLIENT=$client"
            rm -f "$TMP"/source.* "$TMP"/*.part
            if "$TOOL" --no-playlist --js-runtimes node \
              --extractor-args "youtube:player_client=${client}" \
              --merge-output-format mp4 \
              -f 'bv*[height<=720]+ba/b[height<=720]' \
              -o "$TMP/source.%(ext)s" "$URL"; then
              ok=1
              break
            fi
          done
          [[ "$ok" -eq 1 ]]
          src=$(find "$TMP" -maxdepth 1 -type f -name 'source.*' ! -name '*.part' -print -quit)
          test -s "$src"
          ffprobe -v error -select_streams v:0 -show_entries stream=index -of csv=p=0 "$src" | grep -q .
          ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$src" | grep -q .
          install -m 0644 "$src" "$OUT"
          sha256sum "$OUT"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels,bit_rate -of csv=p=0 "$OUT"
          echo 'EPISODE_32_SOURCE=READY'
          rm -rf "$TMP" "$TOOL"
          REMOTE
