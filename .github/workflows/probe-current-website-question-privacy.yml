name: Probe Current Website Question Privacy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-current-website-question-privacy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Probe current public delayed website feed
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          url='https://epiccontentcreatorgrants.org/api/public/fgbears/website-game-screen'
          found=None
          for _ in range(45):
              req=urllib.request.Request(url+'?_privacy='+str(time.time_ns()),headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'FGB-privacy-probe/1.0'})
              with urllib.request.urlopen(req,timeout=15) as r:
                  j=json.load(r)
              if j.get('active') and j.get('phase') in ('question','revealed'):
                  found=j; break
              time.sleep(2)
          j=found or j
          prompt=j.get('prompt')
          print('ACTIVE='+str(j.get('active')))
          print('PHASE='+str(j.get('phase')))
          print('QUESTION_NUMBER='+str(j.get('questionNumber')))
          print('DELAY_SECONDS='+str(j.get('delaySeconds')))
          print('CHOICES_COUNT='+str(len(j.get('choices') or [])))
          print('PROMPT_PRESENT='+str(bool(str(prompt or '').strip())))
          print('ANSWER_PRESENT='+str(bool(j.get('answer'))))
          print('CORRECT_ANSWER_TEXT_PRESENT='+str(bool(j.get('correctAnswerText'))))
          PY
