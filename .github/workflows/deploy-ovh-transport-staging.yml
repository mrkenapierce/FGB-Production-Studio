name: Deploy OVH FGB Transport Staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-ovh-transport-staging.yml

permissions:
  contents: write

concurrency:
  group: fgb-ovh-transport-staging
  cancel-in-progress: false

env:
  OVH_HOST: 40.160.144.185
  OVH_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH using existing protected deployment key
        env:
          DEPLOY_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo 'Missing ORACLE_SSH_KEY secret'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key

      - name: Wait for fresh OVH host to accept SSH
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            ssh-keygen -R "$OVH_HOST" >/dev/null 2>&1 || true
            if ssh-keyscan -T 5 -H "$OVH_HOST" > ~/.ssh/ovh_known_hosts 2>/dev/null; then
              if ssh -o UserKnownHostsFile=~/.ssh/ovh_known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=5 -i ~/.ssh/ovh_key "$OVH_USER@$OVH_HOST" 'printf ready' 2>/dev/null | grep -q ready; then
                echo "OVH SSH ready on attempt $attempt"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'OVH host did not become SSH-ready in time' >&2
          exit 1

      - name: Bootstrap staging transport host
        run: |
          set -euo pipefail
          ssh -o UserKnownHostsFile=~/.ssh/ovh_known_hosts -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key "$OVH_USER@$OVH_HOST" 'sudo bash -s' < ops/transport-ovh/bootstrap-ovh.sh

      - name: Verify safe staging state
        run: |
          set -euo pipefail
          ssh -o UserKnownHostsFile=~/.ssh/ovh_known_hosts -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE' | tee /tmp/ovh-staging-status.txt
          set -euo pipefail
          test -f /opt/fgb-transport/BOOTSTRAP_COMPLETE
          test -f /opt/fgb-transport/NEEDS_SECRETS
          docker --version
          docker compose version
          sudo systemctl is-active --quiet docker
          if sudo systemctl is-active --quiet fgb-transport.service; then
            echo 'ERROR: transport service unexpectedly active before secrets' >&2
            exit 1
          fi
          enabled=$(sudo systemctl is-enabled fgb-transport.service 2>/dev/null || true)
          test "$enabled" != enabled
          image_count=$(sudo docker images --format '{{.Repository}}' | grep -c '^transport-ovh' || true)
          echo 'STAGING_READY=true'
          echo "TRANSPORT_SERVICE_ENABLED=$enabled"
          echo "TRANSPORT_SERVICE_ACTIVE=false"
          echo "NEEDS_SECRETS=true"
          echo "TRANSPORT_IMAGES=$image_count"
          echo "HOST=$(hostname)"
          echo "OS=$( . /etc/os-release; printf '%s %s' "$NAME" "$VERSION_ID" )"
          REMOTE

      - name: Persist sanitized deployment status
        run: |
          set -euo pipefail
          mkdir -p .github/deployment-status
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          vals={}
          for line in Path('/tmp/ovh-staging-status.txt').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1)
                  if k in {'STAGING_READY','TRANSPORT_SERVICE_ENABLED','TRANSPORT_SERVICE_ACTIVE','NEEDS_SECRETS','TRANSPORT_IMAGES','HOST','OS'}:
                      vals[k]=v
          data={
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'host': '40.160.144.185',
              'mode': 'staging',
              'status': vals,
          }
          Path('.github/deployment-status/ovh-transport-staging.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/ovh-transport-staging.json
          git commit -m 'Record OVH transport staging deployment' || exit 0
          git push
