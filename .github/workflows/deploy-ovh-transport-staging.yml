name: Deploy OVH FGB Transport Staging (Direct)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fgb-ovh-production-cutover
  cancel-in-progress: false

env:
  OVH_HOST: 40.160.144.185

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip once staging deployment is recorded complete
        id: completed
        run: |
          if [ -f .github/deployment-status/ovh-production-live.json ] && grep -q '"PERMANENT_READY": "true"' .github/deployment-status/ovh-production-live.json; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Permanent OVH production transport is ready; staging is unnecessary.'
          elif [ -f .github/deployment-status/ovh-transport-staging.json ] && grep -q '"STAGING_READY": "true"' .github/deployment-status/ovh-transport-staging.json; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'OVH staging already prepared; nothing to do.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify direct SSH transport path
        if: steps.completed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          timeout 8 bash -c "</dev/tcp/$OVH_HOST/22" || { echo 'OVH TCP/22 is not reachable'; exit 1; }
          ssh-keyscan -T 8 -H "$OVH_HOST" > ~/.ovh_known_hosts
          test -s ~/.ovh_known_hosts
          echo 'Direct GitHub-to-OVH SSH path is reachable.'

      - name: Configure protected deployment key
        if: steps.completed.outputs.skip != 'true'
        env:
          OVH_KEY: ${{ secrets.OVH_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          DEPLOY_KEY="$OVH_KEY"
          KEY_SOURCE='OVH_SSH_KEY'
          if [ -z "$DEPLOY_KEY" ]; then
            DEPLOY_KEY="$LEGACY_KEY"
            KEY_SOURCE='ORACLE_SSH_KEY fallback'
          fi
          test -n "$DEPLOY_KEY" || { echo 'No protected deployment key is configured'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          mv ~/.ovh_known_hosts ~/.ssh/ovh_known_hosts
          echo "Using protected key source: $KEY_SOURCE"

      - name: Discover authenticated OVH login account
        if: steps.completed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            for candidate in ubuntu debian root; do
              if ssh -o UserKnownHostsFile=~/.ssh/ovh_known_hosts \
                     -o StrictHostKeyChecking=yes \
                     -o BatchMode=yes \
                     -o PasswordAuthentication=no \
                     -o ConnectTimeout=7 \
                     -i ~/.ssh/ovh_key \
                     "$candidate@$OVH_HOST" 'printf ready' 2>/dev/null | grep -q ready; then
                printf '%s\n' "$candidate" > /tmp/ovh_user
                echo "Authenticated directly to OVH as $candidate"
                exit 0
              fi
            done
            sleep 5
          done
          mkdir -p .github/deployment-status
          cat > .github/deployment-status/ovh-auth-blocked.txt <<EOF
          checkedAt=$(date -u +%FT%TZ)
          host=$OVH_HOST
          SSH_REACHABLE=true
          AUTH_SUCCESS=false
          reason=protected_key_not_authorized_on_host
          browser_automation_required=false
          EOF
          echo 'OVH SSH is reachable, but the protected deployment key is not authorized on the VPS.' >&2
          exit 2

      - name: Build transport locally before remote deployment
        if: steps.completed.outputs.skip != 'true'
        working-directory: ops/transport-ovh
        run: docker build -t fgb-transport-preflight .

      - name: Bootstrap staging transport host directly over SSH
        if: steps.completed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          remote_user=$(cat /tmp/ovh_user)
          if [ "$remote_user" = root ]; then
            ssh -o UserKnownHostsFile=~/.ssh/ovh_known_hosts -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key "$remote_user@$OVH_HOST" 'bash -s' < ops/transport-ovh/bootstrap-ovh.sh
          else
            ssh -o UserKnownHostsFile=~/.ssh/ovh_known_hosts -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key "$remote_user@$OVH_HOST" 'sudo -n bash -s' < ops/transport-ovh/bootstrap-ovh.sh
          fi

      - name: Verify safe staging state
        if: steps.completed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          remote_user=$(cat /tmp/ovh_user)
          ssh -o UserKnownHostsFile=~/.ssh/ovh_known_hosts -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key "$remote_user@$OVH_HOST" 'bash -s' <<'REMOTE' | tee /tmp/ovh-staging-status.txt
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
          test -f /opt/fgb-transport/BOOTSTRAP_COMPLETE
          test -f /opt/fgb-transport/NEEDS_SECRETS
          docker --version
          docker compose version
          $SUDO systemctl is-active --quiet docker
          $SUDO systemctl is-active --quiet ssh
          if $SUDO systemctl is-active --quiet fgb-transport.service; then
            echo 'ERROR: transport service unexpectedly active before secrets' >&2
            exit 1
          fi
          enabled=$($SUDO systemctl is-enabled fgb-transport.service 2>/dev/null || true)
          test "$enabled" != enabled
          image_count=$($SUDO docker images --format '{{.Repository}}' | grep -c '^transport-ovh' || true)
          echo 'STAGING_READY=true'
          echo "TRANSPORT_SERVICE_ENABLED=$enabled"
          echo 'TRANSPORT_SERVICE_ACTIVE=false'
          echo 'SSH_ACTIVE=true'
          echo 'NEEDS_SECRETS=true'
          echo "TRANSPORT_IMAGES=$image_count"
          echo "HOST=$(hostname)"
          echo "OS=$( . /etc/os-release; printf '%s %s' "$NAME" "$VERSION_ID" )"
          REMOTE

      - name: Persist sanitized deployment status
        if: steps.completed.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p .github/deployment-status
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          vals={}
          for line in Path('/tmp/ovh-staging-status.txt').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1)
                  if k in {'STAGING_READY','TRANSPORT_SERVICE_ENABLED','TRANSPORT_SERVICE_ACTIVE','SSH_ACTIVE','NEEDS_SECRETS','TRANSPORT_IMAGES','HOST','OS'}:
                      vals[k]=v
          data={
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'host': '40.160.144.185',
              'mode': 'staging',
              'controlPlane': 'github-actions-direct-ssh',
              'browserAutomationRequired': False,
              'status': vals,
          }
          Path('.github/deployment-status/ovh-transport-staging.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/ovh-transport-staging.json
          git commit -m 'Record direct OVH transport staging deployment' || exit 0
          git push
