name: Fix Live Leaderboard Points

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-leaderboard-points.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fgbears-leaderboard-points-fix
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch renderer contract and validate
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('services/fgbears-live/bin/game_overlay.py')
          s=p.read_text()
          old='''            score = _integer(row.get("score"), 0, 0, 1_000_000)\n            players = _integer(row.get("players") or row.get("participants"), 0, 0, 1_000_000)'''
          new='''            # Current public contract uses teamScore/uniquePlayers. Keep the\n            # legacy names only as backward-compatible fallbacks.\n            score_value = row.get("teamScore") if row.get("teamScore") is not None else row.get("score")\n            players_value = (\n                row.get("uniquePlayers")\n                if row.get("uniquePlayers") is not None\n                else (row.get("players") if row.get("players") is not None else row.get("participants"))\n            )\n            score = _integer(score_value, 0, 0, 1_000_000)\n            players = _integer(players_value, 0, 0, 1_000_000)'''
          if old not in s:
              raise SystemExit('expected legacy standings field block not found')
          p.write_text(s.replace(old,new,1))
          PY
          python3 -m py_compile services/fgbears-live/bin/game_overlay.py services/fgbears-live/bin/game_overlay_policy.py services/fgbears-live/bin/ad-overlay-smart.py
          grep -Fq 'row.get("teamScore")' services/fgbears-live/bin/game_overlay.py
          grep -Fq 'row.get("uniquePlayers")' services/fgbears-live/bin/game_overlay.py
          echo 'RENDERER_CONTRACT_TEST=PASS'

      - name: Commit source repair
        id: commit
        run: |
          set -Eeuo pipefail
          git config user.name 'FGB Production Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add services/fgbears-live/bin/game_overlay.py
          git commit -m 'Fix livestream leaderboard points contract'
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "old_sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Install and controlled-restart shared program with rollback
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          NEW_SHA: ${{ steps.commit.outputs.new_sha }}
          OLD_SHA: ${{ steps.commit.outputs.old_sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" "NEW_SHA='$NEW_SHA' OLD_SHA='$OLD_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          rollback(){
            rc=$?
            echo "ROLLBACK_TRIGGERED=true rc=$rc"
            rm -rf /tmp/fgbears-leaderboard-rollback
            git clone -q https://github.com/mrkenapierce/FGB-Production-Studio.git /tmp/fgbears-leaderboard-rollback
            cd /tmp/fgbears-leaderboard-rollback
            git checkout -q "$OLD_SHA"
            sudo bash services/fgbears-live/bin/install.sh >/dev/null
            sudo systemctl restart fgbears-live.service
            sleep 8
            exit "$rc"
          }
          trap rollback ERR

          master_before=$(systemctl show -p MainPID --value fgbears-live.service)
          echo "MASTER_BEFORE=$master_before"
          rm -rf /tmp/fgbears-leaderboard-fix
          git clone -q https://github.com/mrkenapierce/FGB-Production-Studio.git /tmp/fgbears-leaderboard-fix
          cd /tmp/fgbears-leaderboard-fix
          git checkout -q "$NEW_SHA"
          python3 -m py_compile services/fgbears-live/bin/game_overlay.py services/fgbears-live/bin/game_overlay_policy.py services/fgbears-live/bin/ad-overlay-smart.py
          grep -Fq 'row.get("teamScore")' services/fgbears-live/bin/game_overlay.py
          grep -Fq 'row.get("uniquePlayers")' services/fgbears-live/bin/game_overlay.py
          sudo bash services/fgbears-live/bin/install.sh >/dev/null

          # The renderer is a child of the shared service and imports the policy at
          # process start, so one controlled shared restart is required to load the
          # corrected contract. The service itself restarts the YouTube copy relay.
          sudo systemctl restart fgbears-live.service
          for i in $(seq 1 30); do
            if systemctl is-active --quiet fgbears-live.service \
              && systemctl is-active --quiet fgbears-youtube-copy-relay.service \
              && curl -fsS --max-time 1 http://127.0.0.1:8787/healthz >/dev/null \
              && curl -fsS --max-time 1 http://127.0.0.1:8788/healthz >/dev/null \
              && curl -fsS --max-time 1 http://127.0.0.1:8789/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-copy-relay.service
          curl -fsS --max-time 2 http://127.0.0.1:8787/healthz >/dev/null
          curl -fsS --max-time 2 http://127.0.0.1:8788/healthz >/dev/null
          curl -fsS --max-time 2 http://127.0.0.1:8789/healthz >/dev/null
          grep -Fq 'row.get("teamScore")' /opt/fgbears-live/bin/game_overlay.py
          grep -Fq 'row.get("uniquePlayers")' /opt/fgbears-live/bin/game_overlay.py
          sleep 12
          restarts=$(systemctl show -p NRestarts --value fgbears-live.service)
          master_after=$(systemctl show -p MainPID --value fgbears-live.service)
          yt_after=$(systemctl show -p MainPID --value fgbears-youtube-copy-relay.service)
          [[ "$master_after" =~ ^[1-9][0-9]*$ ]]
          [[ "$yt_after" =~ ^[1-9][0-9]*$ ]]
          ss -Htnp 2>/dev/null | grep -qE 'youtube|google|:443' || true
          echo "LEADERBOARD_RENDERER_DEPLOY=PASS master_before=$master_before master_after=$master_after youtube_pid=$yt_after restarts=$restarts"
          trap - ERR
          REMOTE
