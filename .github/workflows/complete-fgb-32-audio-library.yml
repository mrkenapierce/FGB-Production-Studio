name: Complete FGB 32-Episode Audio Library

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-fgb-32-audio-library.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-live-production-deploy
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu
  EPISODE_32_URL: https://www.youtube.com/watch?v=PUsi9hNXnhw

jobs:
  complete-library:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Fetch Episode 32 source from the published FGB video
        run: |
          python3 -m pip install --disable-pip-version-check --quiet yt-dlp
          mkdir -p /tmp/fgb-episode32
          python3 -m yt_dlp \
            --no-playlist \
            --merge-output-format mp4 \
            -f 'bv*[height<=720]+ba/b[height<=720]' \
            -o '/tmp/fgb-episode32/FGBears-Episode-32.source.%(ext)s' \
            "$EPISODE_32_URL"
          source_file=$(find /tmp/fgb-episode32 -maxdepth 1 -type f -name 'FGBears-Episode-32.source.*' ! -name '*.part' | head -n1)
          test -s "$source_file"
          ffprobe -v error -select_streams v:0 -show_entries stream=index -of csv=p=0 "$source_file" | grep -q .
          ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$source_file" | grep -q .
          mv "$source_file" /tmp/FGBears-Episode-32.source.mp4

      - name: Transfer Episode 32 source to Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          scp -i ~/.ssh/oracle_key /tmp/FGBears-Episode-32.source.mp4 "$ORACLE_USER@$ORACLE_HOST:/tmp/FGBears-Episode-32.source.mp4"

      - name: Normalize all 32 assets and verify outgoing stream
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          REPO=/tmp/fgb-32-library
          MEDIA_DIR=/srv/fgbears-live/media
          WORK_DIR=/srv/fgbears-live/.audio-migration-32
          PLAYLIST=/srv/fgbears-live/playlist.ffconcat
          PROFILE=fgb-podcast-v1
          SOURCE32=/tmp/FGBears-Episode-32.source.mp4

          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          sudo grep -q '^PODCAST_AUDIO_FILTER=volume=-2dB,aresample=48000:first_pts=0$' /etc/fgbears-live/stream.env

          rm -rf "$REPO"
          git clone --depth 1 https://github.com/mrkenapierce/FGB-Production-Studio.git "$REPO"
          NORMALIZER="$REPO/services/fgbears-live/bin/normalize-library.sh"
          VALIDATOR="$REPO/services/fgbears-live/bin/validate-media.sh"
          chmod +x "$NORMALIZER" "$VALIDATOR"

          sudo mkdir -p "$WORK_DIR"
          sudo chown "$USER":"$USER" "$WORK_DIR"

          valid_profile() {
            local asset=$1 marker=$2 sha
            [[ -s "$asset" && -s "$marker" ]] || return 1
            sha=$(sha256sum "$asset" | awk '{print $1}')
            jq -e --arg profile "$PROFILE" --arg sha "$sha" '.profile == $profile and .sha256 == $sha and ((.measured_i_lufs + 14) | if . < 0 then -. else . end) <= 0.8 and .measured_tp_dbtp <= -1.0' "$marker" >/dev/null 2>&1
          }

          robust_normalize() {
            local input=$1 output=$2 base=$3 rc=0
            rm -f "$output" "${output}.audio-profile.json" "${output%.mp4}.partial.mp4"
            if command -v ionice >/dev/null 2>&1; then
              nice -n 10 ionice -c2 -n7 bash "$NORMALIZER" "$input" "$output" || rc=$?
            else
              nice -n 10 bash "$NORMALIZER" "$input" "$output" || rc=$?
            fi
            if (( rc == 0 )); then return 0; fi
            echo "Primary normalization rejected for $base; retrying dynamic loudnorm at -3.0 dBTP"
            rm -f "$output" "${output}.audio-profile.json" "${output%.mp4}.partial.mp4"
            local dyn="$WORK_DIR/normalize-dynamic.sh"
            sed 's/linear=true:print_format=summary/linear=false:print_format=summary/' "$NORMALIZER" > "$dyn"
            chmod +x "$dyn"
            if command -v ionice >/dev/null 2>&1; then
              env FGB_LOUDNESS_TARGET_TP=-3.0 nice -n 10 ionice -c2 -n7 bash "$dyn" "$input" "$output"
            else
              env FGB_LOUDNESS_TARGET_TP=-3.0 nice -n 10 bash "$dyn" "$input" "$output"
            fi
          }

          promote() {
            local output=$1 target=$2
            local marker="${output}.audio-profile.json" target_marker="${target}.audio-profile.json"
            valid_profile "$output" "$marker"
            sudo chown fgbears:fgbears "$output" "$marker"
            sudo chmod 0644 "$output" "$marker"
            sudo mv -f "$output" "$target"
            sudo mv -f "$marker" "$target_marker"
          }

          # Add the missing Episode 32 without restarting yet.
          target32="$MEDIA_DIR/FGBears-Episode-32.mp4"
          marker32="${target32}.audio-profile.json"
          if ! valid_profile "$target32" "$marker32"; then
            test -s "$SOURCE32"
            output32="$WORK_DIR/FGBears-Episode-32.mp4"
            robust_normalize "$SOURCE32" "$output32" 'FGBears-Episode-32.mp4'
            promote "$output32" "$target32"
          fi

          mapfile -d '' media_files < <(find "$MEDIA_DIR" -maxdepth 1 -type f -name '*.mp4' -print0 | sort -zV)
          [[ ${#media_files[@]} -eq 32 ]] || { echo "Expected 32 production MP4 files, found ${#media_files[@]}" >&2; exit 65; }

          # Resume/finish loudness normalization for any remaining unverified assets.
          for file in "${media_files[@]}"; do
            marker="${file}.audio-profile.json"
            base=$(basename "$file")
            if valid_profile "$file" "$marker"; then
              echo "SKIP verified production asset: $base"
              continue
            fi
            output="$WORK_DIR/$base"
            robust_normalize "$file" "$output" "$base"
            promote "$output" "$file"
          done

          bash "$VALIDATOR" "$MEDIA_DIR"
          marker_count=$(find "$MEDIA_DIR" -maxdepth 1 -type f -name '*.mp4.audio-profile.json' | wc -l | tr -d ' ')
          [[ "$marker_count" -eq 32 ]]
          for n in $(seq -w 1 32); do
            test -s "$MEDIA_DIR/FGBears-Episode-${n}.mp4"
          done

          sudo install -m 0755 "$NORMALIZER" /usr/local/bin/fgbears-normalize
          sudo install -m 0755 "$VALIDATOR" /usr/local/bin/fgbears-validate
          sudo install -m 0755 "$REPO/services/fgbears-live/bin/rebuild-playlist.sh" /usr/local/bin/fgbears-rebuild-playlist
          sudo install -m 0755 "$REPO/services/fgbears-live/bin/audio-health.py" /usr/local/bin/fgbears-audio-health
          sudo /usr/local/bin/fgbears-rebuild-playlist
          playlist_count=$(grep -c "^file '/srv/fgbears-live/media/FGBears-Episode-.*\.mp4'$" "$PLAYLIST")
          [[ "$playlist_count" -eq 32 ]]
          grep -q "FGBears-Episode-32.mp4" "$PLAYLIST"

          # One activation restart after the complete 32-episode library is ready.
          sudo systemctl restart fgbears-live.service
          for _ in $(seq 1 60); do
            if systemctl is-active --quiet fgbears-live.service && systemctl is-active --quiet fgbears-youtube-relay.service; then
              sleep 3
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          sudo grep -q '^PODCAST_AUDIO_FILTER=volume=-2dB,aresample=48000:first_pts=0$' /etc/fgbears-live/stream.env
          ! sudo grep -Eq '^(X_|INSTAGRAM_|FACEBOOK_)' /etc/fgbears-live/stream.env

          echo '=== 32-EPISODE PROFILE SUMMARY ==='
          jq -s '{files:length,min_i_lufs:(map(.measured_i_lufs)|min),max_i_lufs:(map(.measured_i_lufs)|max),max_true_peak_dbtp:(map(.measured_tp_dbtp)|max)}' "$MEDIA_DIR"/*.mp4.audio-profile.json

          echo '=== EXACT YOUTUBE-BOUND AUDIO ==='
          sudo /usr/local/bin/fgbears-audio-health --capture-seconds 20

          echo '=== STREAM CADENCE ==='
          progress=/srv/fgbears-live/logs/ffmpeg-progress.log
          first_media=$(sudo sed -n 's/^out_time_us=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          first_frame=$(sudo sed -n 's/^frame=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          first_epoch=$(date +%s%N)
          sleep 10
          second_media=$(sudo sed -n 's/^out_time_us=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          second_frame=$(sudo sed -n 's/^frame=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          dropped=$(sudo sed -n 's/^drop_frames=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          second_epoch=$(date +%s%N)
          awk -v m1="$first_media" -v m2="$second_media" -v f1="$first_frame" -v f2="$second_frame" -v e1="$first_epoch" -v e2="$second_epoch" -v dropped="${dropped:-0}" 'BEGIN {wall=(e2-e1)/1000000000;program=(m2-m1)/1000000;ratio=program/wall;fps=(f2-f1)/wall;printf "program=%.3fs wall=%.3fs ratio=%.3fx fps=%.2f dropped=%d\n",program,wall,ratio,fps,dropped;if(ratio<0.95||fps<28.5||dropped!=0)exit 1}'

          rm -f "$SOURCE32"
          rm -rf "$WORK_DIR" "$REPO"
          echo 'FGB_32_EPISODE_LIBRARY=SUCCESS'
          REMOTE