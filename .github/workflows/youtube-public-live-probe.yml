name: YouTube Public Live Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-public-live-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Probe canonical YouTube broadcast read-only
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          python3 - <<'PY'
          import json, re, time, urllib.request, urllib.parse
          video_id='QxmLpaargj0'
          ua='Mozilla/5.0'
          def fetch(url, data=None, headers=None, timeout=12):
              h={'User-Agent':ua}
              if headers: h.update(headers)
              req=urllib.request.Request(url, data=data, headers=h)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.read()
          code, raw=fetch(f'https://www.youtube.com/watch?v={video_id}&hl=en')
          body=raw.decode('utf-8','replace')
          live_now='"isLiveNow":true' in body or '"isLive":true' in body
          print(f'watch_http={code}')
          print(f'video_id_present={str(video_id in body).lower()}')
          print(f'live_marker={str(live_now).lower()}')
          key=re.search(r'"INNERTUBE_API_KEY":"([^"]+)"', body)
          ver=re.search(r'"INNERTUBE_CLIENT_VERSION":"([^"]+)"', body)
          hls=None
          if key and ver:
              payload=json.dumps({'context':{'client':{'clientName':'WEB','clientVersion':ver.group(1)}},'videoId':video_id,'contentCheckOk':True,'racyCheckOk':True}).encode()
              pcode,praw=fetch('https://www.youtube.com/youtubei/v1/player?key='+key.group(1), payload, {'Content-Type':'application/json'})
              player=json.loads(praw)
              hls=(player.get('streamingData') or {}).get('hlsManifestUrl')
              print(f'player_http={pcode}')
              print(f'player_status={(player.get("playabilityStatus") or {}).get("status","unknown")}')
          print(f'hls_manifest_present={str(bool(hls)).lower()}')
          advancing=False
          if hls:
              def latest_token():
                  _, mraw=fetch(hls)
                  master=mraw.decode('utf-8','replace')
                  variants=[x.strip() for x in master.splitlines() if x.strip() and not x.startswith('#')]
                  media_url=urllib.parse.urljoin(hls, variants[0]) if variants else hls
                  _, vraw=fetch(media_url)
                  media=vraw.decode('utf-8','replace')
                  seq=re.search(r'#EXT-X-MEDIA-SEQUENCE:(\d+)', media)
                  segments=[x.strip() for x in media.splitlines() if x.strip() and not x.startswith('#')]
                  token=(seq.group(1) if seq else '')+'|'+(segments[-1] if segments else '')
                  return token
              try:
                  first=latest_token()
                  time.sleep(8)
                  second=latest_token()
                  advancing=bool(first and second and first != second)
              except Exception as e:
                  print(f'hls_probe_error={type(e).__name__}')
          print(f'hls_advancing={str(advancing).lower()}')
          if code==200 and video_id in body and live_now and advancing:
              print('YOUTUBE_PUBLIC_PROBE=PASS')
          else:
              print('YOUTUBE_PUBLIC_PROBE=INCONCLUSIVE')
              raise SystemExit(2)
          PY
          REMOTE
