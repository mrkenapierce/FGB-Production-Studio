name: Restore YouTube Continuous Live V3

on:
  push:
    paths:
      - '.github/workflows/restore-youtube-continuous-live-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-cutover
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Restore continuous full-size YouTube relay
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          DIRECT=fgbears-youtube-relay.service
          ROUTER=fgbears-youtube-router.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service
          WATCHDOG=fgbears-youtube-audio-watchdog.timer
          FREEZE_TIMER=fgbears-youtube-freeze-card-refresh.timer
          HEALTH_DIR=/etc/systemd/system/fgbears-live-health.service.d

          active() { systemctl is-active --quiet "$1"; }
          pid() { systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          rtmps_connected() {
            local p="$1"
            sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" 'index($0,q) && $0 ~ /:443([[:space:]]|$)/ {found=1} END {exit(found?0:1)}'
          }

          active "$MASTER"
          active "$RUMBLE"
          master0=$(pid "$MASTER")
          rumble0=$(pid "$RUMBLE")
          [[ "$master0" =~ ^[1-9][0-9]*$ && "$rumble0" =~ ^[1-9][0-9]*$ ]]
          echo "pre_master_pid=$master0 pre_rumble_pid=$rumble0"

          rollback() {
            set +e
            echo 'DIRECT_RELAY_ROLLBACK=START'
            sudo systemctl stop "$DIRECT" >/dev/null 2>&1 || true
            # Prefer the previously-running full-size router if direct relay cannot connect.
            sudo install -d -m 0755 "$HEALTH_DIR"
            printf '%s\n' '[Service]' 'Environment=YOUTUBE_RELAY_SERVICE=fgbears-youtube-router.service' | sudo tee "$HEALTH_DIR/99-youtube-fullsize-emergency.conf" >/dev/null
            sudo systemctl daemon-reload
            sudo systemctl enable "$ROUTER" >/dev/null 2>&1 || true
            sudo systemctl start "$ROUTER" >/dev/null 2>&1 || true
            echo "rollback_router=$(systemctl is-active "$ROUTER" 2>/dev/null || true)"
          }
          success=0
          trap 'rc=$?; if (( success == 0 )); then rollback; fi; exit $rc' EXIT

          # Disable every path that can freeze or shrink the YouTube image.
          sudo systemctl disable --now "$FREEZE_TIMER" >/dev/null 2>&1 || true
          sudo systemctl stop fgbears-youtube-freeze-card-refresh.service >/dev/null 2>&1 || true
          sudo systemctl disable --now "$COMP" >/dev/null 2>&1 || true
          sudo systemctl stop "$ROUTER" >/dev/null 2>&1 || true
          sudo systemctl disable "$ROUTER" >/dev/null 2>&1 || true

          # Remove YouTube-specific health overrides so supervision returns to direct relay.
          sudo rm -f "$HEALTH_DIR/90-youtube-emergency-router.conf" "$HEALTH_DIR/99-youtube-fullsize-emergency.conf"
          sudo systemctl daemon-reload

          sudo systemctl reset-failed "$DIRECT" >/dev/null 2>&1 || true
          sudo systemctl enable "$DIRECT" >/dev/null
          sudo systemctl start "$DIRECT"

          connected=0
          direct_pid=0
          ff=0
          for _ in $(seq 1 45); do
            active "$DIRECT" || { sleep 1; continue; }
            direct_pid=$(pid "$DIRECT")
            if [[ "$direct_pid" =~ ^[1-9][0-9]*$ ]]; then
              # relay may exec ffmpeg or retain a shell wrapper
              if [[ "$(cat /proc/$direct_pid/comm 2>/dev/null || true)" == ffmpeg ]]; then
                ff="$direct_pid"
              else
                ff=$(pgrep -P "$direct_pid" ffmpeg | head -n1 || true)
              fi
              if [[ "$ff" =~ ^[1-9][0-9]*$ ]] && rtmps_connected "$ff"; then
                connected=1
                break
              fi
            fi
            sleep 1
          done
          (( connected == 1 ))

          sudo systemctl enable --now "$WATCHDOG" >/dev/null 2>&1 || true

          [[ "$(pid "$MASTER")" == "$master0" ]]
          [[ "$(pid "$RUMBLE")" == "$rumble0" ]]
          active "$MASTER"
          active "$RUMBLE"
          active "$DIRECT"
          ! active "$ROUTER"
          ! active "$COMP"
          ! active "$FREEZE_TIMER"
          rtmps_connected "$ff"

          # Prove the direct relay is packet-preserving and contains no downscale compositor.
          cmd=$(tr '\0' ' ' <"/proc/$ff/cmdline")
          [[ "$cmd" != *'scale=640:360'* ]]
          [[ "$cmd" != *'overlay=231:52'* ]]

          success=1
          trap - EXIT
          echo "MASTER_PID_UNCHANGED=$(pid "$MASTER")"
          echo "RUMBLE_PID_UNCHANGED=$(pid "$RUMBLE")"
          echo "YOUTUBE_DIRECT_PID=$direct_pid ffmpeg_pid=$ff"
          echo 'YOUTUBE_RTMPS_ESTABLISHED=yes'
          echo 'YOUTUBE_ROUTER=disabled_inactive'
          echo 'YOUTUBE_360_COMPOSITOR=disabled_inactive'
          echo 'YOUTUBE_FREEZE_REFRESH=disabled_inactive'
          echo 'RSS_AND_CRAWL_PATH=continuous_live_1280x720'
          echo 'RESTORE_CONTINUOUS_YOUTUBE_LIVE_V3=PASS'
          REMOTE
