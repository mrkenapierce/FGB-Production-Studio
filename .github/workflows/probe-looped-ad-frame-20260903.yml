name: Probe Looped Ad Frame 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-looped-ad-frame-20260903.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Test image2 loop refresh off production path
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          src=/srv/fgbears-live/runtime/ad-frame.jpg
          test -s "$src"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cp "$src" "$work/frame.jpg"
          python3 - "$work/frame2.jpg" <<'PY'
          from PIL import Image, ImageOps
          import sys
          im=Image.open('/srv/fgbears-live/runtime/ad-frame.jpg').convert('RGB')
          ImageOps.invert(im).save(sys.argv[1], 'JPEG', quality=92)
          PY
          (
            sleep 2
            mv "$work/frame2.jpg" "$work/frame.jpg"
          ) &
          start=$(date +%s%N)
          ffmpeg -hide_banner -nostdin -loglevel error -loop 1 -framerate 30 -i "$work/frame.jpg" -t 4 -f framemd5 "$work/hashes.txt"
          end=$(date +%s%N)
          unique=$(awk '!/^#/ {print $6}' "$work/hashes.txt" | sort -u | wc -l)
          frames=$(awk '!/^#/ {n++} END{print n+0}' "$work/hashes.txt")
          echo "LOOP_FRAME_TEST frames=$frames unique_hashes=$unique wall_ns=$((end-start))"
          test "$frames" -ge 115
          test "$unique" -ge 2
          echo 'LOOPED_AD_FRAME_DYNAMIC=PASS'
          REMOTE
