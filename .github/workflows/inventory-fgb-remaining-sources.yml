name: Inventory FGB Remaining Sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-fgb-remaining-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Acquire Episode 32 source on Oracle without touching live media
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ubuntu
        run: |
          ssh -o ServerAliveInterval=30 -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          URL='https://www.youtube.com/watch?v=PUsi9hNXnhw'
          OUT='/home/ubuntu/fgbears-upload/FGBears-Episode-32.mp4'
          TMP='/tmp/fgb-episode32-source'
          TOOL='/tmp/yt-dlp-fgb'
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          if [[ -s "$OUT" ]]; then
            echo 'EPISODE_32_SOURCE=ALREADY_PRESENT'
            exit 0
          fi
          mkdir -p /home/ubuntu/fgbears-upload "$TMP"
          rm -f "$TMP"/*
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o "$TOOL"
          chmod +x "$TOOL"
          ok=0
          for client in web_embedded web_safari tv ios android_vr; do
            echo "TRY_CLIENT=$client"
            rm -f "$TMP"/source.* "$TMP"/*.part
            if "$TOOL" --no-playlist --js-runtimes node --extractor-args "youtube:player_client=${client}" --merge-output-format mp4 -f 'bv*[height<=720]+ba/b[height<=720]' -o "$TMP/source.%(ext)s" "$URL"; then
              ok=1
              break
            fi
          done
          [[ "$ok" -eq 1 ]]
          src=$(find "$TMP" -maxdepth 1 -type f -name 'source.*' ! -name '*.part' -print -quit)
          test -s "$src"
          ffprobe -v error -select_streams v:0 -show_entries stream=index -of csv=p=0 "$src" | grep -q .
          ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$src" | grep -q .
          install -m 0644 "$src" "$OUT"
          echo 'EPISODE_32_SOURCE=READY'
          rm -rf "$TMP" "$TOOL"
          REMOTE

      - name: Inventory original and production assets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ubuntu
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "LIVE=$(systemctl is-active fgbears-live.service || true)"
          echo "RELAY=$(systemctl is-active fgbears-youtube-relay.service || true)"
          echo '=== PLAYLIST ==='
          sed -n "s#^file '.*FGBears-Episode-\([0-9][0-9]\)\.mp4'#EPISODE=\1#p" /srv/fgbears-live/playlist.ffconcat || true
          echo '=== SOURCES 01-32 ==='
          for n in $(seq -w 1 32); do
            prod="/srv/fgbears-live/media/FGBears-Episode-${n}.mp4"
            orig="/home/ubuntu/fgbears-upload/FGBears-Episode-${n}.mp4"
            hq="/srv/fgbears-live/hq-audio-staging/FGBears-Episode-${n}.mp4"
            printf 'EPISODE=%s PROD=%s ORIG=%s HQ=%s ' "$n" "$([[ -s "$prod" ]] && echo YES || echo NO)" "$([[ -s "$orig" ]] && echo YES || echo NO)" "$([[ -s "$hq" ]] && echo YES || echo NO)"
            src="$orig"; [[ -s "$src" ]] || src="$prod"; [[ -s "$src" ]] || src="$hq"
            if [[ -s "$src" ]]; then
              printf 'SRC=%s ' "$src"
              ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels,bit_rate -of csv=p=0 "$src" | tr '\n' ' '
              marker="${prod}.audio-profile.json"
              [[ -s "$marker" ]] && printf ' PROFILE=YES' || printf ' PROFILE=NO'
            fi
            echo
          done
          echo '=== EPISODE 32 CANDIDATES ==='
          sudo find /home/ubuntu /srv/fgbears-live -maxdepth 4 -type f \( -iname '*Episode*32*.mp4' -o -iname '*episode*32*.mp4' -o -iname '*32*.m4a' -o -iname '*32*.aac' \) -printf '%s %p\n' 2>/dev/null | sort -nr | head -n 30 || true
          REMOTE
