name: Verify YouTube Copy Relay Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-youtube-copy-relay-failure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify production relay runtime
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "ubuntu@$ORACLE_HOST" 'bash -s' <<'REMOTE' | tee /tmp/youtube-relay-runtime.txt
          set -Eeuo pipefail
          unit=fgbears-youtube-copy-relay.service
          master=fgbears-live.service
          p=$(systemctl show -p MainPID --value "$unit" 2>/dev/null || echo 0)
          mp=$(systemctl show -p MainPID --value "$master" 2>/dev/null || echo 0)
          echo "CURRENT_ACTIVE=$(systemctl is-active "$unit" 2>/dev/null || true)"
          echo "CURRENT_ENABLED=$(systemctl is-enabled "$unit" 2>/dev/null || true)"
          echo "CURRENT_PID=$p"
          echo "MASTER_PID=$mp"
          echo "CURRENT_RESTARTS=$(systemctl show -p NRestarts --value "$unit" 2>/dev/null || echo 0)"
          [[ "$p" =~ ^[1-9][0-9]*$ ]]
          args=$(tr '\0' ' ' < "/proc/$p/cmdline")
          if grep -Fq -- '-probesize 3000000 -analyzeduration 3000000' <<<"$args"; then echo 'LOW_LATENCY_DISCOVERY=true'; else echo 'LOW_LATENCY_DISCOVERY=false'; fi
          if grep -Fq -- '-flush_packets 1' <<<"$args"; then echo 'IMMEDIATE_FLUSH=true'; else echo 'IMMEDIATE_FLUSH=false'; fi
          if grep -Fq -- '+nobuffer' <<<"$args"; then echo 'NOBUFFER_ACTIVE=true'; else echo 'NOBUFFER_ACTIVE=false'; fi
          if sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" 'index($0,q)&&index($0,":443"){ok=1} END{exit(ok?0:1)}'; then echo 'YOUTUBE_RTMPS_CONNECTED=true'; else echo 'YOUTUBE_RTMPS_CONNECTED=false'; fi
          sleep 10
          echo "PID_STABLE=$([[ "$(systemctl show -p MainPID --value "$unit")" == "$p" ]] && echo true || echo false)"
          echo "MASTER_STABLE=$([[ "$(systemctl show -p MainPID --value "$master")" == "$mp" ]] && echo true || echo false)"
          REMOTE

      - name: Persist sanitized runtime verification
        run: |
          set -Eeuo pipefail
          mkdir -p .github/deployment-status
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          allowed={
            'CURRENT_ACTIVE','CURRENT_ENABLED','CURRENT_PID','MASTER_PID','CURRENT_RESTARTS',
            'LOW_LATENCY_DISCOVERY','IMMEDIATE_FLUSH','NOBUFFER_ACTIVE','YOUTUBE_RTMPS_CONNECTED',
            'PID_STABLE','MASTER_STABLE'
          }
          vals={}
          for line in Path('/tmp/youtube-relay-runtime.txt').read_text(encoding='utf-8').splitlines():
              if '=' in line:
                  k,v=line.split('=',1)
                  if k in allowed: vals[k]=v
          body={'checkedAt':datetime.now(timezone.utc).isoformat(),'current':vals}
          Path('.github/deployment-status/youtube-copy-relay-runtime.json').write_text(json.dumps(body,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/youtube-copy-relay-runtime.json
          git commit -m 'Record YouTube relay runtime verification'
          git push
