name: Discover FGBears YouTube OAuth Secret Names

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-youtube-oauth-secret-discover.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record presence only
        env:
          FGB_YOUTUBE_CLIENT_ID: ${{ secrets.FGB_YOUTUBE_CLIENT_ID }}
          FGB_YOUTUBE_CLIENT_SECRET: ${{ secrets.FGB_YOUTUBE_CLIENT_SECRET }}
          FGB_YOUTUBE_REFRESH_TOKEN: ${{ secrets.FGB_YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          present() { [[ -n "${1:-}" ]] && printf true || printf false; }
          mkdir -p .github/deployment-status
          jq -n \
            --argjson fgbClientId "$(present "$FGB_YOUTUBE_CLIENT_ID")" \
            --argjson fgbClientSecret "$(present "$FGB_YOUTUBE_CLIENT_SECRET")" \
            --argjson fgbRefreshToken "$(present "$FGB_YOUTUBE_REFRESH_TOKEN")" \
            --argjson youtubeClientId "$(present "$YOUTUBE_CLIENT_ID")" \
            --argjson youtubeClientSecret "$(present "$YOUTUBE_CLIENT_SECRET")" \
            --argjson youtubeRefreshToken "$(present "$YOUTUBE_REFRESH_TOKEN")" \
            --argjson oauthClientId "$(present "$YOUTUBE_OAUTH_CLIENT_ID")" \
            --argjson oauthClientSecret "$(present "$YOUTUBE_OAUTH_CLIENT_SECRET")" \
            --argjson oauthRefreshToken "$(present "$YOUTUBE_OAUTH_REFRESH_TOKEN")" \
            --argjson googleClientId "$(present "$GOOGLE_CLIENT_ID")" \
            --argjson googleClientSecret "$(present "$GOOGLE_CLIENT_SECRET")" \
            --argjson googleRefreshToken "$(present "$GOOGLE_REFRESH_TOKEN")" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{fgb:{clientId:$fgbClientId,clientSecret:$fgbClientSecret,refreshToken:$fgbRefreshToken},youtube:{clientId:$youtubeClientId,clientSecret:$youtubeClientSecret,refreshToken:$youtubeRefreshToken},youtubeOauth:{clientId:$oauthClientId,clientSecret:$oauthClientSecret,refreshToken:$oauthRefreshToken},google:{clientId:$googleClientId,clientSecret:$googleClientSecret,refreshToken:$googleRefreshToken},checkedAt:$checkedAt,valuesExposed:false}' \
            > .github/deployment-status/fgbears-youtube-oauth-secret-presence.json
      - name: Commit safe result
        run: |
          git config user.name 'FGBears Deploy Bot'
          git config user.email 'actions@github.com'
          git add .github/deployment-status/fgbears-youtube-oauth-secret-presence.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record YouTube OAuth secret presence [skip ci]'
          git push origin main
