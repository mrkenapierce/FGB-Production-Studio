name: Inspect EPIC isolated publisher host readiness (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/epic-publisher-host-preflight-20261119.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up protected OVH SSH
        env:
          KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ovh
          chmod 600 ~/.ssh/ovh
          unset KEY
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Inspect mounts, image, publisher dependencies, and host tools
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i ~/.ssh/ovh ubuntu@40.160.144.185 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          echo "CHECK_UTC=$(date -u +%FT%TZ)"
          echo "SYSTEM=$(uname -sr)"
          echo "FILESYSTEM"; df -h /srv/cnt-archive
          echo "PYTHON"; python3 --version
          echo "DOCKER"; docker --version
          for box in epic-cnt-archive-worker epic-cnt-capture; do
            echo "BEGIN_CONTAINER=$box"
            docker inspect --format 'NAME={{.Name}} IMAGE={{.Config.Image}} RUNNING={{.State.Running}} USER={{.Config.User}}' "$box"
            docker inspect --format '{{range .Mounts}}{{println "MOUNT" .Type .Source "=>" .Destination .RW}}{{end}}' "$box"
            docker exec "$box" python3 -c '
          import os,shutil
          from pathlib import Path
          print("WORKDIR=",os.getcwd())
          print("PYTHON=",shutil.which("python3"))
          print("LIB_SH=",list(map(str,Path(".").glob("episode-lib.sh"))))
          print("RETENTION=",list(map(str,Path(".").glob("archive-retention.py"))))
          print("CUTTER=",list(map(str,Path(".").glob("episode-cutter.sh"))))
          print("ARCHIVE_PRESENT=",Path("/cnt-archive/rolling").is_dir())
          print("WORKER_SCRIPT_PRESENT=",Path("/opt/epic-episode-publisher/epic-episode-cutter.py").exists())
          ' || true
            echo "END_CONTAINER=$box"
          done
          echo "HOST_RELEVANT_DIRS"
          for p in /srv/cnt-archive/state /srv/cnt-archive/rolling /srv/cnt-archive/episodes /opt/cnt-transport /opt/epic-episode-publisher; do
            if [ -d "$p" ]; then stat -c '%n owner=%U:%G mode=%a' "$p"; else echo "$p missing"; fi
          done
          echo "SYSTEMD_MATCHING_UNITS"
          systemctl list-unit-files --no-pager | grep -Ei 'epic.*publish|cnt.*archive|episode.*cutter' | head -20 || true
          echo "ARCHIVE_ENV_KEYS"
          for box in epic-cnt-archive-worker epic-cnt-capture; do
            echo "ENV_CONTAINER=$box"
            docker inspect "$box" --format '{{json .Config.Env}}' | python3 -c 'import json,sys; print("ENV_KEYS="+",".join(sorted(x.split("=",1)[0] for x in json.load(sys.stdin) if x.split("=",1)[0].startswith(("CNT_","EPIC_","EPISODE_")))))'
            docker inspect "$box" --format 'ENTRYPOINT={{json .Config.Entrypoint}} CMD={{json .Config.Cmd}}'
            docker exec "$box" sh -c 'id -u; id -g; test -r /run/secrets/cnt_archive_key && echo ARCHIVE_SECRET_FILE_READABLE=true || echo ARCHIVE_SECRET_FILE_READABLE=false'
          done
          echo "SIGNED_EPIC_ENDPOINT_PROBE"
          docker exec epic-cnt-archive-worker bash -lc '
            set -uo pipefail
            export CNT_ARCHIVE_HMAC_SECRET="$(cat "${CNT_ARCHIVE_KEY_FILE:-/run/secrets/cnt_archive_key}")"
            . ./episode-lib.sh
            response=$(ep_api "{\"action\":\"epic_episode_jobs\"}" 2>/dev/null) || { echo SIGNED_ENDPOINT_REACHABLE=false; exit 0; }
            echo SIGNED_ENDPOINT_REACHABLE=true
            printf "%s" "$response" | jq -r '\''"PROTOCOL_OK=" + ((.ok//false)|tostring), "PROTOCOL_ERROR=" + (.error//"none")'\'' | head -2
          ' || true
          echo "SIGNED_EPIC_HTTP_PROBE"
          docker exec epic-cnt-archive-worker bash -lc '
            set -uo pipefail
            export CNT_ARCHIVE_HMAC_SECRET="$(cat "${CNT_ARCHIVE_KEY_FILE:-/run/secrets/cnt_archive_key}")"
            body="{\"action\":\"epic_episode_jobs\"}"
            ts=$(date +%s)
            sig=$(printf "%s.%s" "$ts" "$body" | openssl dgst -sha256 -hmac "$CNT_ARCHIVE_HMAC_SECRET" -hex | awk "{print \\\$NF}")
            tmp=$(mktemp)
            status=$(curl -sS -m 20 -o "$tmp" -w "%{http_code}" -X POST "$CNT_ARCHIVE_URL" -H "content-type: application/json" -H "x-cnt-timestamp: $ts" -H "x-cnt-signature: $sig" --data "$body") || status=transport_error
            echo HTTP_STATUS="$status"
            jq -r '\''"API_ERROR=" + (.error//"none"), "API_OK=" + ((.ok//false)|tostring)'\'' "$tmp" 2>/dev/null | head -2 || true
            rm -f "$tmp"
            unset CNT_ARCHIVE_HMAC_SECRET
          ' || true
          echo "EPIC_PAIRING_PUBLIC_KEY_BEGIN"
          if [ -s /root/.config/epic-cnt-credential-pairing/private.pem ]; then
            openssl pkey -in /root/.config/epic-cnt-credential-pairing/private.pem -pubout 2>/dev/null
            echo "EPIC_PAIRING_PUBLIC_KEY_AVAILABLE=true"
          else
            echo "EPIC_PAIRING_PUBLIC_KEY_AVAILABLE=false"
          fi
          echo "EPIC_PAIRING_PUBLIC_KEY_END"
          echo "OBSERVER_RUNTIME_PREFLIGHT"
          docker inspect epic-cnt-archive-worker --format '{{json .Config.Env}}' | python3 -c '
          import json,sys
          d=dict(x.split("=",1) for x in json.load(sys.stdin) if "=" in x)
          for k in ("CNT_AIR_LOG","CNT_AIR_STATE","CNT_ARCHIVE_URL"):
              print(k+"="+d.get(k,"(unset)"))
          '
          docker exec epic-cnt-archive-worker python3 -c '
          import os
          from pathlib import Path
          log=os.environ.get("CNT_AIR_LOG","")
          print("AIR_LOG_ACCESSIBLE="+str(bool(log) and Path(log).is_file()))
          if log: print("AIR_LOG_FILENAME="+Path(log).name)
          pids=[]
          for pid in os.listdir("/proc"):
              if not pid.isdigit(): continue
              try:
                  args=Path("/proc/"+pid+"/cmdline").read_bytes().replace(b"\\0",b" ").decode(errors="replace")
                  if "cnt-air-observer.py" not in args or "python3" not in args: continue
                  env=Path("/proc/"+pid+"/environ").read_bytes()
                  pids.append(pid)
                  print("OBSERVER_PROCESS="+pid)
                  print("OBSERVER_HMAC_ENV_PRESENT="+str(b"CNT_ARCHIVE_HMAC_SECRET=" in env))
              except (OSError,PermissionError): pass
          print("OBSERVER_PIDS="+",".join(pids))
          ' || true
          echo "NO_MUTATION=true"
          REMOTE
