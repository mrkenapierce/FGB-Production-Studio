name: Restore v2 Health Supervision After v3 Rollback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-v2-health-supervision-20260903.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize known-good v2 healthcheck
        run: |
          set -Eeuo pipefail
          git show 673894bad7cd79551fd9fbb7217c717af2a18db0:services/fgbears-live/bin/healthcheck.sh > /tmp/fgbears-healthcheck-v2
          bash -n /tmp/fgbears-healthcheck-v2
          grep -Fq 'recover_youtube_v2' /tmp/fgbears-healthcheck-v2
          ! grep -Fq 'fgbears-youtube-v3.service' /tmp/fgbears-healthcheck-v2
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Restore supervisor only; do not restart transport
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/oracle_key /tmp/fgbears-healthcheck-v2 "$ORACLE_USER@$ORACLE_HOST:/tmp/fgbears-healthcheck-v2"
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          M0=$(pid fgbears-live.service); R0=$(pid fgbears-rumble-relay.service); Y0=$(pid fgbears-youtube-v2.service)
          [[ "$M0" =~ ^[1-9][0-9]*$ && "$R0" =~ ^[1-9][0-9]*$ && "$Y0" =~ ^[1-9][0-9]*$ ]]
          systemctl is-active --quiet fgbears-youtube-v2.service
          sudo install -m 0755 /tmp/fgbears-healthcheck-v2 /usr/local/bin/fgbears-healthcheck
          rm -f /tmp/fgbears-healthcheck-v2
          grep -Fq 'recover_youtube_v2' /usr/local/bin/fgbears-healthcheck
          ! grep -Fq 'fgbears-youtube-v3.service' /usr/local/bin/fgbears-healthcheck
          systemctl is-active --quiet fgbears-live-health.timer
          sleep 2
          M1=$(pid fgbears-live.service); R1=$(pid fgbears-rumble-relay.service); Y1=$(pid fgbears-youtube-v2.service)
          test "$M1" = "$M0"; test "$R1" = "$R0"; test "$Y1" = "$Y0"
          sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$Y1" 'index($0,q)&&index($0,":443"){ok=1} END{exit(ok?0:1)}'
          echo "V2_HEALTH_SUPERVISION_RESTORED=PASS master=$M1 rumble=$R1 youtube_v2=$Y1"
          REMOTE
