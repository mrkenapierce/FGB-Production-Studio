name: Diagnose YouTube Preparing State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-youtube-preparing.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify protected key synchronization without exposing key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          GH_YT_KEY: ${{ secrets.FGB_YOUTUBE_STREAM_KEY }}
        run: |
          set -Eeuo pipefail
          local_hash=$(printf '%s' "$GH_YT_KEY" | sha256sum | awk '{print $1}')
          remote_hash=$(ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" "sudo bash -lc 'source /etc/fgbears-live/stream.env; printf %s \"\$YOUTUBE_STREAM_KEY\" | sha256sum | awk '\''{print \$1}'\'''" )
          [[ "$local_hash" == "$remote_hash" ]]
          echo 'ORACLE_GITHUB_STREAM_KEY_MATCH=PASS'

      - name: Read-only ingest and codec diagnostics
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          master_unit=fgbears-live.service
          yt_unit=fgbears-youtube-copy-relay.service
          pid() { systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          master_pid=$(pid "$master_unit")
          yt_pid=$(pid "$yt_unit")
          echo "MASTER_ACTIVE=$(systemctl is-active "$master_unit" || true)"
          echo "YOUTUBE_ACTIVE=$(systemctl is-active "$yt_unit" || true)"
          echo "MASTER_PID=$master_pid"
          echo "YOUTUBE_PID=$yt_pid"
          [[ "$master_pid" =~ ^[1-9][0-9]*$ ]]
          [[ "$yt_pid" =~ ^[1-9][0-9]*$ ]]

          echo '=== YOUTUBE TCP ==='
          sudo ss -tinp | grep -A1 "pid=$yt_pid" || true
          io1=$(sudo awk '/^wchar:/ {print $2}' "/proc/$yt_pid/io")
          sleep 5
          io2=$(sudo awk '/^wchar:/ {print $2}' "/proc/$yt_pid/io")
          echo "YOUTUBE_RELAY_WCHAR_DELTA_5S=$((io2-io1))"
          (( io2 > io1 )) && echo 'YOUTUBE_NETWORK_WRITE_PROGRESS=PASS' || echo 'YOUTUBE_NETWORK_WRITE_PROGRESS=FAIL'

          echo '=== RELAY ERRORS ==='
          sudo journalctl -u "$yt_unit" --since '-30 minutes' --no-pager -o cat \
            | sed -E 's#rtmps://[^ ]+/live2/[^ ]+#rtmps://[REDACTED]/live2/[REDACTED]#g' \
            | grep -Ei 'error|failed|broken|invalid|non-monoton|disconnect|reset|timed out|timeout|server|404|403|401|warning' \
            | tail -n 80 || true

          echo '=== MASTER FFMPEG CHILD ==='
          ffpid=$(pgrep -P "$master_pid" -x ffmpeg | head -n1 || true)
          if [[ -z "$ffpid" ]]; then
            ffpid=$(pgrep -f 'ffmpeg.*127\.0\.0\.1:1940' | grep -v "^$yt_pid$" | head -n1 || true)
          fi
          echo "MASTER_FFMPEG_PID=${ffpid:-NONE}"
          if [[ -n "$ffpid" ]]; then
            tr '\0' ' ' < "/proc/$ffpid/cmdline" | sed -E 's#rtmps://[^ ]+/live2/[^ ]+#rtmps://[REDACTED]/live2/[REDACTED]#g'
            echo
            echo '=== MASTER OPEN MEDIA ==='
            sudo lsof -p "$ffpid" 2>/dev/null | grep -Ei '\.(mp4|m4a|mp3|wav|aac)( |$)' | tail -n 20 || true
            video=$(sudo lsof -Fn -p "$ffpid" 2>/dev/null | sed -n 's/^n//p' | grep -E '\.(mp4|mkv|mov)$' | head -n1 || true)
            if [[ -n "$video" && -r "$video" ]]; then
              echo "VIDEO_FILE=$video"
              ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,avg_frame_rate,bit_rate -of default=nw=1 "$video" || true
              echo 'KEYFRAME_TIMES_FIRST_12:'
              ffprobe -v error -select_streams v:0 -skip_frame nokey -show_entries frame=pts_time -of csv=p=0 "$video" 2>/dev/null | head -n 12 || true
            fi
          fi
          echo 'YOUTUBE_PREPARING_DIAGNOSTIC=COMPLETE'
          REMOTE
