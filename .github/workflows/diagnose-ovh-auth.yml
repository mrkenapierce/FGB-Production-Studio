name: Diagnose OVH SSH and Encoder Health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-ovh-auth.yml

permissions:
  contents: read

concurrency:
  group: diagnose-ovh-auth
  cancel-in-progress: true

env:
  OVH_HOST: 40.160.144.185

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect live encoder without changing the server
        env:
          OVH_KEY: ${{ secrets.OVH_SSH_KEY }}
          LEGACY_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          key="$OVH_KEY"
          if [ -z "$key" ]; then key="$LEGACY_KEY"; fi
          test -n "$key"
          printf '%s\n' "$key" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          unset key OVH_KEY LEGACY_KEY
          trap 'rm -f ~/.ssh/ovh_key' EXIT
          ssh-keyscan -T 8 -H "$OVH_HOST" > ~/.ssh/ovh_known_hosts
          ssh -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/ovh_known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=8 -i ~/.ssh/ovh_key "ubuntu@$OVH_HOST" 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          echo "CHECKED_AT=$(date -u +%FT%TZ)"
          echo "SERVICE_STATE=$(systemctl is-active fgb-transport.service)"
          cd /opt/fgb-transport
          cid=$(docker compose ps -q youtube)
          test -n "$cid"
          docker inspect --format 'CONTAINER_STATE={{.State.Status}} HEALTH={{.State.Health.Status}} CONTAINER_RESTARTS={{.RestartCount}}' "$cid"
          docker stats --no-stream --format 'CPU={{.CPUPerc}} MEMORY={{.MemUsage}}' "$cid"
          for sample in 1 2; do
            echo "PROGRESS_SAMPLE=$sample"
            docker exec "$cid" sh -c 'echo ENCODER_STATE=$(cat /tmp/fgb-transport.state); echo ENCODER_RESTARTS=$(cat /tmp/fgb-restarts); echo PROGRESS_AGE_SECONDS=$(( $(date +%s) - $(stat -c %Y /tmp/fgb-ffmpeg.progress) )); tail -n 24 /tmp/fgb-ffmpeg.progress; echo FFMPEG_COUNT=$(pgrep -x ffmpeg | wc -l)'
            if [ "$sample" = 1 ]; then sleep 8; fi
          done
          echo "ESTABLISHED_RTMPS_CONNECTIONS=$(ss -tnH state established '( dport = :443 )' | wc -l)"
          docker logs --tail 160 "$cid" 2>&1 | python3 -c 'import re,sys; lines=sys.stdin.read().splitlines(); selected=[s for s in lines if re.search(r"restart|ffmpeg pid|Error|error|failed|Broken pipe|Connection|Non-monoton|queue|speed=",s)]; print("SANITIZED_RECENT_ENCODER_EVENTS"); [print(re.sub(r"rtmps?://[^\s\x27\x22]+","[REDACTED_DESTINATION]",s)) for s in selected[-30:]]'
          REMOTE
