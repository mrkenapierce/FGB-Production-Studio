name: Ensure FGB YouTube Broadcast Live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/youtube-broadcast-trigger.txt'

permissions:
  contents: write

jobs:
  ensure-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: require
        name: Require YouTube OAuth secrets
        env:
          FGB_YOUTUBE_CLIENT_ID: ${{ secrets.FGB_YOUTUBE_CLIENT_ID }}
          FGB_YOUTUBE_CLIENT_SECRET: ${{ secrets.FGB_YOUTUBE_CLIENT_SECRET }}
          FGB_YOUTUBE_REFRESH_TOKEN: ${{ secrets.FGB_YOUTUBE_REFRESH_TOKEN }}
        run: |
          test -n "$FGB_YOUTUBE_CLIENT_ID" || { echo 'Missing FGB_YOUTUBE_CLIENT_ID secret'; exit 1; }
          test -n "$FGB_YOUTUBE_CLIENT_SECRET" || { echo 'Missing FGB_YOUTUBE_CLIENT_SECRET secret'; exit 1; }
          test -n "$FGB_YOUTUBE_REFRESH_TOKEN" || { echo 'Missing FGB_YOUTUBE_REFRESH_TOKEN secret'; exit 1; }

      - name: Validate permanent-target controller syntax
        run: python3 -m py_compile .github/scripts/fgb-youtube-target.py

      - id: youtube
        name: Bind and start permanent FGB YouTube broadcast
        env:
          FGB_YOUTUBE_CLIENT_ID: ${{ secrets.FGB_YOUTUBE_CLIENT_ID }}
          FGB_YOUTUBE_CLIENT_SECRET: ${{ secrets.FGB_YOUTUBE_CLIENT_SECRET }}
          FGB_YOUTUBE_REFRESH_TOKEN: ${{ secrets.FGB_YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/fgb-youtube-target.py \
            2> >(tee /tmp/fgb-youtube-broadcast-error.txt >&2) \
            | tee /tmp/fgb-youtube-broadcast.txt

          watch_url=$(awk -F= '/^WATCH_URL=/{print substr($0,index($0,"=")+1)}' /tmp/fgb-youtube-broadcast.txt | tail -1)
          state=$(awk -F= '/^BROADCAST_STATE=/{print substr($0,index($0,"=")+1)}' /tmp/fgb-youtube-broadcast.txt | tail -1)
          broadcast_id=$(awk -F= '/^BROADCAST_ID=/{print substr($0,index($0,"=")+1)}' /tmp/fgb-youtube-broadcast.txt | tail -1)
          test "$broadcast_id" = "FxeMSzEB0_w"
          test "$state" = "live"
          test -n "$watch_url"
          echo "watch_url=$watch_url" >> "$GITHUB_OUTPUT"

      - name: Record safe broadcast controller result
        if: always()
        env:
          REQUIRE_OUTCOME: ${{ steps.require.outcome }}
          YOUTUBE_OUTCOME: ${{ steps.youtube.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          watch_url=''
          state=''
          action=''
          broadcast_id=''
          safe_error=''
          if [[ -s /tmp/fgb-youtube-broadcast.txt ]]; then
            watch_url=$(sed -n 's/^WATCH_URL=//p' /tmp/fgb-youtube-broadcast.txt | tail -1)
            state=$(sed -n 's/^BROADCAST_STATE=//p' /tmp/fgb-youtube-broadcast.txt | tail -1)
            action=$(sed -n 's/^BROADCAST_ACTION=//p' /tmp/fgb-youtube-broadcast.txt | tail -1)
            broadcast_id=$(sed -n 's/^BROADCAST_ID=//p' /tmp/fgb-youtube-broadcast.txt | tail -1)
          fi
          if [[ -s /tmp/fgb-youtube-broadcast-error.txt ]]; then
            safe_error=$(tail -c 1800 /tmp/fgb-youtube-broadcast-error.txt | tr '\n' ' ')
          fi

          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/deployment-status
          jq -n \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg jobStatus "$JOB_STATUS" \
            --arg requireOutcome "${REQUIRE_OUTCOME:-unknown}" \
            --arg youtubeOutcome "${YOUTUBE_OUTCOME:-unknown}" \
            --arg broadcastState "$state" \
            --arg broadcastAction "$action" \
            --arg broadcastId "$broadcast_id" \
            --arg watchUrl "$watch_url" \
            --arg safeError "$safe_error" \
            '{checkedAt:$checkedAt,runId:$runId,jobStatus:$jobStatus,requireOutcome:$requireOutcome,youtubeOutcome:$youtubeOutcome,broadcastState:$broadcastState,broadcastAction:$broadcastAction,broadcastId:$broadcastId,watchUrl:$watchUrl,safeError:$safeError,preferredBroadcastId:"FxeMSzEB0_w",oracleRestarted:false}' \
            > .github/deployment-status/fgbears-youtube-broadcast.json
          git config user.name "FGBears YouTube Controller"
          git config user.email "actions@github.com"
          git add -- .github/deployment-status/fgbears-youtube-broadcast.json
          if ! git diff --cached --quiet; then
            git commit -m "Record YouTube broadcast controller result [skip ci]"
            git push origin main
          fi

      - name: Publish workflow summary
        if: always()
        env:
          WATCH_URL: ${{ steps.youtube.outputs.watch_url }}
        run: |
          {
            echo '## FGB YouTube Broadcast'
            echo 'Permanent target: FxeMSzEB0_w'
            if [[ -n "$WATCH_URL" ]]; then
              echo "Live: $WATCH_URL"
            else
              echo 'Broadcast controller did not return a live watch URL. Review the recorded deployment status.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
