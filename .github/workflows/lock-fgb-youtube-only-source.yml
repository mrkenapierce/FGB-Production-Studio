name: Lock FGB Source to YouTube Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lock-fgb-youtube-only-source.yml'

permissions:
  contents: write

jobs:
  lock-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove retired social transport from active source
        run: |
          set -Eeuo pipefail
          # Make the migration utility safe after partial cleanup. The health
          # watchdog has already had its social block removed, and the utility
          # itself necessarily contains the retired identifiers it removes.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/fgbears-live/bin/finalize-youtube-only.py')
          s = p.read_text()

          old_guard = "if grep -R -nE 'X_LOCAL_UDP_URL|X_RELAY_ENABLED|X_STREAM_ENABLED|INSTAGRAM_LOCAL_UDP_URL|INSTAGRAM_RELAY_ENABLED|FACEBOOK_LOCAL_UDP_URL|fgbears-(x|instagram|facebook)-relay|X local mirror|Instagram local mirror|Facebook local mirror' \"$ROOT/bin\" \"$ROOT/config\" \"$ROOT/systemd\"; then"
          new_guard = "if grep -R --exclude=finalize-youtube-only.py -nE 'X_LOCAL_UDP_URL|X_RELAY_ENABLED|X_STREAM_ENABLED|INSTAGRAM_LOCAL_UDP_URL|INSTAGRAM_RELAY_ENABLED|FACEBOOK_LOCAL_UDP_URL|fgbears-(x|instagram|facebook)-relay|X local mirror|Instagram local mirror|Facebook local mirror' \"$ROOT/bin\" \"$ROOT/config\" \"$ROOT/systemd\"; then"
          if old_guard in s:
              s = s.replace(old_guard, new_guard)

          old_health = '''start = text.find('reconcile_social_relay() {')
          end = text.find('# News scanning is independent', start)
          require(start >= 0 and end > start, "Could not locate social health block")
          text = text[:start] + text[end:]
          text = re.sub(r'^reconcile_social_relay .*\\n', '', text, flags=re.M)'''
          new_health = '''start = text.find('reconcile_social_relay() {')
          if start >= 0:
              end = text.find('# News scanning is independent', start)
              require(end > start, "Could not locate end of social health block")
              text = text[:start] + text[end:]
          text = re.sub(r'^reconcile_social_relay .*\\n', '', text, flags=re.M)'''
          if old_health in s:
              s = s.replace(old_health, new_health)

          p.write_text(s)
          PY
          python3 services/fgbears-live/bin/finalize-youtube-only.py
          # Workflow files are handled separately through the connected GitHub
          # app. Keep this Actions commit limited to non-workflow production source.
          git restore .github/workflows
          bash services/fgbears-live/tests/test-multistream.sh
          git diff --check
      - name: Commit non-workflow source cleanup
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A services/fgbears-live
          if git diff --cached --quiet; then
            echo 'YouTube-only source already clean.'
            exit 0
          fi
          git commit -m 'Lock FGB livestream source to YouTube only [skip ci]'
          git push origin HEAD:main
