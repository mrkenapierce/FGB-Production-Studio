name: Diagnose FGBears Live Audio v2
# Diagnostic trigger: 2026-09-01 YouTube distortion investigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-live-audio-diagnose-v2.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Analyze exact YouTube-bound audio
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          CAPTURE=/tmp/fgb-audio-live.ts
          PCM=/tmp/fgb-audio-live.pcm
          PACKETS=/tmp/fgb-audio-packets.csv
          rm -f "$CAPTURE" "$PCM" "$PACKETS"
          port=$(sudo sed -n 's#^YOUTUBE_LOCAL_UDP_URL=udp://127\.0\.0\.1:\([0-9][0-9]*\).*#\1#p' /etc/fgbears-live/stream.env | tail -n1)
          [[ "$port" =~ ^[0-9]+$ ]]
          echo '--- effective live audio config ---'
          sudo grep -E '^(PODCAST_AUDIO_FILTER|OUTPUT_FPS)=' /etc/fgbears-live/stream.env || true
          echo "youtube_local_udp_port=$port"

          sudo env PORT="$port" OUT="$CAPTURE" python3 - <<'PY'
          import os, socket, struct, time
          port=int(os.environ['PORT']); path=os.environ['OUT']
          s=socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.htons(0x0003))
          s.bind(('lo',0)); s.settimeout(0.5)
          end=time.monotonic()+20
          raw=accepted=duplicates=0
          last=None
          with open(path,'wb') as out:
              while time.monotonic()<end:
                  try: frame,addr=s.recvfrom(65535)
                  except socket.timeout: continue
                  raw += 1
                  ip=None
                  for off in (14,16,0):
                      if len(frame)>off+28 and frame[off]>>4==4:
                          ip=off; break
                  if ip is None: continue
                  ihl=(frame[ip]&15)*4
                  if frame[ip+9]!=17 or len(frame)<ip+ihl+8: continue
                  udp=ip+ihl
                  src,dst,length=struct.unpack('!HHH',frame[udp:udp+6])
                  if dst!=port: continue
                  payload=frame[udp+8:udp+length]
                  if len(payload)<188 or payload[0]!=0x47 or len(payload)%188: continue
                  if payload==last:
                      duplicates += 1
                      continue
                  last=payload
                  out.write(payload); accepted += 1
          print(f'raw_loopback_frames={raw}')
          print(f'accepted_udp_packets={accepted}')
          print(f'deduplicated_loopback_packets={duplicates}')
          if accepted < 100: raise SystemExit('Insufficient MPEG-TS capture')
          PY
          sudo chown "$(id -u):$(id -g)" "$CAPTURE"

          echo '--- transport audio stream ---'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,profile,sample_rate,channels,channel_layout,bit_rate,time_base,start_time -of default=nw=1 "$CAPTURE"
          ffprobe -v error -select_streams a:0 -show_packets -show_entries packet=pts_time,duration_time -of csv=p=0 "$CAPTURE" > "$PACKETS"
          ffmpeg -hide_banner -loglevel warning -y -i "$CAPTURE" -map 0:a:0 -ac 2 -ar 48000 -f s16le "$PCM"

          python3 - "$PCM" "$PACKETS" <<'PY'
          import array,csv,math,sys
          pcm,packets=sys.argv[1:]
          a=array.array('h'); a.frombytes(open(pcm,'rb').read())
          if sys.byteorder!='little': a.byteswap()
          L=a[0::2]; R=a[1::2]; n=min(len(L),len(R)); L=L[:n]; R=R[:n]
          if n<48000: raise SystemExit('Audio decode shorter than one second')
          def m(ch):
              peak=max(abs(x) for x in ch); rms=math.sqrt(sum(float(x)*x for x in ch)/len(ch)); mean=sum(ch)/len(ch)
              return peak,20*math.log10(max(peak,1)/32768),20*math.log10(max(rms,1e-9)/32768),sum(abs(x)>=32760 for x in ch)/len(ch),sum(abs(x)<=8 for x in ch)/len(ch),mean/32768
          lm=m(L); rm=m(R)
          dot=sum(float(l)*r for l,r in zip(L,R)); l2=sum(float(l)*l for l in L); r2=sum(float(r)*r for r in R); corr=dot/math.sqrt(max(l2*r2,1))
          pts=[]; dur=[]
          for row in csv.reader(open(packets)):
              try: pts.append(float(row[0])); dur.append(float(row[1]))
              except: pass
          regress=sum(pts[i]<pts[i-1]-0.001 for i in range(1,len(pts)))
          gaps=[]
          for i in range(1,len(pts)):
              expected=dur[i-1] if i-1<len(dur) else .021333
              d=pts[i]-pts[i-1]
              if d>max(.08,expected*3): gaps.append(d)
          print(f'decoded_audio_seconds={n/48000:.3f}')
          print(f'left_peak_dbfs={lm[1]:.2f} right_peak_dbfs={rm[1]:.2f}')
          print(f'left_rms_dbfs={lm[2]:.2f} right_rms_dbfs={rm[2]:.2f}')
          print(f'channel_rms_difference_db={abs(lm[2]-rm[2]):.2f}')
          print(f'left_clip_ratio={lm[3]:.8f} right_clip_ratio={rm[3]:.8f}')
          print(f'left_nearzero_ratio={lm[4]:.4f} right_nearzero_ratio={rm[4]:.4f}')
          print(f'left_dc_fraction={lm[5]:.6f} right_dc_fraction={rm[5]:.6f}')
          print(f'lr_correlation={corr:.4f}')
          print(f'audio_pts_regressions={regress}')
          print(f'audio_large_pts_gaps={len(gaps)}')
          if gaps: print(f'largest_audio_pts_gap_seconds={max(gaps):.6f}')
          warnings=[]
          if max(lm[3],rm[3])>.0001: warnings.append('CLIPPING')
          if max(lm[1],rm[1])>-.10: warnings.append('PEAK_TOO_CLOSE_TO_0_DBFS')
          if max(lm[2],rm[2])<-45: warnings.append('NEAR_SILENCE')
          if abs(lm[2]-rm[2])>6: warnings.append('CHANNEL_IMBALANCE')
          if max(abs(lm[5]),abs(rm[5]))>.02: warnings.append('DC_OFFSET')
          if regress: warnings.append('PTS_REGRESSION')
          if gaps: warnings.append('PTS_GAPS')
          print('AUDIO_WARNINGS='+(','.join(warnings) if warnings else 'NONE'))
          PY

          echo '--- AAC decoder warnings ---'
          ffmpeg -hide_banner -v warning -i "$CAPTURE" -map 0:a:0 -f null - 2>&1 | tail -n 60 || true

          echo '--- playlist audio formats ---'
          while IFS= read -r f; do
            [[ -f "$f" ]] || continue
            printf '%s: ' "$(basename "$f")"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels,channel_layout -of csv=p=0 "$f" | head -n1
          done < <(sed -n "s/^file '\(.*\)'$/\1/p" /srv/fgbears-live/playlist.ffconcat)
          rm -f "$CAPTURE" "$PCM" "$PACKETS"
          REMOTE
