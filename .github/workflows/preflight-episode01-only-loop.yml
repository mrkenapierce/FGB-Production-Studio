name: Preflight Episode 01 Only Loop

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preflight-episode01-only-loop.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"; test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production preflight
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          media=/srv/fgbears-live/media
          playlist=/srv/fgbears-live/playlist.ffconcat
          ep="$media/FGBears-Episode-01.mp4"
          marker="$ep.audio-profile.json"
          echo "MASTER_ACTIVE=$(systemctl is-active fgbears-live.service || true)"
          echo "MASTER_PID=$(systemctl show -p MainPID --value fgbears-live.service)"
          echo "YOUTUBE_ACTIVE=$(systemctl is-active fgbears-youtube-copy-relay.service || true)"
          echo "YOUTUBE_PID=$(systemctl show -p MainPID --value fgbears-youtube-copy-relay.service)"
          ypid=$(systemctl show -p MainPID --value fgbears-youtube-copy-relay.service)
          echo "YOUTUBE_TCP=$(sudo ss -Htnp state established 2>/dev/null | awk -v p="pid=$ypid," 'index($0,p){n++} END{print n+0}')"
          echo "CURRENT_MEDIA_FILES=$(find "$media" -maxdepth 1 -type f -name 'FGBears-Episode-*.mp4' | wc -l)"
          echo "CURRENT_MARKERS=$(find "$media" -maxdepth 1 -type f -name 'FGBears-Episode-*.mp4.audio-profile.json' | wc -l)"
          echo "PLAYLIST_ENTRIES=$(grep -c '^file ' "$playlist" || true)"
          echo 'CURRENT_PLAYLIST_BEGIN'
          cat "$playlist"
          echo 'CURRENT_PLAYLIST_END'
          [[ -s "$ep" && -s "$marker" ]]
          echo "EP01_PROFILE=$(jq -r '.episode_repair // .profile // ""' "$marker")"
          echo "EP01_QUALITY=$(jq -r '.quality_verified // false' "$marker")"
          echo "EP01_I=$(jq -r '.output_metrics.i_lufs // empty' "$marker")"
          echo "EP01_TP=$(jq -r '.output_metrics.tp_dbtp // empty' "$marker")"
          echo "EP01_LRA=$(jq -r '.output_metrics.lra_lu // empty' "$marker")"
          echo "EP01_SHA=$(sha256sum "$ep" | awk '{print $1}')"
          echo 'AUXILIARY_AUDIO_DIRS_BEGIN'
          for d in /srv/fgbears-live/*audio* /srv/fgbears-live/*processed* /srv/fgbears-live/*staging*; do
            [[ -e "$d" ]] || continue
            if [[ -d "$d" ]]; then printf '%s\tfiles=%s\n' "$d" "$(find "$d" -type f | wc -l)"; fi
          done
          echo 'AUXILIARY_AUDIO_DIRS_END'
          echo "ORIGINAL_SOURCE_ARCHIVE_FILES=$(find /home/ubuntu/fgbears-upload -maxdepth 1 -type f -name 'FGBears-Episode-*.mp4' 2>/dev/null | wc -l)"
          echo 'PREFLIGHT=PASS'
          REMOTE
