name: Quarantine Legacy FGBears Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quarantine-legacy-fgbears-runtime.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"; test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Quarantine proven legacy runtime without touching current transport
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          connected(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          CACHE=fgbears-lovable-state-cache.service
          YOUTUBE=fgbears-youtube-v3.service
          M0=$(pid "$MASTER"); R0=$(pid "$RUMBLE"); C0=$(pid "$CACHE"); Y0=$(pid "$YOUTUBE")
          [[ "$M0" =~ ^[1-9][0-9]*$ && "$R0" =~ ^[1-9][0-9]*$ && "$C0" =~ ^[1-9][0-9]*$ && "$Y0" =~ ^[1-9][0-9]*$ ]]
          connected "$R0" 1935
          connected "$Y0" 443
          [[ "$(sudo cat /etc/fgbears-live/youtube-generation)" == v3 ]]

          Q=/opt/fgbears-live/quarantine/systemd-legacy-20260903
          sudo install -d -m 0755 "$Q/units" "$Q/dropins" "$Q/processes"
          date -u | sudo tee "$Q/quarantined-at.txt" >/dev/null

          legacy=(
            fgbears-youtube-v2-health.timer fgbears-youtube-v2-health.service
            fgbears-youtube-v2.service fgbears-youtube-relay.service
            fgbears-youtube-output.service fgbears-youtube-router.service
            fgbears-youtube-lovable-routing.service fgbears-youtube-lovable-compositor.service
            fgbears-youtube-audio-watchdog.timer fgbears-youtube-audio-watchdog.service
            fgbears-youtube-dynamic-card.service
            fgbears-youtube-freeze-card-refresh.timer fgbears-youtube-freeze-card-refresh.service
            fgbears-youtube-v3-source.service fgbears-youtube-v3-supervisor.service
          )
          for u in "${legacy[@]}"; do
            echo "QUARANTINE_UNIT=$u"
            sudo systemctl cat "$u" > "/tmp/${u}.cat" 2>/dev/null || true
            sudo cp "/tmp/${u}.cat" "$Q/units/${u}.cat" 2>/dev/null || true
            sudo systemctl disable --now "$u" >/dev/null 2>&1 || true
            path="/etc/systemd/system/$u"
            if sudo test -f "$path" && ! sudo test -L "$path"; then sudo cp -a "$path" "$Q/units/$u"; sudo rm -f "$path"; fi
            sudo systemctl mask "$u" >/dev/null 2>&1 || true
          done

          for d in /etc/systemd/system/fgbears-live-health.service.d/95-lovable-compositor.conf /etc/systemd/system/fgbears-live-health.service.d/99-youtube-dynamic-router.conf; do
            if sudo test -e "$d"; then sudo cp -a "$d" "$Q/dropins/"; sudo rm -f "$d"; fi
          done
          sudo rmdir /etc/systemd/system/fgbears-live-health.service.d 2>/dev/null || true

          # Archive and terminate only abandoned deploy shells older than one day whose parent is PID 1.
          ps -eo pid=,ppid=,etimes=,args= | awk '$2==1 && $3>86400 && index($0,"/tmp/fgbears-live-deploy"){print}' | sudo tee "$Q/processes/abandoned-deploys.txt" >/dev/null || true
          while read -r stale; do
            [[ "$stale" =~ ^[0-9]+$ ]] || continue
            echo "QUARANTINE_PROCESS_TREE=$stale"
            children=$(pgrep -P "$stale" || true)
            for c in $children; do grandchildren=$(pgrep -P "$c" || true); [[ -z "$grandchildren" ]] || sudo kill -TERM $grandchildren 2>/dev/null || true; done
            [[ -z "$children" ]] || sudo kill -TERM $children 2>/dev/null || true
            sudo kill -TERM "$stale" 2>/dev/null || true
          done < <(ps -eo pid=,ppid=,etimes=,args= | awk '$2==1 && $3>86400 && index($0,"/tmp/fgbears-live-deploy"){print $1}')
          sleep 2

          # Repair the current news refresh definition; this is current infrastructure, not legacy.
          rm -rf /tmp/fgbears-current-runtime
          git clone --depth 1 https://github.com/mrkenapierce/FGB-Production-Studio.git /tmp/fgbears-current-runtime >/dev/null 2>&1
          sudo install -m 0644 /tmp/fgbears-current-runtime/services/fgbears-live/systemd/fgbears-news-refresh.service /etc/systemd/system/fgbears-news-refresh.service
          sudo systemctl daemon-reload
          sudo systemctl reset-failed fgbears-news-refresh.service 2>/dev/null || true
          sudo systemctl start fgbears-news-refresh.service
          systemctl is-active --quiet fgbears-news-refresh.timer

          # Current production must remain untouched.
          test "$(pid "$MASTER")" = "$M0"
          test "$(pid "$RUMBLE")" = "$R0"
          test "$(pid "$CACHE")" = "$C0"
          test "$(pid "$YOUTUBE")" = "$Y0"
          connected "$R0" 1935
          connected "$Y0" 443
          ! systemctl is-active --quiet fgbears-youtube-v2-health.timer
          ! systemctl is-active --quiet fgbears-youtube-v2.service
          for u in "${legacy[@]}"; do state=$(systemctl is-enabled "$u" 2>/dev/null || true); [[ "$state" == masked* || "$state" == not-found || -z "$state" ]] || { echo "LEGACY_NOT_QUARANTINED=$u state=$state"; exit 1; }; done
          echo "LEGACY_RUNTIME_QUARANTINE=PASS master=$M0 rumble=$R0 cache=$C0 youtube_v3=$Y0"
          REMOTE
