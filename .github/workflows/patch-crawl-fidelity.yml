name: Patch FGB Crawl Fidelity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-crawl-fidelity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upgrade crawl MJPEG fidelity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/fgbears-live/bin/crawl-overlay.py')
          text = path.read_text(encoding='utf-8')
          old = '    frame().convert("RGB").save(output, format="JPEG", quality=94, optimize=False)\n'
          new = '''    # Preserve sharp high-contrast crawl text and Bears orange/blue edges across\n    # the localhost MJPEG transport. 4:4:4 avoids the chroma blockiness caused\n    # by Pillow's default JPEG subsampling while keeping the renderer at 15 fps.\n    frame().convert("RGB").save(\n        output,\n        format="JPEG",\n        quality=96,\n        subsampling=0,\n        optimize=False,\n    )\n'''
          if old not in text:
              raise SystemExit('Expected crawl JPEG encoder line not found; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile services/fgbears-live/bin/crawl-overlay.py
          git diff --check
      - name: Commit crawl fidelity repair
        run: |
          git config user.name 'FGB Production Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add services/fgbears-live/bin/crawl-overlay.py
          git commit -m 'Improve crawl transport fidelity'
          git push origin HEAD:main
