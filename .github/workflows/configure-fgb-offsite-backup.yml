name: Configure FGB Offsite Archive Replication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/transport-ovh/fgb-offsite-backup.sh'
      - 'ops/transport-ovh/archive-uploader.py'
      - 'test/test_archive_offsite_retention.py'
      - '.github/workflows/configure-fgb-offsite-backup.yml'
permissions:
  contents: read
concurrency:
  group: fgb-offsite-backup-install
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      S3_ENDPOINT: ${{ secrets.FGB_ARCHIVE_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.FGB_ARCHIVE_S3_BUCKET }}
      S3_REGION: ${{ secrets.FGB_ARCHIVE_S3_REGION }}
      S3_ACCESS: ${{ secrets.FGB_ARCHIVE_S3_ACCESS_KEY_ID }}
      S3_SECRET: ${{ secrets.FGB_ARCHIVE_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate no-local-deletion boundary
        run: |
          set -euo pipefail
          bash -n ops/transport-ovh/fgb-offsite-backup.sh
          python3 -m unittest discover -s test -p 'test_archive_offsite_retention.py' -v
          ! grep -Eq '(^|[ ;])rm +|rclone +delete|docker +(stop|restart)|systemctl +(stop|restart)' ops/transport-ovh/fgb-offsite-backup.sh
      - name: Configure SSH access
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null
      - name: Stage isolated backup script on OVH
        run: |
          set -euo pipefail
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key \
            ops/transport-ovh/fgb-offsite-backup.sh ubuntu@40.160.144.185:/tmp/fgb-offsite-backup.sh
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key \
            ops/transport-ovh/archive-uploader.py ubuntu@40.160.144.185:/tmp/fgb-archive-uploader-offsite.py
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key ubuntu@40.160.144.185 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo bash -n /tmp/fgb-offsite-backup.sh
          sudo install -o root -g root -m 0700 /tmp/fgb-offsite-backup.sh /usr/local/libexec/fgb-offsite-backup.sh
          sudo tee /etc/systemd/system/fgb-offsite-backup.service >/dev/null <<'SERVICE'
          [Unit]
          Description=FGB offsite verified hourly archive replication, no local deletion
          After=network-online.target
          Wants=network-online.target
          ConditionPathExists=/etc/fgb-archive-offsite.env

          [Service]
          Type=oneshot
          User=root
          ExecStart=/usr/local/libexec/fgb-offsite-backup.sh
          TimeoutStartSec=3300
          NoNewPrivileges=true
          SERVICE
          sudo tee /etc/systemd/system/fgb-offsite-backup.timer >/dev/null <<'TIMER'
          [Unit]
          Description=FGB independent archive S3 replication every hour

          [Timer]
          OnCalendar=hourly
          AccuracySec=5min
          Persistent=false
          Unit=fgb-offsite-backup.service

          [Install]
          WantedBy=timers.target
          TIMER
          sudo systemctl daemon-reload
          echo FGB_OFFSITE_BACKUP_SCRIPTS_STAGED=true
          REMOTE
      - name: Verify external storage configuration before enabling uploads
        run: |
          set -euo pipefail
          if [ -z "$S3_ENDPOINT" ] || [ -z "$S3_BUCKET" ] || [ -z "$S3_REGION" ] || [ -z "$S3_ACCESS" ] || [ -z "$S3_SECRET" ]; then
            echo 'FGB_OFFSITE_BACKUP_STATUS=AWAITING_EXTERNAL_BUCKET_AND_RESTRICTED_KEYS'
            exit 0
          fi
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'https://[A-Za-z0-9.-]+/?',os.environ['S3_ENDPOINT'])
          assert re.fullmatch(r'[a-z0-9][a-z0-9.-]{2,62}',os.environ['S3_BUCKET'])
          assert re.fullmatch(r'[a-z0-9-]+',os.environ['S3_REGION'])
          p='/tmp/fgb-offsite-secure.env'
          with open(p,'w') as f:
              for key,env in [('FGB_OFFSITE_ENDPOINT','S3_ENDPOINT'),('FGB_OFFSITE_BUCKET','S3_BUCKET'),
                               ('FGB_OFFSITE_REGION','S3_REGION'),('FGB_OFFSITE_ACCESS_KEY_ID','S3_ACCESS'),
                               ('FGB_OFFSITE_SECRET_ACCESS_KEY','S3_SECRET')]:
                  val=os.environ[env]
                  assert '\n' not in val and "'" not in val
                  f.write(key+"='"+val+"'\n")
          os.chmod(p,0o600)
          PY
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key \
            /tmp/fgb-offsite-secure.env ubuntu@40.160.144.185:/tmp/fgb-offsite-secure.env
          rm -f /tmp/fgb-offsite-secure.env
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key ubuntu@40.160.144.185 'bash -s' <<'REMOTE'
          set -euo pipefail
          if ! command -v rclone >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rclone
          fi
          FGB=fgb-transport-youtube-1
          CNT=epic-cnt-capture
          before_fgb=$(sudo docker inspect -f '{{.Id}}' "$FGB")
          before_cnt=$(sudo docker inspect -f '{{.Id}}' "$CNT")
          before_ffmpeg=$(sudo docker exec "$FGB" pgrep -o ffmpeg)
          sudo install -o root -g root -m 0600 /tmp/fgb-offsite-secure.env /etc/fgb-archive-offsite.env
          rm -f /tmp/fgb-offsite-secure.env
          # Verify both writes and remote reads before treating storage as usable.
          sudo bash -s <<'PREFLIGHT'
          set -euo pipefail
          source /etc/fgb-archive-offsite.env
          export RCLONE_CONFIG_FGBARCHIVE_TYPE=s3
          export RCLONE_CONFIG_FGBARCHIVE_PROVIDER=Other
          export RCLONE_CONFIG_FGBARCHIVE_ENV_AUTH=false
          export RCLONE_CONFIG_FGBARCHIVE_ACCESS_KEY_ID="$FGB_OFFSITE_ACCESS_KEY_ID"
          export RCLONE_CONFIG_FGBARCHIVE_SECRET_ACCESS_KEY="$FGB_OFFSITE_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_FGBARCHIVE_ENDPOINT="$FGB_OFFSITE_ENDPOINT"
          export RCLONE_CONFIG_FGBARCHIVE_REGION="$FGB_OFFSITE_REGION"
          printf 'FGB offsite health %s\n' "$(date -u +%FT%TZ)" >/tmp/fgb-offsite-canary.txt
          remote="FGBARCHIVE:$FGB_OFFSITE_BUCKET/fgb/control/activation-canary.txt"
          rclone copyto /tmp/fgb-offsite-canary.txt "$remote" --s3-no-check-bucket --quiet
          local_hash=$(sha256sum /tmp/fgb-offsite-canary.txt | awk '{print $1}')
          remote_hash=$(rclone cat "$remote" --quiet | sha256sum | awk '{print $1}')
          test "$local_hash" = "$remote_hash"
          echo 'FGB_OFFSITE_REMOTE_READ_WRITE_SHA256=PASS'
          rm -f /tmp/fgb-offsite-canary.txt
          PREFLIGHT
          # Set offsite retention gate ONLY after the independent bucket
          # passes the read/write checksum preflight.
          sudo python3 -m py_compile /tmp/fgb-archive-uploader-offsite.py
          sudo cp -p /opt/fgb-transport/archive-uploader.py /opt/fgb-transport/archive-uploader.before-offsite.py
          sudo install -o root -g root -m 0644 /tmp/fgb-archive-uploader-offsite.py /opt/fgb-transport/archive-uploader.py
          sudo python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/opt/fgb-transport/.env')
          rows=[row for row in p.read_text().splitlines() if not row.startswith('FGB_OFFSITE_REQUIRED=')]
          rows.append('FGB_OFFSITE_REQUIRED=1')
          tmp=p.with_name('.env.offsite-next')
          fd=os.open(tmp,os.O_WRONLY|os.O_CREAT|os.O_TRUNC,0o600)
          with os.fdopen(fd,'w') as fh:fh.write('\n'.join(rows)+'\n')
          os.chmod(tmp,0o600)
          os.replace(tmp,p)
          PY
          cd /opt/fgb-transport
          sudo docker compose --env-file .env up -d --no-deps --force-recreate archive_uploader
          sudo docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' fgb-transport-archive_uploader-1 | grep -Fxq 'FGB_OFFSITE_REQUIRED=1'
          sudo systemctl enable --now fgb-offsite-backup.timer
          sudo systemctl is-active --quiet fgb-offsite-backup.timer
          test "$(sudo docker inspect -f '{{.Id}}' "$FGB")" = "$before_fgb"
          test "$(sudo docker inspect -f '{{.Id}}' "$CNT")" = "$before_cnt"
          test "$(sudo docker exec "$FGB" pgrep -o ffmpeg)" = "$before_ffmpeg"
          echo FGB_OFFSITE_BACKUP_STATUS=HOURLY_TIMER_ENABLED
          echo FGB_OFFSITE_RAW_RETENTION_REQUIRES_VERIFIED_SHA=true
          echo FGB_CNT_LIVE_ENCODERS_UNCHANGED=true
          REMOTE
