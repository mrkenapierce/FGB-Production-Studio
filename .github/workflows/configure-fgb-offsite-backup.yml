name: Configure FGB Offsite Archive Replication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/transport-ovh/fgb-offsite-backup.sh'
      - 'ops/transport-ovh/archive-uploader.py'
      - 'test/test_archive_offsite_retention.py'
      - '.github/workflows/configure-fgb-offsite-backup.yml'
permissions:
  contents: read
concurrency:
  group: fgb-offsite-backup-install
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      S3_ENDPOINT: ${{ secrets.FGB_ARCHIVE_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.FGB_ARCHIVE_S3_BUCKET }}
      S3_REGION: ${{ secrets.FGB_ARCHIVE_S3_REGION }}
      S3_ACCESS: ${{ secrets.FGB_ARCHIVE_S3_ACCESS_KEY_ID }}
      S3_SECRET: ${{ secrets.FGB_ARCHIVE_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate no-local-deletion boundary
        run: |
          set -euo pipefail
          bash -n ops/transport-ovh/fgb-offsite-backup.sh
          python3 -m unittest discover -s test -p 'test_archive_offsite_retention.py' -v
          ! grep -Eq '(^|[ ;])rm +|rclone +delete|docker +(stop|restart)|systemctl +(stop|restart)' ops/transport-ovh/fgb-offsite-backup.sh
      - name: Configure SSH access
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null
      - name: Stage isolated backup script on OVH
        run: |
          set -euo pipefail
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key \
            ops/transport-ovh/fgb-offsite-backup.sh ubuntu@40.160.144.185:/tmp/fgb-offsite-backup.sh
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key ubuntu@40.160.144.185 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo bash -n /tmp/fgb-offsite-backup.sh
          sudo install -o root -g root -m 0700 /tmp/fgb-offsite-backup.sh /usr/local/libexec/fgb-offsite-backup.sh
          sudo tee /etc/systemd/system/fgb-offsite-backup.service >/dev/null <<'SERVICE'
          [Unit]
          Description=FGB offsite verified hourly archive replication, no local deletion
          After=network-online.target
          Wants=network-online.target
          ConditionPathExists=/etc/fgb-archive-offsite.env

          [Service]
          Type=oneshot
          User=root
          ExecStart=/usr/local/libexec/fgb-offsite-backup.sh
          TimeoutStartSec=3300
          NoNewPrivileges=true
          SERVICE
          sudo tee /etc/systemd/system/fgb-offsite-backup.timer >/dev/null <<'TIMER'
          [Unit]
          Description=FGB independent archive S3 replication every hour

          [Timer]
          OnCalendar=hourly
          AccuracySec=5min
          Persistent=false
          Unit=fgb-offsite-backup.service

          [Install]
          WantedBy=timers.target
          TIMER
          sudo systemctl daemon-reload
          echo FGB_OFFSITE_BACKUP_SCRIPTS_STAGED=true
          REMOTE
      - name: Verify external storage configuration before enabling uploads
        run: |
          set -euo pipefail
          if [ -z "$S3_ENDPOINT" ] || [ -z "$S3_BUCKET" ] || [ -z "$S3_REGION" ] || [ -z "$S3_ACCESS" ] || [ -z "$S3_SECRET" ]; then
            echo 'FGB_OFFSITE_BACKUP_STATUS=AWAITING_EXTERNAL_BUCKET_AND_RESTRICTED_KEYS'
            exit 0
          fi
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'https://[A-Za-z0-9.-]+/?',os.environ['S3_ENDPOINT'])
          assert re.fullmatch(r'[a-z0-9][a-z0-9.-]{2,62}',os.environ['S3_BUCKET'])
          assert re.fullmatch(r'[a-z0-9-]+',os.environ['S3_REGION'])
          p='/tmp/fgb-offsite-secure.env'
          with open(p,'w') as f:
              for key,env in [('FGB_OFFSITE_ENDPOINT','S3_ENDPOINT'),('FGB_OFFSITE_BUCKET','S3_BUCKET'),
                               ('FGB_OFFSITE_REGION','S3_REGION'),('FGB_OFFSITE_ACCESS_KEY_ID','S3_ACCESS'),
                               ('FGB_OFFSITE_SECRET_ACCESS_KEY','S3_SECRET')]:
                  val=os.environ[env]
                  assert '\n' not in val and "'" not in val
                  f.write(key+"='"+val+"'\n")
          os.chmod(p,0o600)
          PY
          scp -q -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key \
            /tmp/fgb-offsite-secure.env ubuntu@40.160.144.185:/tmp/fgb-offsite-secure.env
          rm -f /tmp/fgb-offsite-secure.env
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key ubuntu@40.160.144.185 'bash -s' <<'REMOTE'
          set -euo pipefail
          if ! command -v rclone >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rclone
          fi
          sudo install -o root -g root -m 0600 /tmp/fgb-offsite-secure.env /etc/fgb-archive-offsite.env
          rm -f /tmp/fgb-offsite-secure.env
          sudo systemctl enable --now fgb-offsite-backup.timer
          sudo systemctl is-active --quiet fgb-offsite-backup.timer
          echo FGB_OFFSITE_BACKUP_STATUS=HOURLY_TIMER_ENABLED
          REMOTE
