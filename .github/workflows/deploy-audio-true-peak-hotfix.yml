name: Deploy FGB Live Audio True-Peak Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-audio-true-peak-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: fgbears-live-production-deploy
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audio normalization patch
        run: |
          python3 services/fgbears-live/bin/patch-audio-headroom.py
          python3 services/fgbears-live/bin/audio-health.py --self-test
          git diff --check

      - name: Persist patched runtime configuration
        run: |
          git config user.name 'FGB Production Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add services/fgbears-live/bin/start-stream.sh services/fgbears-live/bin/install.sh services/fgbears-live/config/stream.env.example
          if ! git diff --cached --quiet; then
            git commit -m 'Apply -14 LUFS / -1.5 dBTP live audio normalization'
            git push origin HEAD:main
          fi

      - name: Require Oracle deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" || { echo 'Missing ORACLE_HOST secret'; exit 1; }
          test -n "$ORACLE_SSH_KEY" || { echo 'Missing ORACLE_SSH_KEY secret'; exit 1; }

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Trust Oracle host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Install hotfix on Oracle and restart encoder/relay
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" '
            set -Eeuo pipefail
            rm -rf /tmp/fgbears-live-audio-hotfix
            git clone --depth 1 https://github.com/mrkenapierce/FGB-Production-Studio.git /tmp/fgbears-live-audio-hotfix
            sudo bash /tmp/fgbears-live-audio-hotfix/services/fgbears-live/bin/install.sh
            sudo systemctl reset-failed fgbears-youtube-relay.service fgbears-live.service
            sudo systemctl restart fgbears-youtube-relay.service
            sudo systemctl restart fgbears-live.service
            for i in $(seq 1 60); do
              if systemctl is-active --quiet fgbears-youtube-relay.service && systemctl is-active --quiet fgbears-live.service; then
                sudo /usr/local/bin/fgbears-audio-health --capture-seconds 10
                exit 0
              fi
              sleep 1
            done
            sudo systemctl status fgbears-youtube-relay.service --no-pager || true
            sudo systemctl status fgbears-live.service --no-pager || true
            exit 1
          '
