name: Read-Only Current FGB Audio Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-fgb-facebook-live-api.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Read-only approved audio probe
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          CONTRACT=https://epiccontentcreatorgrants.org/api/public/fgbears/stream-routing
          AUDIO=/srv/fgbears-live/audio/fgb-music-loop.m4a
          STATE=/srv/fgbears-live/runtime/lovable-audio-pipeline.json
          curl -fsS --max-time 20 "$CONTRACT" -o /tmp/fgb-contract-current.json
          echo '=== LOVABLE_AUDIO ==='
          jq '.presentation.audio' /tmp/fgb-contract-current.json
          echo '=== ORACLE_LIVE ==='
          echo LIVE_SHA=$(sha256sum "$AUDIO" | awk '{print $1}')
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels,bit_rate,start_time,duration -of json "$AUDIO"
          echo MASTER=$(systemctl is-active fgbears-live.service 2>/dev/null || true)
          echo SYNC_TIMER_ACTIVE=$(systemctl is-active fgbears-lovable-audio-sync.timer 2>/dev/null || true)
          echo SYNC_TIMER_ENABLED=$(systemctl is-enabled fgbears-lovable-audio-sync.timer 2>/dev/null || true)
          echo SYNC_SERVICE_ACTIVE=$(systemctl is-active fgbears-lovable-audio-sync.service 2>/dev/null || true)
          echo '=== PIPELINE_STATE ==='
          cat "$STATE" 2>/dev/null || true
          echo '=== RECENT_SYNC_LOG ==='
          journalctl -u fgbears-lovable-audio-sync.service --since '-24 hours' --no-pager -n 100 || true
          echo AUDIO_PROBE=PASS
          REMOTE
