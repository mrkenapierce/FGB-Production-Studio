name: Recover Full-Quality FGB Music Bed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-unlock-me-full-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Install browser/audio tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p /tmp/pp && cd /tmp/pp
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
      - name: Recover full 256 kbps track
        run: |
          set -Eeuo pipefail
          cd /tmp/pp
          cat > capture.js <<'JS'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          (async()=>{
            const exe=process.env.CHROME;
            const browser=await puppeteer.launch({
              headless:true,
              executablePath:exe,
              ignoreHTTPSErrors:true,
              args:[
                '--no-sandbox','--ignore-certificate-errors',
                '--disable-blink-features=AutomationControlled',
                '--autoplay-policy=no-user-gesture-required',
                '--window-size=1365,768'
              ]
            });
            const page=await browser.newPage();
            await page.setViewport({width:1365,height:768});
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36');
            await page.setExtraHTTPHeaders({'Accept-Language':'en-US,en;q=0.9'});
            await page.evaluateOnNewDocument(()=>{
              Object.defineProperty(navigator,'webdriver',{get:()=>undefined});
              Object.defineProperty(navigator,'languages',{get:()=>['en-US','en']});
              Object.defineProperty(navigator,'plugins',{get:()=>[1,2,3,4,5]});
              window.chrome={runtime:{}};
            });
            let candidates=[];
            const keep=(u,ct,status)=>{
              if (/audio\//i.test(ct)||/\.mp3(?:\?|$)/i.test(u)||/stream|download/i.test(u)) {
                candidates.push({u,ct,status});
                console.log('MEDIA_CANDIDATE='+status+' '+ct+' '+u);
              }
            };
            page.on('response',r=>keep(r.url(),r.headers()['content-type']||'',r.status()));
            const url='https://audio.com/kontraa/audio/unlock-me';
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            for(let i=0;i<8;i++){
              console.log('TITLE_'+i+'='+await page.title());
              if(!/just a moment/i.test(await page.title())) break;
              await new Promise(r=>setTimeout(r,5000));
            }
            console.log('FINAL_TITLE='+await page.title());
            const html=await page.content();
            fs.writeFileSync('/tmp/audio-page.html',html);
            console.log('HTML_BYTES='+html.length);
            // Try any visible Play/Download controls.
            for (const selector of ['button','a']) {
              for (const el of await page.$$(selector)) {
                const text=(await page.evaluate(e=>(e.innerText||e.getAttribute('aria-label')||e.title||'').trim(),el));
                if(/^(play|download)/i.test(text)) {
                  console.log('ACTION='+text);
                  try { await el.click(); } catch(e) {}
                  await new Promise(r=>setTimeout(r,4000));
                }
              }
            }
            // Inspect media DOM and performance resources after interaction.
            const mediaEls=await page.$$eval('audio,source',els=>els.map(e=>({src:e.src,currentSrc:e.currentSrc||''})));
            console.log('MEDIA_ELEMENTS='+JSON.stringify(mediaEls));
            const perf=await page.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name));
            for(const u of perf) if(/\.mp3(?:\?|$)|audio|stream|download/i.test(u)) console.log('PERF='+u);
            const urls=[...candidates.map(x=>x.u),...mediaEls.flatMap(x=>[x.currentSrc,x.src]),...perf].filter(Boolean);
            const unique=[...new Set(urls)];
            // Prefer obvious MP3/content URLs over page/challenge URLs.
            const chosen=unique.find(u=>/\.mp3(?:\?|$)/i.test(u) && !/cdn-cgi/i.test(u)) ||
                         unique.find(u=>/stream|download/i.test(u) && !/cdn-cgi|audio\.com\/kontraa\/audio\/unlock-me$/i.test(u)) || '';
            console.log('CHOSEN='+chosen);
            if(!chosen) process.exit(2);
            fs.writeFileSync('/tmp/full-media-url.txt',chosen);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium) node capture.js
          media_url=$(cat /tmp/full-media-url.txt)
          curl -k -LfsS -A 'Mozilla/5.0' "$media_url" -o /tmp/unlock-me-full.mp3
          test -s /tmp/unlock-me-full.mp3
          echo '=== FULL SOURCE ==='
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,sample_rate,channels,bit_rate -of json /tmp/unlock-me-full.mp3
          size=$(stat -c %s /tmp/unlock-me-full.mp3)
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/unlock-me-full.mp3)
          bitrate=$(ffprobe -v error -show_entries format=bit_rate -of default=nw=1:nk=1 /tmp/unlock-me-full.mp3)
          awk -v d="$duration" 'BEGIN{exit !(d>180 && d<190)}'
          test "$size" -gt 5500000
          test "$bitrate" -gt 240000
          sha256sum /tmp/unlock-me-full.mp3
      - name: Prepare clean broadcast copy and stage on Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          # Delivery conversion only: 48 kHz stereo AAC. No speech processing or mastering DSP.
          ffmpeg -hide_banner -loglevel error -y -i /tmp/unlock-me-full.mp3 \
            -ar 48000 -ac 2 -c:a aac -b:a 256k /tmp/fgb-music-loop.m4a
          echo '=== BROADCAST ASSET ==='
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,sample_rate,channels,bit_rate -of json /tmp/fgb-music-loop.m4a
          ffmpeg -hide_banner -nostats -i /tmp/fgb-music-loop.m4a -af ebur128=peak=true -f null - 2>&1 | tail -30
          scp -i ~/.ssh/oracle_key /tmp/fgb-music-loop.m4a "$ORACLE_USER@$ORACLE_HOST:/tmp/fgb-music-loop.m4a"
