name: Recover Full-Quality FGB Music Bed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-unlock-me-full-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Install browser/audio tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p /tmp/pp /tmp/downloads && cd /tmp/pp
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
      - name: Download original 256 kbps track
        run: |
          set -Eeuo pipefail
          cd /tmp/pp
          cat > download.js <<'JS'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const path=require('path');
          (async()=>{
            const exe=process.env.CHROME;
            const browser=await puppeteer.launch({
              headless:true, executablePath:exe, ignoreHTTPSErrors:true,
              args:['--no-sandbox','--ignore-certificate-errors','--disable-blink-features=AutomationControlled']
            });
            const page=await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36');
            await page.setExtraHTTPHeaders({'Accept-Language':'en-US,en;q=0.9'});
            await page.evaluateOnNewDocument(()=>{
              Object.defineProperty(navigator,'webdriver',{get:()=>undefined});
              Object.defineProperty(navigator,'languages',{get:()=>['en-US','en']});
              Object.defineProperty(navigator,'plugins',{get:()=>[1,2,3,4,5]});
            });
            const client=await page.target().createCDPSession();
            await client.send('Page.setDownloadBehavior',{behavior:'allow',downloadPath:'/tmp/downloads'});
            await page.goto('https://audio.com/kontraa/audio/unlock-me',{waitUntil:'domcontentloaded',timeout:60000});
            console.log('PAGE_TITLE='+await page.title());
            const clicked=await page.evaluate(()=>{
              const els=[...document.querySelectorAll('button,a')];
              const el=els.find(e=>/^download$/i.test((e.innerText||e.getAttribute('aria-label')||e.title||'').trim()));
              if(!el) return false;
              el.click(); return true;
            });
            console.log('DOWNLOAD_CLICKED='+clicked);
            if(!clicked) process.exit(2);
            let chosen='';
            for(let i=0;i<40;i++){
              await new Promise(r=>setTimeout(r,500));
              const files=fs.readdirSync('/tmp/downloads').filter(f=>!f.endsWith('.crdownload'));
              const candidates=files.map(f=>({f,size:fs.statSync(path.join('/tmp/downloads',f)).size})).filter(x=>x.size>1000000).sort((a,b)=>b.size-a.size);
              if(candidates.length){chosen=path.join('/tmp/downloads',candidates[0].f); break;}
            }
            if(!chosen){console.error('No completed download found');process.exit(3);}
            fs.copyFileSync(chosen,'/tmp/unlock-me-full.mp3');
            console.log('DOWNLOAD_BYTES='+fs.statSync('/tmp/unlock-me-full.mp3').size);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium) node download.js
          test -s /tmp/unlock-me-full.mp3
          echo '=== ORIGINAL DOWNLOAD ==='
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,sample_rate,channels,bit_rate -of json /tmp/unlock-me-full.mp3
          size=$(stat -c %s /tmp/unlock-me-full.mp3)
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/unlock-me-full.mp3)
          bitrate=$(ffprobe -v error -show_entries format=bit_rate -of default=nw=1:nk=1 /tmp/unlock-me-full.mp3)
          awk -v d="$duration" 'BEGIN{exit !(d>180 && d<190)}'
          test "$size" -gt 5500000
          test "$bitrate" -gt 240000
          sha256sum /tmp/unlock-me-full.mp3
      - name: Prepare clean broadcast copy and stage on Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          # Delivery conversion only: 48 kHz stereo AAC. No speech EQ, compression,
          # de-essing, denoising, loudness processing, or other mastering DSP.
          ffmpeg -hide_banner -loglevel error -y -i /tmp/unlock-me-full.mp3 \
            -ar 48000 -ac 2 -c:a aac -b:a 256k /tmp/fgb-music-loop.m4a
          echo '=== BROADCAST ASSET ==='
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,sample_rate,channels,bit_rate -of json /tmp/fgb-music-loop.m4a
          ffmpeg -hide_banner -nostats -i /tmp/fgb-music-loop.m4a -af ebur128=peak=true -f null - 2>&1 | tail -30
          scp -i ~/.ssh/oracle_key /tmp/fgb-music-loop.m4a "$ORACLE_USER@$ORACLE_HOST:/tmp/fgb-music-loop.m4a"
