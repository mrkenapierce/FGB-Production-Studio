name: CNT Phase 2 Worker Health Correction and Media Inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cnt-phase2-worker-health-and-media-20261026.yml']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Direct OVH SSH
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null
      - name: Fix worker-only Docker health metadata and inspect CNT media
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key ubuntu@40.160.144.185 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/cnt-transport
          before_fgb=$(sudo docker inspect -f '{{.Id}}' fgb-transport-youtube-1)
          before_cnt=$(sudo docker inspect -f '{{.Id}}' epic-cnt-capture)
          before_encode=$(sudo docker exec epic-cnt-capture pgrep -o ffmpeg)
          test -n "$before_encode"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/opt/cnt-transport/docker-compose.phase2.yml")
          s=p.read_text()
          needle='    entrypoint: ["/usr/bin/tini", "--"]\n'
          assert s.count(needle)==1, "unexpected compose layout"
          if '    healthcheck:\n      disable: true\n' not in s:
              s=s.replace(needle,'    healthcheck:\n      disable: true\n'+needle,1)
          p.write_text(s)
          PY
          sudo docker compose -f docker-compose.phase2.yml config -q
          # Sidecar only; must not recreate/restart capture or FGB.
          sudo docker compose -f docker-compose.phase2.yml up -d --no-build --no-deps archive_worker
          test "$(sudo docker inspect -f '{{.Id}}' fgb-transport-youtube-1)" = "$before_fgb"
          test "$(sudo docker inspect -f '{{.Id}}' epic-cnt-capture)" = "$before_cnt"
          test "$(sudo docker exec epic-cnt-capture pgrep -o ffmpeg)" = "$before_encode"
          echo 'WORKER_HEALTHCHECK_DISABLED=true'
          echo 'CNT_STREAM_ENCODER_UNCHANGED=true'
          echo 'FGB_STREAM_CONTAINER_UNCHANGED=true'
          sudo docker ps --filter name=epic-cnt --format '{{.Names}} {{.Status}}'
          echo 'CNT_MEDIA_PROBE'
          newest=$(find /srv/cnt-archive/rolling -maxdepth 1 -type f -name 'live-*.ts' | sort | tail -1)
          if [ -n "$newest" ] && [ -s "$newest" ]; then
            echo "CNT_MEDIA_FILE_NAME=$(basename "$newest")"
            stat -c 'CNT_MEDIA_BYTES=%s' "$newest"
            timeout 15 ffprobe -v error -show_entries stream=codec_name,codec_type -of csv=p=0 "$newest" | head -8 || :
          else echo 'CNT_MEDIA_FILE=NOT_YET_AVAILABLE'; fi
          echo 'ARCHIVE_RECORD_COUNT'
          find /srv/cnt-archive/rolling -maxdepth 1 -type f -name 'live-*.ts' | wc -l
          df -h /srv/cnt-archive
          REMOTE
