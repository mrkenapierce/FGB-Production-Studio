name: Diagnose FGB Live Visual

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-fgb-live-visual.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure production SSH
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null

      - name: Capture browser source and encoded outgoing frame
        run: |
          set -euo pipefail
          SSH="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=8 -i ~/.ssh/ovh_key ubuntu@40.160.144.185"

          $SSH 'cd /opt/fgb-transport && sudo docker compose --env-file .env exec -T youtube sh -lc '\''ffmpeg -hide_banner -loglevel error -f x11grab -draw_mouse 0 -video_size 1280x720 -i :99.0 -frames:v 1 -f image2pipe -vcodec png -'\''' > /tmp/fgb-browser-source.png

          $SSH 'latest=$(find /srv/fgb-archive/hourly -maxdepth 1 -type f -name "live-*.ts" -printf "%T@ %p\n" 2>/dev/null | sort -n | tail -1 | cut -d" " -f2-); test -n "$latest"; sudo ffmpeg -hide_banner -loglevel error -ss 5 -i "$latest" -frames:v 1 -f image2pipe -vcodec png -' > /tmp/fgb-encoded-output.png

          $SSH 'latest=$(find /srv/fgb-archive/hourly -maxdepth 1 -type f -name "live-*.ts" -printf "%T@ %p\n" 2>/dev/null | sort -n | tail -1 | cut -d" " -f2-); test -n "$latest"; sudo ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json "$latest"' > /tmp/fgb-archive-probe.json

          $SSH 'cd /opt/fgb-transport; cid=$(sudo docker compose --env-file .env ps -q youtube); test -n "$cid"; live=$(sudo docker compose --env-file .env exec -T youtube sh -lc '\''cat /tmp/fgb-transport.state 2>/dev/null || echo missing'\''); ffprog=$(sudo docker compose --env-file .env exec -T youtube sh -lc '\''grep "^progress=" /tmp/fgb-ffmpeg.progress | tail -1'\'' || true); latest=$(find /srv/fgb-archive/hourly -maxdepth 1 -type f -name "live-*.ts" -printf "%T@ %p\n" 2>/dev/null | sort -n | tail -1 | cut -d" " -f2-); printf "LIVE_STATE=%s\nCONTAINER_RESTARTS=%s\nFFMPEG_PROGRESS=%s\nARCHIVE_SOURCE=%s\n" "$live" "$(sudo docker inspect -f '\''{{.RestartCount}}'\'' "$cid")" "$ffprog" "$(basename "$latest")"; test "$live" = live' > /tmp/fgb-visual-status.txt

          test -s /tmp/fgb-browser-source.png
          test -s /tmp/fgb-encoded-output.png
          cat /tmp/fgb-visual-status.txt
          cat /tmp/fgb-archive-probe.json

      - name: Upload visual diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: fgb-live-visual-diagnostic
          path: |
            /tmp/fgb-browser-source.png
            /tmp/fgb-encoded-output.png
            /tmp/fgb-archive-probe.json
            /tmp/fgb-visual-status.txt
          if-no-files-found: error
          retention-days: 1
