name: Deploy FGB Livestream Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-fgb-archive.yml

permissions:
  contents: write

concurrency:
  group: fgbears-livestream-archive
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate archive package
        run: |
          set -Eeuo pipefail
          bash -n services/fgbears-live/bin/rumble-relay.sh
          bash -n services/fgbears-live/bin/archive-recorder.sh
          python3 -m py_compile services/fgbears-live/bin/youtube-archive-upload.py
          grep -Fq 'FGB_ARCHIVE_LOCAL_UDP_URL' services/fgbears-live/bin/rumble-relay.sh
          grep -Fq 'onfail=ignore' services/fgbears-live/bin/rumble-relay.sh
          grep -Fq 'notifySubscribers' services/fgbears-live/bin/youtube-archive-upload.py
          grep -Fq 'segment_atclocktime' services/fgbears-live/bin/archive-recorder.sh

      - name: Configure production SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Package archive deployment
        run: |
          set -Eeuo pipefail
          tar -czf /tmp/fgb-archive-deploy.tgz \
            services/fgbears-live/bin/rumble-relay.sh \
            services/fgbears-live/bin/archive-recorder.sh \
            services/fgbears-live/bin/youtube-archive-upload.py \
            services/fgbears-live/systemd/fgbears-archive-recorder.service \
            services/fgbears-live/systemd/fgbears-archive-uploader.service

      - name: Copy archive deployment to production
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/production_key /tmp/fgb-archive-deploy.tgz "ubuntu@$ORACLE_HOST:/tmp/fgb-archive-deploy.tgz"

      - name: Deploy, test unlisted archive, then promote hourly public mode
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/production_key "ubuntu@$ORACLE_HOST" 'bash -s' <<'REMOTE' | tee /tmp/fgb-archive-rollout.txt
          set -Eeuo pipefail

          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          YOUTUBE=fgbears-youtube-copy-relay.service
          RECORDER=fgbears-archive-recorder.service
          UPLOADER=fgbears-archive-uploader.service
          ENV_FILE=/etc/fgbears-live/stream.env
          ARCHIVE_DIR=/srv/fgbears-live/archive
          PAYLOAD=/tmp/fgb-archive-deploy

          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          restarts(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          connected(){
            local p=$1
            [[ "$p" =~ ^[1-9][0-9]*$ ]] || return 1
            sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" 'index($0,q)&&index($0,":443"){ok=1} END{exit(ok?0:1)}'
          }
          set_env(){
            local key=$1 value=$2
            sudo python3 -c 'import re,sys,shlex; from pathlib import Path; p=Path("/etc/fgbears-live/stream.env"); k,v=sys.argv[1:3]; t=p.read_text(encoding="utf-8"); pat=re.compile(r"^(?:export\s+)?"+re.escape(k)+r"=.*$",re.M); line=k+"="+shlex.quote(v); t=pat.sub(line,t) if pat.search(t) else (t+("" if (not t or t.endswith("\n")) else "\n")+line+"\n"); p.write_text(t,encoding="utf-8")' "$key" "$value"
          }

          for svc in "$MASTER" "$RUMBLE" "$YOUTUBE"; do
            systemctl is-active --quiet "$svc" || { echo "PRECHECK_INACTIVE_SERVICE=$svc" >&2; exit 1; }
          done
          command -v ffmpeg >/dev/null
          command -v python3 >/dev/null
          python3 -c 'from zoneinfo import ZoneInfo; ZoneInfo("America/Chicago")'
          id fgbears >/dev/null
          sudo test -r "$ENV_FILE"
          sudo bash -c 'set -a; source /etc/fgbears-live/stream.env; set +a; test -n "${FGB_YOUTUBE_CLIENT_ID:-}"; test -n "${FGB_YOUTUBE_CLIENT_SECRET:-}"; test -n "${FGB_YOUTUBE_REFRESH_TOKEN:-}"'
          echo 'OAUTH_ENV_PRESENT=true'

          master_before=$(pid "$MASTER")
          rumble_before=$(pid "$RUMBLE")
          youtube_before=$(pid "$YOUTUBE")
          [[ "$master_before" =~ ^[1-9][0-9]*$ ]]
          [[ "$rumble_before" =~ ^[1-9][0-9]*$ ]]
          [[ "$youtube_before" =~ ^[1-9][0-9]*$ ]]
          youtube_restarts_before=$(restarts "$YOUTUBE")
          connected "$youtube_before"

          rollback_root=/root/fgb-archive-rollback-$$
          sudo install -d -m 0700 "$rollback_root"
          sudo cp -a /usr/local/bin/fgbears-rumble-relay "$rollback_root/fgbears-rumble-relay"
          sudo cp -a "$ENV_FILE" "$rollback_root/stream.env"
          rollback(){
            rc=$?
            trap - ERR
            echo "ROLLBACK_TRIGGERED=true rc=$rc"
            sudo systemctl disable --now "$UPLOADER" "$RECORDER" >/dev/null 2>&1 || true
            sudo cp -a "$rollback_root/stream.env" "$ENV_FILE" || true
            sudo install -m 0755 "$rollback_root/fgbears-rumble-relay" /usr/local/bin/fgbears-rumble-relay || true
            sudo systemctl daemon-reload || true
            sudo systemctl restart "$RUMBLE" || true
            sleep 5
            echo "ROLLBACK_MASTER_ACTIVE=$(systemctl is-active "$MASTER" 2>/dev/null || true)"
            echo "ROLLBACK_RUMBLE_ACTIVE=$(systemctl is-active "$RUMBLE" 2>/dev/null || true)"
            echo "ROLLBACK_YOUTUBE_ACTIVE=$(systemctl is-active "$YOUTUBE" 2>/dev/null || true)"
            sudo rm -rf "$rollback_root" "$PAYLOAD" /tmp/fgb-archive-deploy.tgz || true
            exit "$rc"
          }
          trap rollback ERR

          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          tar -xzf /tmp/fgb-archive-deploy.tgz -C "$PAYLOAD"
          bash -n "$PAYLOAD/services/fgbears-live/bin/rumble-relay.sh"
          bash -n "$PAYLOAD/services/fgbears-live/bin/archive-recorder.sh"
          python3 -m py_compile "$PAYLOAD/services/fgbears-live/bin/youtube-archive-upload.py"

          sudo install -d -o fgbears -g fgbears -m 0700 "$ARCHIVE_DIR" "$ARCHIVE_DIR/state"
          sudo install -m 0755 "$PAYLOAD/services/fgbears-live/bin/archive-recorder.sh" /usr/local/bin/fgbears-archive-recorder
          sudo install -m 0755 "$PAYLOAD/services/fgbears-live/bin/youtube-archive-upload.py" /usr/local/bin/fgbears-youtube-archive-upload
          sudo install -m 0644 "$PAYLOAD/services/fgbears-live/systemd/fgbears-archive-recorder.service" /etc/systemd/system/fgbears-archive-recorder.service
          sudo install -m 0644 "$PAYLOAD/services/fgbears-live/systemd/fgbears-archive-uploader.service" /etc/systemd/system/fgbears-archive-uploader.service
          sudo install -m 0755 "$PAYLOAD/services/fgbears-live/bin/rumble-relay.sh" /usr/local/bin/fgbears-rumble-relay

          set_env FGB_ARCHIVE_ENABLED 1
          set_env FGB_ARCHIVE_LOCAL_UDP_URL 'udp://127.0.0.1:1944?pkt_size=1316'
          set_env FGB_ARCHIVE_DIR "$ARCHIVE_DIR"
          set_env FGB_ARCHIVE_SEGMENT_SECONDS 120
          set_env FGB_ARCHIVE_MODE test
          set_env FGB_ARCHIVE_PRIVACY unlisted
          set_env FGB_ARCHIVE_PLAYLIST_TITLE 'FGB Daily Livestream Archive'
          set_env FGB_ARCHIVE_TIMEZONE America/Chicago
          set_env FGB_ARCHIVE_MIN_FREE_GB 5
          set_env FGB_ARCHIVE_POLL_SECONDS 15
          set_env FGB_ARCHIVE_STABLE_AGE_SECONDS 20

          sudo systemctl daemon-reload
          sudo systemctl enable "$RECORDER" "$UPLOADER" >/dev/null
          sudo systemctl restart "$RECORDER" "$UPLOADER"
          sleep 3
          systemctl is-active --quiet "$RECORDER"
          systemctl is-active --quiet "$UPLOADER"

          sudo systemctl restart "$RUMBLE"
          sleep 8
          systemctl is-active --quiet "$RUMBLE"
          systemctl is-active --quiet "$MASTER"
          systemctl is-active --quiet "$YOUTUBE"
          test "$(pid "$MASTER")" = "$master_before"
          test "$(pid "$YOUTUBE")" = "$youtube_before"
          test "$(restarts "$YOUTUBE")" = "$youtube_restarts_before"
          connected "$youtube_before"

          archive_seen=false
          for _ in $(seq 1 12); do
            if find "$ARCHIVE_DIR" -maxdepth 1 -type f -name 'test-*.mp4' -print -quit | grep -q .; then
              archive_seen=true
              break
            fi
            sleep 5
          done
          test "$archive_seen" = true
          echo 'ARCHIVE_TAP_ACTIVE=true'

          test_state=''
          for _ in $(seq 1 72); do
            candidate=$(find "$ARCHIVE_DIR/state" -maxdepth 1 -type f -name 'test-*.mp4.json' | sort | tail -1 || true)
            if [[ -n "$candidate" ]] && python3 -c 'import json,sys; s=json.load(open(sys.argv[1],encoding="utf-8")); ok=(s.get("complete") is True and s.get("playlist_added") is True and s.get("actual_privacy")=="unlisted" and bool(s.get("video_id")) and bool(s.get("playlist_id"))); raise SystemExit(0 if ok else 1)' "$candidate"; then
              test_state="$candidate"
              break
            fi
            sleep 10
          done
          [[ -n "$test_state" ]] || {
            echo 'Archive test upload did not complete as unlisted within the rollout window.' >&2
            sudo journalctl -u "$UPLOADER" -n 80 --no-pager >&2 || true
            exit 1
          }

          read -r test_video_id test_playlist_id < <(python3 -c 'import json,sys; s=json.load(open(sys.argv[1],encoding="utf-8")); print(s["video_id"],s["playlist_id"])' "$test_state")
          echo "TEST_VIDEO_ID=$test_video_id"
          echo "TEST_PLAYLIST_ID=$test_playlist_id"
          echo 'TEST_PRIVACY=unlisted'
          echo 'TEST_PLAYLIST_ADDED=true'

          test "$(pid "$MASTER")" = "$master_before"
          test "$(pid "$YOUTUBE")" = "$youtube_before"
          test "$(restarts "$YOUTUBE")" = "$youtube_restarts_before"
          connected "$youtube_before"

          sudo systemctl stop "$UPLOADER" "$RECORDER"
          sudo find "$ARCHIVE_DIR" -maxdepth 1 -type f -name 'test-*.mp4' -delete
          set_env FGB_ARCHIVE_SEGMENT_SECONDS 3600
          set_env FGB_ARCHIVE_MODE prod
          set_env FGB_ARCHIVE_PRIVACY public
          set_env FGB_ARCHIVE_POLL_SECONDS 20
          set_env FGB_ARCHIVE_STABLE_AGE_SECONDS 30
          sudo systemctl start "$RECORDER" "$UPLOADER"
          sleep 10
          systemctl is-active --quiet "$RECORDER"
          systemctl is-active --quiet "$UPLOADER"
          systemctl is-active --quiet "$RUMBLE"
          systemctl is-active --quiet "$MASTER"
          systemctl is-active --quiet "$YOUTUBE"
          test "$(pid "$MASTER")" = "$master_before"
          test "$(pid "$YOUTUBE")" = "$youtube_before"
          test "$(restarts "$YOUTUBE")" = "$youtube_restarts_before"
          connected "$youtube_before"

          prod_seen=false
          for _ in $(seq 1 12); do
            if find "$ARCHIVE_DIR" -maxdepth 1 -type f -name 'live-*.mp4' -print -quit | grep -q .; then
              prod_seen=true
              break
            fi
            sleep 5
          done
          test "$prod_seen" = true

          trap - ERR
          sudo rm -rf "$rollback_root" "$PAYLOAD" /tmp/fgb-archive-deploy.tgz
          echo 'ROLLOUT_OK=true'
          echo "MASTER_PID_BEFORE=$master_before"
          echo "MASTER_PID_AFTER=$(pid "$MASTER")"
          echo "YOUTUBE_PID_BEFORE=$youtube_before"
          echo "YOUTUBE_PID_AFTER=$(pid "$YOUTUBE")"
          echo "RUMBLE_PID_BEFORE=$rumble_before"
          echo "RUMBLE_PID_AFTER=$(pid "$RUMBLE")"
          echo 'ARCHIVE_MODE=prod'
          echo 'ARCHIVE_SEGMENT_SECONDS=3600'
          echo 'ARCHIVE_PRIVACY=public'
          echo 'ARCHIVE_NOTIFY_SUBSCRIBERS=false'
          echo 'ARCHIVE_PLAYLIST=FGB Daily Livestream Archive'
          REMOTE

      - name: Persist sanitized archive rollout result
        if: success()
        run: |
          set -Eeuo pipefail
          mkdir -p .github/deployment-status
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          allowed={
              'ROLLOUT_OK','OAUTH_ENV_PRESENT','ARCHIVE_TAP_ACTIVE','TEST_VIDEO_ID','TEST_PLAYLIST_ID',
              'TEST_PRIVACY','TEST_PLAYLIST_ADDED','MASTER_PID_BEFORE','MASTER_PID_AFTER',
              'YOUTUBE_PID_BEFORE','YOUTUBE_PID_AFTER','RUMBLE_PID_BEFORE','RUMBLE_PID_AFTER',
              'ARCHIVE_MODE','ARCHIVE_SEGMENT_SECONDS','ARCHIVE_PRIVACY','ARCHIVE_NOTIFY_SUBSCRIBERS',
              'ARCHIVE_PLAYLIST'
          }
          values={}
          for raw in Path('/tmp/fgb-archive-rollout.txt').read_text(encoding='utf-8').splitlines():
              if '=' not in raw:
                  continue
              key,value=raw.split('=',1)
              if key in allowed:
                  values[key]=value
          body={
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'production': values,
              'scope': 'isolated-livestream-archive',
          }
          Path('.github/deployment-status/fgb-livestream-archive.json').write_text(
              json.dumps(body, indent=2, sort_keys=True)+'\n', encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/fgb-livestream-archive.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record FGB livestream archive rollout'
            git push
          fi
