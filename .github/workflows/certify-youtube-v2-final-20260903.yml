name: Final YouTube v2 Production Certification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-youtube-v2-final-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  certify:
    name: Read-only final certification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Certify current Oracle production state without mutation
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          YOUTUBE=fgbears-youtube-v2.service
          VERIFY=/opt/fgbears-live/youtube-v2/verify-youtube-v2.sh
          STATE=/run/fgbears-youtube-v2/overlay-state.json
          QUAR=/opt/fgbears-live/quarantine/youtube-legacy
          LEGACY=(
            fgbears-youtube-output.service
            fgbears-youtube-relay.service
            fgbears-youtube-router.service
            fgbears-youtube-lovable-routing.service
            fgbears-youtube-lovable-compositor.service
            fgbears-youtube-audio-watchdog.service
            fgbears-youtube-audio-watchdog.timer
          )
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          fail(){ echo "FINAL_CERTIFICATION=FAIL reason=$1" >&2; exit 1; }
          socket(){ local p=$1 port=$2; sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v port=":$port" 'index($0,q)&&index($0,port){ok=1} END{exit(ok?0:1)}'; }

          MPID=$(pid "$MASTER"); RPID=$(pid "$RUMBLE"); YPID=$(pid "$YOUTUBE")
          echo "PIDS master=$MPID rumble=$RPID youtube_v2=$YPID"
          for svc in "$MASTER" "$RUMBLE" "$YOUTUBE" fgbears-live-health.timer; do
            echo "UNIT $svc active=$(systemctl is-active "$svc" 2>/dev/null || true) enabled=$(systemctl is-enabled "$svc" 2>/dev/null || true)"
          done
          echo "YOUTUBE_META $(systemctl show "$YOUTUBE" -p Result -p NRestarts -p ExecMainStatus --value 2>/dev/null | tr '\n' ' ')"
          echo "YOUTUBE_EXE $(readlink -f "/proc/$YPID/exe" 2>/dev/null || echo unavailable)"
          echo 'SOCKETS_BEGIN'
          sudo ss -ntpH state established 2>/dev/null | awk -v m="pid=$MPID" -v r="pid=$RPID" -v y="pid=$YPID" 'index($0,m)||index($0,r)||index($0,y){print}'
          echo 'SOCKETS_END'

          [[ "$MPID" =~ ^[1-9][0-9]*$ ]] || fail master_pid_invalid
          [[ "$RPID" =~ ^[1-9][0-9]*$ ]] || fail rumble_pid_invalid
          [[ "$YPID" =~ ^[1-9][0-9]*$ ]] || fail youtube_pid_invalid
          systemctl is-active --quiet "$MASTER" || fail master_inactive
          systemctl is-active --quiet "$RUMBLE" || fail rumble_inactive
          systemctl is-active --quiet "$YOUTUBE" || fail youtube_inactive
          systemctl is-active --quiet fgbears-live-health.timer || fail health_timer_inactive
          socket "$RPID" 1935 || fail rumble_socket_missing
          socket "$YPID" 443 || fail youtube_socket_missing

          for unit in "${LEGACY[@]}"; do
            systemctl is-active --quiet "$unit" && fail "legacy_active_${unit//[^A-Za-z0-9]/_}"
            state=$(systemctl is-enabled "$unit" 2>/dev/null || true)
            [[ "$state" == masked* ]] || fail "legacy_not_masked_${unit//[^A-Za-z0-9]/_}"
          done
          for path in \
            /usr/local/bin/fgbears-youtube-relay \
            /usr/local/bin/fgbears-youtube-audio-watchdog \
            /opt/fgbears-live/bin/youtube-relay.sh \
            /opt/fgbears-live/bin/youtube-stream-router.py \
            /opt/fgbears-live/bin/youtube-stream-router-v5.py \
            /opt/fgbears-live/bin/youtube-trivia-overlay.py \
            /opt/fgbears-live/bin/youtube-question-mask.py \
            /opt/fgbears-live/bin/youtube-offhost-compositor.sh \
            /opt/fgbears-live/bin/youtube-compositor-source-relay.sh; do
            [[ ! -e "$path" ]] || fail "legacy_binary_present_$(basename "$path")"
          done
          [[ -d "$QUAR" ]] || fail quarantine_missing
          qexec=$(sudo find "$QUAR" -type f -perm /111 -print -quit 2>/dev/null || true)
          [[ -z "$qexec" ]] || fail quarantine_executable_present

          speed=$(sudo awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true)
          echo "MASTER_SPEED=${speed:-unknown}x"
          [[ -z "$speed" ]] || python3 -c 'import sys; assert float(sys.argv[1]) >= 0.98' "$speed" || fail master_below_realtime

          sudo python3 - "$STATE" <<'PY'
          import json, os, sys, time
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          age=time.time()-os.path.getmtime(sys.argv[1])
          assert p.get('maskRegion') == {'x':462,'y':104,'width':798,'height':470,'coordinateSpace':'pixels','referenceWidth':1280,'referenceHeight':720}
          assert p.get('frameSize') == [798,470]
          assert p.get('routingAuthority') == 'lovable_public_stream_routing'
          assert float(p.get('fps') or 0) == 10.0
          assert 0 <= age < 120, age
          print('OVERLAY_STATE ok=%s age=%.1fs active=%s creative=%s rendered=%s' % (p.get('ok'), age, p.get('active'), p.get('creativeKey'), p.get('renderedCreativeKey')))
          PY

          [[ -x "$VERIFY" ]] || fail verifier_missing
          echo 'VERIFY_PASS_1_BEGIN'
          sudo "$VERIFY"
          echo 'VERIFY_PASS_1_END'
          sleep 5
          echo 'VERIFY_PASS_2_BEGIN'
          sudo "$VERIFY"
          echo 'VERIFY_PASS_2_END'

          MPID2=$(pid "$MASTER"); RPID2=$(pid "$RUMBLE"); YPID2=$(pid "$YOUTUBE")
          [[ "$MPID2" == "$MPID" ]] || fail master_pid_changed_during_certification
          [[ "$RPID2" == "$RPID" ]] || fail rumble_pid_changed_during_certification
          [[ "$YPID2" == "$YPID" ]] || fail youtube_pid_changed_during_certification
          echo "FINAL_CERTIFICATION=PASS master=$MPID2 rumble=$RPID2 youtube_v2=$YPID2 legacy=masked quarantine=nonexecutable"
          REMOTE
