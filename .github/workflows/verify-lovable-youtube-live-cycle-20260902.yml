name: Legacy YouTube 720p Verifier - Manual Only

on:
  workflow_dispatch:

permissions:
  contents: read

# Historical verifier retained only for reference. The current production
# YouTube branch is intentionally 640x360/30 to preserve Oracle CPU headroom,
# with only the exact trivia question rectangle protected.

jobs:
  legacy_notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain obsolete verifier
        shell: bash
        run: |
          echo 'The former 720p same-host compositor is no longer the production design.'
          echo 'Current production: 640x360/30 exact-question-box compositor.'
