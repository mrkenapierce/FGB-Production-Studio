name: Audit CNT on-air reporter on OVH (no changes)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cnt-air-reporter-ovh.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnt-air-reporter-audit
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OVH_HOST: 40.160.144.185
      OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
      LEGACY_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Verify existing OVH SSH credential
        shell: bash
        run: |
          set -euo pipefail
          key="$OVH_SSH_KEY"
          source="OVH_SSH_KEY"
          if [ -z "$key" ]; then key="$LEGACY_KEY"; source="ORACLE_SSH_KEY fallback"; fi
          if [ -z "$key" ]; then
            echo "::error::Neither OVH_SSH_KEY nor the existing ORACLE_SSH_KEY fallback is configured for this GitHub repository."
            exit 1
          fi
          echo "SSH_KEY_SOURCE=$source"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          unset key OVH_SSH_KEY LEGACY_KEY
          ssh-keyscan -T 8 -H "$OVH_HOST" > ~/.ssh/ovh_known_hosts 2>/dev/null
          test -s ~/.ssh/ovh_known_hosts
          echo "OVH host public-key fingerprints (compare with trusted baseline before making changes):"
          ssh-keygen -lf ~/.ssh/ovh_known_hosts

      - name: Inspect reporter only (read-only)
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o UserKnownHostsFile=$HOME/.ssh/ovh_known_hosts
                -o StrictHostKeyChecking=yes
                -o BatchMode=yes
                -o PasswordAuthentication=no
                -o ConnectTimeout=8
                -i "$HOME/.ssh/ovh_key")
          user=""
          for candidate in ubuntu admin debian root; do
            if ssh "${opts[@]}" "$candidate@$OVH_HOST" 'printf OVH_CONNECTED' 2>/dev/null | grep -q OVH_CONNECTED; then
              user="$candidate"
              break
            fi
          done
          test -n "$user" || { echo "::error::No GitHub-to-OVH SSH login accepted"; exit 1; }
          echo "OVH_SSH_CONNECTED=true"
          echo "OVH_LOGIN_USER=$user"
          ssh "${opts[@]}" "$user@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          printf 'HOSTNAME=%s\n' "$(hostname)"
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif sudo -n true 2>/dev/null; then
            SUDO="sudo -n"
          else
            SUDO=""
            echo "SUDO_AVAILABLE=false"
          fi
          echo 'CNT_RELATED_SYSTEMD_UNITS_BEGIN'
          systemctl list-units --all --type=service --no-legend --no-pager 2>/dev/null |
            awk 'tolower($0) ~ /cnt|air.observer|air.reporter/ {print $1, $3, $4}' || true
          echo 'CNT_RELATED_SYSTEMD_UNITS_END'
          echo 'OBSERVER_PROCESSES_BEGIN'
          found=0
          for pid in $(pgrep -f '[/]cnt-air-observer[.]py' || true); do
            found=1
            echo "OBSERVER_PID=$pid"
            if [ -n "$SUDO" ]; then
              $SUDO cat "/proc/$pid/environ" 2>/dev/null |
                tr '\0' '\n' | grep -E '^CNT_AIR_(LOG|STATE)=' || true
            elif [ -r "/proc/$pid/environ" ]; then
              tr '\0' '\n' < "/proc/$pid/environ" |
                grep -E '^CNT_AIR_(LOG|STATE)=' || true
            fi
            echo "OBSERVER_PROCESS_OWNER=$(ps -o user= -p "$pid" | xargs)"
          done
          [ "$found" = 1 ] || echo 'OBSERVER_RUNNING=false'
          echo 'OBSERVER_PROCESSES_END'
          echo 'CNT_LOG_FILES_BEGIN'
          for f in /var/lib/docker/volumes/epic-cnt-capture-state/_data/watchdog/chromium.log /cnt-state/watchdog/chromium.log; do
            if [ -n "$SUDO" ]; then
              $SUDO stat -c 'LOG_FILE=%n SIZE=%s MTIME=%y' "$f" 2>/dev/null || true
            else
              stat -c 'LOG_FILE=%n SIZE=%s MTIME=%y' "$f" 2>/dev/null || true
            fi
          done
          echo 'CNT_LOG_FILES_END'
          echo 'STREAM_CONTAINERS_BEGIN'
          if command -v docker >/dev/null 2>&1; then
            if [ -n "$SUDO" ]; then
              $SUDO docker ps --format '{{.Names}} {{.Status}}' |
                grep -E '^(epic-cnt-capture|epic-cnt-archive-worker|fgb-transport-youtube-1) ' || true
            else
              docker ps --format '{{.Names}} {{.Status}}' 2>/dev/null |
                grep -E '^(epic-cnt-capture|epic-cnt-archive-worker|fgb-transport-youtube-1) ' || true
            fi
          fi
          echo 'STREAM_CONTAINERS_END'

          echo 'OBSERVER_PROCESS_TREE_BEGIN'
          for pid in $(pgrep -f '[/]cnt-air-observer[.]py' || true); do
            ps -o pid=,ppid=,comm= -p "$pid" 2>/dev/null || true
            if command -v pstree >/dev/null; then pstree -sp "$pid" 2>/dev/null || true; fi
            if [ -n "$SUDO" ]; then
              $SUDO stat -c 'REPORTER_LOG=%n SIZE=%s MTIME=%y' "/proc/$pid/root/cnt-archive/state/chrome.log" 2>/dev/null || true
              $SUDO stat -c 'REPORTER_LOG=%n SIZE=%s MTIME=%y' "/proc/$pid/root/cnt-state/watchdog/chromium.log" 2>/dev/null || true
            fi
            printf 'PROCESS_CGROUP='; cat "/proc/$pid/cgroup" 2>/dev/null | head -c 250 || true; printf '\n'
          done
          echo 'OBSERVER_PROCESS_TREE_END'
          echo 'CNT_DOCKER_LOG_CHECK_BEGIN'
          if command -v docker >/dev/null 2>&1; then
            if [ -n "$SUDO" ]; then D="$SUDO docker"; else D="docker"; fi
            $D inspect --format '{{range .Mounts}}{{println .Destination .Type .Name}}{{end}}' epic-cnt-capture 2>/dev/null || true
            $D exec epic-cnt-capture sh -c '
              for f in /cnt-state/watchdog/chromium.log /cnt-archive/state/chrome.log; do
                if [ -f "$f" ]; then
                  stat -c "CONTAINER_LOG=%n SIZE=%s MTIME=%y" "$f"
                  grep -c EPIC_AIR_BOUNDARY "$f" 2>/dev/null || true
                fi
              done' 2>/dev/null || true
            $D inspect --format '{{range .Mounts}}{{println .Destination .Type .Name}}{{end}}' epic-cnt-archive-worker 2>/dev/null || true
            $D exec epic-cnt-archive-worker sh -c '
              for f in /cnt-archive/state/chrome.log /cnt-state/watchdog/chromium.log; do
                if [ -f "$f" ]; then
                  stat -c "ARCHIVE_WORKER_LOG=%n SIZE=%s MTIME=%y" "$f"
                  grep -c EPIC_AIR_BOUNDARY "$f" 2>/dev/null || true
                fi
              done' 2>/dev/null || true
          fi
          echo 'CNT_DOCKER_LOG_CHECK_END'
          echo 'USER_SYSTEMD_BEGIN'
          systemctl --user list-units --all --type=service --no-legend --no-pager 2>/dev/null |
            awk 'tolower($0) ~ /cnt|air|observer|archive/ {print $1,$3,$4}' || true
          echo 'USER_SYSTEMD_END'


          echo 'REPORTER_LAUNCH_INSPECT_BEGIN'
          if command -v docker >/dev/null 2>&1; then
            if [ -n "$SUDO" ]; then D="$SUDO docker"; else D="docker"; fi
            $D exec epic-cnt-capture sh -c '
              pid=$(pgrep -f "^python3 .*cnt-air-observer[.]py" | head -1 || true)
              if [ -z "$pid" ]; then
                pid=$(ps -eo pid,args | awk "/python3.*cnt-air-observer[.]py/ && !/awk/ {print \\$1;exit}")
              fi
              if [ -n "$pid" ]; then
                parent=$(ps -o ppid= -p "$pid" | xargs)
                echo "REPORTER_CONTAINER_PID=$pid PARENT_PID=$parent"
                ps -o pid=,ppid=,comm= -p "$pid","$parent" || true
                for p in "$pid" "$parent" 1; do
                  echo "PROCESS=$p SCRIPT_ARGUMENTS:"
                  tr "\\0" "\\n" < "/proc/$p/cmdline" 2>/dev/null |
                    grep -E "(^|/)[^/ ]+\\.(sh|py)$" || true
                  echo "PROCESS=$p WORKDIR=$(readlink "/proc/$p/cwd" || true)"
                done
              fi
              for f in /run-cnt.sh /app/run-cnt.sh /opt/cnt-transport/run-cnt.sh /app/entrypoint.sh; do
                if [ -f "$f" ]; then
                  echo "SCRIPT_FILE=$f"
                  grep -n -C 3 "cnt-air-observer[.]py" "$f" || true
                fi
              done
              command -v python3 || true
            ' 2>/dev/null || true
            echo 'REPORTER_SCRIPT_PATHS_BEGIN'
            $D exec epic-cnt-capture sh -c 'find /app /opt /usr/local/bin -maxdepth 5 -name "cnt-air-observer.py" -o -name "*cnt*entry*.sh" 2>/dev/null | head -30' 2>/dev/null || true
            echo 'REPORTER_SCRIPT_PATHS_END'
          fi
          echo 'REPORTER_LAUNCH_INSPECT_END'


          echo 'REPORTER_SUPERVISION_SOURCE_BEGIN'
          if command -v docker >/dev/null 2>&1; then
            if [ -n "$SUDO" ]; then D="$SUDO docker"; else D="docker"; fi
            $D exec epic-cnt-capture sh -c '
              echo "Observer references in CNT scripts:"
              grep -R -n -C 3 --include="*.sh" -E "cnt-air-observer[.]py|CNT_AIR_LOG" /opt/cnt 2>/dev/null | head -90 || true
              echo "CNT script file names:"
              find /opt/cnt -maxdepth 2 -type f -name "*.sh" 2>/dev/null | head -30 || true
              echo "Observer python processes:"
              ps -eo pid=,ppid=,comm= | grep python3 || true
            ' 2>/dev/null || true
          fi
          echo 'REPORTER_SUPERVISION_SOURCE_END'


          echo 'REPORTER_PARENT_CONTRACT_BEGIN'
          if command -v docker >/dev/null 2>&1; then
            if [ -n "$SUDO" ]; then D="$SUDO docker"; else D="docker"; fi
            $D exec epic-cnt-capture python3 -c '
          import os,re
          from pathlib import Path
          lines = Path("/proc/7/cmdline").read_bytes().split(b"\\0")
          parts = [b.decode("utf-8","replace") for b in lines if b]
          print("PARENT_CMD_ARGC=",len(parts))
          print("PARENT_EXE_NAME=",os.path.basename(parts[0]) if parts else "unknown")
          s=" ".join(parts[1:])
          for term in ["cnt-air-observer.py","wait -n","wait ","trap ","exec ","while ","nohup ","setsid ","python3 ","CNT_AIR_LOG","CNT_ARCHIVE_HMAC_SECRET"]:
              print("PARENT_CONTAINS_"+term.replace(" ","_").replace(".","_").replace("-","_")+"=",term in s)
          needle="cnt-air-observer.py"
          i=s.find(needle)
          if i>=0:
              nearby=s[max(0,i-75):i+len(needle)+90]
              nearby=re.sub(r"[A-Za-z0-9+/]{40,}","[REDACTED]",nearby)
              nearby=re.sub(r"([A-Za-z_]*(?:KEY|SECRET|TOKEN|PASSWORD)[A-Za-z_]*=)[^ ;]+",r"\\1[REDACTED]",nearby,re.I)
              print("OBSERVER_LAUNCH_CONTEXT=",nearby)
          print("PYTHON_PROCESS_CNT=",sum(1 for p in os.listdir("/proc") if p.isdigit() and Path("/proc/"+p+"/comm").exists() and Path("/proc/"+p+"/comm").read_text().strip()=="python3"))
          ' 2>/dev/null || true
            $D inspect --format '{{json .Config.Env}}' epic-cnt-capture |
              python3 -c 'import json,sys; env=json.load(sys.stdin); print("CONFIG_HAS_CNT_ARCHIVE_HMAC_SECRET="+str(any(s.startswith("CNT_ARCHIVE_HMAC_SECRET=") for s in env)));print("CONFIG_HAS_CNT_AIR_LOG="+str(any(s.startswith("CNT_AIR_LOG=") for s in env)))' || true
          fi
          echo 'REPORTER_PARENT_CONTRACT_END'


          echo 'PYTHON_PROCESS_IDENTITIES_BEGIN'
          if command -v docker >/dev/null 2>&1; then
            if [ -n "$SUDO" ]; then D="$SUDO docker"; else D="docker"; fi
            for box in epic-cnt-capture epic-cnt-archive-worker; do
              echo "CONTAINER=$box"
              $D exec "$box" python3 -c '
          import os
          from pathlib import Path
          for p in sorted((x for x in os.listdir("/proc") if x.isdigit()), key=int):
              try:
                  argv=Path("/proc/"+p+"/cmdline").read_bytes().split(b"\\0")
                  argv=[x.decode("utf-8","replace") for x in argv if x]
                  if argv and os.path.basename(argv[0]).startswith("python"):
                      script=next((os.path.basename(x) for x in argv[1:4] if x.endswith(".py")),"no-script")
                      print("PYTHON_PID="+p+" SCRIPT="+script)
              except OSError:
                  pass
          ' 2>/dev/null || true
            done
          fi
          echo 'PYTHON_PROCESS_IDENTITIES_END'

          echo 'AUDIT_COMPLETE=NO_REMOTE_CHANGES'
          REMOTE
