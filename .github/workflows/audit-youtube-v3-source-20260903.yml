name: Audit YouTube v3 Source Failure

on:
  push:
    branches: [lovable-routing-bridge-20260902]
    paths: ['.github/workflows/audit-youtube-v3-source-20260903.yml']

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Compare actual master launcher paths
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '--- service executable ---'
          systemctl show fgbears-live.service -p ExecStart -p MainPID --no-pager
          echo '--- launcher hashes ---'
          sha256sum /usr/local/bin/fgbears-start-stream /opt/fgbears-live/bin/start-stream.sh 2>/dev/null || true
          echo '--- live launcher relevant settings ---'
          grep -nE 'LOCAL_UDP|TEE_TARGETS|use_fifo|fifo_options|ffmpeg|VIDEO_GOP|AUDIO|OUTPUT|YouTube|Rumble' /usr/local/bin/fgbears-start-stream | head -n 140 || true
          echo '--- opt launcher relevant settings ---'
          grep -nE 'LOCAL_UDP|TEE_TARGETS|use_fifo|fifo_options|ffmpeg|VIDEO_GOP|AUDIO|OUTPUT|YouTube|Rumble' /opt/fgbears-live/bin/start-stream.sh | head -n 140 || true
          echo '--- sanitized structural diff ---'
          diff -u /usr/local/bin/fgbears-start-stream /opt/fgbears-live/bin/start-stream.sh | sed -E 's#(rtmps?://[^/[:space:]]+/)[^[:space:]]+#\1[redacted]#g' | head -n 220 || true
          echo '--- current production health ---'
          P=$(systemctl show -p MainPID --value fgbears-live.service)
          echo "MASTER pid=$P active=$(systemctl is-active fgbears-live.service)"
          grep -E '^(frame|fps|drop_frames|speed|progress)=' /srv/fgbears-live/logs/ffmpeg-progress.log | tail -5 || true
          echo "RUMBLE active=$(systemctl is-active fgbears-rumble-relay.service) pid=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)"
          echo "V2 active=$(systemctl is-active fgbears-youtube-v2.service) pid=$(systemctl show -p MainPID --value fgbears-youtube-v2.service)"
          REMOTE
