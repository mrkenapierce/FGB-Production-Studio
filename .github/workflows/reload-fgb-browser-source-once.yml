name: Reload FGB Browser Source Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reload-fgb-browser-source-once.yml

permissions:
  contents: read

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure OVH access
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null

      - name: Reload browser page only and verify live encoder continuity
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=8 -i ~/.ssh/ovh_key ubuntu@40.160.144.185 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/fgb-transport

          youtube_id_before=$(sudo docker compose --env-file .env ps -q youtube)
          test -n "$youtube_id_before"
          restarts_before=$(sudo docker inspect -f '{{.RestartCount}}' "$youtube_id_before")
          live_before=$(sudo docker compose --env-file .env exec -T youtube sh -lc 'cat /tmp/fgb-transport.state')
          test "$live_before" = live

          sudo docker compose --env-file .env exec -T youtube python3 - <<'PY'
          import base64, json, os, socket, struct, urllib.parse, urllib.request

          with urllib.request.urlopen('http://127.0.0.1:9222/json', timeout=5) as r:
              targets = json.load(r)
          target = next((t for t in targets if t.get('type') == 'page' and '/fgb-broadcast' in t.get('url','')), None)
          if not target:
              raise SystemExit('broadcast page target not found')
          ws = target.get('webSocketDebuggerUrl','')
          u = urllib.parse.urlsplit(ws)
          if u.scheme != 'ws' or u.hostname not in ('127.0.0.1','localhost'):
              raise SystemExit('unexpected devtools websocket')
          s = socket.create_connection((u.hostname, u.port or 80), timeout=5)
          key = base64.b64encode(os.urandom(16)).decode()
          path = u.path + (('?' + u.query) if u.query else '')
          request = (
              f'GET {path} HTTP/1.1\r\nHost: {u.hostname}:{u.port or 80}\r\n'
              'Upgrade: websocket\r\nConnection: Upgrade\r\n'
              f'Sec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n'
          ).encode()
          s.sendall(request)
          buf = b''
          while b'\r\n\r\n' not in buf:
              part = s.recv(4096)
              if not part:
                  break
              buf += part
          if b' 101 ' not in buf.split(b'\r\n',1)[0]:
              raise SystemExit('devtools websocket handshake failed')
          payload = json.dumps({'id':1,'method':'Page.reload','params':{'ignoreCache':True}}, separators=(',',':')).encode()
          mask = os.urandom(4)
          n = len(payload)
          if n < 126:
              header = bytes([0x81, 0x80 | n])
          elif n < 65536:
              header = bytes([0x81, 0x80 | 126]) + struct.pack('!H', n)
          else:
              header = bytes([0x81, 0x80 | 127]) + struct.pack('!Q', n)
          masked = bytes(b ^ mask[i % 4] for i, b in enumerate(payload))
          s.sendall(header + mask + masked)
          s.close()
          print('BROWSER_RELOAD_SENT=true')
          PY

          sleep 12

          youtube_id_after=$(sudo docker compose --env-file .env ps -q youtube)
          restarts_after=$(sudo docker inspect -f '{{.RestartCount}}' "$youtube_id_after")
          live_after=$(sudo docker compose --env-file .env exec -T youtube sh -lc 'cat /tmp/fgb-transport.state')
          test "$youtube_id_after" = "$youtube_id_before"
          test "$restarts_after" = "$restarts_before"
          test "$live_after" = live

          tabs=$(sudo docker compose --env-file .env exec -T youtube curl -fsS --max-time 5 http://127.0.0.1:9222/json)
          printf '%s' "$tabs" | python3 -c 'import json,sys; d=json.load(sys.stdin); t=next((x for x in d if x.get("type")=="page" and "/fgb-broadcast" in x.get("url","")),None); assert t; print("CHROMIUM_URL="+t.get("url","")); print("CHROMIUM_TITLE="+t.get("title",""))'

          for path in 'fgb-broadcast?target=youtube' 'api/public/fgbears/game-screen' 'api/public/fgbears/stream-routing'; do
            code=$(curl -sS -L --max-time 20 -o /tmp/check.body -w '%{http_code}' "https://epiccontentcreatorgrants.org/$path")
            test "$code" = 200
            if grep -Eqi 'Error 1102|Worker exceeded resource limits' /tmp/check.body; then
              echo "ERROR_1102_PRESENT=$path" >&2
              exit 1
            fi
            echo "HTTP_OK=$path"
          done
          rm -f /tmp/check.body

          echo "LIVE_STATE=$live_after"
          echo "LIVE_RESTARTS=$restarts_after"
          echo 'BROWSER_SOURCE_RELOADED=true'
          echo 'YOUTUBE_SESSION_PRESERVED=true'
          REMOTE
