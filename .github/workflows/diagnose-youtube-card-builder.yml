name: Diagnose YouTube Redirect Card Builder

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/diagnose-youtube-card-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Run builder directly and expose stderr
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'set -x; id; command -v python3; python3 --version; python3 -c "import qrcode,PIL; print(\"qrcode=OK PIL=OK\")"; ls -l /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; rm -f /tmp/fgb-card-diagnostic.png; python3 /opt/fgbears-live/tools/build-youtube-rumble-trivia-card.py /tmp/fgb-card-diagnostic.png; file /tmp/fgb-card-diagnostic.png; ls -lh /tmp/fgb-card-diagnostic.png; rm -f /tmp/fgb-card-diagnostic.png'
