name: Current Meta Live Auth Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-meta-live-auth-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Meta Live API credentials without exposing values
        env:
          A1: ${{ secrets.FGB_FACEBOOK_USER_ACCESS_TOKEN }}
          A2: ${{ secrets.FGB_FACEBOOK_PAGE_ACCESS_TOKEN }}
          A3: ${{ secrets.FGB_FACEBOOK_ACCESS_TOKEN }}
          A4: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          A5: ${{ secrets.FGB_META_PAGE_ACCESS_TOKEN }}
          A6: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          A7: ${{ secrets.META_ACCESS_TOKEN }}
          U1: ${{ secrets.FGB_FACEBOOK_USER_ID }}
          U2: ${{ secrets.FACEBOOK_USER_ID }}
          U3: ${{ secrets.FGB_META_USER_ID }}
          U4: ${{ secrets.META_USER_ID }}
          P1: ${{ secrets.FGB_FACEBOOK_PAGE_ID }}
          P2: ${{ secrets.FACEBOOK_PAGE_ID }}
          P3: ${{ secrets.FGB_META_PAGE_ID }}
          P4: ${{ secrets.META_PAGE_ID }}
        run: |
          set -Eeuo pipefail
          token=false; user=false; page=false
          for v in "$A1" "$A2" "$A3" "$A4" "$A5" "$A6" "$A7"; do [[ -n "$v" ]] && token=true; done
          for v in "$U1" "$U2" "$U3" "$U4"; do [[ -n "$v" ]] && user=true; done
          for v in "$P1" "$P2" "$P3" "$P4"; do [[ -n "$v" ]] && page=true; done
          mkdir -p .github/deployment-status
          jq -n --argjson token "$token" --argjson user "$user" --argjson page "$page" --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{metaAccessTokenPresent:$token,metaUserIdPresent:$user,metaPageIdPresent:$page,checkedAt:$checkedAt}' \
            > .github/deployment-status/current-meta-live-auth.json

      - name: Record redacted result
        run: |
          set -Eeuo pipefail
          git config user.name 'FGBears Deploy Bot'
          git config user.email 'actions@github.com'
          git add .github/deployment-status/current-meta-live-auth.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record current Meta Live auth presence [skip ci]'
          git pull --rebase origin main
          git push origin main
