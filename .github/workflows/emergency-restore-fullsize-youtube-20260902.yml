name: Emergency Restore Full-Size YouTube 20260902

on:
  push:
    branches: [lovable-routing-bridge-20260902]
    paths:
      - '.github/workflows/emergency-restore-fullsize-youtube-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Restore verified 1280x720 YouTube router
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service
          ROUTER=fgbears-youtube-router.service
          HEALTH=fgbears-live-health.service
          OVERRIDE=/etc/systemd/system/fgbears-live-health.service.d/99-youtube-fullsize-emergency.conf
          BASE=/opt/fgbears-live/bin/youtube-stream-router.py
          WRAPPER=/opt/fgbears-live/bin/youtube-stream-router-emergency.py
          CARD=/opt/fgbears-live/assets/youtube-rumble-trivia.h264
          UNIT=/etc/systemd/system/fgbears-youtube-router.service

          active() { systemctl is-active --quiet "$1"; }
          pid() { systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          router_ffmpeg() { local rp; rp=$(pid "$ROUTER"); pgrep -P "$rp" ffmpeg | head -n1 || true; }
          rtmps_connected() {
            local p="$1"
            sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" 'index($0,q) && $0 ~ /:443([[:space:]]|$)/ {found=1} END {exit(found?0:1)}'
          }

          active "$MASTER"
          active "$RUMBLE"
          active "$COMP"
          master0=$(pid "$MASTER")
          rumble0=$(pid "$RUMBLE")
          comp0=$(pid "$COMP")
          route0=$(pid "$ROUTING")
          [[ "$master0" =~ ^[1-9][0-9]*$ && "$rumble0" =~ ^[1-9][0-9]*$ && "$comp0" =~ ^[1-9][0-9]*$ ]]
          test -s "$BASE" && test -s "$WRAPPER" && test -s "$CARD" && test -s "$UNIT"
          sudo python3 -m py_compile "$WRAPPER"
          sudo -u fgbears python3 "$BASE" --card "$CARD" --validate-card

          echo "pre_master_pid=$master0 pre_rumble_pid=$rumble0 pre_compositor_pid=$comp0 routing_pid=$route0"

          success=0
          cutover=0
          rollback() {
            set +e
            echo 'ROLLBACK_TO_360_COMPOSITOR=START'
            sudo systemctl disable --now "$ROUTER" >/dev/null 2>&1 || true
            sudo rm -f "$OVERRIDE"
            sudo systemctl daemon-reload
            sudo systemctl reset-failed "$COMP" >/dev/null 2>&1 || true
            sudo systemctl enable "$COMP" >/dev/null 2>&1 || true
            sudo systemctl start "$COMP" || true
            for _ in $(seq 1 30); do active "$COMP" && break; sleep 1; done
            echo "rollback_compositor=$(systemctl is-active "$COMP" 2>/dev/null || true)"
            echo "rollback_master_pid=$(pid "$MASTER") rollback_rumble_pid=$(pid "$RUMBLE")"
          }
          finish() {
            rc=$?
            if (( cutover == 1 && success == 0 )); then rollback; fi
            exit "$rc"
          }
          trap finish EXIT

          for _ in $(seq 1 30); do ! active "$HEALTH" && break; sleep 1; done
          ! active "$HEALTH"

          cutover=1
          sudo install -d -m 0755 /etc/systemd/system/fgbears-live-health.service.d
          sudo tee "$OVERRIDE" >/dev/null <<'DROPIN'
          [Service]
          Environment=YOUTUBE_RELAY_SERVICE=fgbears-youtube-router.service
          DROPIN
          sudo systemctl daemon-reload

          sudo systemctl disable --now "$COMP" >/dev/null
          sudo systemctl reset-failed "$ROUTER" >/dev/null 2>&1 || true
          sudo systemctl start "$ROUTER"

          transport=0
          ff=0
          for second in $(seq 1 45); do
            active "$ROUTER" || { echo "router_inactive_after=${second}s"; exit 1; }
            [[ "$(pid "$MASTER")" == "$master0" ]] || { echo MASTER_PID_CHANGED; exit 1; }
            [[ "$(pid "$RUMBLE")" == "$rumble0" ]] || { echo RUMBLE_PID_CHANGED; exit 1; }
            ff=$(router_ffmpeg)
            if [[ "$ff" =~ ^[1-9][0-9]*$ ]] && rtmps_connected "$ff"; then
              transport=1
              echo "youtube_rtmps_established_after=${second}s router_ffmpeg_pid=$ff"
              break
            fi
            sleep 1
          done
          (( transport == 1 ))

          sleep 8
          active "$ROUTER"
          ! active "$COMP"
          [[ "$(pid "$MASTER")" == "$master0" ]]
          [[ "$(pid "$RUMBLE")" == "$rumble0" ]]
          ff=$(router_ffmpeg)
          [[ "$ff" =~ ^[1-9][0-9]*$ ]]
          rtmps_connected "$ff"
          cmd=$(tr '\0' ' ' <"/proc/$ff/cmdline")
          [[ "$cmd" != *'scale=640:360'* ]]

          sudo systemctl enable "$ROUTER" >/dev/null
          sudo systemctl disable "$COMP" >/dev/null 2>&1 || true
          success=1
          echo 'FULLSIZE_YOUTUBE_RESTORED=PASS'
          echo "master_pid_unchanged=$(pid "$MASTER")"
          echo "rumble_pid_unchanged=$(pid "$RUMBLE")"
          echo "router_pid=$(pid "$ROUTER") ffmpeg_pid=$ff"
          echo "compositor_state=$(systemctl is-active "$COMP" 2>/dev/null || true)"
          echo 'youtube_output_path=packet_preserving_1280x720_router'
          REMOTE
