name: Benchmark YouTube Dynamic Bands V1

on:
  push:
    paths:
      - '.github/workflows/benchmark-youtube-dynamic-bands-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-dynamic-bands-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Benchmark static card with live-style RSS and crawl motion
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          work=/tmp/fgb-dynamic-bands-benchmark
          pylib=/opt/fgbears-live/exact-card-pylib
          rm -rf "$work"; mkdir -p "$work"
          trap 'rm -rf "$work"' EXIT

          master_before=$(systemctl show -p MainPID --value fgbears-live.service)
          rumble_before=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          youtube_before=$(systemctl show -p MainPID --value fgbears-youtube-relay.service)
          [[ "$master_before" =~ ^[1-9][0-9]*$ && "$rumble_before" =~ ^[1-9][0-9]*$ && "$youtube_before" =~ ^[1-9][0-9]*$ ]]
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-rumble-relay.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          ! systemctl is-active --quiet fgbears-youtube-router.service

          # Capture a single safe program still; no live output is changed.
          nice -n 19 ionice -c3 timeout 12 ffmpeg -hide_banner -nostdin -loglevel error \
            -fflags +genpts -probesize 3000000 -analyzeduration 3000000 \
            -i 'udp://127.0.0.1:1939?reuse=1&fifo_size=1000000&overrun_nonfatal=1' \
            -map 0:v:0 -frames:v 1 -y "$work/frame.png"
          test -s "$work/frame.png"

          # Build the exact approved card and place it only in the production middle panel.
          PYTHONPATH="$pylib" /usr/bin/python3 /opt/fgbears-live/tools/build-youtube-rumble-trivia-card.py "$work/source.png" >/dev/null
          PYTHONPATH="$pylib" /usr/bin/python3 /opt/fgbears-live/tools/compose-exact-youtube-card.py \
            "$work/frame.png" "$work/source.png" "$work/base.png" >"$work/compose.json"
          grep -Fq '"x": 462' "$work/compose.json"
          grep -Fq '"y": 114' "$work/compose.json"
          test -s "$work/base.png"

          # Record 8 seconds of the existing RSS and crawl MJPEG producers in parallel.
          # These are read-only local HTTP consumers.
          nice -n 19 ionice -c3 timeout 15 ffmpeg -hide_banner -nostdin -loglevel error \
            -i http://127.0.0.1:8789/overlay.mjpg -t 8 -an -c:v copy -y "$work/news.mkv" & n=$!
          nice -n 19 ionice -c3 timeout 15 ffmpeg -hide_banner -nostdin -loglevel error \
            -i http://127.0.0.1:8788/overlay.mjpg -t 8 -an -c:v copy -y "$work/crawl.mkv" & c=$!
          wait "$n"; wait "$c"
          test -s "$work/news.mkv"; test -s "$work/crawl.mkv"

          news_probe=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of csv=p=0 "$work/news.mkv")
          crawl_probe=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of csv=p=0 "$work/crawl.mkv")
          echo "NEWS_PROBE=$news_probe"
          echo "CRAWL_PROBE=$crawl_probe"

          # Offline encode as fast as this host can manage. Because the base is static,
          # only the RSS band and crawl band move. Audio would remain continuous in the
          # existing packet router and is intentionally excluded from this capacity test.
          start=$(date +%s%N)
          nice -n 19 ionice -c3 ffmpeg -hide_banner -nostdin -loglevel warning \
            -loop 1 -framerate 30 -i "$work/base.png" \
            -i "$work/news.mkv" -i "$work/crawl.mkv" \
            -filter_complex '[0:v:0][1:v:0]overlay=0:0:shortest=1[n];[n][2:v:0]overlay=0:574:shortest=1[v]' \
            -map '[v]' -t 8 -an \
            -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -level:v 3.1 \
            -pix_fmt yuv420p -r 30 -g 60 -keyint_min 60 -sc_threshold 0 -threads 1 \
            -b:v 5000k -maxrate 5500k -bufsize 10000k \
            -f null - 2>"$work/encode.log"
          end=$(date +%s%N)
          elapsed_ms=$(( (end-start)/1000000 ))

          python3 - "$elapsed_ms" <<'PY'
          import sys
          elapsed=float(sys.argv[1])
          duration=8000.0
          ratio=duration/elapsed if elapsed else 0.0
          print(f'ENCODE_WALL_MS={elapsed:.0f}')
          print(f'DYNAMIC_BANDS_REALTIME_MULTIPLIER={ratio:.3f}x')
          if ratio < 1.20:
              print('DYNAMIC_BANDS_CAPACITY=INSUFFICIENT')
              raise SystemExit(20)
          print('DYNAMIC_BANDS_CAPACITY=PASS')
          PY

          master_after=$(systemctl show -p MainPID --value fgbears-live.service)
          rumble_after=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          youtube_after=$(systemctl show -p MainPID --value fgbears-youtube-relay.service)
          test "$master_after" = "$master_before"
          test "$rumble_after" = "$rumble_before"
          test "$youtube_after" = "$youtube_before"
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-rumble-relay.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          echo "MASTER_PID_UNCHANGED=$master_after"
          echo "RUMBLE_PID_UNCHANGED=$rumble_after"
          echo "YOUTUBE_PID_UNCHANGED=$youtube_after"
          echo 'BENCHMARK_DID_NOT_PUBLISH=yes'
          REMOTE
