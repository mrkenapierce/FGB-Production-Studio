name: Activate Untouched FGB Audio Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-untouched-fgb-audio-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-live-production-deploy
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Activate untouched originals with audio bitstream copy
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ubuntu
        run: |
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=5 -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SRC=/home/ubuntu/fgbears-upload
          TEST=/srv/fgbears-live/original-test
          PLAYLIST=/srv/fgbears-live/playlist.ffconcat
          TMP=/tmp/fgbears-original-test.ffconcat
          AUDIO_HEALTH=/usr/local/bin/fgbears-audio-health
          AUDIO_HEALTH_OPT=/opt/fgbears-live/bin/audio-health.py

          if pgrep -af 'normalize-resilient|normalize-library|\.audio-migration|loudnorm=I=-14' >/dev/null; then
            echo 'Offline normalization is running; refusing source-quality test.' >&2
            exit 75
          fi

          sudo install -d -o fgbears -g fgbears -m 0755 "$TEST"
          for n in $(seq -w 1 13); do
            f="$SRC/FGBears-Episode-${n}.mp4"
            test -s "$f"
            sig=$(ffprobe -v error -show_entries stream=index,codec_name,width,height,r_frame_rate,pix_fmt,sample_rate,channels -of compact=p=0:nk=1 "$f" | tr '\n' ';')
            echo "EP${n} $sig"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -of csv=p=0 "$f" | grep -Fx 'h264,1280,720,yuv420p,30/1' >/dev/null || {
              # Some ffprobe builds order r_frame_rate before pix_fmt in CSV. Use JSON invariant below instead.
              json=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -of json "$f")
              printf '%s' "$json" | jq -e '.streams[0].codec_name=="h264" and .streams[0].width==1280 and .streams[0].height==720 and .streams[0].r_frame_rate=="30/1" and .streams[0].pix_fmt=="yuv420p"' >/dev/null
            }
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of json "$f" | jq -e '.streams[0].codec_name=="aac" and .streams[0].sample_rate=="44100" and .streams[0].channels==2' >/dev/null
            sudo cp -f "$f" "$TEST/FGBears-Episode-${n}.mp4"
            sudo chown fgbears:fgbears "$TEST/FGBears-Episode-${n}.mp4"
            sudo chmod 0644 "$TEST/FGBears-Episode-${n}.mp4"
          done

          # Exact transport monitoring must accept both source-native 44.1 kHz AAC
          # and normalized 48 kHz AAC. Decoded signal analysis still occurs at 48 kHz.
          patch_health() {
            local path=$1
            [[ -f "$path" ]] || return 0
            sudo python3 - "$path" <<'PY'
from pathlib import Path
import sys
p=Path(sys.argv[1])
s=p.read_text()
old='if str(stream.get("sample_rate")) != "48000":\n            format_warnings.append("AUDIO_SAMPLE_RATE_NOT_48KHZ")'
new='if str(stream.get("sample_rate")) not in {"44100", "48000"}:\n            format_warnings.append("AUDIO_SAMPLE_RATE_NOT_44_1_OR_48KHZ")'
if old in s:
    s=s.replace(old,new)
elif 'not in {"44100", "48000"}' not in s:
    raise SystemExit('audio-health sample-rate guard not found')
p.write_text(s)
PY
            sudo chmod 0755 "$path"
          }
          patch_health "$AUDIO_HEALTH"
          patch_health "$AUDIO_HEALTH_OPT"

          rm -f "$TMP"
          {
            echo 'ffconcat version 1.0'
            for n in $(seq -w 1 13); do
              printf "file '%s'\n" "$TEST/FGBears-Episode-${n}.mp4"
            done
          } > "$TMP"
          sudo chown fgbears:fgbears "$TMP"
          sudo chmod 0644 "$TMP"
          sudo cp -f "$PLAYLIST" "${PLAYLIST}.before-original-test"
          sudo mv -f "$TMP" "$PLAYLIST"
          [[ $(grep -c '^file ' "$PLAYLIST") -eq 13 ]]
          grep -q '/original-test/FGBears-Episode-01.mp4' "$PLAYLIST"
          grep -q '/original-test/FGBears-Episode-13.mp4' "$PLAYLIST"

          grep -q -- '-c:a copy' /usr/local/bin/fgbears-start-stream
          ! grep -q -- '-c:a aac' /usr/local/bin/fgbears-start-stream

          sudo systemctl restart fgbears-live.service
          for _ in $(seq 1 45); do
            if systemctl is-active --quiet fgbears-live.service && systemctl is-active --quiet fgbears-youtube-relay.service; then
              sleep 3
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          pgrep -af ffmpeg | grep -F -- '-c:a copy' >/dev/null

          echo '=== EXACT OUTGOING UNTOUCHED AUDIO ==='
          sudo /usr/local/bin/fgbears-audio-health --capture-seconds 20

          echo '=== STREAM CADENCE ==='
          progress=/srv/fgbears-live/logs/ffmpeg-progress.log
          first_media=$(sudo sed -n 's/^out_time_us=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          first_frame=$(sudo sed -n 's/^frame=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          first_epoch=$(date +%s%N)
          sleep 10
          second_media=$(sudo sed -n 's/^out_time_us=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          second_frame=$(sudo sed -n 's/^frame=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          dropped=$(sudo sed -n 's/^drop_frames=\([0-9]*\)$/\1/p' "$progress" | tail -n1)
          second_epoch=$(date +%s%N)
          awk -v m1="$first_media" -v m2="$second_media" -v f1="$first_frame" -v f2="$second_frame" -v e1="$first_epoch" -v e2="$second_epoch" -v dropped="${dropped:-0}" 'BEGIN {wall=(e2-e1)/1000000000;program=(m2-m1)/1000000;ratio=program/wall;fps=(f2-f1)/wall;printf "program=%.3fs wall=%.3fs ratio=%.3fx fps=%.2f dropped=%d\n",program,wall,ratio,fps,dropped;if(ratio<0.95||fps<28.5||dropped!=0)exit 1}'

          echo 'UNTOUCHED_AUDIO_LIVE_TEST=SUCCESS'
          REMOTE
