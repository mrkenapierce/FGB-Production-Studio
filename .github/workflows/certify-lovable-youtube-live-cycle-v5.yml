name: Certify Lovable YouTube Live Cycle V5

on:
  push:
    paths:
      - '.github/workflows/certify-lovable-youtube-live-cycle-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Final read-only live-cycle certification
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROUTING_URL='https://epiccontentcreatorgrants.org/api/public/fgbears/stream-routing'
          HEALTH_URL='http://127.0.0.1:8791/healthz'
          OVERLAY_URL='http://127.0.0.1:8791/overlay.rgba'
          MONITOR_DIR='/run/fgbears-youtube-lovable-compositor'
          PROBE="/tmp/fgb-lovable-certify-v5-$$.ts"
          trap 'sudo rm -f "$PROBE"' EXIT

          state() { systemctl is-active "$1" 2>/dev/null || true; }
          pid() { systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          restarts() { systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          unit_ffmpeg() {
            local cg p c
            cg=$(systemctl show -p ControlGroup --value "$1" 2>/dev/null || true)
            [[ -n "$cg" ]] || return 1
            for p in $(cat "/sys/fs/cgroup${cg}/cgroup.procs" 2>/dev/null || true); do
              c=$(cat "/proc/$p/comm" 2>/dev/null || true)
              [[ "$c" == ffmpeg ]] && { echo "$p"; return 0; }
            done
            return 1
          }
          rtmps_connected() {
            sudo ss -ntpH state established 2>/dev/null | awk -v p="pid=$1" 'index($0,p) && $0 ~ /:443([[:space:]]|$)/ {found=1} END {exit(found?0:1)}'
          }
          snapshot_question_segment() {
            local since="$1" src mtime
            for _ in $(seq 1 10); do
              src=$(sudo find "$MONITOR_DIR" -maxdepth 1 -type f -name 'monitor-*.ts' -size +50k -printf '%T@ %p\n' 2>/dev/null | sort -nr | awk 'NR==2{sub(/^[^ ]+ /,""); print; exit}')
              if [[ -n "$src" ]]; then
                mtime=$(sudo stat -c %Y "$src")
                if (( mtime >= since - 1 )); then
                  sudo cp -f "$src" "$PROBE"
                  sudo chmod 0644 "$PROBE"
                  echo "segment_source=$src segment_mtime=$mtime probe_bytes=$(stat -c %s "$PROBE")"
                  return 0
                fi
              fi
              sleep 1
            done
            return 1
          }

          master0=$(pid fgbears-live.service)
          rumble0=$(pid fgbears-rumble-relay.service)
          comp0=$(pid fgbears-youtube-lovable-compositor.service)
          route0=$(pid fgbears-youtube-lovable-routing.service)
          ff0=$(unit_ffmpeg fgbears-youtube-lovable-compositor.service || true)
          cr0=$(restarts fgbears-youtube-lovable-compositor.service)
          rr0=$(restarts fgbears-youtube-lovable-routing.service)
          [[ "$(state fgbears-live.service)" == active && "$(state fgbears-rumble-relay.service)" == active && "$(state fgbears-youtube-lovable-compositor.service)" == active && "$(state fgbears-youtube-lovable-routing.service)" == active ]]
          [[ "$master0" =~ ^[1-9][0-9]*$ && "$rumble0" =~ ^[1-9][0-9]*$ && "$comp0" =~ ^[1-9][0-9]*$ && "$route0" =~ ^[1-9][0-9]*$ && "$ff0" =~ ^[1-9][0-9]*$ ]]
          echo "master_pid=$master0 rumble_pid=$rumble0 compositor_pid=$comp0 ffmpeg_pid=$ff0 routing_pid=$route0"
          rtmps_connected "$ff0"
          echo 'YOUTUBE_RTMPS=PASS'

          cmd=$(tr '\0' ' ' <"/proc/$ff0/cmdline")
          grep -Fq 'scale=640:360:flags=fast_bilinear' <<<"$cmd"
          grep -Fq 'overlay=231:52:format=auto:shortest=1' <<<"$cmd"
          grep -Fq 'aresample=44100:async=1:first_pts=0' <<<"$cmd"
          echo 'RUNNING_PIPELINE=PASS'

          health=$(curl -fsS --max-time 3 "$HEALTH_URL")
          printf '%s\n' "$health" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True,p; assert p.get("canvas")==[640,360],p; assert p.get("routingAuthority")=="lovable_public_stream_routing",p; assert p.get("creativeKey")=="yt_rumble_trivia_redirect",p; assert p.get("presentationMode")=="full_creative_scaled",p; assert p.get("sourceMaskRegion")=={"x":462,"y":104,"width":798,"height":470},p; assert p.get("maskRegion")=={"x":231,"y":52,"width":399,"height":235},p; assert p.get("lastError") in (None,""),p; print("LOVABLE_CONTRACT=PASS")'

          echo 'waiting_for_question=yes'
          deadline=$((SECONDS+1200)); seen=0
          while (( SECONDS < deadline )); do
            health=$(curl -fsS --max-time 3 "$HEALTH_URL" 2>/dev/null || true)
            if [[ -n "$health" ]] && printf '%s' "$health" | python3 -c 'import json,sys; p=json.load(sys.stdin); raise SystemExit(0 if p.get("active") is True and p.get("phase")=="question" and not p.get("lastError") else 1)' 2>/dev/null; then seen=1; break; fi
            sleep 1
          done
          [[ "$seen" == 1 ]]
          q0=$(date +%s)
          echo 'QUESTION_ACTIVE=PASS'

          remote=$(curl -fsS --max-time 6 -H 'Accept: application/json' -H 'Cache-Control: no-cache' -A 'FGB-Live-Cycle-Certifier/5.1' "${ROUTING_URL}?_ts=$(date +%s%N)")
          printf '%s\n' "$remote" | python3 -c 'import json,sys; t=(json.load(sys.stdin).get("trivia") or {}); assert t.get("youtubeMaskActive") is True,t; assert t.get("phase")=="question",t; assert t.get("stale") is not True,t; assert t.get("adsVisible") is not True,t; assert t.get("isAdBreak") is not True and t.get("adBreakActive") is not True,t; assert t.get("youtubeCreativeKey")=="yt_rumble_trivia_redirect",t; r=t.get("maskRegion") or {}; assert {k:r.get(k) for k in ("x","y","width","height")}=={"x":462,"y":104,"width":798,"height":470},r; print("AUTHORITATIVE_QUESTION_STATE=PASS")'
          python3 -c 'import json,urllib.request; h=json.load(urllib.request.urlopen("http://127.0.0.1:8791/healthz",timeout=3)); w,n=h["frameSize"]; need=w*n*4; r=urllib.request.urlopen("http://127.0.0.1:8791/overlay.rgba",timeout=4); d=r.read(need); r.close(); assert len(d)==need; ratio=sum(1 for a in d[3::4] if a)/(w*n); assert ratio>.95,ratio; print("ACTIVE_OVERLAY=PASS alpha_ratio=%.4f"%ratio)'

          sleep 5
          health=$(curl -fsS --max-time 3 "$HEALTH_URL")
          printf '%s\n' "$health" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p.get("active") is True and p.get("phase")=="question",p; print("QUESTION_STILL_ACTIVE=PASS")'
          snapshot_question_segment "$q0"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json "$PROBE" | python3 -c 'import json,sys; p=json.load(sys.stdin); s=p.get("streams",[]); v=next((x for x in s if x.get("codec_type")=="video"),None); a=next((x for x in s if x.get("codec_type")=="audio"),None); assert v and v.get("codec_name")=="h264" and v.get("width")==640 and v.get("height")==360 and v.get("r_frame_rate") in ("30/1","60/2"),v; assert a and a.get("codec_name")=="aac" and a.get("sample_rate")=="44100" and a.get("channels")==2,a; print("ENCODED_CONTRACT=PASS")'
          news=$(ffmpeg -nostdin -hide_banner -loglevel error -i "$PROBE" -map 0:v:0 -vf 'crop=640:52:0:0' -an -f framemd5 - | awk '!/^#/ {print $NF}' | sort -u | wc -l)
          crawl=$(ffmpeg -nostdin -hide_banner -loglevel error -i "$PROBE" -map 0:v:0 -vf 'crop=640:73:0:287' -an -f framemd5 - | awk '!/^#/ {print $NF}' | sort -u | wc -l)
          echo "rss_unique_frames=$news crawl_unique_frames=$crawl"
          (( news >= 2 && crawl >= 2 ))
          echo 'RSS_AND_CRAWL_MOTION=PASS'
          rtmps_connected "$ff0"
          echo 'YOUTUBE_RTMPS_DURING_QUESTION=PASS'

          echo 'waiting_for_clear=yes'
          deadline=$((SECONDS+90)); cleared=0
          while (( SECONDS < deadline )); do
            health=$(curl -fsS --max-time 3 "$HEALTH_URL" 2>/dev/null || true)
            if [[ -n "$health" ]] && printf '%s' "$health" | python3 -c 'import json,sys; p=json.load(sys.stdin); raise SystemExit(0 if p.get("active") is False else 1)' 2>/dev/null; then cleared=1; break; fi
            sleep 1
          done
          [[ "$cleared" == 1 ]]
          python3 -c 'import json,urllib.request; h=json.load(urllib.request.urlopen("http://127.0.0.1:8791/healthz",timeout=3)); w,n=h["frameSize"]; need=w*n*4; r=urllib.request.urlopen("http://127.0.0.1:8791/overlay.rgba",timeout=4); d=r.read(need); r.close(); assert len(d)==need; assert not any(d[3::4]); print("OVERLAY_CLEAR=PASS")'

          master1=$(pid fgbears-live.service); rumble1=$(pid fgbears-rumble-relay.service); comp1=$(pid fgbears-youtube-lovable-compositor.service); route1=$(pid fgbears-youtube-lovable-routing.service); ff1=$(unit_ffmpeg fgbears-youtube-lovable-compositor.service || true); cr1=$(restarts fgbears-youtube-lovable-compositor.service); rr1=$(restarts fgbears-youtube-lovable-routing.service)
          [[ "$master1" == "$master0" && "$rumble1" == "$rumble0" && "$comp1" == "$comp0" && "$route1" == "$route0" && "$ff1" == "$ff0" && "$cr1" == "$cr0" && "$rr1" == "$rr0" ]]
          rtmps_connected "$ff1"
          echo "master_pid_unchanged=$master1"
          echo "rumble_pid_unchanged=$rumble1"
          echo "compositor_pid_unchanged=$comp1 ffmpeg_pid=$ff1 restarts=$cr1"
          echo "routing_pid_unchanged=$route1 restarts=$rr1"
          echo 'LOVABLE_YOUTUBE_LIVE_CYCLE=PASS'
          REMOTE
