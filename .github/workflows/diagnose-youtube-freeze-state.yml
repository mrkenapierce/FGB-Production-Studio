name: Diagnose YouTube Freeze State
# rerun marker: inspect-production-router-api-20260902

on:
  push:
    paths:
      - '.github/workflows/diagnose-youtube-freeze-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Inspect deployed router API and health only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          base=/opt/fgbears-live/bin/youtube-stream-router-emergency.py
          echo '=== ROUTER HASH ==='
          sha256sum "$base"
          echo '=== TOP LEVEL CLASSES/FUNCTIONS ==='
          grep -nE '^(class|def) ' "$base" || true
          echo '=== METHOD NAMES ==='
          grep -nE '^    def ' "$base" || true
          echo '=== CARD-RELATED SYMBOLS ==='
          grep -nE 'card_(aus|idr|index)|card_path|request_mode|schedule_poll|poll|reload' "$base" | head -120 || true
          echo '=== CURRENT HEALTH ==='
          router_pid=$(systemctl show -p MainPID --value fgbears-youtube-router.service)
          child=$(pgrep -P "$router_pid" ffmpeg | head -n1 || true)
          echo "router_pid=$router_pid ffmpeg_child=${child:-none}"
          echo "master_pid=$(systemctl show -p MainPID --value fgbears-live.service)"
          echo "rumble_pid=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)"
          if [[ "$child" =~ ^[1-9][0-9]*$ ]] && sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$child" | grep -Eq ':443([[:space:]]|$)'; then
            echo 'youtube_rtmps_established=yes'
          else
            echo 'youtube_rtmps_established=no'
          fi
          REMOTE
