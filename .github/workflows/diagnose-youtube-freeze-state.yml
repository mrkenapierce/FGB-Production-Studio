name: Diagnose YouTube Freeze State
# rerun marker: corrected-wrapper-runtime-20260902

on:
  push:
    paths:
      - '.github/workflows/diagnose-youtube-freeze-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Read corrected freeze-box runtime failure and current health
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== ROUTER JOURNAL SINCE 08:19 UTC ==='
          sudo journalctl -u fgbears-youtube-router.service --since '2026-09-02 08:19:40 UTC' --no-pager || true
          echo '=== CURRENT ROUTER UNIT ==='
          sudo systemctl cat fgbears-youtube-router.service || true
          echo '=== CURRENT HEALTH ==='
          for s in fgbears-live.service fgbears-rumble-relay.service fgbears-youtube-router.service fgbears-youtube-freeze-card-refresh.timer; do
            echo "$s active=$(systemctl is-active "$s" 2>/dev/null || true) enabled=$(systemctl is-enabled "$s" 2>/dev/null || true) pid=$(systemctl show -p MainPID --value "$s" 2>/dev/null || true)"
          done
          router_pid=$(systemctl show -p MainPID --value fgbears-youtube-router.service 2>/dev/null || echo 0)
          child=$(pgrep -P "$router_pid" ffmpeg | head -n1 || true)
          if [[ "$child" =~ ^[1-9][0-9]*$ ]] && sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$child" | grep -Eq ':443([[:space:]]|$)'; then
            echo 'youtube_rtmps_established=yes'
          else
            echo 'youtube_rtmps_established=no'
          fi
          echo '=== FREEZE STATUS ==='
          sudo cat /var/lib/fgbears-live/youtube-freeze-card.status 2>/dev/null || true
          sudo ls -lah /var/lib/fgbears-live/youtube-freeze-card.h264 2>/dev/null || true
          REMOTE
