name: Diagnose YouTube Freeze State
# rerun marker: router-rollback-20260902

on:
  push:
    paths:
      - '.github/workflows/diagnose-youtube-freeze-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Read router rollback diagnostics only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== CURRENT ROUTER UNIT ==='
          sudo systemctl cat fgbears-youtube-router.service || true
          echo '=== ROUTER JOURNAL LAST 15 MIN ==='
          sudo journalctl -u fgbears-youtube-router.service --since '-15 minutes' --no-pager || true
          echo '=== ROUTER STATUS ==='
          sudo systemctl status fgbears-youtube-router.service --no-pager || true
          router_pid=$(systemctl show -p MainPID --value fgbears-youtube-router.service 2>/dev/null || echo 0)
          child=$(pgrep -P "$router_pid" ffmpeg | head -n1 || true)
          echo "router_pid=$router_pid ffmpeg_child=${child:-none}"
          if [[ "$child" =~ ^[1-9][0-9]*$ ]] && sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$child" | grep -Eq ':443([[:space:]]|$)'; then
            echo 'current_youtube_rtmps_established=yes'
          else
            echo 'current_youtube_rtmps_established=no'
          fi
          echo '=== FREEZE BOX FILES ==='
          sudo ls -lah /opt/fgbears-live/bin/youtube-stream-router-freezebox.py /usr/local/bin/fgbears-youtube-freeze-card-refresh /var/lib/fgbears-live/youtube-freeze-card.h264 2>/dev/null || true
          echo '=== REFRESH STATUS ==='
          sudo systemctl status fgbears-youtube-freeze-card-refresh.service --no-pager || true
          sudo cat /var/lib/fgbears-live/youtube-freeze-card.status 2>/dev/null || true
          echo '=== SERVICES ==='
          for s in fgbears-live.service fgbears-rumble-relay.service fgbears-youtube-router.service; do
            echo "$s active=$(systemctl is-active "$s" 2>/dev/null || true) enabled=$(systemctl is-enabled "$s" 2>/dev/null || true) pid=$(systemctl show -p MainPID --value "$s" 2>/dev/null || true)"
          done
          REMOTE
