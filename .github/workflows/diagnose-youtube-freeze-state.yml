name: Diagnose YouTube Freeze State
# rerun marker: locate-production-router-base-20260902

on:
  push:
    paths:
      - '.github/workflows/diagnose-youtube-freeze-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Locate delegated router implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          f=/opt/fgbears-live/bin/youtube-stream-router-emergency.py
          echo '=== DELEGATION SYMBOLS ==='
          grep -nE 'import|runpy|spec_from|module_from|SourceFile|youtube-stream-router|base|Router|main\(' "$f" | head -160 || true
          echo '=== ROUTER FILES ==='
          ls -lah /opt/fgbears-live/bin/*youtube*router*.py 2>/dev/null || true
          for candidate in /opt/fgbears-live/bin/*youtube*router*.py; do
            [[ -f "$candidate" ]] || continue
            echo "--- $candidate ---"
            sha256sum "$candidate"
            grep -nE '^(class|def) ' "$candidate" | head -80 || true
          done
          echo '=== HEALTH ==='
          echo "master_pid=$(systemctl show -p MainPID --value fgbears-live.service)"
          echo "rumble_pid=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)"
          echo "router_pid=$(systemctl show -p MainPID --value fgbears-youtube-router.service)"
          REMOTE
