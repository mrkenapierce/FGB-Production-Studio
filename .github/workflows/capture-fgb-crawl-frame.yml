name: Capture FGB Crawl Frame

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-fgb-crawl-frame.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

# Fidelity capture after RSS/crawl pacing alignment; used to isolate renderer vs encoder pixelation.
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Capture current crawl renderer frame and state
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'curl -fsS http://127.0.0.1:8788/frame.png' > crawl-frame.png
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'curl -fsS http://127.0.0.1:8788/frame.jpg' > crawl-frame.jpg
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'curl -fsS http://127.0.0.1:8788/healthz' > crawl-health.json
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'printf "LABEL="; sudo cat /srv/fgbears-live/runtime/crawl-label.txt; printf "MESSAGE="; sudo cat /srv/fgbears-live/runtime/crawl-message.txt; printf "NEWS="; sudo cat /srv/fgbears-live/runtime/bears-news-message.txt; printf "RSS_PPS="; sudo sed -n "s/^BEARS_NEWS_SCROLL_PPS=//p" /etc/fgbears-live/stream.env' > crawl-state.txt
          file crawl-frame.png crawl-frame.jpg
          cat crawl-health.json
          cat crawl-state.txt
      - name: Upload crawl diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: fgb-crawl-frame
          path: |
            crawl-frame.png
            crawl-frame.jpg
            crawl-health.json
            crawl-state.txt
          retention-days: 1
