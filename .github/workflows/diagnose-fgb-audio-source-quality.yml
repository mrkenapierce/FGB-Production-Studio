name: Diagnose FGB Stored Audio Source Quality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-fgb-audio-source-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Compare untouched originals with normalized production copies
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ubuntu
        run: |
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=5 -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== ORIGINAL VS NORMALIZED 01-13 ==='
          for n in $(seq -w 1 13); do
            orig="/home/ubuntu/fgbears-upload/FGBears-Episode-${n}.mp4"
            norm="/srv/fgbears-live/media/FGBears-Episode-${n}.mp4"
            echo "EP${n}"
            printf ' ORIGINAL '
            ffprobe -v error \
              -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,pix_fmt,sample_rate,channels,channel_layout,bit_rate \
              -of compact=p=0:nk=0 "$orig" | tr '\n' ' '; printf '\n'
            printf ' NORMALZD '
            ffprobe -v error \
              -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,pix_fmt,sample_rate,channels,channel_layout,bit_rate \
              -of compact=p=0:nk=0 "$norm" | tr '\n' ' '; printf '\n'
            printf ' SHA_EQUAL='
            if [[ $(sha256sum "$orig" | awk '{print $1}') == $(sha256sum "$norm" | awk '{print $1}') ]]; then echo YES; else echo NO; fi
          done

          echo '=== ACTIVE AUDIO MODE ==='
          pgrep -af ffmpeg | grep -F -- '-c:a copy' | sed -E 's#(rtmps?://)[^ ]+#\1[REDACTED]#g' || true
          REMOTE
