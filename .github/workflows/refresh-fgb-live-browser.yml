name: Refresh FGB Live Browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-fgb-live-browser.yml
      - ops/transport-ovh/refresh-browser.sh

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure production SSH
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null

      - name: Find production SSH user
        run: |
          set -euo pipefail
          REMOTE_USER=''
          for candidate in ubuntu admin debian root; do
            probe=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=5 -i ~/.ssh/ovh_key \
              "$candidate@40.160.144.185" 'printf __FGB_SSH_OK__' 2>/dev/null || true)
            if [ "$probe" = '__FGB_SSH_OK__' ]; then
              REMOTE_USER="$candidate"
              break
            fi
          done
          test -n "$REMOTE_USER"
          echo "REMOTE_USER=$REMOTE_USER" >> "$GITHUB_ENV"
          echo "Using OVH SSH user: $REMOTE_USER"

      - name: Refresh only the Chromium page, not FFmpeg or Docker
        run: |
          set -euo pipefail
          payload=$(base64 -w0 ops/transport-ovh/refresh-browser.sh)
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=8 -i ~/.ssh/ovh_key \
            "$REMOTE_USER@40.160.144.185" \
            "printf '%s' '$payload' | base64 -d > /tmp/refresh-fgb-browser.sh && chmod 700 /tmp/refresh-fgb-browser.sh && bash /tmp/refresh-fgb-browser.sh"
