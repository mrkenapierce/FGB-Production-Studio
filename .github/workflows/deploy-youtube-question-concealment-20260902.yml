name: Deploy YouTube Full-Question Concealment 20260902

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/deploy-youtube-question-concealment-20260902.yml'

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-concealment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH and stage YouTube mask files
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/oracle_key \
            services/fgbears-live/bin/youtube-question-mask.py \
            "${ORACLE_USER:-ubuntu}@$ORACLE_HOST:/tmp/youtube-question-mask.py.deploy"
          scp -i ~/.ssh/oracle_key \
            services/fgbears-live/systemd/fgbears-youtube-lovable-routing.service \
            "${ORACLE_USER:-ubuntu}@$ORACLE_HOST:/tmp/fgbears-youtube-lovable-routing.service.deploy"

      - name: Deploy routing renderer only and certify isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          ROUTING=fgbears-youtube-lovable-routing.service
          COMP=fgbears-youtube-lovable-compositor.service
          LEGACY=fgbears-youtube-relay.service
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          has_port(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }

          for unit in "$MASTER" "$RUMBLE" "$ROUTING" "$COMP"; do systemctl is-active --quiet "$unit"; done
          ! systemctl is-active --quiet "$LEGACY"
          M0=$(pid "$MASTER"); R0=$(pid "$RUMBLE"); C0=$(pid "$COMP")
          [[ "$M0" =~ ^[1-9][0-9]*$ && "$R0" =~ ^[1-9][0-9]*$ && "$C0" =~ ^[1-9][0-9]*$ ]]
          has_port "$R0" 1935
          has_port "$C0" 443
          for port in 8787 8788 8789; do curl -fsS --max-time 2 "http://127.0.0.1:${port}/healthz" >/dev/null; done

          python3 -m py_compile /tmp/youtube-question-mask.py.deploy
          grep -Fq 'elif self.active and phase == "question"' /tmp/youtube-question-mask.py.deploy
          grep -Fq 'if ads_visible or ad_break or phase != "question"' /tmp/youtube-question-mask.py.deploy
          grep -Fq 'youtube.get("rendersRealQuestion") is not False' /tmp/youtube-question-mask.py.deploy

          cp -a /opt/fgbears-live/bin/youtube-question-mask.py /opt/fgbears-live/bin/youtube-question-mask.py.pre-question-latch
          install -m 0755 /tmp/youtube-question-mask.py.deploy /opt/fgbears-live/bin/youtube-question-mask.py
          install -m 0644 /tmp/fgbears-youtube-lovable-routing.service.deploy /etc/systemd/system/fgbears-youtube-lovable-routing.service
          systemctl daemon-reload
          systemctl reset-failed "$ROUTING" >/dev/null 2>&1 || true
          systemctl restart "$ROUTING"

          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 1 http://127.0.0.1:8791/healthz >/tmp/youtube-mask-health.json 2>/dev/null; then healthy=1; break; fi
            sleep 1
          done
          (( healthy == 1 ))
          jq -e '.ok == true and .sourceCanvas == [1280,720] and .canvas == [640,360] and .sourceMaskRegion == {"x":462,"y":104,"width":798,"height":470} and .maskRegion == {"x":231,"y":52,"width":399,"height":235} and .creativeKey == "yt_rumble_trivia_redirect"' /tmp/youtube-mask-health.json >/dev/null

          # If deployment lands during a live question, certify the production
          # cover immediately. Outside a question, certify the latch code and
          # report current phase without inventing a live-question observation.
          phase=$(jq -r '.phase // "none"' /tmp/youtube-mask-health.json)
          active=$(jq -r '.active' /tmp/youtube-mask-health.json)
          if [[ "$phase" == question ]]; then
            [[ "$active" == true ]]
            echo 'LIVE_QUESTION_CONCEALMENT=PASS active=true'
          else
            echo "LIVE_QUESTION_CONCEALMENT=NOT_CURRENTLY_OBSERVABLE phase=$phase active=$active"
          fi

          # Sustained transport/isolation check. Routing is the only intended PID change.
          for _ in $(seq 1 12); do
            systemctl is-active --quiet "$MASTER"
            systemctl is-active --quiet "$RUMBLE"
            systemctl is-active --quiet "$ROUTING"
            systemctl is-active --quiet "$COMP"
            ! systemctl is-active --quiet "$LEGACY"
            test "$(pid "$MASTER")" = "$M0"
            test "$(pid "$RUMBLE")" = "$R0"
            test "$(pid "$COMP")" = "$C0"
            has_port "$R0" 1935
            has_port "$C0" 443
            curl -fsS --max-time 2 http://127.0.0.1:8791/healthz >/tmp/youtube-mask-health.json
            qphase=$(jq -r '.phase // "none"' /tmp/youtube-mask-health.json)
            qactive=$(jq -r '.active' /tmp/youtube-mask-health.json)
            if [[ "$qphase" == question && "$qactive" != true ]]; then
              echo "QUESTION_LATCH_FAILURE phase=$qphase active=$qactive" >&2
              exit 1
            fi
            sleep 5
          done

          progress=/srv/fgbears-live/logs/ffmpeg-progress.log
          speed=$(awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' "$progress")
          dropped=$(awk -F= '$1=="drop_frames"{v=$2} END{if(v!="") print v+0}' "$progress")
          python3 - "$speed" "${dropped:-0}" <<'PY'
          import sys
          speed=float(sys.argv[1]); dropped=int(float(sys.argv[2]))
          assert speed >= 0.95, speed
          assert dropped == 0, dropped
          print(f'STREAM_STRENGTH=PASS speed={speed:.3f}x dropped={dropped}')
          PY
          echo "YOUTUBE_CONCEALMENT_DEPLOY=PASS master=$M0 rumble=$R0 compositor=$C0 routing=$(pid "$ROUTING")"
          REMOTE
