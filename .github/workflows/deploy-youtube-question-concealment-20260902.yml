name: Deploy YouTube Full-Question Concealment 20260902

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/deploy-youtube-question-concealment-20260902.yml'

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-concealment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH and stage YouTube-only files
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/oracle_key \
            services/fgbears-live/bin/youtube-question-mask.py \
            "${ORACLE_USER:-ubuntu}@$ORACLE_HOST:/tmp/youtube-question-mask.py.deploy"
          scp -i ~/.ssh/oracle_key \
            services/fgbears-live/bin/youtube-audio-watchdog-owner-aware.sh \
            "${ORACLE_USER:-ubuntu}@$ORACLE_HOST:/tmp/youtube-audio-watchdog.deploy"
          scp -i ~/.ssh/oracle_key \
            services/fgbears-live/systemd/fgbears-youtube-lovable-routing.service \
            "${ORACLE_USER:-ubuntu}@$ORACLE_HOST:/tmp/fgbears-youtube-lovable-routing.service.deploy"

      - name: Deploy routing renderer and watchdog with controlled YouTube reconnect
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          ROUTING=fgbears-youtube-lovable-routing.service
          COMP=fgbears-youtube-lovable-compositor.service
          LEGACY=fgbears-youtube-relay.service
          WATCHDOG=fgbears-youtube-audio-watchdog.service
          WATCHDOG_TIMER=fgbears-youtube-audio-watchdog.timer
          MASK=/opt/fgbears-live/bin/youtube-question-mask.py
          WATCHDOG_BIN=/usr/local/bin/fgbears-youtube-audio-watchdog
          ROUTING_UNIT=/etc/systemd/system/fgbears-youtube-lovable-routing.service
          STATUS=/srv/fgbears-live/health/youtube-audio/status.env
          BACKUP=$(mktemp -d /tmp/fgb-youtube-cleanup.XXXXXX)
          SUCCESS=0

          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          active(){ systemctl is-active --quiet "$1"; }
          has_port(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }
          fail(){ echo "DEPLOY_INVARIANT_FAIL=$1" >&2; exit 1; }
          assert_shared(){
            local tag=$1
            active "$MASTER" || fail "MASTER_INACTIVE_${tag}"
            active "$RUMBLE" || fail "RUMBLE_INACTIVE_${tag}"
            [[ "$(pid "$MASTER")" == "$M0" ]] || fail "MASTER_PID_CHANGED_${tag}"
            [[ "$(pid "$RUMBLE")" == "$R0" ]] || fail "RUMBLE_PID_CHANGED_${tag}"
            has_port "$R0" 1935 || fail "RUMBLE_SOCKET_LOST_${tag}"
          }
          rollback(){
            rc=$?
            (( SUCCESS == 0 )) || return 0
            echo "YOUTUBE_CLEANUP_ROLLBACK=BEGIN rc=$rc" >&2
            systemctl stop "$WATCHDOG_TIMER" "$WATCHDOG" 2>/dev/null || true
            [[ -f "$BACKUP/mask.py" ]] && install -m 0755 "$BACKUP/mask.py" "$MASK" || true
            [[ -f "$BACKUP/watchdog" ]] && install -m 0755 "$BACKUP/watchdog" "$WATCHDOG_BIN" || true
            [[ -f "$BACKUP/routing.service" ]] && install -m 0644 "$BACKUP/routing.service" "$ROUTING_UNIT" || true
            systemctl daemon-reload || true
            systemctl stop "$LEGACY" 2>/dev/null || true
            systemctl disable "$LEGACY" >/dev/null 2>&1 || true
            systemctl reset-failed "$ROUTING" "$COMP" >/dev/null 2>&1 || true
            systemctl restart "$ROUTING" || true
            for _ in $(seq 1 30); do
              cp=$(pid "$COMP")
              if active "$COMP" && has_port "$cp" 443; then break; fi
              sleep 1
            done
            systemctl start "$WATCHDOG_TIMER" 2>/dev/null || true
            echo "YOUTUBE_CLEANUP_ROLLBACK=RESTORED_YOUTUBE_BRANCH master=$(pid "$MASTER") rumble=$(pid "$RUMBLE") compositor=$(pid "$COMP")" >&2
            rm -rf "$BACKUP"
            exit "$rc"
          }
          trap rollback EXIT

          active "$MASTER" || fail MASTER_INACTIVE
          active "$RUMBLE" || fail RUMBLE_INACTIVE
          active "$ROUTING" || fail ROUTING_INACTIVE
          active "$COMP" || fail COMPOSITOR_INACTIVE
          active "$WATCHDOG_TIMER" || fail WATCHDOG_TIMER_INACTIVE
          active "$LEGACY" && fail LEGACY_RELAY_ACTIVE

          M0=$(pid "$MASTER"); R0=$(pid "$RUMBLE"); C0=$(pid "$COMP")
          [[ "$M0" =~ ^[1-9][0-9]*$ ]] || fail MASTER_PID_INVALID
          [[ "$R0" =~ ^[1-9][0-9]*$ ]] || fail RUMBLE_PID_INVALID
          [[ "$C0" =~ ^[1-9][0-9]*$ ]] || fail COMPOSITOR_PID_INVALID
          has_port "$R0" 1935 || fail RUMBLE_SOCKET_MISSING
          has_port "$C0" 443 || fail YOUTUBE_SOCKET_MISSING
          for port in 8787 8788 8789; do curl -fsS --max-time 2 "http://127.0.0.1:${port}/healthz" >/dev/null || fail "HEALTH_PORT_${port}_UNREACHABLE"; done

          python3 -m py_compile /tmp/youtube-question-mask.py.deploy
          bash -n /tmp/youtube-audio-watchdog.deploy
          grep -Fq 'self.active = bool(phase == "question" and not ads_visible and not ad_break)' /tmp/youtube-question-mask.py.deploy || fail QUESTION_PHASE_NOT_AUTHORITATIVE
          grep -Fq '"failClosedDuringQuestion": True' /tmp/youtube-question-mask.py.deploy || fail FAIL_CLOSED_MARKER_MISSING
          grep -Fq 'legacy_fallback_allowed=no' /tmp/youtube-audio-watchdog.deploy || fail WATCHDOG_LEGACY_FALLBACK_NOT_DISABLED
          grep -Fq 'restart_compositor_only' /tmp/youtube-audio-watchdog.deploy || fail WATCHDOG_COMPOSITOR_RECOVERY_MISSING
          if grep -Fq 'fallback_to_legacy' /tmp/youtube-audio-watchdog.deploy; then fail WATCHDOG_LEGACY_FALLBACK_PRESENT; fi

          cp -a "$MASK" "$BACKUP/mask.py"
          cp -a "$WATCHDOG_BIN" "$BACKUP/watchdog"
          cp -a "$ROUTING_UNIT" "$BACKUP/routing.service"

          # Pause only the YouTube watchdog during its own replacement so it
          # cannot race the expected compositor reconnect.
          systemctl stop "$WATCHDOG_TIMER" "$WATCHDOG" 2>/dev/null || true
          install -m 0755 /tmp/youtube-question-mask.py.deploy "$MASK"
          install -m 0755 /tmp/youtube-audio-watchdog.deploy "$WATCHDOG_BIN"
          install -m 0644 /tmp/fgbears-youtube-lovable-routing.service.deploy "$ROUTING_UNIT"
          systemctl daemon-reload
          systemctl stop "$LEGACY" 2>/dev/null || true
          systemctl disable "$LEGACY" >/dev/null 2>&1 || true
          systemctl reset-failed "$ROUTING" "$COMP" >/dev/null 2>&1 || true
          systemctl restart "$ROUTING"

          # Restarting the raw-RGBA routing source closes the compositor input;
          # systemd is expected to reconnect the YouTube compositor once. The
          # shared master and Rumble path must remain completely unchanged.
          assert_shared AFTER_ROUTING_RESTART
          C1=0
          connected=0
          for _ in $(seq 1 35); do
            assert_shared RECONNECT_WAIT
            active "$LEGACY" && fail LEGACY_ACTIVE_DURING_RECONNECT
            cp=$(pid "$COMP")
            if active "$ROUTING" && active "$COMP" && [[ "$cp" =~ ^[1-9][0-9]*$ ]] && has_port "$cp" 443; then
              C1=$cp
              connected=1
              break
            fi
            sleep 1
          done
          (( connected == 1 )) || fail YOUTUBE_COMPOSITOR_DID_NOT_RECONNECT
          echo "YOUTUBE_CONTROLLED_RECONNECT=PASS old_compositor=$C0 new_compositor=$C1"

          healthy=0
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 1 http://127.0.0.1:8791/healthz >/tmp/youtube-mask-health.json 2>/dev/null; then
              if jq -e '.ok == true and .sourceCanvas == [1280,720] and .canvas == [640,360] and .sourceMaskRegion == {"x":462,"y":104,"width":798,"height":470} and .maskRegion == {"x":231,"y":52,"width":399,"height":235} and .creativeKey == "yt_rumble_trivia_redirect" and .failClosedDuringQuestion == true' /tmp/youtube-mask-health.json >/dev/null; then healthy=1; break; fi
            fi
            sleep 1
          done
          (( healthy == 1 )) || fail ROUTING_HEALTH_CONTRACT_FAILED

          phase=$(jq -r '.phase // "none"' /tmp/youtube-mask-health.json)
          cover=$(jq -r '.active' /tmp/youtube-mask-health.json)
          if [[ "$phase" == question && "$cover" != true ]]; then fail LIVE_QUESTION_NOT_COVERED; fi
          echo "QUESTION_COVER_STATE=PASS phase=$phase active=$cover"

          # Exercise the newly installed watchdog once, then resume its timer.
          systemctl reset-failed "$WATCHDOG" >/dev/null 2>&1 || true
          systemctl start "$WATCHDOG" || fail WATCHDOG_MANUAL_CHECK_FAILED
          systemctl start "$WATCHDOG_TIMER" || fail WATCHDOG_TIMER_RESTART_FAILED
          active "$WATCHDOG_TIMER" || fail WATCHDOG_TIMER_NOT_ACTIVE
          active "$LEGACY" && fail LEGACY_STARTED_BY_WATCHDOG
          assert_shared AFTER_WATCHDOG

          # One-minute stability window spans a full watchdog cadence. The
          # compositor may have reconnected once above, but from C1 onward it
          # must remain the sole stable YouTube owner.
          for i in $(seq 1 12); do
            assert_shared "SAMPLE_$i"
            active "$ROUTING" || fail "ROUTING_INACTIVE_SAMPLE_$i"
            active "$COMP" || fail "COMPOSITOR_INACTIVE_SAMPLE_$i"
            active "$LEGACY" && fail "LEGACY_ACTIVE_SAMPLE_$i"
            [[ "$(pid "$COMP")" == "$C1" ]] || fail "COMPOSITOR_RESTARTED_AGAIN_SAMPLE_$i"
            has_port "$C1" 443 || fail "YOUTUBE_SOCKET_LOST_SAMPLE_$i"
            h=$(curl -fsS --max-time 2 http://127.0.0.1:8791/healthz) || fail "ROUTING_HEALTH_LOST_SAMPLE_$i"
            qphase=$(printf '%s' "$h" | jq -r '.phase // "none"')
            qactive=$(printf '%s' "$h" | jq -r '.active')
            if [[ "$qphase" == question && "$qactive" != true ]]; then fail "QUESTION_NOT_COVERED_SAMPLE_$i"; fi
            sleep 5
          done

          assert_shared FINAL
          [[ "$(pid "$COMP")" == "$C1" ]] || fail COMPOSITOR_NOT_STABLE_FINAL
          has_port "$C1" 443 || fail YOUTUBE_SOCKET_MISSING_FINAL
          active "$WATCHDOG_TIMER" || fail WATCHDOG_TIMER_INACTIVE_FINAL
          active "$LEGACY" && fail LEGACY_RELAY_ACTIVE_FINAL

          test -s "$STATUS" || fail WATCHDOG_STATUS_MISSING
          owner=$(sed -n 's/^owner=\([^[:space:]]*\)$/\1/p' "$STATUS" | tail -n1)
          fallback=$(sed -n 's/^legacy_fallback_allowed=\([^[:space:]]*\)$/\1/p' "$STATUS" | tail -n1)
          relay_pid=$(sed -n 's/^relay_pid=\([^[:space:]]*\)$/\1/p' "$STATUS" | tail -n1)
          [[ "$owner" == exact_box_compositor ]] || fail WATCHDOG_OWNER_INVALID
          [[ "$fallback" == no ]] || fail WATCHDOG_FALLBACK_POLICY_INVALID
          [[ "$relay_pid" == 0 ]] || fail WATCHDOG_RELAY_PID_NONZERO

          progress=/srv/fgbears-live/logs/ffmpeg-progress.log
          speed=$(awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' "$progress" 2>/dev/null || true)
          if [[ -n "$speed" ]]; then python3 -c 'import sys; assert float(sys.argv[1]) >= 0.98' "$speed" || fail MASTER_BELOW_REALTIME; fi

          echo "YOUTUBE_CLEANUP_DEPLOY=PASS master=$M0 rumble=$R0 youtube=$C1 legacy=off watchdog_owner=$owner master_speed=${speed:-unknown}x"
          SUCCESS=1
          trap - EXIT
          rm -rf "$BACKUP" /tmp/youtube-question-mask.py.deploy /tmp/youtube-audio-watchdog.deploy /tmp/fgbears-youtube-lovable-routing.service.deploy
          REMOTE
