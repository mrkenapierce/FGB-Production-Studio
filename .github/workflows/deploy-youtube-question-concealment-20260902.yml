name: Deploy Native 720p YouTube Branch 20260902

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/deploy-youtube-question-concealment-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-native-720p
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH and stage YouTube branch files
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          for f in \
            services/fgbears-live/bin/youtube-question-mask.py \
            services/fgbears-live/bin/youtube-lovable-compositor.sh \
            services/fgbears-live/bin/youtube-audio-watchdog-owner-aware.sh \
            services/fgbears-live/systemd/fgbears-youtube-lovable-routing.service; do
            scp -i ~/.ssh/oracle_key "$f" "${ORACLE_USER:-ubuntu}@$ORACLE_HOST:/tmp/$(basename "$f").deploy"
          done

      - name: Guarded native 720p cutover
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          ROUTING=fgbears-youtube-lovable-routing.service
          COMP=fgbears-youtube-lovable-compositor.service
          LEGACY=fgbears-youtube-relay.service
          WT=fgbears-youtube-audio-watchdog.timer
          W=fgbears-youtube-audio-watchdog.service
          MASK=/opt/fgbears-live/bin/youtube-question-mask.py
          COMPSH=/opt/fgbears-live/bin/youtube-lovable-compositor.sh
          WATCH=/usr/local/bin/fgbears-youtube-audio-watchdog
          ROUTEUNIT=/etc/systemd/system/fgbears-youtube-lovable-routing.service
          MONDIR=/run/fgbears-youtube-lovable-compositor
          BACKUP=$(mktemp -d /tmp/fgb-yt720-backup.XXXXXX)
          SUCCESS=0

          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          nr(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          active(){ systemctl is-active --quiet "$1"; }
          connected(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }
          fail(){ echo "NATIVE_720P_FAIL=$1" >&2; exit 1; }
          shared(){ [[ "$(pid "$MASTER")" == "$M0" ]] || fail MASTER_PID_CHANGED; [[ "$(pid "$RUMBLE")" == "$R0" ]] || fail RUMBLE_PID_CHANGED; [[ "$(nr "$MASTER")" == "$MN0" ]] || fail MASTER_RESTARTED; [[ "$(nr "$RUMBLE")" == "$RN0" ]] || fail RUMBLE_RESTARTED; active "$MASTER" || fail MASTER_INACTIVE; active "$RUMBLE" || fail RUMBLE_INACTIVE; connected "$R0" 1935 || fail RUMBLE_SOCKET_LOST; }
          rollback(){ rc=$?; (( SUCCESS == 0 )) || return 0; echo "NATIVE_720P_ROLLBACK=BEGIN rc=$rc" >&2; systemctl stop "$WT" "$W" 2>/dev/null || true; install -m 0755 "$BACKUP/mask" "$MASK" 2>/dev/null || true; install -m 0755 "$BACKUP/compositor" "$COMPSH" 2>/dev/null || true; install -m 0755 "$BACKUP/watchdog" "$WATCH" 2>/dev/null || true; install -m 0644 "$BACKUP/routing.service" "$ROUTEUNIT" 2>/dev/null || true; systemctl daemon-reload || true; systemctl stop "$LEGACY" 2>/dev/null || true; systemctl disable "$LEGACY" >/dev/null 2>&1 || true; systemctl reset-failed "$ROUTING" "$COMP" >/dev/null 2>&1 || true; systemctl restart "$ROUTING" || true; systemctl restart "$COMP" || true; systemctl start "$WT" 2>/dev/null || true; rm -rf "$BACKUP"; exit "$rc"; }
          trap rollback EXIT

          active "$MASTER" || fail MASTER_INACTIVE_PRE
          active "$RUMBLE" || fail RUMBLE_INACTIVE_PRE
          active "$ROUTING" || fail ROUTING_INACTIVE_PRE
          active "$COMP" || fail COMPOSITOR_INACTIVE_PRE
          ! active "$LEGACY" || fail LEGACY_ACTIVE_PRE
          M0=$(pid "$MASTER"); R0=$(pid "$RUMBLE"); MN0=$(nr "$MASTER"); RN0=$(nr "$RUMBLE")
          connected "$R0" 1935 || fail RUMBLE_SOCKET_MISSING_PRE

          python3 -m py_compile /tmp/youtube-question-mask.py.deploy
          bash -n /tmp/youtube-lovable-compositor.sh.deploy
          bash -n /tmp/youtube-audio-watchdog-owner-aware.sh.deploy
          grep -Fq 'YOUTUBE_OUTPUT_WIDTH=1280' /tmp/youtube-lovable-compositor.sh.deploy || fail COMPOSITOR_NOT_720P
          grep -Fq 'YOUTUBE_OUTPUT_CANVAS_WIDTH=1280' /tmp/fgbears-youtube-lovable-routing.service.deploy || fail ROUTING_NOT_720P

          cp -a "$MASK" "$BACKUP/mask"
          cp -a "$COMPSH" "$BACKUP/compositor"
          cp -a "$WATCH" "$BACKUP/watchdog"
          cp -a "$ROUTEUNIT" "$BACKUP/routing.service"

          systemctl stop "$WT" "$W" 2>/dev/null || true
          install -m 0755 /tmp/youtube-question-mask.py.deploy "$MASK"
          install -m 0755 /tmp/youtube-lovable-compositor.sh.deploy "$COMPSH"
          install -m 0755 /tmp/youtube-audio-watchdog-owner-aware.sh.deploy "$WATCH"
          install -m 0644 /tmp/fgbears-youtube-lovable-routing.service.deploy "$ROUTEUNIT"
          systemctl daemon-reload
          systemctl stop "$LEGACY" 2>/dev/null || true
          systemctl disable "$LEGACY" >/dev/null 2>&1 || true
          systemctl reset-failed "$ROUTING" "$COMP" >/dev/null 2>&1 || true
          systemctl restart "$ROUTING"
          systemctl restart "$COMP"
          shared

          ok=0
          for _ in $(seq 1 35); do
            shared
            cp=$(pid "$COMP")
            if active "$ROUTING" && active "$COMP" && connected "$cp" 443; then
              h=$(curl -fsS --max-time 2 http://127.0.0.1:8791/healthz 2>/dev/null || true)
              if printf '%s' "$h" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("canvas")==[1280,720];assert p.get("maskRegion")=={"x":462,"y":104,"width":798,"height":470};assert p.get("frameSize")==[798,470];assert p.get("failClosedDuringQuestion") is True' 2>/dev/null; then ok=1; C1=$cp; break; fi
            fi
            sleep 1
          done
          (( ok == 1 )) || fail YOUTUBE_720P_DID_NOT_CONNECT

          # Wait for a complete monitor segment and verify actual encoded output.
          av=0
          for _ in $(seq 1 20); do
            seg=$(find "$MONDIR" -maxdepth 1 -type f -name 'monitor-*.ts' -printf '%T@ %p\n' 2>/dev/null | sort -nr | sed -n '2{s/^[^ ]* //;p;q;}')
            if [[ -n "$seg" && -s "$seg" ]] && ffprobe -v fatal -show_entries stream=codec_type,codec_name,sample_rate,channels,width,height,r_frame_rate -of json "$seg" 2>/dev/null | python3 -c 'import json,sys;p=json.load(sys.stdin);s=p.get("streams",[]);a=next(x for x in s if x.get("codec_type")=="audio");v=next(x for x in s if x.get("codec_type")=="video");assert (int(v.get("width",0)),int(v.get("height",0)))==(1280,720);assert v.get("r_frame_rate") in {"30/1","60/2"};assert a.get("codec_name")=="aac";assert str(a.get("sample_rate"))=="48000";assert int(a.get("channels") or 0)==2' 2>/dev/null; then av=1; break; fi
            sleep 1
          done
          (( av == 1 )) || fail YOUTUBE_AV_CONTRACT_FAILED

          # Sustained hold: no shared restart, no second sender, stable socket, acceptable CPU/realtime.
          maxcpu=0
          for i in $(seq 1 12); do
            shared
            [[ "$(pid "$COMP")" == "$C1" ]] || fail COMPOSITOR_RESTARTED
            connected "$C1" 443 || fail YOUTUBE_SOCKET_LOST
            ! active "$LEGACY" || fail LEGACY_ACTIVE
            cpu=$(ps -p "$C1" -o %cpu= | awk '{print $1+0}')
            python3 -c 'import sys;assert float(sys.argv[1]) <= 45.0' "$cpu" || fail COMPOSITOR_CPU_HIGH
            maxcpu=$(python3 -c 'import sys;print(max(float(sys.argv[1]),float(sys.argv[2])))' "$maxcpu" "$cpu")
            speed=$(awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v);if(v!="")print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true)
            [[ -z "$speed" ]] || python3 -c 'import sys;assert float(sys.argv[1])>=0.985' "$speed" || fail MASTER_BELOW_REALTIME
            sleep 5
          done

          systemctl start "$WT" || fail WATCHDOG_TIMER_FAILED
          sleep 3
          active "$WT" || fail WATCHDOG_TIMER_INACTIVE
          ! active "$LEGACY" || fail WATCHDOG_STARTED_LEGACY
          shared
          [[ "$(pid "$COMP")" == "$C1" ]] || fail COMPOSITOR_CHANGED_AFTER_WATCHDOG
          connected "$C1" 443 || fail YOUTUBE_SOCKET_LOST_AFTER_WATCHDOG

          echo "NATIVE_720P_DEPLOY=PASS master=$M0 rumble=$R0 compositor=$C1 max_cpu=${maxcpu}% speed=${speed:-unknown}x exact_box=462,104,798,470"
          SUCCESS=1
          trap - EXIT
          rm -rf "$BACKUP" /tmp/*.deploy
          REMOTE
