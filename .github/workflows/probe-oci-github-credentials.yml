name: Probe OCI GitHub Credentials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-oci-github-credentials.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report presence only
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          ORACLE_USER_OCID: ${{ secrets.ORACLE_USER_OCID }}
          ORACLE_TENANCY_OCID: ${{ secrets.ORACLE_TENANCY_OCID }}
          ORACLE_FINGERPRINT: ${{ secrets.ORACLE_FINGERPRINT }}
          ORACLE_API_KEY: ${{ secrets.ORACLE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          for k in ['OCI_USER_OCID','OCI_TENANCY_OCID','OCI_FINGERPRINT','OCI_PRIVATE_KEY','OCI_REGION','ORACLE_USER_OCID','ORACLE_TENANCY_OCID','ORACLE_FINGERPRINT','ORACLE_API_KEY']:
              print(f'{k}_present={bool(os.environ.get(k))}')
          PY
