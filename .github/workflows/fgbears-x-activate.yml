# Post-social-repair verification: 2026-08-21T14:54Z
name: Activate Scheduled FGBears X Simulcast
# Post-deployment verification trigger for the repaired social schedule.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/fgbears-live/bin/start-stream.sh'
      - 'services/fgbears-live/bin/x-relay.sh'
      - 'services/fgbears-live/bin/configure-x.sh'
      - 'services/fgbears-live/systemd/fgbears-x-*'
      - '.github/workflows/fgbears-x-activate.yml'

permissions:
  contents: write

concurrency:
  group: fgbears-live-production-deploy
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu
  X_RTMP_BASE: rtmps://ca.pscp.tv:443/x
  X_ACCOUNT_HANDLE: '@epic501c3'
  YOUTUBE_PAGE_URL: https://www.youtube.com/watch?v=QxmLpaargj0

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Require production secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          FGB_X_STREAM_KEY: ${{ secrets.FGB_X_STREAM_KEY }}
        run: |
          test -n "$ORACLE_HOST"; test -n "$ORACLE_SSH_KEY"; test -n "$FGB_X_STREAM_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - id: install
        name: Install only the isolated X relay and schedule
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          rm -rf /tmp/fgbears-x-schedule
          git clone --depth 1 https://github.com/mrkenapierce/FGB-Production-Studio.git /tmp/fgbears-x-schedule
          src=/tmp/fgbears-x-schedule/services/fgbears-live
          sudo install -m 0755 "$src/bin/start-stream.sh" /usr/local/bin/fgbears-start-stream
          sudo install -m 0755 "$src/bin/x-relay.sh" /usr/local/bin/fgbears-x-relay
          sudo install -m 0755 "$src/bin/configure-x.sh" /usr/local/bin/fgbears-configure-x
          for unit in fgbears-x-relay.service fgbears-x-start.service fgbears-x-stop.service fgbears-x-start.timer fgbears-x-stop.timer; do
            sudo install -m 0644 "$src/systemd/$unit" "/etc/systemd/system/$unit"
          done
          sudo systemctl daemon-reload
          REMOTE

      - id: configure
        name: Install X credential and daily schedule
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          FGB_X_STREAM_KEY: ${{ secrets.FGB_X_STREAM_KEY }}
        run: |
          { printf '%s\n' "$X_RTMP_BASE"; printf '%s\n' "$FGB_X_STREAM_KEY"; } |
            ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo fgbears-configure-x'

      - id: verify
        name: Verify 9-to-5 X ingest without restarting YouTube
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/fgbears-live/stream.env
          sudo grep -Fxq 'X_STREAM_ENABLED=0' "$env_file"
          sudo grep -Eq '^X_RELAY_ENABLED=(1|true|yes|on)$' "$env_file"
          sudo grep -Fxq 'X_LOCAL_UDP_URL=udp://127.0.0.1:1937?pkt_size=1316' "$env_file"
          sudo grep -Fxq 'X_SCHEDULE_TIMEZONE=America/Chicago' "$env_file"
          sudo grep -Fxq 'X_SCHEDULE_START=09:00' "$env_file"
          sudo grep -Fxq 'X_SCHEDULE_STOP=17:00' "$env_file"
          test "$(systemctl is-enabled fgbears-x-start.timer)" = enabled
          test "$(systemctl is-enabled fgbears-x-stop.timer)" = enabled
          systemctl is-active --quiet fgbears-x-start.timer
          systemctl is-active --quiet fgbears-x-stop.timer

          for _ in $(seq 1 90); do
            main_pid=$(systemctl show -p MainPID --value fgbears-live.service)
            yt_pid=$(systemctl show -p MainPID --value fgbears-youtube-relay.service)
            x_pid=$(systemctl show -p MainPID --value fgbears-x-relay.service)
            if [[ "$main_pid" =~ ^[1-9][0-9]*$ && "$yt_pid" =~ ^[1-9][0-9]*$ && "$x_pid" =~ ^[1-9][0-9]*$ ]] &&
               systemctl is-active --quiet fgbears-live.service &&
               systemctl is-active --quiet fgbears-youtube-relay.service &&
               systemctl is-active --quiet fgbears-x-relay.service; then
              primary_ffmpeg=$(pgrep -P "$main_pid" -x ffmpeg | head -n1 || true)
              sockets=$(mktemp); sudo ss -ntpH state established > "$sockets" || true
              yt_ok=false; x_ok=false
              grep "pid=$yt_pid" "$sockets" | grep -vE '127\.0\.0\.1|\[::1\]' | grep -q ':443' && yt_ok=true || true
              grep "pid=$x_pid" "$sockets" | grep -vE '127\.0\.0\.1|\[::1\]' | grep -q ':443' && x_ok=true || true
              rm -f "$sockets"
              if [[ "$yt_ok" == true && "$x_ok" == true ]]; then
                echo 'Verified YouTube continuity and scheduled X ingest.'
                exit 0
              fi
            fi
            sleep 2
          done
          echo 'X schedule verification failed.' >&2
          exit 1
          REMOTE

      - name: Record scheduled X activation
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/deployment-status
          active=false; [[ "$VERIFY_OUTCOME" == success ]] && active=true
          jq -n --argjson active "$active" --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --arg runId "$GITHUB_RUN_ID" --arg jobStatus "$JOB_STATUS" --arg youtubePage "$YOUTUBE_PAGE_URL"             '{xIngestActive:$active,xAccountHandle:"@epic501c3",scheduleTimezone:"America/Chicago",scheduleStart:"09:00",scheduleStop:"17:00",publicBroadcastVerified:false,platformBroadcastObjectRequired:true,transport:"primary-udp-mirror+isolated-copy-remux-sidecar",youtubePage:$youtubePage,youtubePreserved:true,facebookPreserved:true,runId:$runId,checkedAt:$checkedAt,jobStatus:$jobStatus}'             > .github/deployment-status/fgbears-x.json
          git config user.name 'FGBears Deploy Bot'; git config user.email 'actions@github.com'
          git add .github/deployment-status/fgbears-x.json
          git diff --cached --quiet || { git commit -m 'Record scheduled X activation [skip ci]'; git push origin main; }
