name: Restore YouTube Copy Relay

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/fgbears-live/bin/rumble-relay.sh'
      - 'services/fgbears-live/bin/youtube-copy-relay.sh'
      - 'services/fgbears-live/systemd/fgbears-youtube-copy-relay.service'
      - '.github/workflows/restore-youtube-copy-relay.yml'
      - '.github/workflows/fgbears-live-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'services/fgbears-live/bin/rumble-relay.sh'
      - 'services/fgbears-live/bin/youtube-copy-relay.sh'
      - 'services/fgbears-live/systemd/fgbears-youtube-copy-relay.service'
      - '.github/workflows/restore-youtube-copy-relay.yml'
      - '.github/workflows/fgbears-live-deploy.yml'

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-copy-production
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate zero-encode boundary
        run: |
          set -Eeuo pipefail
          bash -n services/fgbears-live/bin/rumble-relay.sh
          bash -n services/fgbears-live/bin/youtube-copy-relay.sh
          grep -Fq -- '-c copy' services/fgbears-live/bin/rumble-relay.sh
          grep -Fq -- '-c copy' services/fgbears-live/bin/youtube-copy-relay.sh
          grep -Fq 'udp://127.0.0.1:1942' services/fgbears-live/bin/rumble-relay.sh
          grep -Fq 'udp://127.0.0.1:1942' services/fgbears-live/bin/youtube-copy-relay.sh
          ! grep -Eq 'libx26[45]|filter_complex|scale=|aresample=|-c:a[[:space:]]+aac|-c:v[[:space:]]+' services/fgbears-live/bin/youtube-copy-relay.sh
          ! grep -Eq 'systemctl[[:space:]]+(restart|stop|start)[[:space:]]+fgbears-live' .github/workflows/restore-youtube-copy-relay.yml
          grep -Fq "!services/fgbears-live/bin/rumble-relay.sh" .github/workflows/fgbears-live-deploy.yml
          echo 'YOUTUBE_COPY_STATIC_BOUNDARY=PASS'

      - name: Exercise copy fanout muxing
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=160x90:rate=10:duration=1 \
            -f lavfi -i sine=frequency=440:sample_rate=44100:duration=1 \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset ultrafast -g 20 -c:a aac \
            -f tee \
            "[f=flv:flvflags=no_duration_filesize]$tmp/rumble.flv|[f=mpegts:mpegts_flags=resend_headers:bsfs/v=dump_extra=freq=keyframe:onfail=ignore]$tmp/youtube.ts"
          test -s "$tmp/rumble.flv"
          test -s "$tmp/youtube.ts"
          for media in "$tmp/rumble.flv" "$tmp/youtube.ts"; do
            codecs=$(ffprobe -v error -show_entries stream=codec_type,codec_name -of compact=p=0:nk=1 "$media")
            grep -Eq 'h264\|video|video\|h264' <<<"$codecs"
            grep -Eq 'aac\|audio|audio\|aac' <<<"$codecs"
          done
          echo 'YOUTUBE_COPY_FANOUT_MUX=PASS'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Require protected YouTube stream key
        env:
          FGB_YOUTUBE_STREAM_KEY: ${{ secrets.FGB_YOUTUBE_STREAM_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$FGB_YOUTUBE_STREAM_KEY"
          echo 'YOUTUBE_PROTECTED_KEY=AVAILABLE'

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy YouTube copy relay without restarting master
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          FGB_YOUTUBE_STREAM_KEY: ${{ secrets.FGB_YOUTUBE_STREAM_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$FGB_YOUTUBE_STREAM_KEY"
          printf '%s\n' "$FGB_YOUTUBE_STREAM_KEY" | ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo tee /run/fgbears-youtube-key >/dev/null && sudo chmod 600 /run/fgbears-youtube-key'
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          KEY_FILE=/run/fgbears-youtube-key
          ENV_FILE=/etc/fgbears-live/stream.env
          trap 'sudo rm -f "$KEY_FILE"' EXIT

          pid() {
            systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0
          }

          systemctl is-active --quiet fgbears-live.service || {
            echo 'Preflight failed: master is not active.' >&2
            exit 1
          }
          systemctl is-active --quiet fgbears-rumble-relay.service || {
            echo 'Preflight failed: Rumble relay is not active.' >&2
            exit 1
          }
          command -v ffmpeg >/dev/null
          sudo test -r "$ENV_FILE"
          sudo test -s "$KEY_FILE"

          master_before=$(pid fgbears-live.service)
          rumble_before=$(pid fgbears-rumble-relay.service)
          [[ "$master_before" =~ ^[1-9][0-9]*$ ]]
          [[ "$rumble_before" =~ ^[1-9][0-9]*$ ]]

          rm -rf /tmp/fgbears-youtube-copy-deploy
          git clone --depth 1 https://github.com/mrkenapierce/FGB-Production-Studio.git /tmp/fgbears-youtube-copy-deploy

          relay_backup=$(mktemp /tmp/fgbears-rumble-relay.pre-youtube-copy.XXXXXX)
          env_backup=$(mktemp /tmp/fgbears-stream-env.pre-youtube-copy.XXXXXX)
          sudo cp -a /usr/local/bin/fgbears-rumble-relay "$relay_backup"
          sudo cp -a "$ENV_FILE" "$env_backup"

          rollback() {
            rc=$?
            trap - ERR
            echo "YouTube copy deployment failed; rolling back destination relay only (rc=$rc)." >&2
            echo '=== YOUTUBE COPY STATUS ===' >&2
            sudo systemctl status fgbears-youtube-copy-relay.service --no-pager -l >&2 || true
            echo '=== YOUTUBE COPY JOURNAL ===' >&2
            sudo journalctl -u fgbears-youtube-copy-relay.service -n 100 --no-pager >&2 || true
            sudo systemctl disable --now fgbears-youtube-copy-relay.service >/dev/null 2>&1 || true
            sudo rm -f /etc/systemd/system/fgbears-youtube-copy-relay.service
            sudo rm -f /usr/local/bin/fgbears-youtube-copy-relay
            sudo cp -a "$relay_backup" /usr/local/bin/fgbears-rumble-relay
            sudo chmod 0755 /usr/local/bin/fgbears-rumble-relay
            sudo cp -a "$env_backup" "$ENV_FILE"
            sudo systemctl daemon-reload || true
            sudo systemctl reset-failed fgbears-rumble-relay.service || true
            sudo systemctl restart fgbears-rumble-relay.service || true
            master_after_rollback=$(pid fgbears-live.service)
            echo "ROLLBACK master_pid_before=$master_before master_pid_after=$master_after_rollback" >&2
            exit "$rc"
          }
          trap rollback ERR

          # Reuse the existing protected GitHub stream-key secret. The key is
          # transferred through stdin, never printed, and written atomically to
          # the root-owned Oracle environment used by the destination relay.
          sudo python3 - "$ENV_FILE" "$KEY_FILE" <<'PY'
          from pathlib import Path
          import sys
          env_path = Path(sys.argv[1])
          key_path = Path(sys.argv[2])
          value = key_path.read_text(encoding='utf-8').strip()
          if not value or '\n' in value or '\r' in value or '|' in value:
              raise SystemExit('invalid protected YouTube stream key')
          lines = env_path.read_text(encoding='utf-8').splitlines()
          out = []
          seen = False
          for line in lines:
              if line.startswith('YOUTUBE_STREAM_KEY='):
                  out.append('YOUTUBE_STREAM_KEY=' + value)
                  seen = True
              else:
                  out.append(line)
          if not seen:
              out.append('YOUTUBE_STREAM_KEY=' + value)
          tmp = env_path.with_suffix(env_path.suffix + '.partial')
          tmp.write_text('\n'.join(out) + '\n', encoding='utf-8')
          tmp.replace(env_path)
          PY
          sudo chown root:fgbears "$ENV_FILE"
          sudo chmod 0640 "$ENV_FILE"

          sudo install -m 0755 \
            /tmp/fgbears-youtube-copy-deploy/services/fgbears-live/bin/rumble-relay.sh \
            /usr/local/bin/fgbears-rumble-relay
          sudo install -m 0755 \
            /tmp/fgbears-youtube-copy-deploy/services/fgbears-live/bin/youtube-copy-relay.sh \
            /usr/local/bin/fgbears-youtube-copy-relay
          sudo install -m 0644 \
            /tmp/fgbears-youtube-copy-deploy/services/fgbears-live/systemd/fgbears-youtube-copy-relay.service \
            /etc/systemd/system/fgbears-youtube-copy-relay.service

          # The former compositor remains retired. This operation is best-effort
          # because the copy relay must not depend on the state-file details of
          # a previously quarantined unit.
          sudo systemctl disable --now fgbears-youtube-v3.service >/dev/null 2>&1 || true
          sudo systemctl mask fgbears-youtube-v3.service >/dev/null 2>&1 || true

          sudo systemctl daemon-reload

          # This is the only existing destination process restarted. The master
          # encoder remains untouched; Rumble reconnects using the same encoded
          # program while also emitting the isolated loopback mirror.
          sudo systemctl restart fgbears-rumble-relay.service

          for _ in $(seq 1 15); do
            systemctl is-active --quiet fgbears-rumble-relay.service && break
            sleep 1
          done
          systemctl is-active --quiet fgbears-rumble-relay.service

          sudo systemctl enable --now fgbears-youtube-copy-relay.service

          for _ in $(seq 1 20); do
            if systemctl is-active --quiet fgbears-youtube-copy-relay.service; then
              youtube_pid=$(pid fgbears-youtube-copy-relay.service)
              [[ "$youtube_pid" =~ ^[1-9][0-9]*$ ]] && break
            fi
            sleep 1
          done

          sleep 10
          systemctl is-active --quiet fgbears-youtube-copy-relay.service
          systemctl is-active --quiet fgbears-rumble-relay.service
          systemctl is-active --quiet fgbears-live.service

          master_after=$(pid fgbears-live.service)
          rumble_after=$(pid fgbears-rumble-relay.service)
          youtube_after=$(pid fgbears-youtube-copy-relay.service)

          test "$master_after" = "$master_before" || {
            echo "Master PID changed unexpectedly: $master_before -> $master_after" >&2
            exit 1
          }
          [[ "$rumble_after" =~ ^[1-9][0-9]*$ ]]
          [[ "$youtube_after" =~ ^[1-9][0-9]*$ ]]

          youtube_cmd=$(tr '\0' ' ' < "/proc/$youtube_after/cmdline")
          [[ "$youtube_cmd" == *"-c copy"* ]]
          [[ "$youtube_cmd" != *"libx264"* ]]
          [[ "$youtube_cmd" != *"filter_complex"* ]]

          youtube_cpu=$(ps -p "$youtube_after" -o %cpu= | xargs)
          youtube_rss=$(ps -p "$youtube_after" -o rss= | xargs)

          trap - ERR
          rm -f "$relay_backup" "$env_backup"
          echo "YOUTUBE_COPY_RELAY=PASS master_pid_unchanged=$master_after rumble_pid=$rumble_after youtube_pid=$youtube_after youtube_cpu_pct=$youtube_cpu youtube_rss_kb=$youtube_rss"
          REMOTE
