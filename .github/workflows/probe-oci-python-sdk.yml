name: Probe OCI Python SDK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-oci-python-sdk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Inspect available Python tooling only
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key ubuntu@$ORACLE_HOST "set +e; python3 -m pip --version; echo pip_rc=\$?; pip3 --version; echo pip3_rc=\$?; python3 -c 'import oci; print(oci.__version__)'; echo oci_sdk_rc=\$?; command -v pipx || true; systemctl is-active fgbears-live.service; systemctl is-active fgbears-youtube-relay.service; systemctl is-active fgbears-rumble-relay.service"
