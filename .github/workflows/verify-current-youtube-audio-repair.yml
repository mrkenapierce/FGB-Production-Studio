name: Verify Current YouTube Audio Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-current-youtube-audio-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify isolated YouTube copy relay and audio health
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER_PID=$(systemctl show -p MainPID --value fgbears-live.service)
          YOUTUBE_PID=$(systemctl show -p MainPID --value fgbears-youtube-relay.service)
          RUMBLE_PID=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          printf 'master_state=%s master_pid=%s\n' "$(systemctl is-active fgbears-live.service)" "$MASTER_PID"
          printf 'youtube_state=%s youtube_pid=%s\n' "$(systemctl is-active fgbears-youtube-relay.service)" "$YOUTUBE_PID"
          printf 'rumble_state=%s rumble_pid=%s\n' "$(systemctl is-active fgbears-rumble-relay.service)" "$RUMBLE_PID"
          [[ "$MASTER_PID" =~ ^[1-9][0-9]*$ ]]
          [[ "$YOUTUBE_PID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUMBLE_PID" =~ ^[1-9][0-9]*$ ]]

          ARGS=$(tr '\0' ' ' < "/proc/$YOUTUBE_PID/cmdline")
          SAFE_ARGS=$(sed -E 's#(rtmps?://)[^ ]+#\1[REDACTED]#g' <<<"$ARGS")
          printf 'youtube_args=%s\n' "$SAFE_ARGS"
          [[ "$ARGS" == *"ffmpeg"* ]]
          [[ "$ARGS" == *" -c copy "* ]]
          [[ "$ARGS" != *"youtube-stream-router"* ]]
          [[ "$ARGS" != *"gst-launch"* ]]

          sudo ss -ntpH state established > /tmp/fgb-youtube-audio-repair-sockets.txt || true
          grep "pid=$YOUTUBE_PID" /tmp/fgb-youtube-audio-repair-sockets.txt | grep -q ':443'
          echo 'youtube_rtmps_socket=ESTABLISHED'

          echo '--- exact source audio feeding YouTube ---'
          sudo /usr/local/bin/fgbears-audio-health --capture-seconds 20

          echo '--- new relay timestamp warnings ---'
          sudo journalctl _PID="$YOUTUBE_PID" --no-pager > /tmp/fgb-youtube-audio-repair-journal.txt || true
          AUDIO_TS_ERRORS=$(grep -Ec 'Non-monotonic DTS in output stream 0:1|Invalid timestamps stream=1|timestamp discontinuity.*stream id=' /tmp/fgb-youtube-audio-repair-journal.txt || true)
          echo "youtube_audio_timestamp_error_lines=$AUDIO_TS_ERRORS"
          [[ "$AUDIO_TS_ERRORS" -eq 0 ]]

          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          systemctl is-active --quiet fgbears-rumble-relay.service
          echo 'youtube_audio_repair_verified=yes'
          REMOTE
