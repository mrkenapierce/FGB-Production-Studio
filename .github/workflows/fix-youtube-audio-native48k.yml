name: Maintain YouTube Exact-Box Production - Manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lovable-routing-bridge-20260902

      - name: Validate deployable YouTube contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in \
            services/fgbears-live/bin/youtube-lovable-compositor.sh \
            services/fgbears-live/bin/youtube-relay.sh \
            services/fgbears-live/bin/youtube-audio-watchdog-owner-aware.sh \
            services/fgbears-live/bin/youtube-audio-watchdog.sh; do bash -n "$f"; done
          grep -Fq 'YOUTUBE_AUDIO_SAMPLE_RATE=48000' services/fgbears-live/bin/youtube-lovable-compositor.sh
          grep -Fq 'YOUTUBE_UDP_FIFO_SIZE=1000000' services/fgbears-live/bin/youtube-lovable-compositor.sh
          grep -Fq 'YOUTUBE_MASTER_THREAD_QUEUE=512' services/fgbears-live/bin/youtube-lovable-compositor.sh
          grep -Fq 'YOUTUBE_AUDIO_SAMPLE_RATE=48000' services/fgbears-live/bin/youtube-relay.sh
          grep -Fq 'recent_transport_faults=' services/fgbears-live/bin/youtube-audio-watchdog-owner-aware.sh
          echo 'DEPLOY_CONTRACT=PASS'

      - name: Configure SSH and stage YouTube-only files
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          scp -i ~/.ssh/oracle_key \
            services/fgbears-live/bin/youtube-lovable-compositor.sh \
            services/fgbears-live/bin/youtube-relay.sh \
            services/fgbears-live/bin/youtube-audio-watchdog-owner-aware.sh \
            services/fgbears-live/bin/youtube-audio-watchdog.sh \
            services/fgbears-live/systemd/fgbears-youtube-lovable-compositor.service \
            "$target:/tmp/"

      - name: Guarded YouTube-only deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service
          RELAY=fgbears-youtube-relay.service
          TIMER=fgbears-youtube-audio-watchdog.timer
          WATCHDOG_SERVICE=fgbears-youtube-audio-watchdog.service
          COMP_SCRIPT=/opt/fgbears-live/bin/youtube-lovable-compositor.sh
          RELAY_SCRIPT=/usr/local/bin/fgbears-youtube-relay
          WATCHDOG=/usr/local/bin/fgbears-youtube-audio-watchdog
          LEGACY_WATCHDOG=/usr/local/libexec/fgbears-youtube-audio-watchdog-legacy
          COMP_UNIT=/etc/systemd/system/fgbears-youtube-lovable-compositor.service
          MONDIR=/run/fgbears-youtube-lovable-compositor
          BACKUP=/run/fgbears-youtube-maintenance-backup
          SUCCESS=0

          active(){ systemctl is-active --quiet "$1"; }
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          restarts(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          speed(){ awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true; }
          has443(){ local p=$1; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v p="pid=$p" 'index($0,p)&&index($0,":443"){ok=1} END{exit(ok?0:1)}'; }
          faults_since(){ local p=$1 since=$2; journalctl _PID="$p" --since "@$since" --no-pager 2>/dev/null | grep -Eci 'Circular buffer overrun|timestamp discontinuity|Packet corrupt|Non-monotonous DTS|Invalid DTS|Queue input is backward in time' || true; }
          latest_complete_segment(){ find "$MONDIR" -maxdepth 1 -type f -name 'monitor-*.ts' -printf '%T@ %p\n' 2>/dev/null | sort -nr | sed -n '2{s/^[^ ]* //;p;q;}'; }
          output_audio_ok(){ local seg probe; seg=$(latest_complete_segment); [[ -n "$seg" && -s "$seg" ]] || return 1; probe=$(ffprobe -v fatal -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of json "$seg") || return 1; printf '%s' "$probe" | python3 -c 'import json,sys;p=json.load(sys.stdin);s=(p.get("streams") or [{}])[0];assert s.get("codec_name")=="aac";assert str(s.get("sample_rate"))=="48000";assert int(s.get("channels") or 0)==2'; }
          source_audio_ok(){ /usr/local/bin/fgbears-audio-health --capture-seconds 8 2>&1 | tee /tmp/source-audio-health.log | grep -q '^OVERALL_STATUS=OK$'; }
          wait_owner(){ local svc=$1 tries=${2:-25}; for _ in $(seq 1 "$tries"); do p=$(pid "$svc"); active "$svc" && has443 "$p" && return 0; sleep 1; done; return 1; }

          fallback_legacy(){
            systemctl stop "$COMP" 2>/dev/null || true
            systemctl unmask "$RELAY" >/dev/null 2>&1 || true
            systemctl enable "$RELAY" >/dev/null 2>&1 || true
            systemctl reset-failed "$RELAY" >/dev/null 2>&1 || true
            systemctl start "$RELAY" 2>/dev/null || true
            wait_owner "$RELAY" 25
          }

          restore_previous(){
            echo 'ROLLBACK=RESTORE_PREVIOUS_EXACT_BOX'
            systemctl stop "$COMP" 2>/dev/null || true
            [[ -f "$BACKUP/compositor.sh" ]] && install -m 0755 "$BACKUP/compositor.sh" "$COMP_SCRIPT"
            [[ -f "$BACKUP/relay.sh" ]] && install -m 0755 "$BACKUP/relay.sh" "$RELAY_SCRIPT"
            [[ -f "$BACKUP/watchdog" ]] && install -m 0755 "$BACKUP/watchdog" "$WATCHDOG"
            [[ -f "$BACKUP/legacy-watchdog" ]] && install -m 0755 "$BACKUP/legacy-watchdog" "$LEGACY_WATCHDOG"
            [[ -f "$BACKUP/compositor.service" ]] && install -m 0644 "$BACKUP/compositor.service" "$COMP_UNIT"
            systemctl daemon-reload
            systemctl stop "$RELAY" 2>/dev/null || true
            systemctl disable "$RELAY" >/dev/null 2>&1 || true
            systemctl reset-failed "$COMP" >/dev/null 2>&1 || true
            systemctl start "$COMP" 2>/dev/null || true
            if wait_owner "$COMP" 20; then
              echo 'ROLLBACK=PASS previous_exact_box_restored'
              return 0
            fi
            echo 'ROLLBACK=PREVIOUS_COMPOSITOR_FAILED using_legacy_fallback' >&2
            fallback_legacy
          }

          cleanup(){ rm -rf "$BACKUP"; rm -f /tmp/youtube-lovable-compositor.sh /tmp/youtube-relay.sh /tmp/youtube-audio-watchdog-owner-aware.sh /tmp/youtube-audio-watchdog.sh /tmp/fgbears-youtube-lovable-compositor.service /tmp/source-audio-health.log; }
          rollback(){ rc=$?; (( SUCCESS == 0 )) || return 0; systemctl stop "$TIMER" 2>/dev/null || true; systemctl stop "$WATCHDOG_SERVICE" 2>/dev/null || true; restore_previous || true; systemctl start "$TIMER" 2>/dev/null || true; cleanup; exit "$rc"; }
          trap rollback EXIT

          active "$MASTER"; active "$RUMBLE"; active "$ROUTING"
          MASTER0=$(pid "$MASTER"); MASTER_R0=$(restarts "$MASTER")
          RUMBLE0=$(pid "$RUMBLE"); RUMBLE_R0=$(restarts "$RUMBLE")
          source_audio_ok
          echo "BASELINE=PASS master=$MASTER0 rumble=$RUMBLE0 speed=$(speed)x source_audio=clean_48k"

          rm -rf "$BACKUP"; install -d -m 0700 "$BACKUP"
          cp -a "$COMP_SCRIPT" "$BACKUP/compositor.sh"
          cp -a "$RELAY_SCRIPT" "$BACKUP/relay.sh"
          cp -a "$WATCHDOG" "$BACKUP/watchdog"
          [[ -f "$LEGACY_WATCHDOG" ]] && cp -a "$LEGACY_WATCHDOG" "$BACKUP/legacy-watchdog"
          cp -a "$COMP_UNIT" "$BACKUP/compositor.service"

          systemctl stop "$TIMER" 2>/dev/null || true
          systemctl stop "$WATCHDOG_SERVICE" 2>/dev/null || true
          install -m 0755 /tmp/youtube-lovable-compositor.sh "$COMP_SCRIPT"
          install -m 0755 /tmp/youtube-relay.sh "$RELAY_SCRIPT"
          install -m 0755 /tmp/youtube-audio-watchdog-owner-aware.sh "$WATCHDOG"
          install -d -m 0755 "$(dirname "$LEGACY_WATCHDOG")"
          install -m 0755 /tmp/youtube-audio-watchdog.sh "$LEGACY_WATCHDOG"
          install -m 0644 /tmp/fgbears-youtube-lovable-compositor.service "$COMP_UNIT"
          systemctl daemon-reload
          systemctl stop "$RELAY" 2>/dev/null || true
          systemctl disable "$RELAY" >/dev/null 2>&1 || true

          START_EPOCH=$(date +%s)
          systemctl reset-failed "$COMP" >/dev/null 2>&1 || true
          systemctl restart "$COMP"
          wait_owner "$COMP" 30
          CPID=$(pid "$COMP")
          sleep 10
          output_audio_ok
          FAULTS=$(faults_since "$CPID" "$START_EPOCH")
          (( FAULTS == 0 ))
          CPU=$(ps -p "$CPID" -o %cpu= | tr -d ' ')
          RSS_KB=$(awk '/^VmRSS:/{print $2}' /proc/$CPID/status)
          python3 -c 'import sys;assert float(sys.argv[1])<=45' "$CPU"
          python3 -c 'import sys;assert int(sys.argv[1])<=400000' "$RSS_KB"

          systemctl start "$TIMER"
          systemctl start "$WATCHDOG_SERVICE"
          grep -q '^state=OK$' /srv/fgbears-live/health/youtube-audio/status.env
          grep -q '^owner=exact_box_compositor$' /srv/fgbears-live/health/youtube-audio/status.env
          grep -q '^youtube_audio_rate=48000$' /srv/fgbears-live/health/youtube-audio/status.env
          grep -q '^recent_transport_faults=0$' /srv/fgbears-live/health/youtube-audio/status.env

          OBS_EPOCH=$(date +%s)
          for _ in $(seq 1 6); do
            sleep 5
            [[ "$(pid "$COMP")" == "$CPID" ]]
            active "$COMP"; has443 "$CPID"
            [[ "$(pid "$MASTER")" == "$MASTER0" ]]
            [[ "$(restarts "$MASTER")" == "$MASTER_R0" ]]
            [[ "$(pid "$RUMBLE")" == "$RUMBLE0" ]]
            [[ "$(restarts "$RUMBLE")" == "$RUMBLE_R0" ]]
          done
          output_audio_ok
          OBS_FAULTS=$(faults_since "$CPID" "$OBS_EPOCH")
          (( OBS_FAULTS == 0 ))
          FINAL_SPEED=$(speed)
          [[ -z "$FINAL_SPEED" ]] || python3 -c 'import sys;assert float(sys.argv[1])>=0.985' "$FINAL_SPEED"

          echo "YOUTUBE_EXACT_BOX_MAINTENANCE=PASS compositor=$CPID audio=48k transport_faults=$OBS_FAULTS cpu=${CPU}% master=$MASTER0 rumble=$RUMBLE0 speed=${FINAL_SPEED:-unknown}x"
          echo 'AUDIO_POLICY=PASS source_mastering_preserved no_second_mastering_stage=true'
          SUCCESS=1
          trap - EXIT
          cleanup
          REMOTE
