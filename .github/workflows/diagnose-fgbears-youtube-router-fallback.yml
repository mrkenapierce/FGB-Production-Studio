name: Diagnose FGBears YouTube Router Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-fgbears-youtube-router-fallback.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read router failure evidence only
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== current service state ==='
          echo "master=$(systemctl is-active fgbears-live.service || true) pid=$(systemctl show -p MainPID --value fgbears-live.service)"
          echo "youtube=$(systemctl is-active fgbears-youtube-relay.service || true) pid=$(systemctl show -p MainPID --value fgbears-youtube-relay.service)"
          echo "rumble=$(systemctl is-active fgbears-rumble-relay.service || true) pid=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)"
          uptime

          echo '=== failed cutover journal window ==='
          journalctl -u fgbears-youtube-relay.service \
            --since '2026-08-29 20:12:25' --until '2026-08-29 20:12:45' \
            --no-pager || true

          echo '=== installed/staged router files ==='
          ls -l \
            /opt/fgbears-live/bin/youtube-stream-router.py \
            /opt/fgbears-live/assets/youtube-rumble-trivia.h264 \
            /opt/fgbears-live/bin/youtube-relay-legacy.sh \
            /usr/local/bin/fgbears-youtube-relay \
            2>&1 || true
          stat -c '%a %U:%G %s %n' \
            /opt/fgbears-live/bin/youtube-stream-router.py \
            /opt/fgbears-live/assets/youtube-rumble-trivia.h264 \
            /opt/fgbears-live/bin/youtube-relay-legacy.sh \
            /usr/local/bin/fgbears-youtube-relay \
            2>&1 || true

          echo '=== fgbears access checks ==='
          for p in \
            /opt/fgbears-live/bin/youtube-stream-router.py \
            /opt/fgbears-live/assets/youtube-rumble-trivia.h264 \
            /opt/fgbears-live/bin/youtube-relay-legacy.sh; do
            if sudo -u fgbears test -r "$p"; then echo "readable=yes $p"; else echo "readable=no $p"; fi
          done
          sudo -u fgbears /usr/bin/python3 /opt/fgbears-live/bin/youtube-stream-router.py \
            --card /opt/fgbears-live/assets/youtube-rumble-trivia.h264 --validate-card || true

          echo '=== wrapper dependency conditions as fgbears ==='
          sudo -u fgbears /usr/bin/bash -c '
            for p in /usr/bin/python3 /usr/bin/gst-launch-1.0; do
              if [[ -x "$p" ]]; then echo "executable=yes $p"; else echo "executable=no $p"; fi
            done
            for p in /opt/fgbears-live/bin/youtube-stream-router.py /opt/fgbears-live/assets/youtube-rumble-trivia.h264; do
              if [[ -r "$p" ]]; then echo "readable=yes $p"; else echo "readable=no $p"; fi
            done
          '

          echo '=== current known-good relay process ==='
          YPID=$(systemctl show -p MainPID --value fgbears-youtube-relay.service)
          if [[ "$YPID" =~ ^[1-9][0-9]*$ ]]; then
            ps -p "$YPID" -o pid=,pcpu=,pmem=,etime=,args=
          fi
          echo 'production_restarted=no'
          REMOTE
