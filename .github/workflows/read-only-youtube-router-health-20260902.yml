name: Read Only YouTube Sender Socket Diagnosis

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/read-only-youtube-router-health-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read-only socket and watchdog diagnosis
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          redact(){ sed -E 's#(rtmps?://[^/]+/[^/]+/)[^ ]+#\1[REDACTED]#g; s#(YOUTUBE_STREAM_KEY|RUMBLE_STREAM_KEY)=.*#\1=[REDACTED]#g; s#([A-Za-z0-9_-]{28,})#[REDACTED]#g'; }
          echo 'SERVICE_STATE'
          for u in fgbears-live.service fgbears-rumble-relay.service fgbears-youtube-lovable-compositor.service fgbears-youtube-lovable-routing.service fgbears-youtube-relay.service fgbears-youtube-router.service fgbears-youtube-audio-watchdog.timer fgbears-youtube-audio-watchdog.service; do
            echo "--- $u"
            systemctl show "$u" -p ActiveState -p SubState -p MainPID -p NRestarts -p Result -p ExecMainStatus -p ActiveEnterTimestamp -p InactiveEnterTimestamp --no-pager 2>/dev/null || true
          done
          echo 'SOCKETS_443_1935'
          ss -ntpH state established 2>/dev/null | grep -E ':443|:1935' | redact || true
          echo 'WATCHDOG_STATUS'
          cat /srv/fgbears-live/health/youtube-audio/status.env 2>/dev/null || true
          echo 'WATCHDOG_FAILURE_COUNTER'
          cat /srv/fgbears-live/health/youtube-audio/compositor-socket-failures 2>/dev/null || echo 0
          echo 'CONTROL_HEALTH'
          curl -fsS --max-time 3 http://127.0.0.1:8791/healthz 2>/dev/null || true
          echo
          echo 'COMPOSITOR_PROCESS'
          cp=$(systemctl show -p MainPID --value fgbears-youtube-lovable-compositor.service 2>/dev/null || echo 0)
          if [[ "$cp" =~ ^[1-9][0-9]*$ && -r /proc/$cp/status ]]; then
            grep -E '^(Name|State|PPid|Threads|VmRSS|voluntary_ctxt_switches|nonvoluntary_ctxt_switches):' /proc/$cp/status || true
            tr '\0' ' ' </proc/$cp/cmdline | redact; echo
            ls -l /proc/$cp/fd 2>/dev/null | tail -30 || true
          fi
          echo 'RECENT_COMPOSITOR_LOG'
          journalctl -u fgbears-youtube-lovable-compositor.service --since '10 minutes ago' --no-pager -o short-iso 2>/dev/null | redact | tail -160 || true
          echo 'RECENT_WATCHDOG_LOG'
          journalctl -u fgbears-youtube-audio-watchdog.service --since '10 minutes ago' --no-pager -o short-iso 2>/dev/null | redact | tail -160 || true
          echo 'RECENT_LEGACY_LOG'
          journalctl -u fgbears-youtube-relay.service --since '10 minutes ago' --no-pager -o short-iso 2>/dev/null | redact | tail -120 || true
          echo 'RESOURCE'
          printf 'load='; cut -d' ' -f1-3 /proc/loadavg
          ps -eo pid,ppid,%cpu,%mem,stat,etime,comm,args --sort=-%cpu | head -20 | redact || true
          echo 'MASTER_SPEED'
          awk -F= '$1=="speed"{v=$2} END{print v}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true
          echo 'DIAGNOSIS_CAPTURE=PASS'
          REMOTE
