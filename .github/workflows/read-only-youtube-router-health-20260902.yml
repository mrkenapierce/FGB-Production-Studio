name: Read Only YouTube Exact Box Health

on:
  push:
    paths:
      - '.github/workflows/read-only-youtube-router-health-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Certify exact question box through a real trivia cycle
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'python3 - <<'"'"'PY'"'"'
          import json, os, subprocess, time, urllib.request

          H="http://127.0.0.1:8791/healthz"
          O="http://127.0.0.1:8791/overlay.rgba"
          W,HGT=399,235
          FRAME=W*HGT*4

          def sh(s):
              return subprocess.check_output(s,shell=True,text=True).strip()
          def pid(unit):
              return sh(f"systemctl show -p MainPID --value {unit}")
          def restarts(unit):
              return sh(f"systemctl show -p NRestarts --value {unit}")
          def health():
              with urllib.request.urlopen(H,timeout=3) as r:
                  p=json.loads(r.read().decode())
              assert p.get("ok") is True,p
              assert p.get("sourceCanvas")==[1280,720],p
              assert p.get("canvas")==[640,360],p
              assert p.get("sourceMaskRegion")=={"x":462,"y":104,"width":798,"height":470},p
              assert p.get("maskRegion")=={"x":231,"y":52,"width":399,"height":235},p
              assert p.get("frameSize")==[399,235],p
              assert p.get("executionScaling")=="proportional_downstream",p
              assert p.get("fps")==30,p
              return p
          def alpha():
              with urllib.request.urlopen(O,timeout=5) as r:
                  b=bytearray()
                  while len(b)<FRAME:
                      c=r.read(FRAME-len(b))
                      if not c: raise RuntimeError("overlay ended early")
                      b.extend(c)
              a=b[3::4]
              return min(a),max(a),sum(1 for x in a if x)/len(a)

          units=["fgbears-live.service","fgbears-rumble-relay.service","fgbears-youtube-lovable-compositor.service","fgbears-youtube-lovable-routing.service"]
          for u in units:
              assert sh(f"systemctl is-active {u}")=="active",u
          before={u:(pid(u),restarts(u)) for u in units}
          comp=before["fgbears-youtube-lovable-compositor.service"][0]
          cmd=sh(f"tr '\\0' ' ' </proc/{comp}/cmdline")
          assert "scale=640:360:flags=fast_bilinear" in cmd,cmd
          assert "overlay=231:52:format=auto:shortest=1" in cmd,cmd
          assert "aresample=44100:async=1:first_pts=0" in cmd,cmd
          assert sh(f"ss -ntpH state established | grep -F 'pid={comp}' | grep -E ':443([[:space:]]|$)' >/dev/null && echo yes || echo no")=="yes"
          base=health()
          print("BASELINE_EXACT_BOX=PASS",json.dumps(base,sort_keys=True))

          # Between questions the question box must be completely transparent.
          if not base.get("active"):
              amin,amax,ratio=alpha()
              assert amin==0 and amax==0 and ratio==0,(amin,amax,ratio)
              print("INACTIVE_EXACT_BOX=PASS alpha=0/0")

          deadline=time.time()+900
          found=False
          while time.time()<deadline:
              p=health()
              if p.get("phase")=="question" and p.get("active") is True and not p.get("lastError"):
                  found=True
                  break
              time.sleep(.5)
          assert found,"No active trivia question observed"
          print("LIVE_QUESTION_DETECTED=YES")

          samples=0
          while samples<40:
              p=health()
              if p.get("phase")!="question": break
              assert p.get("active") is True,p
              if samples%2==0:
                  amin,amax,ratio=alpha()
                  assert amin==255 and amax==255 and ratio==1.0,(amin,amax,ratio)
              samples+=1
              time.sleep(.5)
          assert samples>=4,samples
          print(f"LIVE_EXACT_BOX_OPACITY=PASS samples={samples} alpha=255/255 pixels={W*HGT}")

          deadline=time.time()+90
          while time.time()<deadline:
              p=health()
              if p.get("active") is False:
                  break
              time.sleep(.5)
          else:
              raise AssertionError("Overlay did not clear")
          amin,amax,ratio=alpha()
          assert amin==0 and amax==0 and ratio==0,(amin,amax,ratio)
          print("POST_QUESTION_TRANSPARENCY=PASS")

          after={u:(pid(u),restarts(u)) for u in units}
          assert after==before,(before,after)
          cpu=float(sh(f"ps -p {comp} -o %cpu= | tr -d ' '"))
          speed=sh("awk -F= '$1==\"speed\"{v=$2} END{gsub(/x/,\"\",v);print v}' /srv/fgbears-live/logs/ffmpeg-progress.log")
          if speed:
              assert float(speed)>=0.985,speed
          assert cpu<=40,cpu
          assert sh(f"ss -ntpH state established | grep -F 'pid={comp}' | grep -E ':443([[:space:]]|$)' >/dev/null && echo yes || echo no")=="yes"
          print(f"NO_RESTARTS=PASS compositor_cpu={cpu}% master_speed={speed or 'unknown'}x")
          print("RUMBLE_UNTOUCHED=PASS")
          print("EXACT_BOX_LIVE_CYCLE_CERTIFICATION=PASS")
          PY'
