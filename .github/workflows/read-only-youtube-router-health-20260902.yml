name: Read Only Persisted YouTube Exact-Box Health

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/read-only-youtube-router-health-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read-only persisted production audit
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'python3 -' <<'PY'
          import json, subprocess, urllib.request

          def sh(cmd):
              return subprocess.check_output(cmd, shell=True, text=True).strip()
          def state(unit):
              return sh(f"systemctl is-active {unit} 2>/dev/null || true")
          def pid(unit):
              return sh(f"systemctl show -p MainPID --value {unit} 2>/dev/null || echo 0")
          def restarts(unit):
              return sh(f"systemctl show -p NRestarts --value {unit} 2>/dev/null || echo 0")
          def connected(process_pid, port):
              raw=sh("ss -ntpH state established 2>/dev/null || true")
              return any(f"pid={process_pid}" in line and f":{port}" in line for line in raw.splitlines())

          master_u="fgbears-live.service"
          rumble_u="fgbears-rumble-relay.service"
          comp_u="fgbears-youtube-lovable-compositor.service"
          routing_u="fgbears-youtube-lovable-routing.service"
          legacy_u="fgbears-youtube-relay.service"
          router_u="fgbears-youtube-router.service"
          timer_u="fgbears-youtube-audio-watchdog.timer"

          assert state(master_u)=="active"
          assert state(rumble_u)=="active"
          assert state(comp_u)=="active"
          assert state(routing_u)=="active"
          assert state(legacy_u)!="active"
          assert state(router_u)!="active"
          assert state(timer_u)=="active"

          master=pid(master_u); rumble=pid(rumble_u); comp=pid(comp_u)
          assert master=="2320192", master
          assert restarts(master_u)=="0", restarts(master_u)
          assert connected(rumble,1935), (rumble, "Rumble RTMP socket missing")
          assert connected(comp,443), (comp, "YouTube RTMPS socket missing")

          with urllib.request.urlopen("http://127.0.0.1:8791/healthz", timeout=3) as r:
              h=json.loads(r.read().decode())
          assert h.get("ok") is True,h
          assert h.get("sourceCanvas")==[1280,720],h
          assert h.get("canvas")==[640,360],h
          assert h.get("sourceMaskRegion")=={"x":462,"y":104,"width":798,"height":470},h
          assert h.get("maskRegion")=={"x":231,"y":52,"width":399,"height":235},h
          assert h.get("frameSize")==[399,235],h
          assert h.get("executionScaling")=="proportional_downstream",h
          assert h.get("fps")==30,h
          assert h.get("creativeKey")=="yt_rumble_trivia_redirect",h

          cmd=sh(f"tr '\\0' ' ' </proc/{comp}/cmdline")
          for needle in (
              "scale=640:360:flags=fast_bilinear",
              "overlay=231:52:format=auto:shortest=1",
              " -c:v libx264 ",
              " -c:a aac ",
              " -b:a 128k ",
              " -ar 44100 ",
              " -ac 2 ",
              "aresample=44100:async=1:first_pts=0",
          ):
              assert needle in cmd, needle

          status=sh("cat /srv/fgbears-live/health/youtube-audio/status.env")
          assert "owner=exact_box_compositor" in status,status
          assert ("state=OK" in status or "state=WARN" in status),status

          speed=sh("awk -F= '$1==\"speed\"{v=$2} END{gsub(/x/,\"\",v);print v}' /srv/fgbears-live/logs/ffmpeg-progress.log")
          cpu=float(sh(f"ps -p {comp} -o %cpu= | tr -d ' '"))
          load=sh("cut -d' ' -f1-3 /proc/loadavg")
          if speed:
              assert float(speed)>=0.985,speed
          assert cpu<=40,cpu

          senders=sum(state(u)=="active" for u in (comp_u,legacy_u,router_u))
          assert senders==1,senders

          print("PERSISTED_EXACT_BOX_GEOMETRY=PASS source=462,104,798,470 output=231,52,399,235")
          print(f"PERSISTED_SINGLE_YOUTUBE_SENDER=PASS compositor={comp} legacy={state(legacy_u)} router={state(router_u)}")
          print(f"PERSISTED_MASTER=PASS pid={master} restarts={restarts(master_u)} speed={speed or 'unknown'}x")
          print(f"PERSISTED_RUMBLE=PASS pid={rumble} restarts={restarts(rumble_u)} socket=1935")
          print(f"PERSISTED_WATCHDOG=PASS owner=exact_box_compositor timer={state(timer_u)}")
          print(f"PERSISTED_RESOURCE=PASS compositor_cpu={cpu}% load={load}")
          print("POST_DEPLOY_PERSISTENCE_AUDIT=PASS")
          PY
