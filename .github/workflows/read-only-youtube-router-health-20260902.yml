name: Read Only YouTube Low-Latency Failure Diagnosis

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/read-only-youtube-router-health-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Diagnose failed bounded-latency cutover read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          redact(){ sed -E 's#(rtmps?://[^/]+/[^/]+/)[^ ]+#\1[REDACTED]#g; s#(YOUTUBE_STREAM_KEY|RUMBLE_STREAM_KEY)=.*#\1=[REDACTED]#g; s#([A-Za-z0-9_-]{28,})#[REDACTED]#g'; }
          echo 'CURRENT_STATE'
          for u in fgbears-live.service fgbears-rumble-relay.service fgbears-youtube-lovable-compositor.service fgbears-youtube-lovable-routing.service fgbears-youtube-relay.service fgbears-youtube-router.service fgbears-youtube-audio-watchdog.timer; do
            printf '%s ' "$u"
            systemctl show "$u" -p ActiveState -p MainPID -p NRestarts -p Result --value 2>/dev/null | tr '\n' ' '; echo
          done
          echo 'CURRENT_SOCKETS'
          ss -ntpH state established 2>/dev/null | grep -E ':443|:1935' | redact || true
          echo 'FAILED_ATTEMPT_COMPOSITOR_JOURNAL'
          journalctl -u fgbears-youtube-lovable-compositor.service --since '2026-09-02 22:08:25 UTC' --until '2026-09-02 22:09:40 UTC' --no-pager -o short-iso 2>/dev/null | redact || true
          echo 'FAILED_ATTEMPT_WATCHDOG_JOURNAL'
          journalctl -u fgbears-youtube-audio-watchdog.service --since '2026-09-02 22:08:25 UTC' --until '2026-09-02 22:09:40 UTC' --no-pager -o short-iso 2>/dev/null | redact || true
          echo 'FAILED_ATTEMPT_SYSTEM_EVENTS'
          journalctl --since '2026-09-02 22:08:25 UTC' --until '2026-09-02 22:09:40 UTC' --no-pager -o short-iso 2>/dev/null \
            | grep -Ei 'youtube-lovable-compositor|youtube-audio-watchdog|youtube-relay|ffmpeg|Invalid argument|Error|Failed|fifo|RTMP|rtmps|Connection|queue' \
            | redact | tail -300 || true
          echo 'CURRENT_COMPOSITOR_CMD'
          p=$(systemctl show -p MainPID --value fgbears-youtube-lovable-compositor.service 2>/dev/null || echo 0)
          if [[ "$p" =~ ^[1-9][0-9]*$ && -r /proc/$p/cmdline ]]; then tr '\0' ' ' </proc/$p/cmdline | redact; echo; fi
          echo 'DIAGNOSIS_COMPLETE=PASS'
          REMOTE
