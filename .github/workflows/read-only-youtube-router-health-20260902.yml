name: Repair YouTube Exact Question Box Low Lag

on:
  push:
    paths:
      - '.github/workflows/read-only-youtube-router-health-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lovable-routing-bridge-20260902
          fetch-depth: 0
      - name: Restore exact question box on resource-protected YouTube branch
        shell: bash
        run: bash .github/scripts/restore-exact-question-box-low-lag.sh
