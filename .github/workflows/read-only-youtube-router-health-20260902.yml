name: Read Only YouTube Router Health 20260902
# Expanded read-only topology probe 2026-09-02.

on:
  push:
    paths:
      - '.github/workflows/read-only-youtube-router-health-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Read production state only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== core states ==='
          for s in \
            fgbears-live.service \
            fgbears-rumble-relay.service \
            fgbears-youtube-router.service \
            fgbears-youtube-relay.service \
            fgbears-youtube-audio-watchdog.timer \
            fgbears-youtube-freeze-card-refresh.service \
            fgbears-youtube-freeze-card-refresh.timer; do
            printf '%s active=%s enabled=%s pid=%s\n' "$s" \
              "$(systemctl is-active "$s" 2>/dev/null || true)" \
              "$(systemctl is-enabled "$s" 2>/dev/null || true)" \
              "$(systemctl show -p MainPID --value "$s" 2>/dev/null || true)"
          done

          echo '=== youtube/fgb systemd units ==='
          systemctl list-unit-files --no-pager --no-legend 2>/dev/null \
            | awk '$1 ~ /^fgbears-/ && $1 ~ /(youtube|live|rumble)/ {print $1, $2}' \
            | sort || true

          echo '=== running media processes (no arguments) ==='
          ps -eo pid=,ppid=,comm= \
            | awk '$3 ~ /^(ffmpeg|python3|node)$/ {print $1, $2, $3}' \
            | sort -n || true

          echo '=== established port-443 media pids ==='
          media_pids=$(pgrep -d, -x ffmpeg || true)
          if [[ -n "$media_pids" ]]; then
            sudo ss -ntpH state established 2>/dev/null \
              | grep -E ':443([[:space:]]|$)' \
              | grep -E 'pid=([0-9]+)' \
              | sed -E 's/.*pid=([0-9]+).*/pid=\1/' \
              | sort -u || true
          else
            echo 'none'
          fi

          echo '=== service ownership for ffmpeg pids ==='
          for pid in $(pgrep -x ffmpeg || true); do
            unit=$(systemctl status "$pid" 2>/dev/null | sed -n '1s/^[^●]*● \([^ ]*\).*/\1/p' || true)
            printf 'pid=%s unit=%s\n' "$pid" "${unit:-unknown}"
          done

          echo "health_dropin=$(test -e /etc/systemd/system/fgbears-live-health.service.d/90-youtube-emergency-router.conf && echo yes || echo no)"
          REMOTE
