name: Prepare OVH public key for EPIC private ingest transfer
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/epic-ovh-credential-pairing-20261118.yml
permissions:
  contents: read
concurrency:
  group: epic-ovh-credential-pairing-20261118
  cancel-in-progress: false
jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Authenticate existing OVH connection
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh
          chmod 600 ~/.ssh/ovh
          unset DEPLOY_KEY
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Generate OVH-only private decryption key and print public key
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i ~/.ssh/ovh ubuntu@40.160.144.185 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          d=/root/.config/epic-cnt-credential-pairing
          install -d -m 0700 "$d"
          if [ ! -s "$d/private.pem" ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$d/private.pem" 2>/dev/null
            chmod 0600 "$d/private.pem"
          fi
          openssl pkey -in "$d/private.pem" -pubout -out "$d/public.pem"
          chmod 0644 "$d/public.pem"
          echo "PAIRING_HOST=vps-a13eee97"
          echo "PAIRING_PUBLIC_KEY_START"
          cat "$d/public.pem"
          echo "PAIRING_PUBLIC_KEY_END"
          echo "PAIRING_PRIVATE_KEY_KEPT_ON_HOST=true"
          echo "CNT_CONTAINER_UNCHANGED=$(docker inspect -f '{{.State.Running}}' epic-cnt-capture)"
          REMOTE
