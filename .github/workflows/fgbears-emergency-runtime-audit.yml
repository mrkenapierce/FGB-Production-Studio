name: Emergency FGBears Runtime Audit

on:
  push:
    paths:
      - '.github/workflows/fgbears-emergency-runtime-audit.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require Oracle access secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Trust Oracle host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Inspect live runtime without changing it
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "=== CLOCK ==="
          date -u
          TZ=America/Chicago date

          echo "=== SERVICES ==="
          systemctl is-active fgbears-live.service || true
          systemctl is-active fgbears-youtube-relay.service || true
          systemctl is-active fgbears-live-health.timer || true
          systemctl show fgbears-live.service -p MainPID -p ActiveEnterTimestamp -p NRestarts --no-pager || true

          echo "=== PROGRESS SAMPLE ==="
          progress=/srv/fgbears-live/logs/ffmpeg-progress.log
          if sudo test -s "$progress"; then
            sudo stat -c 'mtime_epoch=%Y size=%s' "$progress"
            first=$(sudo sed -n 's/^out_time_us=\([0-9][0-9]*\)$/\1/p' "$progress" | tail -n 1)
            echo "out_time_us_1=${first:-missing}"
            sleep 5
            second=$(sudo sed -n 's/^out_time_us=\([0-9][0-9]*\)$/\1/p' "$progress" | tail -n 1)
            echo "out_time_us_2=${second:-missing}"
          else
            echo 'progress=missing'
          fi

          echo "=== OVERLAY HEALTH ==="
          for port in 8787 8788; do
            echo "-- port $port health --"
            curl --silent --show-error --max-time 3 "http://127.0.0.1:${port}/healthz" || true
            echo
            echo "-- port $port frame timing --"
            curl --silent --show-error --max-time 3 -o /tmp/fgb-frame-${port}.jpg -w 'http=%{http_code} bytes=%{size_download} seconds=%{time_total}\n' "http://127.0.0.1:${port}/frame.jpg" || true
            echo "-- port $port mjpeg bytes in 2s --"
            set +o pipefail
            timeout 2 curl --silent --show-error "http://127.0.0.1:${port}/overlay.mjpg" 2>/dev/null | head -c 500000 | wc -c || true
            set -o pipefail
          done

          echo "=== PLAYLIST ==="
          sudo cat /srv/fgbears-live/playlist.ffconcat || true
          echo "=== PLAYLIST MEDIA PROBES ==="
          sudo awk -F"'" '/^file /{print $2}' /srv/fgbears-live/playlist.ffconcat | while IFS= read -r media; do
            [[ -n "$media" ]] || continue
            if sudo test -r "$media"; then
              printf '%s | ' "$media"
              sudo ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$media" 2>&1 | head -n 1 || true
            else
              echo "$media | MISSING"
            fi
          done

          echo "=== RECENT HEALTH JOURNAL ==="
          sudo journalctl -u fgbears-live-health.service --since '-45 minutes' --no-pager || true
          echo "=== RECENT STREAM JOURNAL ==="
          sudo journalctl -u fgbears-live.service --since '-45 minutes' -n 240 --no-pager || true
          echo "=== RECENT YOUTUBE RELAY JOURNAL ==="
          sudo journalctl -u fgbears-youtube-relay.service --since '-45 minutes' -n 120 --no-pager || true
          REMOTE
