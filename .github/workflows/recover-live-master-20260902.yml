name: Recover Destination-Independent Live Master 20260902

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/recover-live-master-20260902.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH and stage master unit only
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/oracle_key services/fgbears-live/systemd/fgbears-live.service \
            "${ORACLE_USER:-ubuntu}@$ORACLE_HOST:/tmp/fgbears-live.service.recovery"

      - name: Restore source first, then destination transports
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          ROUTING=fgbears-youtube-lovable-routing.service
          COMP=fgbears-youtube-lovable-compositor.service
          LEGACY=fgbears-youtube-relay.service
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          active(){ systemctl is-active --quiet "$1"; }
          port_for_pid(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }

          R0=$(pid "$RUMBLE")
          ROUTE0=$(pid "$ROUTING")
          COMP0=$(pid "$COMP")
          bash -n /usr/local/bin/fgbears-start-stream

          install -m 0644 /tmp/fgbears-live.service.recovery /etc/systemd/system/fgbears-live.service
          systemctl daemon-reload
          systemctl disable --now "$LEGACY" >/dev/null 2>&1 || true
          systemctl reset-failed "$MASTER"
          systemctl start "$MASTER"

          healthy=0
          for _ in $(seq 1 55); do
            if active "$MASTER" \
              && curl -fsS --max-time 1 http://127.0.0.1:8787/healthz >/dev/null 2>&1 \
              && curl -fsS --max-time 1 http://127.0.0.1:8788/healthz >/dev/null 2>&1 \
              && curl -fsS --max-time 1 http://127.0.0.1:8789/healthz >/dev/null 2>&1; then
              healthy=1; break
            fi
            sleep 1
          done
          (( healthy == 1 ))
          ! active "$LEGACY"
          echo "MASTER_SOURCE=PASS pid=$(pid "$MASTER")"

          rumble_ok=0
          youtube_ok=0
          for _ in $(seq 1 30); do
            RP=$(pid "$RUMBLE"); CP=$(pid "$COMP")
            active "$RUMBLE" && port_for_pid "$RP" 1935 && rumble_ok=1 || true
            active "$COMP" && port_for_pid "$CP" 443 && youtube_ok=1 || true
            (( rumble_ok == 1 && youtube_ok == 1 )) && break
            sleep 1
          done

          if (( rumble_ok == 0 )); then
            systemctl reset-failed "$RUMBLE" >/dev/null 2>&1 || true
            systemctl restart "$RUMBLE"
            for _ in $(seq 1 25); do
              RP=$(pid "$RUMBLE")
              active "$RUMBLE" && port_for_pid "$RP" 1935 && { rumble_ok=1; break; }
              sleep 1
            done
          fi

          if (( youtube_ok == 0 )); then
            systemctl reset-failed "$ROUTING" >/dev/null 2>&1 || true
            systemctl reset-failed "$COMP" >/dev/null 2>&1 || true
            active "$ROUTING" || systemctl start "$ROUTING"
            systemctl restart "$COMP"
            for _ in $(seq 1 30); do
              CP=$(pid "$COMP")
              active "$COMP" && port_for_pid "$CP" 443 && { youtube_ok=1; break; }
              sleep 1
            done
          fi

          (( rumble_ok == 1 && youtube_ok == 1 ))
          ! active "$LEGACY"

          progress=/srv/fgbears-live/logs/ffmpeg-progress.log
          sleep 10
          SPEED=$(awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' "$progress")
          DROPPED=$(awk -F= '$1=="drop_frames"{v=$2} END{if(v!="") print v+0}' "$progress")
          python3 - "$SPEED" "${DROPPED:-0}" <<'PY'
          import sys
          speed=float(sys.argv[1]); dropped=int(float(sys.argv[2]))
          assert speed >= 0.95, speed
          assert dropped == 0, dropped
          print(f'MASTER_REALTIME=PASS speed={speed:.3f}x dropped={dropped}')
          PY

          ! grep -Eq '^(After|Wants|Requires)=.*fgbears-youtube-' /etc/systemd/system/fgbears-live.service
          echo "MASTER_RECOVERY=PASS master=$(pid "$MASTER") rumble=$(pid "$RUMBLE") routing=$(pid "$ROUTING") compositor=$(pid "$COMP") legacy=inactive"
          REMOTE
