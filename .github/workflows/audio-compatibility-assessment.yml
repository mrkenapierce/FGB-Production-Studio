name: Read-Only Audio Compatibility Assessment

# Current approved-audio deployment probe.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-compatibility-assessment.yml'
      - 'scripts/audio-compatibility-assessment.sh'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Run read-only compatibility assessment on Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' < scripts/audio-compatibility-assessment.sh
