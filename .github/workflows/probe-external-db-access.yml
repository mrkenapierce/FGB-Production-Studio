name: Probe External DB Access

on:
  push:
    branches:
      - probe-external-db-access
    paths:
      - '.github/workflows/probe-external-db-access.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Inventory DB access without exposing values
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== PROJECT REF FILES ==='
          sudo grep -RIl --exclude-dir=.git --exclude='*.log' 'mrvzpjtbithwpxdfihgx' /opt /etc/systemd/system /home/ubuntu 2>/dev/null | head -100 || true

          echo '=== DB/SUPABASE CREDENTIAL-BEARING FILES (NAMES ONLY) ==='
          sudo grep -RIlE --exclude-dir=.git --exclude='*.log' '(^|[^A-Z_])(SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY|DATABASE_URL|PGHOST|PGPASSWORD|PGUSER|POSTGRES_URL)=' /opt /etc/systemd/system /home/ubuntu 2>/dev/null | head -100 || true

          echo '=== ENV KEY NAMES ONLY ==='
          files=$(sudo grep -RIlE --exclude-dir=.git --exclude='*.log' '^(SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY|DATABASE_URL|PGHOST|PGPASSWORD|PGUSER|POSTGRES_URL)=' /opt /etc/systemd/system /home/ubuntu 2>/dev/null | head -100 || true)
          if [ -n "$files" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "-- $f"
              sudo sed -n -E 's/^(SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY|DATABASE_URL|PGHOST|PGPASSWORD|PGUSER|POSTGRES_URL)=.*/\1=PRESENT/p' "$f" || true
            done <<< "$files"
          fi

          echo '=== PSQL CLIENT ==='
          if command -v psql >/dev/null 2>&1; then psql --version; else echo 'psql=ABSENT'; fi
          REMOTE
