name: Test YouTube Off-host Compositor

on:
  push:
    branches: [main]
    paths:
      - 'services/fgbears-live/bin/youtube-question-mask.py'
      - 'services/fgbears-live/bin/youtube-offhost-compositor.sh'
      - 'services/fgbears-live/bin/youtube-compositor-source-relay.sh'
      - '.github/workflows/test-youtube-offhost-compositor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: python3 -m pip install --quiet pillow
      - name: Syntax checks
        run: |
          python3 -m py_compile services/fgbears-live/bin/youtube-question-mask.py
          bash -n services/fgbears-live/bin/youtube-offhost-compositor.sh
          bash -n services/fgbears-live/bin/youtube-compositor-source-relay.sh
      - name: Verify partial-mask geometry and transparency
        run: |
          python3 - <<'PY'
          import importlib.util
          p='services/fgbears-live/bin/youtube-question-mask.py'
          spec=importlib.util.spec_from_file_location('mask',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert m.MASK_BOX == (480,200,1120,560)
          assert len(m.ACTIVE) == 1280*720*4
          from PIL import Image
          im=Image.frombytes('RGBA',(1280,720),m.ACTIVE)
          # News, crawl, title/prize band and QR region must stay transparent.
          for xy in [(10,10),(640,50),(500,150),(1200,300),(640,650),(1140,450)]:
              assert im.getpixel(xy)[3] == 0, (xy, im.getpixel(xy))
          # Question zone must be opaque.
          for xy in [(500,220),(800,300),(1000,500)]:
              assert im.getpixel(xy)[3] > 0, (xy, im.getpixel(xy))
          transparent=Image.frombytes('RGBA',(1280,720),m.TRANSPARENT)
          assert transparent.getbbox() is None
          print('partial_mask_geometry_ok=yes')
          PY
      - name: Verify compositor command remains isolated from source host
        run: |
          grep -q 'libx264' services/fgbears-live/bin/youtube-offhost-compositor.sh
          grep -q -- '-c copy' services/fgbears-live/bin/youtube-compositor-source-relay.sh
          if grep -q 'libx264' services/fgbears-live/bin/youtube-compositor-source-relay.sh; then
            echo 'source relay unexpectedly encodes video' >&2; exit 1
          fi
          echo 'source_relay_copy_only=yes'
