name: Diagnose YouTube Copy Relay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-youtube-copy-relay.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read YouTube copy diagnostics
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          master_pid=$(systemctl show -p MainPID --value fgbears-live.service 2>/dev/null || true)
          rumble_pid=$(systemctl show -p MainPID --value fgbears-rumble-relay.service 2>/dev/null || true)
          youtube_pid=$(systemctl show -p MainPID --value fgbears-youtube-copy-relay.service 2>/dev/null || true)
          rumble_since=$(systemctl show -p ActiveEnterTimestamp --value fgbears-rumble-relay.service 2>/dev/null || true)
          youtube_since=$(systemctl show -p ActiveEnterTimestamp --value fgbears-youtube-copy-relay.service 2>/dev/null || true)
          echo "MASTER_ACTIVE=$(systemctl is-active fgbears-live.service || true)"
          echo "MASTER_PID=$master_pid"
          echo "RUMBLE_ACTIVE=$(systemctl is-active fgbears-rumble-relay.service || true)"
          echo "RUMBLE_PID=$rumble_pid"
          echo "YOUTUBE_COPY_ACTIVE=$(systemctl is-active fgbears-youtube-copy-relay.service 2>/dev/null || true)"
          echo "YOUTUBE_COPY_PID=$youtube_pid"
          echo "YOUTUBE_COPY_ENABLED=$(systemctl is-enabled fgbears-youtube-copy-relay.service 2>/dev/null || true)"
          echo "YOUTUBE_V3_ACTIVE=$(systemctl is-active fgbears-youtube-v3.service 2>/dev/null || true)"
          echo "YOUTUBE_V3_ENABLED=$(systemctl is-enabled fgbears-youtube-v3.service 2>/dev/null || true)"
          sudo bash -c 'source /etc/fgbears-live/stream.env; printf "YOUTUBE_KEY_PRESENT=%s\n" "$([[ -n "${YOUTUBE_STREAM_KEY:-}" && "${YOUTUBE_STREAM_KEY:-}" != REPLACE_WITH_YOUTUBE_STREAM_KEY ]] && echo yes || echo no)"; printf "YOUTUBE_UPSTREAM_SCHEME_HOST=%s\n" "${YOUTUBE_UPSTREAM_RTMP_BASE:-<default>}"' | sed -E 's#(live2)/.*#\1/<redacted>#'
          if [[ "$youtube_pid" =~ ^[1-9][0-9]*$ ]] && [[ -r "/proc/$youtube_pid/cmdline" ]]; then
            cmd=$(tr '\0' ' ' < "/proc/$youtube_pid/cmdline")
            [[ "$cmd" == *'-c copy'* ]] && echo 'YOUTUBE_COPY_MODE=copy' || echo 'YOUTUBE_COPY_MODE=unexpected'
            [[ "$cmd" == *'libx264'* || "$cmd" == *'filter_complex'* ]] && echo 'YOUTUBE_ENCODER_PRESENT=yes' || echo 'YOUTUBE_ENCODER_PRESENT=no'
            echo "YOUTUBE_CPU_PCT=$(ps -p "$youtube_pid" -o %cpu= | xargs)"
            echo "YOUTUBE_RSS_KB=$(ps -p "$youtube_pid" -o rss= | xargs)"
          fi
          if [[ "$rumble_pid" =~ ^[1-9][0-9]*$ ]]; then
            rumble_established=$(sudo ss -Htnp state established 2>/dev/null | awk -v p="pid=$rumble_pid," 'index($0,p){n++} END{print n+0}')
            echo "RUMBLE_ESTABLISHED_TCP=$rumble_established"
          fi
          if [[ "$youtube_pid" =~ ^[1-9][0-9]*$ ]]; then
            youtube_established=$(sudo ss -Htnp state established 2>/dev/null | awk -v p="pid=$youtube_pid," 'index($0,p){n++} END{print n+0}')
            echo "YOUTUBE_ESTABLISHED_TCP=$youtube_established"
          fi
          if [[ -n "$rumble_since" ]]; then
            rumble_mux_failures=$(sudo journalctl -u fgbears-rumble-relay.service --since "$rumble_since" --no-pager 2>/dev/null | grep -Ec 'Slave muxer #[0-9]+ failed|error writing header|incompatible with output codec' || true)
            echo "RUMBLE_MUX_FAILURES_SINCE_RESTART=$rumble_mux_failures"
          fi
          if [[ -n "$youtube_since" ]]; then
            youtube_exit_failures=$(sudo journalctl -u fgbears-youtube-copy-relay.service --since "$youtube_since" --no-pager 2>/dev/null | grep -Ec 'Main process exited|Failed with result|Connection refused|Broken pipe' || true)
            echo "YOUTUBE_EXIT_FAILURES_SINCE_RESTART=$youtube_exit_failures"
          fi

          # Read-only two-second CPU sample. This measures actual host busy time
          # and instantaneous CPU consumed by the three media processes without
          # restarting or signaling any service.
          python3 - "$master_pid" "$rumble_pid" "$youtube_pid" <<'PY'
          import os, sys, time
          labels = ['MASTER', 'RUMBLE', 'YOUTUBE']
          pids = [int(x) if x.isdigit() else 0 for x in sys.argv[1:4]]
          hz = os.sysconf(os.sysconf_names['SC_CLK_TCK'])
          cpus = os.cpu_count() or 1

          def cpu_total_idle():
              parts = open('/proc/stat', encoding='utf-8').readline().split()[1:]
              vals = list(map(int, parts))
              idle = vals[3] + (vals[4] if len(vals) > 4 else 0)
              return sum(vals), idle

          def proc_ticks(pid):
              if pid <= 0:
                  return None
              try:
                  fields = open(f'/proc/{pid}/stat', encoding='utf-8').read().split()
                  return int(fields[13]) + int(fields[14])
              except Exception:
                  return None

          t0, i0 = cpu_total_idle()
          p0 = [proc_ticks(pid) for pid in pids]
          wall0 = time.monotonic()
          time.sleep(2)
          t1, i1 = cpu_total_idle()
          p1 = [proc_ticks(pid) for pid in pids]
          wall = time.monotonic() - wall0
          dt = t1 - t0
          didle = i1 - i0
          busy = (100.0 * (dt - didle) / dt) if dt > 0 else 0.0
          print(f'CPU_LOGICAL_COUNT={cpus}')
          print(f'CPU_HOST_BUSY_PCT={busy:.1f}')
          for label, a, b in zip(labels, p0, p1):
              if a is not None and b is not None and wall > 0:
                  pct = 100.0 * (b - a) / hz / wall
                  print(f'{label}_CPU_2S_PCT={pct:.1f}')
              else:
                  print(f'{label}_CPU_2S_PCT=NA')
          l1, l5, l15 = os.getloadavg()
          print(f'LOADAVG_1M={l1:.2f}')
          print(f'LOADAVG_5M={l5:.2f}')
          print(f'LOADAVG_15M={l15:.2f}')
          try:
              pressure = open('/proc/pressure/cpu', encoding='utf-8').readline().split()
              avg10 = next(x.split('=',1)[1] for x in pressure if x.startswith('avg10='))
              print(f'CPU_PRESSURE_SOME_AVG10={avg10}')
          except Exception:
              print('CPU_PRESSURE_SOME_AVG10=NA')
          PY

          echo '=== YOUTUBE COPY JOURNAL ==='
          sudo journalctl -u fgbears-youtube-copy-relay.service --since "$youtube_since" -n 50 --no-pager || true
          echo '=== RECENT RUMBLE RELAY JOURNAL ==='
          sudo journalctl -u fgbears-rumble-relay.service --since "$rumble_since" -n 40 --no-pager || true
          REMOTE
