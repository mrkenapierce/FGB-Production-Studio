name: Diagnose OVH Available Credentials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-ovh-available-credentials.yml

permissions:
  contents: write

concurrency:
  group: diagnose-ovh-available-credentials
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record presence only; never expose secret values
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          OVH_PASSWORD: ${{ secrets.OVH_PASSWORD }}
          OVH_ROOT_PASSWORD: ${{ secrets.OVH_ROOT_PASSWORD }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          OVH_SSH_PASSWORD: ${{ secrets.OVH_SSH_PASSWORD }}
          OVH_APPLICATION_KEY: ${{ secrets.OVH_APPLICATION_KEY }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
          OVH_ENDPOINT: ${{ secrets.OVH_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/deployment-status
          present(){ if [ -n "${!1:-}" ]; then echo true; else echo false; fi; }
          {
            echo "checkedAt=$(date -u +%FT%TZ)"
            echo "OVH_SSH_KEY_PRESENT=$(present OVH_SSH_KEY)"
            echo "ORACLE_SSH_KEY_PRESENT=$(present ORACLE_SSH_KEY)"
            echo "OVH_PASSWORD_PRESENT=$(present OVH_PASSWORD)"
            echo "OVH_ROOT_PASSWORD_PRESENT=$(present OVH_ROOT_PASSWORD)"
            echo "VPS_PASSWORD_PRESENT=$(present VPS_PASSWORD)"
            echo "OVH_SSH_PASSWORD_PRESENT=$(present OVH_SSH_PASSWORD)"
            echo "OVH_APPLICATION_KEY_PRESENT=$(present OVH_APPLICATION_KEY)"
            echo "OVH_APPLICATION_SECRET_PRESENT=$(present OVH_APPLICATION_SECRET)"
            echo "OVH_CONSUMER_KEY_PRESENT=$(present OVH_CONSUMER_KEY)"
            echo "OVH_ENDPOINT_PRESENT=$(present OVH_ENDPOINT)"
          } > .github/deployment-status/ovh-available-credentials.txt
          cat .github/deployment-status/ovh-available-credentials.txt

      - name: Commit sanitized result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/ovh-available-credentials.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record OVH credential availability diagnostic'
          git push
