name: Verify Retired YouTube Quarantine

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/fgbears-live-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-retired-youtube-quarantine
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify retired paths remain quarantined
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service; RUMBLE=fgbears-rumble-relay.service; YOUTUBE=fgbears-youtube-output.service
          RETIRED_UNITS=(fgbears-youtube-lovable-routing.service fgbears-youtube-lovable-compositor.service fgbears-youtube-audio-watchdog.service fgbears-youtube-audio-watchdog.timer fgbears-youtube-relay.service fgbears-youtube-router.service)
          RETIRED_FILES=(/usr/local/bin/fgbears-youtube-relay /usr/local/bin/fgbears-youtube-audio-watchdog /opt/fgbears-live/bin/youtube-lovable-compositor.sh /opt/fgbears-live/bin/youtube-question-mask.py /opt/fgbears-live/bin/youtube-transport-watchdog.sh /opt/fgbears-live/bin/youtube-audio-watchdog-owner-aware.sh /opt/fgbears-live/bin/youtube-relay.sh /opt/fgbears-live/bin/youtube-relay-legacy.sh /opt/fgbears-live/bin/youtube-stream-router.py /opt/fgbears-live/bin/youtube-stream-router-v5.py /opt/fgbears-live/bin/youtube-compositor-source-relay.sh /opt/fgbears-live/bin/finalize-youtube-only.py)
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }; nr(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          conn(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }
          systemctl is-active --quiet "$MASTER"; systemctl is-active --quiet "$RUMBLE"
          M0=$(pid "$MASTER"); R0=$(pid "$RUMBLE"); MN0=$(nr "$MASTER"); RN0=$(nr "$RUMBLE"); conn "$R0" 1935
          QBASE=/opt/fgbears-live/quarantine/retired-youtube; QROOT=$(find "$QBASE" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n1); [[ -n "$QROOT" ]]
          failures=0
          for u in "${RETIRED_UNITS[@]}"; do
            state=$(systemctl is-enabled "$u" 2>/dev/null || true)
            [[ "$state" == masked* ]] || { echo "FAIL unit_not_masked=$u state=$state"; failures=$((failures+1)); }
            ! systemctl is-active --quiet "$u" || { echo "FAIL unit_active=$u"; failures=$((failures+1)); }
            [[ -L "/etc/systemd/system/$u" && "$(readlink "/etc/systemd/system/$u")" == /dev/null ]] || { echo "FAIL mask_link=$u"; failures=$((failures+1)); }
            p=$(pid "$u"); [[ -z "$p" || "$p" == 0 ]] || { echo "FAIL retired_pid=$u pid=$p"; failures=$((failures+1)); }
          done
          for f in "${RETIRED_FILES[@]}"; do [[ ! -e "$f" && ! -L "$f" ]] || { echo "FAIL retired_file_present=$f"; failures=$((failures+1)); }; done
          [[ "$(pid "$MASTER")" == "$M0" && "$(nr "$MASTER")" == "$MN0" ]] || { echo FAIL_MASTER_CHANGED; failures=$((failures+1)); }
          [[ "$(pid "$RUMBLE")" == "$R0" && "$(nr "$RUMBLE")" == "$RN0" ]] || { echo FAIL_RUMBLE_CHANGED; failures=$((failures+1)); }
          conn "$R0" 1935 || { echo FAIL_RUMBLE_SOCKET; failures=$((failures+1)); }
          YA=$(systemctl is-active "$YOUTUBE" 2>/dev/null || true); YP=$(pid "$YOUTUBE"); YR=$(nr "$YOUTUBE"); Y443=no; [[ "$YA" == active ]] && conn "$YP" 443 && Y443=yes || true
          [[ "$failures" -eq 0 ]]
          echo "QUARANTINE_VERIFY=PASS archive=$QROOT master=$M0 rumble=$R0 current_youtube=$YP restarts=$YR active=$YA youtube_443=$Y443"
          REMOTE
