name: Deploy FGBears Shared Program

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/fgbears-live/**'
      - '!services/fgbears-live/youtube-v2/**'
      - '!services/fgbears-live/quarantine/**'
      - '!services/fgbears-live/bin/install.sh'
      - '!services/fgbears-live/bin/youtube-*'
      - '!services/fgbears-live/bin/finalize-youtube-only.py'
      - '!services/fgbears-live/systemd/fgbears-youtube-*'
      - '!services/fgbears-live/tests/test-youtube-*'

permissions:
  contents: read

concurrency:
  group: fgbears-shared-production-deploy
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  deploy-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate shared deployment boundary
        run: |
          set -Eeuo pipefail
          bash -n services/fgbears-live/bin/install.sh
          bash -n services/fgbears-live/bin/start-stream.sh
          bash -n services/fgbears-live/bin/rumble-relay.sh
          ! grep -Eq 'install .*youtube-relay|enable .*youtube-relay|restart .*youtube-relay' services/fgbears-live/bin/install.sh
          ! grep -Eq 'install .*youtube-audio-watchdog|enable .*youtube-audio-watchdog|restart .*youtube-audio-watchdog' services/fgbears-live/bin/install.sh
          grep -Fq 'systemctl enable fgbears-youtube-v2.service' services/fgbears-live/bin/install.sh
          echo 'SHARED_DEPLOY_BOUNDARY=PASS'

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Install shared program without touching YouTube v2
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }

          youtube_before=$(pid fgbears-youtube-v2.service)
          [[ "$youtube_before" =~ ^[1-9][0-9]*$ ]] || { echo "YouTube v2 is not active"; exit 1; }

          rm -rf /tmp/fgbears-shared-deploy
          git clone --depth 1 https://github.com/mrkenapierce/FGB-Production-Studio.git /tmp/fgbears-shared-deploy

          sudo bash /tmp/fgbears-shared-deploy/services/fgbears-live/bin/install.sh

          sudo systemctl reset-failed fgbears-live.service fgbears-rumble-relay.service
          sudo systemctl restart fgbears-live.service
          sudo systemctl restart fgbears-rumble-relay.service

          for _ in $(seq 1 30); do
            if systemctl is-active --quiet fgbears-live.service &&
               systemctl is-active --quiet fgbears-rumble-relay.service &&
               systemctl is-active --quiet fgbears-youtube-v2.service; then
              break
            fi
            sleep 1
          done

          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-rumble-relay.service
          systemctl is-active --quiet fgbears-youtube-v2.service

          youtube_after=$(pid fgbears-youtube-v2.service)
          test "$youtube_after" = "$youtube_before" || {
            echo "Shared deployment changed YouTube v2 PID: $youtube_before -> $youtube_after" >&2
            exit 1
          }

          for unit in \
            fgbears-youtube-output.service \
            fgbears-youtube-relay.service \
            fgbears-youtube-router.service \
            fgbears-youtube-lovable-routing.service \
            fgbears-youtube-lovable-compositor.service \
            fgbears-youtube-audio-watchdog.service \
            fgbears-youtube-audio-watchdog.timer
          do
            state=$(systemctl is-enabled "$unit" 2>/dev/null || true)
            [[ "$state" == masked* ]] || { echo "Legacy unit not masked: $unit ($state)" >&2; exit 1; }
          done

          echo "SHARED_DEPLOY=PASS youtube_v2_pid_unchanged=$youtube_after"
          REMOTE
