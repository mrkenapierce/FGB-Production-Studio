name: Deploy FGBears Live Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to run the guarded production deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fgbears-live-production-deploy
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit deployment confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = 'DEPLOY'

      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Require Oracle deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" || { echo 'Missing ORACLE_HOST secret'; exit 1; }
          test -n "$ORACLE_SSH_KEY" || { echo 'Missing ORACLE_SSH_KEY secret'; exit 1; }

      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Package selected repository revision
        run: |
          set -Eeuo pipefail
          tar -czf /tmp/fgbears-live-release.tgz \
            services/fgbears-live \
            renderer/assets/epic-logo-for-qr.base64.txt

      - name: Preflight current production owner and preserve Rumble PID
        id: preflight
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/oracle_key /tmp/fgbears-live-release.tgz "$ORACLE_USER@$ORACLE_HOST:/tmp/fgbears-live-release.tgz"
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-rumble-relay.service
          systemctl is-active --quiet fgbears-youtube-lovable-routing.service
          systemctl is-active --quiet fgbears-youtube-lovable-compositor.service
          if systemctl is-active --quiet fgbears-youtube-relay.service; then
            echo 'Legacy YouTube relay unexpectedly owns transport; refusing full deploy.' >&2
            exit 1
          fi
          for port in 8787 8788 8789; do
            curl --silent --fail --max-time 2 "http://127.0.0.1:${port}/healthz" >/dev/null
          done
          master_pid=$(systemctl show -p MainPID --value fgbears-live.service)
          rumble_pid=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          youtube_pid=$(systemctl show -p MainPID --value fgbears-youtube-lovable-compositor.service)
          [[ "$master_pid" =~ ^[1-9][0-9]*$ ]]
          [[ "$rumble_pid" =~ ^[1-9][0-9]*$ ]]
          [[ "$youtube_pid" =~ ^[1-9][0-9]*$ ]]
          sudo ss -ntpH state established | grep -q "pid=$rumble_pid" || {
            echo 'Rumble relay has no established transport socket; refusing deployment.' >&2
            exit 1
          }
          sudo ss -ntpH state established | grep -q "pid=$youtube_pid" || {
            echo 'YouTube compositor has no established transport socket; refusing deployment.' >&2
            exit 1
          }
          printf '%s\n' "$rumble_pid" > /tmp/fgbears-rumble-pid-before-deploy
          echo 'PREFLIGHT=PASS master+routing+exact-box+Rumble healthy; legacy relay inactive'
          REMOTE

      - name: Install selected revision with guarded rollback
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          release=/tmp/fgbears-live-release
          backup=/srv/fgbears-live/runtime/deploy-backup-$(date -u +%Y%m%dT%H%M%SZ)
          sudo rm -rf "$release"
          mkdir -p "$release"
          tar -xzf /tmp/fgbears-live-release.tgz -C "$release"

          sudo mkdir -p "$backup/usr-local-bin" "$backup/systemd"
          sudo cp -a /opt/fgbears-live "$backup/opt-fgbears-live"
          sudo cp -a /etc/fgbears-live/stream.env "$backup/stream.env"
          while IFS= read -r path; do sudo cp -a "$path" "$backup/usr-local-bin/"; done < <(find /usr/local/bin -maxdepth 1 -type f -name 'fgbears-*' -print)
          while IFS= read -r path; do sudo cp -a "$path" "$backup/systemd/"; done < <(find /etc/systemd/system -maxdepth 1 -type f -name 'fgbears-*.service' -o -name 'fgbears-*.timer')

          rollback() {
            rc=$?
            trap - ERR
            echo "Deployment failed; restoring previous exact-box production files." >&2
            sudo rm -rf /opt/fgbears-live
            sudo cp -a "$backup/opt-fgbears-live" /opt/fgbears-live
            sudo cp -a "$backup/stream.env" /etc/fgbears-live/stream.env
            sudo find /usr/local/bin -maxdepth 1 -type f -name 'fgbears-*' -delete
            sudo cp -a "$backup/usr-local-bin/." /usr/local/bin/
            sudo find /etc/systemd/system -maxdepth 1 -type f \( -name 'fgbears-*.service' -o -name 'fgbears-*.timer' \) -delete
            sudo cp -a "$backup/systemd/." /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl disable --now fgbears-youtube-relay.service >/dev/null 2>&1 || true
            sudo systemctl enable fgbears-youtube-lovable-routing.service fgbears-youtube-lovable-compositor.service >/dev/null 2>&1 || true
            sudo systemctl restart fgbears-live.service || true
            sudo systemctl restart fgbears-youtube-lovable-routing.service || true
            sudo systemctl restart fgbears-youtube-lovable-compositor.service || true
            exit "$rc"
          }
          trap rollback ERR

          sudo bash "$release/services/fgbears-live/bin/install.sh"
          # One controlled master restart loads any renderer/master changes. The
          # independent Rumble relay itself is never restarted by this workflow.
          sudo systemctl enable fgbears-live.service >/dev/null
          sudo systemctl restart fgbears-live.service

          for _ in $(seq 1 60); do
            if systemctl is-active --quiet fgbears-live.service \
              && systemctl is-active --quiet fgbears-rumble-relay.service \
              && systemctl is-active --quiet fgbears-youtube-lovable-routing.service \
              && systemctl is-active --quiet fgbears-youtube-lovable-compositor.service \
              && ! systemctl is-active --quiet fgbears-youtube-relay.service \
              && curl --silent --fail --max-time 1 http://127.0.0.1:8787/healthz >/dev/null \
              && curl --silent --fail --max-time 1 http://127.0.0.1:8788/healthz >/dev/null \
              && curl --silent --fail --max-time 1 http://127.0.0.1:8789/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-rumble-relay.service
          systemctl is-active --quiet fgbears-youtube-lovable-routing.service
          systemctl is-active --quiet fgbears-youtube-lovable-compositor.service
          ! systemctl is-active --quiet fgbears-youtube-relay.service

          rumble_before=$(cat /tmp/fgbears-rumble-pid-before-deploy)
          rumble_after=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          test "$rumble_after" = "$rumble_before"

          crawl_health=$(curl --silent --fail --max-time 3 http://127.0.0.1:8788/healthz)
          news_health=$(curl --silent --fail --max-time 3 http://127.0.0.1:8789/healthz)
          printf '%s' "$crawl_health" | jq -e '.ok == true and .fps == 30' >/dev/null
          printf '%s' "$news_health" | jq -e '.ok == true and .fps == 30 and .scrollPps == 76 and .payloadSwap == "next-cycle-boundary"' >/dev/null

          youtube_pid=$(systemctl show -p MainPID --value fgbears-youtube-lovable-compositor.service)
          [[ "$youtube_pid" =~ ^[1-9][0-9]*$ ]]
          youtube_args=$(mktemp)
          sudo tr '\0' '\n' < "/proc/$youtube_pid/cmdline" > "$youtube_args"
          grep -Fq 'udp://127.0.0.1:1939' "$youtube_args"
          grep -Fxq '48000' "$youtube_args"
          grep -Fq 'aresample=48000:async=1:first_pts=0' "$youtube_args"
          grep -Fq 'scale=640:360:flags=fast_bilinear' "$youtube_args"
          grep -Fq 'overlay=231:52:format=auto:shortest=1' "$youtube_args"
          rm -f "$youtube_args"
          sudo ss -ntpH state established | grep -q "pid=$youtube_pid"

          sudo systemctl start fgbears-live-health.service
          sudo systemctl is-failed --quiet fgbears-live-health.service && exit 1 || true

          trap - ERR
          # Keep only the three newest rollback snapshots.
          mapfile -t old_backups < <(find /srv/fgbears-live/runtime -maxdepth 1 -type d -name 'deploy-backup-*' -printf '%T@ %p\n' | sort -nr | tail -n +4 | cut -d' ' -f2-)
          if ((${#old_backups[@]})); then sudo rm -rf "${old_backups[@]}"; fi
          echo 'DEPLOY=PASS exact-box YouTube primary, native-48k audio, deterministic 30fps tickers, Rumble PID preserved'
          REMOTE

      - name: Final read-only architecture report
        if: success()
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          printf 'master=%s\n' "$(systemctl is-active fgbears-live.service)"
          printf 'rumble=%s\n' "$(systemctl is-active fgbears-rumble-relay.service)"
          printf 'youtube_routing=%s\n' "$(systemctl is-active fgbears-youtube-lovable-routing.service)"
          printf 'youtube_exact_box=%s\n' "$(systemctl is-active fgbears-youtube-lovable-compositor.service)"
          printf 'youtube_legacy_fallback=%s\n' "$(systemctl is-active fgbears-youtube-relay.service || true)"
          printf 'audio_watchdog_timer=%s\n' "$(systemctl is-active fgbears-youtube-audio-watchdog.timer)"
          printf 'health_timer=%s\n' "$(systemctl is-active fgbears-live-health.timer)"
          REMOTE
