name: Inspect Minimal YouTube Connection

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/fgbears-live-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          install -d -m700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Read current state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -u
          units=(fgbears-live.service fgbears-rumble-relay.service fgbears-youtube-output.service fgbears-youtube-lovable-routing.service fgbears-youtube-lovable-compositor.service)
          for u in "${units[@]}"; do
            echo "UNIT $u load=$(systemctl show -p LoadState --value "$u" 2>/dev/null || true) active=$(systemctl is-active "$u" 2>/dev/null || true) pid=$(systemctl show -p MainPID --value "$u" 2>/dev/null || true) restarts=$(systemctl show -p NRestarts --value "$u" 2>/dev/null || true)"
          done
          echo SOCKETS
          ss -ntpH state established 2>/dev/null | grep -E ':(1935|443)' || true
          echo YOUTUBE_JOURNAL
          journalctl -u fgbears-youtube-output.service --since '10 minutes ago' --no-pager 2>/dev/null | tail -n 120 || true
          echo MASTER_PROGRESS
          tail -n 12 /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true
          REMOTE
