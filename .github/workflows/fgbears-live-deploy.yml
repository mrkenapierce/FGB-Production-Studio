name: Deploy FGBears Shared Program

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-shared-production-deploy
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  deploy-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate current YouTube-only deployment boundary
        run: |
          set -Eeuo pipefail
          bash -n services/fgbears-live/bin/install.sh
          bash -n services/fgbears-live/bin/start-stream.sh
          bash -n services/fgbears-live/bin/healthcheck.sh
          bash -n services/fgbears-live/bin/youtube-copy-relay.sh
          ! grep -Eq 'systemctl (enable|start|restart).*fgbears-rumble' services/fgbears-live/bin/install.sh
          ! grep -Eq 'systemctl (enable|start|restart).*fgbears-youtube-(v2|v3|router|output|relay|lovable|dynamic|freeze)' services/fgbears-live/bin/install.sh
          ! grep -Eq 'fgbears-normalize|normalize-library|normalize-resilient' services/fgbears-live/bin/install.sh
          grep -Fq 'fgbears-youtube-copy-relay.service' services/fgbears-live/bin/install.sh
          echo 'CURRENT_TOPOLOGY_BOUNDARY=PASS'

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Install files without restarting live media
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          master_before=$(pid fgbears-live.service)
          youtube_before=$(pid fgbears-youtube-copy-relay.service)
          [[ "$master_before" =~ ^[1-9][0-9]*$ ]] || { echo 'Master is not active' >&2; exit 1; }
          [[ "$youtube_before" =~ ^[1-9][0-9]*$ ]] || { echo 'YouTube copy relay is not active' >&2; exit 1; }

          rm -rf /tmp/fgbears-shared-deploy
          git clone --depth 1 https://github.com/mrkenapierce/FGB-Production-Studio.git /tmp/fgbears-shared-deploy
          sudo bash /tmp/fgbears-shared-deploy/services/fgbears-live/bin/install.sh

          master_after=$(pid fgbears-live.service)
          youtube_after=$(pid fgbears-youtube-copy-relay.service)
          test "$master_after" = "$master_before" || { echo "Installer restarted master: $master_before -> $master_after" >&2; exit 1; }
          test "$youtube_after" = "$youtube_before" || { echo "Installer restarted YouTube: $youtube_before -> $youtube_after" >&2; exit 1; }

          [[ "$(systemctl is-enabled fgbears-rumble-relay.service 2>/dev/null || true)" == masked* ]] || { echo 'Rumble is not masked' >&2; exit 1; }
          for unit in fgbears-youtube-v2.service fgbears-youtube-v3.service fgbears-youtube-output.service fgbears-youtube-relay.service fgbears-youtube-router.service fgbears-youtube-lovable-routing.service fgbears-youtube-lovable-compositor.service fgbears-youtube-audio-watchdog.service fgbears-youtube-audio-watchdog.timer; do
            [[ "$(systemctl is-enabled "$unit" 2>/dev/null || true)" == masked* ]] || { echo "Retired unit not masked: $unit" >&2; exit 1; }
          done
          echo "SHARED_INSTALL=PASS master_pid_unchanged=$master_after youtube_pid_unchanged=$youtube_after"
          REMOTE
