name: Inspect Thin YouTube Path

on:
  push:
    paths:
      - '.github/workflows/inspect-thin-youtube-path.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Read only production inspection
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -u
          # Post-cutover-safe inspection: reads process/service state only.
          redact() { sed -E 's#(youtube\.com/live2/)[^ |]+#\1[REDACTED]#g; s#(rumble\.com/live/)[^ |]+#\1[REDACTED]#g'; }
          units=(fgbears-live.service fgbears-rumble-relay.service fgbears-youtube-relay.service fgbears-youtube-router.service fgbears-youtube-dynamic-card.service fgbears-youtube-lovable-compositor.service fgbears-youtube-lovable-routing.service)
          for u in "${units[@]}"; do
            echo "=== $u ==="
            systemctl show "$u" -p ActiveState -p SubState -p MainPID -p NRestarts -p UnitFileState -p ExecStart --no-pager 2>/dev/null | redact || true
            pid=$(systemctl show -p MainPID --value "$u" 2>/dev/null || true)
            if [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then
              ps -p "$pid" -o pid=,ppid=,etime=,%cpu=,%mem=,rss=,comm= || true
            fi
          done
          echo '=== all ffmpeg processes ==='
          ps -eo pid=,ppid=,etime=,%cpu=,%mem=,rss=,args= | grep '[f]fmpeg' | redact || true
          echo '=== all established streaming sockets ==='
          sudo ss -ntpH state established 2>/dev/null | grep -E ':(443|1935)([[:space:]]|$)' | redact || true
          echo '=== host ==='
          uptime
          free -m
          echo '=== compositor health ==='
          curl -fsS --max-time 3 http://127.0.0.1:8791/healthz || true
          echo
          echo 'inspection_generation=4'
          REMOTE
