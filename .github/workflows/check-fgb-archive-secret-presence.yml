name: Check FGB Archive Secret Presence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-fgb-archive-secret-presence.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY }}
          FALLBACK_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$DEPLOY_KEY"
          if [ -z "$key" ]; then key="$FALLBACK_KEY"; fi
          test -n "$key"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null

      - name: Verify hourly archive runtime without exposing credentials
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key ubuntu@40.160.144.185 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/fgb-transport
          key=$(sudo sed -n 's/^FGB_ARCHIVE_API_KEY=//p' .env | tail -1)
          test -n "$key"
          code=$(curl -sS -o /tmp/archive-bridge.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "x-fgb-archive-key: $key" \
            --data '{"action":"token"}' \
            https://epiccontentcreatorgrants.org/api/public/fgbears/archive)
          echo "ARCHIVE_BEARER_HTTP=$code"
          if [ "$code" = 200 ] && grep -q '"accessToken"' /tmp/archive-bridge.json; then
            echo 'ARCHIVE_BEARER_BRIDGE_OK=yes'
          else
            echo 'ARCHIVE_BEARER_BRIDGE_OK=no'
          fi
          rm -f /tmp/archive-bridge.json

          live=$(sudo docker compose --env-file .env exec -T youtube sh -lc 'cat /tmp/fgb-transport.state 2>/dev/null || true')
          echo "LIVE_STATE=${live:-unknown}"
          youtube_id=$(sudo docker compose --env-file .env ps -q youtube)
          echo "YOUTUBE_RESTARTS=$(sudo docker inspect -f '{{.RestartCount}}' "$youtube_id")"

          archive_id=$(sudo docker compose --env-file .env ps -q archive_uploader)
          echo "ARCHIVE_UPLOADER_CONTAINER_PRESENT=$([ -n "$archive_id" ] && echo yes || echo no)"
          if [ -n "$archive_id" ]; then
            echo "ARCHIVE_UPLOADER_STATUS=$(sudo docker inspect -f '{{.State.Status}}' "$archive_id")"
            echo "ARCHIVE_UPLOADER_RESTARTS=$(sudo docker inspect -f '{{.RestartCount}}' "$archive_id")"
          fi

          echo "HOST_PATCH_KEY=$(sudo grep -c 'archive_key = env' archive-uploader.py || true)"
          echo "HOST_PATCH_HEADER=$(sudo grep -c 'x-fgb-archive-key' archive-uploader.py || true)"
          printf 'CONTAINER_PATCH_COUNTS='
          sudo docker compose --env-file .env exec -T archive_uploader sh -lc "printf '%s,' \"\$(grep -c 'archive_key = env' ./archive-uploader.py 2>/dev/null || true)\"; grep -c 'x-fgb-archive-key' ./archive-uploader.py 2>/dev/null || true" || true

          echo "HOURLY_FILES=$(sudo find /srv/fgb-archive/hourly -maxdepth 1 -type f -name 'live-*.ts' 2>/dev/null | wc -l)"
          echo "FINAL_FILES=$(sudo find /srv/fgb-archive/final -maxdepth 1 -type f 2>/dev/null | wc -l)"
          echo "STATE_FILES=$(sudo find /srv/fgb-archive/state -maxdepth 1 -type f -name 'hourly-*.json' 2>/dev/null | wc -l)"

          echo '=== AUTH CHECK ==='
          sudo docker compose --env-file .env exec -T archive_uploader python3 ./archive-uploader.py --check-auth 2>&1 | sed -E 's/(accessToken|Bearer)[^ ]*/[REDACTED]/Ig' || true
          echo '=== RECENT UPLOADER LOG ==='
          sudo docker compose --env-file .env logs --tail=80 archive_uploader 2>&1 | sed -E 's/(accessToken|Bearer)[^ ]*/[REDACTED]/Ig' | tail -80 || true
          echo '=== RECENT ARCHIVE STATES ==='
          sudo find /srv/fgb-archive/state -maxdepth 1 -type f -name 'hourly-*.json' -printf '%f\n' 2>/dev/null | sort | tail -12
          REMOTE
