name: Check FGB Archive Secret Presence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-fgb-archive-secret-presence.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY }}
          FALLBACK_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$DEPLOY_KEY"
          if [ -z "$key" ]; then key="$FALLBACK_KEY"; fi
          test -n "$key"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null

      - name: Check presence only
        env:
          ARCHIVE_SECRET: ${{ secrets.FGB_TRANSPORT_HEARTBEAT_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$ARCHIVE_SECRET" ]; then echo 'GITHUB_ARCHIVE_SECRET=set'; else echo 'GITHUB_ARCHIVE_SECRET=missing'; fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key ubuntu@40.160.144.185 "if grep -q '^FGB_TRANSPORT_HEARTBEAT_SECRET=..' /opt/fgb-transport/.env; then echo 'OVH_ARCHIVE_SECRET=set'; else echo 'OVH_ARCHIVE_SECRET=missing'; fi"
