name: Check FGB Archive Secret Presence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-fgb-archive-secret-presence.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY }}
          FALLBACK_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$DEPLOY_KEY"
          if [ -z "$key" ]; then key="$FALLBACK_KEY"; fi
          test -n "$key"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null

      - name: Verify bridge without exposing secret
        env:
          ARCHIVE_SECRET: ${{ secrets.FGB_TRANSPORT_HEARTBEAT_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$ARCHIVE_SECRET" ]; then echo 'GITHUB_ARCHIVE_SECRET=set'; else echo 'GITHUB_ARCHIVE_SECRET=missing'; fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key ubuntu@40.160.144.185 'bash -s' <<'REMOTE'
          set -euo pipefail
          secret=$(sudo sed -n 's/^FGB_TRANSPORT_HEARTBEAT_SECRET=//p' /opt/fgb-transport/.env | tail -1)
          if [ -z "$secret" ]; then
            echo 'OVH_ARCHIVE_SECRET=missing'
            exit 0
          fi
          echo 'OVH_ARCHIVE_SECRET=set'
          body='{"action":"token"}'
          ts=$(date +%s)
          sig=$(printf '%s.%s' "$ts" "$body" | openssl dgst -sha256 -hmac "$secret" -hex | awk '{print $NF}')
          code=$(curl -sS -o /tmp/fgb-archive-token-response.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "x-fgb-timestamp: $ts" \
            -H "x-fgb-signature: $sig" \
            --data "$body" \
            https://epiccontentcreatorgrants.org/api/public/fgbears/archive || true)
          echo "ARCHIVE_SIGNED_BRIDGE_HTTP=$code"
          if [ "$code" = 200 ] && grep -q '"accessToken"' /tmp/fgb-archive-token-response.json; then
            echo 'ARCHIVE_SIGNED_BRIDGE_OK=yes'
          else
            echo 'ARCHIVE_SIGNED_BRIDGE_OK=no'
          fi
          rm -f /tmp/fgb-archive-token-response.json
          REMOTE
