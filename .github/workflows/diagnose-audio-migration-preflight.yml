# Progress sample: status check 2026-08-26T23:latest
name: Diagnose FGB Audio Migration Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-audio-migration-preflight.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Read migration progress
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE' | tee progress.txt
          set -u
          echo '=== services ==='
          systemctl is-active fgbears-live.service || true
          systemctl is-active fgbears-youtube-relay.service || true
          echo '=== audio filter ==='
          sudo grep -E '^PODCAST_AUDIO_FILTER=' /etc/fgbears-live/stream.env || true
          echo '=== retired social runtime ==='
          if sudo grep -Eq '^(X_|INSTAGRAM_|FACEBOOK_)' /etc/fgbears-live/stream.env; then echo SOCIAL_ENV_PRESENT; else echo SOCIAL_ENV_NONE; fi
          if grep -Eq '1937|1938|X local mirror|Instagram local mirror|Facebook local mirror' /usr/local/bin/fgbears-start-stream; then echo SOCIAL_OUTPUT_REFERENCES_PRESENT; else echo SOCIAL_OUTPUT_REFERENCES_NONE; fi
          echo '=== library progress ==='
          media_count=$(find /srv/fgbears-live/media -maxdepth 1 -type f -name '*.mp4' | wc -l | tr -d ' ')
          marker_count=$(find /srv/fgbears-live/media -maxdepth 1 -type f -name '*.mp4.audio-profile.json' | wc -l | tr -d ' ')
          echo "media_count=$media_count"
          echo "profile_marker_count=$marker_count"
          echo '=== cpu headroom ==='
          echo "nproc=$(nproc)"
          uptime
          ps -eo pid,ni,pcpu,pmem,comm,args --sort=-pcpu | head -n 12
          echo '=== current normalization work ==='
          find /srv/fgbears-live/.audio-migration -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true
          pgrep -af 'normalize-library|loudnorm|ffmpeg' | tail -n 8 || true
          REMOTE
      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: fgb-audio-migration-progress
          path: progress.txt
          retention-days: 1
