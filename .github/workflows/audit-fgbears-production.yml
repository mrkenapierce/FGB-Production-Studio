name: Deploy Minimal Rumble + YouTube Topology

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/audit-fgbears-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-minimal-output-cutover
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lovable-routing-bridge-20260902
      - name: Validate minimal topology
        run: |
          set -Eeuo pipefail
          bash -n services/fgbears-live/bin/youtube-output-minimal.sh
          python3 -m py_compile services/fgbears-live/bin/youtube-overlay-stream.py
          grep -Fq -- '-c:a copy' services/fgbears-live/bin/youtube-output-minimal.sh
          grep -Fq -- 'overlay=462:104' services/fgbears-live/bin/youtube-output-minimal.sh
          grep -Fq -- 'video_size 798x470' services/fgbears-live/bin/youtube-output-minimal.sh
          grep -Fq -- '-c copy' services/fgbears-live/bin/rumble-relay.sh
      - name: Stage minimal YouTube branch
        run: |
          set -Eeuo pipefail
          install -d -m700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          scp -i ~/.ssh/oracle_key services/fgbears-live/bin/youtube-output-minimal.sh "$target:/tmp/youtube-output-minimal.sh"
          scp -i ~/.ssh/oracle_key services/fgbears-live/bin/youtube-overlay-stream.py "$target:/tmp/youtube-overlay-stream.py"
          scp -i ~/.ssh/oracle_key services/fgbears-live/systemd/fgbears-youtube-output.service "$target:/tmp/fgbears-youtube-output.service"
      - name: Cut over YouTube only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          M=fgbears-live.service
          R=fgbears-rumble-relay.service
          N=fgbears-youtube-output.service
          OLD=(fgbears-youtube-audio-watchdog.timer fgbears-youtube-audio-watchdog.service fgbears-youtube-lovable-compositor.service fgbears-youtube-lovable-routing.service fgbears-youtube-relay.service fgbears-youtube-router.service)
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          nr(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          conn(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }

          systemctl is-active --quiet "$M"
          systemctl is-active --quiet "$R"
          M0=$(pid "$M"); R0=$(pid "$R"); MN0=$(nr "$M"); RN0=$(nr "$R")
          conn "$R0" 1935
          echo "PRE master=$M0 rumble=$R0"

          install -m0755 /tmp/youtube-output-minimal.sh /opt/fgbears-live/bin/youtube-output-minimal.sh
          install -m0755 /tmp/youtube-overlay-stream.py /opt/fgbears-live/bin/youtube-overlay-stream.py
          install -m0644 /tmp/fgbears-youtube-output.service /etc/systemd/system/fgbears-youtube-output.service

          # Stop only destination-specific legacy machinery. Shared master and
          # Rumble are never stopped or restarted in this cutover.
          for u in "${OLD[@]}"; do systemctl stop "$u" 2>/dev/null || true; done
          systemctl daemon-reload
          systemctl enable "$N"
          systemctl reset-failed "$N" || true
          systemctl restart "$N"

          for _ in $(seq 1 35); do
            NP=$(pid "$N")
            if systemctl is-active --quiet "$N" && conn "$NP" 443; then break; fi
            sleep 1
          done
          NP=$(pid "$N")
          systemctl is-active --quiet "$N"
          conn "$NP" 443

          # Exactly one YouTube sender may own an established 443 connection.
          owners=$(ss -ntpH state established 2>/dev/null | awk '/:443/ && /ffmpeg/{n++} END{print n+0}')
          [[ "$owners" -eq 1 ]]

          [[ "$(pid "$M")" == "$M0" && "$(pid "$R")" == "$R0" ]]
          [[ "$(nr "$M")" == "$MN0" && "$(nr "$R")" == "$RN0" ]]
          conn "$R0" 1935

          # Prove the single YouTube service stays up and connected through a
          # short sustained hold instead of accepting a momentary connection.
          for _ in $(seq 1 12); do
            [[ "$(pid "$N")" == "$NP" ]]
            systemctl is-active --quiet "$N"
            conn "$NP" 443
            [[ "$(pid "$M")" == "$M0" && "$(pid "$R")" == "$R0" ]]
            sleep 2
          done

          # Permanently remove competing automatic owners from the live host.
          for u in "${OLD[@]}"; do
            systemctl disable "$u" >/dev/null 2>&1 || true
            systemctl mask --runtime "$u" >/dev/null 2>&1 || true
          done

          cpu=$(ps -p "$NP" -o %cpu= | awk '{print $1+0}')
          speed=$(awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v);if(v!="")print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true)
          echo "MINIMAL_TOPOLOGY=PASS master=$M0 rumble=$R0 youtube=$NP cpu=${cpu}% speed=${speed:-unknown}x audio=master-copy overlay=inline"
          REMOTE
