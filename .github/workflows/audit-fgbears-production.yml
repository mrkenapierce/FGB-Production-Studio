name: Deploy YouTube Frozen-Output Watchdog

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/audit-fgbears-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-watchdog-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lovable-routing-bridge-20260902
      - name: Validate watchdog source
        run: |
          set -Eeuo pipefail
          bash -n services/fgbears-live/bin/youtube-transport-watchdog.sh
          grep -Fq 'compositor_pid_changed' services/fgbears-live/bin/youtube-transport-watchdog.sh
          grep -Fq 'monitor_not_advancing' services/fgbears-live/bin/youtube-transport-watchdog.sh
      - name: Configure SSH and stage
        run: |
          set -Eeuo pipefail
          install -d -m700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          scp -i ~/.ssh/oracle_key services/fgbears-live/bin/youtube-transport-watchdog.sh "$target:/tmp/youtube-transport-watchdog.sh"
          scp -i ~/.ssh/oracle_key services/fgbears-live/systemd/fgbears-youtube-audio-watchdog.service "$target:/tmp/fgbears-youtube-audio-watchdog.service"
          scp -i ~/.ssh/oracle_key services/fgbears-live/systemd/fgbears-youtube-audio-watchdog.timer "$target:/tmp/fgbears-youtube-audio-watchdog.timer"
      - name: Install and certify self-healing watchdog
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          M=fgbears-live.service; R=fgbears-rumble-relay.service; C=fgbears-youtube-lovable-compositor.service; Q=fgbears-youtube-lovable-routing.service; T=fgbears-youtube-audio-watchdog.timer; S=fgbears-youtube-audio-watchdog.service
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }; nr(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          conn(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }
          latest(){ find /run/fgbears-youtube-lovable-compositor -maxdepth 1 -type f -name 'monitor-*.ts' -printf '%T@ %s %p\n' 2>/dev/null | sort -nr | head -n1; }
          M0=$(pid "$M"); R0=$(pid "$R"); MN0=$(nr "$M"); RN0=$(nr "$R")
          systemctl is-active --quiet "$M"; systemctl is-active --quiet "$R"; conn "$R0" 1935
          install -m0755 /tmp/youtube-transport-watchdog.sh /opt/fgbears-live/bin/youtube-transport-watchdog.sh
          install -m0644 /tmp/fgbears-youtube-audio-watchdog.service /etc/systemd/system/fgbears-youtube-audio-watchdog.service
          install -m0644 /tmp/fgbears-youtube-audio-watchdog.timer /etc/systemd/system/fgbears-youtube-audio-watchdog.timer
          systemctl daemon-reload
          systemctl enable --now "$T"
          mkdir -p /run/fgbears-youtube-transport-watchdog
          echo "$(pid "$C")" > /run/fgbears-youtube-transport-watchdog/last-compositor-pid
          systemctl start "$S"
          systemctl is-active --quiet "$T"
          systemctl is-active --quiet "$C"; systemctl is-active --quiet "$Q"
          CP=$(pid "$C"); conn "$CP" 443
          [[ "$(pid "$M")" == "$M0" && "$(pid "$R")" == "$R0" ]] || exit 40
          [[ "$(nr "$M")" == "$MN0" && "$(nr "$R")" == "$RN0" ]] || exit 41
          a=$(latest); sleep 8; b=$(latest); [[ -n "$a" && -n "$b" && "$a" != "$b" ]]
          seg=${b##* }
          ffprobe -v fatal -show_entries stream=codec_type,width,height,r_frame_rate -of json "$seg" | python3 -c 'import json,sys;p=json.load(sys.stdin);v=next(x for x in p["streams"] if x.get("codec_type")=="video");assert (v["width"],v["height"],v["r_frame_rate"])==(1280,720,"30/1")'
          echo "WATCHDOG_TIMER=$(systemctl is-active "$T")"
          echo "WATCHDOG_LAST_RUN=$(journalctl -u "$S" -n 8 --no-pager | tail -n 8 | tr '\n' ' ')"
          echo "YOUTUBE_SELF_HEAL=PASS master=$M0 rumble=$R0 compositor=$CP output=1280x720/30"
          REMOTE
