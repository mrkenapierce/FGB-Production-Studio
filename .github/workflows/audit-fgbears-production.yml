name: Deploy YouTube Direct Master Audio

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/audit-fgbears-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-audio-repair
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lovable-routing-bridge-20260902
      - name: Validate direct-audio source
        run: |
          set -Eeuo pipefail
          bash -n services/fgbears-live/bin/youtube-lovable-compositor.sh
          grep -Fq -- '-c:a copy' services/fgbears-live/bin/youtube-lovable-compositor.sh
          ! grep -Fq -- '-af ' services/fgbears-live/bin/youtube-lovable-compositor.sh
          ! grep -Fq -- '-ar ' services/fgbears-live/bin/youtube-lovable-compositor.sh
      - name: Configure SSH and stage
        run: |
          set -Eeuo pipefail
          install -d -m700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          scp -i ~/.ssh/oracle_key services/fgbears-live/bin/youtube-lovable-compositor.sh "$target:/tmp/youtube-lovable-compositor.sh.audio"
      - name: Install and certify YouTube audio passthrough
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          M=fgbears-live.service; R=fgbears-rumble-relay.service; C=fgbears-youtube-lovable-compositor.service; Q=fgbears-youtube-lovable-routing.service; T=fgbears-youtube-audio-watchdog.timer; L=fgbears-youtube-relay.service
          SCRIPT=/opt/fgbears-live/bin/youtube-lovable-compositor.sh
          MON=/run/fgbears-youtube-lovable-compositor
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          nr(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          conn(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }
          latest_complete(){ find "$MON" -maxdepth 1 -type f -name 'monitor-*.ts' -printf '%T@ %p\n' 2>/dev/null | sort -nr | sed -n '2{s/^[^ ]* //;p;q;}'; }

          systemctl is-active --quiet "$M"; systemctl is-active --quiet "$R"; systemctl is-active --quiet "$Q"
          M0=$(pid "$M"); R0=$(pid "$R"); MN0=$(nr "$M"); RN0=$(nr "$R")
          conn "$R0" 1935
          ! systemctl is-active --quiet "$L"

          backup=$(mktemp /tmp/yt-comp-audio.XXXXXX)
          cp -a "$SCRIPT" "$backup"
          ok=0
          rollback(){ rc=$?; if ((ok==0)); then echo "ROLLBACK_YOUTUBE_AUDIO rc=$rc" >&2; install -m0755 "$backup" "$SCRIPT"; systemctl reset-failed "$C" || true; systemctl restart "$C" || true; systemctl start "$T" || true; fi; rm -f "$backup" /tmp/youtube-lovable-compositor.sh.audio; exit "$rc"; }
          trap rollback EXIT

          systemctl stop "$T" 2>/dev/null || true
          install -m0755 /tmp/youtube-lovable-compositor.sh.audio "$SCRIPT"
          systemctl reset-failed "$C" || true
          systemctl restart "$C"
          for _ in $(seq 1 30); do
            CP=$(pid "$C")
            systemctl is-active --quiet "$C" && conn "$CP" 443 && break
            sleep 1
          done
          CP=$(pid "$C"); systemctl is-active --quiet "$C"; conn "$CP" 443
          [[ "$(pid "$M")" == "$M0" && "$(pid "$R")" == "$R0" ]]
          [[ "$(nr "$M")" == "$MN0" && "$(nr "$R")" == "$RN0" ]]
          conn "$R0" 1935

          seg=''
          for _ in $(seq 1 20); do seg=$(latest_complete || true); [[ -n "$seg" && -s "$seg" ]] && break; sleep 1; done
          test -s "$seg"
          probe=$(ffprobe -v fatal -count_packets -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels,nb_read_packets -of json "$seg")
          printf '%s' "$probe" | python3 -c 'import json,sys;p=json.load(sys.stdin);s=p["streams"];v=next(x for x in s if x.get("codec_type")=="video");a=next(x for x in s if x.get("codec_type")=="audio");assert (v["width"],v["height"],v["r_frame_rate"])==(1280,720,"30/1");assert a["codec_name"]=="aac";assert str(a["sample_rate"])=="48000";assert a["channels"]==2;assert int(a.get("nb_read_packets") or 0)>20'
          vol=$(ffmpeg -nostdin -hide_banner -i "$seg" -vn -af volumedetect -f null - 2>&1 | awk -F': ' '/max_volume:/{print $2}' | tail -n1 || true)
          echo "YOUTUBE_AUDIO_MONITOR max_volume=${vol:-unknown}"

          mkdir -p /run/fgbears-youtube-transport-watchdog
          echo "$CP" > /run/fgbears-youtube-transport-watchdog/last-compositor-pid
          systemctl start "$T"
          sleep 2
          systemctl is-active --quiet "$T"
          ! systemctl is-active --quiet "$L"
          speed=$(awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v);if(v!="")print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true)
          echo "YOUTUBE_DIRECT_AUDIO=PASS master=$M0 rumble=$R0 compositor=$CP audio=AAC/48000/2 passthrough=copy speed=${speed:-unknown}x"
          ok=1
          trap - EXIT
          rm -f "$backup" /tmp/youtube-lovable-compositor.sh.audio
          REMOTE
