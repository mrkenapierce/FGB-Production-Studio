name: Audit FGBears Production

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/audit-fgbears-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Measure production YouTube branch read only
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          ROUTING=fgbears-youtube-lovable-routing.service
          COMP=fgbears-youtube-lovable-compositor.service
          LEGACY=fgbears-youtube-relay.service
          MONDIR=/run/fgbears-youtube-lovable-compositor
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          nr(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          connected(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }

          M=$(pid "$MASTER"); R=$(pid "$RUMBLE"); Q=$(pid "$ROUTING"); C=$(pid "$COMP")
          echo "PIDS master=$M rumble=$R routing=$Q compositor=$C legacy=$(pid "$LEGACY")"
          echo "RESTARTS master=$(nr "$MASTER") rumble=$(nr "$RUMBLE") routing=$(nr "$ROUTING") compositor=$(nr "$COMP")"
          connected "$R" 1935 && echo RUMBLE_SOCKET=PASS || echo RUMBLE_SOCKET=FAIL
          connected "$C" 443 && echo YOUTUBE_SOCKET=PASS || echo YOUTUBE_SOCKET=FAIL
          speed=$(awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v);if(v!="")print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true)
          echo "MASTER_SPEED=${speed:-unknown}x"

          local_health=$(curl -fsS --max-time 3 http://127.0.0.1:8791/healthz)
          echo "$local_health" | python3 -c 'import json,sys;p=json.load(sys.stdin);print("MASK_HEALTH",json.dumps({k:p.get(k) for k in ["active","phase","lastGoodAgeSeconds","lastError","canvas","sourceMaskRegion","maskRegion","frameSize","fps","failClosedDuringQuestion"]},sort_keys=True))'

          routing=$(curl -fsS --max-time 5 'https://epiccontentcreatorgrants.org/api/public/fgbears/stream-routing?_audit=1')
          echo "$routing" | python3 -c '
import json,sys
p=json.load(sys.stdin); t=p.get("trivia") or {}
keys=["phase","youtubeMaskActive","adsVisible","isAdBreak","adBreakActive","questionStartedAt","questionEndsAt","phaseStartedAt","phaseEndsAt","nextPhaseAt","secondsRemaining","questionVisible","presentation"]
print("ROUTING_TRIVIA",json.dumps({k:t.get(k) for k in keys if k in t},sort_keys=True,default=str))
print("ROUTING_KEYS",sorted(t.keys()))
'

          SEG=$(find "$MONDIR" -maxdepth 1 -type f -name 'monitor-*.ts' -printf '%T@ %p\n' 2>/dev/null | sort -nr | sed -n '2{s/^[^ ]* //;p;q;}')
          [[ -n "$SEG" && -s "$SEG" ]] || { echo MONITOR_SEGMENT=FAIL; exit 1; }
          echo "MONITOR_SEGMENT=$SEG"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,sample_aspect_ratio,display_aspect_ratio,sample_rate,channels,time_base -of json "$SEG" \
            | python3 -c 'import json,sys;p=json.load(sys.stdin);print("AV_PROBE",json.dumps(p,sort_keys=True))'

          crop=$(ffmpeg -hide_banner -loglevel info -i "$SEG" -vf 'cropdetect=24:2:0' -frames:v 50 -an -f null - 2>&1 | grep -oE 'crop=[0-9]+:[0-9]+:[0-9]+:[0-9]+' | tail -n1 || true)
          echo "CROP_DETECT=${crop:-none}"

          ffprobe -v error -select_streams v:0 -show_entries frame=best_effort_timestamp_time -of csv=p=0 "$SEG" > /tmp/pts.txt
          python3 - <<'PY'
from pathlib import Path
xs=[]
for s in Path('/tmp/pts.txt').read_text().splitlines():
    try: xs.append(float(s.strip().split(',')[0]))
    except: pass
ds=[b-a for a,b in zip(xs,xs[1:]) if b>=a]
if not ds:
    print('FRAME_PACING=unavailable')
else:
    ds2=sorted(ds)
    def pct(p): return ds2[min(len(ds2)-1,int((len(ds2)-1)*p))]
    bad=sum(abs(d-1/30)>0.004 for d in ds)
    print(f'FRAME_PACING frames={len(xs)} median={pct(.5):.6f} p95={pct(.95):.6f} max={max(ds):.6f} bad_intervals={bad}/{len(ds)}')
PY

          echo "COMPOSITOR_CPU_SAMPLES_BEGIN"
          max=0
          for _ in $(seq 1 10); do
            cpu=$(ps -p "$C" -o %cpu= 2>/dev/null | awk '{print $1+0}')
            echo "$cpu"
            max=$(python3 -c 'import sys;print(max(float(sys.argv[1]),float(sys.argv[2])))' "$max" "$cpu")
            sleep 1
          done
          echo "COMPOSITOR_CPU_MAX=${max}%"

          faults=$(journalctl -u "$COMP" --since '10 minutes ago' --no-pager 2>/dev/null | grep -Eci 'Circular buffer overrun|timestamp discontinuity|Packet corrupt|Non-monotonous DTS|Invalid DTS|Queue input is backward in time|Broken pipe|Connection reset by peer|frame=.*dup=.*drop=' || true)
          echo "COMPOSITOR_FAULT_LINES_10M=$faults"
          journalctl -u "$COMP" --since '10 minutes ago' --no-pager 2>/dev/null | grep -Ei 'Circular buffer overrun|timestamp discontinuity|Packet corrupt|Non-monotonous DTS|Invalid DTS|Queue input is backward in time|Broken pipe|Connection reset by peer|frame=.*dup=.*drop=' | tail -n 30 || true
          echo AUDIT_COMPLETE=YES
          REMOTE
