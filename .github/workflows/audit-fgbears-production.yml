name: Finalize Minimal Production Topology

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/audit-fgbears-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-minimal-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lovable-routing-bridge-20260902
      - name: Validate minimal master
        run: |
          set -Eeuo pipefail
          bash -n services/fgbears-live/bin/start-stream.sh
          bash -n services/fgbears-live/bin/youtube-output-minimal.sh
          python3 -m py_compile services/fgbears-live/bin/youtube-overlay-stream.py
          ! grep -Fq 'use_fifo' services/fgbears-live/bin/start-stream.sh
          ! grep -Fq 'YOUTUBE_STREAM_KEY:?' services/fgbears-live/bin/start-stream.sh
          grep -Fq -- '-c:a copy' services/fgbears-live/bin/youtube-output-minimal.sh
      - name: Stage files
        run: |
          set -Eeuo pipefail
          install -d -m700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          scp -i ~/.ssh/oracle_key services/fgbears-live/bin/start-stream.sh "$target:/tmp/start-stream.minimal.sh"
          scp -i ~/.ssh/oracle_key services/fgbears-live/systemd/fgbears-youtube-output.service "$target:/tmp/fgbears-youtube-output.service"
      - name: Install simplified master and certify
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          M=fgbears-live.service; R=fgbears-rumble-relay.service; Y=fgbears-youtube-output.service
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          nr(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          conn(){ local p=$1 port=$2; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'; }

          systemctl is-active --quiet "$M"; systemctl is-active --quiet "$R"; systemctl is-active --quiet "$Y"
          M0=$(pid "$M"); R0=$(pid "$R"); Y0=$(pid "$Y"); RN0=$(nr "$R"); YN0=$(nr "$Y")
          conn "$R0" 1935; conn "$Y0" 443

          cp -a /usr/local/bin/fgbears-start-stream /tmp/fgbears-start-stream.pre-minimal
          install -m0755 /tmp/start-stream.minimal.sh /usr/local/bin/fgbears-start-stream
          install -m0755 /tmp/start-stream.minimal.sh /opt/fgbears-live/bin/start-stream.sh
          install -m0644 /tmp/fgbears-youtube-output.service /etc/systemd/system/fgbears-youtube-output.service
          systemctl daemon-reload
          systemctl reset-failed "$M" || true
          systemctl restart "$M"

          for _ in $(seq 1 35); do
            M1=$(pid "$M")
            speed=$(awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v);if(v!="")print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true)
            if systemctl is-active --quiet "$M" && [[ "$M1" != 0 && "$M1" != "$M0" ]] && [[ -n "$speed" ]]; then
              awk -v s="$speed" 'BEGIN{exit(s>=0.985?0:1)}' && break
            fi
            sleep 1
          done
          M1=$(pid "$M"); [[ "$M1" != 0 && "$M1" != "$M0" ]]
          speed=$(awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v);if(v!="")print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true)
          awk -v s="$speed" 'BEGIN{exit(s>=0.985?0:1)}'

          # Destination services must survive the master restart. Their upstream
          # sessions remain untouched; only the local packet source changed.
          [[ "$(pid "$R")" == "$R0" && "$(pid "$Y")" == "$Y0" ]]
          [[ "$(nr "$R")" == "$RN0" && "$(nr "$Y")" == "$YN0" ]]
          conn "$R0" 1935; conn "$Y0" 443

          # Purge old service-manager ownership paths from the live host.
          old_units=(fgbears-youtube-relay.service fgbears-youtube-router.service fgbears-youtube-lovable-routing.service fgbears-youtube-lovable-compositor.service fgbears-youtube-audio-watchdog.service fgbears-youtube-audio-watchdog.timer)
          for u in "${old_units[@]}"; do systemctl stop "$u" 2>/dev/null || true; systemctl disable "$u" >/dev/null 2>&1 || true; rm -f "/etc/systemd/system/$u"; done
          rm -f /usr/local/bin/fgbears-youtube-relay /usr/local/bin/fgbears-youtube-audio-watchdog
          rm -f /opt/fgbears-live/bin/youtube-lovable-compositor.sh /opt/fgbears-live/bin/youtube-question-mask.py /opt/fgbears-live/bin/youtube-transport-watchdog.sh /opt/fgbears-live/bin/youtube-relay.sh /opt/fgbears-live/bin/youtube-relay-legacy.sh /opt/fgbears-live/bin/youtube-stream-router.py /opt/fgbears-live/bin/youtube-stream-router-v5.py /opt/fgbears-live/bin/youtube-compositor-source-relay.sh
          systemctl daemon-reload

          # Final topology must be exactly three streaming services.
          systemctl is-active --quiet "$M"; systemctl is-active --quiet "$R"; systemctl is-active --quiet "$Y"
          for u in "${old_units[@]}"; do ! systemctl is-active --quiet "$u"; done
          owners=$(ss -ntpH state established 2>/dev/null | awk '/:443/ && /ffmpeg/{n++} END{print n+0}')
          [[ "$owners" -eq 1 ]]
          cpu=$(ps -p "$Y0" -o %cpu= | awk '{print $1+0}')
          echo "MINIMAL_FINAL=PASS master=$M1 rumble=$R0 youtube=$Y0 speed=${speed}x youtube_cpu=${cpu}% services=3"
          REMOTE
