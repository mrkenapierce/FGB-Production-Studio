name: Inspect Public YouTube Playback Sizing

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/audit-fgbears-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install playback inspection tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet --disable-pip-version-check yt-dlp
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Inspect public live rendition
        shell: bash
        run: |
          set -Eeuo pipefail
          Y='https://www.youtube.com/watch?v=QxmLpaargj0'
          echo 'FORMATS_BEGIN'
          yt-dlp --no-warnings -F "$Y" | tail -n 35
          echo 'FORMATS_END'
          url=$(yt-dlp --no-warnings -g -f 'best[protocol^=m3u8][height<=720]/best[height<=720]/best' "$Y" | head -n1)
          test -n "$url"
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate,avg_frame_rate,sample_aspect_ratio,display_aspect_ratio -of json "$url" | tee public-probe.json
          ffmpeg -nostdin -hide_banner -loglevel error -i "$url" -frames:v 1 -y youtube-public-frame.png
          test -s youtube-public-frame.png
          crop=$(ffmpeg -nostdin -hide_banner -loglevel info -i "$url" -vf 'cropdetect=24:2:0' -frames:v 45 -an -f null - 2>&1 | grep -oE 'crop=[0-9]+:[0-9]+:[0-9]+:[0-9]+' | tail -n1 || true)
          echo "PUBLIC_CROP=${crop:-none}"
      - name: Upload public playback evidence
        uses: actions/upload-artifact@v4
        with:
          name: youtube-public-playback-frame
          path: |
            youtube-public-frame.png
            public-probe.json
          if-no-files-found: error
          retention-days: 1
