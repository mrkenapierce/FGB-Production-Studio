name: Audit FGBears Production

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/audit-fgbears-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Capture production evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          COMP=fgbears-youtube-lovable-compositor.service
          MONDIR=/run/fgbears-youtube-lovable-compositor
          C=$(systemctl show -p MainPID --value "$COMP")
          echo "COMP_PID=$C"
          echo "COMP_CPU=$(ps -p "$C" -o %cpu= | awk '{print $1+0}')"
          echo "MASTER_SPEED=$(awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v);if(v!="")print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log)x"
          SEG=$(find "$MONDIR" -maxdepth 1 -type f -name 'monitor-*.ts' -printf '%T@ %p\n' | sort -nr | sed -n '2{s/^[^ ]* //;p;q;}')
          test -s "$SEG"
          /usr/bin/ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate,avg_frame_rate,sample_aspect_ratio,display_aspect_ratio,sample_rate,channels -of json "$SEG" | python3 -c 'import json,sys;print("PROBE",json.dumps(json.load(sys.stdin),sort_keys=True))'
          crop=$(ffmpeg -nostdin -hide_banner -loglevel info -i "$SEG" -vf 'cropdetect=24:2:0' -frames:v 55 -an -f null - 2>&1 | grep -oE 'crop=[0-9]+:[0-9]+:[0-9]+:[0-9]+' | tail -n1 || true)
          echo "CROP=${crop:-none}"
          /usr/bin/ffprobe -v error -select_streams v:0 -show_entries frame=best_effort_timestamp_time -of csv=p=0 "$SEG" >/tmp/pts.txt
          python3 -c 'from pathlib import Path; xs=[float(s.split(",")[0]) for s in Path("/tmp/pts.txt").read_text().splitlines() if s.strip()]; ds=[b-a for a,b in zip(xs,xs[1:]) if b>=a]; d=sorted(ds); print("PACING unavailable" if not d else f"PACING frames={len(xs)} median={d[len(d)//2]:.6f} p95={d[min(len(d)-1,int((len(d)-1)*.95))]:.6f} max={max(d):.6f} bad={sum(abs(x-1/30)>.004 for x in d)}/{len(d)}")'
          ffmpeg -nostdin -hide_banner -loglevel error -ss 1 -i "$SEG" -frames:v 1 -y /tmp/youtube-live-frame.png
          chmod 0644 /tmp/youtube-live-frame.png
          faults=0
          faults=$(journalctl -u "$COMP" --since '30 minutes ago' --no-pager 2>/dev/null | grep -Eci 'Circular buffer overrun|timestamp discontinuity|Packet corrupt|Non-monotonous DTS|Invalid DTS|Queue input is backward in time|Broken pipe|Connection reset by peer|dropping frame|dup=' || true)
          echo "FAULT_LINES_30M=$faults"
          journalctl -u "$COMP" --since '30 minutes ago' --no-pager 2>/dev/null | grep -Ei 'Circular buffer overrun|timestamp discontinuity|Packet corrupt|Non-monotonous DTS|Invalid DTS|Queue input is backward in time|Broken pipe|Connection reset by peer|dropping frame|dup=' | tail -n 40 || true
          REMOTE
          scp -i ~/.ssh/oracle_key "$target:/tmp/youtube-live-frame.png" youtube-live-frame.png

      - name: Upload live frame
        uses: actions/upload-artifact@v4
        with:
          name: youtube-live-frame
          path: youtube-live-frame.png
          if-no-files-found: error
          retention-days: 1
