name: Emergency Rollback Lovable Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-rollback-lovable-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Restore pre-activation audio and disable auto-sync
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          STATE=/srv/fgbears-live/runtime/lovable-audio-sync.json
          AUDIO=/srv/fgbears-live/audio/fgb-music-loop.m4a
          MASTER=fgbears-live.service

          test -s "$STATE"
          rollback=$(python3 - <<'PY'
          import json
          with open('/srv/fgbears-live/runtime/lovable-audio-sync.json') as f:
              s=json.load(f)
          print(s.get('rollbackBackup') or '')
          PY
          )
          test -n "$rollback"
          test -s "$rollback"

          echo "ROLLBACK_SOURCE=$rollback"
          echo "DISABLING_AUTO_SYNC"
          sudo systemctl disable --now fgbears-lovable-audio-sync.timer || true

          mapfile -t destinations < <(
            systemctl list-units --type=service --state=running --no-legend --no-pager 'fgbears-*' \
              | awk '{print $1}' | grep -E 'youtube|rumble|facebook|relay|uplink' || true
          )

          sudo cp -a "$AUDIO" "${AUDIO}.dragging-incident-$(date -u +%Y%m%dT%H%M%SZ)"
          sudo install -o fgbears -g fgbears -m 0644 "$rollback" "${AUDIO}.rollback"
          sudo mv -f "${AUDIO}.rollback" "$AUDIO"

          echo "RESTORED_AUDIO_METADATA:"
          ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels:format=duration \
            -of default=noprint_wrappers=1 "$AUDIO"

          sudo systemctl restart "$MASTER"
          for i in $(seq 1 60); do
            if systemctl is-active --quiet "$MASTER"; then
              master_pid=$(systemctl show -p MainPID --value "$MASTER")
              ffpid=$(pgrep -P "$master_pid" -x ffmpeg | head -1 || true)
              if [ -n "$ffpid" ] && sudo ls -l "/proc/$ffpid/fd" 2>/dev/null | grep -Fq "$AUDIO"; then
                break
              fi
            fi
            sleep 1
          done

          systemctl is-active --quiet "$MASTER"
          master_pid=$(systemctl show -p MainPID --value "$MASTER")
          ffpid=$(pgrep -P "$master_pid" -x ffmpeg | head -1)
          sudo ls -l "/proc/$ffpid/fd" | grep -F "$AUDIO"

          sleep 8
          progress=$(awk -F= '/^out_time_ms=/{v=$2} END{print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log)
          test "$progress" -gt 0

          missing=0
          for unit in "${destinations[@]}"; do
            if ! systemctl is-active --quiet "$unit"; then
              echo "DESTINATION_NOT_ACTIVE=$unit" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

          echo "ROLLBACK=PASS"
          echo "AUTO_SYNC=DISABLED"
          echo "MASTER_PROGRESS_US=$progress"
          printf 'PRESERVED_DESTINATION=%s\n' "${destinations[@]}"
          REMOTE
