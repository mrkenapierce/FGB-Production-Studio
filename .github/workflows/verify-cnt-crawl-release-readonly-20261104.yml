name: Verify CNT Crawl Release Readonly
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/verify-cnt-crawl-release-readonly-20261104.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: OVH key
        env:
          KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ovh
          chmod 600 ~/.ssh/ovh
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null
      - name: Read only live page asset and animation health
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/ovh ubuntu@40.160.144.185 'sudo docker exec -i epic-cnt-capture python3 -' <<'PY'
          import urllib.request,re,json,sys,datetime
          from urllib.parse import urljoin
          page='https://epiccontentcreatorgrants.org/channels/cruisenewstrivia/broadcast'
          print('CHECKED_AT='+datetime.datetime.now(datetime.timezone.utc).isoformat())
          try:
            req=urllib.request.Request(page,headers={'User-Agent':'CNT-Verification/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=15) as x:
              html=x.read(1200000).decode('utf-8','replace')
              print('SITE_HTTP_STATUS='+str(x.status))
            scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',html)
            print('BUNDLE_SCRIPT_COUNT='+str(len(scripts)))
            found={}
            for part in scripts[:12]:
              url=urljoin(page,part)
              if not url.startswith('https://epiccontentcreatorgrants.org/'):continue
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'CNT-Verification/1.0'}),timeout=20) as x:
                b=x.read(12000000)
              for token in (b'crawlMotionContinuity',b'tickerRebaseTimeMs',b'backfaceVisibility',b'cnt-broadcast'):
                if token in b:found[token.decode()]=True
            print('RELEASE_MARKERS='+json.dumps(found,sort_keys=True))
          # Vite splits routes into dynamically imported chunks; inspect script graph read-only.
          import collections
          queue=collections.deque(urljoin(page,x) for x in scripts)
          seen=set()
          founddeep={}
          while queue and len(seen)<90:
            url=queue.popleft()
            if url in seen or not url.startswith('https://epiccontentcreatorgrants.org/assets/'):continue
            seen.add(url)
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'CNT-Verification/1.0'}),timeout=10) as resp:
                b=resp.read(6000000)
              for token in (b'crawlMotionContinuity',b'backfaceVisibility',b'cnt-broadcast',b'tickerRebaseTimeMs'):
                if token in b:founddeep[token.decode()]=True
              for child in re.findall(rb'["\\\'](\\.?/assets/[^"\\\']+?\\.js)["\\\']',b):
                queue.append(urljoin(page,child.decode()))
              for child in re.findall(rb'["\\\'](\\.?/[^"\\\']+?\\.js)["\\\']',b):
                queue.append(urljoin(url,child.decode()))
            except Exception:pass
          print('SCANNED_ASSET_COUNT='+str(len(seen)))
          print('RELEASE_MARKERS_DEEP='+json.dumps(founddeep,sort_keys=True))
          except Exception as e:
            print('SITE_ASSET_CHECK_UNAVAILABLE='+type(e).__name__+':'+str(e)[:200])
          PY
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/ovh ubuntu@40.160.144.185 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          echo "CAPTURE_IMAGE=$(docker inspect -f '{{.Config.Image}}' epic-cnt-capture)"
          echo "CAPTURE_HEALTH=$(docker inspect -f '{{.State.Health.Status}}' epic-cnt-capture)"
          echo 'CURRENT_WATCHDOG_STATUS'
          docker exec epic-cnt-capture python3 /opt/cnt/capture-watchdog.py cnt status | python3 -c 'import json,sys; x=json.load(sys.stdin); print({k:x.get(k) for k in ("action","reason","restarts_total","consecutive_failures","alert")})'
          REMOTE
