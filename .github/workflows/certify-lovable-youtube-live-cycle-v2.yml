name: Certify Lovable YouTube Live Cycle V2

on:
  push:
    paths:
      - '.github/workflows/certify-lovable-youtube-live-cycle-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read-only certify one real trivia cycle
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROUTING_URL='https://epiccontentcreatorgrants.org/api/public/fgbears/stream-routing'
          HEALTH_URL='http://127.0.0.1:8791/healthz'
          OVERLAY_URL='http://127.0.0.1:8791/overlay.rgba'
          MONITOR_DIR='/run/fgbears-youtube-lovable-compositor'

          state() { systemctl is-active "$1" 2>/dev/null || true; }
          pid() { systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          restarts() { systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          unit_ffmpeg() {
            local cg p c
            cg=$(systemctl show -p ControlGroup --value "$1" 2>/dev/null || true)
            [[ -n "$cg" ]] || return 1
            for p in $(cat "/sys/fs/cgroup${cg}/cgroup.procs" 2>/dev/null || true); do
              c=$(cat "/proc/$p/comm" 2>/dev/null || true)
              [[ "$c" == ffmpeg ]] && { echo "$p"; return 0; }
            done
            return 1
          }
          closed_monitor_after() {
            local ffpid="$1" since="$2" candidate=''
            for _ in $(seq 1 12); do
              candidate=$(python3 -c 'import os,sys; from pathlib import Path; root=Path(sys.argv[1]); pid=sys.argv[2]; since=float(sys.argv[3]); opened=set(); fdroot=Path("/proc")/pid/"fd"; [opened.add(str(fd.resolve())) for fd in list(fdroot.iterdir()) if fd.exists()] if fdroot.exists() else None; c=[]; [(c.append((p.stat().st_mtime,str(p)))) for p in root.glob("monitor-*.ts") if p.exists() and p.stat().st_size>=50000 and p.stat().st_mtime>=since and str(p.resolve()) not in opened]; print(max(c)[1] if c else "")' "$MONITOR_DIR" "$ffpid" "$since" 2>/dev/null || true)
              if [[ -n "$candidate" && -s "$candidate" ]]; then printf '%s' "$candidate"; return 0; fi
              sleep 1
            done
            return 1
          }
          encoded_contract() {
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json "$1" | python3 -c 'import json,sys; p=json.load(sys.stdin); s=p.get("streams",[]); v=next((x for x in s if x.get("codec_type")=="video"),None); a=next((x for x in s if x.get("codec_type")=="audio"),None); assert v and v.get("codec_name")=="h264" and v.get("width")==640 and v.get("height")==360 and v.get("r_frame_rate") in ("30/1","60/2"),v; assert a and a.get("codec_name")=="aac" and a.get("sample_rate")=="44100" and a.get("channels")==2,a; print("ENCODED_CONTRACT=PASS")'
          }
          moving_bands() {
            local f="$1" n c
            n=$(ffmpeg -hide_banner -loglevel error -i "$f" -map 0:v:0 -vf 'crop=640:52:0:0' -an -f framemd5 - | awk '!/^#/ {print $NF}' | sort -u | wc -l)
            c=$(ffmpeg -hide_banner -loglevel error -i "$f" -map 0:v:0 -vf 'crop=640:73:0:287' -an -f framemd5 - | awk '!/^#/ {print $NF}' | sort -u | wc -l)
            echo "rss_unique_frames=$n crawl_unique_frames=$c"
            (( n >= 2 && c >= 2 ))
            echo 'RSS_AND_CRAWL_MOTION=PASS'
          }

          master0=$(pid fgbears-live.service)
          rumble0=$(pid fgbears-rumble-relay.service)
          comp0=$(pid fgbears-youtube-lovable-compositor.service)
          route0=$(pid fgbears-youtube-lovable-routing.service)
          ff0=$(unit_ffmpeg fgbears-youtube-lovable-compositor.service || true)
          cr0=$(restarts fgbears-youtube-lovable-compositor.service)
          rr0=$(restarts fgbears-youtube-lovable-routing.service)

          echo "master=$(state fgbears-live.service) pid=$master0"
          echo "rumble=$(state fgbears-rumble-relay.service) pid=$rumble0"
          echo "compositor=$(state fgbears-youtube-lovable-compositor.service) pid=$comp0 ffmpeg=$ff0 restarts=$cr0"
          echo "routing=$(state fgbears-youtube-lovable-routing.service) pid=$route0 restarts=$rr0"
          [[ "$(state fgbears-live.service)" == active && "$(state fgbears-rumble-relay.service)" == active && "$(state fgbears-youtube-lovable-compositor.service)" == active && "$(state fgbears-youtube-lovable-routing.service)" == active ]]
          [[ "$master0" =~ ^[1-9][0-9]*$ && "$rumble0" =~ ^[1-9][0-9]*$ && "$comp0" =~ ^[1-9][0-9]*$ && "$route0" =~ ^[1-9][0-9]*$ && "$ff0" =~ ^[1-9][0-9]*$ ]]

          sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$ff0" | grep -Eq ':443([[:space:]]|$)'
          echo 'YOUTUBE_RTMPS=PASS'

          cmd=$(tr '\0' ' ' <"/proc/$ff0/cmdline")
          grep -Fq 'scale=640:360:flags=fast_bilinear' <<<"$cmd"
          grep -Fq 'overlay=231:52:format=auto:shortest=1' <<<"$cmd"
          grep -Fq 'aresample=44100:async=1:first_pts=0' <<<"$cmd"
          echo 'RUNNING_PIPELINE=PASS'

          h=$(curl -fsS --max-time 3 "$HEALTH_URL")
          printf '%s\n' "$h" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p.get("ok") is True,p; assert p.get("canvas")==[640,360],p; assert p.get("routingAuthority")=="lovable_public_stream_routing",p; assert p.get("creativeKey")=="yt_rumble_trivia_redirect",p; assert p.get("sourceMaskRegion")=={"x":462,"y":104,"width":798,"height":470},p; assert p.get("maskRegion")=={"x":231,"y":52,"width":399,"height":235},p; assert p.get("lastError") in (None,""),p; print("LOVABLE_CONTRACT=PASS")'

          t0=$(date +%s)
          base=$(closed_monitor_after "$ff0" "$t0")
          echo "baseline_segment=$base bytes=$(stat -c %s "$base")"
          encoded_contract "$base"

          echo 'waiting_for_question=yes'
          deadline=$((SECONDS+1200)); seen=0
          while (( SECONDS < deadline )); do
            h=$(curl -fsS --max-time 3 "$HEALTH_URL" 2>/dev/null || true)
            if [[ -n "$h" ]] && printf '%s' "$h" | python3 -c 'import json,sys; p=json.load(sys.stdin); raise SystemExit(0 if p.get("active") is True and p.get("phase")=="question" and not p.get("lastError") else 1)' 2>/dev/null; then seen=1; break; fi
            sleep 1
          done
          [[ "$seen" == 1 ]]
          q0=$(date +%s)
          echo 'QUESTION_ACTIVE=PASS'

          remote=$(curl -fsS --max-time 6 -H 'Accept: application/json' -H 'Cache-Control: no-cache' -A 'FGB-Live-Cycle-Certifier/2.0' "${ROUTING_URL}?_ts=$(date +%s%N)")
          printf '%s\n' "$remote" | python3 -c 'import json,sys; t=(json.load(sys.stdin).get("trivia") or {}); assert t.get("youtubeMaskActive") is True,t; assert t.get("phase")=="question",t; assert t.get("stale") is not True,t; assert t.get("adsVisible") is not True,t; assert t.get("isAdBreak") is not True and t.get("adBreakActive") is not True,t; assert t.get("youtubeCreativeKey")=="yt_rumble_trivia_redirect",t; r=t.get("maskRegion") or {}; assert {k:r.get(k) for k in ("x","y","width","height")}=={"x":462,"y":104,"width":798,"height":470},r; print("AUTHORITATIVE_QUESTION_STATE=PASS")'

          python3 -c 'import json,urllib.request; h=json.load(urllib.request.urlopen("http://127.0.0.1:8791/healthz",timeout=3)); w,n=h["frameSize"]; need=w*n*4; r=urllib.request.urlopen("http://127.0.0.1:8791/overlay.rgba",timeout=4); d=r.read(need); r.close(); assert len(d)==need,(len(d),need); a=d[3::4]; ratio=sum(1 for x in a if x)/len(a); assert ratio>.95,ratio; print("ACTIVE_OVERLAY=PASS alpha_ratio=%.4f"%ratio)'

          qs=$(closed_monitor_after "$ff0" "$q0")
          echo "question_segment=$qs bytes=$(stat -c %s "$qs")"
          encoded_contract "$qs"
          moving_bands "$qs"
          sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$ff0" | grep -Eq ':443([[:space:]]|$)'
          echo 'YOUTUBE_RTMPS_DURING_QUESTION=PASS'

          echo 'waiting_for_clear=yes'
          deadline=$((SECONDS+90)); cleared=0
          while (( SECONDS < deadline )); do
            h=$(curl -fsS --max-time 3 "$HEALTH_URL" 2>/dev/null || true)
            if [[ -n "$h" ]] && printf '%s' "$h" | python3 -c 'import json,sys; p=json.load(sys.stdin); raise SystemExit(0 if p.get("active") is False else 1)' 2>/dev/null; then cleared=1; break; fi
            sleep 1
          done
          [[ "$cleared" == 1 ]]
          python3 -c 'import json,urllib.request; h=json.load(urllib.request.urlopen("http://127.0.0.1:8791/healthz",timeout=3)); w,n=h["frameSize"]; need=w*n*4; r=urllib.request.urlopen("http://127.0.0.1:8791/overlay.rgba",timeout=4); d=r.read(need); r.close(); assert len(d)==need,(len(d),need); assert sum(1 for x in d[3::4] if x)==0; print("OVERLAY_CLEAR=PASS")'

          master1=$(pid fgbears-live.service); rumble1=$(pid fgbears-rumble-relay.service); comp1=$(pid fgbears-youtube-lovable-compositor.service); route1=$(pid fgbears-youtube-lovable-routing.service); ff1=$(unit_ffmpeg fgbears-youtube-lovable-compositor.service || true); cr1=$(restarts fgbears-youtube-lovable-compositor.service); rr1=$(restarts fgbears-youtube-lovable-routing.service)
          [[ "$master1" == "$master0" && "$rumble1" == "$rumble0" && "$comp1" == "$comp0" && "$route1" == "$route0" && "$ff1" == "$ff0" && "$cr1" == "$cr0" && "$rr1" == "$rr0" ]]
          sudo ss -ntpH state established 2>/dev/null | grep -F "pid=$ff1" | grep -Eq ':443([[:space:]]|$)'
          echo "master_pid_unchanged=$master1"
          echo "rumble_pid_unchanged=$rumble1"
          echo "compositor_pid_unchanged=$comp1 ffmpeg_pid=$ff1 restarts=$cr1"
          echo "routing_pid_unchanged=$route1 restarts=$rr1"
          echo 'LOVABLE_YOUTUBE_LIVE_CYCLE=PASS'
          REMOTE
