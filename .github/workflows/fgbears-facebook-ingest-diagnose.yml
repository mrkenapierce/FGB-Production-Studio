name: Diagnose FGBears Facebook Ingest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-facebook-ingest-diagnose.yml'

permissions:
  contents: write

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Oracle access secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" || { echo 'Missing ORACLE_HOST secret'; exit 1; }
          test -n "$ORACLE_SSH_KEY" || { echo 'Missing ORACLE_SSH_KEY secret'; exit 1; }

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Trust Oracle host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - id: diagnose
        name: Diagnose live Facebook RTMPS ingest
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' > /tmp/facebook-ingest.env <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/fgbears-live/stream.env

          service_active=false
          facebook_enabled=false
          ffmpeg_active=false
          facebook_socket_established=false
          facebook_slave_failure_recent=false
          ffmpeg_socket_count=0

          if systemctl is-active --quiet fgbears-live.service; then
            service_active=true
          fi
          if sudo grep -Fxq 'FACEBOOK_STREAM_ENABLED=1' "$env_file"; then
            facebook_enabled=true
          fi

          ffmpeg_pid=$(pgrep -o -x ffmpeg || true)
          if [[ -n "$ffmpeg_pid" ]]; then
            ffmpeg_active=true
            sudo ss -ntpH state established | grep "pid=$ffmpeg_pid" > /tmp/fgbears-ffmpeg-sockets.txt || true
            ffmpeg_socket_count=$(wc -l < /tmp/fgbears-ffmpeg-sockets.txt | tr -d ' ')
            getent ahostsv4 live-api-s.facebook.com | awk '{print $1}' | sort -u > /tmp/fgbears-facebook-ips.txt
            while IFS= read -r ip; do
              [[ -n "$ip" ]] || continue
              if grep -Fq "$ip:443" /tmp/fgbears-ffmpeg-sockets.txt; then
                facebook_socket_established=true
                break
              fi
            done < /tmp/fgbears-facebook-ips.txt
          fi

          sudo journalctl -u fgbears-live.service -n 400 --no-pager > /tmp/fgbears-facebook-journal.txt
          if grep -Fq 'Slave muxer #2 failed' /tmp/fgbears-facebook-journal.txt; then
            facebook_slave_failure_recent=true
          fi

          printf 'SERVICE_ACTIVE=%s\n' "$service_active"
          printf 'FACEBOOK_ENABLED=%s\n' "$facebook_enabled"
          printf 'FFMPEG_ACTIVE=%s\n' "$ffmpeg_active"
          printf 'FACEBOOK_SOCKET_ESTABLISHED=%s\n' "$facebook_socket_established"
          printf 'FACEBOOK_SLAVE_FAILURE_RECENT=%s\n' "$facebook_slave_failure_recent"
          printf 'FFMPEG_SOCKET_COUNT=%s\n' "$ffmpeg_socket_count"

          rm -f /tmp/fgbears-ffmpeg-sockets.txt /tmp/fgbears-facebook-ips.txt /tmp/fgbears-facebook-journal.txt
          REMOTE
          cat /tmp/facebook-ingest.env

      - name: Record safe Facebook ingest diagnostic
        if: always()
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/deployment-status
          service_active=false
          facebook_enabled=false
          ffmpeg_active=false
          facebook_socket_established=false
          facebook_slave_failure_recent=false
          ffmpeg_socket_count=0
          if [[ -f /tmp/facebook-ingest.env ]]; then
            while IFS='=' read -r key value; do
              case "$key" in
                SERVICE_ACTIVE) service_active="$value" ;;
                FACEBOOK_ENABLED) facebook_enabled="$value" ;;
                FFMPEG_ACTIVE) ffmpeg_active="$value" ;;
                FACEBOOK_SOCKET_ESTABLISHED) facebook_socket_established="$value" ;;
                FACEBOOK_SLAVE_FAILURE_RECENT) facebook_slave_failure_recent="$value" ;;
                FFMPEG_SOCKET_COUNT) ffmpeg_socket_count="$value" ;;
              esac
            done < /tmp/facebook-ingest.env
          fi
          jq -n \
            --argjson serviceActive "$service_active" \
            --argjson facebookEnabled "$facebook_enabled" \
            --argjson ffmpegActive "$ffmpeg_active" \
            --argjson facebookSocketEstablished "$facebook_socket_established" \
            --argjson facebookSlaveFailureRecent "$facebook_slave_failure_recent" \
            --argjson ffmpegSocketCount "$ffmpeg_socket_count" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runId "$GITHUB_RUN_ID" \
            '{serviceActive:$serviceActive,facebookEnabled:$facebookEnabled,ffmpegActive:$ffmpegActive,facebookSocketEstablished:$facebookSocketEstablished,facebookSlaveFailureRecent:$facebookSlaveFailureRecent,ffmpegEstablishedSocketCount:$ffmpegSocketCount,checkedAt:$checkedAt,runId:$runId}' \
            > .github/deployment-status/fgbears-facebook-ingest.json
          git config user.name 'FGBears Deploy Bot'
          git config user.email 'actions@github.com'
          git add -- .github/deployment-status/fgbears-facebook-ingest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record Facebook ingest diagnostic [skip ci]'
          git push origin main
