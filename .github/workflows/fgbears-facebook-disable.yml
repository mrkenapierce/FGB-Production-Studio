name: Disable FGBears Facebook Simulcast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-facebook-disable.yml'

permissions:
  contents: write

env:
  ORACLE_USER: ubuntu

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - id: disable
        name: Disable Facebook and restart primary encoder only
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/fgbears-live/stream.env
          python3 - "$env_file" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          out=[]; seen=False
          for line in lines:
              if line.startswith("FACEBOOK_STREAM_ENABLED="):
                  out.append("FACEBOOK_STREAM_ENABLED=0")
                  seen=True
              else:
                  out.append(line)
          if not seen:
              out.append("FACEBOOK_STREAM_ENABLED=0")
          path.write_text("\n".join(out)+"\n",encoding="utf-8")
          PY
          chown root:fgbears "$env_file"
          chmod 640 "$env_file"
          grep -Fxq 'FACEBOOK_STREAM_ENABLED=0' "$env_file"
          systemctl reset-failed fgbears-live.service || true
          systemctl restart fgbears-live.service
          systemctl is-active --quiet fgbears-live.service
          REMOTE

      - id: verify
        name: Verify Facebook disabled and X survives
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sudo grep -Fxq 'FACEBOOK_STREAM_ENABLED=0' /etc/fgbears-live/stream.env
          for _ in $(seq 1 60); do
            main_pid=$(systemctl show -p MainPID --value fgbears-live.service)
            ffmpeg_pid=''
            if [[ "$main_pid" =~ ^[1-9][0-9]*$ ]]; then
              ffmpeg_pid=$(pgrep -P "$main_pid" -x ffmpeg | head -1 || true)
            fi
            if [[ -n "$ffmpeg_pid" ]]; then
              sudo ss -ntpH state established | grep "pid=$ffmpeg_pid" > /tmp/fgb-fb-disable-sockets.txt || true
              x_ok=false
              getent ahostsv4 ca.pscp.tv | awk '{print $1}' | sort -u > /tmp/fgb-x-ips.txt || true
              while IFS= read -r ip; do
                [[ -n "$ip" ]] || continue
                grep -Fq "$ip:443" /tmp/fgb-fb-disable-sockets.txt && x_ok=true
              done < /tmp/fgb-x-ips.txt
              if [[ "$x_ok" == true ]]; then
                rm -f /tmp/fgb-fb-disable-sockets.txt /tmp/fgb-x-ips.txt
                echo 'Facebook disabled; X socket established.'
                exit 0
              fi
            fi
            sleep 2
          done
          rm -f /tmp/fgb-fb-disable-sockets.txt /tmp/fgb-x-ips.txt
          echo 'Facebook disabled, but X socket did not establish in the verification window.' >&2
          exit 1
          REMOTE

      - name: Record safe disable result
        if: always()
        env:
          DISABLE_OUTCOME: ${{ steps.disable.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/deployment-status
          jq -n \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg jobStatus "$JOB_STATUS" \
            --arg disableOutcome "$DISABLE_OUTCOME" \
            --arg verifyOutcome "$VERIFY_OUTCOME" \
            '{checkedAt:$checkedAt,runId:$runId,jobStatus:$jobStatus,disableOutcome:$disableOutcome,verifyOutcome:$verifyOutcome,facebookEnabled:false,facebookKeyPreserved:true,primaryRestarted:true,youtubeRelayRestarted:false}' \
            > .github/deployment-status/fgbears-facebook-disable.json
          git config user.name 'FGBears Deploy Bot'
          git config user.email 'actions@github.com'
          git add .github/deployment-status/fgbears-facebook-disable.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Facebook disable result [skip ci]'
          git push origin main
