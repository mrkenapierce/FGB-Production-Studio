name: Test YouTube Dynamic Selector V2

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/test-youtube-dynamic-selector-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read-only selector cycle
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          DIRECT=fgbears-youtube-relay.service
          DYNAMIC=fgbears-youtube-dynamic-card.service
          pid() { systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          systemctl is-active --quiet "$MASTER"
          systemctl is-active --quiet "$RUMBLE"
          systemctl is-active --quiet "$DIRECT"
          systemctl is-active --quiet "$DYNAMIC"
          master0=$(pid "$MASTER")
          rumble0=$(pid "$RUMBLE")
          direct0=$(pid "$DIRECT")

          probe=$(timeout 12 ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of csv=p=0 'udp://127.0.0.1:2942?fifo_size=1000000&overrun_nonfatal=1')
          printf 'DYNAMIC_PROBE=%s\n' "$probe"
          [[ "$probe" == h264,1280,720,10/1* ]]

          synth=/tmp/fgb-youtube-selector-v2-synth.log
          testlog=/tmp/fgb-youtube-selector-v2-router.log
          rm -f "$synth" "$testlog"
          (while true; do cat /opt/fgbears-live/assets/youtube-rumble-trivia.h264; done) | \
            nice -n 19 ffmpeg -hide_banner -nostdin -loglevel error -re -r 30 -f h264 -i pipe:0 \
              -map 0:v:0 -c:v copy -an -mpegts_flags +resend_headers -f mpegts \
              'udp://127.0.0.1:2950?pkt_size=1316' >"$synth" 2>&1 &
          synth_pid=$!
          cleanup() { kill "$synth_pid" >/dev/null 2>&1 || true; wait "$synth_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sleep 2
          timeout 18 env FGB_YOUTUBE_DYNAMIC_CARD_PORT=2942 \
            /usr/bin/python3 /opt/fgbears-live/bin/youtube-stream-router-dynamic.py \
            --input-port 2950 --test --test-cycle 3 --runtime 12 >"$testlog" 2>&1
          cleanup
          trap - EXIT

          cat "$testlog"
          grep -Fq 'video route switched: live -> card' "$testlog"
          grep -Fq 'video route switched: card -> live' "$testlog"
          ! grep -Fq 'GStreamer error' "$testlog"
          test "$(pid "$MASTER")" = "$master0"
          test "$(pid "$RUMBLE")" = "$rumble0"
          test "$(pid "$DIRECT")" = "$direct0"
          systemctl is-active --quiet "$DIRECT"
          echo 'LOCAL_SELECTOR_30_TO_10_TO_30=PASS'
          echo 'PRODUCTION_STREAMS_UNCHANGED=yes'
          REMOTE
