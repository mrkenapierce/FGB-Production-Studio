name: Test FGBears YouTube Stream Router

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/fgbears-live/bin/youtube-stream-router.py'
      - 'services/fgbears-live/tools/build-youtube-rumble-trivia-card.py'
      - '.github/workflows/test-fgbears-youtube-stream-router.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  test-router:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet pillow qrcode

      - name: Build master-compatible card and synthetic MPEG-TS input
        run: |
          mkdir -p /tmp/fgb-router-assets
          python3 services/fgbears-live/tools/build-youtube-rumble-trivia-card.py \
            /tmp/fgb-router-assets/youtube-rumble-trivia.png

          # Match the production master encoder settings. A separately encoded
          # cover can only be switched safely into a copy-only H.264 stream if
          # its decoder configuration is compatible with the master.
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -framerate 30 -i /tmp/fgb-router-assets/youtube-rumble-trivia.png \
            -t 1 -an -c:v libx264 -preset ultrafast -tune zerolatency \
            -profile:v high -b:v 5000k -maxrate 5500k -bufsize 10000k \
            -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 -r 30 -fps_mode cfr \
            -x264-params 'repeat-headers=1:aud=1' \
            -f h264 /tmp/fgb-router-assets/youtube-rumble-trivia.h264

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=1280x720:rate=30' \
            -f lavfi -i 'sine=frequency=880:sample_rate=48000' \
            -t 12 -c:v libx264 -preset ultrafast -tune zerolatency \
            -profile:v high -b:v 5000k -maxrate 5500k -bufsize 10000k \
            -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 -r 30 -fps_mode cfr \
            -c:a aac -b:a 128k -ar 48000 -ac 2 \
            -f mpegts /tmp/fgb-router-assets/synthetic.ts

          echo '--- synthetic master ---'
          ffprobe -v error -show_entries stream=codec_name,profile,level,width,height,pix_fmt,r_frame_rate \
            -of compact /tmp/fgb-router-assets/synthetic.ts
          echo '--- card elementary stream ---'
          ffprobe -v error -f h264 -show_entries stream=codec_name,profile,level,width,height,pix_fmt,r_frame_rate \
            -of compact /tmp/fgb-router-assets/youtube-rumble-trivia.h264
          ls -lh /tmp/fgb-router-assets/*

      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Stage test files
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'rm -rf /tmp/fgb-router-test && mkdir -p /tmp/fgb-router-test'
          scp -i ~/.ssh/oracle_key \
            services/fgbears-live/bin/youtube-stream-router.py \
            /tmp/fgb-router-assets/youtube-rumble-trivia.h264 \
            /tmp/fgb-router-assets/synthetic.ts \
            "$ORACLE_USER@$ORACLE_HOST:/tmp/fgb-router-test/"

      - name: Run isolated packet-switch and timestamp test
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test -x /usr/bin/gst-launch-1.0
          cd /tmp/fgb-router-test
          python3 youtube-stream-router.py \
            --card youtube-rumble-trivia.h264 --validate-card

          # Production test mode normally uses a fakesink. Modify only this
          # disposable /tmp copy so the exact GStreamer mux output can be
          # captured on an unused loopback UDP port. No production file, port,
          # service, stream key, or process is touched by this test.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('youtube-stream-router.py')
          s=p.read_text()
          old='''        if self.test_mode:\n            self.sink = self.make("fakesink", "test_sink")\n            self.sink.set_property("sync", True)\n        else:\n            self.sink = self.make("udpsink", "selected_program_udp")\n            self.sink.set_property("host", "127.0.0.1")\n            self.sink.set_property("port", self.output_port)\n            self.sink.set_property("sync", True)\n            self.sink.set_property("async", False)\n'''
          new='''        if self.test_mode:\n            self.sink = self.make("udpsink", "test_selected_program_udp")\n            self.sink.set_property("host", "127.0.0.1")\n            self.sink.set_property("port", self.output_port)\n            self.sink.set_property("sync", True)\n            self.sink.set_property("async", False)\n        else:\n            self.sink = self.make("udpsink", "selected_program_udp")\n            self.sink.set_property("host", "127.0.0.1")\n            self.sink.set_property("port", self.output_port)\n            self.sink.set_property("sync", True)\n            self.sink.set_property("async", False)\n'''
          if old not in s:
              raise SystemExit('test sink block did not match current router')
          p.write_text(s.replace(old,new,1))
          PY

          cleanup() {
            for pid in "${SENDER_PID:-}" "${CAPTURE_PID:-}"; do
              if [[ "$pid" =~ ^[1-9][0-9]*$ ]]; then kill "$pid" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT

          python3 - <<'PY' >/tmp/fgb-router-test/capture.log 2>&1 &
          import socket,time
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1)
          s.bind(('127.0.0.1',2940)); s.settimeout(.5)
          end=time.monotonic()+11.5; packets=0
          with open('/tmp/fgb-router-test/router-output.ts','wb') as out:
              while time.monotonic()<end:
                  try: data,_=s.recvfrom(65535)
                  except socket.timeout: continue
                  if data:
                      out.write(data); packets += 1
          print('captured_datagrams=',packets)
          if packets < 100: raise SystemExit('insufficient router output capture')
          PY
          CAPTURE_PID=$!

          ffmpeg -hide_banner -nostdin -loglevel error \
            -stream_loop -1 -re -i synthetic.ts \
            -map 0:v:0 -map 0:a:0 -c copy -f mpegts \
            'udp://127.0.0.1:2939?pkt_size=1316' \
            >/tmp/fgb-router-test/sender.log 2>&1 &
          SENDER_PID=$!
          sleep 1

          set +e
          python3 youtube-stream-router.py \
            --input-port 2939 --output-port 2940 \
            --card youtube-rumble-trivia.h264 \
            --test --test-cycle 2 --runtime 10 \
            >/tmp/fgb-router-test/router.log 2>&1
          router_rc=$?
          set -e
          wait "$CAPTURE_PID"
          CAPTURE_PID=
          kill "$SENDER_PID" 2>/dev/null || true
          wait "$SENDER_PID" 2>/dev/null || true
          SENDER_PID=

          cat /tmp/fgb-router-test/router.log
          cat /tmp/fgb-router-test/capture.log
          [[ $router_rc -eq 0 ]]
          grep -q 'linked live video pad' /tmp/fgb-router-test/router.log
          grep -q 'linked live audio pad' /tmp/fgb-router-test/router.log
          grep -q 'video route switched: live -> card' /tmp/fgb-router-test/router.log
          grep -q 'video route switched: card -> live' /tmp/fgb-router-test/router.log
          test -s /tmp/fgb-router-test/router-output.ts

          echo '=== exact GStreamer router output packet health ==='
          ffprobe -v warning -show_entries stream=index,codec_name,codec_type,profile,level,time_base,start_time \
            -of compact /tmp/fgb-router-test/router-output.ts \
            >/tmp/fgb-router-test/probe.out 2>/tmp/fgb-router-test/probe.err
          cat /tmp/fgb-router-test/probe.out
          cat /tmp/fgb-router-test/probe.err
          video_errors=$(grep -Eic 'luma_log2_weight_denom|illegal memory management|PES packet size mismatch|Packet corrupt|corrupt input packet' /tmp/fgb-router-test/probe.err || true)
          echo "router_video_corruption_warnings=$video_errors"

          ffprobe -v error -show_packets -show_entries packet=stream_index,pts_time,dts_time,duration_time,flags \
            -of csv=p=0 /tmp/fgb-router-test/router-output.ts > /tmp/fgb-router-test/router-packets.csv
          python3 - /tmp/fgb-router-test/router-packets.csv <<'PY'
          import csv,sys
          rows={}
          for r in csv.reader(open(sys.argv[1])):
              if len(r)<5: continue
              try: idx=int(r[0]); pts=float(r[1]); dts=float(r[2])
              except: continue
              rows.setdefault(idx,[]).append((pts,dts,r[4]))
          if len(rows)<2: raise SystemExit(f'expected audio+video streams, got {list(rows)}')
          bad=False
          for idx,p in sorted(rows.items()):
              pts_reg=sum(p[i][0] < p[i-1][0]-0.001 for i in range(1,len(p)))
              dts_reg=sum(p[i][1] < p[i-1][1]-0.001 for i in range(1,len(p)))
              pts_lt_dts=sum(x[0] < x[1]-0.001 for x in p)
              print(f'stream={idx} packets={len(p)} pts_regressions={pts_reg} dts_regressions={dts_reg} pts_lt_dts={pts_lt_dts}')
              bad = bad or pts_reg or dts_reg or pts_lt_dts
          if bad: raise SystemExit('non-monotonic router timestamps detected')
          PY

          echo '=== exact current YouTube FFmpeg copy/remux ==='
          ffmpeg -hide_banner -nostdin -loglevel warning -y \
            -fflags +genpts -probesize 10000000 -analyzeduration 10000000 \
            -i /tmp/fgb-router-test/router-output.ts \
            -map 0:v:0 -map 0:a:0 -c copy \
            -f flv -flvflags no_duration_filesize /tmp/fgb-router-test/current.flv \
            >/tmp/fgb-router-test/current-remux.log 2>&1
          cat /tmp/fgb-router-test/current-remux.log
          remux_errors=$(grep -Eic 'Invalid timestamps|Non-monotonous DTS|non monotonically increasing dts|luma_log2_weight_denom|illegal memory management|PES packet size mismatch|Packet corrupt|corrupt input packet' /tmp/fgb-router-test/current-remux.log || true)
          echo "remux_corruption_or_timestamp_warnings=$remux_errors"

          test -s /tmp/fgb-router-test/current.flv
          ffmpeg -hide_banner -nostdin -loglevel error -i /tmp/fgb-router-test/current.flv -map 0:a:0 -f null -

          echo '=== production isolation check ==='
          systemctl is-active fgbears-live.service
          systemctl is-active fgbears-youtube-relay.service
          systemctl is-active fgbears-rumble-relay.service
          uptime
          echo 'production_ports_touched=no'

          # The switch is not production-safe unless decoder/remux corruption is
          # completely absent in this exact-settings synthetic test.
          [[ "$video_errors" -eq 0 ]]
          [[ "$remux_errors" -eq 0 ]]
          REMOTE
