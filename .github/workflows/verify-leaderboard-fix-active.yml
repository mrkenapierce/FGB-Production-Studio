name: Verify Leaderboard Fix Active

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-leaderboard-fix-active.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"; test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Verify active renderer without changes
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test "$(systemctl is-active fgbears-live.service)" = active
          test "$(systemctl is-active fgbears-youtube-copy-relay.service)" = active
          runtime=/opt/fgbears-live/bin/game_overlay.py
          test -f "$runtime"
          grep -Fq 'row.get("teamScore")' "$runtime"
          grep -Fq 'row.get("uniquePlayers")' "$runtime"
          python3 -m py_compile "$runtime"
          echo "LEADERBOARD_FIX_ACTIVE=true"
          echo "MASTER_PID=$(systemctl show -p MainPID --value fgbears-live.service)"
          echo "MASTER_RESTARTS=$(systemctl show -p NRestarts --value fgbears-live.service)"
          echo "YOUTUBE_PID=$(systemctl show -p MainPID --value fgbears-youtube-copy-relay.service)"
          curl -fsS --max-time 2 http://127.0.0.1:8787/healthz >/dev/null
          curl -fsS --max-time 2 http://127.0.0.1:8788/healthz >/dev/null
          curl -fsS --max-time 2 http://127.0.0.1:8789/healthz >/dev/null
          echo "HEALTH_ENDPOINTS=PASS"
          REMOTE
