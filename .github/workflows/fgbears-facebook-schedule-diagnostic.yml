name: Diagnose FGBears Facebook Schedule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-facebook-schedule-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fgbears-facebook-diagnostic
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Oracle access
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Collect redacted transport state
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' > /tmp/facebook-diagnostic.env <<'REMOTE'
          set -u
          bool_active() { systemctl is-active --quiet "$1" && echo true || echo false; }
          bool_enabled() { systemctl is-enabled --quiet "$1" 2>/dev/null && echo true || echo false; }
          env_file=/etc/fgbears-live/stream.env

          printf 'CENTRAL_TIME=%s\n' "$(TZ=America/Chicago date +%H:%M:%S)"
          printf 'PRIMARY_ACTIVE=%s\n' "$(bool_active fgbears-live.service)"
          printf 'YOUTUBE_ACTIVE=%s\n' "$(bool_active fgbears-youtube-relay.service)"
          printf 'FACEBOOK_ACTIVE=%s\n' "$(bool_active fgbears-facebook-relay.service)"
          printf 'START_TIMER_ACTIVE=%s\n' "$(bool_active fgbears-facebook-start.timer)"
          printf 'STOP_TIMER_ACTIVE=%s\n' "$(bool_active fgbears-facebook-stop.timer)"
          printf 'START_TIMER_ENABLED=%s\n' "$(bool_enabled fgbears-facebook-start.timer)"
          printf 'STOP_TIMER_ENABLED=%s\n' "$(bool_enabled fgbears-facebook-stop.timer)"
          printf 'FACEBOOK_RELAY_ENABLED=%s\n' "$(sudo grep -Eq '^FACEBOOK_RELAY_ENABLED=(1|true|yes|on)$' "$env_file" && echo true || echo false)"
          printf 'FACEBOOK_KEY_PRESENT=%s\n' "$(sudo awk -F= '/^FACEBOOK_STREAM_KEY=/{if(length(substr($0,index($0,"=")+1))>0) ok=1} END{exit ok?0:1}' "$env_file" && echo true || echo false)"
          printf 'DIRECT_FACEBOOK_DISABLED=%s\n' "$(sudo grep -Fxq 'FACEBOOK_STREAM_ENABLED=0' "$env_file" && echo true || echo false)"

          main_pid=$(systemctl show -p MainPID --value fgbears-live.service 2>/dev/null || echo 0)
          youtube_pid=$(systemctl show -p MainPID --value fgbears-youtube-relay.service 2>/dev/null || echo 0)
          facebook_pid=$(systemctl show -p MainPID --value fgbears-facebook-relay.service 2>/dev/null || echo 0)
          printf 'PRIMARY_PID_VALID=%s\n' "$([[ "$main_pid" =~ ^[1-9][0-9]*$ ]] && echo true || echo false)"
          printf 'YOUTUBE_PID_VALID=%s\n' "$([[ "$youtube_pid" =~ ^[1-9][0-9]*$ ]] && echo true || echo false)"
          printf 'FACEBOOK_PID_VALID=%s\n' "$([[ "$facebook_pid" =~ ^[1-9][0-9]*$ ]] && echo true || echo false)"
          printf 'FACEBOOK_RESULT=%s\n' "$(systemctl show -p Result --value fgbears-facebook-relay.service 2>/dev/null || echo unknown)"
          printf 'FACEBOOK_EXEC_STATUS=%s\n' "$(systemctl show -p ExecMainStatus --value fgbears-facebook-relay.service 2>/dev/null || echo unknown)"
          printf 'FACEBOOK_RESTARTS=%s\n' "$(systemctl show -p NRestarts --value fgbears-facebook-relay.service 2>/dev/null || echo unknown)"

          primary_ffmpeg=''
          if [[ "$main_pid" =~ ^[1-9][0-9]*$ ]]; then primary_ffmpeg=$(pgrep -P "$main_pid" -x ffmpeg | head -n1 || true); fi
          mirror=false; primary_meta=false
          if [[ -n "$primary_ffmpeg" ]]; then
            args=$(mktemp)
            sudo tr '\0' '\n' < "/proc/$primary_ffmpeg/cmdline" > "$args"
            grep -Fq 'udp://127.0.0.1:1936?pkt_size=1316' "$args" && mirror=true || true
            grep -Fq 'live-api-s.facebook.com' "$args" && primary_meta=true || true
            rm -f "$args"
          fi
          printf 'PRIMARY_UDP_MIRROR=%s\n' "$mirror"
          printf 'PRIMARY_META_ENDPOINT=%s\n' "$primary_meta"

          fb_udp=false; fb_meta_arg=false
          if [[ "$facebook_pid" =~ ^[1-9][0-9]*$ ]]; then
            fbargs=$(mktemp)
            sudo tr '\0' '\n' < "/proc/$facebook_pid/cmdline" > "$fbargs" 2>/dev/null || true
            grep -Fq 'udp://127.0.0.1:1936?pkt_size=1316' "$fbargs" && fb_udp=true || true
            grep -Fq 'live-api-s.facebook.com' "$fbargs" && fb_meta_arg=true || true
            rm -f "$fbargs"
          fi
          printf 'FACEBOOK_UDP_INPUT=%s\n' "$fb_udp"
          printf 'FACEBOOK_META_TARGET=%s\n' "$fb_meta_arg"

          sockets=$(mktemp)
          sudo ss -ntpH state established > "$sockets" 2>/dev/null || true
          youtube_socket=false; x_socket=false; facebook_socket=false
          if [[ "$youtube_pid" =~ ^[1-9][0-9]*$ ]]; then grep "pid=$youtube_pid" "$sockets" | grep -vE '127\.0\.0\.1|\[::1\]' | grep -q ':443' && youtube_socket=true || true; fi
          if [[ -n "$primary_ffmpeg" ]]; then grep "pid=$primary_ffmpeg" "$sockets" | grep -vE '127\.0\.0\.1|\[::1\]' | grep -q ':443' && x_socket=true || true; fi
          if [[ "$facebook_pid" =~ ^[1-9][0-9]*$ ]]; then grep "pid=$facebook_pid" "$sockets" | grep -vE '127\.0\.0\.1|\[::1\]' | grep -q ':443' && facebook_socket=true || true; fi
          rm -f "$sockets"
          printf 'YOUTUBE_EXTERNAL_SOCKET=%s\n' "$youtube_socket"
          printf 'X_EXTERNAL_SOCKET=%s\n' "$x_socket"
          printf 'FACEBOOK_EXTERNAL_SOCKET=%s\n' "$facebook_socket"

          udp_bound=false
          if [[ "$facebook_pid" =~ ^[1-9][0-9]*$ ]]; then
            sudo ss -unpH 2>/dev/null | grep "pid=$facebook_pid" | grep -q '127.0.0.1:1936' && udp_bound=true || true
          fi
          printf 'FACEBOOK_UDP_BOUND=%s\n' "$udp_bound"

          tcp_meta=false
          timeout 5 bash -c '</dev/tcp/live-api-s.facebook.com/443' >/dev/null 2>&1 && tcp_meta=true || true
          printf 'META_TCP_REACHABLE=%s\n' "$tcp_meta"
          REMOTE
          cat /tmp/facebook-diagnostic.env

      - name: Record diagnostic
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/deployment-status
          declare -A v
          if [[ -f /tmp/facebook-diagnostic.env ]]; then
            while IFS='=' read -r k value; do v[$k]="$value"; done < /tmp/facebook-diagnostic.env
          fi
          b() { [[ "${1:-false}" == true ]] && echo true || echo false; }
          jq -n \
            --arg centralTime "${v[CENTRAL_TIME]:-unknown}" \
            --argjson primaryActive "$(b "${v[PRIMARY_ACTIVE]:-}")" \
            --argjson youtubeActive "$(b "${v[YOUTUBE_ACTIVE]:-}")" \
            --argjson facebookActive "$(b "${v[FACEBOOK_ACTIVE]:-}")" \
            --argjson startTimerActive "$(b "${v[START_TIMER_ACTIVE]:-}")" \
            --argjson stopTimerActive "$(b "${v[STOP_TIMER_ACTIVE]:-}")" \
            --argjson startTimerEnabled "$(b "${v[START_TIMER_ENABLED]:-}")" \
            --argjson stopTimerEnabled "$(b "${v[STOP_TIMER_ENABLED]:-}")" \
            --argjson facebookRelayEnabled "$(b "${v[FACEBOOK_RELAY_ENABLED]:-}")" \
            --argjson facebookKeyPresent "$(b "${v[FACEBOOK_KEY_PRESENT]:-}")" \
            --argjson directFacebookDisabled "$(b "${v[DIRECT_FACEBOOK_DISABLED]:-}")" \
            --argjson primaryUdpMirror "$(b "${v[PRIMARY_UDP_MIRROR]:-}")" \
            --argjson primaryMetaEndpoint "$(b "${v[PRIMARY_META_ENDPOINT]:-}")" \
            --argjson facebookUdpInput "$(b "${v[FACEBOOK_UDP_INPUT]:-}")" \
            --argjson facebookMetaTarget "$(b "${v[FACEBOOK_META_TARGET]:-}")" \
            --argjson youtubeExternalSocket "$(b "${v[YOUTUBE_EXTERNAL_SOCKET]:-}")" \
            --argjson xExternalSocket "$(b "${v[X_EXTERNAL_SOCKET]:-}")" \
            --argjson facebookExternalSocket "$(b "${v[FACEBOOK_EXTERNAL_SOCKET]:-}")" \
            --argjson facebookUdpBound "$(b "${v[FACEBOOK_UDP_BOUND]:-}")" \
            --argjson metaTcpReachable "$(b "${v[META_TCP_REACHABLE]:-}")" \
            --arg facebookResult "${v[FACEBOOK_RESULT]:-unknown}" \
            --arg facebookExecStatus "${v[FACEBOOK_EXEC_STATUS]:-unknown}" \
            --arg facebookRestarts "${v[FACEBOOK_RESTARTS]:-unknown}" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{centralTime:$centralTime,primaryActive:$primaryActive,youtubeActive:$youtubeActive,facebookActive:$facebookActive,startTimerActive:$startTimerActive,stopTimerActive:$stopTimerActive,startTimerEnabled:$startTimerEnabled,stopTimerEnabled:$stopTimerEnabled,facebookRelayEnabled:$facebookRelayEnabled,facebookKeyPresent:$facebookKeyPresent,directFacebookDisabled:$directFacebookDisabled,primaryUdpMirror:$primaryUdpMirror,primaryMetaEndpoint:$primaryMetaEndpoint,facebookUdpInput:$facebookUdpInput,facebookMetaTarget:$facebookMetaTarget,youtubeExternalSocket:$youtubeExternalSocket,xExternalSocket:$xExternalSocket,facebookExternalSocket:$facebookExternalSocket,facebookUdpBound:$facebookUdpBound,metaTcpReachable:$metaTcpReachable,facebookResult:$facebookResult,facebookExecStatus:$facebookExecStatus,facebookRestarts:$facebookRestarts,checkedAt:$checkedAt}' > .github/deployment-status/fgbears-facebook-schedule-diagnostic.json
          git config user.name 'FGBears Deploy Bot'
          git config user.email 'actions@github.com'
          git add .github/deployment-status/fgbears-facebook-schedule-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Facebook schedule diagnostic [skip ci]'
          git push origin main
