name: Diagnose YouTube v2 Glitch 20260903

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-youtube-v2-glitch-20260903.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-youtube-v2-glitch-20260903
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    name: Read-only pacing and transport probe
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Run live read-only diagnostic
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          YOUTUBE=fgbears-youtube-v2.service
          STATE=/run/fgbears-youtube-v2/overlay-state.json
          ROUTING='https://epiccontentcreatorgrants.org/api/public/fgbears/stream-routing'
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }

          MPID=$(pid "$MASTER")
          RPID=$(pid "$RUMBLE")
          YPID=$(pid "$YOUTUBE")
          OPID=$(pgrep -f '/opt/fgbears-live/youtube-v2/youtube-v2-overlay.py' | head -n1 || true)
          echo "PROBE_START master=$MPID rumble=$RPID youtube=$YPID overlay=${OPID:-none}"
          for svc in "$MASTER" "$RUMBLE" "$YOUTUBE"; do
            echo "UNIT $svc active=$(systemctl is-active "$svc" 2>/dev/null || true) restarts=$(systemctl show -p NRestarts --value "$svc" 2>/dev/null || true)"
          done
          echo "LOAD_START $(cat /proc/loadavg)"
          free -m || true
          echo 'VMSTAT_START'
          vmstat 1 5 || true
          echo 'VMSTAT_END'

          # Observe state-file update cadence. This does not open or alter the media pipe.
          sudo python3 - "$STATE" > /tmp/overlay-cadence.txt <<'PY' &
          import json, os, statistics, sys, time
          path=sys.argv[1]
          end=time.monotonic()+75
          last_mtime=None
          last_change=None
          gaps=[]
          phases=[]
          changes=0
          read_errors=0
          while time.monotonic()<end:
              try:
                  st=os.stat(path)
                  mt=st.st_mtime_ns
                  now=time.monotonic()
                  if mt != last_mtime:
                      if last_change is not None:
                          gaps.append(now-last_change)
                      last_change=now
                      last_mtime=mt
                      changes+=1
                      try:
                          p=json.load(open(path, encoding='utf-8'))
                          phase=str(p.get('phase'))
                          active=bool(p.get('active'))
                          item=(phase,active)
                          if not phases or phases[-1] != item:
                              phases.append(item)
                      except Exception:
                          read_errors+=1
              except Exception:
                  read_errors+=1
              time.sleep(0.02)
          if gaps:
              s=sorted(gaps)
              def pct(q): return s[min(len(s)-1, int(round((len(s)-1)*q)))]
              print('OVERLAY_CADENCE changes=%d median=%.3fs p95=%.3fs max=%.3fs gaps_gt_0.30=%d gaps_gt_0.50=%d gaps_gt_1.00=%d read_errors=%d' % (
                  changes, statistics.median(gaps), pct(.95), max(gaps),
                  sum(x>.30 for x in gaps), sum(x>.50 for x in gaps), sum(x>1.0 for x in gaps), read_errors))
          else:
              print('OVERLAY_CADENCE changes=%d no_intervals read_errors=%d' % (changes, read_errors))
          print('OVERLAY_PHASES ' + repr(phases))
          PY
          CADENCE_PID=$!

          # Independently measure Lovable endpoint response latency from Oracle.
          (
            for i in $(seq 1 40); do
              curl -sS -o /dev/null --max-time 2 -w '%{http_code} %{time_total}\n' "${ROUTING}?_diag=${i}-$(date +%s%N)" || echo '000 2.000'
              sleep 0.10
            done
          ) > /tmp/lovable-latency.txt &
          LAT_PID=$!

          # Sample process CPU, master speed and YouTube TCP send queue for 75 seconds.
          : > /tmp/process-samples.txt
          for i in $(seq 1 75); do
            ts=$(date +%s)
            speed=$(sudo awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true)
            m_cpu=$(ps -p "$MPID" -o %cpu= 2>/dev/null | xargs || true)
            r_cpu=$(ps -p "$RPID" -o %cpu= 2>/dev/null | xargs || true)
            y_cpu=$(ps -p "$YPID" -o %cpu= 2>/dev/null | xargs || true)
            o_cpu=''
            [[ -n "${OPID:-}" ]] && o_cpu=$(ps -p "$OPID" -o %cpu= 2>/dev/null | xargs || true)
            sendq=$(sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$YPID" '$0~q && $5 ~ /:443$/ {print $2; exit}')
            printf '%s master_speed=%s master_cpu=%s rumble_cpu=%s youtube_cpu=%s overlay_cpu=%s youtube_sendq=%s\n' \
              "$ts" "${speed:-NA}" "${m_cpu:-NA}" "${r_cpu:-NA}" "${y_cpu:-NA}" "${o_cpu:-NA}" "${sendq:-NA}" >> /tmp/process-samples.txt
            sleep 1
          done

          wait "$CADENCE_PID"
          wait "$LAT_PID"

          echo 'PROCESS_SAMPLE_SUMMARY_BEGIN'
          python3 - /tmp/process-samples.txt <<'PY'
          import re, statistics, sys
          rows=open(sys.argv[1],encoding='utf-8').read().splitlines()
          fields=['master_speed','master_cpu','rumble_cpu','youtube_cpu','overlay_cpu','youtube_sendq']
          vals={k:[] for k in fields}
          for row in rows:
              for k in fields:
                  m=re.search(r'\b'+re.escape(k)+r'=([^ ]+)',row)
                  if m and m.group(1) not in ('NA',''):
                      try: vals[k].append(float(m.group(1)))
                      except ValueError: pass
          for k in fields:
              a=vals[k]
              if a:
                  s=sorted(a)
                  p95=s[min(len(s)-1,int(round((len(s)-1)*.95)))]
                  print('%s n=%d min=%.3f avg=%.3f p95=%.3f max=%.3f' % (k,len(a),min(a),sum(a)/len(a),p95,max(a)))
          PY
          echo 'PROCESS_SAMPLE_SUMMARY_END'

          cat /tmp/overlay-cadence.txt
          echo 'LOVABLE_LATENCY_BEGIN'
          python3 - /tmp/lovable-latency.txt <<'PY'
          import statistics,sys
          rows=[]; bad=0
          for line in open(sys.argv[1],encoding='utf-8'):
              parts=line.split()
              if len(parts)>=2:
                  code=parts[0]
                  try: t=float(parts[1])
                  except: continue
                  rows.append(t)
                  if code!='200': bad+=1
          if rows:
              s=sorted(rows)
              p95=s[min(len(s)-1,int(round((len(s)-1)*.95)))]
              print('requests=%d failures=%d min=%.3fs median=%.3fs p95=%.3fs max=%.3fs gt_0.20=%d gt_0.50=%d gt_1.00=%d' % (
                  len(rows),bad,min(rows),statistics.median(rows),p95,max(rows),
                  sum(x>.20 for x in rows),sum(x>.50 for x in rows),sum(x>1.0 for x in rows)))
          PY
          echo 'LOVABLE_LATENCY_END'

          echo 'YOUTUBE_SOCKET_DETAIL_BEGIN'
          sudo ss -tinp state established 2>/dev/null | awk -v q="pid=$YPID" 'index($0,q){print; getline; print}' || true
          echo 'YOUTUBE_SOCKET_DETAIL_END'

          echo 'UDP_COUNTERS_BEGIN'
          nstat -az 2>/dev/null | grep -E 'Udp(InErrors|RcvbufErrors|SndbufErrors|NoPorts)|Tcp(RetransSegs|ExtTCPTimeouts|ExtTCPLossProbes)' || true
          echo 'UDP_COUNTERS_END'

          echo 'YOUTUBE_WARNINGS_BEGIN'
          sudo journalctl -u "$YOUTUBE" --since '-20 minutes' --no-pager 2>/dev/null | grep -Ei 'drop|dup|non.monoton|buffer|queue|overrun|error|corrupt|DTS|PTS|timeout|broken|connection|speed' | tail -n 120 || true
          echo 'YOUTUBE_WARNINGS_END'

          echo 'PROCESS_END_STATE_BEGIN'
          ps -o pid,ppid,stat,etimes,%cpu,%mem,nlwp,comm -p "$MPID,$RPID,$YPID${OPID:+,$OPID}" || true
          echo 'PROCESS_END_STATE_END'
          echo "LOAD_END $(cat /proc/loadavg)"

          MPID2=$(pid "$MASTER"); RPID2=$(pid "$RUMBLE"); YPID2=$(pid "$YOUTUBE")
          echo "PROBE_END master=$MPID2 rumble=$RPID2 youtube=$YPID2"
          test "$MPID2" = "$MPID"
          test "$RPID2" = "$RPID"
          test "$YPID2" = "$YPID"
          echo 'READ_ONLY_PROBE=PASS pids_unchanged=yes'
          REMOTE
