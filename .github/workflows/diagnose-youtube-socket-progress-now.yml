name: Diagnose YouTube Socket Progress Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-youtube-socket-progress-now.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Sample YouTube socket and relay state read-only
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          yunit=fgbears-youtube-copy-relay.service
          munit=fgbears-live.service
          ypid=$(systemctl show -p MainPID --value "$yunit")
          mpid=$(systemctl show -p MainPID --value "$munit")
          echo "MASTER_ACTIVE=$(systemctl is-active "$munit")"
          echo "YOUTUBE_ACTIVE=$(systemctl is-active "$yunit")"
          echo "MASTER_PID=$mpid"
          echo "YOUTUBE_PID=$ypid"
          [[ "$ypid" =~ ^[1-9][0-9]*$ ]]
          started=$(ps -o lstart= -p "$ypid" | sed 's/^ *//')
          echo "YOUTUBE_PROCESS_STARTED=$started"
          echo 'YOUTUBE_CMD_MODE:'
          tr '\0' '\n' < "/proc/$ypid/cmdline" | grep -E '^(flv|tee|copy|7)$' || true
          socket_line() {
            ss -tinp state established | awk -v p="pid=$ypid" '
              index($0,p){line=$0; getline detail; print line "\n" detail; exit}
            '
          }
          echo 'SOCKET_SAMPLE_1:'
          s1=$(socket_line || true); printf '%s\n' "$s1"
          b1=$(printf '%s\n' "$s1" | grep -oE 'bytes_sent:[0-9]+' | head -n1 | cut -d: -f2 || true)
          a1=$(printf '%s\n' "$s1" | grep -oE 'bytes_acked:[0-9]+' | head -n1 | cut -d: -f2 || true)
          sleep 8
          echo 'SOCKET_SAMPLE_2:'
          s2=$(socket_line || true); printf '%s\n' "$s2"
          b2=$(printf '%s\n' "$s2" | grep -oE 'bytes_sent:[0-9]+' | head -n1 | cut -d: -f2 || true)
          a2=$(printf '%s\n' "$s2" | grep -oE 'bytes_acked:[0-9]+' | head -n1 | cut -d: -f2 || true)
          echo "BYTES_SENT_8S_DELTA=$(( ${b2:-0} - ${b1:-0} ))"
          echo "BYTES_ACKED_8S_DELTA=$(( ${a2:-0} - ${a1:-0} ))"
          if (( ${b2:-0} > ${b1:-0} && ${a2:-0} > ${a1:-0} )); then
            echo 'YOUTUBE_SOCKET_PROGRESS=PASS'
          else
            echo 'YOUTUBE_SOCKET_PROGRESS=FAIL'
          fi
          echo 'CURRENT_RELAY_JOURNAL:'
          journalctl -u "$yunit" _PID="$ypid" --no-pager -o cat | tail -n 80 \
            | sed -E 's#rtmps://[^ ]+/live2/[^ ]+#rtmps://[REDACTED]/live2/[REDACTED]#g'
          REMOTE
