name: Confirm YouTube v2 CPU Starvation 20260903

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-youtube-v2-cpu-confirm-20260903.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  confirm:
    name: Read-only cgroup CPU and UDP delta probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Confirm CPU starvation without mutation
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SVC=(fgbears-live.service fgbears-rumble-relay.service fgbears-youtube-v2.service)
          echo "NPROC=$(nproc)"
          echo "LOAD_START $(cat /proc/loadavg)"
          echo 'SCHEDULING_BEGIN'
          for s in "${SVC[@]}"; do
            echo "$s Nice=$(systemctl show -p Nice --value "$s") CPUWeight=$(systemctl show -p CPUWeight --value "$s") CPUQuotaPerSecUSec=$(systemctl show -p CPUQuotaPerSecUSec --value "$s") MainPID=$(systemctl show -p MainPID --value "$s") NRestarts=$(systemctl show -p NRestarts --value "$s")"
          done
          echo 'SCHEDULING_END'
          echo 'CPU_PRESSURE_START'; cat /proc/pressure/cpu || true; echo 'CPU_PRESSURE_END'
          echo 'PROCESS_TREE_BEGIN'
          ps -eo pid,ppid,ni,cls,psr,%cpu,%mem,nlwp,comm --sort=-%cpu | head -n 25
          echo 'PROCESS_TREE_END'

          read_usage(){
            local svc=$1
            local path="/sys/fs/cgroup/system.slice/$svc/cpu.stat"
            awk '$1=="usage_usec"{print $2}' "$path" 2>/dev/null || echo 0
          }
          udp_val(){ nstat -az 2>/dev/null | awk -v k="$1" '$1==k{print $2+0}'; }
          master0=$(read_usage fgbears-live.service)
          rumble0=$(read_usage fgbears-rumble-relay.service)
          youtube0=$(read_usage fgbears-youtube-v2.service)
          udp0=$(udp_val UdpRcvbufErrors); inerr0=$(udp_val UdpInErrors)
          retr0=$(udp_val TcpRetransSegs)

          : > /tmp/udpq.txt
          for i in $(seq 1 30); do
            q=$(sudo ss -uapnH 2>/dev/null | awk '$5 ~ /:1939$/ || $4 ~ /:1939$/ {print $2; exit}')
            idle=$(vmstat 1 2 | tail -n1 | awk '{print $15}')
            pressure=$(awk '/^some/{for(i=1;i<=NF;i++) if($i ~ /^avg10=/){split($i,a,"="); print a[2]}}' /proc/pressure/cpu)
            echo "udp1939_recvq=${q:-NA} cpu_idle=$idle pressure_avg10=${pressure:-NA}" >> /tmp/udpq.txt
          done

          master1=$(read_usage fgbears-live.service)
          rumble1=$(read_usage fgbears-rumble-relay.service)
          youtube1=$(read_usage fgbears-youtube-v2.service)
          udp1=$(udp_val UdpRcvbufErrors); inerr1=$(udp_val UdpInErrors)
          retr1=$(udp_val TcpRetransSegs)

          python3 - /tmp/udpq.txt <<'PY'
          import re,sys
          rows=open(sys.argv[1]).read().splitlines()
          vals={k:[] for k in ('udp1939_recvq','cpu_idle','pressure_avg10')}
          for row in rows:
              for k in vals:
                  m=re.search(k+r'=([^ ]+)',row)
                  if m and m.group(1)!='NA':
                      try: vals[k].append(float(m.group(1)))
                      except: pass
          for k,a in vals.items():
              if a: print('%s n=%d min=%.3f avg=%.3f max=%.3f' % (k,len(a),min(a),sum(a)/len(a),max(a)))
          PY

          echo "CGROUP_CPU_DELTA_USEC master=$((master1-master0)) rumble=$((rumble1-rumble0)) youtube=$((youtube1-youtube0))"
          echo "NETWORK_DELTA UdpRcvbufErrors=$((udp1-udp0)) UdpInErrors=$((inerr1-inerr0)) TcpRetransSegs=$((retr1-retr0))"
          echo 'CPU_PRESSURE_FINAL'; cat /proc/pressure/cpu || true
          echo "LOAD_END $(cat /proc/loadavg)"
          echo 'YOUTUBE_OVERRUN_RECENT_BEGIN'
          sudo journalctl -u fgbears-youtube-v2.service --since '-30 minutes' --no-pager 2>/dev/null | grep -F 'Circular buffer overrun' | tail -n 30 || true
          echo 'YOUTUBE_OVERRUN_RECENT_END'
          echo 'CONFIRM_PROBE=PASS read_only=yes'
          REMOTE
