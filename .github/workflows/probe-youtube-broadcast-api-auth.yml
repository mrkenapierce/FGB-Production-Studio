name: Probe YouTube Broadcast API Auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-youtube-broadcast-api-auth.yml'
  workflow_dispatch:

permissions:
  contents: write

# Read-only diagnostic. Never prints OAuth secret/token values.
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check protected OAuth credential sets without exposing values
        env:
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YTO_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YTO_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YTO_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          G_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          G_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          G_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GO_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GO_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GO_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          YT_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          : > /tmp/youtube-broadcast-auth-probe.txt
          available=0
          if [[ -n "$YT_CLIENT_ID" && -n "$YT_CLIENT_SECRET" && -n "$YT_REFRESH_TOKEN" ]]; then
            echo 'YOUTUBE_API_AUTH_SET=YOUTUBE_STANDARD' | tee -a /tmp/youtube-broadcast-auth-probe.txt
            available=1
          fi
          if [[ -n "$YTO_CLIENT_ID" && -n "$YTO_CLIENT_SECRET" && -n "$YTO_REFRESH_TOKEN" ]]; then
            echo 'YOUTUBE_API_AUTH_SET=YOUTUBE_OAUTH' | tee -a /tmp/youtube-broadcast-auth-probe.txt
            available=1
          fi
          if [[ -n "$G_CLIENT_ID" && -n "$G_CLIENT_SECRET" && -n "$G_REFRESH_TOKEN" ]]; then
            echo 'YOUTUBE_API_AUTH_SET=GOOGLE_STANDARD' | tee -a /tmp/youtube-broadcast-auth-probe.txt
            available=1
          fi
          if [[ -n "$GO_CLIENT_ID" && -n "$GO_CLIENT_SECRET" && -n "$GO_REFRESH_TOKEN" ]]; then
            echo 'YOUTUBE_API_AUTH_SET=GOOGLE_OAUTH' | tee -a /tmp/youtube-broadcast-auth-probe.txt
            available=1
          fi
          if [[ -n "$YT_ACCESS_TOKEN" ]]; then
            echo 'YOUTUBE_API_ACCESS_TOKEN=AVAILABLE' | tee -a /tmp/youtube-broadcast-auth-probe.txt
            available=1
          fi
          if (( available == 1 )); then
            echo 'YOUTUBE_BROADCAST_API_AUTH=AVAILABLE' | tee -a /tmp/youtube-broadcast-auth-probe.txt
          else
            echo 'YOUTUBE_BROADCAST_API_AUTH=UNAVAILABLE' | tee -a /tmp/youtube-broadcast-auth-probe.txt
          fi

      - name: Read active broadcast latency setting
        env:
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YTO_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YTO_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YTO_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          G_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          G_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          G_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GO_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GO_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GO_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          YT_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          client_id=''
          client_secret=''
          refresh_token=''
          if [[ -n "$YT_CLIENT_ID" && -n "$YT_CLIENT_SECRET" && -n "$YT_REFRESH_TOKEN" ]]; then
            client_id="$YT_CLIENT_ID"; client_secret="$YT_CLIENT_SECRET"; refresh_token="$YT_REFRESH_TOKEN"
          elif [[ -n "$YTO_CLIENT_ID" && -n "$YTO_CLIENT_SECRET" && -n "$YTO_REFRESH_TOKEN" ]]; then
            client_id="$YTO_CLIENT_ID"; client_secret="$YTO_CLIENT_SECRET"; refresh_token="$YTO_REFRESH_TOKEN"
          elif [[ -n "$G_CLIENT_ID" && -n "$G_CLIENT_SECRET" && -n "$G_REFRESH_TOKEN" ]]; then
            client_id="$G_CLIENT_ID"; client_secret="$G_CLIENT_SECRET"; refresh_token="$G_REFRESH_TOKEN"
          elif [[ -n "$GO_CLIENT_ID" && -n "$GO_CLIENT_SECRET" && -n "$GO_REFRESH_TOKEN" ]]; then
            client_id="$GO_CLIENT_ID"; client_secret="$GO_CLIENT_SECRET"; refresh_token="$GO_REFRESH_TOKEN"
          fi

          access_token="$YT_ACCESS_TOKEN"
          if [[ -z "$access_token" && -n "$client_id" ]]; then
            token_json=$(curl -fsS -X POST 'https://oauth2.googleapis.com/token' \
              --data-urlencode "client_id=$client_id" \
              --data-urlencode "client_secret=$client_secret" \
              --data-urlencode "refresh_token=$refresh_token" \
              --data-urlencode 'grant_type=refresh_token')
            access_token=$(jq -r '.access_token // empty' <<<"$token_json")
          fi

          if [[ -z "$access_token" ]]; then
            echo 'ACTIVE_BROADCAST_LATENCY_PROBE=SKIPPED_NO_USABLE_TOKEN' | tee -a /tmp/youtube-broadcast-auth-probe.txt
            exit 0
          fi
          echo "::add-mask::$access_token"

          payload=$(curl -fsS -G 'https://www.googleapis.com/youtube/v3/liveBroadcasts' \
            -H "Authorization: Bearer $access_token" \
            --data-urlencode 'part=id,status,contentDetails' \
            --data-urlencode 'broadcastStatus=active' \
            --data-urlencode 'mine=true' \
            --data-urlencode 'maxResults=10')

          count=$(jq '.items | length' <<<"$payload")
          echo "ACTIVE_BROADCAST_COUNT=$count" | tee -a /tmp/youtube-broadcast-auth-probe.txt
          if (( count == 0 )); then
            echo 'ACTIVE_BROADCAST_LATENCY_PROBE=NO_ACTIVE_BROADCAST' | tee -a /tmp/youtube-broadcast-auth-probe.txt
            exit 0
          fi

          jq -r '.items[] | "ACTIVE_BROADCAST_ID=" + .id, "LATENCY_PREFERENCE=" + (.contentDetails.latencyPreference // "unset"), "ENABLE_LOW_LATENCY=" + ((.contentDetails.enableLowLatency // false)|tostring), "MONITOR_DELAY_MS=" + ((.contentDetails.monitorStream.broadcastStreamDelayMs // 0)|tostring), "LIFECYCLE_STATUS=" + (.status.lifeCycleStatus // "unknown")' <<<"$payload" | tee -a /tmp/youtube-broadcast-auth-probe.txt

      - name: Persist sanitized broadcast probe
        run: |
          set -Eeuo pipefail
          mkdir -p .github/deployment-status
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          values = {}
          auth_sets = []
          for raw in Path('/tmp/youtube-broadcast-auth-probe.txt').read_text(encoding='utf-8').splitlines():
              if '=' not in raw:
                  continue
              k, v = raw.split('=', 1)
              if k == 'YOUTUBE_API_AUTH_SET':
                  auth_sets.append(v)
              elif k in {
                  'YOUTUBE_API_ACCESS_TOKEN','YOUTUBE_BROADCAST_API_AUTH','ACTIVE_BROADCAST_LATENCY_PROBE',
                  'ACTIVE_BROADCAST_COUNT','ACTIVE_BROADCAST_ID','LATENCY_PREFERENCE',
                  'ENABLE_LOW_LATENCY','MONITOR_DELAY_MS','LIFECYCLE_STATUS'
              }:
                  values[k] = v
          body = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'targetLatencyPreference': 'ultraLow',
              'authSets': auth_sets,
              'probe': values,
          }
          Path('.github/deployment-status/youtube-broadcast-latency.json').write_text(
              json.dumps(body, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/youtube-broadcast-latency.json
          if git diff --cached --quiet; then
            echo 'No probe-result change to commit.'
          else
            git commit -m 'Record active YouTube broadcast latency'
            git push
          fi
