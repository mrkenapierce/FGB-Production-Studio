name: One-shot Diagnose YouTube Audio Ingest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-diagnose-youtube-audio-ingest.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify new YouTube AAC path and platform isolation
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          YOUTUBE=fgbears-youtube-relay.service
          RUMBLE=fgbears-rumble-relay.service
          STATUS=/srv/fgbears-live/health/youtube-audio/status.env
          WARNING=/srv/fgbears-live/health/youtube-audio/warning.env

          systemctl is-active --quiet "$MASTER"
          master_pid=$(systemctl show -p MainPID --value "$MASTER")
          [[ "$master_pid" =~ ^[1-9][0-9]*$ ]]

          # Preserve the known-good Rumble branch. If it has exited independently,
          # recover only that isolated relay; never restart the master.
          rumble_repaired=no
          if ! systemctl is-active --quiet "$RUMBLE"; then
            echo 'Rumble relay was inactive; starting only the isolated Rumble relay.'
            sudo systemctl reset-failed "$RUMBLE" || true
            sudo systemctl start "$RUMBLE"
            rumble_repaired=yes
          fi
          systemctl is-active --quiet "$RUMBLE"
          rumble_pid=$(systemctl show -p MainPID --value "$RUMBLE")
          [[ "$rumble_pid" =~ ^[1-9][0-9]*$ ]]

          systemctl is-active --quiet "$YOUTUBE"
          youtube_pid=$(systemctl show -p MainPID --value "$YOUTUBE")
          [[ "$youtube_pid" =~ ^[1-9][0-9]*$ ]]

          yargs=$(tr '\0' ' ' < "/proc/$youtube_pid/cmdline")
          rargs=$(tr '\0' ' ' < "/proc/$rumble_pid/cmdline")
          mchild=$(pgrep -P "$master_pid" -x ffmpeg | head -n1 || true)
          [[ "$mchild" =~ ^[1-9][0-9]*$ ]]
          margs=$(tr '\0' ' ' < "/proc/$mchild/cmdline")

          [[ "$margs" == *" -c:a copy "* ]]
          [[ "$rargs" == *"udp://127.0.0.1:1940"* && "$rargs" == *" -c copy "* ]]
          [[ "$yargs" == *"udp://127.0.0.1:1939"* ]]
          [[ "$yargs" == *" -c:v copy "* ]]
          [[ "$yargs" == *" -c:a aac "* ]]
          [[ "$yargs" == *" -profile:a aac_low "* ]]
          [[ "$yargs" == *" -b:a 128k "* ]]
          [[ "$yargs" == *" -ar 44100 "* ]]
          [[ "$yargs" == *" -ac 2 "* ]]
          [[ "$yargs" == *"aresample=44100:async=1:first_pts=0"* ]]
          [[ "$yargs" != *"youtube-stream-router"* && "$yargs" != *"gst-launch"* && "$yargs" != *"libx264"* ]]

          printf 'youtube_args=%s\n' "$(sed -E 's#(rtmps?://)[^ ]+#\1[REDACTED]#g' <<<"$yargs")"
          printf 'rumble_args=%s\n' "$(sed -E 's#(rtmps?://)[^ ]+#\1[REDACTED]#g' <<<"$rargs")"
          echo "master_audio_copy=yes"
          echo "rumble_repaired=$rumble_repaired"

          # Verify actual outbound sockets for both relays.
          sudo ss -ntpH state established > /tmp/fgb-platform-sockets.txt || true
          grep -F "pid=$youtube_pid" /tmp/fgb-platform-sockets.txt | grep -Eq ':[4]43([[:space:]]|$)'
          echo 'youtube_rtmps_socket=ESTABLISHED'
          if grep -F "pid=$rumble_pid" /tmp/fgb-platform-sockets.txt | grep -Eq ':[0-9]+([[:space:]]|$)'; then
            echo 'rumble_rtmp_socket=ESTABLISHED'
          else
            echo 'Rumble relay lacks an established upstream socket.' >&2
            exit 1
          fi

          # Sample the shared source repeatedly. A one-off UDP sampling gap should
          # not be confused with a persistent program fault; require at least two
          # clean samples and report every result.
          clean=0
          for n in 1 2 3; do
            echo "--- shared source audio sample $n ---"
            set +e
            output=$(sudo /usr/local/bin/fgbears-audio-health --capture-seconds 8 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$output"
            echo "sample_${n}_rc=$rc"
            if (( rc == 0 )); then clean=$((clean + 1)); fi
            sleep 1
          done
          echo "clean_source_samples=$clean/3"
          (( clean >= 2 ))

          echo '--- recent YouTube relay errors ---'
          recent_errors=$(sudo journalctl -u "$YOUTUBE" --since '-10 minutes' --no-pager 2>/dev/null \
            | grep -Eic 'Non-monotonic DTS|non monotonically increasing dts|Invalid timestamps|Queue input is backward|Conversion failed|Error writing|Broken pipe' || true)
          echo "youtube_recent_error_count=$recent_errors"
          (( recent_errors == 0 ))

          [[ "$(systemctl show -p MainPID --value "$MASTER")" == "$master_pid" ]]
          systemctl is-active --quiet "$MASTER"
          systemctl is-active --quiet "$YOUTUBE"
          systemctl is-active --quiet "$RUMBLE"

          echo '--- watchdog files ---'
          sudo cat "$STATUS" 2>/dev/null || true
          sudo cat "$WARNING" 2>/dev/null || true
          echo 'master_untouched=yes'
          echo 'youtube_aac_ingest_verification=PASS'
          REMOTE
