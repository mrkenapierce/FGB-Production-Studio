name: Patch EPIC Media CTA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-epic-media-cta.yml'

permissions:
  contents: write

concurrency:
  group: fgbears-epic-media-cta-patch
  cancel-in-progress: false

jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch QR CTA source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/fgbears-live/bin/ad-overlay.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          target = '        cta = "PLACE YOUR AD"'
          if target in lines:
              start = lines.index(target)
              expected = [
                  '        cta = "PLACE YOUR AD"',
                  '        cta_font = font(22, bold=True)',
                  '        cta_box = draw.textbbox((0, 0), cta, font=cta_font)',
                  '        draw.text((qr_x + (qr_size - (cta_box[2] - cta_box[0])) / 2, qr_y + qr_size + 22), cta, font=cta_font, fill=BEARS_BLUE)',
                  '        url = "epiccontentcreatorgrants.org/epic-media"',
                  '        url_font = fit_text(draw, url, qr_size - 16, 16, 12)',
                  '        url_box = draw.textbbox((0, 0), url, font=url_font)',
                  '        draw.text((qr_x + (qr_size - (url_box[2] - url_box[0])) / 2, qr_y + qr_size + 60), url, font=url_font, fill=BEARS_ORANGE)',
              ]
              if lines[start:start + len(expected)] != expected:
                  raise SystemExit('QR CTA source did not match the expected safe patch target.')
              replacement = [
                  '        cta_font = font(20, bold=True)',
                  '        cta_lines = (',
                  '            ("Place Your Ad", qr_y + qr_size + 17),',
                  '            ("Share EPIC Prizes", qr_y + qr_size + 43),',
                  '        )',
                  '        for cta, cta_y in cta_lines:',
                  '            cta_box = draw.textbbox((0, 0), cta, font=cta_font)',
                  '            draw.text((qr_x + (qr_size - (cta_box[2] - cta_box[0])) / 2, cta_y), cta, font=cta_font, fill=BEARS_BLUE)',
                  '        url = "epiccontentcreatorgrants.org/epic-media"',
                  '        url_font = fit_text(draw, url, qr_size - 16, 16, 12)',
                  '        url_box = draw.textbbox((0, 0), url, font=url_font)',
                  '        draw.text((qr_x + (qr_size - (url_box[2] - url_box[0])) / 2, qr_y + qr_size + 72), url, font=url_font, fill=BEARS_ORANGE)',
              ]
              lines[start:start + len(expected)] = replacement
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          elif not any('Share EPIC Prizes' in line for line in lines):
              raise SystemExit('Expected QR CTA source was not found; refusing an unsafe patch.')
          PY
          python3 -m py_compile services/fgbears-live/bin/ad-overlay.py
          grep -F '"Place Your Ad"' services/fgbears-live/bin/ad-overlay.py
          grep -F '"Share EPIC Prizes"' services/fgbears-live/bin/ad-overlay.py
          grep -F 'EPIC_MEDIA_URL = "https://epiccontentcreatorgrants.org/epic-media"' services/fgbears-live/bin/ad-overlay.py

      - name: Commit persistent source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/fgbears-live/bin/ad-overlay.py
          if ! git diff --cached --quiet; then
            git commit -m 'Update EPIC Media QR CTA copy'
            git push origin HEAD:main
          fi

      - name: Require Oracle deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" || { echo 'Missing ORACLE_HOST secret'; exit 1; }
          test -n "$ORACLE_SSH_KEY" || { echo 'Missing ORACLE_SSH_KEY secret'; exit 1; }

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Trust Oracle host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Targeted production deployment
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          cat services/fgbears-live/bin/ad-overlay.py | ssh -i ~/.ssh/oracle_key "ubuntu@$ORACLE_HOST" 'sudo tee /opt/fgbears-live/bin/ad-overlay-base.py >/dev/null && sudo chmod 0755 /opt/fgbears-live/bin/ad-overlay-base.py'
          ssh -i ~/.ssh/oracle_key "ubuntu@$ORACLE_HOST" 'sudo systemctl restart fgbears-live.service'

      - name: Verify production overlay and stream services
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "ubuntu@$ORACLE_HOST" 'bash -s' <<'REMOTE'
            set -Eeuo pipefail
            for i in $(seq 1 60); do
              if systemctl is-active --quiet fgbears-live.service \
                && systemctl is-active --quiet fgbears-youtube-relay.service \
                && systemctl is-active --quiet fgbears-rumble-relay.service \
                && curl --silent --fail --max-time 1 http://127.0.0.1:8787/healthz >/tmp/fgbears-overlay-health.json \
                && curl --silent --fail --max-time 1 http://127.0.0.1:8788/healthz >/tmp/fgbears-crawl-health.json \
                && curl --silent --fail --max-time 1 http://127.0.0.1:8789/healthz >/tmp/fgbears-news-health.json; then
                grep -F '"Place Your Ad"' /opt/fgbears-live/bin/ad-overlay-base.py
                grep -F '"Share EPIC Prizes"' /opt/fgbears-live/bin/ad-overlay-base.py
                grep -F 'EPIC_MEDIA_URL = "https://epiccontentcreatorgrants.org/epic-media"' /opt/fgbears-live/bin/ad-overlay-base.py
                cat /tmp/fgbears-overlay-health.json
                cat /tmp/fgbears-crawl-health.json
                cat /tmp/fgbears-news-health.json
                exit 0
              fi
              sleep 1
            done
            systemctl status fgbears-live.service --no-pager || true
            systemctl status fgbears-youtube-relay.service --no-pager || true
            systemctl status fgbears-rumble-relay.service --no-pager || true
            exit 1
          REMOTE

      - name: Remove one-time workflow
        if: always()
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/patch-epic-media-cta.yml
          git commit -m 'Remove one-time EPIC Media CTA patch workflow'
          git push origin HEAD:main
