name: Recover FGBears from Facebook Failure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-facebook-recover.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ORACLE_USER: ubuntu

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - id: recover
        name: Disable Facebook only and restore YouTube plus X
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sudo fgbears-configure-facebook --disable
          for i in $(seq 1 60); do
            if systemctl is-active --quiet fgbears-live.service; then
              ffmpeg_pid=$(pgrep -o -x ffmpeg || true)
              if [[ -n "$ffmpeg_pid" ]]; then
                args=$(mktemp)
                sudo tr '\0' '\n' < "/proc/$ffmpeg_pid/cmdline" > "$args"
                if grep -Fxq 'tee' "$args" && grep -Fq 'rtmps://ca.pscp.tv:443/x' "$args" && ! grep -Fq 'live-api-s.facebook.com' "$args"; then
                  rm -f "$args"
                  echo 'Recovered: YouTube primary + X active; Facebook disabled.'
                  exit 0
                fi
                rm -f "$args"
              fi
            fi
            sleep 1
          done
          sudo systemctl status fgbears-live.service --no-pager --lines=40 || true
          exit 1
          REMOTE

      - name: Record recovery result
        if: always()
        env:
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/deployment-status
          ok=false
          [[ "$RECOVER_OUTCOME" == 'success' ]] && ok=true
          jq -n --argjson ok "$ok" --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg runId "$GITHUB_RUN_ID" '{recovered:$ok,youtubePrimary:true,xExpectedActive:true,facebookEnabled:false,checkedAt:$checkedAt,runId:$runId}' > .github/deployment-status/fgbears-facebook-recovery.json
          git config user.name 'FGBears Deploy Bot'
          git config user.email 'actions@github.com'
          git add -- .github/deployment-status/fgbears-facebook-recovery.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Facebook failure recovery [skip ci]'
          git push origin main
