name: Activate FGB Archive Publishing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/activate-fgb-archive-publishing.yml

permissions:
  contents: read

env:
  OVH_HOST: 40.160.144.185

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure OVH access
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H "$OVH_HOST" > ~/.ssh/known_hosts 2>/dev/null

      - name: Install token bridge and validate publishing
        run: |
          set -euo pipefail
          scp -q -i ~/.ssh/ovh_key ops/transport-ovh/docker-compose.yml ubuntu@$OVH_HOST:/tmp/docker-compose.yml
          ssh -i ~/.ssh/ovh_key ubuntu@$OVH_HOST 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/fgb-transport
          live_before=$(sudo docker compose --env-file .env exec -T youtube sh -lc 'cat /tmp/fgb-transport.state')
          test "$live_before" = live
          youtube_id_before=$(sudo docker compose --env-file .env ps -q youtube)
          youtube_restarts_before=$(sudo docker inspect -f '{{.RestartCount}}' "$youtube_id_before")

          cat >/tmp/archive-token-wrapper.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import hashlib, hmac, importlib.util, json, os, time, urllib.request
          from pathlib import Path

          URL = os.environ.get('FGB_ARCHIVE_CONTROL_URL', 'https://epiccontentcreatorgrants.org/api/public/fgbears/archive').strip()
          SECRET = os.environ.get('FGB_TRANSPORT_HEARTBEAT_SECRET', '').strip()

          def access_token():
              if not SECRET:
                  raise RuntimeError('archive signing secret is not configured')
              body = b'{"action":"token"}'
              ts = str(int(time.time()))
              sig = hmac.new(SECRET.encode(), ts.encode() + b'.' + body, hashlib.sha256).hexdigest()
              req = urllib.request.Request(URL, data=body, method='POST', headers={
                  'content-type': 'application/json',
                  'x-fgb-timestamp': ts,
                  'x-fgb-signature': sig,
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode())
              value = payload.get('accessToken', '')
              if payload.get('ok') is not True or not value:
                  raise RuntimeError(payload.get('error', 'archive control returned no access token'))
              return value

          def oauth_ready():
              return bool(SECRET and URL.startswith('https://'))

          source = Path(__file__).with_name('archive-uploader.py')
          spec = importlib.util.spec_from_file_location('fgb_archive_uploader', source)
          if spec is None or spec.loader is None:
              raise RuntimeError('could not load archive-uploader.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.oauth_ready = oauth_ready
          module.access_token = access_token
          raise SystemExit(module.main())
          PY

          sudo install -m 0755 /tmp/archive-token-wrapper.py /opt/fgb-transport/archive-token-wrapper.py
          sudo install -m 0644 /tmp/docker-compose.yml /opt/fgb-transport/docker-compose.yml
          rm -f /tmp/archive-token-wrapper.py /tmp/docker-compose.yml
          sudo docker compose --env-file .env config >/dev/null
          sudo docker compose --env-file .env up -d --no-deps --force-recreate archive_uploader
          sudo docker compose --env-file .env exec -T archive_uploader python3 ./archive-token-wrapper.py --check-auth
          sudo docker compose --env-file .env exec -T archive_uploader python3 ./archive-token-wrapper.py --test-upload

          # Oct 2 capture started part-way through the day; keep Oct 3 as the first complete archive date.
          sudo find /srv/fgb-archive/hourly -maxdepth 1 -type f -name 'live-20261002-*.ts' -delete

          test "$(sudo docker compose --env-file .env exec -T youtube sh -lc 'cat /tmp/fgb-transport.state')" = live
          youtube_id_after=$(sudo docker compose --env-file .env ps -q youtube)
          youtube_restarts_after=$(sudo docker inspect -f '{{.RestartCount}}' "$youtube_id_after")
          test "$youtube_id_after" = "$youtube_id_before"
          test "$youtube_restarts_after" = "$youtube_restarts_before"
          echo 'ARCHIVE_PUBLISHING_AUTHORIZED=true'
          echo 'ARCHIVE_TEST_UPLOAD_PASS=true'
          echo 'FIRST_FULL_PUBLIC_ARCHIVE_DATE=2026-10-03'
          REMOTE
