name: Probe FGB Trivia Production UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-fgb-trivia-production-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Probe production mobile UX
        run: |
          set -euo pipefail
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url = 'https://epiccontentcreatorgrants.org/fgb-trivia';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:390,height:1400}, isMobile:true});
          const page = await context.newPage();
          const consoleErrors=[]; const pageErrors=[];
          page.on('console', m=>{ if (m.type()==='error') consoleErrors.push(m.text()); });
          page.on('pageerror', e=>pageErrors.push(String(e)));
          const resp = await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          console.log('FINAL_URL='+page.url());
          console.log('NAV_STATUS='+(resp?.status() ?? 'none'));
          if (resp) {
            const h = await resp.allHeaders();
            for (const [k,v] of Object.entries(h)) if (/deploy|x-|etag|cache/i.test(k)) console.log('HEADER_'+k+'='+v);
          }
          await page.waitForTimeout(8000);
          const web = await page.evaluate(()=>fetch('/api/public/fgbears/website-game-screen?probe='+Date.now(),{cache:'no-store'}).then(r=>r.json()));
          const src = await page.evaluate(()=>fetch('/api/public/fgbears/game-screen?probe='+Date.now(),{cache:'no-store'}).then(r=>r.json()));
          console.log('WEB_FEED='+JSON.stringify({active:web.active,waiting:web.waiting,delaySeconds:web.delaySeconds,gameId:web.gameId,questionIndex:web.questionIndex,questionNumber:web.questionNumber,phase:web.phase,phaseStartsAt:web.phaseStartsAt,phaseEndsAt:web.phaseEndsAt,secondsRemaining:web.secondsRemaining,prompt:web.prompt,choices:web.choices}));
          console.log('SRC_FEED='+JSON.stringify({active:src.active,gameId:src.gameId,questionIndex:src.questionIndex,questionNumber:src.questionNumber,phase:src.phase,phaseStartsAt:src.phaseStartsAt,phaseEndsAt:src.phaseEndsAt,secondsRemaining:src.secondsRemaining,hasDelay:Object.prototype.hasOwnProperty.call(src,'delaySeconds')}));
          const info = await page.evaluate(()=>{
            const body=document.body?.innerText||'';
            const s=document.querySelector('section[aria-label="Livestream play"]');
            const reg=document.querySelector('#fgb-daily-registration');
            return {
              hasRegAnchor:!!reg,
              hasGate:body.includes('Register to answer this live question'),
              hasGateCta:body.includes('Register now to answer'),
              hasPrep:body.includes('Preparing your free guest session')||body.includes('Getting your free play session ready'),
              hasDailyAttempts:body.toUpperCase().includes('DAILY ATTEMPTS'),
              liveText:s?s.innerText.slice(0,2500):null,
              liveButtons:s?Array.from(s.querySelectorAll('button')).map(b=>({text:b.innerText.trim(),disabled:b.disabled})):[],
              liveNoninteractiveChoices:s?Array.from(s.querySelectorAll('li[aria-disabled="true"]')).map(x=>x.innerText.trim()):[],
              liveAnswerButtons:s?Array.from(s.querySelectorAll('button')).filter(b=>/^[A-D]\./.test(b.innerText.trim())).map(b=>({text:b.innerText.trim(),disabled:b.disabled})):[],
              regInputs:reg?Array.from(reg.querySelectorAll('input,select,textarea')).map(el=>el.id||el.getAttribute('name')||el.tagName):[]
            };
          });
          console.log('DOM='+JSON.stringify(info));
          console.log('CONSOLE_ERRORS='+JSON.stringify(consoleErrors));
          console.log('PAGE_ERRORS='+JSON.stringify(pageErrors));
          await browser.close();
          EOF
          node probe.mjs
