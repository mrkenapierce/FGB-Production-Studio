name: Pause FGBears Instagram Simulcast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-instagram-activate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fgbears-live-production-deploy
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare protected connection
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - id: pause
        name: Disable Instagram relay and daily timers
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/fgbears-live/stream.env
          if sudo grep -q '^INSTAGRAM_RELAY_ENABLED=' "$env_file"; then
            sudo sed -i -E 's/^INSTAGRAM_RELAY_ENABLED=.*/INSTAGRAM_RELAY_ENABLED=0/' "$env_file"
          else
            printf '%s\n' 'INSTAGRAM_RELAY_ENABLED=0' | sudo tee -a "$env_file" >/dev/null
          fi
          sudo systemctl disable --now fgbears-instagram-start.timer fgbears-instagram-stop.timer
          sudo systemctl stop fgbears-instagram-relay.service
          sudo systemctl reset-failed fgbears-instagram-relay.service || true
          ! systemctl is-active --quiet fgbears-instagram-relay.service
          [[ "$(systemctl is-enabled fgbears-instagram-start.timer 2>/dev/null || true)" != enabled ]]
          [[ "$(systemctl is-enabled fgbears-instagram-stop.timer 2>/dev/null || true)" != enabled ]]
          sudo grep -Fxq 'INSTAGRAM_RELAY_ENABLED=0' "$env_file"
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          REMOTE

      - name: Record Instagram pause
        if: always()
        env:
          PAUSE_OUTCOME: ${{ steps.pause.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/deployment-status
          paused=false; [[ "$PAUSE_OUTCOME" == success ]] && paused=true
          jq -n --argjson paused "$paused" --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg runId "$GITHUB_RUN_ID" --arg jobStatus "$JOB_STATUS" \
            '{instagramIngestActive:false,instagramPaused:$paused,pauseReason:"Follower threshold not yet reached",instagramAccountHandle:"@epic501c3",dailySchedule:"paused",publicBroadcastVerified:false,youtubePreserved:true,xPreserved:true,facebookPreserved:true,runId:$runId,checkedAt:$checkedAt,jobStatus:$jobStatus}' \
            > .github/deployment-status/fgbears-instagram.json
          git config user.name 'FGBears Deploy Bot'
          git config user.email 'actions@github.com'
          git add .github/deployment-status/fgbears-instagram.json
          git diff --cached --quiet || { git commit -m 'Record Instagram pause [skip ci]'; git push origin main; }
