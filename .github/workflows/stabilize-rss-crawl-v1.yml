name: Stabilize RSS And Crawl V1

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/stabilize-rss-crawl-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lovable-routing-bridge-20260902

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Stage renderer files
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          scp -i ~/.ssh/oracle_key \
            services/fgbears-live/bin/bears-news-feed-hq.py \
            services/fgbears-live/bin/crawl-overlay-hq.py \
            services/fgbears-live/bin/start-stream.sh \
            "$target:/tmp/"

      - name: Guarded production deployment and certification
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service
          ENV=/etc/fgbears-live/stream.env
          BACKUP=/tmp/fgb-ticker-backup-$$
          mkdir -p "$BACKUP"

          active() { systemctl is-active --quiet "$1"; }
          mainpid() { systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          ffpid() {
            local p
            p=$(mainpid "$1")
            [[ "$p" =~ ^[1-9][0-9]*$ ]] || return 1
            if [[ "$(cat /proc/$p/comm 2>/dev/null || true)" == ffmpeg ]]; then echo "$p"; else pgrep -P "$p" -x ffmpeg 2>/dev/null | sed -n '1p'; fi
          }
          has_port() {
            local p="$1" port="$2"
            sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v r=":$port" 'index($0,q)&&index($0,r){x=1} END{exit(x?0:1)}'
          }
          rumble_connected() { local p; p=$(ffpid "$RUMBLE" || true); [[ "$p" =~ ^[1-9][0-9]*$ ]] && has_port "$p" 1935; }
          youtube_connected() { local p; p=$(ffpid "$COMP" || true); [[ "$p" =~ ^[1-9][0-9]*$ ]] && has_port "$p" 443; }

          active "$MASTER"
          active "$RUMBLE"
          active "$COMP"
          active "$ROUTING"
          rumble_connected
          youtube_connected
          master0=$(mainpid "$MASTER")
          rumble0=$(mainpid "$RUMBLE")
          comp0=$(mainpid "$COMP")
          routing0=$(mainpid "$ROUTING")
          echo "PRE master=$master0 rumble=$rumble0 youtube_compositor=$comp0 routing=$routing0 load=$(cut -d' ' -f1-3 /proc/loadavg)"

          sudo cp -a /opt/fgbears-live/bin/crawl-overlay-hq.py "$BACKUP/crawl-overlay-hq.py"
          if [[ -e /opt/fgbears-live/bin/bears-news-feed-hq.py ]]; then
            sudo cp -a /opt/fgbears-live/bin/bears-news-feed-hq.py "$BACKUP/bears-news-feed-hq.py"
          fi
          sudo cp -a /usr/local/bin/fgbears-start-stream "$BACKUP/fgbears-start-stream"
          sudo cp -a "$ENV" "$BACKUP/stream.env"

          restarted=0
          success=0
          rollback() {
            rc=$?
            if (( success == 1 )); then return 0; fi
            if (( restarted == 1 )); then
              echo 'ROLLBACK=TICKER_START'
              sudo cp -a "$BACKUP/crawl-overlay-hq.py" /opt/fgbears-live/bin/crawl-overlay-hq.py || true
              if [[ -e "$BACKUP/bears-news-feed-hq.py" ]]; then
                sudo cp -a "$BACKUP/bears-news-feed-hq.py" /opt/fgbears-live/bin/bears-news-feed-hq.py || true
              else
                sudo rm -f /opt/fgbears-live/bin/bears-news-feed-hq.py || true
              fi
              sudo cp -a "$BACKUP/fgbears-start-stream" /usr/local/bin/fgbears-start-stream || true
              sudo cp -a "$BACKUP/stream.env" "$ENV" || true
              sudo systemctl restart "$MASTER" || true
              sleep 12
              active "$MASTER" || true
              rumble_connected || true
              youtube_connected || true
              echo 'ROLLBACK=TICKER_COMPLETE'
            fi
            exit "$rc"
          }
          trap rollback EXIT

          sudo install -m 0755 /tmp/bears-news-feed-hq.py /opt/fgbears-live/bin/bears-news-feed-hq.py
          sudo install -m 0755 /tmp/crawl-overlay-hq.py /opt/fgbears-live/bin/crawl-overlay-hq.py
          sudo install -m 0755 /tmp/start-stream.sh /usr/local/bin/fgbears-start-stream

          sudo python3 - "$ENV" <<'PY'
from pathlib import Path
import sys
path = Path(sys.argv[1])
lines = path.read_text(encoding='utf-8').splitlines()
updates = {
    'OUTPUT_FPS': '30',
    'CRAWL_OVERLAY_SCRIPT': '/opt/fgbears-live/bin/crawl-overlay-hq.py',
    'CRAWL_OVERLAY_FPS': '30',
    'CRAWL_TEXT_RENDER_SCALE': '2',
    'BEARS_NEWS_SCRIPT': '/opt/fgbears-live/bin/bears-news-feed-hq.py',
    'BEARS_NEWS_OVERLAY_FPS': '30',
    'BEARS_NEWS_SCROLL_PPS': '76',
}
seen = set()
out = []
for line in lines:
    if '=' in line and not line.lstrip().startswith('#'):
        key = line.split('=', 1)[0]
        if key in updates:
            if key not in seen:
                out.append(f'{key}={updates[key]}')
                seen.add(key)
            continue
    out.append(line)
for key, value in updates.items():
    if key not in seen:
        out.append(f'{key}={value}')
path.write_text('\n'.join(out) + '\n', encoding='utf-8')
PY
          sudo chown root:fgbears "$ENV"
          sudo chmod 0640 "$ENV"

          sudo python3 -m py_compile \
            /opt/fgbears-live/bin/bears-news-feed.py \
            /opt/fgbears-live/bin/bears-news-feed-hq.py \
            /opt/fgbears-live/bin/crawl-overlay.py \
            /opt/fgbears-live/bin/crawl-overlay-hq.py

          sudo python3 - <<'PY'
import importlib.util

def load(name, path):
    spec=importlib.util.spec_from_file_location(name,path)
    mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod
rss=load('rsshq','/opt/fgbears-live/bin/bears-news-feed-hq.py')
assert rss.BASE.FPS == 30
rss.STATE.update('FIRST HEADLINE')
rss.STATE.update('SECOND HEADLINE')
assert rss.STATE.pending_chars() > 0
crawl=load('crawlhq','/opt/fgbears-live/bin/crawl-overlay-hq.py')
s=crawl.BoundarySequence(); now=1.0
v={'active':True,'messages':['ONE','TWO']}
assert s.select(v,now)[0]=='ONE'
assert s.select({'active':True,'messages':['THREE']},now+1)[0]=='ONE'
assert s.pending_count()==1
assert s.advance_if_complete(-100000,100,now+2)
assert s.select({'active':True,'messages':['THREE']},now+2)[0]=='THREE'
print('STATIC_TICKER_TESTS=PASS')
PY

          echo 'MASTER_RESTART=BEGIN'
          restarted=1
          sudo systemctl restart "$MASTER"
          for _ in $(seq 1 40); do active "$MASTER" && curl -fsS --max-time 2 http://127.0.0.1:8789/healthz >/dev/null 2>&1 && curl -fsS --max-time 2 http://127.0.0.1:8788/healthz >/dev/null 2>&1 && break; sleep 1; done
          active "$MASTER"
          master1=$(mainpid "$MASTER")
          [[ "$master1" =~ ^[1-9][0-9]*$ && "$master1" != "$master0" ]]
          echo "MASTER_RESTART=PASS new_pid=$master1"

          rss_health=$(curl -fsS --max-time 3 http://127.0.0.1:8789/healthz)
          printf '%s' "$rss_health" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True,p;assert p.get("fps")==30,p;assert p.get("scrollPps")==76,p;assert p.get("payloadSwap")=="next-cycle-boundary",p;print("RSS_CONTRACT=PASS")'
          crawl_health=$(curl -fsS --max-time 3 http://127.0.0.1:8788/healthz)
          printf '%s' "$crawl_health" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True,p;assert p.get("fps")==30,p;print("CRAWL_30FPS=PASS")'

          cmd=$(tr '\0' ' ' <"/proc/$master1/cmdline")
          [[ "$cmd" == *fgbears-start-stream* || "$cmd" == *start-stream* ]]
          pgrep -P "$master1" -af 'bears-news-feed-hq.py' >/dev/null
          pgrep -P "$master1" -af 'crawl-overlay-hq.py' >/dev/null
          master_ff=$(pgrep -P "$master1" -x ffmpeg | sed -n '1p')
          [[ "$master_ff" =~ ^[1-9][0-9]*$ ]]
          master_ff_cmd=$(tr '\0' ' ' <"/proc/$master_ff/cmdline")
          [[ "$master_ff_cmd" == *'http://127.0.0.1:8789/overlay.mjpg'* ]]
          [[ "$master_ff_cmd" == *'http://127.0.0.1:8788/overlay.mjpg'* ]]
          echo 'MASTER_RENDERER_WIRING=PASS'

          # Relays should survive the short source restart. If either transport
          # dropped, allow systemd one recovery opportunity without altering the
          # other platform.
          if ! rumble_connected; then sudo systemctl restart "$RUMBLE"; sleep 5; fi
          if ! youtube_connected; then sudo systemctl restart "$COMP"; sleep 8; fi
          rumble_connected
          youtube_connected
          active "$RUMBLE"
          active "$COMP"
          active "$ROUTING"
          echo 'YOUTUBE_AND_RUMBLE_TRANSPORT=PASS'

          # The lightweight renderer endpoints must deliver continuously changing
          # frames at 30 fps. Four seconds gives enough samples to expose the old
          # 15-fps duplicate-frame pattern without a long production test.
          rm -rf /tmp/fgb-rss-motion /tmp/fgb-crawl-motion
          mkdir -p /tmp/fgb-rss-motion /tmp/fgb-crawl-motion
          timeout 5 ffmpeg -hide_banner -nostdin -loglevel error -i http://127.0.0.1:8789/overlay.mjpg -map 0:v:0 -vsync 0 /tmp/fgb-rss-motion/%04d.png >/dev/null 2>&1 || true
          timeout 5 ffmpeg -hide_banner -nostdin -loglevel error -i http://127.0.0.1:8788/overlay.mjpg -map 0:v:0 -vsync 0 /tmp/fgb-crawl-motion/%04d.png >/dev/null 2>&1 || true
          python3 - <<'PY'
from pathlib import Path
from PIL import Image, ImageChops

def certify(path, crop, name):
    files=sorted(Path(path).glob('*.png'))
    if len(files) < 70:
        raise AssertionError((name,'too few frames',len(files)))
    frames=[Image.open(p).convert('RGB').crop(crop) for p in files[:120]]
    changed=0
    for a,b in zip(frames,frames[1:]):
        if ImageChops.difference(a,b).getbbox() is not None:
            changed += 1
    ratio=changed/max(1,len(frames)-1)
    if ratio < .90:
        raise AssertionError((name,'motion ratio',ratio,len(frames)))
    print(f'{name}_MOTION=PASS frames={len(frames)} changed_ratio={ratio:.3f}')

certify('/tmp/fgb-rss-motion',(267,23,1257,91),'RSS')
certify('/tmp/fgb-crawl-motion',(267,15,1257,123),'CRAWL')
PY

          # Confirm the stream remains healthy after certification.
          sudo systemctl start fgbears-live-health.service
          [[ "$(systemctl show -p Result --value fgbears-live-health.service)" == success ]]
          rumble_connected
          youtube_connected
          echo "POST master=$master1 rumble=$(mainpid "$RUMBLE") youtube_compositor=$(mainpid "$COMP") load=$(cut -d' ' -f1-3 /proc/loadavg)"
          echo 'RSS=30fps_boundary_swap_last_good_preserved'
          echo 'CRAWL=30fps_current_segment_completes_before_refresh'
          echo 'STABILIZE_RSS_CRAWL=PASS'

          success=1
          trap - EXIT
          sudo rm -rf "$BACKUP" /tmp/fgb-rss-motion /tmp/fgb-crawl-motion /tmp/bears-news-feed-hq.py /tmp/crawl-overlay-hq.py /tmp/start-stream.sh || true
          REMOTE
