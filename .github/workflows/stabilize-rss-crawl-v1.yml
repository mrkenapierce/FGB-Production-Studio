name: Stabilize RSS And Crawl V1 - Manual Only

on:
  workflow_dispatch:

permissions:
  contents: read

# Production-mutating ticker deployment retained for controlled use only.
# It may restart the shared master encoder, so it must never run automatically
# from unrelated YouTube-overlay commits.

jobs:
  manual_notice:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment intentionally gated
        shell: bash
        run: |
          echo 'RSS/crawl production deployment is manual-only.'
          echo 'Use a dedicated guarded deployment when ticker changes are ready.'
