name: Restart FGBears YouTube Relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-youtube-relay-restart.yml'

permissions:
  contents: write

env:
  ORACLE_USER: ubuntu

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - id: restart
        name: Restart YouTube relay only
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          systemctl is-active --quiet fgbears-live.service
          grep -Fxq 'FACEBOOK_STREAM_ENABLED=0' /etc/fgbears-live/stream.env
          systemctl reset-failed fgbears-youtube-relay.service || true
          systemctl restart fgbears-youtube-relay.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          REMOTE

      - id: verify
        name: Verify local handoff and YouTube RTMPS
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          local_ok=false
          youtube_ok=false
          for _ in $(seq 1 75); do
            relay_pid=$(systemctl show -p MainPID --value fgbears-youtube-relay.service 2>/dev/null || echo 0)
            if [[ "$relay_pid" =~ ^[1-9][0-9]*$ ]]; then
              sudo ss -ntpH state established > /tmp/fgb-relay-restart-sockets.txt || true
              if grep "pid=$relay_pid" /tmp/fgb-relay-restart-sockets.txt | grep -Eq '127\.0\.0\.1:1935|\[::1\]:1935'; then
                local_ok=true
              fi
              getent ahostsv4 a.rtmps.youtube.com | awk '{print $1}' | sort -u > /tmp/fgb-relay-restart-yt-ips.txt
              grep "pid=$relay_pid" /tmp/fgb-relay-restart-sockets.txt > /tmp/fgb-relay-restart-only.txt || true
              while IFS= read -r ip; do
                [[ -n "$ip" ]] || continue
                if grep -Fq "$ip:443" /tmp/fgb-relay-restart-only.txt; then
                  youtube_ok=true
                  break
                fi
              done < /tmp/fgb-relay-restart-yt-ips.txt
              if [[ "$local_ok" == true && "$youtube_ok" == true ]]; then
                rm -f /tmp/fgb-relay-restart-sockets.txt /tmp/fgb-relay-restart-yt-ips.txt /tmp/fgb-relay-restart-only.txt
                echo 'YouTube relay local handoff and RTMPS established.'
                exit 0
              fi
            fi
            sleep 2
          done
          rm -f /tmp/fgb-relay-restart-sockets.txt /tmp/fgb-relay-restart-yt-ips.txt /tmp/fgb-relay-restart-only.txt
          echo "Relay verification incomplete: local=$local_ok youtube=$youtube_ok" >&2
          exit 1
          REMOTE

      - name: Record safe relay restart result
        if: always()
        env:
          RESTART_OUTCOME: ${{ steps.restart.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/deployment-status
          jq -n \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg jobStatus "$JOB_STATUS" \
            --arg restartOutcome "$RESTART_OUTCOME" \
            --arg verifyOutcome "$VERIFY_OUTCOME" \
            '{checkedAt:$checkedAt,runId:$runId,jobStatus:$jobStatus,restartOutcome:$restartOutcome,verifyOutcome:$verifyOutcome,primaryRestarted:false,facebookEnabled:false}' \
            > .github/deployment-status/fgbears-youtube-relay-restart.json
          git config user.name 'FGBears Deploy Bot'
          git config user.email 'actions@github.com'
          git add .github/deployment-status/fgbears-youtube-relay-restart.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record YouTube relay restart result [skip ci]'
          git push origin main
