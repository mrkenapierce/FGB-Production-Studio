name: Diagnose FGBears YouTube Relay Handoff

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-youtube-relay-local-diagnose.yml'

permissions:
  contents: write

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Collect safe relay handoff state
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' > /tmp/relay-handoff.env <<'REMOTE'
          set -Eeuo pipefail
          relay_active=false
          main_active=false
          relay_listening=false
          local_established=false
          primary_local_established=false
          relay_local_established=false
          youtube_established=false
          relay_failure_class=none

          systemctl is-active --quiet fgbears-youtube-relay.service && relay_active=true || true
          systemctl is-active --quiet fgbears-live.service && main_active=true || true
          relay_pid=$(systemctl show -p MainPID --value fgbears-youtube-relay.service 2>/dev/null || echo 0)
          main_pid=$(systemctl show -p MainPID --value fgbears-live.service 2>/dev/null || echo 0)
          primary_pid=''
          if [[ "$main_pid" =~ ^[1-9][0-9]*$ ]]; then
            primary_pid=$(pgrep -P "$main_pid" -x ffmpeg | head -1 || true)
          fi

          sudo ss -lntpH > /tmp/relay-listen.txt || true
          sudo ss -ntpH state established > /tmp/relay-established.txt || true

          if [[ "$relay_pid" =~ ^[1-9][0-9]*$ ]] && grep "pid=$relay_pid" /tmp/relay-listen.txt | grep -Eq '127\.0\.0\.1:1935|\[::1\]:1935'; then
            relay_listening=true
          fi
          if grep -Eq '127\.0\.0\.1:1935|\[::1\]:1935' /tmp/relay-established.txt; then
            local_established=true
          fi
          if [[ -n "$primary_pid" ]] && grep "pid=$primary_pid" /tmp/relay-established.txt | grep -Eq '127\.0\.0\.1:1935|\[::1\]:1935'; then
            primary_local_established=true
          fi
          if [[ "$relay_pid" =~ ^[1-9][0-9]*$ ]] && grep "pid=$relay_pid" /tmp/relay-established.txt | grep -Eq '127\.0\.0\.1:1935|\[::1\]:1935'; then
            relay_local_established=true
          fi

          getent ahostsv4 a.rtmps.youtube.com | awk '{print $1}' | sort -u > /tmp/relay-yt-ips.txt
          if [[ "$relay_pid" =~ ^[1-9][0-9]*$ ]]; then
            grep "pid=$relay_pid" /tmp/relay-established.txt > /tmp/relay-only-sockets.txt || true
            while IFS= read -r ip; do
              [[ -n "$ip" ]] || continue
              if grep -Fq "$ip:443" /tmp/relay-only-sockets.txt; then
                youtube_established=true
                break
              fi
            done < /tmp/relay-yt-ips.txt
          fi

          sudo journalctl -u fgbears-youtube-relay.service --since '20 minutes ago' --no-pager > /tmp/relay-journal.txt
          if grep -Eiq 'connection refused' /tmp/relay-journal.txt; then
            relay_failure_class=connection-refused
          elif grep -Eiq 'broken pipe|connection reset by peer' /tmp/relay-journal.txt; then
            relay_failure_class=connection-reset-or-broken-pipe
          elif grep -Eiq 'error opening output|input/output error|i/o error' /tmp/relay-journal.txt; then
            relay_failure_class=output-open-or-io-failure
          elif [[ "$relay_active" == true && "$relay_listening" == true && "$local_established" == false ]]; then
            relay_failure_class=waiting-for-local-publisher
          elif [[ "$relay_active" == true && "$local_established" == true && "$youtube_established" == false ]]; then
            relay_failure_class=local-input-present-no-youtube-socket
          fi

          printf 'RELAY_ACTIVE=%s\n' "$relay_active"
          printf 'MAIN_ACTIVE=%s\n' "$main_active"
          printf 'RELAY_LISTENING=%s\n' "$relay_listening"
          printf 'LOCAL_ESTABLISHED=%s\n' "$local_established"
          printf 'PRIMARY_LOCAL_ESTABLISHED=%s\n' "$primary_local_established"
          printf 'RELAY_LOCAL_ESTABLISHED=%s\n' "$relay_local_established"
          printf 'YOUTUBE_ESTABLISHED=%s\n' "$youtube_established"
          printf 'RELAY_FAILURE_CLASS=%s\n' "$relay_failure_class"

          rm -f /tmp/relay-listen.txt /tmp/relay-established.txt /tmp/relay-yt-ips.txt /tmp/relay-only-sockets.txt /tmp/relay-journal.txt
          REMOTE
          cat /tmp/relay-handoff.env

      - name: Record safe relay handoff result
        if: always()
        run: |
          set -Eeuo pipefail
          relay_active=false
          main_active=false
          relay_listening=false
          local_established=false
          primary_local_established=false
          relay_local_established=false
          youtube_established=false
          relay_failure_class=unknown
          if [[ -f /tmp/relay-handoff.env ]]; then
            while IFS='=' read -r key value; do
              case "$key" in
                RELAY_ACTIVE) relay_active="$value" ;;
                MAIN_ACTIVE) main_active="$value" ;;
                RELAY_LISTENING) relay_listening="$value" ;;
                LOCAL_ESTABLISHED) local_established="$value" ;;
                PRIMARY_LOCAL_ESTABLISHED) primary_local_established="$value" ;;
                RELAY_LOCAL_ESTABLISHED) relay_local_established="$value" ;;
                YOUTUBE_ESTABLISHED) youtube_established="$value" ;;
                RELAY_FAILURE_CLASS) relay_failure_class="$value" ;;
              esac
            done < /tmp/relay-handoff.env
          fi
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/deployment-status
          jq -n \
            --argjson relayActive "$relay_active" \
            --argjson mainActive "$main_active" \
            --argjson relayListening "$relay_listening" \
            --argjson localEstablished "$local_established" \
            --argjson primaryLocalEstablished "$primary_local_established" \
            --argjson relayLocalEstablished "$relay_local_established" \
            --argjson youtubeEstablished "$youtube_established" \
            --arg relayFailureClass "$relay_failure_class" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runId "$GITHUB_RUN_ID" \
            '{relayActive:$relayActive,mainActive:$mainActive,relayListening:$relayListening,localEstablished:$localEstablished,primaryLocalEstablished:$primaryLocalEstablished,relayLocalEstablished:$relayLocalEstablished,youtubeEstablished:$youtubeEstablished,relayFailureClass:$relayFailureClass,checkedAt:$checkedAt,runId:$runId}' \
            > .github/deployment-status/fgbears-youtube-relay-handoff.json
          git config user.name 'FGBears Deploy Bot'
          git config user.email 'actions@github.com'
          git add .github/deployment-status/fgbears-youtube-relay-handoff.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record YouTube relay handoff diagnostic [skip ci]'
          git push origin main
