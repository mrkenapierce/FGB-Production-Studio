name: Activate Isolated FGBears Facebook Simulcast

on:
  push:
    branches: [main]
    paths:
      - '.github/facebook-activate-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fgbears-live-production-deploy
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu
  FACEBOOK_RTMP_BASE: rtmps://live-api-s.facebook.com:443/rtmp/

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require production secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          FGB_FACEBOOK_STREAM_KEY: ${{ secrets.FGB_FACEBOOK_STREAM_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          test -n "$FGB_FACEBOOK_STREAM_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - id: activate_facebook
        name: Enable isolated Facebook sidecar
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          FGB_FACEBOOK_STREAM_KEY: ${{ secrets.FGB_FACEBOOK_STREAM_KEY }}
        run: |
          set -Eeuo pipefail
          {
            printf '%s\n' "$FACEBOOK_RTMP_BASE"
            printf '%s\n' "$FGB_FACEBOOK_STREAM_KEY"
          } | ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo fgbears-configure-facebook'

      - id: verify_facebook
        name: Verify three isolated transports and rollback on failure
        if: always() && steps.activate_facebook.outcome == 'success'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' > /tmp/facebook-verify.env <<'REMOTE'
          set -u
          env_file=/etc/fgbears-live/stream.env
          legacy=false; relay_enabled=false; key_present=false
          sudo grep -Eq '^FACEBOOK_STREAM_ENABLED=(1|true|yes|on)$' "$env_file" && legacy=true || true
          sudo grep -Eq '^FACEBOOK_RELAY_ENABLED=(1|true|yes|on)$' "$env_file" && relay_enabled=true || true
          sudo awk -F= '/^FACEBOOK_STREAM_KEY=/{if(length(substr($0,index($0,"=")+1))>0) ok=1} END{exit ok?0:1}' "$env_file" && key_present=true || true
          if [[ "$legacy" == true || "$relay_enabled" != true || "$key_present" != true ]]; then
            printf 'ACTIVE=false\nROLLED_BACK=false\nFAILURE_CLASS=configuration-invariant-failed\n'
            exit 1
          fi

          stable=0; failure=transport-not-stable
          primary_pid_first=''; youtube_pid_first=''; facebook_pid_first=''
          youtube_ok=false; x_ok=false; facebook_ok=false; local_ok=false
          for _ in $(seq 1 90); do
            main_pid=$(systemctl show -p MainPID --value fgbears-live.service 2>/dev/null || echo 0)
            youtube_pid=$(systemctl show -p MainPID --value fgbears-youtube-relay.service 2>/dev/null || echo 0)
            facebook_pid=$(systemctl show -p MainPID --value fgbears-facebook-relay.service 2>/dev/null || echo 0)
            if [[ "$main_pid" =~ ^[1-9][0-9]*$ && "$youtube_pid" =~ ^[1-9][0-9]*$ && "$facebook_pid" =~ ^[1-9][0-9]*$ ]] && \
               systemctl is-active --quiet fgbears-live.service && systemctl is-active --quiet fgbears-youtube-relay.service && systemctl is-active --quiet fgbears-facebook-relay.service; then
              [[ -n "$primary_pid_first" ]] || primary_pid_first="$main_pid"
              [[ -n "$youtube_pid_first" ]] || youtube_pid_first="$youtube_pid"
              [[ -n "$facebook_pid_first" ]] || facebook_pid_first="$facebook_pid"
              if [[ "$main_pid" != "$primary_pid_first" ]]; then failure=primary-restarted-during-verification; break; fi
              if [[ "$youtube_pid" != "$youtube_pid_first" ]]; then failure=youtube-relay-restarted-during-verification; break; fi
              if [[ "$facebook_pid" != "$facebook_pid_first" ]]; then failure=facebook-relay-restarted-during-verification; break; fi
              primary_ffmpeg=$(pgrep -P "$main_pid" -x ffmpeg | head -n 1 || true)
              sockets=$(mktemp)
              sudo ss -ntpH state established > "$sockets" || true
              grep "pid=$youtube_pid" "$sockets" | grep -vE '127\.0\.0\.1|\[::1\]' | grep -q ':443' && youtube_ok=true || youtube_ok=false
              [[ -n "$primary_ffmpeg" ]] && grep "pid=$primary_ffmpeg" "$sockets" | grep -vE '127\.0\.0\.1|\[::1\]' | grep -q ':443' && x_ok=true || x_ok=false
              grep "pid=$facebook_pid" "$sockets" | grep -vE '127\.0\.0\.1|\[::1\]' | grep -q ':443' && facebook_ok=true || facebook_ok=false
              [[ -n "$primary_ffmpeg" ]] && grep "pid=$primary_ffmpeg" "$sockets" | grep -q '127.0.0.1:1936' && local_ok=true || local_ok=false
              if [[ -n "$primary_ffmpeg" ]]; then
                args=$(mktemp); sudo tr '\0' '\n' < "/proc/$primary_ffmpeg/cmdline" > "$args"
                if grep -Fq 'live-api-s.facebook.com' "$args"; then
                  rm -f "$args" "$sockets"; failure=unsafe-meta-endpoint-in-primary; break
                fi
                rm -f "$args"
              fi
              rm -f "$sockets"
              if [[ "$youtube_ok" == true && "$x_ok" == true && "$facebook_ok" == true && "$local_ok" == true ]]; then
                stable=$((stable+1))
                if (( stable >= 5 )); then
                  printf 'ACTIVE=true\nROLLED_BACK=false\nYOUTUBE=true\nX=true\nFACEBOOK=true\nLOCAL=true\nFAILURE_CLASS=none\n'
                  exit 0
                fi
              else
                stable=0
              fi
            fi
            sleep 2
          done

          # Facebook did not prove stable. Remove only the Facebook feature and
          # restore the primary destination set; the YouTube relay configuration
          # is never modified by this rollback.
          sudo fgbears-configure-facebook --disable >/dev/null 2>&1 || true
          printf 'ACTIVE=false\nROLLED_BACK=true\nYOUTUBE=%s\nX=%s\nFACEBOOK=false\nLOCAL=false\nFAILURE_CLASS=%s\n' "$youtube_ok" "$x_ok" "$failure"
          exit 1
          REMOTE
          cat /tmp/facebook-verify.env

      - name: Record Facebook activation result
        if: always()
        env:
          ACTIVATE_OUTCOME: ${{ steps.activate_facebook.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_facebook.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout -B main origin/main
          active=false; rolled_back=false; youtube=false; x=false; facebook=false; local=false; failure=verification-unavailable
          if [[ -f /tmp/facebook-verify.env ]]; then
            while IFS='=' read -r k v; do
              case "$k" in
                ACTIVE) active="$v";; ROLLED_BACK) rolled_back="$v";; YOUTUBE) youtube="$v";; X) x="$v";; FACEBOOK) facebook="$v";; LOCAL) local="$v";; FAILURE_CLASS) failure="$v";;
              esac
            done < /tmp/facebook-verify.env
          fi
          mkdir -p .github/deployment-status
          jq -n --argjson active "$active" --argjson rolledBack "$rolled_back" --argjson youtubeEstablished "$youtube" --argjson xEstablished "$x" --argjson facebookEstablished "$facebook" --argjson localFacebookHandoff "$local" --arg failureClass "$failure" --arg runId "$GITHUB_RUN_ID" --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg jobStatus "$JOB_STATUS" --arg activateOutcome "$ACTIVATE_OUTCOME" --arg verifyOutcome "$VERIFY_OUTCOME" '{facebookSimulcastActive:$active,rolledBack:$rolledBack,youtubeEstablished:$youtubeEstablished,xEstablished:$xEstablished,facebookEstablished:$facebookEstablished,localFacebookHandoff:$localFacebookHandoff,primaryExternalMetaEndpoint:false,transport:"primary-localhost-to-isolated-facebook-copy-remux",failureClass:$failureClass,runId:$runId,checkedAt:$checkedAt,jobStatus:$jobStatus,activateOutcome:$activateOutcome,verifyOutcome:$verifyOutcome}' > .github/deployment-status/fgbears-facebook.json
          git config user.name 'FGBears Deploy Bot'; git config user.email 'actions@github.com'
          git add .github/deployment-status/fgbears-facebook.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record isolated FGBears Facebook activation result [skip ci]'
          git push origin main
