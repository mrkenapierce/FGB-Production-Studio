name: Activate Scheduled FGBears Facebook Simulcast
on:
  push:
    branches: [main]
    paths:
      - 'services/fgbears-live/bin/configure-facebook.sh'
      - 'services/fgbears-live/systemd/fgbears-facebook-start.timer'
      - 'services/fgbears-live/systemd/fgbears-facebook-stop.timer'
      - '.github/workflows/fgbears-facebook-activate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fgbears-live-production-deploy
  cancel-in-progress: false
env:
  ORACLE_USER: ubuntu
  FACEBOOK_RTMP_BASE: rtmps://live-api-s.facebook.com:443/rtmp/
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare protected connection
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          FB_KEY: ${{ secrets.FGB_FACEBOOK_STREAM_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY" && test -n "$FB_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Install Facebook schedule only
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          scp -i ~/.ssh/oracle_key services/fgbears-live/bin/configure-facebook.sh services/fgbears-live/systemd/fgbears-facebook-start.timer services/fgbears-live/systemd/fgbears-facebook-stop.timer "$ORACLE_USER@$ORACLE_HOST:/tmp/"
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo install -m 0755 /tmp/configure-facebook.sh /usr/local/bin/fgbears-configure-facebook && sudo install -m 0644 /tmp/fgbears-facebook-start.timer /tmp/fgbears-facebook-stop.timer /etc/systemd/system/ && sudo systemctl daemon-reload'
      - name: Configure Facebook 9-to-5 schedule
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          FB_KEY: ${{ secrets.FGB_FACEBOOK_STREAM_KEY }}
        run: |
          { printf '%s\n' "$FACEBOOK_RTMP_BASE"; printf '%s\n' "$FB_KEY"; } | ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo fgbears-configure-facebook'
      - name: Verify schedule without touching other platforms
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/fgbears-live/stream.env
          sudo grep -Fxq 'FACEBOOK_SCHEDULE_START=09:00' "$env_file"
          sudo grep -Fxq 'FACEBOOK_SCHEDULE_STOP=17:00' "$env_file"
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          systemctl is-active --quiet fgbears-x-relay.service
          systemctl is-active --quiet fgbears-instagram-relay.service
          systemctl is-active --quiet fgbears-facebook-relay.service
          test "$(systemctl is-enabled fgbears-facebook-start.timer)" = enabled
          test "$(systemctl is-enabled fgbears-facebook-stop.timer)" = enabled
          REMOTE
