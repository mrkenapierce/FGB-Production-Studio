name: Deploy YouTube v3 Rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/fgbears-live/youtube-v3/**'
      - 'services/fgbears-live/quarantine/youtube-v2-retired-20260903/**'
      - 'services/fgbears-live/bin/install.sh'
      - 'services/fgbears-live/bin/healthcheck.sh'
      - '.github/workflows/youtube-v3-deploy.yml'

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-v3-production
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user pillow qrcode

      - name: Build and validate replacement locally
        run: |
          set -Eeuo pipefail
          python3 services/fgbears-live/youtube-v3/build-creatives.py
          python3 -m py_compile services/fgbears-live/youtube-v3/youtube-v3-overlay.py
          bash -n services/fgbears-live/youtube-v3/run-youtube-v3.sh
          bash -n services/fgbears-live/youtube-v3/verify-youtube-v3.sh
          bash -n services/fgbears-live/bin/healthcheck.sh
          YOUTUBE_V3_CREATIVE_DIR="$PWD/services/fgbears-live/youtube-v3/creatives" \
            python3 services/fgbears-live/youtube-v3/youtube-v3-overlay.py --self-test --offline
          ! grep -Eq '^Nice=|^CPUWeight=' services/fgbears-live/youtube-v3/fgbears-youtube-v3.service
          grep -Fq 'YOUTUBE_SERVICE=fgbears-youtube-v3.service' services/fgbears-live/bin/healthcheck.sh
          echo 'V3_LOCAL_PREFLIGHT=PASS'

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"; test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Stage locked creative on Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/oracle_key \
            services/fgbears-live/youtube-v3/creatives/yt_rumble_trivia_redirect.png \
            "$ORACLE_USER@$ORACLE_HOST:/tmp/yt-rumble-v3.png"

      - name: Transactionally replace v2 with v3 and quarantine v2
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          V2=fgbears-youtube-v2.service
          V3=fgbears-youtube-v3.service
          HEALTH_TIMER=fgbears-live-health.timer
          HEALTH_BIN=/usr/local/bin/fgbears-healthcheck
          HEALTH_BACKUP=/tmp/fgbears-healthcheck.pre-v3
          V2DIR=/opt/fgbears-live/youtube-v2
          V2QUAR=/opt/fgbears-live/quarantine/youtube-v2-retired-20260903
          V3DIR=/opt/fgbears-live/youtube-v3

          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          connected(){
            local p=$1 port=$2
            [[ "$p" =~ ^[1-9][0-9]*$ ]] || return 1
            sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'
          }
          fail(){ echo "YOUTUBE_V3_DEPLOY=FAIL reason=$1" >&2; return 1; }
          CUTOVER=0
          master_before=""; rumble_before=""; v2_before=""

          rollback() {
            trap - ERR
            set +e
            echo 'YOUTUBE_V3_ROLLBACK=BEGIN'
            sudo systemctl stop "$HEALTH_TIMER" 2>/dev/null || true
            sudo systemctl stop "$V3" 2>/dev/null || true
            sudo systemctl disable "$V3" >/dev/null 2>&1 || true
            sudo rm -f /etc/systemd/system/fgbears-youtube-v3.service /lib/systemd/system/fgbears-youtube-v3.service /usr/lib/systemd/system/fgbears-youtube-v3.service

            if [[ -d "$V2QUAR" && ! -e "$V2DIR" ]]; then sudo mv "$V2QUAR" "$V2DIR"; fi
            if [[ -d "$V2DIR" ]]; then
              sudo find "$V2DIR" -type d -exec chmod 0755 {} +
              sudo chmod 0755 "$V2DIR/youtube-v2-overlay.py" "$V2DIR/run-youtube-v2.sh" "$V2DIR/verify-youtube-v2.sh" 2>/dev/null || true
              sudo chmod 0644 "$V2DIR/fgbears-youtube-v2.service" "$V2DIR"/creatives/* 2>/dev/null || true
              sudo systemctl unmask "$V2" 2>/dev/null || true
              sudo install -m 0644 "$V2DIR/fgbears-youtube-v2.service" /etc/systemd/system/fgbears-youtube-v2.service
            fi
            if [[ -s "$HEALTH_BACKUP" ]]; then sudo install -m 0755 "$HEALTH_BACKUP" "$HEALTH_BIN"; fi
            sudo systemctl daemon-reload
            sudo systemctl enable "$V2" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "$V2" 2>/dev/null || true
            sudo systemctl restart "$V2" || true

            restored=no
            for _ in $(seq 1 90); do
              y=$(pid "$V2")
              if systemctl is-active --quiet "$V2" && connected "$y" 443; then restored=yes; break; fi
              sleep 1
            done
            sudo systemctl start "$HEALTH_TIMER" 2>/dev/null || true
            sudo rm -rf "$V3DIR"
            sudo rm -f /tmp/yt-rumble-v3.png

            m=$(pid "$MASTER"); r=$(pid "$RUMBLE"); y=$(pid "$V2")
            [[ "$restored" == yes ]] || echo 'YOUTUBE_V3_ROLLBACK_WARNING=v2_socket_not_restored_within_90s' >&2
            [[ -z "$master_before" || "$m" == "$master_before" ]] || echo "YOUTUBE_V3_ROLLBACK_WARNING=master_pid_changed:$master_before->$m" >&2
            [[ -z "$rumble_before" || "$r" == "$rumble_before" ]] || echo "YOUTUBE_V3_ROLLBACK_WARNING=rumble_pid_changed:$rumble_before->$r" >&2
            echo "YOUTUBE_V3_ROLLBACK=END v2_restored=$restored master=$m rumble=$r youtube_v2=$y"
          }
          trap 'rc=$?; if (( CUTOVER )); then rollback; fi; exit $rc' ERR

          master_before=$(pid "$MASTER"); rumble_before=$(pid "$RUMBLE"); v2_before=$(pid "$V2")
          [[ "$master_before" =~ ^[1-9][0-9]*$ ]] || fail master_not_active
          [[ "$rumble_before" =~ ^[1-9][0-9]*$ ]] || fail rumble_not_active
          [[ "$v2_before" =~ ^[1-9][0-9]*$ ]] || fail v2_not_active
          connected "$v2_before" 443 || fail v2_not_connected_before_cutover
          systemctl is-active --quiet "$HEALTH_TIMER" || fail health_timer_not_active
          sudo cp -f "$HEALTH_BIN" "$HEALTH_BACKUP"
          sudo chmod 0755 "$HEALTH_BACKUP"
          grep -Fq 'recover_youtube_v2' "$HEALTH_BACKUP" || fail pre_cutover_healthcheck_not_v2

          rm -rf /tmp/fgb-youtube-v3-deploy
          git clone --depth 1 https://github.com/mrkenapierce/FGB-Production-Studio.git /tmp/fgb-youtube-v3-deploy
          src=/tmp/fgb-youtube-v3-deploy/services/fgbears-live

          sudo rm -rf "$V3DIR"
          sudo install -d -m 0755 "$V3DIR/creatives"
          sudo rsync -a --exclude 'creatives/yt_rumble_trivia_redirect.png' "$src/youtube-v3/" "$V3DIR/"
          sudo install -m 0644 /tmp/yt-rumble-v3.png "$V3DIR/creatives/yt_rumble_trivia_redirect.png"
          sudo chmod 0755 "$V3DIR/youtube-v3-overlay.py" "$V3DIR/run-youtube-v3.sh" "$V3DIR/verify-youtube-v3.sh" "$V3DIR/build-creatives.py"
          sudo install -m 0644 "$V3DIR/fgbears-youtube-v3.service" /etc/systemd/system/fgbears-youtube-v3.service
          sudo systemctl daemon-reload

          sudo -u fgbears env \
            YOUTUBE_V3_CREATIVE_DIR="$V3DIR/creatives" \
            YOUTUBE_V3_STATE_FILE=/tmp/fgb-youtube-v3-preflight-state.json \
            "$V3DIR/youtube-v3-overlay.py" --self-test
          sudo rm -f /tmp/fgb-youtube-v3-preflight-state.json

          # Freeze only the recovery timer during handoff so it cannot revive v2
          # while v3 is being certified. Master and Rumble remain untouched.
          CUTOVER=1
          sudo systemctl stop "$HEALTH_TIMER"
          sudo systemctl stop "$V2"
          sudo systemctl disable "$V2" >/dev/null 2>&1 || true
          sudo rm -rf "$V2QUAR"
          sudo install -d -m 0755 "$(dirname "$V2QUAR")"
          sudo mv "$V2DIR" "$V2QUAR"
          sudo find "$V2QUAR" -type d -exec chmod 0755 {} +
          sudo find "$V2QUAR" -type f -exec chmod 0644 {} +
          sudo rm -f /etc/systemd/system/fgbears-youtube-v2.service /lib/systemd/system/fgbears-youtube-v2.service /usr/lib/systemd/system/fgbears-youtube-v2.service
          sudo systemctl daemon-reload
          sudo systemctl mask "$V2" >/dev/null

          sudo systemctl enable "$V3" >/dev/null
          sudo systemctl reset-failed "$V3" || true
          sudo systemctl start "$V3"

          v3_connected=no
          for _ in $(seq 1 90); do
            y=$(pid "$V3")
            if systemctl is-active --quiet "$V3" && connected "$y" 443; then v3_connected=yes; break; fi
            sleep 1
          done
          [[ "$v3_connected" == yes ]] || fail v3_did_not_connect
          v3_pid=$(pid "$V3")
          echo "V3_SOCKET=PASS pid=$v3_pid port443=yes"

          sleep 12
          sudo "$V3DIR/verify-youtube-v3.sh"
          sleep 10
          sudo "$V3DIR/verify-youtube-v3.sh"

          # Observe sustained live pacing before changing the permanent health
          # supervisor. CPU headroom is reported for the next optimization gate.
          : > /tmp/v3-observe.txt
          for _ in $(seq 1 30); do
            p=/run/fgbears-youtube-v3/ffmpeg-progress.log
            speed=$(sudo sed -n 's/^speed=\([0-9.]*\)x$/\1/p' "$p" 2>/dev/null | tail -n1)
            fps=$(sudo sed -n 's/^fps=\([0-9.]*\)$/\1/p' "$p" 2>/dev/null | tail -n1)
            drop=$(sudo sed -n 's/^drop_frames=\([0-9]*\)$/\1/p' "$p" 2>/dev/null | tail -n1)
            dup=$(sudo sed -n 's/^dup_frames=\([0-9]*\)$/\1/p' "$p" 2>/dev/null | tail -n1)
            idle=$(vmstat 1 2 | tail -n1 | awk '{print $15}')
            pressure=$(awk '/^some/{for(i=1;i<=NF;i++) if($i ~ /^avg10=/){split($i,a,"=");print a[2]}}' /proc/pressure/cpu)
            echo "speed=${speed:-NA} fps=${fps:-NA} drop=${drop:-NA} dup=${dup:-NA} idle=${idle:-NA} pressure=${pressure:-NA}" >> /tmp/v3-observe.txt
            sleep 1
          done
          python3 - /tmp/v3-observe.txt <<'PY'
          import re,sys
          rows=open(sys.argv[1]).read().splitlines(); keys=('speed','fps','drop','dup','idle','pressure'); vals={k:[] for k in keys}
          for row in rows:
              for k in keys:
                  m=re.search(k+r'=([^ ]+)',row)
                  if m and m.group(1)!='NA':
                      try: vals[k].append(float(m.group(1)))
                      except ValueError: pass
          for k,a in vals.items():
              if a: print('V3_OBSERVE_%s min=%.3f avg=%.3f max=%.3f' % (k.upper(),min(a),sum(a)/len(a),max(a)))
          assert vals['speed'] and min(vals['speed']) >= 0.98, vals['speed']
          if vals['drop']: assert max(vals['drop'])-min(vals['drop']) <= 2, vals['drop']
          PY
          if sudo journalctl -u "$V3" --since '-5 minutes' --no-pager 2>/dev/null | grep -Fq 'Circular buffer overrun'; then fail v3_udp_overrun_observed; fi

          master_after=$(pid "$MASTER"); rumble_after=$(pid "$RUMBLE"); v3_after=$(pid "$V3")
          test "$master_after" = "$master_before" || fail master_pid_changed
          test "$rumble_after" = "$rumble_before" || fail rumble_pid_changed
          test "$v3_after" = "$v3_pid" || fail v3_pid_changed_during_observation

          # Only after v3 passes live certification does permanent supervision
          # switch to v3. Rollback backup is retained until this succeeds.
          sudo install -m 0755 "$src/bin/healthcheck.sh" "$HEALTH_BIN"
          grep -Fq 'YOUTUBE_SERVICE=fgbears-youtube-v3.service' "$HEALTH_BIN" || fail v3_healthcheck_not_installed
          sudo systemctl start "$HEALTH_TIMER"
          systemctl is-active --quiet "$HEALTH_TIMER" || fail health_timer_not_restored
          sleep 3
          sudo "$V3DIR/verify-youtube-v3.sh"

          test "$(pid "$MASTER")" = "$master_before" || fail master_pid_changed_final
          test "$(pid "$RUMBLE")" = "$rumble_before" || fail rumble_pid_changed_final
          test "$(pid "$V3")" = "$v3_pid" || fail v3_pid_changed_final
          systemctl is-active --quiet "$V2" && fail v2_active_after_success
          [[ "$(systemctl is-enabled "$V2" 2>/dev/null || true)" == masked* ]] || fail v2_not_masked_after_success
          [[ ! -e "$V2DIR" ]] || fail v2_active_directory_present
          [[ -d "$V2QUAR" ]] || fail v2_quarantine_missing
          if sudo find "$V2QUAR" -type f -perm /111 -print -quit | grep -q .; then fail v2_quarantine_executable; fi

          sudo rm -f "$HEALTH_BACKUP" /tmp/yt-rumble-v3.png
          CUTOVER=0
          trap - ERR
          echo "YOUTUBE_V3_DEPLOY=PASS master=$master_before rumble=$rumble_before v2_before=$v2_before youtube_v3=$v3_pid v2=quarantined health=v3"
          REMOTE
