name: Deploy YouTube v3 Control Plane

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-v3-deploy.yml'

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-v3-production
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user pillow qrcode

      - name: Build and validate control-plane candidate locally
        run: |
          set -Eeuo pipefail
          V3=services/fgbears-live/youtube-v3
          python3 "$V3/build-creatives.py"
          python3 -m py_compile "$V3/youtube-v3-overlay.py" "$V3/lovable-state-cache.py"
          bash -n "$V3/run-youtube-v3.sh"
          bash -n "$V3/verify-youtube-v3.sh"
          bash -n services/fgbears-live/bin/healthcheck.sh
          ! grep -Eq 'urllib|urlopen|requests|http://|https://' "$V3/youtube-v3-overlay.py"
          grep -Fq '/api/public/fgbears/stream-routing' "$V3/lovable-state-cache.py"
          grep -Fq 'fgb-stream-state/v1' "$V3/lovable-state-cache.py"
          grep -Fq 'FGB_CONTROL_STATE_FILE=/run/fgbears-control-plane/stream-state.json' "$V3/fgbears-youtube-v3.service"
          grep -Fq 'Wants=network-online.target fgbears-lovable-state-cache.service' "$V3/fgbears-youtube-v3.service"
          grep -Fq 'overlay=462:104:format=auto:shortest=0:repeatlast=1:eof_action=repeat[composited]' "$V3/run-youtube-v3.sh"
          grep -Fq 'scale=1152:648:flags=fast_bilinear[v]' "$V3/run-youtube-v3.sh"
          YOUTUBE_V3_CREATIVE_DIR="$PWD/$V3/creatives" \
          FGB_CONTROL_STATE_FILE=/tmp/fgb-control-state-intentionally-missing.json \
            python3 "$V3/youtube-v3-overlay.py" --self-test
          tar -C services/fgbears-live -czf /tmp/fgb-youtube-v3-control-plane.tgz youtube-v3
          cp services/fgbears-live/bin/healthcheck.sh /tmp/fgbears-healthcheck-control-plane
          echo 'CONTROL_PLANE_LOCAL_PREFLIGHT=PASS renderer=local-only cache=sole-http-client master=untouched rumble=untouched'

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"; test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Stage exact candidate on Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/oracle_key \
            /tmp/fgb-youtube-v3-control-plane.tgz \
            /tmp/fgbears-healthcheck-control-plane \
            "$ORACLE_USER@$ORACLE_HOST:/tmp/"

      - name: Install cache boundary and restart YouTube destination only
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          YOUTUBE=fgbears-youtube-v3.service
          CACHE=fgbears-lovable-state-cache.service
          V3DIR=/opt/fgbears-live/youtube-v3
          STAGE=/opt/fgbears-live/.youtube-v3-control-plane-candidate
          BACKUP=/opt/fgbears-live/.youtube-v3-before-control-plane
          HEALTH=/usr/local/bin/fgbears-healthcheck
          HEALTH_BACKUP=/tmp/fgbears-healthcheck-before-control-plane
          YT_UNIT_BACKUP=/tmp/fgbears-youtube-v3.service.before-control-plane
          CACHE_UNIT_BACKUP=/tmp/fgbears-lovable-state-cache.service.before-control-plane
          CACHE_PREEXISTED=0
          CUTOVER=0

          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          connected(){
            local p=$1 port=$2
            [[ "$p" =~ ^[1-9][0-9]*$ ]] || return 1
            sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v x=":$port" 'index($0,q)&&index($0,x){ok=1} END{exit(ok?0:1)}'
          }
          fail(){ echo "CONTROL_PLANE_DEPLOY=FAIL reason=$1" >&2; return 1; }
          rollback(){
            trap - ERR; set +e
            echo 'CONTROL_PLANE_ROLLBACK=BEGIN'
            sudo systemctl stop "$YOUTUBE" 2>/dev/null || true
            sudo systemctl stop "$CACHE" 2>/dev/null || true
            if [[ -d "$BACKUP" ]]; then
              sudo rm -rf "$V3DIR"
              sudo mv "$BACKUP" "$V3DIR"
            fi
            [[ -s "$YT_UNIT_BACKUP" ]] && sudo install -m 0644 "$YT_UNIT_BACKUP" /etc/systemd/system/fgbears-youtube-v3.service
            if (( CACHE_PREEXISTED )) && [[ -s "$CACHE_UNIT_BACKUP" ]]; then
              sudo install -m 0644 "$CACHE_UNIT_BACKUP" /etc/systemd/system/fgbears-lovable-state-cache.service
            else
              sudo rm -f /etc/systemd/system/fgbears-lovable-state-cache.service
            fi
            [[ -s "$HEALTH_BACKUP" ]] && sudo install -m 0755 "$HEALTH_BACKUP" "$HEALTH"
            sudo systemctl daemon-reload
            sudo systemctl reset-failed "$YOUTUBE" 2>/dev/null || true
            sudo systemctl start "$YOUTUBE" || true
            echo "CONTROL_PLANE_ROLLBACK=END master=$(pid "$MASTER") rumble=$(pid "$RUMBLE") youtube=$(pid "$YOUTUBE")"
          }
          trap 'rc=$?; if (( CUTOVER )); then rollback; fi; exit $rc' ERR

          systemctl is-active --quiet "$MASTER" || fail master_inactive
          systemctl is-active --quiet "$RUMBLE" || fail rumble_inactive
          systemctl is-active --quiet "$YOUTUBE" || fail youtube_inactive
          master_before=$(pid "$MASTER")
          rumble_before=$(pid "$RUMBLE")
          youtube_before=$(pid "$YOUTUBE")
          [[ "$master_before" =~ ^[1-9][0-9]*$ ]] || fail master_pid_invalid
          [[ "$rumble_before" =~ ^[1-9][0-9]*$ ]] || fail rumble_pid_invalid
          [[ "$youtube_before" =~ ^[1-9][0-9]*$ ]] || fail youtube_pid_invalid
          connected "$rumble_before" 1935 || fail rumble_socket_missing
          connected "$youtube_before" 443 || fail youtube_socket_missing
          [[ -d "$V3DIR" ]] || fail youtube_v3_runtime_missing

          sudo cp "$HEALTH" "$HEALTH_BACKUP"
          sudo cp /etc/systemd/system/fgbears-youtube-v3.service "$YT_UNIT_BACKUP"
          if [[ -r /etc/systemd/system/fgbears-lovable-state-cache.service ]]; then
            CACHE_PREEXISTED=1
            sudo cp /etc/systemd/system/fgbears-lovable-state-cache.service "$CACHE_UNIT_BACKUP"
          fi

          sudo rm -rf "$STAGE" "$BACKUP"
          sudo install -d -m 0755 "$STAGE"
          sudo tar -C "$STAGE" -xzf /tmp/fgb-youtube-v3-control-plane.tgz
          CANDIDATE="$STAGE/youtube-v3"
          sudo chmod 0755 "$CANDIDATE/youtube-v3-overlay.py" "$CANDIDATE/lovable-state-cache.py" "$CANDIDATE/run-youtube-v3.sh" "$CANDIDATE/verify-youtube-v3.sh" "$CANDIDATE/build-creatives.py"

          sudo -u fgbears env \
            FGB_CONTROL_STATE_FILE=/tmp/fgb-control-preflight-state.json \
            FGB_CONTROL_HEALTH_FILE=/tmp/fgb-control-preflight-health.json \
            "$CANDIDATE/lovable-state-cache.py" --self-test
          sudo -u fgbears env \
            YOUTUBE_V3_CREATIVE_DIR="$CANDIDATE/creatives" \
            FGB_CONTROL_STATE_FILE=/tmp/fgb-control-state-intentionally-missing.json \
            "$CANDIDATE/youtube-v3-overlay.py" --self-test
          sudo rm -f /tmp/fgb-control-preflight-state.json /tmp/fgb-control-preflight-health.json

          CUTOVER=1
          sudo systemctl stop "$YOUTUBE"
          sudo systemctl stop "$CACHE" 2>/dev/null || true
          sudo mv "$V3DIR" "$BACKUP"
          sudo mv "$CANDIDATE" "$V3DIR"
          sudo rm -rf "$STAGE"
          sudo install -m 0644 "$V3DIR/fgbears-lovable-state-cache.service" /etc/systemd/system/fgbears-lovable-state-cache.service
          sudo install -m 0644 "$V3DIR/fgbears-youtube-v3.service" /etc/systemd/system/fgbears-youtube-v3.service
          sudo install -m 0755 /tmp/fgbears-healthcheck-control-plane "$HEALTH"
          sudo systemctl daemon-reload
          sudo systemctl reset-failed "$CACHE" "$YOUTUBE" 2>/dev/null || true
          sudo systemctl enable --now "$CACHE"

          cache_ready=no
          for _ in $(seq 1 30); do
            if systemctl is-active --quiet "$CACHE" && [[ -s /run/fgbears-control-plane/stream-state.json ]]; then
              if sudo -u fgbears python3 -c "import json,time; from datetime import datetime; p=json.load(open('/run/fgbears-control-plane/stream-state.json',encoding='utf-8')); assert p.get('schemaVersion')=='fgb-stream-state/v1'; assert datetime.fromisoformat(p['validUntil'].replace('Z','+00:00')).timestamp()>time.time(); assert p['presentation']['routing']['rumble']['rendersRealQuestion'] is True"; then
                cache_ready=yes
                break
              fi
            fi
            sleep 1
          done
          [[ "$cache_ready" == yes ]] || fail cache_never_became_ready

          sudo systemctl start "$YOUTUBE"
          youtube_ready=no
          for _ in $(seq 1 45); do
            y=$(pid "$YOUTUBE")
            if systemctl is-active --quiet "$YOUTUBE" && connected "$y" 443; then youtube_ready=yes; break; fi
            sleep 1
          done
          [[ "$youtube_ready" == yes ]] || fail youtube_did_not_reconnect

          sleep 3
          sudo "$V3DIR/verify-youtube-v3.sh"
          youtube_verified=$(pid "$YOUTUBE")
          sudo "$V3DIR/verify-youtube-v3.sh"
          test "$(pid "$YOUTUBE")" = "$youtube_verified" || fail youtube_pid_changed_during_verification
          test "$(pid "$MASTER")" = "$master_before" || fail master_pid_changed
          test "$(pid "$RUMBLE")" = "$rumble_before" || fail rumble_pid_changed
          connected "$rumble_before" 1935 || fail rumble_socket_lost

          sudo systemctl enable "$YOUTUBE" "$CACHE" >/dev/null
          sudo rm -rf "$BACKUP"
          sudo rm -f "$HEALTH_BACKUP" "$YT_UNIT_BACKUP" "$CACHE_UNIT_BACKUP" \
            /tmp/fgb-youtube-v3-control-plane.tgz /tmp/fgbears-healthcheck-control-plane
          CUTOVER=0
          trap - ERR
          echo "CONTROL_PLANE_DEPLOY=PASS master=$master_before rumble=$rumble_before youtube_before=$youtube_before youtube_after=$youtube_verified cache=$(pid "$CACHE") schema=fgb-stream-state/v1 master_restarted=no rumble_restarted=no"
          REMOTE
