name: One-shot Check FGB Audio Mastering v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-check-audio-mastering-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Download one representative source
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          scp -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST:/srv/fgbears-live/media/FGBears-Episode-03.mp4" /tmp/episode03.mp4
          ls -lh /tmp/episode03.mp4
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,width,height,r_frame_rate,pix_fmt -of json /tmp/episode03.mp4
      - name: Trace canonical mastering script
        run: |
          set -o pipefail
          echo 'Available required filters:'
          for f in highpass lowpass equalizer deesser acompressor loudnorm aresample; do
            ffmpeg -hide_banner -filters 2>/dev/null | grep -E "[[:space:]]${f}[[:space:]]" || true
          done
          bash -x services/fgbears-live/bin/normalize-library.sh /tmp/episode03.mp4 /tmp/episode03-mastered.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,bit_rate,sample_rate,channels -of json /tmp/episode03-mastered.mp4
          cat /tmp/episode03-mastered.mp4.audio-profile.json
