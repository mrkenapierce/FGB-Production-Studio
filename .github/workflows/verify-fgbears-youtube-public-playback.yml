name: Verify FGBears YouTube Public Playback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-fgbears-youtube-public-playback.yml'

permissions:
  contents: read

jobs:
  verify-public-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install playback tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --upgrade yt-dlp

      - name: Capture and analyze public YouTube audio
        run: |
          set -Eeuo pipefail
          URL='https://www.youtube.com/watch?v=QxmLpaargj0'
          yt-dlp --version
          echo '--- public stream metadata ---'
          yt-dlp --no-warnings --print 'id=%(id)s live_status=%(live_status)s title=%(title)s' "$URL"

          AUDIO_URL=$(yt-dlp --no-warnings -f 'bestaudio/best' -g "$URL" | tail -n1)
          test -n "$AUDIO_URL"

          echo '--- capture 20 seconds from viewer-side audio rendition ---'
          set +e
          timeout -s INT 30 ffmpeg -hide_banner -nostdin -loglevel warning -y \
            -t 20 -i "$AUDIO_URL" -map 0:a:0 -c copy public-audio.mka \
            >capture.out 2>capture.err
          rc=$?
          set -e
          cat capture.err
          [[ $rc -eq 0 || $rc -eq 124 || $rc -eq 130 ]]
          test -s public-audio.mka

          ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name,profile,sample_rate,channels,channel_layout,bit_rate,start_time,duration \
            -of default=nw=1 public-audio.mka
          ffprobe -v error -select_streams a:0 -show_packets \
            -show_entries packet=pts_time,dts_time,duration_time \
            -of csv=p=0 public-audio.mka >packets.csv

          ffmpeg -hide_banner -nostdin -loglevel warning -y \
            -i public-audio.mka -map 0:a:0 -ac 2 -ar 48000 -f s16le public.pcm \
            >decode.out 2>decode.err
          cat decode.err

          python3 - public.pcm packets.csv <<'PY'
          import array,csv,math,sys
          pcm,packets=sys.argv[1:]
          a=array.array('h'); a.frombytes(open(pcm,'rb').read())
          if sys.byteorder!='little': a.byteswap()
          if len(a)<48000*2*5: raise SystemExit('public audio decode shorter than five seconds')
          L=a[0::2]; R=a[1::2]; n=min(len(L),len(R)); L=L[:n]; R=R[:n]
          def metrics(ch):
              peak=max(abs(x) for x in ch)
              rms=math.sqrt(sum(float(x)*x for x in ch)/len(ch))
              return 20*math.log10(max(peak,1)/32768),20*math.log10(max(rms,1e-9)/32768),sum(abs(x)>=32760 for x in ch)/len(ch)
          lm=metrics(L); rm=metrics(R)
          pts=[]; dur=[]
          for row in csv.reader(open(packets)):
              try: pts.append(float(row[0])); dur.append(float(row[2]))
              except: pass
          regress=sum(pts[i] < pts[i-1]-0.001 for i in range(1,len(pts)))
          gaps=[]
          for i in range(1,len(pts)):
              expected=dur[i-1] if i-1 < len(dur) else .02
              delta=pts[i]-pts[i-1]
              if delta > max(.12,expected*4): gaps.append(delta)
          print(f'public_decoded_seconds={n/48000:.3f}')
          print(f'public_left_peak_dbfs={lm[0]:.2f} public_right_peak_dbfs={rm[0]:.2f}')
          print(f'public_left_rms_dbfs={lm[1]:.2f} public_right_rms_dbfs={rm[1]:.2f}')
          print(f'public_left_clip_ratio={lm[2]:.8f} public_right_clip_ratio={rm[2]:.8f}')
          print(f'public_audio_pts_regressions={regress}')
          print(f'public_audio_large_pts_gaps={len(gaps)}')
          if gaps: print(f'public_largest_pts_gap_seconds={max(gaps):.6f}')
          if regress or gaps or max(lm[2],rm[2])>.0001:
              raise SystemExit('viewer-side public audio health gate failed')
          PY

          capture_errors=$(grep -Eic 'error|invalid|corrupt|non-monoton|exhausted' capture.err || true)
          decode_errors=$(grep -Eic 'error|invalid|corrupt|non-monoton|exhausted' decode.err || true)
          echo "public_capture_error_lines=$capture_errors"
          echo "public_decode_error_lines=$decode_errors"
          [[ "$capture_errors" -eq 0 ]]
          [[ "$decode_errors" -eq 0 ]]
          echo 'public_youtube_audio_ok=yes'
