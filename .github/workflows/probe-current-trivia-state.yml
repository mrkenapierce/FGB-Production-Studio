name: Probe Current Trivia Timing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-current-trivia-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sample public trivia feeds
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 35); do
            printf '%s ' "$(date -u +%FT%T.%3NZ)"
            b="$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' -A FGB-readonly-probe "https://epiccontentcreatorgrants.org/api/public/fgbears/game-screen?t=$(date +%s%N)" || printf '{}')"
            w="$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' -A FGB-readonly-probe "https://epiccontentcreatorgrants.org/api/public/fgbears/website-game-screen?t=$(date +%s%N)" || printf '{}')"
            printf 'broadcast: active=%s round=%s idx=%s key=%s phase=%s start=%s end=%s | ' \
              "$(jq -r '.active // null' <<<"$b")" \
              "$(jq -r '.roundId // null' <<<"$b")" \
              "$(jq -r '.questionIndex // null' <<<"$b")" \
              "$(jq -r '.questionKey // null' <<<"$b")" \
              "$(jq -r '.phase // null' <<<"$b")" \
              "$(jq -r '.phaseStartsAt // null' <<<"$b")" \
              "$(jq -r '.phaseEndsAt // null' <<<"$b")"
            printf 'website: active=%s waiting=%s round=%s idx=%s key=%s phase=%s start=%s end=%s\n' \
              "$(jq -r '.active // null' <<<"$w")" \
              "$(jq -r '.waiting // null' <<<"$w")" \
              "$(jq -r '.roundId // null' <<<"$w")" \
              "$(jq -r '.questionIndex // null' <<<"$w")" \
              "$(jq -r '.questionKey // null' <<<"$w")" \
              "$(jq -r '.phase // null' <<<"$w")" \
              "$(jq -r '.phaseStartsAt // null' <<<"$w")" \
              "$(jq -r '.phaseEndsAt // null' <<<"$w")"
            sleep 1
          done
