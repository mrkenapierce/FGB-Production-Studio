name: Finalize YouTube-only FGB Architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decommission-fgb-social-source-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove all retired social source paths
        run: |
          set -Eeuo pipefail

          # Remove activation/configuration workflows, excluding this one until commit.
          while IFS= read -r workflow; do
            [[ "$workflow" == ".github/workflows/decommission-fgb-social-source-v2.yml" ]] && continue
            git rm -f "$workflow"
          done < <(grep -IlE 'X_RELAY_ENABLED|INSTAGRAM_RELAY_ENABLED|fgbears-x-relay|fgbears-instagram-relay|configure-x\.sh|configure-instagram\.sh' .github/workflows/*.yml || true)

          git rm -f \
            services/fgbears-live/bin/x-relay.sh \
            services/fgbears-live/bin/instagram-relay.sh \
            services/fgbears-live/bin/configure-x.sh \
            services/fgbears-live/bin/configure-instagram.sh || true

          git rm -f \
            services/fgbears-live/systemd/fgbears-x-relay.service \
            services/fgbears-live/systemd/fgbears-x-start.service \
            services/fgbears-live/systemd/fgbears-x-stop.service \
            services/fgbears-live/systemd/fgbears-x-start.timer \
            services/fgbears-live/systemd/fgbears-x-stop.timer \
            services/fgbears-live/systemd/fgbears-instagram-relay.service \
            services/fgbears-live/systemd/fgbears-instagram-start.service \
            services/fgbears-live/systemd/fgbears-instagram-stop.service \
            services/fgbears-live/systemd/fgbears-instagram-start.timer \
            services/fgbears-live/systemd/fgbears-instagram-stop.timer || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # start-stream.sh: strip every social setting/guard and make tee single-target.
          path = 'services/fgbears-live/bin/start-stream.sh'
          text = read(path)
          text = re.sub(r'^: "\$\{(?:X|INSTAGRAM)_[A-Z0-9_]+.*\n', '', text, flags=re.M)
          social_guard = text.find('case "${X_STREAM_ENABLED,,}" in')
          tee = text.find('TEE_TARGETS=', social_guard if social_guard >= 0 else 0)
          if social_guard >= 0 and tee >= 0:
              text = text[:social_guard] + text[tee:]
          tee = text.find('TEE_TARGETS=')
          renderer = text.find('python3 "$AD_OVERLAY_SCRIPT"', tee)
          if tee < 0 or renderer < 0:
              raise SystemExit('Could not locate primary tee block in start-stream.sh')
          text = text[:tee] + '''TEE_TARGETS="[f=mpegts:mpegts_flags=resend_headers:bsfs/v=dump_extra=freq=keyframe:onfail=ignore]${YOUTUBE_LOCAL_UDP_URL}"
printf 'FGBears Live output: YouTube local UDP mirror only.\n'

''' + text[renderer:]
          write(path, text)

          # install.sh: install/configure only the YouTube relay and core FGB services.
          path = 'services/fgbears-live/bin/install.sh'
          text = read(path)
          text = '\n'.join(
              line for line in text.splitlines()
              if not any(token in line for token in (
                  '/x-relay.sh', '/instagram-relay.sh', '/configure-x.sh', '/configure-instagram.sh'
              ))
          ) + '\n'
          platform_loop = text.find('for platform in x instagram; do')
          if platform_loop >= 0:
              after = text.find('done\n', platform_loop)
              if after < 0:
                  raise SystemExit('Malformed social systemd install loop')
              text = text[:platform_loop] + text[after + len('done\n'):]
          text = text.replace(
              '# Preserve credentials, migrate YouTube\'s internal handoff to connectionless\n# loopback MPEG-TS and keep the remaining social schedules independent of\n# the primary encoder.',
              '# Preserve credentials and keep YouTube on its isolated connectionless\n# loopback MPEG-TS handoff.',
          )
          truth = text.find('def truthy(value):')
          updates = text.find('updates = {', truth if truth >= 0 else 0)
          if truth >= 0 and updates >= 0:
              text = text[:truth] + text[updates:]
          text = re.sub(r'^\s*"(?:X|INSTAGRAM)_[A-Z0-9_]+":.*\n', '', text, flags=re.M)
          text = text.replace(
              '"PODCAST_AUDIO_FILTER": "loudnorm=I=-14:LRA=11:TP=-1.5,aresample=48000:first_pts=0",',
              '"PODCAST_AUDIO_FILTER": "volume=-2dB,aresample=48000:first_pts=0",',
          )
          social_runtime = text.find('systemctl disable fgbears-x-relay.service')
          youtube_comment = text.find('# The YouTube relay remains', social_runtime if social_runtime >= 0 else 0)
          if social_runtime >= 0 and youtube_comment >= 0:
              text = text[:social_runtime] + text[youtube_comment:]
          text = text.replace(
              'Installed FGBears Live with one primary encode, isolated YouTube UDP relay, and X/Instagram sidecars scheduled 09:00-17:00 America/Chicago.',
              'Installed FGBears Live in YouTube-only mode with one primary encode and an isolated YouTube UDP relay.',
          )
          write(path, text)

          # healthcheck.sh: eliminate social relay reconciliation entirely.
          path = 'services/fgbears-live/bin/healthcheck.sh'
          text = read(path)
          start = text.find('reconcile_social_relay() {')
          news = text.find('# News scanning is independent', start if start >= 0 else 0)
          if start >= 0 and news >= 0:
              text = text[:start] + text[news:]
          text = re.sub(r'^reconcile_social_relay .*\n', '', text, flags=re.M)
          write(path, text)

          # stream-status.sh: report only primary/YouTube/news/resource health.
          path = 'services/fgbears-live/bin/stream-status.sh'
          text = read(path)
          text = re.sub(r'^ENV_FILE=.*\n', '', text, flags=re.M)
          social = text.find('central_hm=')
          news = text.find('news_refresh_status=', social if social >= 0 else 0)
          if social >= 0 and news >= 0:
              text = text[:social] + text[news:]
          text = re.sub(r"^printf 'SOCIAL_WINDOW_ACTIVE=.*\n", '', text, flags=re.M)
          text = re.sub(r"^printf 'X_ENABLED=.*\n", '', text, flags=re.M)
          text = re.sub(r"^printf 'INSTAGRAM_ENABLED=.*\n", '', text, flags=re.M)
          write(path, text)

          # stream.env.example: YouTube credentials/config only.
          path = 'services/fgbears-live/config/stream.env.example'
          lines = [line for line in read(path).splitlines() if not line.startswith('X_') and not line.startswith('INSTAGRAM_')]
          text = '\n'.join(lines) + '\n'
          text = text.replace('Never commit an actual YouTube, X, or Instagram stream key.', 'Never commit an actual YouTube stream key.')
          write(path, text)

          # Lock transport validation to a single YouTube sink and forbid social reintroduction.
          path = 'services/fgbears-live/tests/test-multistream.sh'
          write(path, '''#!/usr/bin/env bash\nset -Eeuo pipefail\nROOT=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)\nTMP=$(mktemp -d)\ntrap 'rm -rf "$TMP"' EXIT\n\nfor script in "$ROOT/bin/start-stream.sh" "$ROOT/bin/youtube-relay.sh" "$ROOT/bin/install.sh" "$ROOT/bin/healthcheck.sh" "$ROOT/bin/stream-status.sh"; do\n  bash -n "$script"\ndone\n\nfor retired in \\\n  "$ROOT/bin/x-relay.sh" "$ROOT/bin/instagram-relay.sh" \\\n  "$ROOT/bin/configure-x.sh" "$ROOT/bin/configure-instagram.sh" \\\n  "$ROOT/systemd/fgbears-x-relay.service" "$ROOT/systemd/fgbears-x-start.timer" "$ROOT/systemd/fgbears-x-stop.timer" \\\n  "$ROOT/systemd/fgbears-instagram-relay.service" "$ROOT/systemd/fgbears-instagram-start.timer" "$ROOT/systemd/fgbears-instagram-stop.timer" \\\n  "$ROOT/bin/facebook-relay.sh" "$ROOT/bin/configure-facebook.sh"; do\n  test ! -e "$retired"\ndone\n\nif grep -R -nE 'FACEBOOK_|X_RELAY_ENABLED|X_LOCAL_UDP_URL|X_STREAM_ENABLED|INSTAGRAM_|fgbears-(x|instagram|facebook)|X local mirror|Instagram local mirror' "$ROOT/bin" "$ROOT/config" "$ROOT/systemd"; then\n  echo 'Retired social simulcast protocol remains in active FGB livestream code.' >&2\n  exit 1\nfi\n\ngrep -Fq 'TEE_TARGETS="[f=mpegts:mpegts_flags=resend_headers:bsfs/v=dump_extra=freq=keyframe:onfail=ignore]${YOUTUBE_LOCAL_UDP_URL}"' "$ROOT/bin/start-stream.sh"\ngrep -Fq 'YouTube local UDP mirror only' "$ROOT/bin/start-stream.sh"\n\nif command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then\n  ffmpeg -hide_banner -loglevel error \\\n    -f lavfi -i testsrc2=size=320x180:rate=24 \\\n    -f lavfi -i sine=frequency=440:sample_rate=48000 \\\n    -t 0.5 -map 0:v -map 1:a \\\n    -c:v libx264 -preset ultrafast -g 48 -c:a aac -b:a 128k \\\n    -f tee -use_fifo 1 -fifo_options 'attempt_recovery=1:recover_any_error=1:recovery_wait_time=1' \\\n    "[f=mpegts:mpegts_flags=resend_headers:bsfs/v=dump_extra=freq=keyframe:onfail=ignore]$TMP/youtube-local.ts"\n  test -s "$TMP/youtube-local.ts"\n  ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1 "$TMP/youtube-local.ts" | grep -q '^codec_name=aac$'\n  ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1 "$TMP/youtube-local.ts" | grep -q '^codec_name=h264$'\nfi\n\necho 'FGBears transport is locked to YouTube only.'\n''')

          # Remove stale social capability metadata from deployment status generation.
          path = '.github/workflows/fgbears-live-deploy.yml'
          if Path(path).exists():
              text = read(path).replace(',xSimulcastCapable:true,xAccountHandle:"@epic501c3"', '')
              write(path, text)

          active_paths = (
              'services/fgbears-live/bin/start-stream.sh',
              'services/fgbears-live/bin/install.sh',
              'services/fgbears-live/bin/healthcheck.sh',
              'services/fgbears-live/bin/stream-status.sh',
              'services/fgbears-live/config/stream.env.example',
          )
          forbidden = re.compile(r'FACEBOOK_|X_RELAY_ENABLED|X_LOCAL_UDP_URL|X_STREAM_ENABLED|INSTAGRAM_|fgbears-(?:x|instagram|facebook)')
          for active in active_paths:
              if forbidden.search(read(active)):
                  print(f'--- residuals in {active} ---')
                  for i, line in enumerate(read(active).splitlines(), 1):
                      if forbidden.search(line):
                          print(f'{i}: {line}')
                  raise SystemExit(f'Retired social reference remains in {active}')
          PY

          git rm -f .github/workflows/decommission-fgb-social-source-v2.yml
          bash -n services/fgbears-live/bin/start-stream.sh
          bash -n services/fgbears-live/bin/install.sh
          bash -n services/fgbears-live/bin/healthcheck.sh
          bash -n services/fgbears-live/bin/stream-status.sh
          bash services/fgbears-live/tests/test-multistream.sh
          git diff --check

      - name: Commit YouTube-only architecture
        run: |
          git config user.name 'FGB Production Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Decommission X and Instagram simulcast'
          git push origin HEAD:main
