name: Finalize YouTube-only FGB Architecture

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/decommission-fgb-social-source-v2.yml

permissions:
  contents: write

# Final source cleanup before deploying the compression-friendly EPIC crawl.
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply YouTube-only source migration
        run: python3 services/fgbears-live/bin/finalize-youtube-only.py

      - name: Validate migration
        run: |
          rm -f services/fgbears-live/bin/finalize-youtube-only.py
          bash -n services/fgbears-live/bin/start-stream.sh
          bash -n services/fgbears-live/bin/install.sh
          bash -n services/fgbears-live/bin/healthcheck.sh
          bash -n services/fgbears-live/bin/stream-status.sh
          bash services/fgbears-live/tests/test-multistream.sh
          git diff --check

      - name: Commit YouTube-only architecture
        run: |
          rm -f .github/workflows/decommission-fgb-social-source-v2.yml
          git config user.name 'FGB Production Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Decommission X and Instagram simulcast'
          git push origin HEAD:main
