name: Diagnose FGBears YouTube Relay Detail

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-youtube-relay-detail.yml'

permissions:
  contents: write

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Collect redacted relay journal
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' > /tmp/relay-detail.env <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/fgbears-live/stream.env
          journal=/tmp/fgb-relay-detail.log
          journalctl -u fgbears-youtube-relay.service --since '30 minutes ago' --no-pager > "$journal"
          python3 - "$env_file" "$journal" <<'PY'
          from pathlib import Path
          import re, sys
          env_path=Path(sys.argv[1]); log_path=Path(sys.argv[2])
          text=log_path.read_text(encoding='utf-8',errors='replace')
          for line in env_path.read_text(encoding='utf-8',errors='replace').splitlines():
              if '=' not in line or line.lstrip().startswith('#'):
                  continue
              k,v=line.split('=',1)
              if (k.endswith('STREAM_KEY') or 'TOKEN' in k or 'SECRET' in k) and v:
                  text=text.replace(v,'[REDACTED]')
          safe=[]
          for line in text.splitlines():
              low=line.lower()
              if any(w in low for w in ('error','failed','broken pipe','reset','invalidated','tls','rtmp','i/o','input/output','exited','stopped','started')):
                  line=re.sub(r'(rtmps?://[^\s/]+)(/\S*)',r'\1/[REDACTED_PATH]',line)
                  safe.append(line[:600])
          joined=' || '.join(safe[-32:]) if safe else 'No relay error lines found.'
          low=joined.lower()
          if 'connection refused' in low:
              cls='connection_refused'
          elif 'broken pipe' in low or 'connection reset' in low or 'invalidated' in low:
              cls='connection_dropped'
          elif 'tls' in low or 'ssl' in low:
              cls='tls_failure'
          elif 'input/output error' in low or 'i/o error' in low or 'error opening output' in low:
              cls='output_io_failure'
          else:
              cls='unknown'
          print('RELAY_CLASS='+cls)
          print('SAFE_DETAIL='+joined)
          PY
          rm -f "$journal"
          REMOTE
          cat /tmp/relay-detail.env
      - name: Record safe relay detail
        if: always()
        run: |
          set -Eeuo pipefail
          relay_class=unavailable
          safe_detail='Diagnostic unavailable.'
          if [[ -f /tmp/relay-detail.env ]]; then
            relay_class=$(grep '^RELAY_CLASS=' /tmp/relay-detail.env | head -1 | cut -d= -f2- || true)
            safe_detail=$(grep '^SAFE_DETAIL=' /tmp/relay-detail.env | head -1 | cut -d= -f2- || true)
          fi
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/deployment-status
          jq -n --arg relayClass "$relay_class" --arg safeDetail "$safe_detail" --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg runId "$GITHUB_RUN_ID" '{relayClass:$relayClass,safeDetail:$safeDetail,checkedAt:$checkedAt,runId:$runId}' > .github/deployment-status/fgbears-youtube-relay-detail.json
          git config user.name 'FGBears Deploy Bot'
          git config user.email 'actions@github.com'
          git add .github/deployment-status/fgbears-youtube-relay-detail.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record YouTube relay detail [skip ci]'
          git push origin main
