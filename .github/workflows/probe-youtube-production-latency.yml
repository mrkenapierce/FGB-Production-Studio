name: Probe YouTube Production Latency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-youtube-production-latency.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read production topology and active YouTube broadcast latency
        id: probe
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "ubuntu@$ORACLE_HOST" 'bash -s' <<'REMOTE' | tee /tmp/youtube-latency-probe.txt
          set -Eeuo pipefail
          echo "COPY_RELAY_ACTIVE=$(systemctl is-active fgbears-youtube-copy-relay.service 2>/dev/null || true)"
          echo "COPY_RELAY_ENABLED=$(systemctl is-enabled fgbears-youtube-copy-relay.service 2>/dev/null || true)"
          echo "V3_ACTIVE=$(systemctl is-active fgbears-youtube-v3.service 2>/dev/null || true)"
          echo "V3_ENABLED=$(systemctl is-enabled fgbears-youtube-v3.service 2>/dev/null || true)"
          echo "MASTER_ACTIVE=$(systemctl is-active fgbears-live.service 2>/dev/null || true)"

          ENV_FILE=/etc/fgbears-live/stream.env
          if sudo test -r "$ENV_FILE"; then
            service=$(sudo sed -n 's/^YOUTUBE_SERVICE=//p' "$ENV_FILE" | tail -1)
            buffer=$(sudo sed -n 's/^YOUTUBE_V3_BUFFER_SECONDS=//p' "$ENV_FILE" | tail -1)
            echo "CONFIG_YOUTUBE_SERVICE=${service:-unset}"
            echo "CONFIG_V3_BUFFER_SECONDS=${buffer:-unset}"
          else
            echo 'STREAM_ENV=UNREADABLE_EVEN_WITH_SUDO'
          fi

          # Query only non-secret YouTube broadcast metadata. OAuth values are never printed.
          if sudo grep -q '^FGB_YOUTUBE_CLIENT_ID=' "$ENV_FILE" 2>/dev/null \
             && sudo grep -q '^FGB_YOUTUBE_CLIENT_SECRET=' "$ENV_FILE" 2>/dev/null \
             && sudo grep -q '^FGB_YOUTUBE_REFRESH_TOKEN=' "$ENV_FILE" 2>/dev/null; then
            echo 'ORACLE_YOUTUBE_OAUTH=AVAILABLE'
            sudo bash -c '
              set -Eeuo pipefail
              set -a
              source /etc/fgbears-live/stream.env
              set +a
              token_json=$(curl -fsS -X POST https://oauth2.googleapis.com/token \
                --data-urlencode "client_id=$FGB_YOUTUBE_CLIENT_ID" \
                --data-urlencode "client_secret=$FGB_YOUTUBE_CLIENT_SECRET" \
                --data-urlencode "refresh_token=$FGB_YOUTUBE_REFRESH_TOKEN" \
                --data-urlencode grant_type=refresh_token)
              access_token=$(jq -r ".access_token // empty" <<<"$token_json")
              test -n "$access_token"
              payload=$(curl -fsS -G https://www.googleapis.com/youtube/v3/liveBroadcasts \
                -H "Authorization: Bearer $access_token" \
                --data-urlencode "part=id,status,contentDetails" \
                --data-urlencode "broadcastStatus=active" \
                --data-urlencode "mine=true" \
                --data-urlencode "maxResults=10")
              count=$(jq ".items | length" <<<"$payload")
              echo "ACTIVE_BROADCAST_COUNT=$count"
              jq -r ".items[] | \"ACTIVE_BROADCAST_ID=\" + .id, \"LATENCY_PREFERENCE=\" + (.contentDetails.latencyPreference // \"unset\"), \"ENABLE_LOW_LATENCY=\" + ((.contentDetails.enableLowLatency // false)|tostring), \"MONITOR_DELAY_MS=\" + ((.contentDetails.monitorStream.broadcastStreamDelayMs // 0)|tostring), \"LIFECYCLE_STATUS=\" + (.status.lifeCycleStatus // \"unknown\")" <<<"$payload"
            '
          else
            echo 'ORACLE_YOUTUBE_OAUTH=UNAVAILABLE'
          fi
          REMOTE

      - name: Persist sanitized probe result
        run: |
          set -Eeuo pipefail
          mkdir -p .github/deployment-status
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          values = {}
          for raw in Path('/tmp/youtube-latency-probe.txt').read_text(encoding='utf-8').splitlines():
              if '=' not in raw:
                  continue
              k, v = raw.split('=', 1)
              if k in {
                  'COPY_RELAY_ACTIVE','COPY_RELAY_ENABLED','V3_ACTIVE','V3_ENABLED','MASTER_ACTIVE',
                  'CONFIG_YOUTUBE_SERVICE','CONFIG_V3_BUFFER_SECONDS','ORACLE_YOUTUBE_OAUTH',
                  'ACTIVE_BROADCAST_COUNT','ACTIVE_BROADCAST_ID','LATENCY_PREFERENCE',
                  'ENABLE_LOW_LATENCY','MONITOR_DELAY_MS','LIFECYCLE_STATUS'
              }:
                  values[k] = v
          body = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'targetLatencyPreference': 'ultraLow',
              'production': values,
          }
          Path('.github/deployment-status/youtube-production-latency.json').write_text(
              json.dumps(body, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/youtube-production-latency.json
          if git diff --cached --quiet; then
            echo 'No probe-result change to commit.'
          else
            git commit -m 'Record YouTube production latency probe'
            git push
          fi
