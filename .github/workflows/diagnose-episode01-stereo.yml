name: Diagnose Episode 01 Stereo Integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-episode01-stereo.yml'
      - 'services/fgbears-live/tools/diagnose-episode01-stereo.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Measure retained source channel integrity
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/mrkenapierce/FGB-Production-Studio/main/services/fgbears-live/tools/diagnose-episode01-stereo.py > /tmp/diagnose-episode01-stereo.py
          scp -i ~/.ssh/oracle_key /tmp/diagnose-episode01-stereo.py "$ORACLE_USER@$ORACLE_HOST:/tmp/diagnose-episode01-stereo.py"
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'python3 /tmp/diagnose-episode01-stereo.py; rc=$?; rm -f /tmp/diagnose-episode01-stereo.py; exit $rc'
