name: FGBears YouTube Viewer Audio Guard

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-youtube-public-audio-guard.yml'

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-viewer-audio-guard
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu
  FGB_YOUTUBE_URL: https://www.youtube.com/watch?v=QxmLpaargj0

jobs:
  viewer-audio-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install viewer-side probe tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --upgrade yt-dlp

      - id: probe
        name: Require two failed viewer-side probes before recovery
        run: |
          set -Eeuo pipefail

          probe_public_audio() {
            local prefix=$1 audio_url rc capture_errors decode_errors
            rm -f "${prefix}.mka" "${prefix}.pcm" "${prefix}-packets.csv" "${prefix}-capture.err" "${prefix}-decode.err"

            audio_url=$(yt-dlp --no-warnings -f 'bestaudio/best' -g "$FGB_YOUTUBE_URL" | tail -n1) || return 1
            test -n "$audio_url" || return 1

            set +e
            timeout -s INT 24 ffmpeg -hide_banner -nostdin -loglevel warning -y \
              -t 12 -i "$audio_url" -map 0:a:0 -c copy "${prefix}.mka" \
              >"${prefix}-capture.out" 2>"${prefix}-capture.err"
            rc=$?
            set -e
            [[ $rc -eq 0 || $rc -eq 124 || $rc -eq 130 ]] || return 1
            test -s "${prefix}.mka" || return 1

            ffprobe -v error -select_streams a:0 -show_packets \
              -show_entries packet=pts_time,duration_time \
              -of csv=p=0 "${prefix}.mka" >"${prefix}-packets.csv" || return 1
            ffmpeg -hide_banner -nostdin -loglevel warning -y \
              -i "${prefix}.mka" -map 0:a:0 -ac 2 -ar 48000 -f s16le "${prefix}.pcm" \
              >"${prefix}-decode.out" 2>"${prefix}-decode.err" || return 1

            python3 - "${prefix}.pcm" "${prefix}-packets.csv" <<'PY'
          import array,csv,math,sys
          pcm,packets=sys.argv[1:]
          a=array.array('h'); a.frombytes(open(pcm,'rb').read())
          if sys.byteorder!='little': a.byteswap()
          if len(a)<48000*2*5: raise SystemExit('viewer audio decode shorter than five seconds')
          L=a[0::2]; R=a[1::2]; n=min(len(L),len(R)); L=L[:n]; R=R[:n]
          def metrics(ch):
              peak=max(abs(x) for x in ch)
              rms=math.sqrt(sum(float(x)*x for x in ch)/len(ch))
              clip=sum(abs(x)>=32760 for x in ch)/len(ch)
              return 20*math.log10(max(peak,1)/32768),20*math.log10(max(rms,1e-9)/32768),clip
          lm=metrics(L); rm=metrics(R)
          pts=[]; dur=[]
          for row in csv.reader(open(packets)):
              try:
                  pts.append(float(row[0])); dur.append(float(row[1]))
              except Exception:
                  pass
          regress=sum(pts[i] < pts[i-1]-0.001 for i in range(1,len(pts)))
          gaps=[]
          for i in range(1,len(pts)):
              expected=dur[i-1] if i-1 < len(dur) else .02
              delta=pts[i]-pts[i-1]
              if delta > max(.12, expected*4): gaps.append(delta)
          print(f'viewer_decoded_seconds={n/48000:.3f}')
          print(f'viewer_left_peak_dbfs={lm[0]:.2f} viewer_right_peak_dbfs={rm[0]:.2f}')
          print(f'viewer_left_rms_dbfs={lm[1]:.2f} viewer_right_rms_dbfs={rm[1]:.2f}')
          print(f'viewer_left_clip_ratio={lm[2]:.8f} viewer_right_clip_ratio={rm[2]:.8f}')
          print(f'viewer_audio_pts_regressions={regress}')
          print(f'viewer_audio_large_pts_gaps={len(gaps)}')
          if gaps: print(f'viewer_largest_pts_gap_seconds={max(gaps):.6f}')
          if regress or gaps or max(lm[2],rm[2])>.0001:
              raise SystemExit('viewer-side audio health gate failed')
          PY

            capture_errors=$(grep -Eic 'error|invalid|corrupt|non-monoton|exhausted|timestamp' "${prefix}-capture.err" || true)
            decode_errors=$(grep -Eic 'error|invalid|corrupt|non-monoton|exhausted|timestamp' "${prefix}-decode.err" || true)
            echo "${prefix}_capture_error_lines=$capture_errors"
            echo "${prefix}_decode_error_lines=$decode_errors"
            [[ "$capture_errors" -eq 0 && "$decode_errors" -eq 0 ]]
          }

          echo '--- viewer-side YouTube audio probe 1 ---'
          if probe_public_audio probe1; then
            echo 'needs_repair=no' >> "$GITHUB_OUTPUT"
            echo 'viewer_audio_status=healthy_first_probe'
            exit 0
          fi

          echo 'First probe failed; requiring a second independent failure before recovery.'
          sleep 20
          echo '--- viewer-side YouTube audio probe 2 ---'
          if probe_public_audio probe2; then
            echo 'needs_repair=no' >> "$GITHUB_OUTPUT"
            echo 'viewer_audio_status=healthy_second_probe'
            exit 0
          fi

          echo 'needs_repair=yes' >> "$GITHUB_OUTPUT"
          echo 'viewer_audio_status=two_consecutive_failures'

      - name: Configure Oracle SSH for isolated recovery
        if: steps.probe.outputs.needs_repair == 'yes'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Recover YouTube relay only
        if: steps.probe.outputs.needs_repair == 'yes'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER_PID=$(systemctl show -p MainPID --value fgbears-live.service)
          RUMBLE_PID=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          [[ "$MASTER_PID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUMBLE_PID" =~ ^[1-9][0-9]*$ ]]

          sudo systemctl reset-failed fgbears-youtube-relay.service || true
          sudo systemctl restart fgbears-youtube-relay.service
          for _ in {1..40}; do
            if systemctl is-active --quiet fgbears-youtube-relay.service; then
              YT_PID=$(systemctl show -p MainPID --value fgbears-youtube-relay.service)
              if [[ "$YT_PID" =~ ^[1-9][0-9]*$ ]]; then
                ARGS=$(tr '\0' ' ' < "/proc/$YT_PID/cmdline")
                if [[ "$ARGS" == *"ffmpeg"* && "$ARGS" == *" -c copy "* && "$ARGS" != *"youtube-stream-router"* && "$ARGS" != *"gst-launch"* ]]; then
                  if sudo ss -ntpH state established | grep -F "pid=$YT_PID" | grep -Eq ':[4]43([[:space:]]|$)'; then
                    break
                  fi
                fi
              fi
            fi
            sleep 0.5
          done

          [[ "$(systemctl show -p MainPID --value fgbears-live.service)" == "$MASTER_PID" ]]
          [[ "$(systemctl show -p MainPID --value fgbears-rumble-relay.service)" == "$RUMBLE_PID" ]]
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-rumble-relay.service
          systemctl is-active --quiet fgbears-youtube-relay.service
          echo 'viewer_guard_youtube_only_recovery=yes'
          REMOTE

      - name: Verify viewer audio after recovery
        if: steps.probe.outputs.needs_repair == 'yes'
        run: |
          set -Eeuo pipefail
          sleep 25
          AUDIO_URL=$(yt-dlp --no-warnings -f 'bestaudio/best' -g "$FGB_YOUTUBE_URL" | tail -n1)
          test -n "$AUDIO_URL"
          set +e
          timeout -s INT 24 ffmpeg -hide_banner -nostdin -loglevel warning -y \
            -t 12 -i "$AUDIO_URL" -map 0:a:0 -c copy repaired.mka \
            >repaired-capture.out 2>repaired-capture.err
          rc=$?
          set -e
          [[ $rc -eq 0 || $rc -eq 124 || $rc -eq 130 ]]
          test -s repaired.mka
          ffmpeg -hide_banner -nostdin -loglevel warning -y \
            -i repaired.mka -map 0:a:0 -ac 2 -ar 48000 -f null - \
            >repaired-decode.out 2>repaired-decode.err
          capture_errors=$(grep -Eic 'error|invalid|corrupt|non-monoton|exhausted|timestamp' repaired-capture.err || true)
          decode_errors=$(grep -Eic 'error|invalid|corrupt|non-monoton|exhausted|timestamp' repaired-decode.err || true)
          cat repaired-capture.err
          cat repaired-decode.err
          echo "post_repair_capture_error_lines=$capture_errors"
          echo "post_repair_decode_error_lines=$decode_errors"
          [[ "$capture_errors" -eq 0 && "$decode_errors" -eq 0 ]]
          echo 'viewer_audio_recovery_verified=yes'
