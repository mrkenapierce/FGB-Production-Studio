name: Apply Transparent FGBears Live Audio Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-live-transparent-audio-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove destructive live audio processing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path

          start = Path('services/fgbears-live/bin/start-stream.sh')
          text = start.read_text()
          old = ': "${PODCAST_AUDIO_FILTER:=highpass=f=70:poles=2,acompressor=threshold=0.125:ratio=3:attack=20:release=220:makeup=1.2:knee=3,loudnorm=I=-16:TP=-1.5:LRA=9,aresample=48000:async=1:first_pts=0}"'
          new = ': "${PODCAST_AUDIO_FILTER:=aresample=48000:first_pts=0}"'
          if old not in text and new not in text:
              raise SystemExit('Unexpected PODCAST_AUDIO_FILTER definition')
          text = text.replace(old, new)
          text = text.replace(': "${AD_OVERLAY_FPS:=25}"', ': "${AD_OVERLAY_FPS:=15}"')
          start.write_text(text)

          norm = Path('services/fgbears-live/bin/normalize-library.sh')
          text = norm.read_text()
          text = text.replace("-af 'aresample=async=1:first_pts=0'", "-af 'aresample=48000:first_pts=0'")
          norm.write_text(text)

          env = Path('services/fgbears-live/config/stream.env.example')
          text = env.read_text().replace('AD_OVERLAY_FPS=25', 'AD_OVERLAY_FPS=15')
          if 'PODCAST_AUDIO_FILTER=' not in text:
              text = text.replace('DRAWTEXT_RELOAD_FRAMES=30\n', 'DRAWTEXT_RELOAD_FRAMES=30\nPODCAST_AUDIO_FILTER=aresample=48000:first_pts=0\n')
          else:
              lines=[]
              for line in text.splitlines():
                  if line.startswith('PODCAST_AUDIO_FILTER='):
                      line='PODCAST_AUDIO_FILTER=aresample=48000:first_pts=0'
                  lines.append(line)
              text='\n'.join(lines)+'\n'
          env.write_text(text)

          tests = Path('services/fgbears-live/tests/test-scripts.sh')
          text = tests.read_text()
          old_block = """grep -Fq 'loudnorm=I=-16:TP=-1.5:LRA=9' \"$ROOT/bin/start-stream.sh\"\nif grep -Eq 'afftdn=|deesser=|equalizer=' \"$ROOT/bin/start-stream.sh\"; then\n  echo 'The production live chain must not destructively reprocess mastered podcast audio.' >&2\n  exit 1\nfi\ngrep -Fq 'acompressor=threshold=0.125:ratio=3' \"$ROOT/bin/start-stream.sh\"\n"""
          new_block = """grep -Fq 'PODCAST_AUDIO_FILTER:=aresample=48000:first_pts=0' \"$ROOT/bin/start-stream.sh\"\nif grep -Eq 'PODCAST_AUDIO_FILTER:=.*(highpass=|acompressor=|loudnorm=|afftdn=|deesser=|equalizer=|async=1)' \"$ROOT/bin/start-stream.sh\"; then\n  echo 'The production live chain must preserve mastered episode audio without destructive DSP or async time-stretching.' >&2\n  exit 1\nfi\n"""
          if old_block not in text and new_block not in text:
              raise SystemExit('Unexpected audio test block')
          text = text.replace(old_block, new_block)
          tests.write_text(text)
          PY
          bash services/fgbears-live/tests/test-scripts.sh
      - name: Commit permanent audio repair
        run: |
          git config user.name 'FGBears Repair Bot'
          git config user.email 'actions@github.com'
          git add services/fgbears-live/bin/start-stream.sh services/fgbears-live/bin/normalize-library.sh services/fgbears-live/config/stream.env.example services/fgbears-live/tests/test-scripts.sh
          if git diff --cached --quiet; then
            echo 'Audio repair already present.'
            exit 0
          fi
          git commit -m 'Preserve mastered audio in FGB livestream'
          git push origin HEAD:main
