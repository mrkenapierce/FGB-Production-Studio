name: Probe OCI Instance Principal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-oci-instance-principal.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Probe OCI metadata and read-only instance-principal access
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== OCI METADATA ==='
          META=$(curl -fsS --max-time 5 -H 'Authorization: Bearer Oracle' http://169.254.169.254/opc/v2/instance/ 2>/dev/null || true)
          if [[ -n "$META" ]]; then
            python3 - <<'PY' "$META"
import json,sys
x=json.loads(sys.argv[1]); print(json.dumps({k:x.get(k) for k in ['id','displayName','compartmentId','region','availabilityDomain','shape','shapeConfig']},indent=2))
PY
          else
            echo METADATA_UNAVAILABLE
          fi
          echo '=== OCI CLI ==='
          if command -v oci >/dev/null; then
            oci --version || true
            echo '=== INSTANCE PRINCIPAL READ TEST ==='
            oci iam region list --auth instance_principal --output json 2>&1 | head -80 || true
          else
            echo OCI_CLI_NOT_INSTALLED
          fi
          echo '=== CURRENT SERVICES ==='
          for svc in fgbears-live.service fgbears-youtube-relay.service fgbears-rumble-relay.service; do
            echo "$svc $(systemctl is-active "$svc" 2>/dev/null || true) pid=$(systemctl show -p MainPID --value "$svc" 2>/dev/null || true)"
          done
          REMOTE
