name: Check OVH Archive Health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-ovh-archive.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure read-only production access
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null

      - name: Enforce live, capture, publishing, and browser-source health
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=8 -i ~/.ssh/ovh_key ubuntu@40.160.144.185 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/fgb-transport

          live=$(sudo docker compose --env-file .env exec -T youtube sh -lc 'cat /tmp/fgb-transport.state 2>/dev/null || echo missing')
          restarts=$(sudo docker compose --env-file .env exec -T youtube sh -lc 'cat /tmp/fgb-restarts 2>/dev/null || echo 999')
          archive_uploader=stopped
          if test -n "$(sudo docker compose --env-file .env ps --status running -q archive_uploader)"; then archive_uploader=running; fi
          archive_capture=inactive
          chunk=$(find /srv/fgb-archive/hourly -maxdepth 1 -type f -name 'live-*.ts' -size +1M -print -quit 2>/dev/null || true)
          if test -n "$chunk"; then archive_capture=active; fi
          free=$(df -BG --output=avail /srv/fgb-archive | tail -1 | tr -dc '0-9')
          archive_auth=not_ready
          if sudo docker compose --env-file .env exec -T archive_uploader python3 ./archive-uploader.py --check-auth >/tmp/archive-auth-check.txt 2>/dev/null; then
            grep -q 'ARCHIVE_OAUTH_READY=true' /tmp/archive-auth-check.txt && archive_auth=ready || true
          fi
          rm -f /tmp/archive-auth-check.txt

          tabs=$(sudo docker compose --env-file .env exec -T youtube curl -fsS --max-time 5 http://127.0.0.1:9222/json 2>/dev/null || echo '[]')
          chrome_title=$(printf '%s' "$tabs" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d[0].get("title","") if d else "").replace("\n"," ")[:200])' 2>/dev/null || true)
          chrome_url=$(printf '%s' "$tabs" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d[0].get("url","") if d else "")[:300])' 2>/dev/null || true)

          origin_url='https://epiccontentcreatorgrants.org/fgb-broadcast?target=youtube'
          origin_code=$(curl -sS -L --max-time 20 -D /tmp/fgb-origin.headers -o /tmp/fgb-origin.body -w '%{http_code}' "$origin_url" || true)
          cf_error=$(awk 'BEGIN{IGNORECASE=1} /^cf-error-type:/ {gsub("\r",""); print $2}' /tmp/fgb-origin.headers | tail -1)
          body_marker=$(grep -Eio 'Error 1102|Worker exceeded resource limits|1102' /tmp/fgb-origin.body | head -1 || true)
          body_bytes=$(wc -c </tmp/fgb-origin.body 2>/dev/null || echo 0)
          rm -f /tmp/fgb-origin.headers /tmp/fgb-origin.body

          cat >/tmp/fgb-live-diagnostic.txt <<EOF
          LIVE_STATE=$live
          LIVE_RESTARTS=$restarts
          ARCHIVE_CAPTURE=$archive_capture
          ARCHIVE_UPLOADER=$archive_uploader
          ARCHIVE_AUTH=$archive_auth
          ARCHIVE_FREE_GB=$free
          CHROMIUM_TITLE=$chrome_title
          CHROMIUM_URL=$chrome_url
          ORIGIN_HTTP=$origin_code
          CF_ERROR_TYPE=${cf_error:-none}
          ORIGIN_BODY_MARKER=${body_marker:-none}
          ORIGIN_BODY_BYTES=$body_bytes
          EOF

          cat /tmp/fgb-live-diagnostic.txt
          # Persist the diagnostic first, even if archive OAuth is not ready.
          # Distinguish transport health from archive publication readiness.
          echo ARCHIVE_HEALTH_SNAPSHOT_COMPLETE=true
          REMOTE
          scp -q -i ~/.ssh/ovh_key ubuntu@40.160.144.185:/tmp/fgb-live-diagnostic.txt /tmp/fgb-live-diagnostic.txt
          cat /tmp/fgb-live-diagnostic.txt
          python3 - <<'PY'
          from pathlib import Path
          d=dict(x.split('=',1) for x in Path('/tmp/fgb-live-diagnostic.txt').read_text().splitlines() if '=' in x)
          print('FGBCAPTURE=',d.get('LIVE_STATE'),'ARCHIVE_UPLOADER=',d.get('ARCHIVE_UPLOADER'),'ARCHIVE_AUTH=',d.get('ARCHIVE_AUTH'),'FREE_GB=',d.get('ARCHIVE_FREE_GB'))
          if d.get('LIVE_STATE') != 'live': raise SystemExit('FGB transport is not live')
          if d.get('ARCHIVE_UPLOADER') != 'running': raise SystemExit('FGB archive uploader not running')
          if d.get('ARCHIVE_CAPTURE') != 'active': raise SystemExit('FGB archive capture not active')
          if d.get('ARCHIVE_AUTH') != 'ready': raise SystemExit('FGB archive OAuth unavailable; publishing may be blocked')
          if float(d.get('ARCHIVE_FREE_GB') or '0') < 8: raise SystemExit('FGB archive disk is under the 8GB guardrail')
          PY

      - name: Persist sanitized diagnostic
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          allowed = {
              'LIVE_STATE','LIVE_RESTARTS','ARCHIVE_CAPTURE','ARCHIVE_UPLOADER','ARCHIVE_AUTH',
              'ARCHIVE_FREE_GB','CHROMIUM_TITLE','CHROMIUM_URL','ORIGIN_HTTP','CF_ERROR_TYPE',
              'ORIGIN_BODY_MARKER','ORIGIN_BODY_BYTES'
          }
          values = {}
          path = Path('/tmp/fgb-live-diagnostic.txt')
          if path.exists():
              for raw in path.read_text(encoding='utf-8', errors='replace').splitlines():
                  if '=' not in raw:
                      continue
                  key, value = raw.split('=', 1)
                  if key in allowed:
                      values[key] = value
          out = {'checkedAt': datetime.now(timezone.utc).isoformat(), 'diagnostic': values}
          target = Path('.github/deployment-status/fgb-live-diagnostic.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/fgb-live-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record FGB live diagnostic'
            git push
          fi
