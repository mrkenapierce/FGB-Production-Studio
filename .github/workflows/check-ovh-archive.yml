name: Check OVH Archive Health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-ovh-archive.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure read-only production access
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null

      - name: Enforce live, capture, publishing, and browser-source health
        run: |
          set -o pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=8 -i ~/.ssh/ovh_key ubuntu@40.160.144.185 'bash -s' <<'REMOTE' | tee /tmp/fgb-live-diagnostic.txt
          set -euo pipefail
          cd /opt/fgb-transport

          live=$(sudo docker compose --env-file .env exec -T youtube sh -lc 'cat /tmp/fgb-transport.state 2>/dev/null || echo missing')
          restarts=$(sudo docker compose --env-file .env exec -T youtube sh -lc 'cat /tmp/fgb-restarts 2>/dev/null || echo 999')
          archive_uploader=stopped
          test -n "$(sudo docker compose --env-file .env ps --status running -q archive_uploader)" && archive_uploader=running
          archive_capture=inactive
          chunk=$(find /srv/fgb-archive/hourly -maxdepth 1 -type f -name 'live-*.ts' -size +1M -print -quit 2>/dev/null || true)
          test -n "$chunk" && archive_capture=active
          free=$(df -BG --output=avail /srv/fgb-archive | tail -1 | tr -dc '0-9')
          archive_auth=not_ready
          if sudo docker compose --env-file .env exec -T archive_uploader python3 ./archive-token-wrapper.py --check-auth >/tmp/archive-auth-check.txt 2>/dev/null; then
            grep -q 'ARCHIVE_OAUTH_READY=true' /tmp/archive-auth-check.txt && archive_auth=ready || true
          fi
          rm -f /tmp/archive-auth-check.txt

          tabs=$(sudo docker compose --env-file .env exec -T youtube curl -fsS --max-time 5 http://127.0.0.1:9222/json 2>/dev/null || echo '[]')
          chrome_title=$(printf '%s' "$tabs" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d[0].get("title","") if d else "").replace("\n"," ")[:200])' 2>/dev/null || true)
          chrome_url=$(printf '%s' "$tabs" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d[0].get("url","") if d else "")[:300])' 2>/dev/null || true)

          origin_url='https://epiccontentcreatorgrants.org/fgb-broadcast?target=youtube'
          origin_code=$(curl -sS -L --max-time 20 -D /tmp/fgb-origin.headers -o /tmp/fgb-origin.body -w '%{http_code}' "$origin_url" || true)
          cf_error=$(awk 'BEGIN{IGNORECASE=1} /^cf-error-type:/ {gsub("\r",""); print $2}' /tmp/fgb-origin.headers | tail -1)
          body_marker=$(grep -Eio 'Error 1102|Worker exceeded resource limits|1102' /tmp/fgb-origin.body | head -1 || true)
          body_bytes=$(wc -c </tmp/fgb-origin.body 2>/dev/null || echo 0)
          rm -f /tmp/fgb-origin.headers /tmp/fgb-origin.body

          printf 'LIVE_STATE=%s\nLIVE_RESTARTS=%s\nARCHIVE_CAPTURE=%s\nARCHIVE_UPLOADER=%s\nARCHIVE_AUTH=%s\nARCHIVE_FREE_GB=%s\nCHROMIUM_TITLE=%s\nCHROMIUM_URL=%s\nORIGIN_HTTP=%s\nCF_ERROR_TYPE=%s\nORIGIN_BODY_MARKER=%s\nORIGIN_BODY_BYTES=%s\n' \
            "$live" "$restarts" "$archive_capture" "$archive_uploader" "$archive_auth" "$free" "$chrome_title" "$chrome_url" "$origin_code" "${cf_error:-none}" "${body_marker:-none}" "$body_bytes"

          test "$live" = live
          test "$restarts" -le 1
          test "$archive_uploader" = running
          test "$archive_capture" = active
          test "$archive_auth" = ready
          test "$free" -ge 8
          REMOTE

      - name: Persist sanitized diagnostic
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          allowed = {
              'LIVE_STATE','LIVE_RESTARTS','ARCHIVE_CAPTURE','ARCHIVE_UPLOADER','ARCHIVE_AUTH',
              'ARCHIVE_FREE_GB','CHROMIUM_TITLE','CHROMIUM_URL','ORIGIN_HTTP','CF_ERROR_TYPE',
              'ORIGIN_BODY_MARKER','ORIGIN_BODY_BYTES'
          }
          values = {}
          path = Path('/tmp/fgb-live-diagnostic.txt')
          if path.exists():
              for raw in path.read_text(encoding='utf-8', errors='replace').splitlines():
                  if '=' not in raw:
                      continue
                  key, value = raw.split('=', 1)
                  if key in allowed:
                      values[key] = value
          out = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'diagnostic': values,
          }
          target = Path('.github/deployment-status/fgb-live-diagnostic.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/fgb-live-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record FGB live diagnostic'
            git push
          fi
