name: Audit FGB YouTube Live Latency Configuration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-fgb-youtube-latency.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read active FGB broadcasts through existing OAuth (no modifications)
        env:
          YT_CLIENT_ID: ${{ secrets.FGB_YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.FGB_YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.FGB_YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone
          report={'checkedAt':datetime.now(timezone.utc).isoformat(),'readOnly':True,'targetChannelId':'UC3qyMq_KCg7aF08x7LZyVtg','activeBroadcasts':[]}
          vals=[os.getenv('YT_CLIENT_ID'),os.getenv('YT_CLIENT_SECRET'),os.getenv('YT_REFRESH_TOKEN')]
          try:
              if not all(vals):
                  report['status']='OAUTH_CREDENTIALS_UNAVAILABLE'
              else:
                  data=urllib.parse.urlencode(dict(client_id=vals[0],client_secret=vals[1],refresh_token=vals[2],grant_type='refresh_token')).encode()
                  with urllib.request.urlopen(urllib.request.Request('https://oauth2.googleapis.com/token',data=data,method='POST'),timeout=20) as resp: token=json.load(resp)['access_token']
                  url='https://www.googleapis.com/youtube/v3/liveBroadcasts?'+urllib.parse.urlencode(dict(part='id,status,contentDetails,snippet',broadcastStatus='active',mine='true',maxResults=20))
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
                  with urllib.request.urlopen(req,timeout=20) as resp: payload=json.load(resp)
                  items=payload.get('items',[])
                  for item in items:
                      snippet=item.get('snippet') or {}
                      # Strictly keep results for the expected FGB channel, never read/update another channel as FGB.
                      if snippet.get('channelId') != report['targetChannelId']: continue
                      c=item.get('contentDetails') or {}
                      report['activeBroadcasts'].append(dict(videoId=item.get('id'),latencyPreference=c.get('latencyPreference'),enableLowLatency=c.get('enableLowLatency'),monitorDelayMs=(c.get('monitorStream') or {}).get('broadcastStreamDelayMs'),lifeCycleStatus=(item.get('status') or {}).get('lifeCycleStatus')))
                  report['status']='SUCCESS' if report['activeBroadcasts'] else 'NO_ACTIVE_FGB_BROADCAST_FOUND'
          except Exception as exc:
              report['status']='API_READ_FAILED'
              report['errorType']=type(exc).__name__
          Path('.github/deployment-status/fgb-youtube-latency-audit.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Persist sanitized diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployment-status/fgb-youtube-latency-audit.json
          git commit -m 'Record live FGB YouTube latency setting' || exit 0
          git pull --rebase
          git push
