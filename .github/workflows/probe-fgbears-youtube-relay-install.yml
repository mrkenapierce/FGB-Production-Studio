name: Probe FGBears YouTube Relay Install

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-fgbears-youtube-relay-install.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Inspect relay executable and GStreamer selector properties
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== relay executable ==='
          ls -l /usr/local/bin/fgbears-youtube-relay /opt/fgbears-live/bin/youtube-relay.sh
          readlink -f /usr/local/bin/fgbears-youtube-relay || true
          sha256sum /usr/local/bin/fgbears-youtube-relay /opt/fgbears-live/bin/youtube-relay.sh
          echo '=== selector properties ==='
          gst-inspect-1.0 input-selector | sed -n '/Element Properties:/,/Pad Templates:/p' | head -120
          echo '=== flvmux properties ==='
          gst-inspect-1.0 flvmux | grep -E 'enforce-increasing|skip-backwards|streamable' -A2 -B1 || true
          echo '=== rtmpsink properties ==='
          gst-inspect-1.0 rtmpsink | grep -E 'location|sync|async' -A2 -B1 | head -80 || true
          echo '=== services ==='
          systemctl is-active fgbears-live.service
          systemctl is-active fgbears-youtube-relay.service
          systemctl is-active fgbears-rumble-relay.service
          REMOTE
