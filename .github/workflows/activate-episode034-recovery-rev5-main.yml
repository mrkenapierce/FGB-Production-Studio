name: Deploy Episode 034 via Isolated Safe Audio v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-episode034-recovery-rev5-main.yml'
      - 'scripts/deploy-safe-audio-v4-rev11.sh'
      - 'services/fgbears-live/bin/lovable-audio-pipeline-v4.py'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Validate isolated v4 sources
        run: |
          set -Eeuo pipefail
          bash -n scripts/deploy-safe-audio-v4-rev11.sh
          bash -n services/fgbears-live/bin/start-stream.sh
          python3 -m py_compile services/fgbears-live/bin/lovable-audio-pipeline-v4.py
          python3 -m py_compile services/fgbears-live/bin/lovable-audio-pipeline-v4-runner.py
          python3 -m py_compile services/fgbears-live/bin/audio-health-standard-v4.py
          grep -Fq 'aresample=44100:async=1:first_pts=0,asetpts=N/SR/TB' services/fgbears-live/bin/start-stream.sh
          grep -Fq -- '-c:a aac -b:a 128k -ar 44100 -ac 2' services/fgbears-live/bin/start-stream.sh
          grep -Fq 'ExecStart=/usr/local/bin/fgbears-lovable-audio-v4-sync' services/fgbears-live/systemd/fgbears-lovable-audio-v4-sync.service
          grep -Fq 'Unit=fgbears-lovable-audio-v4-sync.service' services/fgbears-live/systemd/fgbears-lovable-audio-v4-sync.timer
          grep -Fq 'UNQUARANTINE_LEGACY_AUDIO_PREPARATION' services/fgbears-live/systemd/fgbears-lovable-audio-sync.service
          ! grep -Eq 'loudnorm|acompressor|alimiter|afftdn|equalizer=' services/fgbears-live/bin/lovable-audio-pipeline-v4.py services/fgbears-live/bin/start-stream.sh
          echo SAFE_AUDIO_V4_SOURCE_VALIDATION=PASS

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Stage safe v4 runtime and deployment script
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/oracle_key \
            scripts/deploy-safe-audio-v4-rev11.sh \
            services/fgbears-live/bin/start-stream.sh \
            services/fgbears-live/bin/lovable-audio-pipeline-v4.py \
            services/fgbears-live/bin/lovable-audio-pipeline-v4-runner.py \
            services/fgbears-live/bin/audio-health-standard-v4.py \
            services/fgbears-live/systemd/fgbears-lovable-audio-v4-sync.service \
            services/fgbears-live/systemd/fgbears-lovable-audio-v4-sync.timer \
            "$ORACLE_USER@$ORACLE_HOST:/tmp/"

      - name: Execute guarded revision 11 cutover on Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash /tmp/deploy-safe-audio-v4-rev11.sh'
