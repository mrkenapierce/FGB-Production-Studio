name: Probe Known-Good FGB Audio Pacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-episode034-recovery-rev5-main.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Measure current known-good live pacing read-only
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          AUDIO=/srv/fgbears-live/audio/fgb-music-loop.m4a
          GOOD=c8391464ae77eec19b85270d67522300202fe5494232581c55433f934b172a12
          PROGRESS=/srv/fgbears-live/logs/ffmpeg-progress.log
          test "$(sha256sum "$AUDIO" | awk '{print $1}')" = "$GOOD"
          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-copy-relay.service
          echo LIVE_SHA=$(sha256sum "$AUDIO" | awk '{print $1}')
          echo TIMER_ACTIVE=$(systemctl is-active fgbears-lovable-audio-sync.timer 2>/dev/null || true)
          echo TIMER_ENABLED=$(systemctl is-enabled fgbears-lovable-audio-sync.timer 2>/dev/null || true)

          progress_us() {
            sed -n -e 's/^out_time_us=\([0-9]*\)$/\1/p' -e 's/^out_time_ms=\([0-9]*\)$/\1/p' "$PROGRESS" | tail -n1
          }
          m0=$(progress_us); t0=$(date +%s%N)
          sleep 15
          m1=$(progress_us); t1=$(date +%s%N)
          ratio=$(python3 -c 'import sys; m0,m1,t0,t1=map(int,sys.argv[1:]); print(((m1-m0)/1e6)/((t1-t0)/1e9))' "$m0" "$m1" "$t0" "$t1")
          echo GOOD_PROGRESS_M0=$m0
          echo GOOD_PROGRESS_M1=$m1
          echo GOOD_PROGRESS_RATIO=$ratio

          echo '=== CURRENT V4 HEALTH WRAPPER ==='
          /usr/local/bin/fgbears-audio-health --capture-seconds 8 || true
          echo '=== PIPELINE STATE ==='
          cat /srv/fgbears-live/runtime/lovable-audio-pipeline.json
          echo KNOWN_GOOD_PACING_PROBE=PASS
          REMOTE
