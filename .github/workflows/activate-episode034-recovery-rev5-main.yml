name: Reset YouTube Relay Timestamp State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-episode034-recovery-rev5-main.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Reset relay only and verify clean state
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RELAY=fgbears-youtube-copy-relay.service
          AUDIO=/srv/fgbears-live/audio/fgb-music-loop.m4a
          EXPECTED=c04e4fa32a5acc4200c2ef88e8bf43f7618998768ad8c58a716f7869a35a9e7a
          systemctl is-active --quiet "$MASTER"
          systemctl is-active --quiet "$RELAY"
          test "$(sha256sum "$AUDIO" | awk '{print $1}')" = "$EXPECTED"
          master_before=$(systemctl show -p MainPID --value "$MASTER")
          relay_before=$(systemctl show -p MainPID --value "$RELAY")
          start_epoch=$(date +%s)
          systemctl restart "$RELAY"
          deadline=$((SECONDS+45))
          while (( SECONDS < deadline )); do
            systemctl is-active --quiet "$RELAY" && break
            sleep 1
          done
          systemctl is-active --quiet "$RELAY"
          sleep 12
          master_after=$(systemctl show -p MainPID --value "$MASTER")
          relay_after=$(systemctl show -p MainPID --value "$RELAY")
          test "$master_before" = "$master_after"
          test "$relay_before" != "$relay_after"
          test "$(sha256sum "$AUDIO" | awk '{print $1}')" = "$EXPECTED"
          echo MASTER_PID_UNCHANGED=$master_after
          echo RELAY_PID_BEFORE=$relay_before
          echo RELAY_PID_AFTER=$relay_after
          echo LIVE_SHA=$(sha256sum "$AUDIO" | awk '{print $1}')
          echo '=== NEW_RELAY_LOGS ==='
          journalctl -u "$RELAY" --since "@$start_epoch" --no-pager | tail -120
          echo '=== NEW_RELAY_TIMESTAMP_WARNINGS ==='
          if journalctl -u "$RELAY" --since "@$start_epoch" --no-pager | grep -Ei 'timestamp discontinuity|DTS .* out of order|Packet corrupt|dropping it|non.monoton'; then
            echo CLEAN_TIMESTAMP_STATE=FAIL
            exit 1
          fi
          echo CLEAN_TIMESTAMP_STATE=PASS
          systemctl is-active --quiet "$MASTER"
          systemctl is-active --quiet "$RELAY"
          echo YOUTUBE_RELAY_TIMESTAMP_RESET=PASS
          REMOTE
