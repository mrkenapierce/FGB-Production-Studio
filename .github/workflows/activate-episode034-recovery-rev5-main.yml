name: Re-enable Episode 034 Audio Sync Safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-episode034-recovery-rev5-main.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Enable sync and verify revision 9 remains untouched
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          EXPECTED=c04e4fa32a5acc4200c2ef88e8bf43f7618998768ad8c58a716f7869a35a9e7a
          AUDIO=/srv/fgbears-live/audio/fgb-music-loop.m4a
          TIMER=fgbears-lovable-audio-sync.timer
          SERVICE=fgbears-lovable-audio-sync.service
          MASTER=fgbears-live.service
          test "$(sha256sum "$AUDIO" | awk '{print $1}')" = "$EXPECTED"
          systemctl enable --now "$TIMER"
          systemctl is-enabled --quiet "$TIMER"
          systemctl is-active --quiet "$TIMER"
          systemctl start "$SERVICE"
          systemctl is-active --quiet "$MASTER"
          test "$(sha256sum "$AUDIO" | awk '{print $1}')" = "$EXPECTED"
          state=$(cat /srv/fgbears-live/runtime/lovable-audio-pipeline.json)
          echo "$state" | jq -e '.appliedRevision==9 and .status=="live" and .sourceSha256=="c04e4fa32a5acc4200c2ef88e8bf43f7618998768ad8c58a716f7869a35a9e7a"' >/dev/null
          echo TIMER=$(systemctl is-active "$TIMER")
          echo MASTER=$(systemctl is-active "$MASTER")
          echo LIVE_SHA=$(sha256sum "$AUDIO" | awk '{print $1}')
          journalctl -u "$SERVICE" -n 8 --no-pager | tail -8
          echo EPISODE_034_SYNC_REENABLE=PASS
          REMOTE
