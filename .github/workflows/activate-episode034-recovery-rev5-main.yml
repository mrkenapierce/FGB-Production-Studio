name: Probe Episode 034 Relay Buffers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-episode034-recovery-rev5-main.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Read-only relay and UDP diagnostics
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== YOUTUBE_RELAY_LOGS ==='
          journalctl -u fgbears-youtube-copy-relay.service --since '90 minutes ago' --no-pager | grep -Ei 'error|warning|drop|overrun|corrupt|timestamp|dts|pts|aac|queue|fifo|buffer|non.monoton' | tail -200 || true
          echo '=== MASTER_LOGS ==='
          journalctl -u fgbears-live.service --since '90 minutes ago' --no-pager | grep -Ei 'error|warning|drop|overrun|corrupt|timestamp|dts|pts|aac|queue|fifo|buffer|non.monoton' | tail -200 || true
          echo '=== UDP_SOCKET_1940 ==='
          ss -u -n -a -m -p | grep -A2 -B2 ':1940' || true
          echo '=== UDP_KERNEL_COUNTERS ==='
          netstat -su 2>/dev/null | sed -n '/Udp:/,/UdpLite:/p' || true
          echo '=== PROCESS_STATS ==='
          mpid=$(systemctl show -p MainPID --value fgbears-live.service)
          ypid=$(systemctl show -p MainPID --value fgbears-youtube-copy-relay.service)
          ps -o pid,ppid,etime,%cpu,%mem,nlwp,stat,args -p "$mpid","$ypid" --forest || true
          echo '=== SYSTEM_LOAD ==='
          uptime
          free -m
          echo '=== CURRENT_HASH_AND_SERVICES ==='
          sha256sum /srv/fgbears-live/audio/fgb-music-loop.m4a
          systemctl is-active fgbears-live.service
          systemctl is-active fgbears-youtube-copy-relay.service
          REMOTE
