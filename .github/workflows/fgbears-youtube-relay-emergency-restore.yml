name: Emergency Restore FGBears YouTube Relay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-youtube-relay-emergency-restore.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ORACLE_USER: ubuntu

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"; test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Force Facebook off and restore known-good YouTube mode
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' > /tmp/emergency-restore.json <<'REMOTE'
          set -u
          env_file=/etc/fgbears-live/stream.env
          primary_before=$(systemctl show -p MainPID --value fgbears-live.service 2>/dev/null || echo 0)
          sudo python3 - "$env_file" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); lines=p.read_text(encoding='utf-8').splitlines(); out=[]; seen=set()
          updates={'FACEBOOK_STREAM_ENABLED':'0','FACEBOOK_RELAY_ENABLED':'0'}
          for line in lines:
              key=line.split('=',1)[0] if '=' in line and not line.lstrip().startswith('#') else None
              if key in updates:
                  if key not in seen: out.append(f'{key}={updates[key]}'); seen.add(key)
              else: out.append(line)
          for key,value in updates.items():
              if key not in seen: out.append(f'{key}={value}')
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          sudo chown root:fgbears "$env_file"; sudo chmod 0640 "$env_file"
          sudo systemctl disable --now fgbears-facebook-relay.service >/dev/null 2>&1 || true
          sudo systemctl reset-failed fgbears-youtube-relay.service >/dev/null 2>&1 || true
          sudo systemctl restart fgbears-youtube-relay.service >/dev/null 2>&1 || true

          ok=false; yt=false; x=false; primary_same=false
          for _ in $(seq 1 60); do
            primary_now=$(systemctl show -p MainPID --value fgbears-live.service 2>/dev/null || echo 0)
            relay=$(systemctl show -p MainPID --value fgbears-youtube-relay.service 2>/dev/null || echo 0)
            [[ "$primary_now" == "$primary_before" && "$primary_now" =~ ^[1-9][0-9]*$ ]] && primary_same=true || primary_same=false
            if [[ "$relay" =~ ^[1-9][0-9]*$ ]] && systemctl is-active --quiet fgbears-live.service && systemctl is-active --quiet fgbears-youtube-relay.service; then
              primary_ffmpeg=$(pgrep -P "$primary_now" -x ffmpeg | head -n 1 || true)
              sudo ss -ntpH state established > /tmp/emergency-sockets.txt || true
              grep "pid=$relay" /tmp/emergency-sockets.txt | grep -vE '127\.0\.0\.1|\[::1\]' | grep -q ':443' && yt=true || yt=false
              [[ -n "$primary_ffmpeg" ]] && grep "pid=$primary_ffmpeg" /tmp/emergency-sockets.txt | grep -vE '127\.0\.0\.1|\[::1\]' | grep -q ':443' && x=true || x=false
              rm -f /tmp/emergency-sockets.txt
              if [[ "$primary_same" == true && "$yt" == true && "$x" == true ]]; then ok=true; break; fi
            fi
            sleep 2
          done
          primary_active=$(systemctl is-active --quiet fgbears-live.service && echo true || echo false)
          relay_active=$(systemctl is-active --quiet fgbears-youtube-relay.service && echo true || echo false)
          relay_result=$(systemctl show -p Result --value fgbears-youtube-relay.service 2>/dev/null || echo unknown)
          jq -n --argjson ok "$ok" --argjson primaryActive "$primary_active" --argjson youtubeRelayActive "$relay_active" --argjson primaryPidUnchanged "$primary_same" --argjson youtubeEstablished "$yt" --argjson xEstablished "$x" --argjson facebookEnabled false --arg relayResult "$relay_result" --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{ok:$ok,primaryActive:$primaryActive,youtubeRelayActive:$youtubeRelayActive,primaryPidUnchanged:$primaryPidUnchanged,youtubeEstablished:$youtubeEstablished,xEstablished:$xEstablished,facebookEnabled:$facebookEnabled,relayResult:$relayResult,checkedAt:$checkedAt}'
          [[ "$ok" == true ]]
          REMOTE
          cat /tmp/emergency-restore.json
      - name: Record restore result
        if: always()
        run: |
          git fetch origin main; git checkout -B main origin/main
          mkdir -p .github/deployment-status
          test -s /tmp/emergency-restore.json && cp /tmp/emergency-restore.json .github/deployment-status/fgbears-youtube-emergency-restore.json || echo '{"ok":false,"status":"unavailable"}' > .github/deployment-status/fgbears-youtube-emergency-restore.json
          git config user.name 'FGBears Deploy Bot'; git config user.email 'actions@github.com'
          git add .github/deployment-status/fgbears-youtube-emergency-restore.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record emergency YouTube relay restore [skip ci]'; git push origin main
