name: Inspect FGB Archive Wrapper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-fgb-archive-wrapper.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.OVH_SSH_KEY || secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -T 8 -H 40.160.144.185 > ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect sanitized wrapper wiring
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/ovh_key ubuntu@40.160.144.185 \
            "grep -nE 'archive-uploader|subprocess|exec|FGB_YOUTUBE|ACCESS_TOKEN|CONTROL_URL|check-auth|test-upload' /opt/fgb-transport/archive-token-wrapper.py | sed -E 's/(Bearer |secret[^=]*=|token[^=]*=).*/[REDACTED]/Ig' || true"
