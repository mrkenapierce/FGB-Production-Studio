name: Audit FGBears News Runtime
# Runtime verification after seamless clipping/full-headline deployment.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fgbears-news-runtime-audit.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Oracle access secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" || { echo 'Missing ORACLE_HOST secret'; exit 1; }
          test -n "$ORACLE_SSH_KEY" || { echo 'Missing ORACLE_SSH_KEY secret'; exit 1; }

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Trust Oracle host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Report safe Bears news state
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" '
            set -Eeuo pipefail
            runtime=/srv/fgbears-live/runtime
            service=$(systemctl is-active fgbears-live.service)
            active=$(sudo cat "$runtime/bears-news-active")
            label=$(sudo cat "$runtime/bears-news-label.txt")
            headline=$(sudo cat "$runtime/bears-news-message.txt")
            printf "service=%s\n" "$service"
            printf "active=%s\n" "$active"
            printf "label=%s\n" "$label"
            printf "message_chars=%s\n" "${#headline}"
            printf "headline=%s\n" "$headline"
            test "$service" = active
            test -n "$label"
            test -n "$headline"
            test "$active" = 1
            grep -Fq "HOW TO WATCH, LISTEN TO, STREAM BEARS-TITANS PRESEASON WEEK 3 GAME" <<< "$headline"
            grep -Fq "PREDICTING BEARS' WEEK 1 STARTING LINEUP AFTER PRESEASON WEEK 2 AND NEW TRADE RUMOR" <<< "$headline"
          '
