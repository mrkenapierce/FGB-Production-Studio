name: Reconnect Rumble Relay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconnect-rumble.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  reconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require protected Rumble key
        env:
          RUMBLE_STREAM_KEY: ${{ secrets.RUMBLE_STREAM_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$RUMBLE_STREAM_KEY"
          echo 'RUMBLE_PROTECTED_KEY=AVAILABLE'

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Restore protected Rumble key and verify reconnect
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          RUMBLE_STREAM_KEY: ${{ secrets.RUMBLE_STREAM_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$RUMBLE_STREAM_KEY"
          master_before=$(ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'systemctl show -p MainPID --value fgbears-live.service')
          youtube_before=$(ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'systemctl show -p MainPID --value fgbears-youtube-copy-relay.service')
          [[ "$master_before" =~ ^[1-9][0-9]*$ ]]
          [[ "$youtube_before" =~ ^[1-9][0-9]*$ ]]

          printf '%s\n' "$RUMBLE_STREAM_KEY" | ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'sudo /usr/local/bin/fgbears-configure-rumble'

          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          for _ in $(seq 1 30); do
            rumble_pid=$(pid fgbears-rumble-relay.service)
            if [[ "$rumble_pid" =~ ^[1-9][0-9]*$ ]] && \
               sudo ss -Htnp state established 2>/dev/null | awk -v p="pid=$rumble_pid," 'index($0,p){ok=1} END{exit(ok?0:1)}'; then
              echo "RUMBLE_TCP_ESTABLISHED=yes"
              exit 0
            fi
            sleep 1
          done
          echo 'RUMBLE_TCP_ESTABLISHED=no' >&2
          sudo journalctl -u fgbears-rumble-relay.service -n 30 --no-pager >&2 || true
          exit 1
          REMOTE

          master_after=$(ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'systemctl show -p MainPID --value fgbears-live.service')
          youtube_after=$(ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'systemctl show -p MainPID --value fgbears-youtube-copy-relay.service')
          test "$master_after" = "$master_before"
          test "$youtube_after" = "$youtube_before"
          echo "RUMBLE_RECONNECT=PASS master_pid=$master_after youtube_pid=$youtube_after"
