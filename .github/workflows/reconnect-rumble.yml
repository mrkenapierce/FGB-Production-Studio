name: Reconnect Rumble Relay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconnect-rumble.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  reconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Restart Rumble destination only and verify reconnect
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }

          systemctl is-active --quiet fgbears-live.service
          systemctl is-active --quiet fgbears-youtube-copy-relay.service
          master_before=$(pid fgbears-live.service)
          youtube_before=$(pid fgbears-youtube-copy-relay.service)
          [[ "$master_before" =~ ^[1-9][0-9]*$ ]]
          [[ "$youtube_before" =~ ^[1-9][0-9]*$ ]]

          sudo systemctl restart fgbears-rumble-relay.service

          for _ in $(seq 1 20); do
            rumble_pid=$(pid fgbears-rumble-relay.service)
            if [[ "$rumble_pid" =~ ^[1-9][0-9]*$ ]] && \
               sudo ss -Htnp state established 2>/dev/null | awk -v p="pid=$rumble_pid," 'index($0,p){ok=1} END{exit(ok?0:1)}'; then
              break
            fi
            sleep 1
          done

          systemctl is-active --quiet fgbears-rumble-relay.service
          rumble_after=$(pid fgbears-rumble-relay.service)
          [[ "$rumble_after" =~ ^[1-9][0-9]*$ ]]
          sudo ss -Htnp state established 2>/dev/null | awk -v p="pid=$rumble_after," 'index($0,p){ok=1} END{exit(ok?0:1)}'

          master_after=$(pid fgbears-live.service)
          youtube_after=$(pid fgbears-youtube-copy-relay.service)
          test "$master_after" = "$master_before"
          test "$youtube_after" = "$youtube_before"

          echo "RUMBLE_RECONNECT=PASS master_pid=$master_after rumble_pid=$rumble_after youtube_pid=$youtube_after"
          REMOTE
