name: Cut Over YouTube Thin Overlay V1

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/cutover-youtube-thin-overlay-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Guarded YouTube-only cutover
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          DIRECT=fgbears-youtube-relay.service
          ROUTER=fgbears-youtube-router.service
          DYNAMIC=fgbears-youtube-dynamic-card.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service
          WATCHDOG=fgbears-youtube-audio-watchdog.timer
          HEALTH_DROPIN=/etc/systemd/system/fgbears-live-health.service.d/99-youtube-dynamic-router.conf
          MONITOR_DIR=/run/fgbears-youtube-lovable-compositor
          PROBE=/tmp/fgb-thin-overlay-cutover-$$.ts

          active() { systemctl is-active --quiet "$1"; }
          pid() { systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          child_ffmpeg() {
            local p="$1"
            if [[ "$(cat /proc/$p/comm 2>/dev/null || true)" == ffmpeg ]]; then echo "$p"; return 0; fi
            pgrep -P "$p" -x ffmpeg 2>/dev/null | sed -n '1p' || true
          }
          connected_port() {
            local p="$1" port="$2"
            sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v port=":$port" 'index($0,q) && index($0,port) {f=1} END {exit(f?0:1)}'
          }
          comp_connected() {
            local cp ff
            cp=$(pid "$COMP")
            [[ "$cp" =~ ^[1-9][0-9]*$ ]] || return 1
            ff=$(child_ffmpeg "$cp")
            [[ "$ff" =~ ^[1-9][0-9]*$ ]] || return 1
            connected_port "$ff" 443
          }
          router_connected() {
            local rp ff
            rp=$(pid "$ROUTER")
            [[ "$rp" =~ ^[1-9][0-9]*$ ]] || return 1
            ff=$(child_ffmpeg "$rp")
            [[ "$ff" =~ ^[1-9][0-9]*$ ]] || return 1
            connected_port "$ff" 443
          }
          rumble_connected() {
            local rp ff
            rp=$(pid "$RUMBLE")
            [[ "$rp" =~ ^[1-9][0-9]*$ ]] || return 1
            ff=$(child_ffmpeg "$rp")
            [[ "$ff" =~ ^[1-9][0-9]*$ ]] || return 1
            connected_port "$ff" 1935
          }
          get_cpu() {
            local p="$1"
            ps -p "$p" -o %cpu= 2>/dev/null | tr -d ' ' || echo 0
          }

          active "$MASTER"
          active "$RUMBLE"
          active "$COMP"
          active "$ROUTING"
          rumble_connected

          master0=$(pid "$MASTER")
          rumble0=$(pid "$RUMBLE")
          comp0=$(pid "$COMP")
          routing0=$(pid "$ROUTING")
          [[ "$master0" =~ ^[1-9][0-9]*$ && "$rumble0" =~ ^[1-9][0-9]*$ && "$comp0" =~ ^[1-9][0-9]*$ && "$routing0" =~ ^[1-9][0-9]*$ ]]
          echo "BASELINE master_pid=$master0 rumble_pid=$rumble0 compositor_pid=$comp0 routing_pid=$routing0"
          echo "BASELINE master_child_cpu=$(pgrep -P "$master0" -x ffmpeg | xargs -r -n1 sh -c 'ps -p "$0" -o %cpu= | tr -d " "' | head -1 || true)"
          echo "BASELINE compositor_cpu=$(get_cpu "$comp0")"

          router_was_active=0
          dynamic_was_active=0
          active "$ROUTER" && router_was_active=1 || true
          active "$DYNAMIC" && dynamic_was_active=1 || true
          if (( router_was_active == 1 )); then
            router_connected || { echo 'Current YouTube router is active but has no RTMPS connection'; exit 1; }
          fi

          success=0
          cutover_started=0
          rollback() {
            rc=$?
            rm -f "$PROBE" >/dev/null 2>&1 || true
            if (( success == 1 )); then return 0; fi
            if (( cutover_started == 1 )); then
              echo 'ROLLBACK=START'
              sudo systemctl stop "$COMP" >/dev/null 2>&1 || true
              if (( dynamic_was_active == 1 )); then
                sudo systemctl enable "$DYNAMIC" >/dev/null 2>&1 || true
                sudo systemctl start "$DYNAMIC" >/dev/null 2>&1 || true
                for _ in $(seq 1 30); do active "$DYNAMIC" && break; sleep 1; done
              fi
              if (( router_was_active == 1 )); then
                sudo systemctl enable "$ROUTER" >/dev/null 2>&1 || true
                sudo systemctl reset-failed "$ROUTER" >/dev/null 2>&1 || true
                sudo systemctl start "$ROUTER" >/dev/null 2>&1 || true
                restored=0
                for _ in $(seq 1 45); do
                  if active "$ROUTER" && router_connected; then restored=1; break; fi
                  sleep 1
                done
                (( restored == 1 )) || echo 'ROLLBACK_WARNING=router_transport_not_confirmed'
              fi
              sudo systemctl start "$COMP" >/dev/null 2>&1 || true
              echo 'ROLLBACK=COMPLETE'
            fi
            exit "$rc"
          }
          trap rollback EXIT

          cutover_started=1
          echo 'CUTOVER=STOP_EXPERIMENTAL_YOUTUBE_PATH'
          sudo systemctl stop "$ROUTER" >/dev/null 2>&1 || true
          sudo systemctl stop "$DYNAMIC" >/dev/null 2>&1 || true

          # The compositor has been retrying while the router owned YouTube.
          # Give it one recovery window; restart only this YouTube-side service if needed.
          claimed=0
          for _ in $(seq 1 20); do
            if active "$COMP" && comp_connected; then claimed=1; break; fi
            sleep 1
          done
          if (( claimed == 0 )); then
            echo 'CUTOVER=RESTART_COMPOSITOR_FOR_CLEAN_RTMPS_HANDSHAKE'
            sudo systemctl restart "$COMP"
            for _ in $(seq 1 40); do
              if active "$COMP" && comp_connected; then claimed=1; break; fi
              sleep 1
            done
          fi
          (( claimed == 1 )) || { echo 'THIN_COMPOSITOR_RTMPS=FAIL'; exit 1; }
          echo 'THIN_COMPOSITOR_RTMPS=PASS'

          # Preserve the one-master / untouched-Rumble contract.
          [[ "$(pid "$MASTER")" == "$master0" ]]
          [[ "$(pid "$RUMBLE")" == "$rumble0" ]]
          [[ "$(pid "$ROUTING")" == "$routing0" ]]
          active "$MASTER"
          active "$RUMBLE"
          active "$ROUTING"
          rumble_connected
          echo 'MASTER_AND_RUMBLE_UNCHANGED=PASS'

          # Validate compositor contract from its rotating local tee output.
          src=''
          for _ in $(seq 1 15); do
            src=$(sudo find "$MONITOR_DIR" -maxdepth 1 -type f -name 'monitor-*.ts' -size +50k -printf '%T@ %p\n' 2>/dev/null | sort -nr | awk 'NR==2{sub(/^[^ ]+ /,""); print; exit}')
            [[ -n "$src" ]] && break
            sleep 1
          done
          [[ -n "$src" ]]
          sudo cp -f "$src" "$PROBE"
          sudo chmod 0644 "$PROBE"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json "$PROBE" | python3 -c '
import json,sys
p=json.load(sys.stdin); s=p.get("streams",[])
v=next((x for x in s if x.get("codec_type")=="video"),None)
a=next((x for x in s if x.get("codec_type")=="audio"),None)
assert v and v.get("codec_name")=="h264" and v.get("width")==640 and v.get("height")==360 and v.get("r_frame_rate") in ("30/1","60/2"),v
assert a and a.get("codec_name")=="aac" and a.get("sample_rate")=="44100" and a.get("channels")==2,a
print("YOUTUBE_AV_CONTRACT=PASS video=640x360_30_h264 audio=44100_stereo_aac")'

          # Make this the only enabled YouTube sender and retire the expensive card encoder.
          sudo systemctl disable "$ROUTER" >/dev/null 2>&1 || true
          sudo systemctl disable "$DYNAMIC" >/dev/null 2>&1 || true
          sudo systemctl disable "$DIRECT" >/dev/null 2>&1 || true
          sudo systemctl disable --now "$WATCHDOG" >/dev/null 2>&1 || true
          sudo systemctl enable "$COMP" "$ROUTING" >/dev/null 2>&1 || true

          # Point the existing health checker at the actual YouTube sender.
          sudo install -d -m 0755 /etc/systemd/system/fgbears-live-health.service.d
          printf '%s\n' '[Service]' 'Environment=YOUTUBE_RELAY_SERVICE=fgbears-youtube-lovable-compositor.service' | sudo tee "$HEALTH_DROPIN" >/dev/null
          sudo systemctl daemon-reload

          sleep 8
          comp1=$(pid "$COMP")
          [[ "$comp1" =~ ^[1-9][0-9]*$ ]]
          comp_connected
          [[ "$(pid "$MASTER")" == "$master0" ]]
          [[ "$(pid "$RUMBLE")" == "$rumble0" ]]
          rumble_connected
          ! active "$ROUTER"
          ! active "$DYNAMIC"

          echo "POST compositor_pid=$comp1 compositor_cpu=$(get_cpu "$comp1")"
          echo "POST host_load=$(cut -d' ' -f1-3 /proc/loadavg)"
          echo 'EXPERIMENTAL_DYNAMIC_CARD=DISABLED'
          echo 'EXPERIMENTAL_YOUTUBE_ROUTER=DISABLED'
          echo 'YOUTUBE_SINGLE_SENDER=THIN_LOVABLE_COMPOSITOR'
          echo 'RUMBLE_PATH=UNCHANGED_COPY_REMUX'
          echo 'YOUTUBE_AUDIO_REPAIR=44100_stereo_aac128_async'
          echo 'CUTOVER_YOUTUBE_THIN_OVERLAY=PASS'

          success=1
          trap - EXIT
          rm -f "$PROBE" >/dev/null 2>&1 || true
          REMOTE
