name: Trigger Episode 034 Revision 5 Cutover

on:
  push:
    branches: [episode034-offhost-recovery]
    paths:
      - '.github/workflows/trigger-episode034-rev5-cutover.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protected cutover workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/activate-episode034-recovery-rev5.yml/dispatches \
            -d '{"ref":"episode034-offhost-recovery"}')
          cat /tmp/resp || true
          test "$code" = 204
          echo CUTOVER_DISPATCH=PASS
