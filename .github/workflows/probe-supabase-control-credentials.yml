name: Probe Supabase Control Credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-supabase-control-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check GitHub credential slots without printing values
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
        run: |
          set -Eeuo pipefail
          for n in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD DATABASE_URL PGHOST PGPASSWORD; do
            if [ -n "${!n:-}" ]; then echo "$n=PRESENT"; else echo "$n=ABSENT"; fi
          done
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"; test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Check Oracle for credential names only
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== CONFIG FILES CONTAINING SUPABASE/POSTGRES VARIABLE NAMES ==='
          sudo grep -RIlE 'SUPABASE_(URL|SERVICE_ROLE_KEY|ACCESS_TOKEN|DB_PASSWORD)|DATABASE_URL|PGHOST|PGPASSWORD' /opt /etc/systemd /home/ubuntu 2>/dev/null | head -50 || true
          echo '=== RUNNING PROCESS ENVIRONMENT VARIABLE NAMES ==='
          for p in /proc/[0-9]*/environ; do
            sudo sh -c "tr '\0' '\n' < '$p' 2>/dev/null" | cut -d= -f1 | grep -E '^(SUPABASE_(URL|SERVICE_ROLE_KEY|ACCESS_TOKEN|DB_PASSWORD)|DATABASE_URL|PGHOST|PGPASSWORD)$' || true
          done | sort -u
          echo '=== PSQL CLIENT ==='
          command -v psql || true
          REMOTE
