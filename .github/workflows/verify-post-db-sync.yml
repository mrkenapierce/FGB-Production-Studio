name: Verify Production Trivia After DB Fix

on:
  push:
    branches:
      - probe-external-db-access
    paths:
      - '.github/workflows/verify-post-db-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Sample public source and delayed website feeds across minute ticks
        run: |
          set -Eeuo pipefail
          failures=0
          samples=0
          active_samples=0
          waiting_samples=0
          delay_bad=0
          start=$(date +%s)
          while [ $(( $(date +%s) - start )) -lt 85 ]; do
            ts=$(date -u +%FT%T.%3NZ)
            b=$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' -A FGB-post-db-fix-probe "https://epiccontentcreatorgrants.org/api/public/fgbears/game-screen?t=$(date +%s%N)" || printf '{}')
            w=$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' -A FGB-post-db-fix-probe "https://epiccontentcreatorgrants.org/api/public/fgbears/website-game-screen?t=$(date +%s%N)" || printf '{}')
            ba=$(jq -r '.active // false' <<<"$b")
            wa=$(jq -r '.active // false' <<<"$w")
            ww=$(jq -r '.waiting // false' <<<"$w")
            ds=$(jq -r '.delaySeconds // -1' <<<"$w")
            br=$(jq -r '.roundId // "null"' <<<"$b")
            wr=$(jq -r '.roundId // "null"' <<<"$w")
            bi=$(jq -r '.questionIndex // "null"' <<<"$b")
            wi=$(jq -r '.questionIndex // "null"' <<<"$w")
            bp=$(jq -r '.phase // "null"' <<<"$b")
            wp=$(jq -r '.phase // "null"' <<<"$w")
            printf '%s source active=%s round=%s idx=%s phase=%s | website active=%s waiting=%s delay=%s round=%s idx=%s phase=%s\n' "$ts" "$ba" "$br" "$bi" "$bp" "$wa" "$ww" "$ds" "$wr" "$wi" "$wp"
            samples=$((samples+1))
            if [ "$ba" = true ]; then
              active_samples=$((active_samples+1))
              if [ "$ww" = true ]; then
                waiting_samples=$((waiting_samples+1))
                failures=$((failures+1))
              fi
              if [ "$ds" != 20 ]; then
                delay_bad=$((delay_bad+1))
                failures=$((failures+1))
              fi
            fi
            sleep 2
          done
          echo "SUMMARY samples=$samples active_samples=$active_samples waiting_samples=$waiting_samples delay_bad=$delay_bad failures=$failures"
          test "$active_samples" -gt 10
          test "$waiting_samples" -eq 0
          test "$delay_bad" -eq 0
