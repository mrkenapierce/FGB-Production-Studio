name: Rumble Cutover Read-Only Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rumble-only-cutover-readonly-probe.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"; test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Measure Rumble runtime without changes
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          svc=$(systemctl show -p MainPID --value fgbears-live.service)
          ff=$(pgrep -P "$svc" -x ffmpeg | head -n1)
          relay=$(systemctl show -p MainPID --value fgbears-rumble-relay.service)
          [[ "$ff" =~ ^[1-9][0-9]*$ ]]; [[ "$relay" =~ ^[1-9][0-9]*$ ]]

          echo '=== ROUTING ==='
          cmd=$(sudo tr '\0' ' ' < "/proc/$ff/cmdline")
          echo "$cmd" | sed -E 's#(rtmp[^ ]*/live/)[^ ]+#\1[REDACTED]#g'
          grep -Fq '127.0.0.1:1940' <<<"$cmd"
          ! grep -Eqi '127\.0\.0\.1:1939|127\.0\.0\.1:1941|youtube|studio-rtmp' <<<"$cmd"
          echo 'RETIRED_ENV_COUNT='$(sudo grep -Ec '^(YOUTUBE_|FGB_YOUTUBE_|RUMBLE_STUDIO_)' /etc/fgbears-live/stream.env || true)

          echo '=== SOCKET ==='
          sudo ss -ntpH state established | grep "pid=$relay" || true

          echo '=== CPU SNAPSHOT ==='
          ps -eo pid,ppid,pcpu,pmem,etime,comm,args --sort=-pcpu | head -n 25
          echo 'LOADAVG='$(cat /proc/loadavg)
          echo 'NPROC='$(nproc)

          echo '=== SUSTAINED PACE ==='
          p=/srv/fgbears-live/logs/ffmpeg-progress.log
          media(){ sudo sed -n 's/^out_time_us=\([0-9]*\)$/\1/p' "$p" | tail -n1; }
          m0=$(media); t0=$(date +%s%N)
          sleep 20
          m1=$(media); t1=$(date +%s%N)
          python3 - "$m0" "$m1" "$t0" "$t1" <<'PY'
          import sys
          m0,m1,t0,t1=map(int,sys.argv[1:])
          wall=(t1-t0)/1e9; media=(m1-m0)/1e6
          print(f'INTERVAL_SPEED={media/wall:.4f}x MEDIA_ADVANCE={media:.3f}s WALL={wall:.3f}s')
          PY
          sudo tail -n 12 "$p" || true

          echo '=== AUDIO ==='
          set +e
          sudo /usr/local/bin/fgbears-audio-health --capture-seconds 8
          audio_rc=$?
          set -e
          echo "AUDIO_RC=$audio_rc"

          echo '=== COMPONENT CPU AFTER SAMPLE ==='
          ps -eo pid,ppid,pcpu,pmem,etime,comm,args --sort=-pcpu | grep -E 'ffmpeg|ad-overlay|crawl-overlay|bears-news-feed' | head -n 20 || true
          echo "READ_ONLY_PERFORMANCE_PROBE=COMPLETE master_pid=$ff relay_pid=$relay audio_rc=$audio_rc"
          REMOTE
