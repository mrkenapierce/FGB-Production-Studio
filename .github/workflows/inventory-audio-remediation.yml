name: Inventory Audio Remediation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-audio-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"; test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
      - name: Inventory live library and retained originals
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ubuntu
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/oracle_key services/fgbears-live/tools/inventory-audio-remediation.py "$ORACLE_USER@$ORACLE_HOST:/tmp/inventory-audio-remediation.py"
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'python3 /tmp/inventory-audio-remediation.py; rc=$?; rm -f /tmp/inventory-audio-remediation.py; exit $rc'
