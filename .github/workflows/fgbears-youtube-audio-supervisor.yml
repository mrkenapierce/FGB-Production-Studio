name: FGBears YouTube Audio Supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-youtube-audio-supervisor.yml'

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-audio-supervisor
  cancel-in-progress: false

env:
  ORACLE_USER: ubuntu

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify and supervise canonical YouTube audio path
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          MASTER_SERVICE=fgbears-live.service
          YOUTUBE_SERVICE=fgbears-youtube-relay.service
          RUMBLE_SERVICE=fgbears-rumble-relay.service
          WATCHDOG_SERVICE=fgbears-youtube-audio-watchdog.service
          WATCHDOG_TIMER=fgbears-youtube-audio-watchdog.timer
          STATUS_FILE=/srv/fgbears-live/health/youtube-audio/status.env
          WARNING_FILE=/srv/fgbears-live/health/youtube-audio/warning.env

          MASTER_PID=$(systemctl show -p MainPID --value "$MASTER_SERVICE")
          RUMBLE_PID=$(systemctl show -p MainPID --value "$RUMBLE_SERVICE")
          [[ "$MASTER_PID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUMBLE_PID" =~ ^[1-9][0-9]*$ ]]
          systemctl is-active --quiet "$MASTER_SERVICE"
          systemctl is-active --quiet "$RUMBLE_SERVICE"

          if ! systemctl is-enabled --quiet "$WATCHDOG_TIMER"; then
            sudo systemctl enable "$WATCHDOG_TIMER"
          fi
          if ! systemctl is-active --quiet "$WATCHDOG_TIMER"; then
            sudo systemctl start "$WATCHDOG_TIMER"
          fi

          # The local watchdog is the sole automatic repair authority. It may
          # restart only the isolated YouTube relay; this supervisor verifies
          # the result and never restarts the shared master or Rumble branch.
          sudo systemctl start "$WATCHDOG_SERVICE"

          sudo test -s "$STATUS_FILE"
          echo '--- YouTube audio watchdog status ---'
          sudo cat "$STATUS_FILE"
          if sudo test -s "$WARNING_FILE"; then
            echo '--- YouTube audio watchdog warning ---'
            sudo cat "$WARNING_FILE"
          fi

          STATUS_AGE=$(( $(date +%s) - $(sudo stat -c %Y "$STATUS_FILE") ))
          echo "watchdog_status_age_seconds=$STATUS_AGE"
          (( STATUS_AGE <= 180 ))

          STATE=$(sudo sed -n 's/^state=//p' "$STATUS_FILE" | tail -n1)
          REASON=$(sudo sed -n 's/^reason=//p' "$STATUS_FILE" | tail -n1)
          echo "watchdog_state=$STATE"
          echo "watchdog_reason=$REASON"
          [[ "$STATE" == "OK" || "$STATE" == "WARN" ]]

          systemctl is-active --quiet "$YOUTUBE_SERVICE"
          YOUTUBE_PID=$(systemctl show -p MainPID --value "$YOUTUBE_SERVICE")
          [[ "$YOUTUBE_PID" =~ ^[1-9][0-9]*$ ]]
          ARGS=$(tr '\0' ' ' < "/proc/$YOUTUBE_PID/cmdline")
          SAFE_ARGS=$(sed -E 's#(rtmps?://)[^ ]+#\1[REDACTED]#g' <<<"$ARGS")
          echo "youtube_args=$SAFE_ARGS"
          [[ "$ARGS" == *"ffmpeg"* ]]
          [[ "$ARGS" == *"udp://127.0.0.1:1939"* ]]
          [[ "$ARGS" == *" -c:v copy "* ]]
          [[ "$ARGS" == *" -c:a aac "* ]]
          [[ "$ARGS" == *" -profile:a aac_low "* ]]
          [[ "$ARGS" == *" -b:a 128k "* ]]
          [[ "$ARGS" == *" -ar 44100 "* ]]
          [[ "$ARGS" == *" -ac 2 "* ]]
          [[ "$ARGS" == *"aresample=44100:async=1:first_pts=0"* ]]
          [[ "$ARGS" != *"youtube-stream-router"* ]]
          [[ "$ARGS" != *"gst-launch"* ]]
          [[ "$ARGS" != *"libx264"* ]]

          sudo ss -ntpH state established > /tmp/fgb-youtube-supervisor-sockets.txt || true
          grep -F "pid=$YOUTUBE_PID" /tmp/fgb-youtube-supervisor-sockets.txt | grep -Eq ':[4]43([[:space:]]|$)'
          echo 'youtube_rtmps_socket=ESTABLISHED'

          sudo grep -Fxq 'FGB_YOUTUBE_PACKET_ROUTER_ENABLE=0' /etc/fgbears-live/stream.env
          if sudo grep -Eq '^(YOUTUBE_TRIVIA_|FGB_YOUTUBE_TRIVIA_CARD_H264=)' /etc/fgbears-live/stream.env; then
            echo 'Retired YouTube router configuration is present.' >&2
            exit 1
          fi

          [[ "$(systemctl show -p MainPID --value "$MASTER_SERVICE")" == "$MASTER_PID" ]]
          [[ "$(systemctl show -p MainPID --value "$RUMBLE_SERVICE")" == "$RUMBLE_PID" ]]
          echo 'master_and_rumble_untouched=yes'

          if [[ "$STATE" == "WARN" ]]; then
            echo "YouTube audio watchdog warning requires review: $REASON" >&2
            exit 2
          fi

          echo 'youtube_audio_supervisor=PASS'
          REMOTE
