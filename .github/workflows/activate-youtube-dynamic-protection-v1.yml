name: Inspect YouTube Sender Ownership

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Inspect sender services and sockets
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          for u in fgbears-live.service fgbears-rumble-relay.service fgbears-youtube-relay.service fgbears-youtube-lovable-compositor.service fgbears-youtube-lovable-routing.service; do
            echo "UNIT=$u active=$(systemctl is-active "$u" 2>/dev/null || true) enabled=$(systemctl is-enabled "$u" 2>/dev/null || true) pid=$(systemctl show -p MainPID --value "$u" 2>/dev/null || true)"
          done
          echo '---443 SOCKET OWNERS---'
          sudo ss -ntpH state established | grep ':443 ' || true
          echo '---1935 SOCKET OWNERS---'
          sudo ss -ntpH state established | grep ':1935 ' || true
          echo '---YOUTUBE COMMANDS---'
          pgrep -af 'youtube|a.rtmps.youtube.com' || true
          echo '---MASK HEALTH---'
          curl -fsS --max-time 3 http://127.0.0.1:8791/healthz || true
          echo
          echo 'SENDER_INSPECTION=PASS'
          REMOTE
