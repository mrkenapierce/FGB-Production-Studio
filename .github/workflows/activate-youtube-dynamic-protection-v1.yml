name: Audit YouTube Audio Watchdog Ownership

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read-only watchdog ownership audit
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo 'WATCHDOG_TIMER'
          systemctl cat fgbears-youtube-audio-watchdog.timer 2>/dev/null || true
          systemctl show fgbears-youtube-audio-watchdog.timer -p ActiveState -p SubState -p LastTriggerUSec -p NextElapseUSecRealtime -p Triggers --no-pager 2>/dev/null || true

          echo 'WATCHDOG_SERVICE'
          systemctl cat fgbears-youtube-audio-watchdog.service 2>/dev/null || true
          systemctl show fgbears-youtube-audio-watchdog.service -p ActiveState -p SubState -p ExecMainStatus -p Result -p ExecStart --no-pager 2>/dev/null || true

          echo 'WATCHDOG_EXEC_CONTENT'
          exec_path=$(systemctl show fgbears-youtube-audio-watchdog.service -p ExecStart --value 2>/dev/null | sed -n 's/.*path=\([^ ;]*\).*/\1/p' | head -1)
          if [[ -n "$exec_path" && -f "$exec_path" ]]; then
            sed -E 's#(rtmps?://[^/]+/[^/]+/)[^ ]+#\1[REDACTED]#g; s#(YOUTUBE_STREAM_KEY|RUMBLE_STREAM_KEY)=.*#\1=[REDACTED]#g' "$exec_path"
          else
            for p in /usr/local/bin/fgbears-youtube-audio-watchdog /opt/fgbears-live/bin/youtube-audio-watchdog.sh /opt/fgbears-live/bin/fgbears-youtube-audio-watchdog; do
              if [[ -f "$p" ]]; then echo "PATH=$p"; sed -E 's#(rtmps?://[^/]+/[^/]+/)[^ ]+#\1[REDACTED]#g; s#(YOUTUBE_STREAM_KEY|RUMBLE_STREAM_KEY)=.*#\1=[REDACTED]#g' "$p"; fi
            done
          fi

          echo 'WATCHDOG_RECENT_LOG'
          journalctl -u fgbears-youtube-audio-watchdog.service --since '20 minutes ago' --no-pager -o short-iso 2>/dev/null \
            | sed -E 's#(rtmps?://[^/]+/[^/]+/)[^ ]+#\1[REDACTED]#g; s#([A-Za-z0-9_-]{24,})#[REDACTED]#g' \
            | tail -160 || true

          echo 'YOUTUBE_SERVICE_EVENTS_AROUND_WATCHDOG'
          journalctl --since '2026-09-02 21:49:50 UTC' --until '2026-09-02 21:51:00 UTC' --no-pager -o short-iso 2>/dev/null \
            | grep -Ei 'youtube-audio-watchdog|youtube-relay|youtube-lovable-compositor|youtube-router' \
            | sed -E 's#(rtmps?://[^/]+/[^/]+/)[^ ]+#\1[REDACTED]#g; s#([A-Za-z0-9_-]{24,})#[REDACTED]#g' \
            | tail -160 || true

          echo 'CURRENT_YOUTUBE_OWNERS'
          for u in fgbears-youtube-lovable-compositor.service fgbears-youtube-relay.service fgbears-youtube-router.service fgbears-youtube-lovable-routing.service; do
            printf '%s ' "$u"
            systemctl show "$u" -p ActiveState -p MainPID -p NRestarts --value 2>/dev/null | tr '\n' ' '; echo
          done
          ss -ntpH state established 2>/dev/null | grep ':443' | sed -E 's#users:\(\("[^\"]+",pid=([0-9]+),fd=[0-9]+\)\)#pid=\1#g' || true

          echo 'WATCHDOG_OWNERSHIP_AUDIT=PASS'
          REMOTE
