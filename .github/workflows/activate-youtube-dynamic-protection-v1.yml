name: Recover FGB Master Safely

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Recover master and verify transports
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service

          if ! systemctl is-active --quiet "$MASTER"; then
            sudo systemctl reset-failed "$MASTER"
            sudo systemctl start "$MASTER"
          fi

          for _ in $(seq 1 30); do
            if systemctl is-active --quiet "$MASTER" && curl -fsS --max-time 1 http://127.0.0.1:8788/healthz >/dev/null 2>&1 && curl -fsS --max-time 1 http://127.0.0.1:8789/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          if ! systemctl is-active --quiet "$MASTER"; then
            echo 'MASTER_RECOVERY=FAIL'
            systemctl status "$MASTER" --no-pager -l || true
            journalctl -u "$MASTER" -n 80 --no-pager || true
            exit 1
          fi

          curl -fsS --max-time 2 http://127.0.0.1:8788/healthz >/dev/null
          curl -fsS --max-time 2 http://127.0.0.1:8789/healthz >/dev/null
          systemctl is-active --quiet "$RUMBLE"
          systemctl is-active --quiet "$COMP"
          systemctl is-active --quiet "$ROUTING"

          # Give existing relays a chance to resume when master UDP returns.
          sleep 6
          if ! sudo ss -ntpH state established | grep -q ':1935 '; then
            sudo systemctl restart "$RUMBLE"
            sleep 5
          fi
          if ! sudo ss -ntpH state established | grep -q ':443 '; then
            sudo systemctl restart "$COMP"
            sleep 8
          fi

          sudo ss -ntpH state established | grep ':1935 '
          sudo ss -ntpH state established | grep ':443 '
          systemctl is-active --quiet "$MASTER"
          systemctl is-active --quiet "$RUMBLE"
          systemctl is-active --quiet "$COMP"
          systemctl is-active --quiet "$ROUTING"

          echo "MASTER_PID=$(systemctl show -p MainPID --value "$MASTER")"
          echo "RUMBLE_PID=$(systemctl show -p MainPID --value "$RUMBLE")"
          echo "COMPOSITOR_PID=$(systemctl show -p MainPID --value "$COMP")"
          echo "CRAWL_HEALTH=$(curl -fsS --max-time 2 http://127.0.0.1:8788/healthz)"
          echo "RSS_HEALTH=$(curl -fsS --max-time 2 http://127.0.0.1:8789/healthz)"
          echo 'MASTER_RECOVERY=PASS'
          REMOTE
