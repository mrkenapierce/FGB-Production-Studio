name: Activate YouTube Dynamic Protection V1

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
      - '.github/dynamic-youtube/youtube-dynamic-card-source.sh'
      - '.github/dynamic-youtube/youtube-stream-router-dynamic.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-cutover
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Stage dynamic source and router
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          scp -i ~/.ssh/oracle_key .github/dynamic-youtube/youtube-dynamic-card-source.sh "$target:/tmp/youtube-dynamic-card-source.sh"
          scp -i ~/.ssh/oracle_key .github/dynamic-youtube/youtube-stream-router-dynamic.py "$target:/tmp/youtube-stream-router-dynamic.py"

      - name: Validate locally then cut over YouTube only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          DIRECT=fgbears-youtube-relay.service
          ROUTER=fgbears-youtube-router.service
          DYNAMIC=fgbears-youtube-dynamic-card.service
          WATCHDOG=fgbears-youtube-audio-watchdog.timer
          HEALTH_DIR=/etc/systemd/system/fgbears-live-health.service.d
          ROUTER_DROPIN=/etc/systemd/system/fgbears-youtube-router.service.d/99-dynamic-protection.conf
          HEALTH_DROPIN=$HEALTH_DIR/99-youtube-dynamic-router.conf

          active() { systemctl is-active --quiet "$1"; }
          pid() { systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          rtmps_for_pid() {
            local p="$1"
            sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" 'index($0,q) && $0 ~ /:443([[:space:]]|$)/ {found=1} END {exit(found?0:1)}'
          }

          active "$MASTER"
          active "$RUMBLE"
          active "$DIRECT"
          master0=$(pid "$MASTER")
          rumble0=$(pid "$RUMBLE")
          direct0=$(pid "$DIRECT")
          [[ "$master0" =~ ^[1-9][0-9]*$ && "$rumble0" =~ ^[1-9][0-9]*$ && "$direct0" =~ ^[1-9][0-9]*$ ]]
          echo "PRE_MASTER_PID=$master0"
          echo "PRE_RUMBLE_PID=$rumble0"
          echo "PRE_YOUTUBE_DIRECT_PID=$direct0"

          # Install only YouTube-side additions. Nothing under the master or
          # Rumble service paths is modified.
          sudo install -m 0755 /tmp/youtube-dynamic-card-source.sh /opt/fgbears-live/bin/youtube-dynamic-card-source.sh
          sudo install -m 0755 /tmp/youtube-stream-router-dynamic.py /opt/fgbears-live/bin/youtube-stream-router-dynamic.py
          sudo install -d -m 0755 /var/lib/fgbears-live/youtube-dynamic-card
          sudo chown -R fgbears:fgbears /var/lib/fgbears-live/youtube-dynamic-card

          cat <<'UNIT' | sudo tee /etc/systemd/system/fgbears-youtube-dynamic-card.service >/dev/null
          [Unit]
          Description=FGBears YouTube 720p protected trivia source with live news and crawl
          After=network-online.target fgbears-live.service
          Wants=network-online.target
          Requires=fgbears-live.service

          [Service]
          Type=simple
          User=fgbears
          Group=fgbears
          EnvironmentFile=/etc/fgbears-live/stream.env
          Environment=FGB_YOUTUBE_DYNAMIC_FPS=10
          Environment=FGB_YOUTUBE_DYNAMIC_CARD_PORT=2942
          ExecStart=/opt/fgbears-live/bin/youtube-dynamic-card-source.sh
          Restart=always
          RestartSec=3
          Nice=19
          IOSchedulingClass=idle
          UMask=0077
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectHome=true
          ProtectSystem=strict
          ReadOnlyPaths=/opt/fgbears-live /etc/fgbears-live
          ReadWritePaths=/var/lib/fgbears-live
          RestrictSUIDSGID=true
          LockPersonality=true
          LimitNOFILE=65536

          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo systemctl daemon-reload
          sudo systemctl enable --now "$DYNAMIC"

          # Wait for the protected source to become stable and prove its actual
          # encoded geometry/framerate before touching the on-air YouTube relay.
          for _ in $(seq 1 30); do
            active "$DYNAMIC" && sleep 1 && break
            sleep 1
          done
          active "$DYNAMIC"
          probe=$(timeout 12 ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of csv=p=0 'udp://127.0.0.1:2942?fifo_size=1000000&overrun_nonfatal=1' | head -n1)
          echo "DYNAMIC_PROBE=$probe"
          [[ "$probe" == h264,1280,720,10/1* ]]
          active "$DIRECT"
          test "$(pid "$MASTER")" = "$master0"
          test "$(pid "$RUMBLE")" = "$rumble0"
          test "$(pid "$DIRECT")" = "$direct0"

          # Selector compatibility test on an isolated local input. The live
          # YouTube connection remains on the direct relay during this test.
          synth=/tmp/fgb-youtube-selector-synth.log
          testlog=/tmp/fgb-youtube-dynamic-router-test.log
          rm -f "$synth" "$testlog"
          (while true; do cat /opt/fgbears-live/assets/youtube-rumble-trivia.h264; done) | \
            nice -n 19 ffmpeg -hide_banner -nostdin -loglevel error -re -r 30 -f h264 -i pipe:0 \
              -map 0:v:0 -c:v copy -an -mpegts_flags +resend_headers -f mpegts \
              'udp://127.0.0.1:2950?pkt_size=1316' >"$synth" 2>&1 &
          synth_pid=$!
          cleanup_synth() { kill "$synth_pid" >/dev/null 2>&1 || true; wait "$synth_pid" >/dev/null 2>&1 || true; }
          trap cleanup_synth RETURN
          sleep 2
          timeout 18 env FGB_YOUTUBE_DYNAMIC_CARD_PORT=2942 \
            /usr/bin/python3 /opt/fgbears-live/bin/youtube-stream-router-dynamic.py \
            --input-port 2950 --test --test-cycle 3 --runtime 12 >"$testlog" 2>&1
          cleanup_synth
          trap - RETURN
          grep -Fq 'video route switched: live -> card' "$testlog"
          grep -Fq 'video route switched: card -> live' "$testlog"
          ! grep -Fq 'GStreamer error' "$testlog"
          echo 'LOCAL_SELECTOR_30_TO_10_TO_30=PASS'
          active "$DIRECT"
          test "$(pid "$MASTER")" = "$master0"
          test "$(pid "$RUMBLE")" = "$rumble0"
          test "$(pid "$DIRECT")" = "$direct0"

          success=0
          cutover=0
          rollback() {
            rc=$?
            if (( success == 1 )); then return 0; fi
            if (( cutover == 1 )); then
              echo 'YOUTUBE_DYNAMIC_ROLLBACK=START' >&2
              sudo systemctl stop "$ROUTER" >/dev/null 2>&1 || true
              sudo rm -f "$ROUTER_DROPIN" "$HEALTH_DROPIN"
              sudo systemctl daemon-reload
              sudo systemctl reset-failed "$DIRECT" >/dev/null 2>&1 || true
              sudo systemctl enable "$DIRECT" >/dev/null 2>&1 || true
              sudo systemctl start "$DIRECT" >/dev/null 2>&1 || true
              for _ in $(seq 1 45); do
                dp=$(pid "$DIRECT")
                if [[ "$dp" =~ ^[1-9][0-9]*$ ]]; then
                  df="$dp"
                  if [[ "$(cat /proc/$dp/comm 2>/dev/null || true)" != ffmpeg ]]; then
                    df=$(pgrep -P "$dp" ffmpeg | head -n1 || true)
                  fi
                  if [[ "$df" =~ ^[1-9][0-9]*$ ]] && rtmps_for_pid "$df"; then break; fi
                fi
                sleep 1
              done
              sudo systemctl enable --now "$WATCHDOG" >/dev/null 2>&1 || true
              echo 'YOUTUBE_DYNAMIC_ROLLBACK=DIRECT_RELAY_RESTORED' >&2
            fi
            exit "$rc"
          }
          trap rollback EXIT

          cutover=1
          sudo systemctl disable --now "$WATCHDOG" >/dev/null 2>&1 || true
          sudo install -d -m 0755 /etc/systemd/system/fgbears-youtube-router.service.d "$HEALTH_DIR"
          cat <<'DROPIN' | sudo tee "$ROUTER_DROPIN" >/dev/null
          [Service]
          EnvironmentFile=/etc/fgbears-live/stream.env
          Environment=FGB_YOUTUBE_DYNAMIC_CARD_PORT=2942
          ExecStart=
          ExecStart=/usr/bin/python3 /opt/fgbears-live/bin/youtube-stream-router-dynamic.py
          DROPIN
          printf '%s\n' '[Service]' 'Environment=YOUTUBE_RELAY_SERVICE=fgbears-youtube-router.service' | sudo tee "$HEALTH_DROPIN" >/dev/null
          sudo systemctl daemon-reload

          # One controlled handoff. The master and Rumble services never stop.
          sudo systemctl stop "$DIRECT"
          sudo systemctl disable "$DIRECT" >/dev/null 2>&1 || true
          sudo systemctl reset-failed "$ROUTER" >/dev/null 2>&1 || true
          sudo systemctl enable "$ROUTER" >/dev/null
          sudo systemctl start "$ROUTER"

          connected=0
          router_pid=0
          ff=0
          for _ in $(seq 1 55); do
            if active "$ROUTER"; then
              router_pid=$(pid "$ROUTER")
              if [[ "$router_pid" =~ ^[1-9][0-9]*$ ]]; then
                ff=$(pgrep -P "$router_pid" ffmpeg | head -n1 || true)
                if [[ "$ff" =~ ^[1-9][0-9]*$ ]] && rtmps_for_pid "$ff"; then
                  connected=1
                  break
                fi
              fi
            fi
            sleep 1
          done
          (( connected == 1 ))
          active "$DYNAMIC"
          active "$ROUTER"
          ! active "$DIRECT"
          test "$(pid "$MASTER")" = "$master0"
          test "$(pid "$RUMBLE")" = "$rumble0"

          # Confirm the selected-output transport is video-copy plus the locked
          # 44.1kHz/128k asynchronous AAC repair. Do not print the command line
          # because it contains the YouTube destination credential.
          cmd=$(tr '\0' ' ' <"/proc/$ff/cmdline")
          [[ "$cmd" == *'-c:v copy'* ]]
          [[ "$cmd" == *'-c:a aac'* ]]
          [[ "$cmd" == *'-b:a 128k'* ]]
          [[ "$cmd" == *'-ar 44100'* ]]
          [[ "$cmd" == *'aresample=44100:async=1:first_pts=0'* ]]

          success=1
          trap - EXIT
          echo "MASTER_PID_UNCHANGED=$(pid "$MASTER")"
          echo "RUMBLE_PID_UNCHANGED=$(pid "$RUMBLE")"
          echo "YOUTUBE_DYNAMIC_ROUTER_PID=$router_pid"
          echo 'YOUTUBE_RTMPS_ESTABLISHED=yes'
          echo 'YOUTUBE_OUTPUT_CANVAS=1280x720'
          echo 'PROTECTED_BRANCH_FPS=10'
          echo 'RSS_NEWS_DURING_TRIVIA=live'
          echo 'TRIVIA_CRAWL_DURING_TRIVIA=live'
          echo 'TRIVIA_QUESTION_REGION=concealed_by_exact_card'
          echo 'YOUTUBE_AUDIO_REPAIR=44100_stereo_aac128_async'
          echo 'ACTIVATE_YOUTUBE_DYNAMIC_PROTECTION=PASS'
          REMOTE
