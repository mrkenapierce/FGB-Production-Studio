name: Verify Recovered Production

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Verify and repair only missing transport
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service

          systemctl is-active --quiet "$MASTER"
          curl -fsS --max-time 2 http://127.0.0.1:8788/healthz >/dev/null
          curl -fsS --max-time 2 http://127.0.0.1:8789/healthz >/dev/null
          systemctl is-active --quiet "$COMP"
          systemctl is-active --quiet "$ROUTING"

          has_port() { sudo ss -ntpH state established 2>/dev/null | grep -q ":$1 "; }
          if ! has_port 1935; then
            sudo systemctl reset-failed "$RUMBLE" || true
            sudo systemctl restart "$RUMBLE"
            for _ in $(seq 1 20); do has_port 1935 && break; sleep 1; done
          fi
          if ! has_port 443; then
            sudo systemctl restart "$COMP"
            for _ in $(seq 1 20); do has_port 443 && break; sleep 1; done
          fi

          has_port 1935
          has_port 443
          systemctl is-active --quiet "$RUMBLE"

          echo "MASTER=active pid=$(systemctl show -p MainPID --value "$MASTER")"
          echo "RUMBLE=active pid=$(systemctl show -p MainPID --value "$RUMBLE")"
          echo "YOUTUBE=active pid=$(systemctl show -p MainPID --value "$COMP")"
          echo "CRAWL=$(curl -fsS --max-time 2 http://127.0.0.1:8788/healthz)"
          echo "RSS=$(curl -fsS --max-time 2 http://127.0.0.1:8789/healthz)"
          echo "PROGRESS=$(tail -20 /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null | tr '\n' ' ')"
          echo 'RECOVERED_PRODUCTION=PASS'
          REMOTE
