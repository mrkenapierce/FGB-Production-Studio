name: Activate YouTube Thin Overlay

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-youtube-cutover
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Cut YouTube to one thin overlay sender
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          DIRECT=fgbears-youtube-relay.service
          ROUTER=fgbears-youtube-router.service
          DYNAMIC=fgbears-youtube-dynamic-card.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service
          WATCHDOG=fgbears-youtube-audio-watchdog.timer
          HEALTH_DROPIN=/etc/systemd/system/fgbears-live-health.service.d/99-youtube-dynamic-router.conf
          MONITOR_DIR=/run/fgbears-youtube-lovable-compositor
          PROBE=/tmp/fgb-thin-cutover-$$.ts

          active() { systemctl is-active --quiet "$1"; }
          mainpid() { systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          ffpid() {
            local p
            p=$(mainpid "$1")
            [[ "$p" =~ ^[1-9][0-9]*$ ]] || return 1
            if [[ "$(cat /proc/$p/comm 2>/dev/null || true)" == ffmpeg ]]; then echo "$p"; else pgrep -P "$p" -x ffmpeg 2>/dev/null | sed -n '1p'; fi
          }
          has_port() {
            local p="$1" port="$2"
            sudo ss -ntpH state established 2>/dev/null | awk -v q="pid=$p" -v r=":$port" 'index($0,q)&&index($0,r){x=1} END{exit(x?0:1)}'
          }
          yt_comp_connected() { local p; p=$(ffpid "$COMP" || true); [[ "$p" =~ ^[1-9][0-9]*$ ]] && has_port "$p" 443; }
          yt_router_connected() { local p; p=$(ffpid "$ROUTER" || true); [[ "$p" =~ ^[1-9][0-9]*$ ]] && has_port "$p" 443; }
          rumble_connected() { local p; p=$(ffpid "$RUMBLE" || true); [[ "$p" =~ ^[1-9][0-9]*$ ]] && has_port "$p" 1935; }

          active "$MASTER"
          active "$RUMBLE"
          active "$COMP"
          active "$ROUTING"
          rumble_connected
          master0=$(mainpid "$MASTER")
          rumble0=$(mainpid "$RUMBLE")
          routing0=$(mainpid "$ROUTING")
          echo "PRE master=$master0 rumble=$rumble0 routing=$routing0"

          router_was=0; dynamic_was=0
          active "$ROUTER" && router_was=1 || true
          active "$DYNAMIC" && dynamic_was=1 || true
          if (( router_was == 1 )); then yt_router_connected; fi

          done_ok=0
          started=0
          rollback() {
            rc=$?
            sudo rm -f "$PROBE" >/dev/null 2>&1 || true
            if (( done_ok == 1 )); then return 0; fi
            if (( started == 1 )); then
              echo 'ROLLBACK=START'
              sudo systemctl stop "$COMP" >/dev/null 2>&1 || true
              if (( dynamic_was == 1 )); then sudo systemctl enable --now "$DYNAMIC" >/dev/null 2>&1 || true; fi
              if (( router_was == 1 )); then
                sudo systemctl enable "$ROUTER" >/dev/null 2>&1 || true
                sudo systemctl reset-failed "$ROUTER" >/dev/null 2>&1 || true
                sudo systemctl start "$ROUTER" >/dev/null 2>&1 || true
                for _ in $(seq 1 40); do yt_router_connected && break; sleep 1; done
              fi
              sudo systemctl start "$COMP" >/dev/null 2>&1 || true
              echo 'ROLLBACK=COMPLETE'
            fi
            exit "$rc"
          }
          trap rollback EXIT

          started=1
          sudo systemctl stop "$ROUTER" >/dev/null 2>&1 || true
          sudo systemctl stop "$DYNAMIC" >/dev/null 2>&1 || true
          echo 'OLD_YOUTUBE_PATH=STOPPED'

          claimed=0
          for _ in $(seq 1 18); do yt_comp_connected && { claimed=1; break; }; sleep 1; done
          if (( claimed == 0 )); then
            sudo systemctl restart "$COMP"
            for _ in $(seq 1 35); do yt_comp_connected && { claimed=1; break; }; sleep 1; done
          fi
          (( claimed == 1 ))
          echo 'YOUTUBE_RTMPS_THIN_COMPOSITOR=PASS'

          [[ "$(mainpid "$MASTER")" == "$master0" ]]
          [[ "$(mainpid "$RUMBLE")" == "$rumble0" ]]
          [[ "$(mainpid "$ROUTING")" == "$routing0" ]]
          rumble_connected
          echo 'MASTER_RUMBLE_PRESERVED=PASS'

          src=''
          for _ in $(seq 1 15); do
            src=$(sudo find "$MONITOR_DIR" -maxdepth 1 -type f -name 'monitor-*.ts' -size +50000 -printf '%T@ %p\n' 2>/dev/null | sort -nr | awk 'NR==2{sub(/^[^ ]+ /,"");print;exit}')
            [[ -n "$src" ]] && break
            sleep 1
          done
          [[ -n "$src" ]]
          sudo cp -f "$src" "$PROBE"
          sudo chmod 0644 "$PROBE"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json "$PROBE" | python3 -c 'import json,sys;p=json.load(sys.stdin);s=p.get("streams",[]);v=next(x for x in s if x.get("codec_type")=="video");a=next(x for x in s if x.get("codec_type")=="audio");assert v.get("codec_name")=="h264" and v.get("width")==640 and v.get("height")==360 and v.get("r_frame_rate") in ("30/1","60/2"),v;assert a.get("codec_name")=="aac" and a.get("sample_rate")=="44100" and a.get("channels")==2,a;print("YOUTUBE_AV_CONTRACT=PASS")'

          sudo systemctl disable "$ROUTER" "$DYNAMIC" "$DIRECT" >/dev/null 2>&1 || true
          sudo systemctl disable --now "$WATCHDOG" >/dev/null 2>&1 || true
          sudo systemctl enable "$COMP" "$ROUTING" >/dev/null 2>&1 || true
          sudo install -d -m 0755 /etc/systemd/system/fgbears-live-health.service.d
          printf '%s\n' '[Service]' 'Environment=YOUTUBE_RELAY_SERVICE=fgbears-youtube-lovable-compositor.service' | sudo tee "$HEALTH_DROPIN" >/dev/null
          sudo systemctl daemon-reload

          sleep 8
          yt_comp_connected
          [[ "$(mainpid "$MASTER")" == "$master0" ]]
          [[ "$(mainpid "$RUMBLE")" == "$rumble0" ]]
          rumble_connected
          ! active "$ROUTER"
          ! active "$DYNAMIC"
          echo "POST compositor=$(mainpid "$COMP") cpu=$(ps -p "$(mainpid "$COMP")" -o %cpu= | tr -d ' ') load=$(cut -d' ' -f1-3 /proc/loadavg)"
          echo 'YOUTUBE_SINGLE_SENDER=thin_lovable_compositor'
          echo 'YOUTUBE_AUDIO_REPAIR=aac_44100_stereo_async'
          echo 'RUMBLE=unchanged_copy_remux'
          echo 'ACTIVATE_YOUTUBE_THIN_OVERLAY=PASS'

          done_ok=1
          trap - EXIT
          sudo rm -f "$PROBE" >/dev/null 2>&1 || true
          REMOTE
