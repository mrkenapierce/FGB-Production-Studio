name: Audit Production Tickers And YouTube Transport - Manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production audit
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service
          LEGACY=fgbears-youtube-relay.service
          ROUTER=fgbears-youtube-router.service
          MONDIR=/run/fgbears-youtube-lovable-compositor
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          restarts(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          speed(){ awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true; }
          has443(){ local p=$1; ss -ntpH state established 2>/dev/null | awk -v p="pid=$p" 'index($0,p)&&index($0,":443"){ok=1} END{exit(ok?0:1)}'; }

          systemctl is-active --quiet "$MASTER"
          systemctl is-active --quiet "$RUMBLE"
          systemctl is-active --quiet "$COMP"
          systemctl is-active --quiet "$ROUTING"
          MPID=$(pid "$MASTER"); RPID=$(pid "$RUMBLE"); CPID=$(pid "$COMP")
          has443 "$CPID"
          ! systemctl is-active --quiet "$LEGACY"
          ! systemctl is-active --quiet "$ROUTER"
          SPEED=$(speed)
          [[ -z "$SPEED" ]] || python3 -c 'import sys;assert float(sys.argv[1])>=0.985' "$SPEED"
          echo "TOPOLOGY=PASS master=$MPID rumble=$RPID compositor=$CPID master_restarts=$(restarts "$MASTER") speed=${SPEED:-unknown}x"

          NEWS=$(curl -fsS --max-time 3 http://127.0.0.1:8789/healthz)
          CRAWL=$(curl -fsS --max-time 3 http://127.0.0.1:8788/healthz)
          printf '%s' "$NEWS" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True;assert int(p.get("fps",0))==30;assert p.get("payloadSwap")=="next-cycle-boundary";assert int(p.get("scrollPps",0))==76;print("RSS=PASS fps=30 pps=76 swap=cycle-boundary")'
          printf '%s' "$CRAWL" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True;assert int(p.get("fps",0))==30;assert p.get("payloadSwap")=="next-segment-boundary";print("CRAWL=PASS fps=30 swap=segment-boundary count=%s"%p.get("messageCount"))'
          pgrep -af 'bears-news-feed-hq.py' >/dev/null
          pgrep -af 'crawl-overlay-hq.py' >/dev/null

          /usr/local/bin/fgbears-audio-health --capture-seconds 8 2>&1 | tee /tmp/source-audio-health.log
          grep -q '^OVERALL_STATUS=OK$' /tmp/source-audio-health.log
          grep -q '^audio_sample_rate=48000$' /tmp/source-audio-health.log
          grep -q '^audio_channels=2$' /tmp/source-audio-health.log
          echo 'SOURCE_AUDIO=PASS mastered_source_48k_stereo_clean'

          SEG=$(find "$MONDIR" -maxdepth 1 -type f -name 'monitor-*.ts' -printf '%T@ %p\n' 2>/dev/null | sort -nr | sed -n '2{s/^[^ ]* //;p;q;}')
          [[ -n "$SEG" && -s "$SEG" ]]
          ffprobe -v fatal -show_entries stream=index,codec_type,codec_name,sample_rate,channels,width,height,r_frame_rate -of json "$SEG" > /tmp/fgb-monitor-probe.json
          python3 -c 'import json;p=json.load(open("/tmp/fgb-monitor-probe.json"));a=[s for s in p["streams"] if s.get("codec_type")=="audio"];v=[s for s in p["streams"] if s.get("codec_type")=="video"];assert a and v;assert a[0].get("codec_name")=="aac";assert str(a[0].get("sample_rate"))=="48000";assert int(a[0].get("channels") or 0)==2;assert v[0].get("width")==640 and v[0].get("height")==360 and v[0].get("r_frame_rate")=="30/1";print("YOUTUBE_AV=PASS 640x360/30 AAC48k-stereo")'

          FAULTS=$(journalctl _PID="$CPID" --since '75 seconds ago' --no-pager 2>/dev/null | grep -Eci 'Circular buffer overrun|timestamp discontinuity|Packet corrupt|Non-monotonous DTS|Invalid DTS|Queue input is backward in time' || true)
          (( FAULTS == 0 ))
          echo "YOUTUBE_TRANSPORT=PASS recent_faults=$FAULTS"

          grep -Eq '^state=(OK|WARN)$' /srv/fgbears-live/health/youtube-audio/status.env
          grep -q '^owner=exact_box_compositor$' /srv/fgbears-live/health/youtube-audio/status.env
          grep -q '^youtube_audio_rate=48000$' /srv/fgbears-live/health/youtube-audio/status.env
          grep -q '^recent_transport_faults=0$' /srv/fgbears-live/health/youtube-audio/status.env
          echo 'WATCHDOG=PASS owner-aware native48k transport-aware'

          echo "PRODUCTION_AUDIT=PASS master=$(pid "$MASTER") rumble=$(pid "$RUMBLE") compositor=$(pid "$COMP") speed=$(speed)x"
          REMOTE
