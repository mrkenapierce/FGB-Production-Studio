name: Audit Live Tickers And YouTube Audio

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lovable-routing-bridge-20260902

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production audit
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service
          LEGACY=fgbears-youtube-relay.service
          ROUTER=fgbears-youtube-router.service
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          restarts(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          speed(){ awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true; }
          has443(){ local p=$1; ss -ntpH state established 2>/dev/null | awk -v p="pid=$p" 'index($0,p)&&index($0,":443"){ok=1} END{exit(ok?0:1)}'; }

          systemctl is-active --quiet "$MASTER"
          systemctl is-active --quiet "$RUMBLE"
          systemctl is-active --quiet "$COMP"
          systemctl is-active --quiet "$ROUTING"
          MPID=$(pid "$MASTER"); RPID=$(pid "$RUMBLE"); CPID=$(pid "$COMP")
          has443 "$CPID"
          ! systemctl is-active --quiet "$LEGACY"
          ! systemctl is-active --quiet "$ROUTER"
          echo "TOPOLOGY=PASS master=$MPID rumble=$RPID compositor=$CPID master_restarts=$(restarts "$MASTER") speed=$(speed)x"

          NEWS=$(curl -fsS --max-time 3 http://127.0.0.1:8789/healthz)
          CRAWL=$(curl -fsS --max-time 3 http://127.0.0.1:8788/healthz)
          printf '%s' "$NEWS" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True;assert int(p.get("fps",0))==30;assert p.get("payloadSwap")=="next-cycle-boundary";assert int(p.get("scrollPps",0))==76;print("RSS_CONTRACT=PASS fps=30 pps=76 swap=next-cycle-boundary pendingChars=%s"%p.get("pendingChars"))'
          printf '%s' "$CRAWL" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True;assert int(p.get("fps",0))==30;assert p.get("payloadSwap")=="next-segment-boundary";print("CRAWL_CONTRACT=PASS fps=30 swap=next-segment-boundary count=%s pending=%s"%(p.get("messageCount"),p.get("pendingCount")))'
          pgrep -af 'bears-news-feed-hq.py' >/dev/null
          pgrep -af 'crawl-overlay-hq.py' >/dev/null
          echo 'TICKER_PROCESSES=PASS hq_renderers_active'

          if [[ -x /usr/local/bin/fgbears-audio-health ]]; then
            set +e
            SOURCE_AUDIO=$(/usr/local/bin/fgbears-audio-health --capture-seconds 8 2>&1)
            SOURCE_RC=$?
            set -e
            printf '%s\n' "$SOURCE_AUDIO"
            echo "SOURCE_AUDIO_RC=$SOURCE_RC"
          else
            echo 'SOURCE_AUDIO_HEALTH=UNAVAILABLE'
            SOURCE_RC=99
          fi

          MONDIR=/run/fgbears-youtube-lovable-compositor
          SEG=$(find "$MONDIR" -maxdepth 1 -type f -name 'monitor-*.ts' -printf '%T@ %p\n' 2>/dev/null | sort -nr | sed -n '2{s/^[^ ]* //;p;q;}')
          [[ -n "$SEG" && -s "$SEG" ]]
          echo "MONITOR_SEGMENT=$SEG"
          ffprobe -v fatal -show_entries stream=index,codec_type,codec_name,sample_rate,channels,width,height,r_frame_rate -of json "$SEG" > /tmp/fgb-monitor-probe.json
          cat /tmp/fgb-monitor-probe.json
          python3 -c 'import json;p=json.load(open("/tmp/fgb-monitor-probe.json"));a=[s for s in p["streams"] if s.get("codec_type")=="audio"];v=[s for s in p["streams"] if s.get("codec_type")=="video"];assert a and v;print("OUTPUT_AUDIO_FORMAT codec=%s rate=%s channels=%s"%(a[0].get("codec_name"),a[0].get("sample_rate"),a[0].get("channels")));print("OUTPUT_VIDEO_FORMAT %sx%s fps=%s"%(v[0].get("width"),v[0].get("height"),v[0].get("r_frame_rate")))'
          ffmpeg -hide_banner -nostdin -v info -i "$SEG" -map 0:a:0 -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' || true
          ffmpeg -hide_banner -nostdin -v info -i "$SEG" -map 0:a:0 -af silencedetect=noise=-50dB:d=0.8 -f null - 2>&1 | grep -E 'silence_start|silence_end|silence_duration' || true

          echo 'WATCHDOG_STATUS:'
          cat /srv/fgbears-live/health/youtube-audio/status.env 2>/dev/null || true
          echo 'WATCHDOG_WARNING:'
          cat /srv/fgbears-live/health/youtube-audio/warning.env 2>/dev/null || true
          echo 'COMPOSITOR_RECENT_WARNINGS:'
          journalctl -u "$COMP" --since '15 minutes ago' --no-pager 2>/dev/null | grep -Ei 'audio|aac|timestamp|dts|pts|queue|drop|buffer|error|warning|broken|reset' | tail -80 || true

          echo "FINAL master=$(pid "$MASTER") rumble=$(pid "$RUMBLE") compositor=$(pid "$COMP") speed=$(speed)x"
          echo 'LIVE_TICKER_AUDIO_AUDIT=COMPLETE'
          REMOTE
