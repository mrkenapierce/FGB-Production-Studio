name: Promote YouTube Compositor To Native 720p

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lovable-routing-bridge-20260902

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Stage native 720p compositor and latched question mask
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          scp -i ~/.ssh/oracle_key \
            services/fgbears-live/bin/youtube-lovable-compositor.sh \
            services/fgbears-live/bin/youtube-question-mask.py \
            services/fgbears-live/systemd/fgbears-youtube-lovable-compositor.service \
            services/fgbears-live/systemd/fgbears-youtube-lovable-routing.service \
            .github/scripts/cutover-youtube-720p.sh \
            "$target:/tmp/"

      - name: Promote existing compositor and certify actual A/V
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" \
            'sudo bash /tmp/cutover-youtube-720p.sh'
