name: Benchmark YouTube 720p Capacity

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Inspect live compositor and benchmark 720p at lowest priority
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/oracle_key "${ORACLE_USER:-ubuntu}@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service
          PROGRESS=/srv/fgbears-live/logs/ffmpeg-progress.log

          for u in "$MASTER" "$RUMBLE" "$COMP" "$ROUTING"; do systemctl is-active --quiet "$u"; done
          sudo ss -ntpH state established | grep ':1935 ' >/dev/null
          sudo ss -ntpH state established | grep ':443 ' >/dev/null

          echo '---HOST---'
          nproc
          lscpu | grep -E '^(CPU\(s\)|Model name|Thread|Core|Socket|CPU max MHz)' || true
          echo "LOAD=$(cut -d' ' -f1-3 /proc/loadavg)"
          echo '---COMPOSITOR UNIT---'
          systemctl cat "$COMP"
          echo '---ROUTING UNIT---'
          systemctl cat "$ROUTING"
          echo '---LIVE PROCESSES---'
          ps -eo pid,ppid,pcpu,pmem,ni,comm,args --sort=-pcpu | head -20

          speed_now() {
            if [[ -s "$PROGRESS" ]]; then
              awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' "$PROGRESS"
            fi
          }
          BEFORE=$(speed_now || true)
          echo "MASTER_SPEED_BEFORE=${BEFORE:-unknown}"
          if [[ -n "${BEFORE:-}" ]]; then
            python3 - "$BEFORE" <<'PY'
import sys
s=float(sys.argv[1]); assert s >= 0.98, s
PY
          fi

          rm -f /tmp/fgb-720p-bench.log
          # Lowest-priority, six-second encoder-only stress test. It cannot open
          # YouTube/Rumble sockets and cannot alter any systemd service.
          nice -n 19 ffmpeg -hide_banner -nostdin -loglevel info \
            -f lavfi -i 'color=c=black:s=1280x720:r=30' -t 6 \
            -c:v libx264 -preset ultrafast -tune zerolatency -profile:v high \
            -b:v 5000k -maxrate 5500k -bufsize 10000k \
            -g 60 -keyint_min 60 -sc_threshold 0 -r 30 -threads 1 \
            -an -f null - 2>/tmp/fgb-720p-bench.log

          BENCH=$(grep -oE 'speed=[[:space:]]*[0-9.]+x' /tmp/fgb-720p-bench.log | tail -1 | sed -E 's/.*= *([0-9.]+)x/\1/')
          [[ -n "$BENCH" ]]
          echo "BENCH_720P_SPEED=${BENCH}x"
          sleep 3
          AFTER=$(speed_now || true)
          echo "MASTER_SPEED_AFTER=${AFTER:-unknown}"
          if [[ -n "${AFTER:-}" ]]; then
            python3 - "$AFTER" <<'PY'
import sys
s=float(sys.argv[1]); assert s >= 0.98, s
PY
          fi
          python3 - "$BENCH" <<'PY'
import sys
s=float(sys.argv[1])
assert s >= 1.50, s
print(f'720P_CAPACITY=PASS speed={s:.2f}x')
PY

          for u in "$MASTER" "$RUMBLE" "$COMP" "$ROUTING"; do systemctl is-active --quiet "$u"; done
          sudo ss -ntpH state established | grep ':1935 ' >/dev/null
          sudo ss -ntpH state established | grep ':443 ' >/dev/null
          echo "LOAD_AFTER=$(cut -d' ' -f1-3 /proc/loadavg)"
          echo 'PLATFORM_TRANSPORTS=PASS'
          REMOTE
