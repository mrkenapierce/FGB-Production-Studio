name: Audit Rumble Restart and YouTube State

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production audit
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          units=(fgbears-live.service fgbears-rumble-relay.service fgbears-youtube-lovable-compositor.service fgbears-youtube-lovable-routing.service fgbears-youtube-relay.service fgbears-youtube-router.service)
          echo 'SERVICE_STATE'
          for u in "${units[@]}"; do
            echo "--- $u"
            systemctl show "$u" -p ActiveState -p SubState -p MainPID -p NRestarts -p ExecMainStatus -p Result -p Restart -p RestartUSec -p ActiveEnterTimestamp --no-pager 2>/dev/null || true
          done

          echo 'RUMBLE_RELATIONSHIPS'
          systemctl show fgbears-rumble-relay.service -p Requires -p Wants -p BindsTo -p PartOf -p ConsistsOf -p Before -p After -p TriggeredBy -p Triggers --no-pager || true

          echo 'RUMBLE_UNIT'
          systemctl cat fgbears-rumble-relay.service 2>/dev/null | sed -E 's#(rtmps?://[^/]+/[^/]+/)[^ ]+#\1[REDACTED]#g; s#(YOUTUBE_STREAM_KEY|RUMBLE_STREAM_KEY)=.*#\1=[REDACTED]#g' || true

          echo 'FGB_TIMERS'
          systemctl list-timers --all --no-pager | grep -Ei 'fgb|rumble|youtube|rss|crawl' || true

          echo 'RECENT_RUMBLE_EVENTS'
          journalctl -u fgbears-rumble-relay.service --since '15 minutes ago' --no-pager -o short-iso 2>/dev/null \
            | grep -Ei 'Started|Stopped|Stopping|Failed|Main process exited|Scheduled restart|restart counter|Connection|Broken pipe|Input/output|error|signal|code=' \
            | sed -E 's#(rtmps?://[^/]+/[^/]+/)[^ ]+#\1[REDACTED]#g; s#([A-Za-z0-9_-]{20,})#[REDACTED]#g' \
            | tail -120 || true

          echo 'RECENT_YOUTUBE_EVENTS'
          for u in fgbears-youtube-lovable-compositor.service fgbears-youtube-relay.service; do
            echo "--- $u"
            journalctl -u "$u" --since '15 minutes ago' --no-pager -o short-iso 2>/dev/null \
              | grep -Ei 'Started|Stopped|Stopping|Failed|Main process exited|Scheduled restart|restart counter|Connection|Broken pipe|Input/output|error|signal|code=' \
              | sed -E 's#(rtmps?://[^/]+/[^/]+/)[^ ]+#\1[REDACTED]#g; s#([A-Za-z0-9_-]{20,})#[REDACTED]#g' \
              | tail -80 || true
          done

          echo 'RESOURCE_STATE'
          printf 'load='; cut -d' ' -f1-3 /proc/loadavg
          free -m
          df -h / /run /srv 2>/dev/null || true
          echo 'TOP_CPU'
          ps -eo pid,ppid,%cpu,%mem,etime,comm,args --sort=-%cpu | head -20 | sed -E 's#(rtmps?://[^/]+/[^/]+/)[^ ]+#\1[REDACTED]#g' || true

          echo 'KERNEL_OOM'
          journalctl -k --since '15 minutes ago' --no-pager 2>/dev/null | grep -Ei 'oom|out of memory|killed process' | tail -40 || true

          echo 'SOCKET_OWNERS'
          ss -ntpH state established 2>/dev/null | grep -E ':443|:1935' | sed -E 's#users:\(\("[^\"]+",pid=([0-9]+),fd=[0-9]+\)\)#pid=\1#g' || true

          echo 'MASTER_SPEED'
          awk -F= '$1=="speed"{v=$2} END{print v}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true
          echo 'AUDIT_COMPLETE=PASS'
          REMOTE
