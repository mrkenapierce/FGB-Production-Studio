name: Deploy Owner-Aware Exact-Box YouTube Owner

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lovable-routing-bridge-20260902

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Stage owner-aware watchdog and bounded compositor unit
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          scp -i ~/.ssh/oracle_key \
            services/fgbears-live/bin/youtube-audio-watchdog-owner-aware.sh \
            services/fgbears-live/systemd/fgbears-youtube-lovable-compositor.service \
            "$target:/tmp/"

      - name: Deploy and hand YouTube to one exact-box owner
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail

          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service
          LEGACY=fgbears-youtube-relay.service
          ROUTER=fgbears-youtube-router.service
          WATCHDOG_TIMER=fgbears-youtube-audio-watchdog.timer
          WATCHDOG_SERVICE=fgbears-youtube-audio-watchdog.service
          WATCHDOG=/usr/local/bin/fgbears-youtube-audio-watchdog
          LEGACY_WATCHDOG=/usr/local/libexec/fgbears-youtube-audio-watchdog-legacy
          COMP_UNIT=/etc/systemd/system/fgbears-youtube-lovable-compositor.service
          SUCCESS=0
          CUT=0

          active(){ systemctl is-active --quiet "$1"; }
          state(){ systemctl is-active "$1" 2>/dev/null || true; }
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          restarts(){ systemctl show -p NRestarts --value "$1" 2>/dev/null || echo 0; }
          has_port(){ local p="$1" q="$2"; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v p="pid=$p" -v q=":$q" 'index($0,p)&&index($0,q){ok=1} END{exit(ok?0:1)}'; }
          speed(){ awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true; }
          stop_comp_fast(){
            active "$COMP" || return 0
            systemctl kill --kill-who=all --signal=SIGINT "$COMP" 2>/dev/null || true
            for _ in {1..8}; do active "$COMP" || return 0; sleep 0.5; done
            systemctl kill --kill-who=all --signal=SIGKILL "$COMP" 2>/dev/null || true
            for _ in {1..8}; do active "$COMP" || return 0; sleep 0.5; done
            systemctl stop "$COMP" 2>/dev/null || true
          }

          rollback(){
            rc=$?
            (( SUCCESS == 0 )) || return 0
            echo "OWNER_AWARE_ROLLBACK=BEGIN rc=$rc cut=$CUT"
            stop_comp_fast || true
            systemctl unmask "$LEGACY" >/dev/null 2>&1 || true
            systemctl enable "$LEGACY" >/dev/null 2>&1 || true
            systemctl reset-failed "$LEGACY" >/dev/null 2>&1 || true
            systemctl start "$LEGACY" 2>/dev/null || true
            for _ in $(seq 1 25); do
              lp=$(pid "$LEGACY")
              if active "$LEGACY" && has_port "$lp" 443; then
                echo "OWNER_AWARE_ROLLBACK=LEGACY_RESTORED pid=$lp"
                break
              fi
              sleep 1
            done
            systemctl start "$WATCHDOG_TIMER" 2>/dev/null || true
            echo "ROLLBACK master=$(pid "$MASTER") rumble=$(pid "$RUMBLE") legacy=$(pid "$LEGACY") compositor=$(pid "$COMP")"
            rm -f /tmp/youtube-audio-watchdog-owner-aware.sh /tmp/fgbears-youtube-lovable-compositor.service
            exit "$rc"
          }
          trap rollback EXIT

          active "$MASTER"
          active "$RUMBLE"
          MASTER0=$(pid "$MASTER")
          MASTER_R0=$(restarts "$MASTER")
          RUMBLE0=$(pid "$RUMBLE")
          RUMBLE_R0=$(restarts "$RUMBLE")
          has_port "$RUMBLE0" 1935
          echo "PRE master=$MASTER0 master_restarts=$MASTER_R0 rumble=$RUMBLE0 rumble_restarts=$RUMBLE_R0 legacy=$(pid "$LEGACY") compositor=$(pid "$COMP") speed=$(speed)"

          # Freeze the old one-minute watchdog while changing ownership.
          systemctl stop "$WATCHDOG_TIMER"
          if active "$WATCHDOG_SERVICE"; then
            systemctl stop "$WATCHDOG_SERVICE" || true
          fi

          # Preserve the proven legacy watchdog exactly once. Never overwrite
          # this fallback copy with the new owner-aware wrapper.
          install -d -m 0755 /usr/local/libexec
          if [[ ! -f "$LEGACY_WATCHDOG" ]]; then
            grep -q 'canonical_relay_process' "$WATCHDOG"
            grep -q 'attempt_repair' "$WATCHDOG"
            cp -a "$WATCHDOG" "$LEGACY_WATCHDOG"
            chmod 0755 "$LEGACY_WATCHDOG"
          fi
          grep -q 'canonical_relay_process' "$LEGACY_WATCHDOG"
          grep -q 'attempt_repair' "$LEGACY_WATCHDOG"
          ! grep -q 'exact_box_health_ok' "$LEGACY_WATCHDOG"
          echo "LEGACY_WATCHDOG_BACKUP=PASS"

          bash -n /tmp/youtube-audio-watchdog-owner-aware.sh
          install -m 0755 /tmp/youtube-audio-watchdog-owner-aware.sh "$WATCHDOG"
          grep -q 'exact_box_health_ok' "$WATCHDOG"
          grep -q 'fallback_to_legacy' "$WATCHDOG"
          echo "OWNER_AWARE_WATCHDOG_INSTALLED=PASS"

          # Bound compositor shutdown so failover cannot leave a stale sender.
          install -m 0644 /tmp/fgbears-youtube-lovable-compositor.service "$COMP_UNIT"
          systemctl daemon-reload
          systemctl reset-failed "$COMP" >/dev/null 2>&1 || true
          echo "COMPOSITOR_STOP_BOUND=PASS timeout=$(systemctl show -p TimeoutStopUSec --value "$COMP") signal=$(systemctl show -p KillSignal --value "$COMP")"

          # Prove the new wrapper preserves today's healthy fallback state before
          # the production sender is changed.
          "$WATCHDOG"
          active "$LEGACY"
          LEGACY_TEST=$(pid "$LEGACY")
          has_port "$LEGACY_TEST" 443
          [[ "$(pid "$MASTER")" == "$MASTER0" ]]
          [[ "$(restarts "$MASTER")" == "$MASTER_R0" ]]
          active "$RUMBLE"
          has_port "$(pid "$RUMBLE")" 1935
          echo "OWNER_AWARE_FALLBACK_TEST=PASS legacy=$LEGACY_TEST"

          # The Lovable routing plane must describe the exact question box before
          # the legacy YouTube owner is cut.
          active "$ROUTING"
          health=$(curl -fsS --max-time 3 http://127.0.0.1:8791/healthz)
          printf '%s' "$health" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True,p;assert p.get("sourceCanvas")==[1280,720],p;assert p.get("canvas")==[640,360],p;assert p.get("sourceMaskRegion")=={"x":462,"y":104,"width":798,"height":470},p;assert p.get("maskRegion")=={"x":231,"y":52,"width":399,"height":235},p;assert p.get("frameSize")==[399,235],p;assert p.get("executionScaling")=="proportional_downstream",p;assert p.get("fps")==30,p;assert p.get("creativeKey")=="yt_rumble_trivia_redirect",p'
          echo "EXACT_BOX_CONTROL_PLANE=PASS"

          # YouTube-only handoff. The master and Rumble are not restarted.
          stop_comp_fast || true
          systemctl stop "$ROUTER" 2>/dev/null || true
          systemctl stop "$LEGACY"
          CUT=1
          systemctl reset-failed "$COMP" >/dev/null 2>&1 || true
          systemctl enable "$COMP" "$ROUTING" >/dev/null 2>&1 || true
          systemctl start "$COMP"

          CONNECTED=0
          COMP1=0
          for _ in $(seq 1 40); do
            COMP1=$(pid "$COMP")
            if active "$COMP" && has_port "$COMP1" 443; then
              CONNECTED=1
              break
            fi
            sleep 1
          done
          (( CONNECTED == 1 ))
          echo "EXACT_BOX_YOUTUBE_CONNECTED=PASS compositor=$COMP1"

          # Once primary ownership is proven, make the old relay fallback-only.
          systemctl disable "$LEGACY" >/dev/null 2>&1 || true
          systemctl stop "$LEGACY" 2>/dev/null || true
          systemctl disable "$ROUTER" >/dev/null 2>&1 || true
          systemctl mask "$ROUTER" >/dev/null 2>&1 || true

          cmd=$(tr '\0' ' ' </proc/$COMP1/cmdline)
          grep -Fq 'scale=640:360:flags=fast_bilinear' <<<"$cmd"
          grep -Fq 'overlay=231:52:format=auto:shortest=1' <<<"$cmd"
          grep -Fq ' -c:v libx264 ' <<<"$cmd"
          grep -Fq ' -c:a aac ' <<<"$cmd"
          grep -Fq ' -b:a 128k ' <<<"$cmd"
          grep -Fq ' -ar 44100 ' <<<"$cmd"
          grep -Fq ' -ac 2 ' <<<"$cmd"
          grep -Fq 'aresample=44100:async=1:first_pts=0' <<<"$cmd"
          echo "EXACT_BOX_AUDIO_VIDEO_PIPELINE=PASS"

          # Re-enable watchdog under its new owner-aware policy and force one
          # immediate check. It must not resurrect the legacy sender.
          systemctl start "$WATCHDOG_TIMER"
          systemctl start "$WATCHDOG_SERVICE"
          active "$COMP"
          [[ "$(pid "$COMP")" == "$COMP1" ]]
          ! active "$LEGACY"
          has_port "$COMP1" 443
          grep -q '^owner=exact_box_compositor$' /srv/fgbears-live/health/youtube-audio/status.env
          grep -Eq '^state=(OK|WARN)$' /srv/fgbears-live/health/youtube-audio/status.env
          echo "MANUAL_OWNER_AWARE_WATCHDOG=PASS"

          # Hold through a real automatic one-minute watchdog cycle. This is the
          # decisive proof that the previous duplicate-sender race is gone.
          BEFORE_TRIGGER=$(systemctl show "$WATCHDOG_TIMER" -p LastTriggerUSec --value 2>/dev/null || true)
          AUTO_TRIGGERED=0
          for _ in $(seq 1 85); do
            sleep 1
            NOW_TRIGGER=$(systemctl show "$WATCHDOG_TIMER" -p LastTriggerUSec --value 2>/dev/null || true)
            if [[ -n "$NOW_TRIGGER" && "$NOW_TRIGGER" != "$BEFORE_TRIGGER" ]]; then
              AUTO_TRIGGERED=1
              break
            fi
          done
          (( AUTO_TRIGGERED == 1 ))
          # Give the oneshot enough time to finish its audio sample.
          for _ in $(seq 1 20); do
            active "$WATCHDOG_SERVICE" || break
            sleep 1
          done

          COMP2=$(pid "$COMP")
          active "$COMP"
          active "$ROUTING"
          [[ "$COMP2" == "$COMP1" ]]
          has_port "$COMP2" 443
          ! active "$LEGACY"
          ! active "$ROUTER"
          grep -q '^owner=exact_box_compositor$' /srv/fgbears-live/health/youtube-audio/status.env
          grep -Eq '^state=(OK|WARN)$' /srv/fgbears-live/health/youtube-audio/status.env

          # Shared-program invariants. Rumble may independently reconnect to its
          # own RTMP peer; require health/socket, not an identical PID.
          [[ "$(pid "$MASTER")" == "$MASTER0" ]]
          [[ "$(restarts "$MASTER")" == "$MASTER_R0" ]]
          active "$RUMBLE"
          RUMBLE2=$(pid "$RUMBLE")
          has_port "$RUMBLE2" 1935

          SPEED=$(speed)
          CPU=$(ps -p "$COMP2" -o %cpu= | tr -d ' ')
          LOAD=$(cut -d' ' -f1-3 /proc/loadavg)
          python3 -c 'import sys;c=float(sys.argv[1]);assert c<=40.0,c' "$CPU"
          if [[ -n "$SPEED" ]]; then python3 -c 'import sys;s=float(sys.argv[1]);assert s>=0.985,s' "$SPEED"; fi

          SENDERS=0
          active "$COMP" && SENDERS=$((SENDERS+1))
          active "$LEGACY" && SENDERS=$((SENDERS+1))
          active "$ROUTER" && SENDERS=$((SENDERS+1))
          [[ "$SENDERS" -eq 1 ]]

          echo "AUTOMATIC_WATCHDOG_CYCLE=PASS trigger=$NOW_TRIGGER"
          echo "SINGLE_YOUTUBE_SENDER=PASS compositor=$COMP2 legacy=$(state "$LEGACY") router=$(state "$ROUTER")"
          echo "MASTER_UNCHANGED=PASS pid=$MASTER0 restarts=$MASTER_R0 speed=${SPEED:-unknown}x"
          echo "RUMBLE_HEALTHY=PASS pid=$RUMBLE2 restarts=$(restarts "$RUMBLE") socket=1935"
          echo "RESOURCE compositor_cpu=${CPU}% load=$LOAD"
          echo "OWNER_AWARE_EXACT_BOX_DEPLOY=PASS"

          SUCCESS=1
          trap - EXIT
          rm -f /tmp/youtube-audio-watchdog-owner-aware.sh /tmp/fgbears-youtube-lovable-compositor.service
          REMOTE
