name: Audit Exact-Box YouTube Load

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production audit
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'python3 -' <<'PY'
          import json, subprocess, urllib.request

          def sh(cmd):
              return subprocess.check_output(cmd,shell=True,text=True).strip()
          def pid(unit):
              return sh(f"systemctl show -p MainPID --value {unit}")
          def state(unit):
              return sh(f"systemctl is-active {unit} 2>/dev/null || true")
          def connected(process_pid,port):
              raw=sh("ss -ntpH state established 2>/dev/null || true")
              return any(f"pid={process_pid}" in line and f":{port}" in line for line in raw.splitlines())

          units=[
              "fgbears-live.service",
              "fgbears-rumble-relay.service",
              "fgbears-youtube-lovable-compositor.service",
              "fgbears-youtube-lovable-routing.service",
              "fgbears-youtube-relay.service",
              "fgbears-youtube-router.service",
          ]
          print("SERVICE_STATES")
          for u in units:
              print(u,state(u),pid(u))

          assert state("fgbears-live.service")=="active"
          assert state("fgbears-rumble-relay.service")=="active"
          assert state("fgbears-youtube-lovable-compositor.service")=="active"
          assert state("fgbears-youtube-lovable-routing.service")=="active"
          assert state("fgbears-youtube-relay.service")!="active"
          assert state("fgbears-youtube-router.service")!="active"

          master=pid("fgbears-live.service")
          rumble=pid("fgbears-rumble-relay.service")
          comp=pid("fgbears-youtube-lovable-compositor.service")
          assert connected(rumble,1935),"Rumble socket missing"
          assert connected(comp,443),"YouTube compositor socket missing"

          with urllib.request.urlopen("http://127.0.0.1:8791/healthz",timeout=3) as r:
              h=json.loads(r.read().decode())
          assert h.get("canvas")==[640,360],h
          assert h.get("sourceMaskRegion")=={"x":462,"y":104,"width":798,"height":470},h
          assert h.get("maskRegion")=={"x":231,"y":52,"width":399,"height":235},h
          assert h.get("frameSize")==[399,235],h
          assert h.get("executionScaling")=="proportional_downstream",h
          print("EXACT_BOX_HEALTH=PASS",json.dumps(h,sort_keys=True))

          cmd=sh(f"tr '\\0' ' ' </proc/{comp}/cmdline")
          assert "scale=640:360:flags=fast_bilinear" in cmd,cmd
          assert "overlay=231:52:format=auto:shortest=1" in cmd,cmd
          assert "aresample=44100:async=1:first_pts=0" in cmd,cmd
          print("COMPOSITOR_COMMAND=PASS")

          speed=sh("awk -F= '$1==\"speed\"{v=$2} END{gsub(/x/,\"\",v);print v}' /srv/fgbears-live/logs/ffmpeg-progress.log")
          cpu=float(sh(f"ps -p {comp} -o %cpu= | tr -d ' '"))
          load=sh("cut -d' ' -f1-3 /proc/loadavg")
          print(f"RESOURCE master_speed={speed or 'unknown'}x compositor_cpu={cpu}% load={load}")
          if speed:
              assert float(speed)>=0.985,speed
          assert cpu<=40,cpu

          print("FFMPEG_PROCESSES")
          print(sh("ps -eo pid,ppid,%cpu,%mem,etime,comm,args --sort=-%cpu | grep '[f]fmpeg' | head -20"))
          print("TOP_CPU")
          print(sh("ps -eo pid,ppid,%cpu,%mem,etime,comm,args --sort=-%cpu | head -16"))
          print("LOAD_AUDIT=PASS")
          PY
