name: Enforce Single Exact-Box YouTube Sender

on:
  push:
    branches:
      - lovable-routing-bridge-20260902
    paths:
      - '.github/workflows/activate-youtube-dynamic-protection-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Remove duplicate YouTube relay only after exact-box sender is verified
        shell: bash
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          COMP=fgbears-youtube-lovable-compositor.service
          ROUTING=fgbears-youtube-lovable-routing.service
          LEGACY=fgbears-youtube-relay.service
          ROUTER=fgbears-youtube-router.service

          active(){ systemctl is-active --quiet "$1"; }
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          has_port(){ local p="$1" q="$2"; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | awk -v p="pid=$p" -v q=":$q" 'index($0,p)&&index($0,q){ok=1} END{exit(ok?0:1)}'; }
          speed(){ awk -F= '$1=="speed"{v=$2} END{gsub(/x/,"",v); if(v!="") print v+0}' /srv/fgbears-live/logs/ffmpeg-progress.log 2>/dev/null || true; }

          active "$MASTER"
          active "$RUMBLE"
          active "$COMP"
          active "$ROUTING"
          MASTER0=$(pid "$MASTER")
          RUMBLE0=$(pid "$RUMBLE")
          COMP0=$(pid "$COMP")
          LEGACY0=$(pid "$LEGACY")
          ROUTER0=$(pid "$ROUTER")
          has_port "$RUMBLE0" 1935
          has_port "$COMP0" 443

          health=$(curl -fsS --max-time 3 http://127.0.0.1:8791/healthz)
          printf '%s' "$health" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True;assert p.get("canvas")==[640,360],p;assert p.get("sourceMaskRegion")=={"x":462,"y":104,"width":798,"height":470},p;assert p.get("maskRegion")=={"x":231,"y":52,"width":399,"height":235},p;assert p.get("frameSize")==[399,235],p;assert p.get("executionScaling")=="proportional_downstream",p'
          echo "EXACT_BOX_OWNER_VERIFIED=PASS compositor=$COMP0"
          echo "BEFORE legacy=$LEGACY0 router=$ROUTER0 master=$MASTER0 rumble=$RUMBLE0"

          # Only the duplicate YouTube paths are touched.
          systemctl stop "$LEGACY" 2>/dev/null || true
          systemctl disable "$LEGACY" >/dev/null 2>&1 || true
          systemctl stop "$ROUTER" 2>/dev/null || true
          systemctl disable "$ROUTER" >/dev/null 2>&1 || true
          systemctl mask "$LEGACY" "$ROUTER" >/dev/null 2>&1 || true

          sleep 5
          active "$COMP"
          active "$ROUTING"
          ! active "$LEGACY"
          ! active "$ROUTER"
          [[ "$(pid "$MASTER")" == "$MASTER0" ]]
          [[ "$(pid "$RUMBLE")" == "$RUMBLE0" ]]
          [[ "$(pid "$COMP")" == "$COMP0" ]]
          has_port "$RUMBLE0" 1935
          has_port "$COMP0" 443

          CPU=$(ps -p "$COMP0" -o %cpu= | tr -d ' ')
          SPEED=$(speed)
          LOAD=$(cut -d' ' -f1-3 /proc/loadavg)
          python3 -c 'import sys;c=float(sys.argv[1]);assert c<=40.0,c' "$CPU"
          if [[ -n "$SPEED" ]]; then python3 -c 'import sys;s=float(sys.argv[1]);assert s>=0.985,s' "$SPEED"; fi
          echo "SINGLE_YOUTUBE_SENDER=PASS compositor=$COMP0 legacy=$(pid "$LEGACY") router=$(pid "$ROUTER")"
          echo "MASTER_RUMBLE_UNTOUCHED=PASS master=$MASTER0 rumble=$RUMBLE0"
          echo "RESOURCE compositor_cpu=${CPU}% master_speed=${SPEED:-unknown}x load=$LOAD"
          REMOTE
