name: Repair FGB Audio Source Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-fgb-audio-source-validation.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore non-destructive audio source defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'services/fgbears-live/bin/start-stream.sh': (
                  'PODCAST_AUDIO_FILTER:=loudnorm=I=-14:LRA=11:TP=-1.5,aresample=48000:first_pts=0',
                  'PODCAST_AUDIO_FILTER:=volume=-2dB,aresample=48000:first_pts=0',
              ),
              'services/fgbears-live/config/stream.env.example': (
                  'PODCAST_AUDIO_FILTER=loudnorm=I=-14:LRA=11:TP=-1.5,aresample=48000:first_pts=0',
                  'PODCAST_AUDIO_FILTER=volume=-2dB,aresample=48000:first_pts=0',
              ),
              'services/fgbears-live/tests/test-scripts.sh': (
                  "grep -Fq 'PODCAST_AUDIO_FILTER:=aresample=48000:first_pts=0' \"$ROOT/bin/start-stream.sh\"",
                  "grep -Fq 'PODCAST_AUDIO_FILTER:=volume=-2dB,aresample=48000:first_pts=0' \"$ROOT/bin/start-stream.sh\"",
              ),
          }
          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected audio source text missing from {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          bash -n services/fgbears-live/bin/start-stream.sh
          bash -n services/fgbears-live/tests/test-scripts.sh
          if grep -R -nE 'PODCAST_AUDIO_FILTER=.*(loudnorm=|acompressor=|highpass=|async=1)' services/fgbears-live/bin/start-stream.sh services/fgbears-live/config/stream.env.example; then
            echo 'Destructive live audio DSP remains in production defaults.' >&2
            exit 1
          fi
          git diff --check
          git rm -f .github/workflows/repair-fgb-audio-source-validation.yml
      - name: Commit source repair
        run: |
          git config user.name 'FGB Production Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Restore safe FGB live audio defaults'
          git push origin HEAD:main
