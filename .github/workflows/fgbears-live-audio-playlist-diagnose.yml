name: Diagnose FGBears Live Audio and Playlist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-live-audio-playlist-diagnose.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Test Episode 32 with current PO-token provider
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --quiet --upgrade yt-dlp bgutil-ytdlp-pot-provider
          rm -rf /tmp/bgutil-ytdlp-pot-provider
          git clone --quiet --depth 1 --branch 1.3.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil-ytdlp-pot-provider
          pushd /tmp/bgutil-ytdlp-pot-provider/server >/dev/null
          npm ci --silent
          npx tsc
          node build/main.js >/tmp/bgutil-provider.log 2>&1 &
          provider_pid=$!
          popd >/dev/null
          trap 'kill "$provider_pid" 2>/dev/null || true; cat /tmp/bgutil-provider.log || true' EXIT
          for _ in $(seq 1 30); do
            if ss -ltn | grep -q ':4416 '; then
              break
            fi
            sleep 1
          done
          ss -ltn | grep -q ':4416 '
          python3 -m yt_dlp -v \
            --no-playlist \
            --simulate \
            --js-runtimes node \
            --extractor-args 'youtube:player_client=mweb' \
            --print '%(id)s|%(title)s' \
            'https://www.youtube.com/watch?v=PUsi9hNXnhw'
          echo 'EPISODE_32_PO_TOKEN_ACCESS=READY'

      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Inspect normalization progress
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MEDIA=/srv/fgbears-live/media
          echo "LIVE=$(systemctl is-active fgbears-live.service || true)"
          echo "RELAY=$(systemctl is-active fgbears-youtube-relay.service || true)"
          echo "PLAYLIST_EPISODES=$(grep -c '^file .*FGBears-Episode-' /srv/fgbears-live/playlist.ffconcat || true)"
          echo "PROFILE_COUNT=$(find "$MEDIA" -maxdepth 1 -type f -name 'FGBears-Episode-*.mp4.audio-profile.json' | wc -l | tr -d ' ')"
          echo '--- PROFILE EPISODES ---'
          find "$MEDIA" -maxdepth 1 -type f -name 'FGBears-Episode-*.mp4.audio-profile.json' -printf '%f\n' | sort -V
          echo '--- NORMALIZATION PROCESSES ---'
          pgrep -af 'normalize|loudnorm|FGBears-Episode' || true
          echo '--- EPISODE 32 STORED SOURCE ---'
          if [[ -s /home/ubuntu/fgbears-upload/FGBears-Episode-32.mp4 ]]; then
            echo 'EPISODE_32_SOURCE=YES'
          else
            echo 'EPISODE_32_SOURCE=NO'
          fi
          REMOTE