name: Diagnose FGBears Live Audio and Playlist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fgbears-live-audio-playlist-diagnose.yml'

permissions:
  contents: read

env:
  ORACLE_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Oracle SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Inspect normalization progress and Episode 32 access
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MEDIA=/srv/fgbears-live/media
          echo "LIVE=$(systemctl is-active fgbears-live.service || true)"
          echo "RELAY=$(systemctl is-active fgbears-youtube-relay.service || true)"
          echo "PLAYLIST_EPISODES=$(grep -c '^file .*FGBears-Episode-' /srv/fgbears-live/playlist.ffconcat || true)"
          echo "PROFILE_COUNT=$(find "$MEDIA" -maxdepth 1 -type f -name 'FGBears-Episode-*.mp4.audio-profile.json' | wc -l | tr -d ' ')"
          echo '--- PROFILE EPISODES ---'
          find "$MEDIA" -maxdepth 1 -type f -name 'FGBears-Episode-*.mp4.audio-profile.json' -printf '%f\n' | sort -V
          echo '--- NORMALIZATION PROCESSES ---'
          pgrep -af 'normalize|loudnorm|FGBears-Episode' || true
          echo '--- EPISODE 32 STORED SOURCE ---'
          if [[ -s /home/ubuntu/fgbears-upload/FGBears-Episode-32.mp4 ]]; then
            echo 'EPISODE_32_SOURCE=YES'
          else
            echo 'EPISODE_32_SOURCE=NO'
          fi

          echo '--- EPISODE 32 YOUTUBE RESOLUTION PROBE ---'
          tool=/tmp/yt-dlp-fgb-probe
          curl -fsSL --retry 2 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o "$tool"
          chmod +x "$tool"
          access=BLOCKED
          for client in web_embedded web_safari tv ios android_vr; do
            echo "TRY_CLIENT=$client"
            if "$tool" --no-playlist --simulate --js-runtimes node --extractor-args "youtube:player_client=${client}" --print '%(id)s|%(title)s' 'https://www.youtube.com/watch?v=PUsi9hNXnhw'; then
              access=READY
              break
            fi
          done
          echo "EPISODE_32_YOUTUBE_ACCESS=$access"
          rm -f "$tool"
          REMOTE