name: Restore Current YouTube Exact-Box Primary

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESTORE to perform the YouTube-only recovery'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fgbears-production-overlay-maintenance
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Require explicit recovery confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = 'RESTORE'

      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Validate recovery source files
        run: |
          set -Eeuo pipefail
          bash -n services/fgbears-live/bin/youtube-lovable-compositor.sh
          bash -n services/fgbears-live/bin/youtube-audio-watchdog-owner-aware.sh
          bash -n services/fgbears-live/bin/youtube-audio-watchdog.sh
          bash -n services/fgbears-live/bin/youtube-relay.sh
          python3 -m py_compile services/fgbears-live/bin/youtube-question-mask.py
          grep -Fq 'YOUTUBE_AUDIO_SAMPLE_RATE=48000' services/fgbears-live/bin/youtube-lovable-compositor.sh
          grep -Fq 'overlay=${MASK_X}:${MASK_Y}:format=auto:shortest=1' services/fgbears-live/bin/youtube-lovable-compositor.sh
          grep -Fq 'ExecStart=/opt/fgbears-live/bin/youtube-lovable-compositor.sh' services/fgbears-live/systemd/fgbears-youtube-lovable-compositor.service

      - name: Package only YouTube recovery files
        run: |
          set -Eeuo pipefail
          tar -czf /tmp/fgb-youtube-exact-box-restore.tgz \
            services/fgbears-live/bin/youtube-lovable-compositor.sh \
            services/fgbears-live/bin/youtube-question-mask.py \
            services/fgbears-live/bin/youtube-audio-watchdog-owner-aware.sh \
            services/fgbears-live/bin/youtube-audio-watchdog.sh \
            services/fgbears-live/bin/youtube-relay.sh \
            services/fgbears-live/tools/build-youtube-rumble-trivia-card.py \
            services/fgbears-live/systemd/fgbears-youtube-lovable-routing.service \
            services/fgbears-live/systemd/fgbears-youtube-lovable-compositor.service \
            services/fgbears-live/systemd/fgbears-youtube-relay.service \
            services/fgbears-live/systemd/fgbears-youtube-audio-watchdog.service \
            services/fgbears-live/systemd/fgbears-youtube-audio-watchdog.timer

      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          scp -i ~/.ssh/oracle_key /tmp/fgb-youtube-exact-box-restore.tgz "$target:/tmp/fgb-youtube-exact-box-restore.tgz"

      - name: Restore YouTube exact-box ownership without touching master or Rumble
        run: |
          set -Eeuo pipefail
          target="${ORACLE_USER:-ubuntu}@$ORACLE_HOST"
          ssh -i ~/.ssh/oracle_key "$target" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          MASTER=fgbears-live.service
          RUMBLE=fgbears-rumble-relay.service
          ROUTING=fgbears-youtube-lovable-routing.service
          COMP=fgbears-youtube-lovable-compositor.service
          LEGACY=fgbears-youtube-relay.service
          WATCHDOG=fgbears-youtube-audio-watchdog.timer
          stage=/tmp/fgb-youtube-exact-box-restore
          backup=/srv/fgbears-live/runtime/youtube-restore-backup-$(date -u +%Y%m%dT%H%M%SZ)

          active(){ systemctl is-active --quiet "$1"; }
          pid(){ systemctl show -p MainPID --value "$1" 2>/dev/null || echo 0; }
          socket443(){ local p=$1; [[ "$p" =~ ^[1-9][0-9]*$ ]] && ss -ntpH state established 2>/dev/null | grep -F "pid=$p" | grep -Eq ':[4]43([[:space:]]|$)'; }

          active "$MASTER"
          active "$RUMBLE"
          MASTER0=$(pid "$MASTER")
          RUMBLE0=$(pid "$RUMBLE")
          [[ "$MASTER0" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUMBLE0" =~ ^[1-9][0-9]*$ ]]

          mkdir -p "$backup"
          for path in \
            /opt/fgbears-live/bin/youtube-lovable-compositor.sh \
            /opt/fgbears-live/bin/youtube-question-mask.py \
            /opt/fgbears-live/bin/youtube-audio-watchdog-owner-aware.sh \
            /opt/fgbears-live/bin/youtube-audio-watchdog.sh \
            /opt/fgbears-live/bin/youtube-relay.sh \
            /opt/fgbears-live/tools/build-youtube-rumble-trivia-card.py \
            /etc/systemd/system/fgbears-youtube-lovable-routing.service \
            /etc/systemd/system/fgbears-youtube-lovable-compositor.service \
            /etc/systemd/system/fgbears-youtube-relay.service \
            /etc/systemd/system/fgbears-youtube-audio-watchdog.service \
            /etc/systemd/system/fgbears-youtube-audio-watchdog.timer \
            /usr/local/bin/fgbears-youtube-relay \
            /usr/local/bin/fgbears-youtube-audio-watchdog \
            /usr/local/libexec/fgbears-youtube-audio-watchdog-legacy; do
            [[ -e "$path" ]] || { echo "Required rollback source missing: $path" >&2; exit 1; }
          done
          tar -czf "$backup/state.tgz" \
            /opt/fgbears-live/bin/youtube-lovable-compositor.sh \
            /opt/fgbears-live/bin/youtube-question-mask.py \
            /opt/fgbears-live/bin/youtube-audio-watchdog-owner-aware.sh \
            /opt/fgbears-live/bin/youtube-audio-watchdog.sh \
            /opt/fgbears-live/bin/youtube-relay.sh \
            /opt/fgbears-live/tools/build-youtube-rumble-trivia-card.py \
            /etc/systemd/system/fgbears-youtube-lovable-routing.service \
            /etc/systemd/system/fgbears-youtube-lovable-compositor.service \
            /etc/systemd/system/fgbears-youtube-relay.service \
            /etc/systemd/system/fgbears-youtube-audio-watchdog.service \
            /etc/systemd/system/fgbears-youtube-audio-watchdog.timer \
            /usr/local/bin/fgbears-youtube-relay \
            /usr/local/bin/fgbears-youtube-audio-watchdog \
            /usr/local/libexec/fgbears-youtube-audio-watchdog-legacy

          rollback() {
            rc=$?
            trap - ERR
            echo "YOUTUBE_RESTORE_ROLLBACK=BEGIN rc=$rc" >&2
            systemctl stop "$COMP" "$ROUTING" 2>/dev/null || true
            tar -xzf "$backup/state.tgz" -C /
            systemctl daemon-reload || true
            systemctl enable "$ROUTING" "$COMP" >/dev/null 2>&1 || true
            systemctl disable --now "$LEGACY" >/dev/null 2>&1 || true
            systemctl restart "$ROUTING" || true
            systemctl restart "$COMP" || true
            sleep 4
            old_pid=$(pid "$COMP")
            if ! active "$COMP" || ! socket443 "$old_pid"; then
              systemctl stop "$COMP" 2>/dev/null || true
              systemctl enable "$LEGACY" >/dev/null 2>&1 || true
              systemctl restart "$LEGACY" || true
              echo 'YOUTUBE_RESTORE_ROLLBACK_OWNER=LEGACY_FALLBACK' >&2
            else
              echo 'YOUTUBE_RESTORE_ROLLBACK_OWNER=PREVIOUS_EXACT_BOX' >&2
            fi
            [[ "$(pid "$MASTER")" == "$MASTER0" ]] || echo 'SAFETY_WARNING=MASTER_PID_CHANGED_OUTSIDE_RESTORE' >&2
            [[ "$(pid "$RUMBLE")" == "$RUMBLE0" ]] || echo 'SAFETY_WARNING=RUMBLE_PID_CHANGED_OUTSIDE_RESTORE' >&2
            exit "$rc"
          }
          trap rollback ERR

          rm -rf "$stage"
          mkdir -p "$stage"
          tar -xzf /tmp/fgb-youtube-exact-box-restore.tgz -C "$stage"
          src="$stage/services/fgbears-live"

          install -m 0755 "$src/bin/youtube-lovable-compositor.sh" /opt/fgbears-live/bin/youtube-lovable-compositor.sh
          install -m 0755 "$src/bin/youtube-question-mask.py" /opt/fgbears-live/bin/youtube-question-mask.py
          install -m 0755 "$src/bin/youtube-audio-watchdog-owner-aware.sh" /opt/fgbears-live/bin/youtube-audio-watchdog-owner-aware.sh
          install -m 0755 "$src/bin/youtube-audio-watchdog.sh" /opt/fgbears-live/bin/youtube-audio-watchdog.sh
          install -m 0755 "$src/bin/youtube-relay.sh" /opt/fgbears-live/bin/youtube-relay.sh
          install -m 0755 "$src/tools/build-youtube-rumble-trivia-card.py" /opt/fgbears-live/tools/build-youtube-rumble-trivia-card.py
          install -m 0755 "$src/bin/youtube-relay.sh" /usr/local/bin/fgbears-youtube-relay
          install -m 0755 "$src/bin/youtube-audio-watchdog-owner-aware.sh" /usr/local/bin/fgbears-youtube-audio-watchdog
          install -m 0755 "$src/bin/youtube-audio-watchdog.sh" /usr/local/libexec/fgbears-youtube-audio-watchdog-legacy
          install -m 0644 "$src/systemd/fgbears-youtube-lovable-routing.service" /etc/systemd/system/fgbears-youtube-lovable-routing.service
          install -m 0644 "$src/systemd/fgbears-youtube-lovable-compositor.service" /etc/systemd/system/fgbears-youtube-lovable-compositor.service
          install -m 0644 "$src/systemd/fgbears-youtube-relay.service" /etc/systemd/system/fgbears-youtube-relay.service
          install -m 0644 "$src/systemd/fgbears-youtube-audio-watchdog.service" /etc/systemd/system/fgbears-youtube-audio-watchdog.service
          install -m 0644 "$src/systemd/fgbears-youtube-audio-watchdog.timer" /etc/systemd/system/fgbears-youtube-audio-watchdog.timer
          systemctl daemon-reload

          systemctl stop "$COMP" 2>/dev/null || true
          systemctl disable --now "$LEGACY" >/dev/null 2>&1 || true
          systemctl enable "$ROUTING" "$COMP" >/dev/null
          systemctl restart "$ROUTING"

          for _ in $(seq 1 30); do
            health=$(curl -fsS --max-time 2 http://127.0.0.1:8791/healthz 2>/dev/null || true)
            if printf '%s' "$health" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True;assert p.get("sourceCanvas")==[1280,720];assert p.get("canvas")==[640,360];assert p.get("sourceMaskRegion")=={"x":462,"y":104,"width":798,"height":470};assert p.get("maskRegion")=={"x":231,"y":52,"width":399,"height":235};assert p.get("executionScaling")=="proportional_downstream"' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          printf '%s' "$health" | python3 -c 'import json,sys;p=json.load(sys.stdin);assert p.get("ok") is True;assert p.get("maskRegion")=={"x":231,"y":52,"width":399,"height":235}'

          systemctl reset-failed "$COMP" || true
          systemctl restart "$COMP"
          for _ in $(seq 1 40); do
            CPID=$(pid "$COMP")
            if active "$COMP" && socket443 "$CPID"; then break; fi
            sleep 1
          done
          CPID=$(pid "$COMP")
          active "$COMP"
          socket443 "$CPID"

          SEG=''
          for _ in $(seq 1 20); do
            SEG=$(find /run/fgbears-youtube-lovable-compositor -maxdepth 1 -type f -name 'monitor-*.ts' -printf '%T@ %p\n' 2>/dev/null | sort -nr | sed -n '2{s/^[^ ]* //;p;q;}' || true)
            [[ -n "$SEG" && -s "$SEG" ]] && break
            sleep 1
          done
          [[ -n "$SEG" && -s "$SEG" ]]
          ffprobe -v fatal -show_entries stream=codec_type,codec_name,sample_rate,channels,width,height,r_frame_rate -of json "$SEG" \
            | python3 -c 'import json,sys;p=json.load(sys.stdin);s=p.get("streams",[]);a=next(x for x in s if x.get("codec_type")=="audio");v=next(x for x in s if x.get("codec_type")=="video");assert a.get("codec_name")=="aac";assert str(a.get("sample_rate"))=="48000";assert int(a.get("channels") or 0)==2;assert (int(v.get("width",0)),int(v.get("height",0)))==(640,360);assert v.get("r_frame_rate") in {"30/1","60/2"}'

          [[ "$(pid "$MASTER")" == "$MASTER0" ]]
          [[ "$(pid "$RUMBLE")" == "$RUMBLE0" ]]
          active "$RUMBLE"
          ! active "$LEGACY"
          systemctl enable --now "$WATCHDOG" >/dev/null

          trap - ERR
          rm -rf "$stage" /tmp/fgb-youtube-exact-box-restore.tgz
          echo "YOUTUBE_EXACT_BOX_RESTORE=PASS master=$MASTER0 rumble=$RUMBLE0 youtube=$CPID audio=48k"
          REMOTE
