services:
  youtube:
    image: transport-ovh-youtube
    build: .
    restart: unless-stopped
    shm_size: "1gb"
    env_file: .env
    environment:
      OUTPUT: youtube
      DESTINATIONS: ${YOUTUBE_DESTINATIONS}
      FGB_ARCHIVE_DIR: /archive
    volumes:
      - /srv/fgb-archive:/archive

  archive_uploader:
    image: transport-ovh-youtube
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FGB_ARCHIVE_DIR: /archive
      FGB_ARCHIVE_CONTROL_URL: https://epiccontentcreatorgrants.org/api/public/fgbears/archive
      FGB_EXPECTED_YOUTUBE_CHANNEL_ID: UC3qyMq_KCg7aF08x7LZyVtg
    volumes:
      - /srv/fgb-archive:/archive
      - ./archive-uploader.py:/opt/transport/archive-uploader.py:ro
    command: ["python3", "./archive-uploader.py"]
    healthcheck:
      disable: true

  rumble_bridge:
    profiles: ["fallback"]
    build: .
    restart: unless-stopped
    shm_size: "1gb"
    env_file: .env
    environment:
      OUTPUT: rumble_bridge
