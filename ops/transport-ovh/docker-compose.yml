services:
  youtube:
    image: transport-ovh-youtube
    build: .
    restart: unless-stopped
    shm_size: "1gb"
    env_file: .env
    environment:
      OUTPUT: youtube
      DESTINATIONS: ${YOUTUBE_DESTINATIONS}
      FGB_ARCHIVE_DIR: /archive
    volumes:
      - /srv/fgb-archive:/archive

  archive_uploader:
    image: transport-ovh-youtube
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FGB_ARCHIVE_DIR: /archive
      FGB_ARCHIVE_CONTROL_URL: https://epiccontentcreatorgrants.org/api/public/fgbears/archive
    volumes:
      - /srv/fgb-archive:/archive
      - ./archive-token-wrapper.py:/opt/transport/archive-token-wrapper.py:ro
    command: ["python3", "./archive-token-wrapper.py"]
    healthcheck:
      disable: true

  rumble_bridge:
    profiles: ["fallback"]
    build: .
    restart: unless-stopped
    shm_size: "1gb"
    env_file: .env
    environment:
      OUTPUT: rumble_bridge
