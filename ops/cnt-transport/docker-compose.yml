name: epic-cnt-transport
services:
  cnt:
    build:
      context: .
      dockerfile: Dockerfile
    image: epic-cnt-streamer:local
    container_name: epic-cnt-capture
    restart: unless-stopped
    shm_size: "1gb"
    env_file: .env.cnt
    security_opt: [no-new-privileges:true]
    networks: [cnt-only]
networks:
  cnt-only:
    internal: false
